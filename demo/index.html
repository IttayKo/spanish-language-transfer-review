f ir is yours, the same structure runs across every person: voy, vas, va, vamos, van, then a, then the 'to' form. A little word can sit at the very front of the whole thing or be stuck onto the end of the infinitive - Nos vas a ver and Vas a vernos are both fine.","examples":["Vamos a verla. - We're going to see her.","¿Vas a vernos pronto? / ¿Nos vas a ver pronto? - Are you going to see us soon?"],"track":20}],"drills":[{"id":"t20-01","type":"word","prompt":"soon","answer":"Pronto","steps":["like English 'get here pronto': pronto"],"rules":["t20__future-by-context"],"track":20,"source":"track"},{"id":"t20-02","type":"word","prompt":"he sees","answer":"Ve","steps":["ver behaves like a regular -er verb here: ve"],"rules":["t20__ver-conjugation"],"track":20,"source":"track"},{"id":"t20-03","type":"word","prompt":"I see","answer":"Veo","steps":["irregular - v-e-o, not the expected shorter vo: veo"],"rules":["t20__ver-conjugation"],"track":20,"source":"track"},{"id":"t20-04","type":"sentence","prompt":"I'm seeing her later.","answer":"La veo más tarde.","steps":["her: la, jumping to the front (from earlier)","I see: veo","later: más tarde"],"rules":["t20__ver-conjugation"],"track":20,"source":"track"},{"id":"t20-05","type":"sentence","prompt":"We are seeing her soon.","answer":"La vemos pronto.","steps":["her: la, at the front (from earlier)","we see: vemos, not 'venemos' - no guessing","soon: pronto"],"rules":["t20__ver-conjugation","t20__future-by-context"],"track":20,"source":"track"},{"id":"t20-06","type":"sentence","prompt":"Why aren't you seeing them soon? (informal, female group)","answer":"¿Por qué no las ves pronto?","steps":["why: por qué","no at the front","them (female): las, at the front (from earlier)","you see: ves","soon: pronto"],"rules":["t20__ver-conjugation"],"track":20,"source":"track"},{"id":"t20-07","type":"sentence","prompt":"We're going to see her.","answer":"Vamos a verla.","steps":["we're going to: vamos a","see her: verla, with la stuck onto the infinitive"],"rules":["t20__ir-a-future"],"track":20,"source":"track"},{"id":"t20-08","type":"sentence","prompt":"Why aren't you going to see us soon? (informal)","answer":"¿Por qué no vas a vernos pronto?","steps":["why: por qué","no at the front","you're going to: vas a","see us: vernos, or nos could go up front instead","soon: pronto"],"rules":["t20__ir-a-future"],"track":20,"source":"track","note":"Also fine as ¿Por qué no nos vas a ver pronto?"},{"id":"t20-09","type":"sentence","prompt":"Let's speak next week.","answer":"Hablamos la semana que viene.","steps":["let's speak: hablamos, the we-form used for a suggestion","the week: la semana","that comes: que viene"],"rules":["t20__future-by-context"],"track":20,"source":"track"},{"id":"t20-10","type":"sentence","prompt":"We will see each other next week.","answer":"Nos vemos la semana que viene.","steps":["we see ourselves/each other: nos vemos","next week: la semana que viene"],"rules":["t20__future-by-context","t20__ver-conjugation"],"track":20,"source":"track","note":"Nos vemos on its own is a common way to say goodbye in Spanish."},{"id":"t20-x01","type":"word","prompt":"you (informal) see","answer":"Ves","steps":["from the ver pattern: ves"],"rules":["t20__ver-conjugation"],"track":20,"source":"extension","difficulty":1},{"id":"t20-x02","type":"sentence","prompt":"I'm seeing him tomorrow.","answer":"Lo veo mañana.","steps":["him: lo, at the front","I see: veo","tomorrow: mañana"],"rules":["t20__ver-conjugation","t20__future-by-context"],"track":20,"source":"extension","difficulty":1},{"id":"t20-x03","type":"sentence","prompt":"I don't want to see her tonight, I want to see her tomorrow.","answer":"No quiero verla esta noche, quiero verla mañana.","steps":["I don't want to see her: no quiero verla","tonight: esta noche","I want to see her: quiero verla","tomorrow: mañana"],"rules":["t20__ver-conjugation","t20__future-by-context"],"track":20,"source":"extension","difficulty":3}],"blurb":"Using present tense with future context and the phrase nos vemos","sectionIndex":2},{"id":"t21","label":"Track 21","tracks":[21],"rules":[{"id":"t21__haber-perfect","family":"haber-perfect","title":"he/has/ha/hemos/han for have (done something)","explanation":"Haber (silent h) is the have that builds I have done/eaten/gone - not tener, which is only for possession and have-to. Its forms come from the two vowel sounds inside haber, a and e: he (I have) and hemos (we have) share the e; ha (he/she/it/you formal have), has (you informal have), and han (they/you plural have) share the a.","examples":["he - I have","hemos - we have","ha - he/she has","has - you have","han - they have"],"track":21},{"id":"t21__ado-past-participle","family":"ado-past-participle","title":"-ar verbs lose -ar and take -ado","explanation":"To build the 'done' part of I have done something for an -ar verb, drop the -ar ending and add -ado. This -ado form always follows a haber form (he, has, ha, hemos, han) to make the have-done past.","examples":["hablar -> hablado - he hablado, I have spoken","anticipar -> anticipado","celebrar -> celebrado"],"track":21},{"id":"t21__e-split","family":"e-split","title":"The same e/o split, outside verbs","explanation":"The split you keep meeting in verbs - quiero, puedo - is not a verb thing, it's a Spanish thing. Plenty of ordinary words split the same vowel, and a Latin cousin that kept the plain e or o gives the game away: Italian sempre next to siempre, bene next to bien, French bon next to bueno. Noticing that is what makes the new word stick without memorizing it.","examples":["sempre (Italian) -> siempre","bene (Italian) -> bien","bon (French) -> bueno","tempo -> tiempo, the same split you met in verbs"],"track":19}],"drills":[{"id":"t21-01","type":"word","prompt":"I have (done something)","answer":"He","steps":["from the e inside haber: he"],"rules":["t21__haber-perfect"],"track":21,"source":"track"},{"id":"t21-02","type":"word","prompt":"we have (done something)","answer":"Hemos","steps":["he is connected to we, the plural of I: hemos"],"rules":["t21__haber-perfect"],"track":21,"source":"track"},{"id":"t21-03","type":"word","prompt":"she/it/you (formal) have/has (done something)","answer":"Ha","steps":["from the other vowel inside haber: ha"],"rules":["t21__haber-perfect"],"track":21,"source":"track"},{"id":"t21-04","type":"word","prompt":"they have, or you all have (done something)","answer":"Han","steps":["from ha, add -n: han"],"rules":["t21__haber-perfect"],"track":21,"source":"track"},{"id":"t21-05","type":"word","prompt":"you (informal) have (done something)","answer":"Has","steps":["from ha, add -s: has"],"rules":["t21__haber-perfect"],"track":21,"source":"track"},{"id":"t21-06","type":"word","prompt":"spoken","answer":"Hablado","steps":["hablar loses -ar and takes -ado: hablado"],"rules":["t21__ado-past-participle"],"track":21,"source":"track"},{"id":"t21-07","type":"sentence","prompt":"I have spoken.","answer":"He hablado.","steps":["I have: he","spoken: hablado"],"rules":["t21__haber-perfect","t21__ado-past-participle"],"track":21,"source":"track"},{"id":"t21-08","type":"sentence","prompt":"We have anticipated it for a long time.","answer":"Lo hemos anticipado por mucho tiempo.","steps":["it: lo, jumping to the front (from earlier)","we have: hemos","anticipated: anticipado, from anticipar","for: por","a lot, much: mucho","time: tiempo, from tempo with the e split"],"rules":["t21__haber-perfect","t21__ado-past-participle","t21__e-split"],"track":21,"source":"track"},{"id":"t21-09","type":"sentence","prompt":"Where have you celebrated it? (informal)","answer":"¿Dónde lo has celebrado?","steps":["where: dónde","it: lo, jumping to the front (from earlier)","you have: has","celebrated: celebrado, from celebrar"],"rules":["t21__haber-perfect","t21__ado-past-participle"],"track":21,"source":"track"},{"id":"t21-x01","type":"word","prompt":"taken","answer":"Tomado","steps":["tomar loses -ar and takes -ado: tomado"],"rules":["t21__ado-past-participle"],"track":21,"source":"extension","difficulty":1},{"id":"t21-x02","type":"sentence","prompt":"I have taken it.","answer":"Lo he tomado.","steps":["it: lo, at the front","I have: he","taken: tomado"],"rules":["t21__haber-perfect","t21__ado-past-participle"],"track":21,"source":"extension","difficulty":1},{"id":"t21-x03","type":"sentence","prompt":"Haven't you drunk alcohol? (informal)","answer":"¿No has tomado alcohol?","steps":["no at the front","you have: has","drunk/taken: tomado","alcohol: alcohol"],"rules":["t21__haber-perfect","t21__ado-past-participle"],"track":21,"source":"extension","difficulty":2},{"id":"t21-x04","type":"sentence","prompt":"We haven't spoken tonight.","answer":"No hemos hablado esta noche.","steps":["no at the front","we have: hemos","spoken: hablado","tonight: esta noche"],"rules":["t21__haber-perfect","t21__ado-past-participle"],"track":21,"source":"extension","difficulty":2},{"id":"t21-x05","type":"sentence","prompt":"Why haven't we anticipated it for a long time?","answer":"¿Por qué no lo hemos anticipado por mucho tiempo?","steps":["why: por qué","no at the front","it: lo","we have: hemos","anticipated: anticipado","for a lot of time: por mucho tiempo"],"rules":["t21__haber-perfect","t21__ado-past-participle"],"track":21,"source":"extension","difficulty":3}],"blurb":"Present perfect with haber and forming -ado past participles","sectionIndex":3},{"id":"t22","label":"Track 22","tracks":[22],"rules":[{"id":"t22__usted-ustedes","family":"usted-ustedes","title":"usted / ustedes (the formal you)","explanation":"Usted is the formal word for you (singular), historically short for \"your honour\"; it behaves like él/ella. Its plural, you guys/formal you-all, is ustedes: since usted ends in a consonant, you don't just add -s, you add -es.","examples":["usted ve - you (formal) see","usted los ve - you (formal) see them","ustedes dan - you guys give"],"track":22},{"id":"t22__two-changed-verbs-pronoun-front","family":"two-changed-verbs-pronoun-front","title":"Pronoun jumps to the very front with two changed verbs","explanation":"The little words like lo, la, me, te normally go after a complete (\"to\") verb or before a single changed verb. He terminado is a rare case of two changed verbs stacked together, so there is only one legal spot left: before the whole pair, i.e. before he/has/ha/hemos/han.","examples":["lo he terminado - I have finished it","los he terminado - I have finished them","me he perdido - I have lost myself / I got lost"],"track":22},{"id":"t22__perfect-ado-ido","family":"perfect-ado-ido","title":"The have-done form: -ado for -ar, -ido for -er and -ir","explanation":"You already take the -ar off and put -ado on. The other half is just as flat: take the -er or -ir off and put -ido on. -er and -ir verbs behave the same here, as they do nearly everywhere outside the we-form. Then put he, has, ha, hemos or han in front of it.","examples":["terminar -> terminado -> he terminado - I have finished","perder -> perdido; vender -> vendido","venir -> venido, as in bienvenido, well-come"],"track":22},{"id":"t22__ver-conjugation","family":"ver-conjugation","title":"ver (to see): veo, ves, ve, vemos, ven","explanation":"Ver conjugates mostly like a regular -er verb: ve (he/she/it/you formal see), ves (you informal see), vemos (we see), ven (they/you plural see). The I version is a little irregular - it's veo, not the expected shorter vo, because vo alone was too short.","examples":["veo - I see","ves - you see","ve - he/she/you(formal) sees","vemos - we see","ven - they see"],"track":20},{"id":"t22__tu-vs-te","family":"tu-vs-te","title":"tú vs te (the two you's)","explanation":"Just like he/him or she/her in English, Spanish has two words for you: tú is the subject doing the action (goes with yo, él, ella), and te is the little word used as an object or reflexive (goes with lo, la, me). English doesn't mark this difference for \"you\", which is why it needs pointing out.","examples":["tú ves - you see","te veo - I see you","te has perdido - you have lost yourself"],"track":22},{"id":"t22__haber-perfect","family":"haber-perfect","title":"he/has/ha/hemos/han for have (done something)","explanation":"Haber (silent h) is the have that builds I have done/eaten/gone - not tener, which is only for possession and have-to. Its forms come from the two vowel sounds inside haber, a and e: he (I have) and hemos (we have) share the e; ha (he/she/it/you formal have), has (you informal have), and han (they/you plural have) share the a.","examples":["he - I have","hemos - we have","ha - he/she has","has - you have","han - they have"],"track":21}],"drills":[{"id":"t22-01","type":"word","prompt":"finished","answer":"Terminado","steps":["from terminar: take off the -ar","add -ado"],"rules":["t22__perfect-ado-ido"],"track":22,"source":"track"},{"id":"t22-02","type":"sentence","prompt":"I have finished.","answer":"He terminado.","steps":["I have: he","finished: terminado"],"rules":["t22__haber-perfect","t22__perfect-ado-ido"],"track":22,"source":"track"},{"id":"t22-03","type":"sentence","prompt":"I have finished it.","answer":"Lo he terminado.","steps":["it: lo","Two changed verbs together (he terminado) means lo must jump to the very front","Lo he terminado"],"rules":["t22__two-changed-verbs-pronoun-front"],"track":22,"source":"track"},{"id":"t22-04","type":"word","prompt":"lost","answer":"Perdido","steps":["perder: take off the -er","add -ido: perdido"],"rules":["t22__perfect-ado-ido"],"track":22,"source":"track"},{"id":"t22-05","type":"word","prompt":"come (as in welcome)","answer":"Venido","steps":["the same move for an -ir verb: take off -ir, add -ido","bienvenido is literally well-come, and venido is the come part"],"rules":["t22__perfect-ado-ido"],"track":22,"source":"track"},{"id":"t22-06","type":"sentence","prompt":"We have lost. (emphatic)","answer":"Nosotros hemos perdido.","steps":["we: nosotros","we have: hemos","lost: perdido"],"rules":["t22__haber-perfect","t22__perfect-ado-ido"],"track":22,"source":"track","note":"Nosotras if the whole group is female."},{"id":"t22-07","type":"sentence","prompt":"She has lost.","answer":"Ha perdido.","steps":["he/she/you(formal) have: ha","lost: perdido"],"rules":["t22__haber-perfect"],"track":22,"source":"track"},{"id":"t22-08","type":"sentence","prompt":"She has lost. (emphatic)","answer":"Ella ha perdido.","steps":["she: ella","she has: ha","lost: perdido"],"rules":["t22__haber-perfect"],"track":22,"source":"track"},{"id":"t22-09","type":"sentence","prompt":"You have lost. (informal, emphatic)","answer":"Tú has perdido.","steps":["you (informal, subject): tú","you have: has","lost: perdido"],"rules":["t22__haber-perfect","t22__tu-vs-te"],"track":22,"source":"track"},{"id":"t22-10","type":"sentence","prompt":"I see it.","answer":"Lo veo.","steps":["I see: veo (irregular I-form of ver)","it/you(formal): lo","put it together, the little word in front: lo veo"],"rules":["t22__ver-conjugation"],"track":22,"source":"track","note":"The same three words also mean I see you, speaking formally."},{"id":"t22-11","type":"sentence","prompt":"You see it. (formal)","answer":"Lo ve usted.","steps":["usted: you (formal, subject)","you(formal) see: ve","it: lo","word order is flexible: lo ve usted or usted lo ve"],"rules":["t22__usted-ustedes"],"track":22,"source":"track","note":"Also fine as Usted lo ve."},{"id":"t22-12","type":"sentence","prompt":"You see them. (formal)","answer":"Usted los ve.","steps":["usted: you (formal)","them (masculine): los","you(formal) see: ve"],"rules":["t22__usted-ustedes","t22__ver-conjugation"],"track":22,"source":"track","note":"Also fine as Los ve usted."},{"id":"t22-13","type":"sentence","prompt":"They see me.","answer":"Ellos me ven.","steps":["they (masc/mixed): ellos","me: me","they see: ven"],"rules":["t22__ver-conjugation"],"track":22,"source":"track"},{"id":"t22-x01","type":"word","prompt":"sold","answer":"Vendido","steps":["from vender: take off the -er","add -ido"],"rules":["t22__perfect-ado-ido"],"track":22,"source":"extension","difficulty":1},{"id":"t22-x02","type":"sentence","prompt":"We have finished them.","answer":"Los hemos terminado.","steps":["them: los","jumps to the front because hemos terminado are two changed verbs together","we have: hemos","finished: terminado"],"rules":["t22__haber-perfect","t22__perfect-ado-ido","t22__two-changed-verbs-pronoun-front"],"track":22,"source":"extension","difficulty":2},{"id":"t22-x03","type":"sentence","prompt":"You have lost them. (formal, masculine things)","answer":"Los ha perdido.","steps":["them: los, jumps to the front (two changed verbs)","you(formal) have: ha","lost: perdido"],"rules":["t22__haber-perfect","t22__perfect-ado-ido","t22__two-changed-verbs-pronoun-front"],"track":22,"source":"extension","difficulty":3}],"blurb":"Object pronouns lo/la/te vs subject pronouns and -ido participles","sectionIndex":3},{"id":"t23","label":"Track 23","tracks":[23],"rules":[{"id":"t23__reflexive-lost-myself","family":"reflexive-lost-myself","title":"\"Got lost\" = \"lost myself/yourself/ourselves\"","explanation":"Spanish doesn't have a separate verb for \"to get lost\"; instead you use perder (to lose) reflexively, the same way \"to get ready\" became \"to ready myself\" (me preparo). So \"I got lost\" is literally \"I have lost myself\", using me/te/nos before the have-form.","examples":["me he perdido - I got lost","te has perdido - you got lost","nos hemos perdido - we got lost"],"track":23},{"id":"t23__ma-words-masculine","family":"ma-words-masculine","title":"Words ending -ma are masculine (from Greek)","explanation":"Nouns ending in a are normally feminine, but a small set of words ending -ma are actually masculine, because they came into Spanish from Greek neuter words that looked masculine. So you say el problema, el sistema, el programa, el clima, not la.","examples":["el problema - the problem","el sistema - the system","el programa - the program","el clima - the climate"],"track":23},{"id":"t23__two-changed-verbs-pronoun-front","family":"two-changed-verbs-pronoun-front","title":"Pronoun jumps to the very front with two changed verbs","explanation":"The little words like lo, la, me, te normally go after a complete (\"to\") verb or before a single changed verb. He terminado is a rare case of two changed verbs stacked together, so there is only one legal spot left: before the whole pair, i.e. before he/has/ha/hemos/han.","examples":["lo he terminado - I have finished it","los he terminado - I have finished them","me he perdido - I have lost myself / I got lost"],"track":22},{"id":"t23__perfect-ado-ido","family":"perfect-ado-ido","title":"The have-done form: -ado for -ar, -ido for -er and -ir","explanation":"You already take the -ar off and put -ado on. The other half is just as flat: take the -er or -ir off and put -ido on. -er and -ir verbs behave the same here, as they do nearly everywhere outside the we-form. Then put he, has, ha, hemos or han in front of it.","examples":["terminar -> terminado -> he terminado - I have finished","perder -> perdido; vender -> vendido","venir -> venido, as in bienvenido, well-come"],"track":22},{"id":"t23__tu-vs-te","family":"tu-vs-te","title":"tú vs te (the two you's)","explanation":"Just like he/him or she/her in English, Spanish has two words for you: tú is the subject doing the action (goes with yo, él, ella), and te is the little word used as an object or reflexive (goes with lo, la, me). English doesn't mark this difference for \"you\", which is why it needs pointing out.","examples":["tú ves - you see","te veo - I see you","te has perdido - you have lost yourself"],"track":22},{"id":"t23__haber-perfect","family":"haber-perfect","title":"he/has/ha/hemos/han for have (done something)","explanation":"Haber (silent h) is the have that builds I have done/eaten/gone - not tener, which is only for possession and have-to. Its forms come from the two vowel sounds inside haber, a and e: he (I have) and hemos (we have) share the e; ha (he/she/it/you formal have), has (you informal have), and han (they/you plural have) share the a.","examples":["he - I have","hemos - we have","ha - he/she has","has - you have","han - they have"],"track":21}],"drills":[{"id":"t23-01","type":"sentence","prompt":"Have you understood the problem? (formal)","answer":"¿Ha entendido el problema?","steps":["you(formal) have: ha","understood: entendido (from entender)","the problem: el problema (masculine, from Greek)"],"rules":["t23__haber-perfect","t23__perfect-ado-ido","t23__ma-words-masculine"],"track":23,"source":"track"},{"id":"t23-02","type":"sentence","prompt":"The system.","answer":"El sistema.","steps":["sistema ends in -ma, so it's masculine even though it ends in a","put it together: el sistema"],"rules":["t23__ma-words-masculine"],"track":23,"source":"track"},{"id":"t23-03","type":"sentence","prompt":"Have you understood the system? (informal)","answer":"¿Has entendido el sistema?","steps":["you(informal) have: has","understood: entendido","the system: el sistema"],"rules":["t23__haber-perfect","t23__perfect-ado-ido","t23__ma-words-masculine"],"track":23,"source":"track"},{"id":"t23-04","type":"sentence","prompt":"Have you felt the aroma? (informal)","answer":"¿Has sentido el aroma?","steps":["you(informal) have: has","felt: sentido (from sentir)","the aroma: el aroma"],"rules":["t23__haber-perfect","t23__perfect-ado-ido","t23__ma-words-masculine"],"track":23,"source":"track"},{"id":"t23-06","type":"sentence","prompt":"I have got lost / I have lost myself.","answer":"Me he perdido.","steps":["\"got lost\" = \"lost myself\": me","I have: he","lost: perdido"],"rules":["t23__reflexive-lost-myself","t23__haber-perfect","t23__perfect-ado-ido"],"track":23,"source":"track"},{"id":"t23-07","type":"sentence","prompt":"I have lost myself, emphasizing.","answer":"Yo me he perdido.","steps":["I: yo","myself: me","I have: he","lost: perdido"],"rules":["t23__reflexive-lost-myself","t23__haber-perfect"],"track":23,"source":"track"},{"id":"t23-08","type":"sentence","prompt":"YOU have lost yourself. (informal, emphatic)","answer":"Tú te has perdido.","steps":["you (subject, informal): tú","yourself: te","you have: has","lost: perdido"],"rules":["t23__tu-vs-te","t23__reflexive-lost-myself","t23__haber-perfect"],"track":23,"source":"track"},{"id":"t23-09","type":"sentence","prompt":"We have lost it.","answer":"Lo hemos perdido.","steps":["it: lo, jumps to the front (two changed verbs)","we have: hemos","lost: perdido"],"rules":["t23__two-changed-verbs-pronoun-front","t23__haber-perfect"],"track":23,"source":"track"},{"id":"t23-10","type":"sentence","prompt":"We have got lost / we have lost ourselves.","answer":"Nos hemos perdido.","steps":["ourselves: nos","we have: hemos","lost: perdido"],"rules":["t23__reflexive-lost-myself","t23__haber-perfect"],"track":23,"source":"track"},{"id":"t23-11","type":"sentence","prompt":"WE have got lost, emphasizing.","answer":"Nosotros nos hemos perdido.","steps":["we: nosotros","ourselves: nos","we have: hemos","lost: perdido"],"rules":["t23__reflexive-lost-myself","t23__haber-perfect"],"track":23,"source":"track"},{"id":"t23-x01","type":"sentence","prompt":"The climate.","answer":"El clima.","steps":["clima ends in -ma, so it's masculine"],"rules":["t23__ma-words-masculine"],"track":23,"source":"extension","difficulty":1},{"id":"t23-x02","type":"sentence","prompt":"Has she understood the program?","answer":"¿Ha entendido el programa?","steps":["she has: ha","understood: entendido","the program: el programa"],"rules":["t23__haber-perfect","t23__perfect-ado-ido","t23__ma-words-masculine"],"track":23,"source":"extension","difficulty":1},{"id":"t23-x03","type":"sentence","prompt":"We have lost the program, and I have got lost.","answer":"Hemos perdido el programa, y yo me he perdido.","steps":["we have: hemos","lost: perdido","the program: el programa, masculine despite the a","and: y","I have lost myself: me he perdido, with yo in front for the contrast"],"rules":["t23__haber-perfect","t23__perfect-ado-ido","t23__ma-words-masculine","t23__reflexive-lost-myself"],"track":23,"source":"extension","difficulty":3}],"blurb":"Reviewing haber forms, masculine -ma nouns, and reflexive perdido","sectionIndex":3},{"id":"t24","label":"Track 24","tracks":[24],"rules":[{"id":"t24__dar-present","family":"dar-present","title":"dar (to give) in the present","explanation":"Dar, to give, has an irregular I-form, doy (rhymes with \"boy\"). The rest is regular off that pattern: das, da, damos, dan.","examples":["doy - I give","das - you give","da - he/she/you(formal) gives","dan - they/you guys give"],"track":24},{"id":"t24__double-object-order","family":"double-object-order","title":"Stacking two little words: person before thing","explanation":"When both a person (me, te, nos) and a thing (lo, la, los, las) are needed together, the person word comes first, then the thing word, both before the changed verb. English says \"give it to me\"; Spanish just says \"me it give\".","examples":["me lo dan - they give it to me","te lo doy - I give it to you","nos lo dan - they give it to us"],"track":24},{"id":"t24__usted-ustedes","family":"usted-ustedes","title":"usted / ustedes (the formal you)","explanation":"Usted is the formal word for you (singular), historically short for \"your honour\"; it behaves like él/ella. Its plural, you guys/formal you-all, is ustedes: since usted ends in a consonant, you don't just add -s, you add -es.","examples":["usted ve - you (formal) see","usted los ve - you (formal) see them","ustedes dan - you guys give"],"track":22},{"id":"t24__two-changed-verbs-pronoun-front","family":"two-changed-verbs-pronoun-front","title":"Pronoun jumps to the very front with two changed verbs","explanation":"The little words like lo, la, me, te normally go after a complete (\"to\") verb or before a single changed verb. He terminado is a rare case of two changed verbs stacked together, so there is only one legal spot left: before the whole pair, i.e. before he/has/ha/hemos/han.","examples":["lo he terminado - I have finished it","los he terminado - I have finished them","me he perdido - I have lost myself / I got lost"],"track":22},{"id":"t24__haber-perfect","family":"haber-perfect","title":"he/has/ha/hemos/han for have (done something)","explanation":"Haber (silent h) is the have that builds I have done/eaten/gone - not tener, which is only for possession and have-to. Its forms come from the two vowel sounds inside haber, a and e: he (I have) and hemos (we have) share the e; ha (he/she/it/you formal have), has (you informal have), and han (they/you plural have) share the a.","examples":["he - I have","hemos - we have","ha - he/she has","has - you have","han - they have"],"track":21}],"drills":[{"id":"t24-01","type":"word","prompt":"I give","answer":"Doy","steps":["dar's I-form is irregular: doy"],"rules":["t24__dar-present"],"track":24,"source":"track"},{"id":"t24-02","type":"sentence","prompt":"I give it. (masculine)","answer":"Lo doy.","steps":["it: lo","I give: doy"],"rules":["t24__dar-present"],"track":24,"source":"track"},{"id":"t24-03","type":"sentence","prompt":"I give them. (feminine)","answer":"Las doy.","steps":["them (feminine): las","I give: doy"],"rules":["t24__dar-present"],"track":24,"source":"track"},{"id":"t24-04","type":"sentence","prompt":"He gives. (emphatic)","answer":"Él da.","steps":["he: él","he gives: da"],"rules":["t24__dar-present"],"track":24,"source":"track"},{"id":"t24-05","type":"sentence","prompt":"They give.","answer":"Ellos dan.","steps":["they (masc/mixed): ellos","they give: dan"],"rules":["t24__dar-present"],"track":24,"source":"track","note":"Ellas dan if the group is all female."},{"id":"t24-06","type":"sentence","prompt":"He is giving me something.","answer":"Él me da algo.","steps":["he: él, there for emphasis","me: me","gives: da","something: algo"],"rules":["t24__dar-present"],"track":24,"source":"track"},{"id":"t24-07","type":"sentence","prompt":"They give it to me.","answer":"Me lo dan.","steps":["person before thing: me","then the thing: lo","they give: dan"],"rules":["t24__dar-present","t24__double-object-order"],"track":24,"source":"track"},{"id":"t24-08","type":"sentence","prompt":"I'll give it to you tomorrow. (informal)","answer":"Te lo doy mañana.","steps":["person: te","thing: lo","I give: doy","tomorrow: mañana"],"rules":["t24__dar-present","t24__double-object-order"],"track":24,"source":"track","note":"Present tense covers near-future meaning here, no separate future form needed."},{"id":"t24-09","type":"sentence","prompt":"Are you giving it to me tomorrow? (formal)","answer":"¿Me lo da mañana?","steps":["work out who is doing what first: da","person: me","thing: lo","tomorrow: mañana"],"rules":["t24__dar-present","t24__double-object-order","t24__usted-ustedes"],"track":24,"source":"track"},{"id":"t24-10","type":"sentence","prompt":"Are you giving it to me tomorrow? (formal, emphatic)","answer":"¿Usted me lo da mañana?","steps":["usted: you (formal)","person: me","thing: lo","you(formal) give: da","tomorrow: mañana"],"rules":["t24__usted-ustedes","t24__dar-present","t24__double-object-order"],"track":24,"source":"track","note":"usted is flexible in position: also fine as ¿Me lo da usted mañana?"},{"id":"t24-11","type":"sentence","prompt":"Will you guys give it to us tomorrow?","answer":"¿Nos lo dan mañana?","steps":["work out who: dan (you guys/they)","person: nos","thing: lo","tomorrow: mañana"],"rules":["t24__dar-present","t24__double-object-order"],"track":24,"source":"track"},{"id":"t24-12","type":"sentence","prompt":"Are you giving it to us tomorrow? (formal plural, emphatic)","answer":"¿Ustedes nos lo dan mañana?","steps":["ustedes: you guys","person: nos","thing: lo","you guys give: dan","tomorrow: mañana"],"rules":["t24__usted-ustedes","t24__dar-present","t24__double-object-order"],"track":24,"source":"track"},{"id":"t24-13","type":"sentence","prompt":"I want to give it to you. (informal)","answer":"Te lo quiero dar.","steps":["work out the verbs first: quiero dar (I want to give)","person: te","thing: lo","put it together, person before thing, in front of the pair: te lo quiero dar"],"rules":["t24__dar-present","t24__double-object-order"],"track":24,"source":"track","note":"Quiero is from earlier; here it takes the whole te lo before it because dar stays a complete (\"to\") verb."},{"id":"t24-x01","type":"word","prompt":"you give (informal)","answer":"Das","steps":["you(informal): das, off the dar pattern"],"rules":["t24__dar-present"],"track":24,"source":"extension","difficulty":1},{"id":"t24-x02","type":"sentence","prompt":"She gives me something.","answer":"Ella me da algo.","steps":["she: ella","me: me","she gives: da","something: algo"],"rules":["t24__dar-present"],"track":24,"source":"extension","difficulty":1},{"id":"t24-x03","type":"sentence","prompt":"We have given it to you. (informal)","answer":"Te lo hemos dado.","steps":["person first: te","then the thing: lo","both jump in front of the pair he/has/ha/hemos/han","we have: hemos","given: dar -> dado"],"rules":["t24__double-object-order","t24__haber-perfect","t24__two-changed-verbs-pronoun-front"],"track":24,"source":"extension","difficulty":2,"note":"dar's have-done form is regular: take off the -ar, put -ado on, and you get dado."},{"id":"t24-x04","type":"sentence","prompt":"I want to give you something tomorrow. (informal)","answer":"Te quiero dar algo mañana.","steps":["work out the verbs: quiero dar (I want to give)","person: te","something: algo","tomorrow: mañana"],"rules":["t24__dar-present","t24__double-object-order"],"track":24,"source":"extension","difficulty":3}],"blurb":"Verb dar (give) conjugated with indirect and direct object pronoun stacking","sectionIndex":3},{"id":"t25","label":"Track 25","tracks":[25],"rules":[{"id":"t25__no-extra-to-for-from","family":"no-extra-to-for-from","title":"me/te/nos already cover to, for and from","explanation":"Once you know me, te and nos can mean me/to me/myself, you/to you/yourself, us/to us/ourselves, resist adding a separate word for to, for or from - Spanish just uses the pronoun. He buys it for me is he buys me it: me lo compra.","examples":["he speaks to me: me habla","he buys it for me: me lo compra","buy me something (= from me): cómprame algo"],"track":25},{"id":"t25__shall-is-a-question","family":"shall-is-a-question","title":"Shall is just a question","explanation":"English shall has no word behind it in Spanish - it is only turning the sentence into a question. Build the plain statement and ask it: te lo compro becomes ¿te lo compro?","examples":["shall I buy it for you?: ¿te lo compro?"],"track":25},{"id":"t25__quedarse-stay","family":"quedarse-stay","title":"Remain myself = stay (me quedo)","explanation":"Quedar means to remain or be left over. To say I stay, you say I remain myself: me quedo. The reflexive word (me/te/nos) goes before the changed verb, same as always, and it's not optional here - you need it to get the meaning of stay.","examples":["to remain: quedar","I remain myself = I stay: me quedo","we stay: nos quedamos","I have stayed: me he quedado"],"track":25},{"id":"t25__noun-to-verb-r","family":"noun-to-verb-r","title":"Make a verb out of a noun by putting -r on the end","explanation":"You've been doing this with -ación words; it isn't limited to them. Take a noun that already ends in a vowel and stick an -r on: la cocina (the kitchen) gives cocinar, to cook. English kept the same root in concoction - literally 'with cooking'.","examples":["la cocina -> cocinar - to cook","cocinar -> cocino - I cook","concoction = con + cocción, with-cooking"],"track":25},{"id":"t25__time-las-horas","family":"time-las-horas","title":"Telling the time: 'at the six hours'","explanation":"Spanish gives the hour as a plural feminine thing, because what you're really saying is a las seis horas - at the six hours, the way English says sixteen hundred hours. The horas gets dropped and las stays behind, so it's a las seis, hasta las diez.","examples":["a las seis - at six o'clock","hasta las diez - until ten o'clock","ocho (eight) is the octo- of octagon, octopus and October, once the eighth month"],"track":25},{"id":"t25__perfect-covers-simple-past","family":"perfect-covers-simple-past","title":"Spanish reaches for the have-done past more often than English","explanation":"Where English says I cooked at six, Spanish is perfectly happy with he cocinado a las seis - I have cooked at six. So you don't need anything new to talk about what you did today: the have-done past you already have covers a lot of the ground English gives to the plain past.","examples":["I cooked at six o'clock -> he cocinado a las seis","we cooked at eight -> hemos cocinado a las ocho"],"track":25},{"id":"t25__haber-perfect","family":"haber-perfect","title":"he/has/ha/hemos/han for have (done something)","explanation":"Haber (silent h) is the have that builds I have done/eaten/gone - not tener, which is only for possession and have-to. Its forms come from the two vowel sounds inside haber, a and e: he (I have) and hemos (we have) share the e; ha (he/she/it/you formal have), has (you informal have), and han (they/you plural have) share the a.","examples":["he - I have","hemos - we have","ha - he/she has","has - you have","han - they have"],"track":21},{"id":"t25__perfect-ado-ido","family":"perfect-ado-ido","title":"The have-done form: -ado for -ar, -ido for -er and -ir","explanation":"You already take the -ar off and put -ado on. The other half is just as flat: take the -er or -ir off and put -ido on. -er and -ir verbs behave the same here, as they do nearly everywhere outside the we-form. Then put he, has, ha, hemos or han in front of it.","examples":["terminar -> terminado -> he terminado - I have finished","perder -> perdido; vender -> vendido","venir -> venido, as in bienvenido, well-come"],"track":22}],"drills":[{"id":"t25-01","type":"sentence","prompt":"She speaks to me.","answer":"Me habla.","steps":["to me: just me, no separate word for to","she speaks: habla","order: me habla"],"rules":["t25__no-extra-to-for-from"],"track":25,"source":"track"},{"id":"t25-02","type":"sentence","prompt":"They speak to me about it.","answer":"Me lo hablan.","steps":["to me: me","about it: no separate word - just lo (from earlier)","they speak: hablan","order: me lo hablan"],"rules":["t25__no-extra-to-for-from"],"track":25,"source":"track"},{"id":"t25-03","type":"sentence","prompt":"She buys it for me.","answer":"Me lo compra.","steps":["to buy: comprar, he buys: compra","for me: just me, no separate word","it: lo","order: me lo compra"],"rules":["t25__no-extra-to-for-from"],"track":25,"source":"track"},{"id":"t25-04","type":"sentence","prompt":"Shall I buy it for you? (informal)","answer":"¿Te lo compro?","steps":["shall is just a question - no extra word","for you: te","it: lo","I buy: compro","order: te lo compro, said as a question"],"rules":["t25__no-extra-to-for-from","t25__shall-is-a-question"],"track":25,"source":"track","note":"Context tells you whether it means for you or from you."},{"id":"t25-05","type":"sentence","prompt":"Do you want to do it for me? (informal)","answer":"¿Me lo quieres hacer?","steps":["do you want: quieres (from earlier)","for me: me","it: lo","to do: hacer","order: me lo quieres hacer"],"rules":["t25__no-extra-to-for-from"],"track":25,"source":"track","note":"Also fine as ¿Quieres hacérmelo?"},{"id":"t25-06","type":"word","prompt":"She cooks","answer":"Cocina","steps":["cocina, the noun kitchen, made into a verb: cocinar","she cooks: cocina"],"rules":["t25__noun-to-verb-r"],"track":25,"source":"track"},{"id":"t25-07","type":"sentence","prompt":"Can you cook something for me? (informal)","answer":"¿Me puedes cocinar algo?","steps":["can you: puedes","for me: me","to cook: cocinar","something: algo (from earlier)","order: me puedes cocinar algo"],"rules":["t25__no-extra-to-for-from"],"track":25,"source":"track"},{"id":"t25-08","type":"sentence","prompt":"We cooked at eight o'clock.","answer":"Hemos cocinado a las ocho.","steps":["Spanish is happy with the have-done past here: hemos","cooked: cocinado","at the eight hours: a las ocho"],"rules":["t25__perfect-covers-simple-past","t25__perfect-ado-ido","t25__time-las-horas"],"track":25,"source":"track"},{"id":"t25-09","type":"word","prompt":"I remain","answer":"Quedo","steps":["to remain: quedar","I remain: quedo"],"rules":["t25__quedarse-stay"],"track":25,"source":"track"},{"id":"t25-10","type":"sentence","prompt":"I am staying here until ten o'clock.","answer":"Me quedo aquí hasta las diez.","steps":["I remain myself (I stay): me quedo","here: aquí","until: hasta","ten o'clock: las diez"],"rules":["t25__quedarse-stay","t25__time-las-horas"],"track":25,"source":"track"},{"id":"t25-11","type":"sentence","prompt":"We are staying until nine o'clock.","answer":"Nos quedamos hasta las nueve.","steps":["we remain ourselves (we stay): nos quedamos","until: hasta","nine o'clock: las nueve"],"rules":["t25__quedarse-stay","t25__time-las-horas"],"track":25,"source":"track"},{"id":"t25-12","type":"sentence","prompt":"Are YOU staying here? (informal, emphatic)","answer":"¿Tú te quedas aquí?","steps":["you remain yourself (you stay): te quedas","here: aquí","add the word for you to make it emphatic: tú","order: tú te quedas aquí, as a question"],"rules":["t25__quedarse-stay"],"track":25,"source":"track"},{"id":"t25-x01","type":"sentence","prompt":"Can you buy it for me? (informal)","answer":"¿Me lo puedes comprar?","steps":["can you: puedes","for me: me","it: lo","to buy: comprar","order: me lo puedes comprar"],"rules":["t25__no-extra-to-for-from"],"track":25,"source":"extension","difficulty":1},{"id":"t25-x02","type":"sentence","prompt":"I am staying here until eight o'clock.","answer":"Me quedo aquí hasta las ocho.","steps":["I remain myself: me quedo","here: aquí","until eight o'clock: hasta las ocho"],"rules":["t25__quedarse-stay"],"track":25,"source":"extension","difficulty":1},{"id":"t25-x03","type":"sentence","prompt":"Why are you staying here? (informal)","answer":"¿Por qué te quedas aquí?","steps":["why (from earlier): por qué","you remain yourself: te quedas","here: aquí"],"rules":["t25__quedarse-stay"],"track":25,"source":"extension","difficulty":2},{"id":"t25-x04","type":"sentence","prompt":"We have stayed here until nine o'clock.","answer":"Nos hemos quedado aquí hasta las nueve.","steps":["we have (perfect, from earlier): hemos","remained ourselves: quedado, with nos before hemos","here: aquí","until nine o'clock: hasta las nueve"],"rules":["t25__quedarse-stay","t25__haber-perfect","t25__perfect-ado-ido","t25__time-las-horas"],"track":25,"source":"extension","difficulty":3}],"blurb":"Dative pronouns without to/for, verbs cocinar, poder, quedar(se) to stay","sectionIndex":3},{"id":"t26","label":"Track 26","tracks":[26],"rules":[{"id":"t26__que-have-to","family":"que-have-to","title":"tengo que + infinitive = have to","explanation":"Adding que after tengo turns plain possession (I have) into obligation (I have to) - there's no comfortable word-for-word translation for que here. It's the everyday, less severe way to express obligation, compared to debo.","examples":["tengo que quedarme - I have to stay","tienes que quedarte - you have to stay (informal)"],"track":14},{"id":"t26__pensar-plan-to","family":"pensar-plan-to","title":"Think to do something = plan to (pensar)","explanation":"Pensar means to think. Put a to-form straight after it and it means to plan on doing that thing - do you think to stay here? is do you plan on staying here?","examples":["what do you think?: ¿qué piensas?","do you plan on staying here tonight? (informal): ¿piensas quedarte aquí esta noche?"],"track":26},{"id":"t26__llamarse-name","family":"llamarse-name","title":"Call myself = my name is (me llamo)","explanation":"Llamar means to call or to phone. Instead of saying my name is, Spanish says I call myself: me llamo. Asking for a name becomes how do you call yourself?: ¿cómo te llamas?","examples":["I call: llamo","I call myself (my name is): me llamo","how do you call yourself? (what's your name?): ¿cómo te llamas?"],"track":26},{"id":"t26__quedarse-stay","family":"quedarse-stay","title":"Remain myself = stay (me quedo)","explanation":"Quedar means to remain or be left over. To say I stay, you say I remain myself: me quedo. The reflexive word (me/te/nos) goes before the changed verb, same as always, and it's not optional here - you need it to get the meaning of stay.","examples":["to remain: quedar","I remain myself = I stay: me quedo","we stay: nos quedamos","I have stayed: me he quedado"],"track":25},{"id":"t26__no-extra-to-for-from","family":"no-extra-to-for-from","title":"me/te/nos already cover to, for and from","explanation":"Once you know me, te and nos can mean me/to me/myself, you/to you/yourself, us/to us/ourselves, resist adding a separate word for to, for or from - Spanish just uses the pronoun. He buys it for me is he buys me it: me lo compra.","examples":["he speaks to me: me habla","he buys it for me: me lo compra","buy me something (= from me): cómprame algo"],"track":25}],"drills":[{"id":"t26-01","type":"sentence","prompt":"You're staying here. (informal)","answer":"Te quedas aquí.","steps":["you remain yourself: te quedas","here: aquí"],"rules":["t26__quedarse-stay"],"track":26,"source":"track"},{"id":"t26-02","type":"sentence","prompt":"You're not staying here. (informal)","answer":"No te quedas aquí.","steps":["no at the front (from earlier)","you remain yourself: te quedas","here: aquí"],"rules":["t26__quedarse-stay"],"track":26,"source":"track"},{"id":"t26-03","type":"sentence","prompt":"Why aren't you staying here? (informal)","answer":"¿Por qué no te quedas aquí?","steps":["why: por qué","not: no, right before the verb","you remain yourself: te quedas","here: aquí"],"rules":["t26__quedarse-stay"],"track":26,"source":"track"},{"id":"t26-04","type":"sentence","prompt":"I'm going to stay until seven o'clock.","answer":"Voy a quedarme hasta las siete.","steps":["I'm going to (from earlier): voy a","to remain myself: quedarme","until seven o'clock: hasta las siete"],"rules":["t26__quedarse-stay"],"track":26,"source":"track"},{"id":"t26-05","type":"sentence","prompt":"We must stay.","answer":"Debemos quedarnos.","steps":["we must/owe: debemos","to remain ourselves: quedarnos"],"rules":["t26__quedarse-stay"],"track":26,"source":"track","note":"Also fine as Nos debemos quedar."},{"id":"t26-06","type":"sentence","prompt":"I have to stay.","answer":"Tengo que quedarme.","steps":["I have: tengo","add que for have to: tengo que","to remain myself: quedarme"],"rules":["t26__que-have-to","t26__quedarse-stay"],"track":26,"source":"track"},{"id":"t26-07","type":"sentence","prompt":"I want to know why you have to stay here. (informal)","answer":"Quiero saber por qué tienes que quedarte aquí.","steps":["I want: quiero","to know: saber","why: por qué","you have to: tienes que","to remain yourself: quedarte","here: aquí"],"rules":["t26__que-have-to","t26__quedarse-stay"],"track":26,"source":"track"},{"id":"t26-08","type":"sentence","prompt":"I can't stay tonight.","answer":"No puedo quedarme esta noche.","steps":["not: no, right before the verb","I can (from earlier): puedo","to remain myself: quedarme","tonight: esta noche"],"rules":["t26__quedarse-stay"],"track":26,"source":"track"},{"id":"t26-09","type":"sentence","prompt":"Do you plan on staying here tonight? (informal)","answer":"¿Piensas quedarte aquí esta noche?","steps":["you think/plan: piensas","to remain yourself: quedarte","here: aquí","tonight: esta noche"],"rules":["t26__pensar-plan-to","t26__quedarse-stay"],"track":26,"source":"track"},{"id":"t26-10","type":"sentence","prompt":"We haven't stayed.","answer":"No nos hemos quedado.","steps":["not: no, right before the verb","we have (perfect, from earlier): hemos, with nos before it","remained: quedado"],"rules":["t26__quedarse-stay"],"track":26,"source":"track"},{"id":"t26-11","type":"sentence","prompt":"Haven't YOU stayed? (informal, emphatic)","answer":"¿Tú no te has quedado?","steps":["add the word for you to make it emphatic: tú","not: no, right before the verb","you have (perfect, from earlier): has, with te before it","stayed: quedado"],"rules":["t26__quedarse-stay"],"track":26,"source":"track"},{"id":"t26-12","type":"sentence","prompt":"What's your name? (informal, literally: How do you call yourself?)","answer":"¿Cómo te llamas?","steps":["how: cómo","you call yourself: te llamas"],"rules":["t26__llamarse-name"],"track":26,"source":"track"},{"id":"t26-x01","type":"sentence","prompt":"You have to stay here tonight. (informal)","answer":"Tienes que quedarte aquí esta noche.","steps":["you have to: tienes que","to remain yourself: quedarte","here: aquí","tonight: esta noche"],"rules":["t26__que-have-to","t26__quedarse-stay"],"track":26,"source":"extension","difficulty":1},{"id":"t26-x02","type":"sentence","prompt":"My name is Ana. (literally: I call myself Ana.)","answer":"Me llamo Ana.","steps":["I call myself: me llamo","the name itself, unchanged: Ana"],"rules":["t26__llamarse-name"],"track":26,"source":"extension","difficulty":1},{"id":"t26-x03","type":"sentence","prompt":"Why do you want to stay here tonight? (informal)","answer":"¿Por qué quieres quedarte aquí esta noche?","steps":["why: por qué","you want (from earlier): quieres","to remain yourself: quedarte","here: aquí","tonight: esta noche"],"rules":["t26__quedarse-stay"],"track":26,"source":"extension","difficulty":2},{"id":"t26-x04","type":"sentence","prompt":"Do you plan on calling me tonight? (informal)","answer":"¿Piensas llamarme esta noche?","steps":["you think/plan: piensas","to call: llamar","me, attached: llamarme","tonight: esta noche"],"rules":["t26__pensar-plan-to","t26__no-extra-to-for-from"],"track":26,"source":"extension","difficulty":3}],"blurb":"Quedarse to stay across tenses, deber/tener que, pensar, llamarse","sectionIndex":3},{"id":"t27","label":"Track 27","tracks":[27],"rules":[{"id":"t27__feminine-endings","family":"feminine-endings","title":"-a, -ión and -idad mark feminine words","explanation":"A word ending in -a, -ión, or -idad is (almost) always feminine and takes la/las. English -ity words become -idad in Spanish (diversity -> diversidad), and English -tion words become -ión, following the pattern you already know. Adjectives agree the same way: the masculine -o ending becomes -a for a feminine noun. Words ending in -e could go either way and have to be picked up from context - la noche and la carne both turn out to be feminine.","examples":["la diversidad - the diversity (from diversity -> diversidad)","la comunidad - the community","generoso -> generosa - generous, for a feminine noun","la noche, la carne - -e words you just meet and keep","la oportunidad - the opportunity"],"track":12},{"id":"t27__adjective-after-noun","family":"adjective-after-noun","title":"Describing words go after the noun","explanation":"Adjectives - describing words like big, digital, red - come after the noun they describe in Spanish, not before it. The global situation is the situation global: la situación global.","examples":["the global situation: la situación global","digital camera: cámara digital","the red car: el auto rojo"],"track":27},{"id":"t27__lo-la-object-by-gender","family":"lo-la-object-by-gender","title":"lo or la matches the gender of the word it replaces","explanation":"Lo and la both mean it, and it's the noun's gender that decides which one you use - a feminine word like cámara is replaced by la, stuck onto the end of the to-form just like lo. I want to buy it (the camera) is quiero comprarla.","examples":["a digital camera: una cámara digital","I want to buy it (the camera): quiero comprarla"],"track":27},{"id":"t27__plural-s","family":"plural-s","title":"The noun, its the/a and its describing word all take -s together","explanation":"To make a noun plural, add -s (casa -> casas) and el/la become los/las to match. Any adjective describing that noun becomes plural too, with its own -s: la casa grande -> las casas grandes.","examples":["the house -> the houses: la casa -> las casas","the big houses: las casas grandes","the big cars: los autos grandes"],"track":27},{"id":"t27__drop-the-can","family":"drop-the-can","title":"Can is often just skipped","explanation":"English overuses can. Puedo, quiero, tengo que, debo are shortcuts in thought that let you speak fast and are worth using a lot at first, but Spanish speakers often just use the plain verb instead - can you see the car? becomes do you see the car?, and I can't find it becomes I don't find it.","examples":["can you see the big car? -> do you see the big car?: ¿ves el coche grande?","I can't find it -> I don't find it: no lo encuentro"],"track":27},{"id":"t27__quedarse-stay","family":"quedarse-stay","title":"Remain myself = stay (me quedo)","explanation":"Quedar means to remain or be left over. To say I stay, you say I remain myself: me quedo. The reflexive word (me/te/nos) goes before the changed verb, same as always, and it's not optional here - you need it to get the meaning of stay.","examples":["to remain: quedar","I remain myself = I stay: me quedo","we stay: nos quedamos","I have stayed: me he quedado"],"track":25}],"drills":[{"id":"t27-01","type":"word","prompt":"The situation","answer":"La situación","steps":["-ión is a feminine ending, so it takes la (from earlier)"],"rules":["t27__feminine-endings"],"track":27,"source":"track"},{"id":"t27-02","type":"sentence","prompt":"The global situation.","answer":"La situación global.","steps":["the situation: la situación","describing word goes after: global"],"rules":["t27__adjective-after-noun"],"track":27,"source":"track"},{"id":"t27-03","type":"word","prompt":"Digital camera","answer":"Cámara digital","steps":["camera: cámara","describing word goes after: digital"],"rules":["t27__adjective-after-noun"],"track":27,"source":"track"},{"id":"t27-04","type":"sentence","prompt":"I want to buy a digital camera.","answer":"Quiero comprar una cámara digital.","steps":["I want: quiero","to buy: comprar","a (cámara is feminine): una","digital camera: cámara digital"],"rules":["t27__adjective-after-noun"],"track":27,"source":"track"},{"id":"t27-05","type":"sentence","prompt":"I want to buy the digital camera.","answer":"Quiero comprar la cámara digital.","steps":["I want to buy: quiero comprar","the (cámara is feminine): la","digital camera: cámara digital"],"rules":["t27__adjective-after-noun"],"track":27,"source":"track"},{"id":"t27-06","type":"sentence","prompt":"I want to buy it. (the digital camera)","answer":"Quiero comprarla.","steps":["I want to buy: quiero comprar","it (cámara is feminine, so la not lo), attached: comprarla"],"rules":["t27__lo-la-object-by-gender","t27__feminine-endings"],"track":27,"source":"track"},{"id":"t27-07","type":"sentence","prompt":"The big houses.","answer":"Las casas grandes.","steps":["the house: la casa","plural: las casas","big, also made plural: grandes","order: las casas grandes"],"rules":["t27__plural-s","t27__adjective-after-noun"],"track":27,"source":"track"},{"id":"t27-08","type":"sentence","prompt":"The big cars. (using auto)","answer":"Los autos grandes.","steps":["the car: el auto","plural, el becomes los: los autos","big, also made plural: grandes"],"rules":["t27__plural-s","t27__adjective-after-noun"],"track":27,"source":"track"},{"id":"t27-09","type":"sentence","prompt":"Can you see the big car? (informal)","answer":"¿Ves el coche grande?","steps":["do you see (can is dropped): ves","the car: el coche","big, after the noun: grande"],"rules":["t27__drop-the-can","t27__adjective-after-noun"],"track":27,"source":"track","note":"el auto grande works just as well; so does ¿Puedes ver...?, but ves is what you'll hear."},{"id":"t27-10","type":"sentence","prompt":"I can't find it.","answer":"No lo encuentro.","steps":["not: no, right before the verb","it (from earlier): lo","I find: encuentro"],"rules":["t27__drop-the-can"],"track":27,"source":"track","note":"No puedo encontrarlo also works and is the easier shortcut to build - but Spanish usually just says I don't find it."},{"id":"t27-11","type":"sentence","prompt":"I'm staying in the red car.","answer":"Me quedo en el auto rojo.","steps":["I remain myself (I'm staying, from earlier): me quedo","in: en","the car: el auto","red, after the noun: rojo"],"rules":["t27__quedarse-stay","t27__adjective-after-noun"],"track":27,"source":"track"},{"id":"t27-12","type":"sentence","prompt":"I have stayed in the red car.","answer":"Me he quedado en el auto rojo.","steps":["I have remained myself (perfect, from earlier): me he quedado","in the red car: en el auto rojo"],"rules":["t27__quedarse-stay","t27__adjective-after-noun"],"track":27,"source":"track"},{"id":"t27-13","type":"sentence","prompt":"I have bought myself a red car.","answer":"Me he comprado un auto rojo.","steps":["I have bought myself (perfect, from earlier, plus me): me he comprado","a (auto is masculine): un","red car, describing word after: auto rojo"],"rules":["t27__adjective-after-noun"],"track":27,"source":"track"},{"id":"t27-x01","type":"sentence","prompt":"The red cars. (using auto)","answer":"Los autos rojos.","steps":["the cars: los autos","red, also made plural: rojos","order: los autos rojos"],"rules":["t27__plural-s","t27__adjective-after-noun"],"track":27,"source":"extension","difficulty":1},{"id":"t27-x02","type":"sentence","prompt":"The big camera.","answer":"La cámara grande.","steps":["the camera: la cámara","big, after the noun: grande"],"rules":["t27__adjective-after-noun"],"track":27,"source":"extension","difficulty":1},{"id":"t27-x03","type":"sentence","prompt":"Can you see the red car? (informal)","answer":"¿Ves el auto rojo?","steps":["do you see: ves","the car: el auto","red, after the noun: rojo"],"rules":["t27__drop-the-can","t27__adjective-after-noun"],"track":27,"source":"extension","difficulty":2,"note":"el coche rojo works just as well."},{"id":"t27-x04","type":"sentence","prompt":"I'm staying in the big car.","answer":"Me quedo en el auto grande.","steps":["I'm staying: me quedo","in: en","the big car: el auto grande"],"rules":["t27__quedarse-stay","t27__adjective-after-noun"],"track":27,"source":"extension","difficulty":2},{"id":"t27-x05","type":"sentence","prompt":"I have bought myself the big red car.","answer":"Me he comprado el auto grande y rojo.","steps":["I have bought myself (perfect, plus me): me he comprado","the (auto is masculine): el","big: grande","and (from earlier): y","red: rojo","both describing words go after the noun: el auto grande y rojo"],"rules":["t27__adjective-after-noun"],"track":27,"source":"extension","difficulty":3}],"blurb":"Describing words after the noun, gender and plural agreement, and dropping can","sectionIndex":4},{"id":"t28","label":"Track 28","tracks":[28],"rules":[{"id":"t28__ser-son","family":"ser-son","title":"es becomes son for more than one","explanation":"You've had es (is) since the first track. For more than one thing, it's son - the same -n you add everywhere else to get they. El carro es caro, los carros son caros. Whatever the describing word is, it goes plural alongside.","examples":["el carro es caro -> los carros son caros","es profesora -> son profesoras","son doctores - they are doctors"],"track":28},{"id":"t28__feminine-endings","family":"feminine-endings","title":"-a, -ión and -idad mark feminine words","explanation":"A word ending in -a, -ión, or -idad is (almost) always feminine and takes la/las. English -ity words become -idad in Spanish (diversity -> diversidad), and English -tion words become -ión, following the pattern you already know. Adjectives agree the same way: the masculine -o ending becomes -a for a feminine noun. Words ending in -e could go either way and have to be picked up from context - la noche and la carne both turn out to be feminine.","examples":["la diversidad - the diversity (from diversity -> diversidad)","la comunidad - the community","generoso -> generosa - generous, for a feminine noun","la noche, la carne - -e words you just meet and keep","la oportunidad - the opportunity"],"track":12},{"id":"t28__plural-s","family":"plural-s","title":"The noun, its the/a and its describing word all take -s together","explanation":"To make a noun plural, add -s (casa -> casas) and el/la become los/las to match. Any adjective describing that noun becomes plural too, with its own -s: la casa grande -> las casas grandes.","examples":["the house -> the houses: la casa -> las casas","the big houses: las casas grandes","the big cars: los autos grandes"],"track":27},{"id":"t28__consonant-plural-es","family":"consonant-plural-es","title":"Plural with -es for consonant endings","explanation":"When a Spanish word ends in a consonant, you don't just add -s for the plural - you add -es instead. Profesor becomes profesores, doctor becomes doctores.","examples":["profesor -> profesores","doctor -> doctores"],"track":28},{"id":"t28__noun-gender-a","family":"noun-gender-a","title":"Nouns for people take an -a for a woman","explanation":"Some nouns for people (not adjectives) change to feminine the same way adjectives do: stick an -a on the end. Profesor becomes profesora, doctor becomes doctora. This only works for nouns like these - describing words that don't end in -o, like global, don't change at all.","examples":["profesor -> profesora","doctor -> doctora"],"track":28},{"id":"t28__no-double-letters","family":"no-double-letters","title":"English double letters go single in Spanish","explanation":"The random double letters English throws around (ff, ss, gg...) don't cross over into Spanish - they collapse to one letter. The only doubles that do survive are rr and nn.","examples":["aggressive -> agresivo - not aggresivo","connotation -> connotación"],"track":28},{"id":"t28__ive-ivo","family":"ive-ivo","title":"English -ive becomes -ivo","explanation":"Words ending -ive in English tend to end -ivo in Spanish for the masculine/neuter singular - this is the form you build everything else from. Swap the final -e for -o, and then treat it exactly like any other -o adjective: -a for feminine, -os/-as for plural.","examples":["addictive -> adictivo","positive -> positivo","attractive -> atractivo"],"track":28}],"drills":[{"id":"t28-01","type":"word","prompt":"a car","answer":"Un carro","steps":["car: carro (two r's)","a: un"],"rules":["t28__feminine-endings"],"track":28,"source":"track"},{"id":"t28-02","type":"word","prompt":"the cars","answer":"Los carros","steps":["car: carro","the, plural: los","add -s for the plural"],"rules":["t28__plural-s"],"track":28,"source":"track"},{"id":"t28-03","type":"sentence","prompt":"The car is expensive.","answer":"El carro es caro.","steps":["the car: el carro","is: es","expensive: caro"],"rules":["t28__ser-son"],"track":28,"source":"track"},{"id":"t28-04","type":"sentence","prompt":"The cars are expensive.","answer":"Los carros son caros.","steps":["the cars: los carros","are: son","expensive, plural: caro -> caros"],"rules":["t28__ser-son","t28__plural-s"],"track":28,"source":"track"},{"id":"t28-05","type":"sentence","prompt":"The machine is expensive.","answer":"La máquina es cara.","steps":["the machine: la máquina, feminine, so la","is: es","expensive, following máquina: caro -> cara"],"rules":["t28__ser-son","t28__feminine-endings"],"track":28,"source":"track","note":"La máquina is also an everyday word for a car - and then caro follows máquina, not the car."},{"id":"t28-06","type":"word","prompt":"she is a professor","answer":"Es profesora","steps":["professor: profesor","for a woman: add -a -> profesora","is: es"],"rules":["t28__noun-gender-a","t28__ser-son"],"track":28,"source":"track"},{"id":"t28-07","type":"sentence","prompt":"They are teachers. (all women)","answer":"Son profesoras.","steps":["teacher, for a woman: profesor -> profesora","profesora ends in a vowel now, so the plural is just -s: profesoras","are: son"],"rules":["t28__noun-gender-a","t28__ser-son","t28__plural-s"],"track":28,"source":"track"},{"id":"t28-08","type":"word","prompt":"a female doctor","answer":"Doctora","steps":["doctor: doctor","for a woman: add -a"],"rules":["t28__noun-gender-a"],"track":28,"source":"track"},{"id":"t28-09","type":"sentence","prompt":"They are doctors. (mixed or masculine group)","answer":"Son doctores.","steps":["doctor ends in a consonant, so the plural takes -es: doctores","are: son"],"rules":["t28__consonant-plural-es","t28__ser-son"],"track":28,"source":"track"},{"id":"t28-10","type":"word","prompt":"It's addictive","answer":"Es adictivo","steps":["addictive: -ive becomes -ivo -> adictivo","it's, using the neuter/masculine singular: es"],"rules":["t28__ive-ivo"],"track":28,"source":"track"},{"id":"t28-11","type":"sentence","prompt":"She is very attractive.","answer":"Ella es muy atractiva.","steps":["she: ella","is: es","very: muy","attractive: -ive becomes -ivo -> atractivo, then -a for her: atractiva"],"rules":["t28__ive-ivo"],"track":28,"source":"track"},{"id":"t28-12","type":"sentence","prompt":"They are aggressive. (using the word for they, masculine/mixed)","answer":"Ellos son agresivos.","steps":["they: ellos","are: son","aggressive: -ive becomes -ivo, but English's double g doesn't cross over -> agresivo","plural: agresivo -> agresivos"],"rules":["t28__ive-ivo","t28__no-double-letters"],"track":28,"source":"track"},{"id":"t28-x01","type":"word","prompt":"It's instructive","answer":"Es instructivo","steps":["instructive: -ive becomes -ivo -> instructivo"],"rules":["t28__ive-ivo"],"track":28,"source":"extension","difficulty":1},{"id":"t28-x02","type":"sentence","prompt":"She is a doctor and he is a professor.","answer":"Ella es doctora y él es profesor.","steps":["she: ella","is: es","doctor, for a woman: doctora","and: y (from earlier)","he: él","is: es","professor: profesor"],"rules":["t28__noun-gender-a"],"track":28,"source":"extension","difficulty":2},{"id":"t28-x03","type":"sentence","prompt":"The professor is very attractive. (talking about a woman)","answer":"La profesora es muy atractiva.","steps":["the professor, for a woman: la profesora","is: es","very: muy","attractive: atractivo -> atractiva"],"rules":["t28__noun-gender-a","t28__ive-ivo"],"track":28,"source":"extension","difficulty":2},{"id":"t28-x04","type":"sentence","prompt":"The female professors are very aggressive but positive.","answer":"Las profesoras son muy agresivas pero positivas.","steps":["the professors, women: las profesoras","are: son","very: muy","aggressive, plural: agresivo (double g drops) -> agresivas","but: pero (from earlier)","positive, plural: positivo -> positivas"],"rules":["t28__noun-gender-a","t28__consonant-plural-es","t28__ive-ivo","t28__no-double-letters"],"track":28,"source":"extension","difficulty":3}],"blurb":"Ser plural son, noun gender for professions, -ivo adjectives feminine forms","sectionIndex":4},{"id":"t29","label":"Track 29","tracks":[29],"rules":[{"id":"t29__feminine-endings","family":"feminine-endings","title":"-a, -ión and -idad mark feminine words","explanation":"A word ending in -a, -ión, or -idad is (almost) always feminine and takes la/las. English -ity words become -idad in Spanish (diversity -> diversidad), and English -tion words become -ión, following the pattern you already know. Adjectives agree the same way: the masculine -o ending becomes -a for a feminine noun. Words ending in -e could go either way and have to be picked up from context - la noche and la carne both turn out to be feminine.","examples":["la diversidad - the diversity (from diversity -> diversidad)","la comunidad - the community","generoso -> generosa - generous, for a feminine noun","la noche, la carne - -e words you just meet and keep","la oportunidad - the opportunity"],"track":12},{"id":"t29__ser-vs-estar","family":"ser-vs-estar","title":"Two words for \"to be\": characteristic or state","explanation":"Spanish forces you to decide, every time you say \"to be\", whether you're describing a characteristic of something (ser) or a state it's in (estar). Don't simplify this to permanent vs. temporary - a profession is a characteristic even if it only lasts five minutes, and being tired or dead is a state even though you can't just undo it.","examples":["a characteristic: profession, personality, being a doctor -> ser","a state: tired, where you are, dead -> estar"],"track":29},{"id":"t29__estar-forms","family":"estar-forms","title":"The estar set: estoy, está, están, estás, estamos","explanation":"Estar's own form for \"I\" is estoy, ending -oy like voy. It's the only verb in the whole present tense where the stress falls on the last syllable instead of the second-to-last. Everything else builds the way you'd expect: está (he/she/it/you formal), están (they/you plural), estás (you informal), estamos (we).","examples":["estoy - I am","está - he/she/it is, you formal are","están - they are, you guys are","estás - you are, informal","estamos - we are"],"track":29}],"drills":[{"id":"t29-01","type":"word","prompt":"humanity","answer":"Humanidad","steps":["-ity words end -idad (from earlier) -> humanidad"],"rules":["t29__feminine-endings"],"track":29,"source":"track"},{"id":"t29-02","type":"word","prompt":"I am (a state, not a characteristic)","answer":"Estoy","steps":["estar's I-form ends -oy, like voy -> estoy"],"rules":["t29__estar-forms"],"track":29,"source":"track"},{"id":"t29-03","type":"word","prompt":"she is / it is / you are (formal, a state)","answer":"Está","steps":["built regularly from estar, but the stress lands on the last syllable -> está"],"rules":["t29__estar-forms"],"track":29,"source":"track"},{"id":"t29-04","type":"word","prompt":"they are / you guys are (a state)","answer":"Están","steps":["add -n to está -> están"],"rules":["t29__estar-forms"],"track":29,"source":"track"},{"id":"t29-05","type":"word","prompt":"you are (informal, a state)","answer":"Estás","steps":["built regularly from estar -> estás"],"rules":["t29__estar-forms"],"track":29,"source":"track"},{"id":"t29-06","type":"word","prompt":"we are (a state)","answer":"Estamos","steps":["the we-form adds two syllables, so the stress falls where you'd expect -> estamos"],"rules":["t29__estar-forms"],"track":29,"source":"track"},{"id":"t29-07","type":"sentence","prompt":"I am tired. (a woman speaking)","answer":"Estoy cansada.","steps":["tired is a state, not a characteristic, so estar","I am: estoy","tired, for a woman: cansada"],"rules":["t29__ser-vs-estar","t29__estar-forms"],"track":29,"source":"track"},{"id":"t29-08","type":"sentence","prompt":"We are tired. (mixed or masculine group)","answer":"Estamos cansados.","steps":["we are (state): estamos","tired, plural: cansados"],"rules":["t29__ser-vs-estar","t29__estar-forms"],"track":29,"source":"track"},{"id":"t29-09","type":"sentence","prompt":"I'm always tired.","answer":"Siempre estoy cansada.","steps":["always: siempre - it can move around the sentence","I am: estoy","tired: cansada"],"rules":["t29__ser-vs-estar","t29__estar-forms"],"track":29,"source":"track","note":"Also fine as Estoy cansada siempre or Estoy siempre cansada - the emphasis shifts with the position."},{"id":"t29-10","type":"sentence","prompt":"I'm dead. (a woman speaking, meaning exhausted)","answer":"Estoy muerta.","steps":["dead is a state in Spanish, so estar","I am: estoy","dead, for a woman: muerta"],"rules":["t29__ser-vs-estar","t29__estar-forms"],"track":29,"source":"track","note":"Used colloquially the way English uses \"I'm dead\" for very tired."},{"id":"t29-x01","type":"sentence","prompt":"He is tired.","answer":"Él está cansado.","steps":["he: él","is (state): está","tired: cansado"],"rules":["t29__ser-vs-estar","t29__estar-forms"],"track":29,"source":"extension","difficulty":1},{"id":"t29-x02","type":"sentence","prompt":"She is always very tired.","answer":"Ella siempre está muy cansada.","steps":["she: ella","always: siempre","is (state): está","very: muy","tired: cansada"],"rules":["t29__ser-vs-estar","t29__estar-forms"],"track":29,"source":"extension","difficulty":2},{"id":"t29-x03","type":"sentence","prompt":"She is a doctor, but she is tired.","answer":"Es doctora, pero está cansada.","steps":["being a doctor is a characteristic, so ser: es","doctor, for a woman: doctora","but: pero","tired is a state, so estar: está cansada"],"rules":["t29__ser-vs-estar","t29__estar-forms"],"track":29,"source":"extension","difficulty":3,"note":"The two verbs side by side: es for what she is, está for how she is."}],"blurb":"Ser vs estar introduced as characteristic vs state, verb estar conjugated","sectionIndex":4},{"id":"t30","label":"Track 30","tracks":[30],"rules":[{"id":"t30__quedarse-stay","family":"quedarse-stay","title":"Remain myself = stay (me quedo)","explanation":"Quedar means to remain or be left over. To say I stay, you say I remain myself: me quedo. The reflexive word (me/te/nos) goes before the changed verb, same as always, and it's not optional here - you need it to get the meaning of stay. With a helper verb it can also move in front of the pair: no nos vamos a quedar says exactly what no vamos a quedarnos says.","examples":["to remain: quedar","I remain myself = I stay: me quedo","we stay: nos quedamos","I have stayed: me he quedado"],"track":25},{"id":"t30__debo-must","family":"debo-must","title":"debo (I owe) + infinitive = I must","explanation":"debo literally means I owe. Put it in front of a verb's 'to' form and it means I must / I have to - debo continuar is literally 'I owe to continue', meaning I must continue. It runs through the other persons the same way - debe, debemos, deben - and it also carries the English 'must' of probability: debe estar aquí, he must be here by now.","examples":["debe estar aquí - he must be here","deben estar cansados - they must be tired"],"track":8},{"id":"t30__que-have-to","family":"que-have-to","title":"tengo que + infinitive = have to","explanation":"Adding que after tengo turns plain possession (I have) into obligation (I have to) - there's no comfortable word-for-word translation for que here. It's the everyday, less severe way to express obligation, compared to debo. It isn't tied to tengo: take whatever form of tener fits the person and put que after it - tienes que, tiene que, tenemos que, tienen que.","examples":["tengo que estar aquí - I have to be here","tienen que estar - you guys/they have to be","tienes que quedarte - you have to stay"],"track":14},{"id":"t30__ser-vs-estar","family":"ser-vs-estar","title":"Two words for \"to be\": characteristic or state","explanation":"Spanish forces you to decide, every time you say \"to be\", whether you're describing a characteristic of something (ser) or a state it's in (estar). Don't simplify this to permanent vs. temporary - a profession is a characteristic even if it only lasts five minutes, and being tired or dead is a state even though you can't just undo it.","examples":["a characteristic: profession, personality, being a doctor -> ser","a state: tired, where you are, dead -> estar"],"track":29},{"id":"t30__estar-forms","family":"estar-forms","title":"The estar set: estoy, está, están, estás, estamos","explanation":"Estar's own form for \"I\" is estoy, ending -oy like voy. It's the only verb in the whole present tense where the stress falls on the last syllable instead of the second-to-last. Everything else builds the way you'd expect: está (he/she/it/you formal), están (they/you plural), estás (you informal), estamos (we).","examples":["estoy - I am","está - he/she/it is, you formal are","están - they are, you guys are","estás - you are, informal","estamos - we are"],"track":29}],"drills":[{"id":"t30-01","type":"sentence","prompt":"How are you? (informal)","answer":"¿Cómo estás?","steps":["how: cómo","are you, informal (state): estás"],"rules":["t30__estar-forms","t30__ser-vs-estar"],"track":30,"source":"track"},{"id":"t30-02","type":"sentence","prompt":"How are you? (formal)","answer":"¿Cómo está?","steps":["how: cómo","are you, formal (state): está"],"rules":["t30__estar-forms"],"track":30,"source":"track"},{"id":"t30-03","type":"sentence","prompt":"Where are you? (informal)","answer":"¿Dónde estás?","steps":["where: dónde","are you, informal: estás"],"rules":["t30__estar-forms"],"track":30,"source":"track"},{"id":"t30-04","type":"sentence","prompt":"I don't know where we are.","answer":"No sé dónde estamos.","steps":["I don't know: no sé","where: dónde","we are: estamos"],"rules":["t30__estar-forms"],"track":30,"source":"track"},{"id":"t30-05","type":"sentence","prompt":"I want to be here.","answer":"Quiero estar aquí.","steps":["I want: quiero (from earlier)","to be: estar, plain form","here: aquí"],"rules":["t30__ser-vs-estar","t30__estar-forms"],"track":30,"source":"track"},{"id":"t30-06","type":"sentence","prompt":"I'm going to be here later.","answer":"Voy a estar aquí más tarde.","steps":["I'm going to: voy a (from earlier)","be: estar","here: aquí","later: más tarde"],"rules":["t30__ser-vs-estar","t30__estar-forms"],"track":30,"source":"track"},{"id":"t30-07","type":"sentence","prompt":"Where are you going to be? (informal)","answer":"¿Dónde vas a estar?","steps":["where: dónde","you're going to: vas a","be: estar"],"rules":["t30__ser-vs-estar","t30__estar-forms"],"track":30,"source":"track"},{"id":"t30-08","type":"word","prompt":"you are (informal, emphasized, using the word for you)","answer":"Tú estás","steps":["you: tú","are: estás"],"rules":["t30__estar-forms"],"track":30,"source":"track"},{"id":"t30-09","type":"sentence","prompt":"Where do you guys have to be later?","answer":"¿Dónde tienen que estar más tarde?","steps":["where: dónde","you guys have: tienen","add que to get have to: tienen que","be: estar","later: más tarde"],"rules":["t30__que-have-to"],"track":30,"source":"track"},{"id":"t30-10","type":"sentence","prompt":"He must be tired.","answer":"Debe estar cansado.","steps":["he must/owes: debe - this e doesn't split","be: estar","tired: cansado"],"rules":["t30__debo-must"],"track":30,"source":"track"},{"id":"t30-11","type":"sentence","prompt":"They must be tired. (mixed or masculine group)","answer":"Deben estar cansados.","steps":["they must: deben","be: estar","tired, plural: cansados"],"rules":["t30__debo-must"],"track":30,"source":"track"},{"id":"t30-12","type":"word","prompt":"I remain myself / I'm staying","answer":"Me quedo","steps":["to remain: quedar","myself: me","I remain: quedo"],"rules":["t30__quedarse-stay"],"track":30,"source":"track"},{"id":"t30-13","type":"word","prompt":"we are staying","answer":"Nos quedamos","steps":["we remain: quedamos","ourselves: nos"],"rules":["t30__quedarse-stay"],"track":30,"source":"track"},{"id":"t30-14","type":"sentence","prompt":"We are not going to stay, because we are very tired.","answer":"No vamos a quedarnos porque estamos muy cansados.","steps":["we are not going to: no vamos a","stay (remain ourselves): quedarnos","because: porque","we are very tired: estamos muy cansados"],"rules":["t30__quedarse-stay","t30__estar-forms","t30__ser-vs-estar"],"track":30,"source":"track","note":"Also fine as No nos vamos a quedar porque estamos muy cansados."},{"id":"t30-x01","type":"sentence","prompt":"Where are we?","answer":"¿Dónde estamos?","steps":["where: dónde","we are: estamos"],"rules":["t30__estar-forms"],"track":30,"source":"extension","difficulty":1},{"id":"t30-x02","type":"sentence","prompt":"She must be tired.","answer":"Debe estar cansada.","steps":["she must: debe","be: estar","tired, for a woman: cansada"],"rules":["t30__debo-must"],"track":30,"source":"extension","difficulty":1},{"id":"t30-x03","type":"sentence","prompt":"I have to be here later.","answer":"Tengo que estar aquí más tarde.","steps":["I have: tengo (from earlier)","add que for have to: tengo que","be: estar","here: aquí","later: más tarde"],"rules":["t30__que-have-to"],"track":30,"source":"extension","difficulty":2},{"id":"t30-x04","type":"sentence","prompt":"We are not going to stay because he must be very tired.","answer":"No vamos a quedarnos porque debe estar muy cansado.","steps":["we are not going to stay: no vamos a quedarnos","because: porque","he must: debe","be very tired: estar muy cansado"],"rules":["t30__quedarse-stay","t30__debo-must","t30__estar-forms"],"track":30,"source":"extension","difficulty":3}],"blurb":"Estar conjugation drilled with cómo/dónde questions, deber and tener que with estar","sectionIndex":4},{"id":"t31","label":"Track 31","tracks":[31],"rules":[{"id":"t31__como-es-vs-esta","family":"como-es-vs-esta","title":"cómo es vs cómo está (what's he like vs how's he doing)","explanation":"Cómo means how. Ask cómo está and you're asking about a state - how someone is doing right now. Ask cómo es and you're asking about a characteristic - what someone is like as a person.","examples":["¿Cómo está? -> how is he doing?","¿Cómo es? -> what is he like?"],"track":31},{"id":"t31__ser-forms","family":"ser-forms","title":"The forms of ser: soy, es, son, somos, eres","explanation":"Ser is the other word for to be, used for being (un ser is a being). I am is soy - it ends oy like estoy, one of only four verbs that use oy instead of o for I (voy, doy, estoy, soy). He/she/it/you(formal) is is es, they/you-guys are is son, and you work backwards from son to get we are: take off the ending that means they and bump on the one for we, giving somos. You(informal) are is the odd one out: eres.","examples":["I am: soy - yo soy","he/she/you(formal) is: es (él es, ella es)","they/you guys are: son - ellos son, ustedes son","son -> somos - we are, working backwards","you (informal) are: eres (tú eres)"],"track":31},{"id":"t31__extra-e","family":"extra-e","title":"The extra e at the start (estar, español...)","explanation":"Spanish can't start a word with st-, sp-, or s- plus another consonant the way Englis
