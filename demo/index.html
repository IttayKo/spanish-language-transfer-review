ddle e wears away: podría","they/you guys: podrían"],"rules":["t42__poder-contraction-podria"],"track":42,"source":"track"},{"id":"t42-11","type":"word","prompt":"we could","answer":"Podríamos","steps":["we: podríamos"],"rules":["t42__poder-contraction-podria"],"track":42,"source":"track"},{"id":"t42-12","type":"sentence","prompt":"Could you come to my house? (informal)","answer":"¿Podrías venir a mi casa?","steps":["could you: podrías","to come: venir","to my house: a mi casa (from earlier)"],"rules":["t42__poder-contraction-podria"],"track":42,"source":"track"},{"id":"t42-13","type":"sentence","prompt":"Could you tell me something? (informal)","answer":"¿Me podrías decir algo?","steps":["to say/tell: decir","could you tell me: me podrías decir","something: algo (from earlier)"],"rules":["t42__poder-contraction-podria"],"track":42,"source":"track","note":"Also fine as ¿Podrías decirme algo?"},{"id":"t42-14","type":"sentence","prompt":"Could you tell me if you want to come? (informal)","answer":"¿Podrías decirme si quieres venir?","steps":["could you tell me: podrías decirme","if: si (same word as yes, from earlier)","you want to come: quieres venir"],"rules":["t42__poder-contraction-podria"],"track":42,"source":"track"},{"id":"t42-x01","type":"sentence","prompt":"I would like to dance.","answer":"Me gustaría bailar.","steps":["I would like: me gustaría","to dance: bailar"],"rules":["t42__gustar-pleasing","t42__would-tense-ia"],"track":42,"source":"extension","difficulty":1},{"id":"t42-x02","type":"sentence","prompt":"You could go. (informal)","answer":"Podrías ir.","steps":["you could: podrías","to go: ir"],"rules":["t42__poder-contraction-podria"],"track":42,"source":"extension","difficulty":1},{"id":"t42-x03","type":"sentence","prompt":"We would like to see you. (informal)","answer":"Nos gustaría verte.","steps":["it would please: gustaría","to us: nos gustaría","to see you informal: verte"],"rules":["t42__gustar-pleasing","t42__would-tense-ia"],"track":42,"source":"extension","difficulty":2},{"id":"t42-x04","type":"sentence","prompt":"Could you tell me if you would like to come? (informal)","answer":"¿Podrías decirme si te gustaría venir?","steps":["could you tell me if: podrías decirme si","it would please you: te gustaría","to come: venir"],"rules":["t42__poder-contraction-podria","t42__gustar-pleasing","t42__would-tense-ia"],"track":42,"source":"extension","difficulty":2},{"id":"t42-x05","type":"sentence","prompt":"I would like to come with you, but it depends on if you can. (informal)","answer":"Me gustaría venir contigo, pero depende de si puedes.","steps":["I would like: me gustaría","to come with you informal: venir contigo","but: pero (from earlier)","it depends on if: depende de si","you can: puedes (from earlier)"],"rules":["t42__gustar-pleasing","t42__would-tense-ia","t42__conmigo-contigo","t42__depender-de"],"track":42,"source":"extension","difficulty":3}],"blurb":"gustar as to be pleasing to, and poder wearing down to podría for could","sectionIndex":5},{"id":"t43","label":"Track 43","tracks":[43],"rules":[{"id":"t43__would-tense-ia","family":"would-tense-ia","title":"Would: add -ía onto the whole verb","explanation":"Would works the same way as will but with its own key sound: -ía, stressed, stuck onto the full to-form of the verb for every verb type. The plain -ía form covers I, he, she, it and you (formal) all together; the other endings (-íamos, -ían, -ías) work the same way as for will.","examples":["Bailaría. - I would dance.","Bailaríamos. - We would dance.","Comería. - I would eat."],"track":41},{"id":"t43__should-deberia","family":"should-deberia","title":"Should: debería","explanation":"Deber (to owe, must) doesn't contract like poder or haber - just add -ía straight onto it: debería, deberías, deberíamos, deberían, which means should. After it, use the plain to form of the next verb directly, with no extra word for to, even though English inserts one after should.","examples":["deber + ía -> debería - I/he/she/you should","deberías venir - you should come","deberíamos hablar - we should speak"],"track":43},{"id":"t43__would-have-habria","family":"would-have-habria","title":"Would have: habría + the after-haber form","explanation":"Haber (to have) contracts before -ía the same way poder does: drop the last e and add -ía, giving habría, habrías, habríamos, habrían for would have. Follow it with the -ado/-ido form of the main verb (the same form you'd use after any version of haber, from an earlier track) to get I would have gone, we would have eaten, and so on.","examples":["haber -> habr- + ía -> habría","habría ido - I would have gone","habríamos podido ir - we would have been able to go","me habría gustado - I would have liked it, it would have pleased me"],"track":43}],"drills":[{"id":"t43-01","type":"word","prompt":"I would have (done something)","answer":"Habría","steps":["haber loses its last e before -ía, just like poder did"],"rules":["t43__would-have-habria"],"track":43,"source":"track"},{"id":"t43-02","type":"sentence","prompt":"I would have gone.","answer":"Habría ido.","steps":["I would have: habría","gone: to go is ir, drop -ir and add -ido - the version that follows any haber"],"rules":["t43__would-have-habria"],"track":43,"source":"track"},{"id":"t43-03","type":"sentence","prompt":"We would have been able to go.","answer":"Habríamos podido ir.","steps":["we would have: habríamos","been able: poder, dropped -er and added -ido, gives podido","go: ir, stays as the plain to form"],"rules":["t43__would-have-habria"],"track":43,"source":"track"},{"id":"t43-04","type":"sentence","prompt":"They would have come to eat.","answer":"Habrían venido a comer.","steps":["they would have: habrían","come: venir, dropped -ir and added -ido, gives venido","venir is a verb of motion so it links with a before the next verb","to eat: comer"],"rules":["t43__would-have-habria"],"track":43,"source":"track"},{"id":"t43-05","type":"sentence","prompt":"I would have liked it. (It would have pleased me.)","answer":"Me habría gustado.","steps":["take the Spanglish route: it would have pleased me","it would have: habría","pleased: gustar, dropped -ar and added -ado, gives gustado","me at the front: me habría gustado"],"rules":["t43__would-have-habria"],"track":43,"source":"track"},{"id":"t43-06","type":"sentence","prompt":"We would have liked them. (They would have pleased us.)","answer":"Nos habrían gustado.","steps":["Spanglish: they would have pleased us","they would have: habrían","pleased: gustado","us at the front: nos habrían gustado"],"rules":["t43__would-have-habria"],"track":43,"source":"track"},{"id":"t43-07","type":"word","prompt":"should (I / he / she / it / you formal)","answer":"Debería","steps":["deber (to owe/must) doesn't contract - just add -ía straight on"],"rules":["t43__should-deberia"],"track":43,"source":"track"},{"id":"t43-08","type":"sentence","prompt":"You should come to my house to eat. (informal)","answer":"Deberías venir a mi casa a comer.","steps":["you should: deberías","come: venir, stays as the plain to form, no extra word for to","to my house: a mi casa","to eat: a comer"],"rules":["t43__should-deberia"],"track":43,"source":"track","note":"Deberías venir a comer a mi casa also works - either order is fine."},{"id":"t43-09","type":"sentence","prompt":"We should speak.","answer":"Deberíamos hablar.","steps":["we should: deberíamos","speak: hablar stays as the plain to form"],"rules":["t43__should-deberia"],"track":43,"source":"track"},{"id":"t43-10","type":"sentence","prompt":"We should speak to him.","answer":"Deberíamos hablarle.","steps":["we should speak: deberíamos hablar","to him: le, joined onto the end of the infinitive (from earlier)"],"rules":["t43__should-deberia"],"track":43,"source":"track"},{"id":"t43-11","type":"sentence","prompt":"We should speak with her.","answer":"Deberíamos hablar con ella.","steps":["we should speak: deberíamos hablar","con ella clears up who - le could mean him, her, or you formal"],"rules":["t43__should-deberia"],"track":43,"source":"track"},{"id":"t43-12","type":"word","prompt":"I would give","answer":"Daría","steps":["dar (to give) is regular here - just add -ía"],"rules":["t43__would-tense-ia"],"track":43,"source":"track"},{"id":"t43-13","type":"sentence","prompt":"They would give me it.","answer":"Me lo darían.","steps":["they would give: darían","me and it both jump out to the front, in that order: me lo darían (from earlier)"],"rules":["t43__would-tense-ia"],"track":43,"source":"track"},{"id":"t43-x01","type":"sentence","prompt":"I would have eaten it.","answer":"Lo habría comido.","steps":["it jumps to the front: lo","I would have: habría","eaten: comer, drop -er, add -ido, gives comido"],"rules":["t43__would-have-habria"],"track":43,"source":"extension","difficulty":1},{"id":"t43-x02","type":"sentence","prompt":"You should speak to them. (informal)","answer":"Deberías hablarles.","steps":["you should speak: deberías hablar","to them: les, joined onto the infinitive"],"rules":["t43__should-deberia"],"track":43,"source":"extension","difficulty":1},{"id":"t43-x03","type":"sentence","prompt":"We would have liked to speak with him.","answer":"Nos habría gustado hablar con él.","steps":["Spanglish: it would have pleased us to speak with him","it would have pleased us: nos habría gustado","to speak: hablar","con él to say with him clearly"],"rules":["t43__would-have-habria"],"track":43,"source":"extension","difficulty":2},{"id":"t43-x04","type":"sentence","prompt":"Would you have liked to come and eat with us? (informal)","answer":"¿Te habría gustado venir a comer con nosotros?","steps":["to you: te","it would have pleased: habría gustado","to come: venir, a verb of motion so it takes a before the next verb","to eat: a comer","with us: con nosotros"],"rules":["t43__would-have-habria"],"track":43,"source":"extension","difficulty":3}],"blurb":"habría for would have, and debería for should","sectionIndex":5},{"id":"t44","label":"Track 44","tracks":[44],"rules":[{"id":"t44__ma-words-masculine","family":"ma-words-masculine","title":"Words ending -ma are masculine (from Greek)","explanation":"Nouns ending in a are normally feminine, but a small set of words ending -ma are actually masculine, because they came into Spanish from Greek neuter words that looked masculine. So you say el problema, el sistema, el programa, el clima, not la. A few others break the -o male / -a female pattern the same way without being Greek at all, like el planeta - those you just meet and keep.","examples":["el problema - the problem","el sistema - the system","el esquema - the outline, the diagram","el planeta - the planet"],"track":23},{"id":"t44__extra-e","family":"extra-e","title":"The extra e at the start (estar, español...)","explanation":"Spanish can't start a word with st-, sp-, or s- plus another consonant the way English can, so it slips an e onto the front. State becomes estar, Spanish becomes español, special becomes especial. Spot the English st-/sp-/sc- word and just add the e.","examples":["state -> estar","Spanish -> español","student -> estudiante","special -> especial","spatial -> espacial","strict -> estricto","spectacular -> espectacular"],"track":31},{"id":"t44__ar-to-ando","family":"ar-to-ando","title":"-ar verbs: the right-now -ing","explanation":"To build the '-ing' form of an -ar verb, take off the -ar and put -ando in its place. This form never stands alone in Spanish; it always pairs with estar (see estoy-ing-right-now).","examples":["hablar -> hablando -> estoy hablando","preparar -> preparando -> estoy preparando","comprar -> comprando -> estoy comprando"],"track":34},{"id":"t44__mano-o-feminine","family":"mano-o-feminine","title":"mano: the -o word that's feminine","explanation":"Mano (hand) ends in -o but is feminine - pretty much the only true exception to the -o-is-masculine pattern. (Foto and moto look like exceptions too, but they're shortenings of feminine words, la fotografía and la motocicleta, so they just kept la.)","examples":["la mano - the hand","las manos - the hands","esta mano - this hand"],"track":44},{"id":"t44__este-esta-to-ese-esa","family":"este-esta-to-ese-esa","title":"This to that: pull the t out","explanation":"Take the t out of este (this, masculine) or esta (this, feminine) and what's left, ese/esa, means that. It works the same for the plurals: estos/estas (these) become esos/esas (those).","examples":["este auto -> ese auto - this car -> that car","esta noche -> esa noche - this night -> that night","estas manos -> esas manos - these hands -> those hands"],"track":44},{"id":"t44__should-deberia","family":"should-deberia","title":"Should: debería","explanation":"Deber (to owe, must) doesn't contract like poder or haber - just add -ía straight onto it: debería, deberías, deberíamos, deberían, which means should. After it, use the plain to form of the next verb directly, with no extra word for to, even though English inserts one after should.","examples":["deber + ía -> debería - I/he/she/you should","deberías venir - you should come","deberíamos hablar - we should speak"],"track":43},{"id":"t44__estoy-ing-right-now","family":"estoy-ing-right-now","title":"Only use -ing for right now","explanation":"Estar always goes with the -ando/-iendo form, because being in the middle of doing something is a state. But this whole structure is reserved for what's happening in this exact moment. For the future or for habits, Spanish just uses the plain present tense, resisting the English urge to say '-ing' everywhere.","examples":["Lo preparo mañana (plain present, future) vs. Lo estoy preparando (right now)","Espero aquí vs. Estoy esperando aquí - right now"],"track":34},{"id":"t44__gustar-pleasing","family":"gustar-pleasing","title":"To like is really to be pleasing to (gustar)","explanation":"Gustar doesn't mean to like, it means to be pleasing. So I like it is really it is pleasing to me: me gusta. The verb agrees with the thing doing the pleasing, not with the person doing the liking - one thing is me gusta, several things is me gustan - and the person liking shows up as me, nos, etc. in front. Saying me gusto by mistake means I like myself.","examples":["Me gusta. - I like it / it is pleasing to me.","Me gustan. - I like them.","Me gustaría. - I would like / it would please me."],"track":42},{"id":"t44__would-tense-ia","family":"would-tense-ia","title":"Would: add -ía onto the whole verb","explanation":"Would works the same way as will but with its own key sound: -ía, stressed, stuck onto the full to-form of the verb for every verb type. The plain -ía form covers I, he, she, it and you (formal) all together; the other endings (-íamos, -ían, -ías) work the same way as for will.","examples":["Bailaría. - I would dance.","Bailaríamos. - We would dance.","Comería. - I would eat."],"track":41}],"drills":[{"id":"t44-01","type":"word","prompt":"the problem","answer":"El problema","steps":["problema ends in -a but came in from Greek, so it stays masculine: el problema"],"rules":["t44__ma-words-masculine"],"track":44,"source":"track"},{"id":"t44-02","type":"word","prompt":"the outline / diagram (scheme)","answer":"El esquema","steps":["scheme -> squema, then Spanish can't start s + consonant, so add e: esquema","another Greek -ma word, so it's masculine: el esquema"],"rules":["t44__extra-e","t44__ma-words-masculine"],"track":44,"source":"track"},{"id":"t44-03","type":"word","prompt":"the planets","answer":"Los planetas","steps":["planeta looks feminine but is masculine, so it's los, not las","add -s for the plural: los planetas"],"rules":["t44__ma-words-masculine"],"track":44,"source":"track"},{"id":"t44-04","type":"word","prompt":"that car (using auto)","answer":"Ese auto","steps":["este auto is this car; pull the t out of este to get ese"],"rules":["t44__este-esta-to-ese-esa"],"track":44,"source":"track"},{"id":"t44-05","type":"sentence","prompt":"I don't want that car, because it's very big.","answer":"No quiero ese auto, porque es muy grande.","steps":["I don't want: no quiero","that car: ese auto","because: porque","it's very big: es muy grande"],"rules":["t44__este-esta-to-ese-esa"],"track":44,"source":"track"},{"id":"t44-06","type":"word","prompt":"those nights","answer":"Esas noches","steps":["estas noches is these nights; pull the t out of estas to get esas"],"rules":["t44__este-esta-to-ese-esa"],"track":44,"source":"track"},{"id":"t44-07","type":"word","prompt":"the hand","answer":"La mano","steps":["mano ends in -o but is feminine, one of the very few true exceptions"],"rules":["t44__mano-o-feminine"],"track":44,"source":"track"},{"id":"t44-08","type":"sentence","prompt":"Can you give me a hand? (informal)","answer":"¿Me puedes dar una mano?","steps":["can you: puedes","give me: dar me - ¿me puedes dar...","a hand: una mano, feminine even though it ends in -o"],"rules":["t44__mano-o-feminine"],"track":44,"source":"track","note":"¿Puedes darme una mano? works the same way."},{"id":"t44-09","type":"sentence","prompt":"Could you give me a hand? (informal)","answer":"¿Me podrías dar una mano?","steps":["could is would can: podrías (from earlier)","give me: dar me","a hand: una mano"],"rules":["t44__would-tense-ia","t44__mano-o-feminine"],"track":44,"source":"track","note":"¿Podrías darme una mano? also works."},{"id":"t44-10","type":"sentence","prompt":"You guys should give us a hand.","answer":"Nos deberían dar una mano.","steps":["you guys should: deberían","give us: dar nos, jumps to the front - nos deberían dar","a hand: una mano"],"rules":["t44__should-deberia","t44__mano-o-feminine"],"track":44,"source":"track"},{"id":"t44-11","type":"sentence","prompt":"I am managing the problem.","answer":"Estoy manejando el problema.","steps":["I am: estoy","managing: manejar, drop -ar, add -ando, gives manejando","the problem: el problema"],"rules":["t44__ar-to-ando","t44__estoy-ing-right-now","t44__ma-words-masculine"],"track":44,"source":"track"},{"id":"t44-12","type":"sentence","prompt":"I'm taking a photo.","answer":"Estoy tomando una foto.","steps":["I am: estoy","taking: tomar, drop -ar, add -ando, gives tomando","a photo: una foto - foto is short for fotografía, so it stays feminine"],"rules":["t44__ar-to-ando","t44__estoy-ing-right-now"],"track":44,"source":"track"},{"id":"t44-13","type":"sentence","prompt":"I would like to take a photo, but I don't have my camera.","answer":"Me gustaría tomar una foto, pero no tengo mi cámara.","steps":["it would please me: me gustaría","to take a photo: tomar una foto","but I don't have my camera: pero no tengo mi cámara"],"rules":["t44__gustar-pleasing","t44__would-tense-ia"],"track":44,"source":"track"},{"id":"t44-x01","type":"sentence","prompt":"I don't want that system.","answer":"No quiero ese sistema.","steps":["I don't want: no quiero","that: sistema looks feminine but is masculine, so ese not esa","system: sistema"],"rules":["t44__ma-words-masculine","t44__este-esta-to-ese-esa"],"track":44,"source":"extension","difficulty":1},{"id":"t44-x02","type":"sentence","prompt":"I am taking the photo.","answer":"Estoy tomando la foto.","steps":["I am: estoy","taking: tomando","the photo: la foto"],"rules":["t44__ar-to-ando","t44__estoy-ing-right-now"],"track":44,"source":"extension","difficulty":1},{"id":"t44-x03","type":"sentence","prompt":"Would you give me a hand with the problem? (informal)","answer":"¿Me darías una mano con el problema?","steps":["would you give me: me darías","a hand: una mano","with the problem: con el problema, masculine despite the -a"],"rules":["t44__would-tense-ia","t44__mano-o-feminine","t44__ma-words-masculine"],"track":44,"source":"extension","difficulty":2},{"id":"t44-x04","type":"sentence","prompt":"We should give them a hand with that problem tonight.","answer":"Deberíamos darles una mano con ese problema esta noche.","steps":["we should: deberíamos","give them: darles","a hand: una mano","with that problem: con ese problema - problema stays masculine","tonight: esta noche"],"rules":["t44__should-deberia","t44__mano-o-feminine","t44__ma-words-masculine","t44__este-esta-to-ese-esa"],"track":44,"source":"extension","difficulty":3}],"blurb":"Greek -ma words that stay masculine, la mano, and este/esta losing its t","sectionIndex":5},{"id":"t45","label":"Track 45","tracks":[45],"rules":[{"id":"t45__gustar-pleasing","family":"gustar-pleasing","title":"To like is really to be pleasing to (gustar)","explanation":"Gustar doesn't mean to like, it means to be pleasing. So I like it is really it is pleasing to me: me gusta. The verb agrees with the thing doing the pleasing, not with the person doing the liking - one thing is me gusta, several things is me gustan - and the person liking shows up as me, nos, etc. in front. Saying me gusto by mistake means I like myself.","examples":["Me gusta. - I like it / it is pleasing to me.","Me gustan. - I like them.","Me gustaría. - I would like / it would please me."],"track":42},{"id":"t45__gustar-le-pattern","family":"gustar-le-pattern","title":"The gustar family, and why they take le and les","explanation":"gustar isn't alone. interesar (to interest) and parecer (to seem) are built the same way, and all three are worth storing as to be pleasing to, to be interesting to, to seem to - because that 'to' is what decides the small word. The person is on the receiving end of to, not being acted on directly, so it's le and les, never lo, la, los, las.","examples":["nos gusta - it is pleasing to us, we like it","les gustan - they are pleasing to them, they like them","me interesa - it is interesting to me","me parece - it seems to me"],"track":45},{"id":"t45__poner-pose-family","family":"poner-pose-family","title":"English -pose becomes Spanish poner","explanation":"Just like -tain maps onto tener, English verbs ending in -pose map onto poner (to put) in Spanish: compose -> componer, suppose -> suponer, impose -> imponer, expose -> exponer, oppose -> oponer. They all share poner's irregular I-form g: compongo, supongo, and so on.","examples":["componer - to compose","suponer - to suppose -> supongo - I suppose","oponer - to oppose -> opongo - I oppose"],"track":14},{"id":"t45__le-for-on-it","family":"le-for-on-it","title":"On it / to it: use le, not lo","explanation":"When it means on it, to it, or from it rather than a direct object, use le (or les for them), not lo/la. This shows up with poner: instead of saying salt on it, you say le sal - put it salt.","examples":["quiero ponerle sal - I want to put salt on it","me gustaría ponerles un poco más sal - I would like to put a little more salt on them"],"track":45},{"id":"t45__que-that-obligatory","family":"que-that-obligatory","title":"That (que) can't be dropped","explanation":"After a phrase like it seems to me, English can drop that (\"it seems to me he doesn't like it\"), but Spanish always keeps que. Building the habit of always saying que actually helps you think the sentence through.","examples":["me parece que... - it seems to me that...","me parece que no quiere salir - it seems to me that he doesn't want to go out"],"track":45}],"drills":[{"id":"t45-01","type":"sentence","prompt":"We like it.","answer":"Nos gusta.","steps":["Spanglish first: it is pleasing to us","to us: nos","is pleasing: gusta"],"rules":["t45__gustar-pleasing"],"track":45,"source":"track"},{"id":"t45-02","type":"sentence","prompt":"They like them. (they are pleasing to them)","answer":"Les gustan.","steps":["to them: les","are pleasing: gustan, matching the plural them"],"rules":["t45__gustar-pleasing","t45__gustar-le-pattern"],"track":45,"source":"track"},{"id":"t45-03","type":"sentence","prompt":"He likes them. (they are pleasing to him)","answer":"Le gustan.","steps":["to him: le","are pleasing: gustan"],"rules":["t45__gustar-pleasing","t45__gustar-le-pattern"],"track":45,"source":"track"},{"id":"t45-04","type":"sentence","prompt":"It interests me.","answer":"Me interesa.","steps":["store interesar as to be interesting to, same shape as gustar","to me: me","is interesting: interesa"],"rules":["t45__gustar-le-pattern"],"track":45,"source":"track"},{"id":"t45-05","type":"sentence","prompt":"Doesn't it interest you? (informal)","answer":"¿No te interesa?","steps":["no goes at the front: no","to you: te","is interesting: interesa"],"rules":["t45__gustar-le-pattern"],"track":45,"source":"track"},{"id":"t45-06","type":"sentence","prompt":"Does it interest her to go out to dance tonight?","answer":"¿Le interesa salir a bailar esta noche?","steps":["to her: le","is interesting: interesa","to go out: salir, a verb of coming and going so it takes a","to dance: bailar","tonight: esta noche"],"rules":["t45__gustar-le-pattern"],"track":45,"source":"track"},{"id":"t45-07","type":"sentence","prompt":"Would it interest you? (informal)","answer":"¿Te interesaría?","steps":["to you: te","would be interesting: interesar + ía, gives interesaría"],"rules":["t45__gustar-le-pattern"],"track":45,"source":"track"},{"id":"t45-08","type":"sentence","prompt":"It seems that she doesn't want to go out tonight.","answer":"Me parece que no quiere salir esta noche.","steps":["it seems to me: me parece","that: que - never dropped in Spanish, even though English can drop it","she doesn't want to go out tonight: no quiere salir esta noche"],"rules":["t45__gustar-le-pattern","t45__que-that-obligatory"],"track":45,"source":"track"},{"id":"t45-09","type":"sentence","prompt":"It doesn't seem good to her.","answer":"No le parece bien.","steps":["no at the front","to her: le","seems well: parece bien - Spanish says well (bien) here, not good"],"rules":["t45__gustar-le-pattern"],"track":45,"source":"track"},{"id":"t45-10","type":"sentence","prompt":"It would interest me to see it.","answer":"Me interesaría verlo.","steps":["to me: me","would be interesting: interesaría","to see it: verlo, it joined onto the end"],"rules":["t45__gustar-le-pattern"],"track":45,"source":"track"},{"id":"t45-11","type":"word","prompt":"to compose","answer":"Componer","steps":["-pose becomes poner","com- here is really con- (with), so componer literally means with-putting"],"rules":["t45__poner-pose-family"],"track":45,"source":"track"},{"id":"t45-12","type":"word","prompt":"to suppose","answer":"Suponer","steps":["-pose becomes poner: suponer"],"rules":["t45__poner-pose-family"],"track":45,"source":"track"},{"id":"t45-13","type":"word","prompt":"to impose","answer":"Imponer","steps":["-pose becomes poner: imponer"],"rules":["t45__poner-pose-family"],"track":45,"source":"track"},{"id":"t45-14","type":"sentence","prompt":"I would like to put salt on it.","answer":"Me gustaría ponerle sal.","steps":["it would please me: me gustaría","to put: poner","on it: le, not lo, joined onto the end - ponerle","salt: sal"],"rules":["t45__le-for-on-it","t45__gustar-le-pattern"],"track":45,"source":"track"},{"id":"t45-15","type":"sentence","prompt":"I would like to put a little more salt on them.","answer":"Me gustaría ponerles un poco más de sal.","steps":["it would please me: me gustaría","to put on them: ponerles","a little more: un poco más","of salt: de sal"],"rules":["t45__le-for-on-it"],"track":45,"source":"track","note":"The recording says un poco más sal without the de; un poco más de sal is the form you'll hear day to day."},{"id":"t45-x01","type":"sentence","prompt":"It doesn't interest me.","answer":"No me interesa.","steps":["no at the front","to me: me","is interesting: interesa"],"rules":["t45__gustar-le-pattern"],"track":45,"source":"extension","difficulty":1},{"id":"t45-x02","type":"sentence","prompt":"It seems good to us.","answer":"Nos parece bien.","steps":["to us: nos","seems well: parece bien"],"rules":["t45__gustar-le-pattern"],"track":45,"source":"extension","difficulty":1},{"id":"t45-x03","type":"sentence","prompt":"It seems to me that it interests them.","answer":"Me parece que les interesa.","steps":["it seems to me: me parece","that: que","it interests them: les interesa"],"rules":["t45__gustar-le-pattern","t45__que-that-obligatory"],"track":45,"source":"extension","difficulty":2},{"id":"t45-x04","type":"sentence","prompt":"Would you like to put a little more salt on them? (informal)","answer":"¿Te gustaría ponerles un poco más de sal?","steps":["would it please you: te gustaría","to put on them: ponerles","a little more salt: un poco más de sal"],"rules":["t45__gustar-le-pattern","t45__le-for-on-it"],"track":45,"source":"extension","difficulty":2,"note":"The recording says un poco más sal without the de; un poco más de sal is the form you'll hear day to day."},{"id":"t45-x05","type":"sentence","prompt":"It would interest me to go out to dance tonight, but I don't want to.","answer":"Me interesaría salir a bailar esta noche, pero no quiero.","steps":["it would interest me: me interesaría","to go out: salir, takes a before the next verb","to dance tonight: a bailar esta noche","but I don't want to: pero no quiero"],"rules":["t45__gustar-le-pattern"],"track":45,"source":"extension","difficulty":3}],"blurb":"The gustar family: interesar and parecer with le/les, and the que you can't drop","sectionIndex":5},{"id":"t46","label":"Track 46","tracks":[46],"rules":[{"id":"t46__three-pasts","family":"three-pasts","title":"Three pasts, and every English past fits one of them","explanation":"English has a dozen ways to talk about the past - I ate, I have eaten, I was eating, I used to eat, I would eat one every week. Spanish has three, and every one of those English sentences drops into one of them. There's the have-eaten past you already build with haber. There's a line in the past - was eating, used to eat, would eat back then - anything ongoing, stretched out. And there's a dot in the past - I ate, finished, one point. Before you build any past sentence, decide which of the three you're in; that decision is most of the work.","examples":["he comido - the have-past, already yours","comía - the line: I was eating, I used to eat","comí - the dot: I ate, and it's done (still to come)"],"track":46},{"id":"t46__haber-perfect","family":"haber-perfect","title":"he/has/ha/hemos/han for have (done something)","explanation":"Haber (silent h) is the have that builds I have done/eaten/gone - not tener, which is only for possession and have-to. Its forms come from the two vowel sounds inside haber, a and e: he (I have) and hemos (we have) share the e; ha (he/she/it/you formal have), has (you informal have), and han (they/you plural have) share the a.","examples":["he - I have","hemos - we have","ha - he/she has","has - you have","han - they have"],"track":21},{"id":"t46__perfect-ado-ido","family":"perfect-ado-ido","title":"The have-done form: -ado for -ar, -ido for -er and -ir","explanation":"You already take the -ar off and put -ado on. The other half is just as flat: take the -er or -ir off and put -ido on. -er and -ir verbs behave the same here, as they do nearly everywhere outside the we-form. Then put he, has, ha, hemos or han in front of it.","examples":["terminar -> terminado -> he terminado - I have finished","perder -> perdido; vender -> vendido","venir -> venido, as in bienvenido, well-come"],"track":22},{"id":"t46__would-have-habria","family":"would-have-habria","title":"Would have: habría + the after-haber form","explanation":"Haber (to have) contracts before -ía the same way poder does: drop the last e and add -ía, giving habría, habrías, habríamos, habrían for would have. Follow it with the -ado/-ido form of the main verb (the same form you'd use after any version of haber, from an earlier track) to get I would have gone, we would have eaten, and so on.","examples":["haber -> habr- + ía -> habría","habría ido - I would have gone","habríamos podido ir - we would have been able to go","me habría gustado - I would have liked it, it would have pleased me"],"track":43},{"id":"t46__line-past-ar","family":"line-past-ar","title":"The line in the past (-ar verbs)","explanation":"For an ongoing past - was doing, used to do - take off -ar and put -aba. I, he, she, it and you (formal) all share hablaba; add n for they/you-guys (hablaban) and add mos for we, keeping the accent where it was (hablábamos).","examples":["hablar -> hablaba - I/he/she/you-formal","hablar -> hablaban - they/you-guys","hablar -> hablábamos - we"],"track":46}],"drills":[{"id":"t46-01","type":"sentence","prompt":"I have eaten.","answer":"He comido.","steps":["I have: he","eat -> eaten: comer, take off -er, put -ido: comido"],"rules":["t46__three-pasts","t46__haber-perfect","t46__perfect-ado-ido"],"track":46,"source":"track"},{"id":"t46-02","type":"sentence","prompt":"I have spoken.","answer":"He hablado.","steps":["I have: he","speak -> spoken: hablar, take off -ar, put -ado: hablado"],"rules":["t46__three-pasts","t46__haber-perfect","t46__perfect-ado-ido"],"track":46,"source":"track"},{"id":"t46-03","type":"sentence","prompt":"I haven't been able to eat.","answer":"No he podido comer.","steps":["no at the front","I have: he","to be able -> been able: poder -> podido","to eat stays in the \"to\" form after podido: comer"],"rules":["t46__haber-perfect","t46__perfect-ado-ido"],"track":46,"source":"track"},{"id":"t46-04","type":"word","prompt":"I would have (done something)","answer":"Habría","steps":["haber in would time gives haberia, but the e falls out: habría"],"rules":["t46__would-have-habria"],"track":46,"source":"track"},{"id":"t46-05","type":"sentence","prompt":"I would have gone out.","answer":"Habría salido.","steps":["I would have: habría","to leave/go out -> gone out: salir -> salido"],"rules":["t46__would-have-habria"],"track":46,"source":"track"},{"id":"t46-06","type":"sentence","prompt":"I wouldn't have been able to go out.","answer":"No habría podido salir.","steps":["no at the front","I would have: habría","to be able -> been able: podido","to go out stays as salir"],"rules":["t46__would-have-habria"],"track":46,"source":"track"},{"id":"t46-07","type":"word","prompt":"I was speaking / I used to speak","answer":"Hablaba","steps":["hablar, take off -ar, put -aba"],"rules":["t46__three-pasts","t46__line-past-ar"],"track":46,"source":"track","note":"The same word also covers he/she/it was speaking and you (formal) were speaking."},{"id":"t46-08","type":"word","prompt":"you were speaking (informal)","answer":"Hablabas","steps":["hablaba + s for informal you"],"rules":["t46__line-past-ar"],"track":46,"source":"track"},{"id":"t46-09","type":"word","prompt":"we were speaking","answer":"Hablábamos","steps":["hablaba + mos for we, accent stays on the a"],"rules":["t46__line-past-ar"],"track":46,"source":"track"},{"id":"t46-10","type":"sentence","prompt":"I was waiting for you. (informal)","answer":"Te esperaba.","steps":["you (informal): te, out at the front (from earlier)","to wait: esperar -> esperaba"],"rules":["t46__line-past-ar"],"track":46,"source":"track"},{"id":"t46-11","type":"sentence","prompt":"I was waiting for you. (formal, to a man)","answer":"Lo esperaba.","steps":["you (formal, male): lo, out at the front (from earlier)","to wait: esperaba"],"rules":["t46__line-past-ar"],"track":46,"source":"track","note":"To a woman: La esperaba."},{"id":"t46-12","type":"sentence","prompt":"We were waiting for you guys. (or: for them)","answer":"Los esperábamos.","steps":["you guys / them: los, out at the front (from earlier)","to wait, we form: esperábamos"],"rules":["t46__line-past-ar"],"track":46,"source":"track"},{"id":"t46-13","type":"sentence","prompt":"They were trying to find it.","answer":"Intentaban encontrarlo.","steps":["they were trying: intentar -> intentaban","to find it: encontrar + lo stuck on the end: encontrarlo"],"rules":["t46__line-past-ar"],"track":46,"source":"track"},{"id":"t46-14","type":"sentence","prompt":"They were trying to find it for me.","answer":"Intentaban encontrármelo.","steps":["they were trying: intentaban","to find me it: encontrar + me + lo stuck on the end, in that order: encontrármelo (accent added to keep the stress)"],"rules":["t46__line-past-ar"],"track":46,"source":"track","note":"Also fine, with emphasis on \"for me\": Intentaban encontrarlo para mí."},{"id":"t46-x01","type":"sentence","prompt":"I have lived here.","answer":"He vivido aquí.","steps":["I have: he","live -> lived: vivir, take off -ir, put -ido: vivido","here: aquí (from earlier)"],"rules":["t46__perfect-ado-ido"],"track":46,"source":"extension","difficulty":1},{"id":"t46-x02","type":"word","prompt":"we were dancing","answer":"Bailábamos","steps":["bailar, take off -ar, put -aba, add mos for we: bailábamos"],"rules":["t46__line-past-ar"],"track":46,"source":"extension","difficulty":1},{"id":"t46-x03","type":"sentence","prompt":"I would have wanted it.","answer":"Lo habría querido.","steps":["it: lo, out at the front (from earlier)","I would have: habría","want -> wanted: querer -> querido"],"rules":["t46__would-have-habria","t46__perfect-ado-ido"],"track":46,"source":"extension","difficulty":2},{"id":"t46-x04","type":"sentence","prompt":"They weren't waiting for us.","answer":"No nos esperaban.","steps":["no at the front","us: nos, out at the front (from earlier)","they were waiting: esperaban"],"rules":["t46__line-past-ar"],"track":46,"source":"extension","difficulty":2},{"id":"t46-x05","type":"sentence","prompt":"We wouldn't have been able to find you here. (informal)","answer":"No te habríamos podido encontrar aquí.","steps":["no at the front","you: te, out at the front (from earlier)","we would have: habría + mos, same as the we-ending elsewhere: habríamos","been able: podido","to find: encontrar","here: aquí (from earlier)"],"rules":["t46__would-have-habria","t46__perfect-ado-ido"],"track":46,"source":"extension","difficulty":3}],"blurb":"The three pasts laid out, then the line in the past with -aba","sectionIndex":6},{"id":"t47","label":"Track 47","tracks":[47],"rules":[{"id":"t47__noun-to-verb-r","family":"noun-to-verb-r","title":"Make a verb out of a noun by putting -r on the end","explanation":"You've been doing this with -ación words; it isn't limited to them. Take a noun that already ends in a vowel and stick an -r on: la cocina (the kitchen) gives cocinar, to cook. English kept the same root in concoction - literally 'with cooking'.","examples":["la cocina -> cocinar - to cook","cocinar -> cocino - I cook","concoction = con + cocción, with-cooking"],"track":25},{"id":"t47__este-esta-to-ese-esa","family":"este-esta-to-ese-esa","title":"This to that: pull the t out","explanation":"Take the t out of este (this, masculine) or esta (this, feminine) and what's left, ese/esa, means that. It works the same for the plurals: estos/estas (these) become esos/esas (those). There's a logic under it: este carries the /e/ of el, and estos carries the /os/ of los - el coche, este coche; los coches, estos coches.","examples":["este auto -> ese auto - this car -> that car","esta noche -> esa noche - this night -> that night","estas manos -> esas manos - these hands -> those hands","el coche -> este coche","los coches -> estos coches"],"track":44},{"id":"t47__self-se","family":"self-se","title":"It happens to itself: se for it breaks, it sells","explanation":"When a verb's action isn't going out to anything else - it breaks, it burns, it sells, it changes - Spanish shows this with se in front of the verb, wrapping the sentence up without naming what's being acted on. Without se, the sentence sounds unfinished, like it's still waiting to hear what got broken.","examples":["romper -> se rompe - it breaks/gets broken","quemar -> la cena se quemaba - the dinner was burning","vender -> se vende - it sells itself / for sale"],"track":47},{"id":"t47__line-past-ar","family":"line-past-ar","title":"The line in the past (-ar verbs)","explanation":"For an ongoing past - was doing, used to do - take off -ar and put -aba. I, he, she, it and you (formal) all share hablaba; add n for they/you-guys (hablaban) and add mos for we, keeping the accent where it was (hablábamos).","examples":["hablar -> hablaba - I/he/she/you-formal","hablar -> hablaban - they/you-guys","hablar -> hablábamos - we"],"track":46}],"drills":[{"id":"t47-01","type":"word","prompt":"to dine / to have dinner","answer":"Cenar","steps":["la cena, the dinner, turned into a verb: cenar"],"rules":["t47__noun-to-verb-r"],"track":47,"source":"track"},{"id":"t47-02","type":"word","prompt":"I was having dinner / I used to have dinner","answer":"Cenaba","steps":["cenar, take off -ar, put -aba"],"rules":["t47__line-past-ar"],"track":47,"source":"track"},{"id":"t47-03","type":"sentence","prompt":"He was burning the dinner.","answer":"Él quemaba la cena.","steps":["he: él","to burn: quemar -> quemaba","the dinner: la cena"],"rules":["t47__line-past-ar"],"track":47,"source":"track"},{"id":"t47-04","type":"sentence","prompt":"The dinner was burning. / The dinner was getting burnt.","answer":"La cena se quemaba.","steps":["the dinner: la cena","nothing else is named as burnt, so it burns itself: se quemaba"],"rules":["t47__self-se","t47__line-past-ar"],"track":47,"source":"track","note":"Word order is flexible: Se quemaba la cena works just as well."},{"id":"t47-05","type":"sentence","prompt":"I get burnt in the sun.","answer":"Me quemo en el sol.","steps":["nothing else is named as burnt, so it's me myself: me quemo","in: en","the sun (masculine): el sol"],"rules":["t47__self-se"],"track":47,"source":"track"},{"id":"t47-06","type":"sentence","prompt":"The sun burns me.","answer":"El sol me quema.","steps":["the sun: el sol","burns me: me quema - complete without se, because me tells us what's burnt"],"rules":["t47__self-se"],"track":47,"source":"track","note":"Also fine as Me quema el sol."},{"id":"t47-07","type":"sentence","prompt":"I break it.","answer":"Lo rompo.","steps":["it: lo, out at the front (from earlier)","to break: romper -> rompo"],"rules":["t47__self-se"],"track":47,"source":"track"},{"id":"t47-08","type":"sentence","prompt":"It breaks all the time. / It gets broken all the time.","answer":"Se rompe todo el tiempo.","steps":["nothing else is named as broken, so it breaks itself: se rompe","all the time: todo el tiempo"],"rules":["t47__self-se"],"track":47,"source":"track"},{"id":"t47-09","type":"sentence","prompt":"They break all the time.","answer":"Se rompen todo el tiempo.","steps":["they break themselves: se rompen","all the time: todo el tiempo"],"rules":["t47__self-se"],"track":47,"source":"track"},{"id":"t47-10","type":"word","prompt":"this car","answer":"Este coche","steps":["el coche carries its /e/ into este: este coche"],"rules":["t47__este-esta-to-ese-esa"],"track":47,"source":"track"},{"id":"t47-11","type":"word","prompt":"these cars","answer":"Estos coches","steps":["los coches carries its /os/ into estos: estos coches"],"rules":["t47__este-esta-to-ese-esa"],"track":47,"source":"track"},{"id":"t47-12","type":"word","prompt":"that car (using coche)","answer":"Ese coche","steps":["este coche is this car; pluck the t out of este: ese coche"],"rules":["t47__este-esta-to-ese-esa"],"track":47,"source":"track"},{"id":"t47-13","type":"word","prompt":"those cars","answer":"Esos coches","steps":["estos coches is these cars; pluck the t out of estos: esos coches"],"rules":["t47__este-esta-to-ese-esa"],"track":47,"source":"track"},{"id":"t47-14","type":"sentence","prompt":"Those ones break all the time.","answer":"Esos se rompen todo el tiempo.","steps":["those ones (masculine/mixed): esos","nothing else is named as broken, so they break themselves: se rompen","all the time: todo el tiempo"],"rules":["t47__este-esta-to-ese-esa","t47__self-se"],"track":47,"source":"track"},{"id":"t47-x01","type":"sentence","prompt":"I want this car.","answer":"Quiero este coche.","steps":["I want: quiero (from earlier)","this car: este coche"],"rules":["t47__este-esta-to-ese-esa"],"track":47,"source":"extension","difficulty":1},{"id":"t47-x02","type":"sentence","prompt":"It changes all the time.","answer":"Se cambia todo el tiempo.","steps":["nothing else is named as changed, so it changes itself: se cambia","all the time: todo el tiempo"],"rules":["t47__self-se"],"track":47,"source":"extension","difficulty":1},{"id":"t47-x03","type":"sentence","prompt":"Those cars break all the time.","answer":"Esos autos se rompen todo el tiempo.","steps":["those cars: esos autos","they break themselves: se rompen","all the time: todo el tiempo"],"rules":["t47__este-esta-to-ese-esa","t47__self-se"],"track":47,"source":"extension","difficulty":2},{"id":"t47-x04","type":"sentence","prompt":"This car was burning all the time and it was breaking.","answer":"Este auto se quemaba todo el tiempo y se rompía.","steps":["this car: este auto","it burns itself, ongoing past: se quemaba","all the time: todo el tiempo","and: y (from earlier)","it breaks itself, ongoing past: se rompía"],"rules":["t47__este-esta-to-ese-esa","t47__self-se","t47__line-past-ar"],"track":47,"source":"extension","difficulty":3}],"blurb":"Imperfect -aba tense, reflexive se for passive/impersonal breaking-burning verbs","sectionIndex":6},{"id":"t48","label":"Track 48","tracks":[48],"rules":[{"id":"t48__quedar-left","family":"quedar-left","title":"Having something left (quedar)","explanation":"To say you have some left, say it in reverse: it remains to me. Me queda uno is I have one left; the verb agrees with what's left, not with the person, so two things left is me quedan dos, and to him/her/you-formal it's le queda(n).","examples":["me queda uno - I have one left","me quedan dos - I have two left","le quedan dos - he/she has two left"],"track":48},{"id":"t48__quedarse-stay","family":"quedarse-stay","title":"Remain myself = stay (me quedo)","explanation":"Quedar means to remain or be left over. To say I stay, you say I remain myself: me quedo. The reflexive word (me/te/nos) goes before the changed verb, same as always, and it's not optional here - you need it to get the meaning of stay.","examples":["me quedo - I stay","se queda - he/she stays","no nos quedábamos aquí - we weren't staying here"],"track":25},{"id":"t48__line-past-er-ir","family":"line-past-er-ir","title":"The line in the past (-er/-ir verbs)","explanation":"For -er/-ir verbs, take off the -er/-ir and put -ía for the ongoing past - the same sound as would, but here you strip the ending first instead of adding onto the full verb. Comería (I would eat) and comía (I was eating) are built the same way, just from different starting points.","examples":["comer -> comía - I was eating","vender -> vendía - I was selling","romper -> rompía (I was breaking), compare romper -> rompería (I would break)"],"track":48},{"id":"t48__self-se","family":"self-se","title":"It happens to itself: se for it breaks, it sells","explanation":"When a verb's action isn't going out to anything else - it breaks, it burns, it sells, it changes - Spanish shows this with se in front of the verb, wrapping the sentence up without naming what's being acted on. Without se, the sentence sounds unfinished, like it's still waiting to hear what got broken.","examples":["romper -> se rompe - it breaks/gets broken","quemar -> la cena se quemaba - the dinner was burning","vender -> se vende - it sells itself / for sale"],"track":47},{"id":"t48__would-have-habria","family":"would-have-habria","title":"Would have: habría + the after-haber form","explanation":"Haber (to have) contracts before -ía the same way poder does: drop the last e and add -ía, giving habría, habrías, habríamos, habrían for would have. Follow it with the -ado/-ido form of the main verb (the same form you'd use after any version of haber, from an earlier track) to get I would have gone, we would have eaten, and so on.","examples":["haber -> habr- + ía -> habría","habría ido - I would have gone","habríamos podido ir - we would have been able to go","me habría gustado - I would have liked it, it would have pleased me"],"track":43},{"id":"t48__perfect-ado-ido","family":"perfect-ado-ido","title":"The have-done form: -ado for -ar, -ido for -er and -ir","explanation":"You already take the -ar off and put -ado on. The other half is just as flat: take the -er or -ir off and put -ido on. -er and -ir verbs behave the same here, as they do nearly everywhere outside the we-form. Then put he, has, ha, hemos or han in front of it.","examples":["terminar -> terminado -> he terminado - I have finished","perder -> perdido; vender -> vendido","venir -> venido, as in bienvenido, well-come"],"track":22},{"id":"t48__line-past-ar","family":"line-past-ar","title":"The line in the past (-ar verbs)","explanation":"For an ongoing past - was doing, used to do - take off -ar and put -aba. I, he, she, it and you (formal) all share hablaba; add n for they/you-guys (hablaban) and add mos for we, keeping the accent where it was (hablábamos).","examples":["hablar -> hablaba - I/he/she/you-formal","hablar -> hablaban - they/you-guys","hablar -> hablábamos - we"],"track":46},{"id":"t48__would-tense-ia","family":"would-tense-ia","title":"Would: add -ía onto the whole verb","explanation":"Would works the same way as will but with its own key sound: -ía, stressed, stuck onto the full to-form of the verb for every verb type. The plain -ía form covers I, he, she, it and you (formal) all together; the other endings (-íamos, -ían, -ías) work the same way as for will.","examples":["Bailaría. - I would dance.","Bailaríamos. - We would dance.","Comería. - I would eat."],"track":41}],"drills":[{"id":"t48-01","type":"word","prompt":"I was eating / I used to eat","answer":"Comía","steps":["comer, take off -er, put -ía"],"rules":["t48__line-past-er-ir"],"track":48,"source":"track","note":"Same sound as would (comería), but here the ending is stripped off first instead of added onto comer."},{"id":"t48-02","type":"sentence","prompt":"I was selling it.","answer":"Lo vendía.","steps":["it: lo, out at the front (from earlier)","vender, take off -er, put -ía: vendía"],"rules":["t48__line-past-er-ir"],"track":48,"source":"track"},{"id":"t48-03","type":"sentence","prompt":"It sells itself. / It's for sale.","answer":"Se vende.","steps":["nothing else is named as sold, so it sells itself: se vende"],"rules":["t48__self-se"],"track":48,"source":"track"},{"id":"t48-04","type":"sentence","prompt":"It was for sale. / It was selling itself.","answer":"Se vendía.","steps":["it sells itself: se vende","put into the line-in-the-past sound for -er/-ir: se vendía"],"rules":["t48__self-se","t48__line-past-er-ir"],"track":48,"source":"track","note":"It would be for sale: Se vendería."},{"id":"t48-05","type":"sentence","prompt":"It was breaking. (by itself)","answer":"Se rompía.","steps":["nothing else is named as broken, so it breaks itself: se rompe","put into the line-in-the-past sound for -er/-ir: se rompía"],"rules":["t48__self-se","t48__line-past-er-ir"],"track":48,"source":"track"},{"id":"t48-06","type":"sentence","prompt":"They would break it.","answer":"Lo romperían.","steps":["it: lo, out at the front (from earlier)","they would break: romper in would time (from earlier): romperían"],"rules":["t48__would-tense-ia"],"track":48,"source":"track","note":"Compare to the next drill: romperían (would) vs rompían (was breaking) - same ending, different starting point."},{"id":"t48-07","type":"sentence","prompt":"They were breaking it.","answer":"Lo rompían.","steps":["it: lo, out at the front (from earlier)","romper, take off -er, put -ían for they: rompían"],"rules":["t48__line-past-er-ir"],"track":48,"source":"track"},{"id":"t48-08","type":"sentence","prompt":"It's going to break.","answer":"Se va a romper.","steps":["nothing else is named as broken, so se wraps it up","it's going to: va a (from earlier)","break: romper"],"rules":["t48__self-se"],"track":48,"source":"track","note":"Also fine as Va a romperse."},{"id":"t48-09","type":"sentence","prompt":"How is it said? / How do you say it?","answer":"¿Cómo se dice?","steps":["how: cómo","nothing else is named, so it says itself: se dice, from decir - it says: dice"],"rules":["t48__self-se"],"track":48,"source":"track","note":"Not ¿Cómo dices? - that asks how you personally say something."},{"id":"t48-10","type":"sentence","prompt":"I have one left.","answer":"Me queda uno.","steps":["say it backwards: it remains to me: me queda","one: uno"],"rules":["t48__quedar-left"],"track":48,"source":"track"},{"id":"t48-11","type":"sentence","prompt":"I have two left.","answer":"Me quedan dos.","steps":["they remain to me: me quedan, agreeing with what's left, not with me","two: dos"],"rules":["t48__quedar-left"],"track":48,"source":"track","note":"None left: No me queda / No me quedan."},{"id":"t48-12","type":"sentence","prompt":"She has two left.","answer":"Le quedan dos.","steps":["to her: le","they remain: quedan","two: dos"],"rules":["t48__quedar-left"],"track":48,"source":"track"},{"id":"t48-13","type":"word","prompt":"I stay / I remain myself","answer":"Me quedo","steps":["quedar with the self-structure on it: me quedo"],"rules":["t48__quedarse-stay"],"track":48,"source":"track"},{"id":"t48-14","type":"sentence","prompt":"I wasn't staying here.","answer":"No me quedaba aquí.","steps":["no at the front","I stay: me quedo -> ongoing past, -aba works for I/he/she/it/you-formal: me quedaba","here: aquí (from earlier)"],"rules":["t48__quedarse-stay","t48__line-past-ar"],"track":48,"source":"track"},{"id":"t48-15","type":"sentence","prompt":"We weren't staying here.","answer":"No nos quedábamos aquí.","steps":["no at the front","we stay: nos quedamos -> ongoing past, we form, accent stays: nos quedábamos","here: aquí (from earlier)"],"rules":["t48__quedarse-stay","t48__line-past-ar"],"track":48,"source":"track"},{"id":"t48-x01","type":"word","prompt":"I was living here","answer":"Vivía aquí","steps":["vivir, take off -ir, put -ía: vivía","here: aquí (from earlier)"],"rules":["t48__line-past-er-ir"],"track":48,"source":"extension","difficulty":1},{"id":"t48-x02","type":"sentence","prompt":"We have two left.","answer":"Nos quedan dos.","steps":["to us: nos","they remain: quedan","two: dos"],"rules":["t48__quedar-left"],"track":48,"source":"extension","difficulty":1},{"id":"t48-x03","type":"sentence","prompt":"It was breaking all the time.","answer":"Se rompía todo el tiempo.","steps":["it breaks itself: se rompe","put into the -ía line-past sound: se rompía","all the time: todo el tiempo (from earlier)"],"rules":["t48__self-se","t48__line-past-er-ir"],"track":48,"source":"extension","difficulty":2},{"id":"t48-x04","type":"sentence","prompt":"He wasn't staying here.","answer":"No se quedaba aquí.","steps":["no at the front","he stays: se queda -> ongoing past: se quedaba","here: aquí (from earlier)"],"rules":["t48__quedarse-stay","t48__line-past-ar"],"track":48,"source":"extension","difficulty":2},{"id":"t48-x05","type":"sentence","prompt":"I would have stayed here, but I wasn't able to find it.","answer":"Me habría quedado aquí, pero no lo podía encontrar.","steps":["I would have: habría (from earlier)","stayed: quedar with the self-structure on it, then -ado: quedado, so me habría quedado","here: aquí","but: pero (from earlier)","it: lo, out at the front","I wasn't able: no podía (poder in the -er/-ir line-past)","to find: encontrar"],"rules":["t48__would-have-habria","t48__perfect-ado-ido","t48__line-past-er-ir"],"track":48,"source":"extension","difficulty":3}],"blurb":"Imperfect -ia for -er/-ir verbs, se dice, quedar for have-left and to-stay","sectionIndex":6},{"id":"t49","label":"Track 49","tracks":[49],"rules":[{"id":"t49__llamarse-name","family":"llamarse-name","title":"Call myself = my name is (me llamo)","explanation":"Llamar means to call or to phone. Instead of saying my name is, Spanish says I call myself: me llamo. Asking for a name becomes how do you call yourself?: ¿cómo te llamas?","examples":["I call: llamo","I call myself (my name is): me llamo","how do you call yourself? (what's your name?): ¿cómo te llamas?"],"track":26},{"id":"t49__line-past-er-ir","family":"line-past-er-ir","title":"The line in the past (-er/-ir verbs)","explanation":"For -er/-ir verbs, take off the -er/-ir and put -ía for the ongoing past - the same sound as would, but here you strip the ending first instead of adding onto the full verb. Comería (I would eat) and comía (I was eating) are built the same way, just from different starting points.","examples":["comer -> comía - I was eating","vender -> vendía - I was selling","romper -> rompía (I was breaking), compare romper -> rompería (I would break)"],"track":48},{"id":"t49__no-me-queda","family":"no-me-queda","title":"I have none left: it doesn't remain to me","explanation":"To say you have none left, don't use tener at all - say it doesn't remain to me (no me queda) or, plural, they don't remain to me (no me quedan). Both are heard; queda/quedan agrees with what's left.","examples":["no me queda - I have none left","no me quedan - I have none left, of several","tenía cuatro, pero ahora no me queda - I had four, but now I have none left"],"track":49},{"id":"t49__imperfect-ir","family":"imperfect-ir","title":"iba: ir in the line in the past, and iba a for was going to","explanation":"Ir (to go) blends the two line-in-the-past endings into iba, ibas, íbamos, iban - I was going, we were going, and so on. Iba a plus the to-form of a verb also gives you was going to, the same way you'd use it in English: iba a llamarte, I was going to call you.","examples":["iba - I/he/she was going","iban - they were going","íbamos a hacerlo - we were going to do it","iba a llamarte - I was going to call you"],"track":49},{"id":"t49__tener-family","family":"tener-family","title":"tener (to have) is irregular, and gives you the -tain verbs","explanation":"tener doesn't follow the plain chop-and-add-o rule for I: it's tengo, with a g popping up, not teno. venir behaves the same way, becoming vengo. tener is also the root behind English's -tain verbs: contener (contain), obtener (obtain), sostener (sustain - sus- becomes sos-), mantener (maintain - main- becomes man-), entretener (entertain). detener (to detain) belongs to the same family, and man- in mantener comes from mano, hand - to hold in your hand.","examples":["contener, obtener, mantener, sostener, detener","tengo - I have (irregular) | vengo - I come (irregular the same way)"],"track":10},{"id":"t49__imperfect-ser","family":"imperfect-ser","title":"era: ser in the line in the past","explanation":"Ser (to be) has its own base for the line in the past: era for I/he/she/it/you-formal, éramos for we, eran for they/you-plural. Think of an era, a stretch of time, and use it for characteristics - what someone used to be, not a location or state.","examples":["era estudiante (I/he/she was a student)","éramos estudiantes - we were students","¿qué eran? - what were they?"],"track":49},{"id":"t49__imperfect-ver","family":"imperfect-ver","title":"veía: the extra e for ver in the line in the past","explanation":"Ver is irregular in the line-in-the-past tense: instead of just taking off -er and putting on -ía like a normal -er verb, you keep an extra e, giving veía, veías, veíamos, veían. This is the same extra e you already know from veo in the present.","examples":["veía - I/he/she was seeing, used to see","veías - you were seeing, informal","veíamos - we were seeing","veían - they were seeing"],"track":49}],"drills":[{"id":"t49-01","type":"word","prompt":"My name is... (literally: I call myself)","answer":"Me llamo","steps":["to call: llamar, with the double l giving a y sound","reflexive, myself: me llamo"],"rules":["t49__llamarse-name"],"track":49,"source":"track"},{"id":"t49-02","type":"sentence","prompt":"What's your name? (informal)","answer":"¿Cómo te llamas?","steps":["how: cómo","you call yourself: te llamas"],"rules":["t49__llamarse-name"],"track":49,"source":"track"},{"id":"t49-03","type":"word","prompt":"to obtain","answer":"Obtener","steps":["-tain becomes a form of tener"],"rules":["t49__tener-family"],"track":49,"source":"track"},{"id":"t49-04","type":"word","prompt":"to maintain","answer":"Mantener","steps":["-tain becomes tener, but main- shifts to man-, from mano, hand"],"rules":["t49__tener-family"],"track":49,"source":"track"},{"id":"t49-05","type":"word","prompt":"to sustain","answer":"Sostener","steps":["-tain becomes tener, sus- shifts to sos-"],"rules":["t49__tener-family"],"track":49,"source":"track"},{"id":"t49-06","type":"sentence","prompt":"I used to have a big house.","answer":"Tenía una casa grande.","steps":["I used to have: tenía, the line-in-the-past -ía (from earlier)","a: una, feminine to agree with casa","big house: casa grande"],"rules":["t49__line-past-er-ir"],"track":49,"source":"track"},{"id":"t49-07","type":"sentence","prompt":"I used to have four, but now I don't have any left.","answer":"Tenía cuatro, pero ahora no me queda.","steps":["I used to have four: tenía cuatro","but now: pero ahora","I don't have any left: it doesn't remain to me"],"rules":["t49__no-me-queda"],"track":49,"source":"track","note":"Also fine as ...no me quedan."},{"id":"t49-08","type":"sentence","prompt":"I had to see you yesterday. (informal)","answer":"Tenía que verte ayer.","steps":["I had to: tenía que, tengo que pushed into the line-in-the-past","see you: verte","yesterday: ayer"],"rules":["t49__line-past-er-ir"],"track":49,"source":"track"},{"id":"t49-09","type":"word","prompt":"I used to see / I was seeing","answer":"Veía","steps":["ver keeps an extra e in the line in the past"],"rules":["t49__imperfect-ver"],"track":49,"source":"track"},{"id":"t49-10","type":"sentence","prompt":"I used to be a student.","answer":"Era estudiante.","steps":["I used to be: era, ser's own base for the line in the past","no word for a needed here"],"rules":["t49__imperfect-ser"],"track":49,"source":"track"},{"id":"t49-11","type":"sentence","prompt":"I was going to call you. (informal)","answer":"Iba a llamarte.","steps":["I was going: iba, ir's own base blending -aba and -ía","was going to: iba a","call you: llamarte"],"rules":["t49__imperfect-ir"],"track":49,"source":"track"},{"id":"t49-12","type":"sentence","prompt":"We were going to do them.","answer":"Íbamos a hacerlos.","steps":["we were going to: íbamos a","do/make them: hacerlos"],"rules":["t49__imperfect-ir"],"track":49,"source":"track"},{"id":"t49-x01","type":"sentence","prompt":"Didn't you have to do it yesterday? (formal)","answer":"¿No tenía que hacerlo ayer?","steps":["didn't you have to: no tenía que","do it: hacerlo","yesterday: ayer"],"rules":["t49__line-past-er-ir"],"track":49,"source":"extension","difficulty":1},{"id":"t49-x02","type":"word","prompt":"to detain","answer":"Detener","steps":["-tain becomes tener"],"rules":["t49__tener-family"],"track":49,"source":"extension","difficulty":1},{"id":"t49-x03","type":"sentence","prompt":"Why were you going to call him? (informal)","answer":"¿Por qué ibas a llamarlo?","steps":["why: por qué","you were going to: ibas a","call him: llamarlo, with lo tucked onto the end (from earlier)"],"rules":["t49__imperfect-ir"],"track":49,"source":"extension","difficulty":2},{"id":"t49-x04","type":"sentence","prompt":"What was his name? He used to be a doctor and he used to have a big house.","answer":"¿Cómo se llamaba? Era doctor y tenía una casa grande.","steps":["what was his name: ¿cómo se llamaba?","he used to be: era","doctor: doctor","and: y","he used to have: tenía","a big house: una casa grande"],"rules":["t49__imperfect-ser","t49__llamarse-name","t49__line-past-er-ir"],"track":49,"source":"extension","difficulty":3}],"blurb":"Imperfect of tener, ser, ir; tener que in the past; -tener family verbs","sectionIndex":6},{"id":"t50","label":"Track 50","tracks":[50],"rules":[{"id":"t50__would-tense-ia","family":"would-tense-ia","title":"Would: add -ía onto the whole verb","explanation":"Would works the same way as will but with its own key sound: -ía, stressed, stuck onto the full to-form of the verb for every verb type. The plain -ía form covers I, he, she, it and you (formal) all together; the other endings (-íamos, -ían, -ías) work the same way as for will.","examples":["Bailaría. - I would dance.","Bailaríamos. - We would dance.","Comería. - I would eat."],"track":41},{"id":"t50__por-time","family":"por-time","title":"por for a stretch of time","explanation":"When you're giving a period of time - for three days, for two weeks - use por, never para. Me quedo por tres días, I'm staying for three days.","examples":["por tres días - for three days","me quedo por tres días - I'm staying for three days"],"track":50},{"id":"t50__para-vs-por","family":"para-vs-por","title":"Two words for for: para, and por for because-of","explanation":"Para is for when a thing is genuinely for someone (este es para ti). Por is a more flexible for, used for because of - including inside por qué (because of what?) and porque (because of that). The same object bought para ti is a gift; bought por ti was bought because of you, not necessarily handed over.","examples":["este es para ti - this one is for you","por esta razón - for this reason, because of this","lo compro para ti - I'm buying it for you, to give you","lo compro por ti - I'm buying it because of you"],"track":50}],"drills":[{"id":"t50-01","type":"sentence","prompt":"This one is for you. (informal, masculine thing)","answer":"Este es para ti.","steps":["this one, masculine: este (from earlier)","is: es","for you: para ti - para because it's genuinely for you"],"rules":["t50__para-vs-por"],"track":50,"source":"track"},{"id":"t50-02","type":"sentence","prompt":"Because of this reason, I don't want to go.","answer":"Por esta razón, no quiero ir.","steps":["because of: por","this reason: esta razón","I don't want to go: no quiero ir"],"rules":["t50__para-vs-por"],"track":50,"source":"track"},{"id":"t50-03","type":"sentence","prompt":"I'm buying it for you. (informal)","answer":"Lo compro para ti.","steps":["it: lo, out at the front","I'm buying: compro","for you: para ti - it's genuinely for them"],"rules":["t50__para-vs-por"],"track":50,"source":"track"},{"id":"t50-04","type":"sentence","prompt":"I'm buying it because of you. (informal)","answer":"Lo compro por ti.","steps":["lo compro: I'm buying it","because of you: por ti - bought on account of them, not necessarily for them"],"rules":["t50__para-vs-por"],"track":50,"source":"track"},{"id":"t50-05","type":"sentence","prompt":"I'm staying for three days.","answer":"Me quedo por tres días.","steps":["I'm staying: me quedo","for three days: por tres días - a stretch of time takes por"],"rules":["t50__por-time"],"track":50,"source":"track"},{"id":"t50-06","type":"sentence","prompt":"I will stay for three days.","answer":"Me quedaré por tres días.","steps":["I will stay: me quedaré (future, from earlier)","for three days: por tres días"],"rules":["t50__por-time"],"track":50,"source":"track"},{"id":"t50-07","type":"sentence","prompt":"I would stay for three days.","answer":"Me quedaría por tres días.","steps":["I would stay: me quedaría - pluck the -ía off me gustaría's pattern","for three days: por tres días"],"rules":["t50__would-tense-ia","t50__por-time"],"track":50,"source":"track"},{"id":"t50-08","type":"sentence","prompt":"I would stay for three days, but I have to work.","answer":"Me quedaría por tres días, pero tengo que trabajar.","steps":["me quedaría por tres días","but: pero","I have to work: tengo que trabajar"],"rules":["t50__would-tense-ia","t50__por-time"],"track":50,"source":"track"},{"id":"t50-x01","type":"sentence","prompt":"This one is for him.","answer":"Este es para él.","steps":["this one is: este es","for him: para él"],"rules":["t50__para-vs-por"],"track":50,"source":"extension","difficulty":1},{"id":"t50-x02","type":"sentence","prompt":"I'm staying for three days because of you. (informal)","answer":"Me quedo por tres días por ti.","steps":["I'm staying for three days: me quedo por tres días","because of you: por ti"],"rules":["t50__por-time","t50__para-vs-por"],"track":50,"source":"extension","difficulty":2},{"id":"t50-x03","type":"sentence","prompt":"I would stay for three days, but I don't want to work because of this reason.","answer":"Me quedaría por tres días, pero no quiero trabajar por esta razón.","steps":["me quedaría por tres días","but I don't want to work: pero no quiero trabajar","because of this reason: por esta razón"],"rules":["t50__would-tense-ia","t50__por-time","t50__para-vs-por"],"track":50,"source":"extension","difficulty":3}],"blurb":"Contrasting por vs para: because-of, duration, exchange, and would with -ia","sectionIndex":6},{"id":"t51","label":"Track 51","tracks":[51],"rules":[{"id":"t51__estar-implies-there","family":"estar-implies-there","title":"estar already means there - don't add it","explanation":"Because estar is about location and states, saying I am already carries there or here inside it. ¿Estás? on its own means are you there?, and estoy para ti means I'm there for you, with no separate word needed for there.","examples":["¿estás? - are you there?","estoy para ti - I'm there for you","¿está Juan? - is Juan there?"],"track":51},{"id":"t51__preposition-to-form","family":"preposition-to-form","title":"After para, por, de, en, con, a: use the to-form, not -ing","explanation":"In English, a preposition is followed by an -ing word (thank you for coming). In Spanish, after any of these small connecting words - para, por, de, en, con, a - you use the plain to-form of the verb instead: gracias por venir, thanks for coming, not a form ending in -ing.","examples":["gracias por venir - thanks for coming","gracias por llamarme - thanks for calling me","cansada de trabajar - tired of working","una forma de hacerlo - a way of doing it"],"track":51},{"id":"t51__cansado-de","family":"cansado-de","title":"Tired of: cansado/cansada de","explanation":"Tired agrees like an adjective - cansado for a male speaker, cansada for a female one. Tired of doing something adds de plus the to-form of the verb, following the preposition rule: estoy cansada de trabajar, I'm tired of working.","examples":["estoy cansado - I'm tired, said by a man","estoy cansada - I'm tired, said by a woman","cansada de trabajar - tired of working","cansados de trabajar - tired of working, plural"],"track":51},{"id":"t51__por-exchange","family":"por-exchange","title":"por for swapping one thing for another","explanation":"When for means in exchange for - trading this one for that one - use por. Cambiar (to change/swap) takes por between the two things: cambiaría este por ese, I would change this one for that one.","examples":["este por ese - this one for that one","estas por esas - these for those","cambiaría estos por esos - I would change these for those"],"track":51},{"id":"t51__would-tense-ia","family":"would-tense-ia","title":"Would: add -ía onto the whole verb","explanation":"Would works the same way as will but with its own key sound: -ía, stressed, stuck onto the full to-form of the verb for every verb type. The plain -ía form covers I, he, she, it and you (formal) all together; the other endings (-íamos, -ían, -ías) work the same way as for will.","examples":["Bailaría. - I would dance.","Bailaríamos. - We would dance.","Comería. - I would eat."],"track":41},{"id":"t51__imperfect-ir","family":"imperfect-ir","title":"iba: ir in the line in the past, and iba a for was going to","explanation":"Ir (to go) blends the two line-in-the-past endings into iba, ibas, íbamos, iban - I was going, we were going, and so on. Iba a plus the to-form of a verb also gives you was going to, the same way you'd use it in English: iba a llamarte, I was going to call you.","examples":["iba - I/he/she was going","iban - they were going","íbamos a hacerlo - we were going to do it","iba a llamarte - I was going to call you"],"track":49},{"id":"t51__para-vs-por","family":"para-vs-por","title":"Two words for for: para, and por for because-of","explanation":"Para is for when a thing is genuinely for someone (este es para ti). Por is a more flexible for, used for because of - including inside por qué (because of what?) and porque (because of that). The same object bought para ti is a gift; bought por ti was bought because of you, not necessarily handed over.","examples":["este es para ti - this one is for you","por esta razón - for this reason, because of this","lo compro para ti - I'm buying it for you, to give you","lo compro por ti - I'm buying it because of you"],"track":50}],"drills":[{"id":"t51-01","type":"sentence","prompt":"I'm there for you. (informal)","answer":"Estoy para ti.","steps":["I am: estoy - estar already carries there, so skip the word for there","for you: para ti"],"rules":["t51__estar-implies-there","t51__para-vs-por"],"track":51,"source":"track"},{"id":"t51-02","type":"sentence","prompt":"I am here because of you. (formal)","answer":"Estoy por usted.","steps":["I am: estoy - no separate word for here needed","because of you: por usted"],"rules":["t51__estar-implies-there","t51__para-vs-por"],"track":51,"source":"track"},{"id":"t51-03","type":"sentence","prompt":"I have come because of you. (informal)","answer":"He venido por ti.","steps":["I have come: he venido (from earlier)","because of you: por ti - resist the urge to say porque de"],"rules":["t51__para-vs-por"],"track":51,"source":"track"},{"id":"t51-04","type":"sentence","prompt":"It is because of you that we have come. (informal)","answer":"Es por ti que hemos venido.","steps":["it is because of you: es por ti","that we have come: que hemos venido (from earlier)"],"rules":["t51__para-vs-por"],"track":51,"source":"track"},{"id":"t51-05","type":"sentence","prompt":"I would change this one for that one. (masculine)","answer":"Cambiaría este por ese.","steps":["I would change: cambiaría - the -ía would ending on cambiar","this one: este","for that one: por ese - swapping one thing for another"],"rules":["t51__would-tense-ia","t51__por-exchange"],"track":51,"source":"track"},{"id":"t51-06","type":"sentence","prompt":"Wouldn't you change these ones for those ones? (informal, feminine)","answer":"¿No cambiarías estas por esas?","steps":["wouldn't you change: no cambiarías","these ones, feminine: estas","for those ones, feminine: por esas"],"rules":["t51__would-tense-ia","t51__por-exchange"],"track":51,"source":"track"},{"id":"t51-07","type":"sentence","prompt":"Thank you for calling me.","answer":"Gracias por llamarme.","steps":["thank you for: gracias por","calling me: llamarme - the to-form, not an -ing form"],"rules":["t51__preposition-to-form"],"track":51,"source":"track"},{"id":"t51-08","type":"sentence","prompt":"I'm tired of working.","answer":"Estoy cansada de trabajar.","steps":["I am tired: estoy cansada - cansada if the speaker is female","of working: de trabajar, the to-form after de"],"rules":["t51__cansado-de","t51__preposition-to-form"],"track":51,"source":"track"},{"id":"t51-09","type":"sentence","prompt":"We were tired of working. (masculine group)","answer":"Estábamos cansados de trabajar.","steps":["we were: estábamos","tired, masculine plural: cansados","of working: de trabajar"],"rules":["t51__cansado-de"],"track":51,"source":"track"},{"id":"t51-10","type":"sentence","prompt":"It is a way of doing it.","answer":"Es una forma de hacerlo.","steps":["it is a way: es una forma","of doing it: de hacerlo, the to-form after de"],"rules":["t51__preposition-to-form"],"track":51,"source":"track"},{"id":"t51-11","type":"sentence","prompt":"I don't believe in arguing in this way.","answer":"No creo en discutir de esta forma.","steps":["I don't believe: no creo","in arguing: en discutir, the to-form after en","in this way: de esta forma"],"rules":["t51__preposition-to-form"],"track":51,"source":"track","note":"Discutir is the common word for argue, not discuss - a false friend."},{"id":"t51-x01","type":"sentence","prompt":"I would change this one for that one. (feminine)","answer":"Cambiaría esta por esa.","steps":["cambiaría","this one, feminine: esta","for that one, feminine: por esa"],"rules":["t51__would-tense-ia","t51__por-exchange"],"track":51,"source":"extension","difficulty":1},{"id":"t51-x02","type":"sentence","prompt":"Thank you for seeing me.","answer":"Gracias por verme.","steps":["thank you for: gracias por","seeing me: verme, the to-form"],"rules":["t51__preposition-to-form"],"track":51,"source":"extension","difficulty":1},{"id":"t51-x03","type":"sentence","prompt":"I am tired of arguing because of this reason.","answer":"Estoy cansada de discutir por esta razón.","steps":["I'm tired of, a woman speaking: estoy cansada de","arguing: discutir, the to-form","because of this reason: por esta razón"],"rules":["t51__cansado-de","t51__preposition-to-form","t51__para-vs-por"],"track":51,"source":"extension","difficulty":2},{"id":"t51-x04","type":"sentence","prompt":"We were going to change this one for that one, but we are tired of working.","answer":"Íbamos a cambiar este por ese, pero estamos cansados de trabajar.","steps":["we were going to change: íbamos a cambiar","this one for that one: este por ese","but we are tired of working: pero estamos cansados de trabajar"],"rules":["t51__imperfect-ir","t51__por-exchange","t51__cansado-de"],"track":51,"source":"extension","difficulty":3}],"blurb":"Por for because-of/exchange, no -ing after prepositions, imperfect of estar","sectionIndex":6},{"id":"t52","label":"Track 52","tracks":[52],"rules":[{"id":"t52__ante-iente-adjective","family":"ante-iente-adjective","title":"-ante/-iente for English '-ing' adjectives","explanation":"When English makes an adjective out of a verb with -ing (interest -> interesting), Spanish does it by taking -ar off the verb and adding -ante, or taking -er/-ir off and adding -iente. This is different from the -ando/-iendo 'right now' form - it makes a describing word, not a 'doing' form.","examples":["interesar -> interesante - to interest -> interesting","frustrar -> frustrante - to frustrate -> frustrating","vivir -> viviente - to live -> living"],"track":52},{"id":"t52__ar-to-ando","family":"ar-to-ando","title":"-ar verbs: the right-now -ing","explanation":"To build the '-ing' form of an -ar verb, take off the -ar and put -ando in its place. This form never stands alone in Spanish; it always pairs with estar (see estoy-ing-right-now). For -er and -ir verbs the ending is -iendo instead. A little word like lo can sit before estar or ride on the end of the -ando/-iendo word.","examples":["hablar -> hablando -> estoy hablando","comer -> comiendo -> estoy comiendo","Lo estoy explicando = Estoy explicándolo"],"track":34},{"id":"t52__para-in-order-to","family":"para-in-order-to","title":"para for 'to' when it means 'in order to'","explanation":"When English 'to' before a verb secretly means 'in order to', the plain infinitive isn't enough in Spanish - you must add para before it. If 'to' can't be swapped for 'in order to' without changing the meaning, you don't need para.","examples":["Hemos hablado para resolverlo. (We've spoken in order to resolve it.)","Estoy aquí para verte. - I'm here to see you.","Te he llamado para hablarlo. - I've called you to talk it over."],"track":52},{"id":"t52__infinitive-as-subject","family":"infinitive-as-subject","title":"When English starts with -ing, Spanish starts with the to-form","explanation":"Dancing is healthy, swimming is healthy - English happily makes an -ing word the subject of a sentence. Spanish never uses -ando/-iendo that way. It uses the plain to-form instead: bailar es saludable, literally to dance is healthy.","examples":["bailar es saludable - dancing is healthy","nadar es saludable - swimming is healthy"],"track":52}],"drills":[{"id":"t52-01","type":"sentence","prompt":"We have spoken in order to resolve it.","answer":"Hemos hablado para resolverlo.","steps":["we have spoken: hemos hablado","to resolve: resolver","the 'to' here means 'in order to', so: para","attach it: resolverlo"],"rules":["t52__para-in-order-to"],"track":52,"source":"track"},{"id":"t52-02","type":"sentence","prompt":"We have spoken in order to try
