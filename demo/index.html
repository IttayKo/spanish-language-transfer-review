entence","prompt":"I'm not trying to justify myself.","answer":"No intento justificarme.","steps":["to justify: justificar, from justificación","myself: me - the same word as me (to me)","attached: justificarme"],"rules":["t9__me-reflexive"],"track":9,"source":"track"},{"id":"t9-13","type":"sentence","prompt":"But I want to explain something to you. (informal)","answer":"Pero quiero explicarte algo.","steps":["to explain: explicar - an exception, from explicación not 'explanación'","to you (informal): te, attached: explicarte","something: algo"],"rules":["t9__ación-to-ar-verb"],"track":9,"source":"track","note":"explicar/explicación is an irregular pair - watch for it, it doesn't follow the usual -ación pattern."},{"id":"t9-14","type":"sentence","prompt":"I'm not trying to justify myself, but I want to explain something to you. (informal)","answer":"No intento justificarme, pero quiero explicarte algo.","steps":["I'm not trying to justify myself: no intento justificarme","but: pero","I want to explain something to you: quiero explicarte algo"],"rules":["t9__me-reflexive"],"track":9,"source":"track"},{"id":"t9-x01","type":"sentence","prompt":"I want to know if you want to come. (formal)","answer":"Quiero saber si quiere venir.","steps":["I want to know: quiero saber","if: si","you (formal) want to come: quiere venir"],"rules":["t9__si-yes-if","t9__third-person-bundle"],"track":9,"source":"extension","difficulty":1},{"id":"t9-x02","type":"sentence","prompt":"I'm not trying to imagine it.","answer":"No intento imaginarlo.","steps":["I'm not trying: no intento","to imagine it: imaginarlo"],"rules":["t9__ación-to-ar-verb"],"track":9,"source":"extension","difficulty":1},{"id":"t9-x03","type":"sentence","prompt":"I don't want to justify myself now.","answer":"No quiero justificarme ahora.","steps":["I don't want: no quiero","to justify myself: justificarme","now: ahora"],"rules":["t9__me-reflexive"],"track":9,"source":"extension","difficulty":2},{"id":"t9-x04","type":"sentence","prompt":"I want to know if he wants to invite them.","answer":"Quiero saber si quiere invitarlos.","steps":["I want to know: quiero saber","if: si","he wants to invite them: quiere invitarlos"],"rules":["t9__si-yes-if","t9__third-person-bundle","t9__lo-los-plural"],"track":9,"source":"extension","difficulty":2},{"id":"t9-x05","type":"sentence","prompt":"I want to know why he doesn't want to try to explain it.","answer":"Quiero saber por qué no quiere intentar explicarlo.","steps":["I want to know: quiero saber","why he doesn't want: por qué no quiere","to try: intentar","to explain it: explicarlo"],"rules":["t9__third-person-bundle"],"track":9,"source":"extension","difficulty":3}],"blurb":"Saber, si for if, explicar as an exception, and chaining clauses","sectionIndex":1},{"id":"t10","label":"Track 10","tracks":[10],"rules":[{"id":"t10__ación-to-ar-verb","family":"ación-to-ar-verb","title":"Drop -ción, add -r, and you have the verb","explanation":"Take any word ending -ación, remove -ción, and add -r: that's the Spanish verb. This single move hands you roughly a thousand verbs for free.","examples":["preparación -> preparar - to prepare","confirmación -> confirmar - to confirm","cancelación -> cancelar - to cancel"],"track":4},{"id":"t10__tener-family","family":"tener-family","title":"tener (to have) is irregular, and gives you the -tain verbs","explanation":"tener doesn't follow the plain chop-and-add-o rule for I: it's tengo, with a g popping up, not teno. venir behaves the same way, becoming vengo. tener is also the root behind English's -tain verbs: contener (contain), obtener (obtain), sostener (sustain - sus- becomes sos-), mantener (maintain - main- becomes man-), entretener (entertain).","examples":["tengo - I have (irregular)","vengo - I come/I'm coming (irregular the same way)","contener, obtener, sostener, mantener, entretener"],"track":10},{"id":"t10__future-by-context","family":"future-by-context","title":"A future time word lets you use the plain present","explanation":"If a word like tomorrow or later already shows you're talking about the future, Spanish is happy to just use the present tense - no 'will' or 'going to' needed, even though that sounds a little odd translated literally into English.","examples":["como mañana - I eat tomorrow / I will eat tomorrow","como con Pablo mañana - I'm eating with Pablo tomorrow","vengo mañana - I'm coming tomorrow"],"track":10},{"id":"t10__infinitive-o","family":"infinitive-o","title":"Chop -ar/-er/-ir, add -o, move the stress","explanation":"Every Spanish verb's 'to' form (the infinitive - the way you spot a verb at all, since 'to' is what makes something a verb) ends in -ar, -er, or -ir. To get the I-form, chop off that ending and add -o. At the same time the stress moves: it lands on the syllable right before the new -o, not wherever it sat in the infinitive. This works the same whether the infinitive was -ar, -er, or -ir.","examples":["donar -> dono - I donate","crear -> creo - I create","comer (an -er verb) -> como - I eat","organizar -> organizo (the z sounds like /th/ in Spain) - I organize"],"track":10},{"id":"t10__movement-verb-a","family":"movement-verb-a","title":"Verbs of movement take a before an infinitive","explanation":"When a verb that carries a sense of motion - voy (I'm going), venir (to come), pasar (to pass by) - is followed by another verb in its 'to' form, Spanish inserts a in between to carry that feeling of movement toward the action. Verbs without a movement sense, like quiero, intento or debo, don't take this a. Where a verb of movement leads straight into a second one, both get their own a: venir a la casa a visitarme.","examples":["voy a comer - I'm going to eat","quiere venir a la casa a visitarme - he/she/you (formal) want(s) to come to the house to visit me"],"track":7}],"drills":[{"id":"t10-01","type":"word","prompt":"to breathe","answer":"Respirar","steps":["from respiración (respiration) - drop -ción, add -r"],"rules":["t10__ación-to-ar-verb"],"track":10,"source":"track"},{"id":"t10-02","type":"word","prompt":"I donate","answer":"Dono","steps":["to donate: donar, from donación","chop -ar, add -o: dono"],"rules":["t10__infinitive-o"],"track":10,"source":"track"},{"id":"t10-03","type":"sentence","prompt":"I don't donate.","answer":"No dono.","steps":["I don't: no","donate: dono"],"rules":["t10__infinitive-o"],"track":10,"source":"track"},{"id":"t10-04","type":"word","prompt":"I create","answer":"Creo","steps":["to create: crear, from creación","chop -ar, add -o: creo"],"rules":["t10__infinitive-o"],"track":10,"source":"track"},{"id":"t10-05","type":"word","prompt":"I eat / I'm eating","answer":"Como","steps":["to eat: comer - an -er verb, but the same rule applies","chop the ending, add -o: como"],"rules":["t10__infinitive-o"],"track":10,"source":"track"},{"id":"t10-06","type":"sentence","prompt":"I'm going to eat late.","answer":"Voy a comer tarde.","steps":["I'm going to eat: voy a comer","late: tarde (like the English 'tardy')"],"rules":["t10__movement-verb-a"],"track":10,"source":"track"},{"id":"t10-07","type":"sentence","prompt":"I eat tomorrow.","answer":"Como mañana.","steps":["tomorrow: mañana - already shows the future, so the plain present works","I eat: como"],"rules":["t10__infinitive-o","t10__future-by-context"],"track":10,"source":"track"},{"id":"t10-08","type":"sentence","prompt":"I'm eating with Pablo tomorrow.","answer":"Como con Pablo mañana.","steps":["with: con, from confirmar - literally 'with signature'","I eat with Pablo tomorrow: como con Pablo mañana"],"rules":["t10__future-by-context"],"track":10,"source":"track"},{"id":"t10-09","type":"word","prompt":"I organize / I'm organizing","answer":"Organizo","steps":["to organize: organizar, from organización","chop -ar, add -o: organizo (the z sounds like /th/ in Spain)"],"rules":["t10__infinitive-o"],"track":10,"source":"track"},{"id":"t10-10","type":"sentence","prompt":"I want to have it.","answer":"Quiero tenerlo.","steps":["to have: tener","I want to have it: quiero tenerlo"],"rules":["t10__tener-family"],"track":10,"source":"track"},{"id":"t10-11","type":"sentence","prompt":"I'm going to have it later.","answer":"Voy a tenerlo más tarde.","steps":["I'm going to have it: voy a tenerlo","later: más tarde (literally 'more late'; más is related to 'massive')"],"rules":["t10__movement-verb-a"],"track":10,"source":"track"},{"id":"t10-12","type":"word","prompt":"I have","answer":"Tengo","steps":["irregular - not teno, a g pops up: tengo"],"rules":["t10__tener-family"],"track":10,"source":"track"},{"id":"t10-13","type":"word","prompt":"to maintain","answer":"Mantener","steps":["English main- becomes man- in Spanish: mantener"],"rules":["t10__tener-family"],"track":10,"source":"track"},{"id":"t10-14","type":"word","prompt":"to entertain","answer":"Entretener","steps":["-tain becomes -tener, with entre- (between) at the front: entretener"],"rules":["t10__tener-family"],"track":10,"source":"track"},{"id":"t10-15","type":"sentence","prompt":"I'm coming tomorrow.","answer":"Vengo mañana.","steps":["venir behaves like tener in the I-form: vengo","tomorrow already shows the future, so no need for voy a: vengo mañana"],"rules":["t10__tener-family","t10__future-by-context"],"track":10,"source":"track"},{"id":"t10-x01","type":"word","prompt":"I separate","answer":"Separo","steps":["to separate: separar","chop -ar, add -o: separo"],"rules":["t10__infinitive-o"],"track":10,"source":"extension","difficulty":1},{"id":"t10-x02","type":"sentence","prompt":"I'm going to organize it.","answer":"Voy a organizarlo.","steps":["I'm going to organize: voy a organizar","it, attached: organizarlo"],"rules":["t10__movement-verb-a"],"track":10,"source":"extension","difficulty":1},{"id":"t10-x03","type":"sentence","prompt":"I'm eating with Pablo later.","answer":"Como con Pablo más tarde.","steps":["I eat with Pablo: como con Pablo","later: más tarde"],"rules":["t10__future-by-context"],"track":10,"source":"extension","difficulty":2},{"id":"t10-x04","type":"sentence","prompt":"I'm going to obtain it tomorrow.","answer":"Voy a obtenerlo mañana.","steps":["I'm going to obtain it: voy a obtenerlo","tomorrow: mañana"],"rules":["t10__movement-verb-a","t10__tener-family"],"track":10,"source":"extension","difficulty":2},{"id":"t10-x05","type":"sentence","prompt":"I'm not going to obtain it later.","answer":"No voy a obtenerlo más tarde.","steps":["I'm not going to obtain it: no voy a obtenerlo","later: más tarde"],"rules":["t10__movement-verb-a","t10__tener-family"],"track":10,"source":"extension","difficulty":3}],"blurb":"Regular -ar/-er/-ir infinitives, present tense I-form -o, and tener","sectionIndex":2},{"id":"t11","label":"Track 11","tracks":[11],"rules":[{"id":"t11__pronoun-placement","family":"pronoun-placement","title":"Little words go before a lone verb, but have a choice with two","explanation":"Little words like lo, la, los, las, me, te go right before a verb that's on its own (a single changed verb): lo quiero, not quiero lo. But when a conjugated helper verb (quiero, debo, puedo, voy a...) is paired with an infinitive, the little word can go either before the whole pair or attached to the end of the infinitive - both mean the same thing.","examples":["lo quiero - I want it (only option, one verb)","quiero verlo / lo quiero ver - I want to see it (either position, two verbs)"],"track":11},{"id":"t11__verb-person-endings","family":"verb-person-endings","title":"The he/she/it/they/you pattern: a key vowel plus n or s","explanation":"Beyond the I-form, Spanish verbs split into two behaviors. -ar verbs use /a/ as their key vowel for he/she/it/you(formal): stem+a. -er/-ir verbs use /e/ the same way: stem+e. From there it's the same for both groups: add n to get they/you(plural), add s to the he/she/it form to get you (informal).","examples":["hablar (-ar): habla - he/she/it/you(formal) speak(s); hablan - they/you guys speak; hablas - you (informal) speak","vender (-er): vende - he/she/it/you(formal) sell(s); venden - they/you guys sell; vendes - you (informal) sell","hacer (-er): hace, hacen, haces"],"track":11},{"id":"t11__movement-verb-a","family":"movement-verb-a","title":"Verbs of movement take a before an infinitive","explanation":"When a verb that carries a sense of motion - voy (I'm going), venir (to come), pasar (to pass by) - is followed by another verb in its 'to' form, Spanish inserts a in between to carry that feeling of movement toward the action. Verbs without a movement sense, like quiero, intento or debo, don't take this a. Where a verb of movement leads straight into a second one, both get their own a: venir a la casa a visitarme.","examples":["voy a comer - I'm going to eat","quiere venir a la casa a visitarme - he/she/you (formal) want(s) to come to the house to visit me"],"track":7},{"id":"t11__lo-los-plural","family":"lo-los-plural","title":"Add s to pluralize: lo/la -> los/las (them)","explanation":"lo (him/it/formal you) and la (her/it fem./formal you to a female) both pluralize the same way - just add an s. los means them for masculine words, las means them for feminine words.","examples":["lo -> los, la -> las","debo identificarlos - I must identify them","debo identificarlas - I must identify them (feminine)"],"track":7},{"id":"t11__infinitive-o","family":"infinitive-o","title":"Chop -ar/-er/-ir, add -o, move the stress","explanation":"Every Spanish verb's 'to' form (the infinitive - the way you spot a verb at all, since 'to' is what makes something a verb) ends in -ar, -er, or -ir. To get the I-form, chop off that ending and add -o. At the same time the stress moves: it lands on the syllable right before the new -o, not wherever it sat in the infinitive. This works the same whether the infinitive was -ar, -er, or -ir.","examples":["donar -> dono - I donate","crear -> creo - I create","comer (an -er verb) -> como - I eat","organizar -> organizo (the z sounds like /th/ in Spain) - I organize"],"track":10},{"id":"t11__debo-must","family":"debo-must","title":"debo (I owe) + infinitive = I must","explanation":"debo literally means I owe. Put it in front of a verb's 'to' form and it means I must / I have to - debo continuar is literally 'I owe to continue', meaning I must continue.","examples":["debo continuar - I must continue","debo identificarlo - I must identify it"],"track":8}],"drills":[{"id":"t11-01","type":"word","prompt":"I tolerate","answer":"Tolero","steps":["to tolerate: tolerar, from toleración","chop -ar, add -o, stress moves: tolero"],"rules":["t11__infinitive-o"],"track":11,"source":"track"},{"id":"t11-02","type":"sentence","prompt":"It doesn't last a long time.","answer":"No dura mucho.","steps":["to last: durar","it lasts: dura (-ar verb, key vowel a)","a lot/much: mucho"],"rules":["t11__verb-person-endings"],"track":11,"source":"track"},{"id":"t11-03","type":"sentence","prompt":"He's not exaggerating.","answer":"No exagera.","steps":["to exaggerate: exagerar, from exageración","he's exaggerating: exagera"],"rules":["t11__verb-person-endings"],"track":11,"source":"track"},{"id":"t11-04","type":"sentence","prompt":"They collaborate.","answer":"Colaboran.","steps":["to collaborate: colaborar, from colaboración","he/she/it collaborates: colabora","add n for they: colaboran"],"rules":["t11__verb-person-endings"],"track":11,"source":"track"},{"id":"t11-05","type":"sentence","prompt":"They're not speaking with Pablo.","answer":"No hablan con Pablo.","steps":["to speak: hablar (silent h)","they speak: hablan","with: con"],"rules":["t11__verb-person-endings"],"track":11,"source":"track"},{"id":"t11-06","type":"sentence","prompt":"I'm going to speak.","answer":"Voy a hablar.","steps":["I'm going: voy","a verb of movement, so a before the next verb","to speak: hablar"],"rules":["t11__movement-verb-a"],"track":11,"source":"track"},{"id":"t11-07","type":"sentence","prompt":"You speak. (informal)","answer":"Hablas.","steps":["he/she/it speaks: habla","add s for informal you: hablas"],"rules":["t11__verb-person-endings"],"track":11,"source":"track"},{"id":"t11-08","type":"sentence","prompt":"I want it.","answer":"Lo quiero.","steps":["a single changed verb, so lo must go before it: lo quiero"],"rules":["t11__pronoun-placement"],"track":11,"source":"track"},{"id":"t11-09","type":"sentence","prompt":"I want to see it.","answer":"Quiero verlo.","steps":["to see: ver","two verbs, so lo can attach to the end: verlo"],"rules":["t11__pronoun-placement"],"track":11,"source":"track","note":"Also fine as Lo quiero ver - either position works with two verbs."},{"id":"t11-10","type":"sentence","prompt":"It's important to speak about it.","answer":"Es importante hablarlo.","steps":["no separate word needed for 'about' - hablarlo already covers 'to speak about it'"],"rules":["t11__pronoun-placement"],"track":11,"source":"track"},{"id":"t11-11","type":"sentence","prompt":"I must invite him.","answer":"Debo invitarlo.","steps":["I must: debo","to invite him: invitarlo"],"rules":["t11__debo-must","t11__pronoun-placement"],"track":11,"source":"track","note":"Also fine as Lo debo invitar."},{"id":"t11-x01","type":"word","prompt":"I chew","answer":"Mastico","steps":["to chew: masticar, from masticación (mastication)","chop -ar, add -o: mastico"],"rules":["t11__infinitive-o"],"track":11,"source":"extension","difficulty":1},{"id":"t11-x02","type":"sentence","prompt":"You (informal) collaborate.","answer":"Colaboras.","steps":["he/she/it collaborates: colabora","add s for informal you: colaboras"],"rules":["t11__verb-person-endings"],"track":11,"source":"extension","difficulty":1},{"id":"t11-x03","type":"sentence","prompt":"I want to see them.","answer":"Quiero verlos.","steps":["to see them: verlos"],"rules":["t11__pronoun-placement","t11__lo-los-plural"],"track":11,"source":"extension","difficulty":2,"note":"Also fine as Los quiero ver."},{"id":"t11-x04","type":"sentence","prompt":"I must invite her, but I don't want to see her.","answer":"Debo invitarla, pero no quiero verla.","steps":["I must invite: debo invitar","her, attached to the 'to' form: invitarla","but: pero","I don't want to see her: no quiero verla"],"rules":["t11__debo-must","t11__pronoun-placement","t11__lo-los-plural"],"track":11,"source":"extension","difficulty":3}],"blurb":"Present tense endings for el/ella/usted and ellos, object pronoun placement","sectionIndex":2},{"id":"t12","label":"Track 12","tracks":[12],"rules":[{"id":"t12__pronoun-stacking-order","family":"pronoun-stacking-order","title":"The person pronoun comes before the thing pronoun","explanation":"When you combine a person little word (me, nos, te) with a thing little word (lo, la, los, las), the person one goes first: me lo, nos lo - not the other way around, even though English does the reverse (sell it to me).","examples":["me lo venden - they're selling it to me","nos lo venden - they're selling it to us"],"track":12},{"id":"t12__feminine-endings","family":"feminine-endings","title":"-a, -ión and -idad mark feminine words","explanation":"A word ending in -a, -ión, or -idad is (almost) always feminine and takes la/las. English -ity words become -idad in Spanish (diversity -> diversidad), and English -tion words become -ión, following the pattern you already know. Adjectives agree the same way: the masculine -o ending becomes -a for a feminine noun.","examples":["la diversidad - the diversity (from diversity -> diversidad)","la comunidad - the community","generoso -> generosa - generous, for a feminine noun"],"track":12},{"id":"t12__lo-los-plural","family":"lo-los-plural","title":"Add s to pluralize: lo/la -> los/las (them)","explanation":"lo (him/it/formal you) and la (her/it fem./formal you to a female) both pluralize the same way - just add an s. los means them for masculine words, las means them for feminine words.","examples":["lo -> los, la -> las","debo identificarlos - I must identify them","debo identificarlas - I must identify them (feminine)"],"track":7},{"id":"t12__infinitive-o","family":"infinitive-o","title":"Chop -ar/-er/-ir, add -o, move the stress","explanation":"Every Spanish verb's 'to' form (the infinitive - the way you spot a verb at all, since 'to' is what makes something a verb) ends in -ar, -er, or -ir. To get the I-form, chop off that ending and add -o. At the same time the stress moves: it lands on the syllable right before the new -o, not wherever it sat in the infinitive. This works the same whether the infinitive was -ar, -er, or -ir.","examples":["donar -> dono - I donate","crear -> creo - I create","comer (an -er verb) -> como - I eat","organizar -> organizo (the z sounds like /th/ in Spain) - I organize"],"track":10},{"id":"t12__verb-person-endings","family":"verb-person-endings","title":"The he/she/it/they/you pattern: a key vowel plus n or s","explanation":"Beyond the I-form, Spanish verbs split into two behaviors. -ar verbs use /a/ as their key vowel for he/she/it/you(formal): stem+a. -er/-ir verbs use /e/ the same way: stem+e. From there it's the same for both groups: add n to get they/you(plural), add s to the he/she/it form to get you (informal).","examples":["hablar (-ar): habla - he/she/it/you(formal) speak(s); hablan - they/you guys speak; hablas - you (informal) speak","vender (-er): vende - he/she/it/you(formal) sell(s); venden - they/you guys sell; vendes - you (informal) sell","hacer (-er): hace, hacen, haces"],"track":11},{"id":"t12__pronoun-placement","family":"pronoun-placement","title":"Little words go before a lone verb, but have a choice with two","explanation":"Little words like lo, la, los, las, me, te, nos go right before a verb that's on its own (a single changed verb): lo quiero, not quiero lo. But when a conjugated helper verb (quiero, debo, puedo, voy a...) is paired with an infinitive, the little word can go either before the whole pair or attached to the end of the infinitive - both mean the same thing.","examples":["lo quiero - I want it (only option, one verb)","quiero verlo / lo quiero ver - I want to see it (either position, two verbs)"],"track":11},{"id":"t12__question-by-tone","family":"question-by-tone","title":"Yes/no questions: same words, just ask it","explanation":"Spanish doesn't add a 'do' word to make a question. Keep the same word order as the statement and just say it with questioning intonation - in writing, wrap it in an opening and closing question mark, ¿ ?.","examples":["¿qué haces? - what are you doing?","¿por qué no puedes venir? - why can't you come?"],"track":8}],"drills":[{"id":"t12-01","type":"sentence","prompt":"It's contaminating.","answer":"Contamina.","steps":["to contaminate: contaminar","it contaminates: contamina"],"rules":["t12__verb-person-endings"],"track":12,"source":"track"},{"id":"t12-02","type":"sentence","prompt":"You (informal) contaminate.","answer":"Contaminas.","steps":["contamina + s: contaminas"],"rules":["t12__verb-person-endings"],"track":12,"source":"track"},{"id":"t12-03","type":"sentence","prompt":"I'm selling it.","answer":"Lo vendo.","steps":["to sell: vender, an -er verb","I sell: vendo","a single changed verb, so it goes before: lo vendo"],"rules":["t12__infinitive-o","t12__pronoun-placement"],"track":12,"source":"track"},{"id":"t12-04","type":"sentence","prompt":"I'm selling them.","answer":"Los vendo.","steps":["I sell: vendo","them: los"],"rules":["t12__infinitive-o","t12__lo-los-plural"],"track":12,"source":"track"},{"id":"t12-05","type":"sentence","prompt":"I'm selling them. (feminine, like the houses)","answer":"Las vendo.","steps":["la casa -> las casas (feminine plural)","I sell them: las vendo"],"rules":["t12__infinitive-o","t12__feminine-endings","t12__lo-los-plural"],"track":12,"source":"track"},{"id":"t12-06","type":"sentence","prompt":"The diversity.","answer":"La diversidad.","steps":["-ity becomes -idad, a feminine ending: diversidad","takes la: la diversidad"],"rules":["t12__feminine-endings"],"track":12,"source":"track"},{"id":"t12-07","type":"sentence","prompt":"The community.","answer":"La comunidad.","steps":["community -> comunidad, -idad ending","-idad is feminine, so la: la comunidad"],"rules":["t12__feminine-endings"],"track":12,"source":"track"},{"id":"t12-08","type":"word","prompt":"generous (feminine)","answer":"Generosa","steps":["generoso for a masculine noun","generosa for a feminine one"],"rules":["t12__feminine-endings"],"track":12,"source":"track"},{"id":"t12-09","type":"sentence","prompt":"I want to sell it.","answer":"Quiero venderlo.","steps":["I want to sell: quiero vender","it, attached: venderlo"],"rules":["t12__pronoun-placement"],"track":12,"source":"track","note":"Also fine as Lo quiero vender."},{"id":"t12-10","type":"sentence","prompt":"He sells it.","answer":"Lo vende.","steps":["he sells: vende","it, before the verb: lo vende"],"rules":["t12__verb-person-endings","t12__pronoun-placement"],"track":12,"source":"track"},{"id":"t12-11","type":"sentence","prompt":"Why aren't they selling it to me?","answer":"¿Por qué no me lo venden?","steps":["they sell: venden","the person one comes before the thing one: me lo","asked as a question: ¿Por qué no me lo venden?"],"rules":["t12__verb-person-endings","t12__pronoun-stacking-order","t12__question-by-tone"],"track":12,"source":"track"},{"id":"t12-12","type":"sentence","prompt":"They're selling us something.","answer":"Nos venden algo.","steps":["they sell: venden","us: nos","something isn't one of the little words, it comes after: algo"],"rules":["t12__verb-person-endings"],"track":12,"source":"track"},{"id":"t12-13","type":"sentence","prompt":"Why don't they sell it to us?","answer":"¿Por qué no nos lo venden?","steps":["us + it: nos lo","they sell: venden","asked as a question"],"rules":["t12__pronoun-stacking-order","t12__question-by-tone"],"track":12,"source":"track"},{"id":"t12-x01","type":"word","prompt":"electric","answer":"Eléctrico","steps":["from electricidad, drop -idad, add -o: eléctrico"],"rules":["t12__feminine-endings"],"track":12,"source":"extension","difficulty":1},{"id":"t12-x02","type":"sentence","prompt":"You (informal) sell it.","answer":"Lo vendes.","steps":["you (informal) sell: vendes","it, before the verb: lo vendes"],"rules":["t12__verb-person-endings","t12__pronoun-placement"],"track":12,"source":"extension","difficulty":1},{"id":"t12-x03","type":"sentence","prompt":"The generosity.","answer":"La generosidad.","steps":["generosity -> generosidad, -idad ending","-idad is feminine, so la: la generosidad"],"rules":["t12__feminine-endings"],"track":12,"source":"extension","difficulty":2},{"id":"t12-x04","type":"sentence","prompt":"They're not selling them to us. (feminine, like the houses)","answer":"No nos las venden.","steps":["us + them (feminine): nos las","they're not selling: no venden"],"rules":["t12__pronoun-stacking-order","t12__feminine-endings"],"track":12,"source":"extension","difficulty":2},{"id":"t12-x05","type":"sentence","prompt":"I want to know why they're not selling it to me.","answer":"Quiero saber por qué no me lo venden.","steps":["I want to know: quiero saber","why they're not selling it to me: por qué no me lo venden"],"rules":["t12__pronoun-stacking-order"],"track":12,"source":"extension","difficulty":3}],"blurb":"Ar vs er/ir conjugation patterns, feminine -idad/-ion endings, double object pronouns","sectionIndex":2},{"id":"t13","label":"Track 13","tracks":[13],"rules":[{"id":"t13__spot-the-ending","family":"spot-the-ending","title":"Meet a new verb, clock its ending first","explanation":"Every time a new verb turns up, the first thing to do is look at how the 'to' form ends - -ar, -er or -ir. Don't memorize it, just process it: hacer, -er verb, fine. Once you've clocked the ending you already know which key vowel every person takes, so the whole verb is yours without learning anything else about it.","examples":["hacer -> -er verb -> hace, hacen, haces","esperar -> -ar verb -> espera, esperan, esperas"],"track":13},{"id":"t13__puedo-can","family":"puedo-can","title":"puedo = I can, I'm able","explanation":"puedo is handed to you whole: I can, I am able. It's an -er verb, so once you have puedo everything else falls out of the ending pattern you already have - puede, puedes, pueden. Notice the d in the middle is soft, not the hard English /d/.","examples":["puedo - I can","puede - he/she/it can, you (formal) can","¿puedes venir? - can you come? (informal)"],"track":13},{"id":"t13__go-irregulars","family":"go-irregulars","title":"A closed set of verbs pop a g in the I-form only","explanation":"tener (tengo), venir (vengo), salir (salgo), and poner (pongo) all add an unexpected g right before the -o in the I-form. Every other person for these verbs follows the regular pattern from their 'to' form - it's only the I-form that's irregular this way.","examples":["tengo - I have","vengo - I come","salgo - I leave/go out","pongo - I put"],"track":13},{"id":"t13__infinitive-o","family":"infinitive-o","title":"Chop -ar/-er/-ir, add -o, move the stress","explanation":"Every Spanish verb's 'to' form (the infinitive - the way you spot a verb at all, since 'to' is what makes something a verb) ends in -ar, -er, or -ir. To get the I-form, chop off that ending and add -o. At the same time the stress moves: it lands on the syllable right before the new -o, not wherever it sat in the infinitive. This works the same whether the infinitive was -ar, -er, or -ir.","examples":["donar -> dono - I donate","crear -> creo - I create","comer (an -er verb) -> como - I eat","organizar -> organizo (the z sounds like /th/ in Spain) - I organize"],"track":10},{"id":"t13__verb-person-endings","family":"verb-person-endings","title":"The he/she/it/they/you pattern: a key vowel plus n or s","explanation":"Beyond the I-form, Spanish verbs split into two behaviors. -ar verbs use /a/ as their key vowel for he/she/it/you(formal): stem+a. -er/-ir verbs use /e/ the same way: stem+e. From there it's the same for both groups: add n to get they/you(plural), add s to the he/she/it form to get you (informal).","examples":["hablar (-ar): habla - he/she/it/you(formal) speak(s); hablan - they/you guys speak; hablas - you (informal) speak","vender (-er): vende - he/she/it/you(formal) sell(s); venden - they/you guys sell; vendes - you (informal) sell","hacer (-er): hace, hacen, haces"],"track":11},{"id":"t13__pronoun-placement","family":"pronoun-placement","title":"Little words go before a lone verb, but have a choice with two","explanation":"Little words like lo, la, los, las, me, te, nos go right before a verb that's on its own (a single changed verb): lo quiero, not quiero lo. But when a conjugated helper verb (quiero, debo, puedo, voy a...) is paired with an infinitive, the little word can go either before the whole pair or attached to the end of the infinitive - both mean the same thing.","examples":["lo quiero - I want it (only option, one verb)","quiero verlo / lo quiero ver - I want to see it (either position, two verbs)"],"track":11},{"id":"t13__question-by-tone","family":"question-by-tone","title":"Yes/no questions: same words, just ask it","explanation":"Spanish doesn't add a 'do' word to make a question. Keep the same word order as the statement and just say it with questioning intonation - in writing, wrap it in an opening and closing question mark, ¿ ?.","examples":["¿qué haces? - what are you doing?","¿por qué no puedes venir? - why can't you come?"],"track":8},{"id":"t13__ary-to-ario","family":"ary-to-ario","title":"-ary words become -ario","explanation":"English words ending -ary come over as -ario. It's the same family of endings you already convert: vocabulary is vocabulario, which comes from boca (mouth) - your vocabulary is your mouth-ulary.","examples":["necessary -> necesario","contrary -> contrario","vocabulary -> vocabulario (from boca, mouth)"],"track":13}],"drills":[{"id":"t13-01","type":"sentence","prompt":"You are doing it. (formal)","answer":"Lo hace.","steps":["to do/make: hacer, silent h, an -er verb","you (formal) do: hace","it, before the verb: lo hace"],"rules":["t13__spot-the-ending","t13__verb-person-endings","t13__pronoun-placement"],"track":13,"source":"track"},{"id":"t13-02","type":"sentence","prompt":"They're doing it.","answer":"Lo hacen.","steps":["they do: hacen","it, before the verb: lo hacen"],"rules":["t13__verb-person-endings"],"track":13,"source":"track"},{"id":"t13-03","type":"sentence","prompt":"What are you doing? (informal)","answer":"¿Qué haces?","steps":["what: qué","you (informal) do: haces","asked as a question"],"rules":["t13__verb-person-endings","t13__question-by-tone"],"track":13,"source":"track"},{"id":"t13-04","type":"sentence","prompt":"Can you come? (informal)","answer":"¿Puedes venir?","steps":["I can: puedo (irregular, given directly)","you (informal) can: puedes","to come: venir - no a needed, puedes isn't a verb of movement"],"rules":["t13__puedo-can","t13__spot-the-ending"],"track":13,"source":"track"},{"id":"t13-05","type":"sentence","prompt":"Why can't you come? (informal)","answer":"¿Por qué no puedes venir?","steps":["why: por qué","you can't come: no puedes venir","asked as a question"],"rules":["t13__puedo-can","t13__question-by-tone"],"track":13,"source":"track"},{"id":"t13-06","type":"sentence","prompt":"I want to know why you can't come. (informal)","answer":"Quiero saber por qué no puedes venir.","steps":["I want to know: quiero saber","why you can't come: por qué no puedes venir"],"rules":["t13__puedo-can"],"track":13,"source":"track"},{"id":"t13-07","type":"word","prompt":"I leave / I'm going out","answer":"Salgo","steps":["salir - regular except in the I-form","not salo, a g pops up: salgo (like vengo, tengo)"],"rules":["t13__go-irregulars"],"track":13,"source":"track"},{"id":"t13-08","type":"word","prompt":"I'm hoping / I'm waiting","answer":"Espero","steps":["to wait/hope: esperar - check it's -ar before choosing the vowel, so you don't slip in an e","chop -ar, add -o: espero"],"rules":["t13__spot-the-ending","t13__infinitive-o"],"track":13,"source":"track"},{"id":"t13-09","type":"sentence","prompt":"He's waiting.","answer":"Espera.","steps":["he waits: espera (-ar verb, key vowel a)"],"rules":["t13__verb-person-endings"],"track":13,"source":"track"},{"id":"t13-10","type":"sentence","prompt":"They're not waiting for me.","answer":"No me esperan.","steps":["no separate word needed for 'for' - it's just 'they await me'","they wait: esperan","me: before the verb: me esperan"],"rules":["t13__verb-person-endings","t13__pronoun-placement"],"track":13,"source":"track"},{"id":"t13-11","type":"sentence","prompt":"I want to know why they're not waiting for me.","answer":"Quiero saber por qué no me esperan.","steps":["I want to know: quiero saber","why they're not waiting for me: por qué no me esperan"],"rules":["t13__verb-person-endings","t13__pronoun-placement"],"track":13,"source":"track"},{"id":"t13-12","type":"word","prompt":"necessary","answer":"Necesario","steps":["-ary becomes -ario: necesario"],"rules":["t13__ary-to-ario"],"track":13,"source":"track"},{"id":"t13-x01","type":"sentence","prompt":"I buy it.","answer":"Lo compro.","steps":["to buy: comprar","I buy: compro","it, before the verb: lo compro"],"rules":["t13__infinitive-o","t13__pronoun-placement"],"track":13,"source":"extension","difficulty":1},{"id":"t13-x02","type":"sentence","prompt":"He's not waiting for us.","answer":"No nos espera.","steps":["he waits: espera","us, before the verb: nos espera"],"rules":["t13__verb-person-endings","t13__pronoun-placement"],"track":13,"source":"extension","difficulty":2},{"id":"t13-x03","type":"sentence","prompt":"I want to know why she can't wait for me.","answer":"Quiero saber por qué no puede esperarme.","steps":["I want to know: quiero saber","she can't: no puede (irregular, given)","wait for me: esperarme"],"rules":["t13__puedo-can"],"track":13,"source":"extension","difficulty":3}],"blurb":"The verb hacer, poder, and building regular -ar/-er verb endings","sectionIndex":2},{"id":"t14","label":"Track 14","tracks":[14],"rules":[{"id":"t14__se-irregular","family":"se-irregular","title":"saber's I-form is sé, not sabo","explanation":"saber breaks the usual chop-and-add-o pattern in the I-form: it's sé (with an accent), not sabo. Every other person of saber is regular (sabe, saben, sabes).","examples":["sé - I know","no sé - I don't know","sabe - he/she/it/you (formal) know(s)"],"track":14},{"id":"t14__poner-pose-family","family":"poner-pose-family","title":"English -pose becomes Spanish poner","explanation":"Just like -tain maps onto tener, English verbs ending in -pose map onto poner (to put) in Spanish: compose -> componer, suppose -> suponer, impose -> imponer, expose -> exponer, oppose -> oponer. They all share poner's irregular I-form g: compongo, supongo, and so on.","examples":["componer - to compose","suponer - to suppose -> supongo - I suppose","oponer - to oppose -> opongo - I oppose"],"track":14},{"id":"t14__que-have-to","family":"que-have-to","title":"tengo que + infinitive = have to","explanation":"Adding que after tengo turns plain possession (I have) into obligation (I have to) - there's no comfortable word-for-word translation for que here. It's the everyday, less severe way to express obligation, compared to debo.","examples":["tengo que comer - I have to eat","tengo que hacerlo - I have to do it"],"track":14},{"id":"t14__subject-pronouns","family":"subject-pronouns","title":"yo / él / ella - optional, for emphasis or contrast","explanation":"The verb ending already shows who's doing the action, so Spanish normally drops the subject word entirely. yo (I), él (he), and ella (she) are there for when you want to be emphatic or draw a contrast - or just to clarify who 'he/she/it/you formal' refers to.","examples":["no quiero invitarlo, pero ella sí - I don't want to invite him, but she does","no sé qué él quiere - I don't know what HE wants"],"track":14},{"id":"t14__go-irregulars","family":"go-irregulars","title":"A closed set of verbs pop a g in the I-form only","explanation":"tener (tengo), venir (vengo), salir (salgo), and poner (pongo) all add an unexpected g right before the -o in the I-form. Every other person for these verbs follows the regular pattern from their 'to' form - it's only the I-form that's irregular this way.","examples":["tengo - I have","vengo - I come","salgo - I leave/go out","pongo - I put"],"track":13},{"id":"t14__movement-verb-a","family":"movement-verb-a","title":"Verbs of movement take a before an infinitive","explanation":"When a verb that carries a sense of motion - voy (I'm going), venir (to come), salir (to leave/go out) - is followed by another verb in its 'to' form, Spanish inserts a in between. Verbs without a movement sense, like quiero or puedo, don't take this a.","examples":["voy a hablar - I'm going to speak","salgo a comer - I'm going out to eat"],"track":7},{"id":"t14__lo-los-plural","family":"lo-los-plural","title":"Add s to pluralize: lo/la -> los/las (them)","explanation":"lo (him/it/formal you) and la (her/it fem./formal you to a female) both pluralize the same way - just add an s. los means them for masculine words, las means them for feminine words.","examples":["lo -> los, la -> las","debo identificarlos - I must identify them","debo identificarlas - I must identify them (feminine)"],"track":7},{"id":"t14__verb-person-endings","family":"verb-person-endings","title":"The he/she/it/they/you pattern: a key vowel plus n or s","explanation":"Beyond the I-form, Spanish verbs split into two behaviors. -ar verbs use /a/ as their key vowel for he/she/it/you(formal): stem+a. -er/-ir verbs use /e/ the same way: stem+e. From there it's the same for both groups: add n to get they/you(plural), add s to the he/she/it form to get you (informal).","examples":["hablar (-ar): habla - he/she/it/you(formal) speak(s); hablan - they/you guys speak; hablas - you (informal) speak","vender (-er): vende - he/she/it/you(formal) sell(s); venden - they/you guys sell; vendes - you (informal) sell","hacer (-er): hace, hacen, haces"],"track":11},{"id":"t14__question-by-tone","family":"question-by-tone","title":"Yes/no questions: same words, just ask it","explanation":"Spanish doesn't add a 'do' word to make a question. Keep the same word order as the statement and just say it with questioning intonation - in writing, wrap it in an opening and closing question mark, ¿ ?.","examples":["¿qué haces? - what are you doing?","¿por qué no puedes venir? - why can't you come?"],"track":8},{"id":"t14__debo-must","family":"debo-must","title":"debo (I owe) + infinitive = I must","explanation":"debo literally means I owe. Put it in front of a verb's 'to' form and it means I must / I have to - more serious in tone than tengo que.","examples":["debo invitarlo - I must invite him","debo verla - I must see her"],"track":8}],"drills":[{"id":"t14-01","type":"sentence","prompt":"I don't know.","answer":"No sé.","steps":["I know: sé (irregular - not sabo)","I don't know: no sé"],"rules":["t14__se-irregular"],"track":14,"source":"track"},{"id":"t14-02","type":"sentence","prompt":"I don't know what he wants.","answer":"No sé qué quiere.","steps":["I don't know: no sé","what: qué","he wants - contained in the verb, no separate word for 'he' needed: quiere"],"rules":["t14__se-irregular"],"track":14,"source":"track"},{"id":"t14-03","type":"sentence","prompt":"I don't know what he wants. (emphatic)","answer":"No sé qué él quiere.","steps":["he, for emphasis/clarity: él","put it together: no sé qué él quiere"],"rules":["t14__subject-pronouns","t14__se-irregular"],"track":14,"source":"track"},{"id":"t14-04","type":"sentence","prompt":"She sees.","answer":"Ella ve.","steps":["she: ella","to see: ver, an -er verb","she sees: ve"],"rules":["t14__subject-pronouns","t14__verb-person-endings"],"track":14,"source":"track"},{"id":"t14-05","type":"sentence","prompt":"I don't want to invite him, but she does.","answer":"No quiero invitarlo, pero ella sí.","steps":["I don't want to invite him: no quiero invitarlo","but: pero","she does - literally 'she yes': ella sí"],"rules":["t14__subject-pronouns"],"track":14,"source":"track"},{"id":"t14-06","type":"sentence","prompt":"He leaves. / He goes out.","answer":"Sale.","steps":["salir - the g only pops up in the I-form (salgo); other forms are regular","he leaves: sale"],"rules":["t14__verb-person-endings"],"track":14,"source":"track"},{"id":"t14-07","type":"sentence","prompt":"I'm going out to eat.","answer":"Salgo a comer.","steps":["I'm going out: salgo","salir is a verb of movement too, so a before the next verb","to eat: comer"],"rules":["t14__go-irregulars","t14__movement-verb-a"],"track":14,"source":"track"},{"id":"t14-08","type":"sentence","prompt":"I have them.","answer":"Los tengo.","steps":["I have: tengo","them: los"],"rules":["t14__go-irregulars","t14__lo-los-plural"],"track":14,"source":"track"},{"id":"t14-09","type":"sentence","prompt":"I have to do it.","answer":"Tengo que hacerlo.","steps":["I have to: tengo que","to do it: hacerlo"],"rules":["t14__que-have-to"],"track":14,"source":"track","note":"Also fine as Lo tengo que hacer."},{"id":"t14-10","type":"sentence","prompt":"When are you coming to eat? (informal)","answer":"¿Cuándo vienes a comer?","steps":["when: cuándo","you (informal) come: vienes","don't translate English's 'are' literally","to eat: a comer (venir is a verb of movement)"],"rules":["t14__movement-verb-a","t14__question-by-tone"],"track":14,"source":"track"},{"id":"t14-11","type":"word","prompt":"I obtain","answer":"Obtengo","steps":["obtener behaves like tener: obtengo"],"rules":["t14__go-irregulars"],"track":14,"source":"track"},{"id":"t14-12","type":"word","prompt":"I suppose","answer":"Supongo","steps":["-pose becomes poner: suponer","I put/pose: pongo, so I suppose: supongo"],"rules":["t14__poner-pose-family","t14__go-irregulars"],"track":14,"source":"track"},{"id":"t14-13","type":"sentence","prompt":"I oppose it.","answer":"Lo opongo.","steps":["to oppose: oponer","I oppose: opongo","it, before the verb: lo opongo"],"rules":["t14__poner-pose-family","t14__go-irregulars"],"track":14,"source":"track"},{"id":"t14-14","type":"sentence","prompt":"I have to see her.","answer":"Tengo que verla.","steps":["I have to: tengo que","to see her: verla"],"rules":["t14__que-have-to"],"track":14,"source":"track","note":"Also fine as La tengo que ver."},{"id":"t14-15","type":"sentence","prompt":"I must see her.","answer":"Debo verla.","steps":["I must, more serious than tengo que: debo","to see her: verla"],"rules":["t14__debo-must"],"track":14,"source":"track"},{"id":"t14-x01","type":"word","prompt":"to impose","answer":"Imponer","steps":["-pose becomes poner: imponer"],"rules":["t14__poner-pose-family"],"track":14,"source":"extension","difficulty":1},{"id":"t14-x02","type":"sentence","prompt":"I have to eat now.","answer":"Tengo que comer ahora.","steps":["I have to eat: tengo que comer","now: ahora"],"rules":["t14__que-have-to"],"track":14,"source":"extension","difficulty":1},{"id":"t14-x03","type":"sentence","prompt":"I don't have to obtain it now.","answer":"No tengo que obtenerlo ahora.","steps":["I don't have to: no tengo que","obtain it: obtenerlo","now: ahora"],"rules":["t14__que-have-to","t14__go-irregulars"],"track":14,"source":"extension","difficulty":2},{"id":"t14-x04","type":"sentence","prompt":"I compose it.","answer":"Lo compongo.","steps":["to compose: componer","I compose: compongo","it, before the verb: lo compongo"],"rules":["t14__poner-pose-family","t14__go-irregulars"],"track":14,"source":"extension","difficulty":2},{"id":"t14-x05","type":"sentence","prompt":"I have to try to obtain it now.","answer":"Tengo que intentar obtenerlo ahora.","steps":["I have to try: tengo que intentar","to obtain it: obtenerlo","now: ahora"],"rules":["t14__que-have-to","t14__go-irregulars"],"track":14,"source":"extension","difficulty":3}],"blurb":"Irregular I-forms saber and salir, plus tener/poner verb families","sectionIndex":2},{"id":"t15","label":"Track 15","tracks":[15],"rules":[{"id":"t15__e-split-ie","family":"e-split-ie","title":"A stressed e in the root splits into ie","explanation":"Go back to the 'to' form first and take the ending off, because the e that matters is the one in the root - the e in quer-, ten-, pens-, not the one in -er. When your new ending pulls the stress onto that e, it usually splits into ie. It doesn't happen where a g is already holding the form together (tengo, vengo), and some verbs simply never split (esperar, llegar, comer, comprender) - so you test it and let the feedback tell you.","examples":["querer -> quer- -> quiero","pensar -> piens- -> pienso; entender -> entiend- -> entiendo; perder -> pierd- -> pierdo","you can see the same split between English and Spanish: tempo -> tiempo, concert -> concierto, November -> noviembre","but tengo, vengo - the g holds it up; and espero, como - these just don't split"],"track":15},{"id":"t15__lo-los-plural","family":"lo-los-plural","title":"Add s to pluralize: lo/la -> los/las (them)","explanation":"lo (him/it/formal you) and la (her/it fem./formal you to a female) both pluralize the same way - just add an s. los means them for masculine words, las means them for feminine words.","examples":["lo -> los, la -> las","debo identificarlos - I must identify them","debo identificarlas - I must identify them (feminine)"],"track":7},{"id":"t15__verb-person-endings","family":"verb-person-endings","title":"The he/she/it/they/you pattern: a key vowel plus n or s","explanation":"Beyond the I-form, Spanish verbs split into two behaviors. -ar verbs use /a/ as their key vowel for he/she/it/you(formal): stem+a. -er/-ir verbs use /e/ the same way: stem+e. From there it's the same for both groups: add n to get they/you(plural), add s to the he/she/it form to get you (informal).","examples":["hablar (-ar): habla - he/she/it/you(formal) speak(s); hablan - they/you guys speak; hablas - you (informal) speak","vender (-er): vende - he/she/it/you(formal) sell(s); venden - they/you guys sell; vendes - you (informal) sell","hacer (-er): hace, hacen, haces"],"track":11},{"id":"t15__pronoun-placement","family":"pronoun-placement","title":"Little words go before a lone verb, but have a choice with two","explanation":"Little words like lo, la, los, las, me, te, nos go right before a verb that's on its own (a single changed verb): lo quiero, not quiero lo. But when a conjugated helper verb (quiero, debo, puedo, voy a...) is paired with an infinitive, the little word can go either before the whole pair or attached to the end of the infinitive - both mean the same thing.","examples":["lo quiero - I want it (only option, one verb)","quiero verlo / lo quiero ver - I want to see it (either position, two verbs)"],"track":11},{"id":"t15__question-by-tone","family":"question-by-tone","title":"Yes/no questions: same words, just ask it","explanation":"Spanish doesn't add a 'do' word to make a question. Keep the same word order as the statement and just say it with questioning intonation - in writing, wrap it in an opening and closing question mark, ¿ ?.","examples":["¿qué haces? - what are you doing?","¿por qué no puedes venir? - why can't you come?"],"track":8}],"drills":[{"id":"t15-01","type":"sentence","prompt":"What's happening?","answer":"¿Qué pasa?","steps":["what: qué","it passes/happens: pasa","asked as a question"],"rules":["t15__question-by-tone"],"track":15,"source":"track"},{"id":"t15-02","type":"sentence","prompt":"I want to know what's happening.","answer":"Quiero saber qué pasa.","steps":["I want to know: quiero saber","what's happening: qué pasa"],"rules":["t15__e-split-ie"],"track":15,"source":"track"},{"id":"t15-03","type":"word","prompt":"I think","answer":"Pienso","steps":["to think: pensar","the root e is stressed and splits: pienso"],"rules":["t15__e-split-ie"],"track":15,"source":"track"},{"id":"t15-04","type":"sentence","prompt":"What do you think? (informal)","answer":"¿Qué piensas?","steps":["he/she/it thinks: piensa","add s for informal you: piensas","asked as a question"],"rules":["t15__e-split-ie","t15__verb-person-endings","t15__question-by-tone"],"track":15,"source":"track"},{"id":"t15-05","type":"sentence","prompt":"I plan on eating later.","answer":"Pienso comer más tarde.","steps":["I think to = I plan on: pienso","to eat: comer","later: más tarde"],"rules":["t15__e-split-ie"],"track":15,"source":"track"},{"id":"t15-06","type":"sentence","prompt":"I understand.","answer":"Entiendo.","steps":["to understand: entender","the root e splits: entiendo"],"rules":["t15__e-split-ie"],"track":15,"source":"track"},{"id":"t15-07","type":"sentence","prompt":"He understands.","answer":"Entiende.","steps":["he/she/it understands: entiende"],"rules":["t15__e-split-ie","t15__verb-person-endings"],"track":15,"source":"track"},{"id":"t15-08","type":"sentence","prompt":"They understand.","answer":"Entienden.","steps":["entiende + n: entienden"],"rules":["t15__e-split-ie","t15__verb-person-endings"],"track":15,"source":"track"},{"id":"t15-09","type":"word","prompt":"I lose","answer":"Pierdo","steps":["to lose: perder","the root e splits: pierdo"],"rules":["t15__e-split-ie"],"track":15,"source":"track"},{"id":"t15-10","type":"sentence","prompt":"I lose it.","answer":"Lo pierdo.","steps":["I lose: pierdo","it, before the verb: lo pierdo"],"rules":["t15__e-split-ie","t15__pronoun-placement"],"track":15,"source":"track"},{"id":"t15-11","type":"sentence","prompt":"I lose them.","answer":"Los pierdo.","steps":["I lose: pierdo","them: los"],"rules":["t15__e-split-ie","t15__lo-los-plural"],"track":15,"source":"track"},{"id":"t15-x01","type":"word","prompt":"she thinks","answer":"Piensa","steps":["pensar - the root e splits: piensa"],"rules":["t15__e-split-ie","t15__verb-person-endings"],"track":15,"source":"extension","difficulty":1},{"id":"t15-x02","type":"sentence","prompt":"I don't understand.","answer":"No entiendo.","steps":["I understand: entiendo","I don't understand: no entiendo"],"rules":["t15__e-split-ie"],"track":15,"source":"extension","difficulty":1},{"id":"t15-x03","type":"sentence","prompt":"I plan on trying to understand it.","answer":"Pienso intentar entenderlo.","steps":["I plan on: pienso","trying: intentar","to understand it: entenderlo"],"rules":["t15__e-split-ie"],"track":15,"source":"extension","difficulty":2},{"id":"t15-x04","type":"sentence","prompt":"I don't understand what's happening, but I don't want to lose them.","answer":"No entiendo qué pasa, pero no quiero perderlos.","steps":["I don't understand: no entiendo, the e splits to ie","what's happening: qué pasa","but: pero","I don't want to lose them: no quiero perderlos"],"rules":["t15__e-split-ie","t15__lo-los-plural"],"track":15,"source":"extension","difficulty":3}],"blurb":"Present tense e-to-ie stem splitting in querer, tener, pensar, entender","sectionIndex":2},{"id":"t16","label":"Track 16","tracks":[16],"rules":[{"id":"t16__noun-from-verb-form","family":"noun-from-verb-form","title":"The verb form that is secretly a noun (un encuentro)","explanation":"A conjugated-looking form can also be the noun for that action, and the giveaway is whether the or a fits in front of it - if it does, it's a noun, not a verb. Encuentro is \"I encounter\", but un encuentro is \"an encounter\"; muestro is \"I show\", but una muestra is \"a sample\".","examples":["encuentro (I find) -> un encuentro (an encounter)","muestro (I show) -> una muestra (a sample)","bebida (from beber, to drink) -> una bebida (a drink)"],"track":16},{"id":"t16__e-split-ie","family":"e-split-ie","title":"A stressed e in the root splits into ie","explanation":"Go back to the 'to' form first and take the ending off, because the e that matters is the one in the root - the e in quer-, ten-, pens-, not the one in -er. When your new ending pulls the stress onto that e, it usually splits into ie. It doesn't happen where a g is already holding the form together (tengo, vengo), and some verbs simply never split (esperar, llegar, comer, comprender) - so you test it and let the feedback tell you.","examples":["querer -> quer- -> quiero","pensar -> piens- -> pienso; entender -> entiend- -> entiendo; perder -> pierd- -> pierdo","you can see the same split between English and Spanish: tempo -> tiempo, concert -> concierto, November -> noviembre","but tengo, vengo - the g holds it up; and espero, como - these just don't split"],"track":15},{"id":"t16__reflexive-change-state","family":"reflexive-change-state","title":"Doing it to yourself: me duermo is I fall asleep","explanation":"Adding me in front of the verb turns \"I sleep\" into \"I sleep myself\", which is how Spanish says a change happens to you rather than something you just do. Me duermo isn't \"I sleep\", it's \"I fall asleep\" - the reflexive marks the moment you go from awake to asleep.","examples":["duermo (I sleep) -> me duermo (I fall asleep)"],"track":16},{"id":"t16__o-split-ue","family":"o-split-ue","title":"A stressed o in the root splits into ue","explanation":"In the present the stress lands on the second-to-last syllable of nearly every form, and that is what makes the root vowel vulnerable: the same stress that splits e into ie splits a stressed o into ue. Go back to the 'to' form, take the ending off, and if the root's o is about to take the stress it can become ue before you add your ending. The same shift shows up between English and Spanish words: port/puerto, force/fuerza, school/escuela.","examples":["poder -> pued- -> puedo","dormir -> duerm- -> duermo","encontrar -> encuentr- -> encuentro","mostrar -> muestr- -> muestro","colgar -> cuelg- -> cuelgo"],"track":16}],"drills":[{"id":"t16-01","type":"word","prompt":"I start","answer":"Empiezo","steps":["go back to the \"to\" form: empezar","take off -ar and add your ending","the stressed e splits to ie: empiezo"],"rules":["t16__e-split-ie"],"track":16,"source":"track"},{"id":"t16-02","type":"word","prompt":"He starts","answer":"Empieza","steps":["back to empezar","he/she/you (formal) ending: -a","the e splits: empieza"],"rules":["t16__e-split-ie"],"track":16,"source":"track"},{"id":"t16-03","type":"sentence","prompt":"When are you starting? (informal)","answer":"¿Cuándo empiezas?","steps":["when: cuándo","you (informal) starting: empiezas, with the e split to ie"],"rules":["t16__e-split-ie"],"track":16,"source":"track"},{"id":"t16-04","type":"word","prompt":"I sleep","answer":"Duermo","steps":["back to dormir","take off -ir, add -o","the stressed o splits to ue: duermo"],"rules":["t16__o-split-ue"],"track":16,"source":"track"},{"id":"t16-05","type":"sentence","prompt":"I'm falling asleep.","answer":"Me duermo.","steps":["I sleep: duermo, with the o split to ue","add me in front to say you're doing it to yourself: me duermo"],"rules":["t16__o-split-ue","t16__reflexive-change-state"],"track":16,"source":"track"},{"id":"t16-06","type":"word","prompt":"They sleep","answer":"Duermen","steps":["back to dormir","they ending: -en","the o splits: duermen"],"rules":["t16__o-split-ue"],"track":16,"source":"track"},{"id":"t16-07","type":"sentence","prompt":"I find it. / I'm finding it.","answer":"Lo encuentro.","steps":["it: lo (from earlier), goes out front","back to encontrar","the stressed o splits to ue: encuentro"],"rules":["t16__o-split-ue"],"track":16,"source":"track"},{"id":"t16-08","type":"word","prompt":"I show","answer":"Muestro","steps":["demostrar minus de- leaves mostrar, to show","back to mostrar, take off -ar, add -o","the o splits to ue: muestro"],"rules":["t16__o-split-ue","t16__noun-from-verb-form"],"track":16,"source":"track","note":"Una muestra, from this same verb form, is a sample."},{"id":"t16-x01","type":"word","prompt":"He finds it","answer":"Lo encuentra","steps":["it: lo out front","back to encontrar, he/she/you (formal) ending: -a","the o splits: encuentra"],"rules":["t16__o-split-ue"],"track":16,"source":"extension","difficulty":1},{"id":"t16-x02","type":"word","prompt":"You sleep (informal)","answer":"Duermes","steps":["back to dormir, you (informal) ending: -es","the o splits: duermes"],"rules":["t16__o-split-ue"],"track":16,"source":"extension","difficulty":1},{"id":"t16-x03","type":"sentence","prompt":"I find it and I start now.","answer":"Lo encuentro y empiezo ahora.","steps":["it: lo out front","I find: encuentro, o splits to ue","and: y","I start: empiezo, e splits to ie","now: ahora (from earlier)"],"rules":["t16__o-split-ue","t16__e-split-ie"],"track":16,"source":"extension","difficulty":2},{"id":"t16-x04","type":"sentence","prompt":"I want to find it, but he starts now.","answer":"Lo quiero encontrar, pero él empieza ahora.","steps":["it: lo out front","I want: quiero (from earlier)","to find: encontrar stays as the \"to\" form after quiero, no split","but: pero (from earlier)","he: él","starts: empieza, e splits to ie","now: ahora (from earlier)"],"rules":["t16__e-split-ie"],"track":16,"source":"extension","difficulty":3}],"blurb":"O-to-ue stem splitting in poder, dormir, encontrar, and empezar","sectionIndex":2},{"id":"t17","label":"Track 17","tracks":[17],"rules":[{"id":"t17__al-arabic-prefix","family":"al-arabic-prefix","title":"Words starting al- came in from Arabic","explanation":"Spanish words that begin al- (not just end in -al, like normal or metal) usually come from Arabic, where al- means \"the\". When that l meets certain following letters it assimilates to match them, doubling the next consonant instead - al ruz became arruz then arroz, and al zucar became azúcar. English often borrowed the same root without its al-, which is why sugar and azucar look different but are the same word.","examples":["al ruz -> arruz -> arroz - rice","al zucar -> azúcar - sugar","alcohol, algebra, alfombra, almohada"],"track":17},{"id":"t17__ar-we-form-amos","family":"ar-we-form-amos","title":"The we-form of an -ar verb: -amos","explanation":"For the we form of an -ar verb, take off the -ar and put on -amos. This adds two syllables, so the stress lands two syllables from the end instead of on the root - which means an e or o in the root that normally splits under stress in other forms stays intact here, because it isn't being stressed anymore.","examples":["tomar -> tomamos","hablar -> hablamos","encontrar -> encontramos (no split: not stressed)","mostrar -> mostramos (no split: not stressed)"],"track":17},{"id":"t17__e-split-ie","family":"e-split-ie","title":"A stressed e in the root splits into ie","explanation":"Go back to the 'to' form first and take the ending off, because the e that matters is the one in the root - the e in quer-, ten-, pens-, not the one in -er. When your new ending pulls the stress onto that e, it usually splits into ie. It doesn't happen where a g is already holding the form together (tengo, vengo), and some verbs simply never split (esperar, llegar, comer, comprender) - so you test it and let the feedback tell you.","examples":["querer -> quer- -> quiero","pensar -> piens- -> pienso; entender -> entiend- -> entiendo; perder -> pierd- -> pierdo","you can see the same split between English and Spanish: tempo -> tiempo, concert -> concierto, November -> noviembre","but tengo, vengo - the g holds it up; and espero, como - these just don't split"],"track":15},{"id":"t17__o-split-ue","family":"o-split-ue","title":"A stressed o in the root splits into ue","explanation":"In the present the stress lands on the second-to-last syllable of nearly every form, and that is what makes the root vowel vulnerable: the same stress that splits e into ie splits a stressed o into ue. Go back to the 'to' form, take the ending off, and if the root's o is about to take the stress it can become ue before you add your ending. The same shift shows up between English and Spanish words: port/puerto, force/fuerza, school/escuela.","examples":["poder -> pued- -> puedo","dormir -> duerm- -> duermo","encontrar -> encuentr- -> encuentro","mostrar -> muestr- -> muestro","colgar -> cuelg- -> cuelgo"],"track":16}],"drills":[{"id":"t17-01","type":"word","prompt":"I want","answer":"Quiero","steps":["back to querer","take off -er, add -o","the stressed e splits to ie: quiero"],"rules":["t17__e-split-ie"],"track":17,"source":"track"},{"id":"t17-02","type":"sentence","prompt":"What do you want? (informal)","answer":"¿Qué quieres?","steps":["what: qué","you want: quieres, e split to ie"],"rules":["t17__e-split-ie"],"track":17,"source":"track"},{"id":"t17-03","type":"word","prompt":"I lose","answer":"Pierdo","steps":["back to perder","take off -er, add -o","the e splits to ie: pierdo"],"rules":["t17__e-split-ie"],"track":17,"source":"track"},{"id":"t17-04","type":"word","prompt":"I eat","answer":"Como","steps":["back to comer, take off -er, add -o","the e stays put here - not every verb splits, you have to test it"],"rules":["t17__e-split-ie"],"track":17,"source":"track","note":"Comer doesn't split, even though it looks like a candidate - there's no way to know in advance."},{"id":"t17-05","type":"sentence","prompt":"She hangs them.","answer":"Los cuelga.","steps":["them: los out front (from earlier)","back to colgar, she/he/you (formal) ending: -a","the o splits to ue: cuelga"],"rules":["t17__o-split-ue"],"track":17,"source":"track"},{"id":"t17-06","type":"sentence","prompt":"I want rice.","answer":"Quiero arroz.","steps":["I want: quiero (from earlier)","rice: arroz - from Arabic al ruz, the l assimilating to the r"],"rules":["t17__al-arabic-prefix"],"track":17,"source":"track"},{"id":"t17-07","type":"sentence","prompt":"I don't take sugar.","answer":"No tomo azúcar.","steps":["no in front: no","I take: tomo","sugar: azúcar - from Arabic al zucar, the l assimilating to the z"],"rules":["t17__al-arabic-prefix"],"track":17,"source":"track"},{"id":"t17-08","type":"word","prompt":"We take","answer":"Tomamos","steps":["back to tomar","take off -ar, add -amos"],"rules":["t17__ar-we-form-amos"],"track":17,"source":"track"},{"id":"t17-09","type":"sentence","prompt":"We find it.","answer":"Lo encontramos.","steps":["it: lo out front","back to encontrar, take off -ar, add -amos","the o doesn't split here - the we-form isn't stressed on the root"],"rules":["t17__ar-we-form-amos","t17__o-split-ue"],"track":17,"source":"track"},{"id":"t17-x01","type":"word","prompt":"I think","answer":"Pienso","steps":["back to pensar","take off -ar, add -o","the e splits to ie: pienso"],"rules":["t17__e-split-ie"],"track":17,"source":"extension","difficulty":1},{"id":"t17-x02","type":"sentence","prompt":"We close it.","answer":"Lo cerramos.","steps":["it: lo out front","back to cerrar, take off -ar, add -amos: cerramos"],"rules":["t17__ar-we-form-amos"],"track":17,"source":"extension","difficulty":1},{"id":"t17-x03","type":"sentence","prompt":"I want rice, but I don't want sugar.","answer":"Quiero arroz, pero no quiero azúcar.","steps":["I want rice: quiero arroz","but: pero (from earlier)","I don't want: no quiero","sugar: azúcar"],"rules":["t17__al-arabic-prefix","t17__e-split-ie"],"track":17,"source":"extension","difficulty":2},{"id":"t17-x04","type":"sentence","prompt":"I hang it, but we don't hang it now.","answer":"Lo cuelgo, pero no lo colgamos ahora.","steps":["it: lo out front","I hang: cuelgo, o splits to ue","but: pero (from earlier)","we don't hang it: no lo colgamos - we-form, no split","now: ahora (from earlier)"],"rules":["t17__o-split-ue","t17__ar-we-form-amos"],"track":17,"source":"extension","difficulty":3}],"blurb":"We-form -amos ending and why stressed stems stop splitting","sectionIndex":2},{"id":"t18","label":"Track 18","tracks":[18],"rules":[{"id":"t18__soft-b-v","family":"soft-b-v","title":"v sounds like a soft b","explanation":"Spanish v is usually a soft, non-plosive b - not the hard English b (as in bucket, where a burst of air shoots out) and not an English v either. It shifts more toward an English /v/ in places like Argentina and Chile, but soft b is the safe default. voy (I go / I'm going) is easiest to remember through the word voyage. The same soft b covers words spelled with b, so vivir and saber use one identical sound. The closer you match the people you're listening to, the easier real speech gets to follow.","examples":["vivir, vive, verano - all pronounced with the soft b","saber - spelled with b, same soft-b sound"],"track":6},{"id":"t18__er-ir-we-form","family":"er-ir-we-form","title":"The we-form is the one place -er and -ir differ","explanation":"This is the one place in the whole language where -er and -ir verbs behave differently: for we, -er verbs take -emos and -ir verbs take -imos. Take off the ending and put on -emos or -imos depending on which group the verb started in; like the -ar we-form, the stress moves off the root so any e or o there stays whole.","examples":["preferir -> preferimos","venir -> venimos","vivir -> vivimos","entender -> entendemos","perder -> perdemos"],"track":18},{"id":"t18__e-split-ie","family":"e-split-ie","title":"A stressed e in the root splits into ie","explanation":"Go back to the 'to' form first and take the ending off, because the e that matters is the one in the root - the e in quer-, ten-, pens-, not the one in -er. When your new ending pulls the stress onto that e, it usually splits into ie. It doesn't happen where a g is already holding the form together (tengo, vengo), and some verbs simply never split (esperar, llegar, comer, comprender) - so you test it and let the feedback tell you.","examples":["querer -> quer- -> quiero","pensar -> piens- -> pienso; entender -> entiend- -> entiendo; perder -> pierd- -> pierdo","you can see the same split between English and Spanish: tempo -> tiempo, concert -> concierto, November -> noviembre","but tengo, vengo - the g holds it up; and espero, como - these just don't split"],"track":15},{"id":"t18__verb-person-endings","family":"verb-person-endings","title":"The he/she/it/they/you pattern: a key vowel plus n or s","explanation":"Beyond the I-form, Spanish verbs split into two behaviors. -ar verbs use /a/ as their key vowel for he/she/it/you(formal): stem+a. -er/-ir verbs use /e/ the same way: stem+e. From there it's the same for both groups: add n to get they/you(plural), add s to the he/she/it form to get you (informal).","examples":["hablar (-ar): habla - he/she/it/you(formal) speak(s); hablan - they/you guys speak; hablas - you (informal) speak","vender (-er): vende - he/she/it/you(formal) sell(s); venden - they/you guys sell; vendes - you (informal) sell","hacer (-er): hace, hacen, haces"],"track":11}],"drills":[{"id":"t18-01","type":"word","prompt":"I prefer","answer":"Prefiero","steps":["back to preferir","take off -ir, add -o","the e splits to ie: prefiero"],"rules":["t18__e-split-ie"],"track":18,"source":"track"},{"id":"t18-02","type":"word","prompt":"We prefer","answer":"Preferimos","steps":["back to preferir","-ir verb, so take off -ir and add -imos: preferimos"],"rules":["t18__er-ir-we-form"],"track":18,"source":"track"},{"id":"t18-03","type":"word","prompt":"We come","answer":"Venimos","steps":["back to venir","-ir verb: take off -ir, add -imos: venimos"],"rules":["t18__er-ir-we-form"],"track":18,"source":"track"},{"id":"t18-04","type":"sentence","prompt":"I don't live here, but he lives here.","answer":"No vivo aquí, pero él vive aquí.","steps":["no in front, I live: no vivo","here: aquí","but: pero (from earlier)","he lives: vive - the v is that soft b sound"],"rules":["t18__soft-b-v"],"track":18,"source":"track"},{"id":"t18-05","type":"word","prompt":"To know","answer":"Saber","steps":["spelled with a b, not a v","pronounced with that same soft-b sound as vivir"],"rules":["t18__soft-b-v"],"track":18,"source":"track"},{"id":"t18-06","type":"sentence","prompt":"Where do they live?","answer":"¿Dónde viven?","steps":["where: dónde","they live: viven - back to vivir, they-ending -en"],"rules":["t18__verb-person-endings"],"track":18,"source":"track"},{"id":"t18-07","type":"sentence","prompt":"I want to know where they live.","answer":"Quiero saber dónde viven.","steps":["I want: quiero (from earlier)","to know: saber","where they live: dónde viven"],"rules":["t18__soft-b-v"],"track":18,"source":"track"},{"id":"t18-08","type":"word","prompt":"I understand","answer":"Entiendo","steps":["back to entender","take off -er, add -o","the e splits to ie: entiendo"],"rules":["t18__e-split-ie"],"track":18,"source":"track"},{"id":"t18-09","type":"sentence","prompt":"We always lose.","answer":"Siempre perdemos.","steps":["always: siempre","back to perder, -er verb: take off -er, add -emos: perdemos","no split - the we-form isn't stressed on the root"],"rules":["t18__er-ir-we-form"],"track":18,"source":"track","note":"Also fine as Perdemos siempre."},{"id":"t18-x01","type":"word","prompt":"We understand it","answer":"Lo entendemos","steps":["it: lo out front","back to entender, -er verb: take off -er, add -emos: entendemos"],"rules":["t18__er-ir-we-form"],"track":18,"source":"extension","difficulty":1},{"id":"t18-x02","type":"word","prompt":"You prefer (informal)","answer":"Prefieres","steps":["back to preferir, you (informal) ending: -es","the e splits: prefieres"],"rules":["t18__e-split-ie"],"track":18,"source":"extension","difficulty":1},{"id":"t18-x03","type":"sentence","prompt":"I live here, but I don't understand it.","answer":"Vivo aquí, pero no lo entiendo.","steps":["I live here: vivo aquí","but: pero (from earlier)","it: lo out front","I don't understand: no entiendo, e splits to ie"],"rules":["t18__e-split-ie"],"track":18,"source":"extension","difficulty":2},{"id":"t18-x04","type":"sentence","prompt":"I want to know why we always lose, but he doesn't understand it.","answer":"Quiero saber por qué siempre perdemos, pero no lo entiende.","steps":["I want to know: quiero saber","why: por qué","always: siempre","we lose: perdemos, we-form, no split","but: pero (from earlier)","it: lo out front","he doesn't understand: no entiende, e splits to ie"],"rules":["t18__er-ir-we-form","t18__e-split-ie"],"track":18,"source":"extension","difficulty":3}],"blurb":"The -er/-ir we-form split (-emos vs -imos) via preferir and vivir","sectionIndex":2},{"id":"t19","label":"Track 19","tracks":[19],"rules":[{"id":"t19__vamos-backwards","family":"vamos-backwards","title":"Working backwards from vamos to the rest of ir","explanation":"Ir (to go) is very irregular, but once you know vamos (we go), you can strip off -amos and add the other person endings to get va (he/she/it/you formal), vas (you informal), and van (they/you plural). Voy (I go) is remembered separately, from 'voyage'.","examples":["vamos -> va","vamos -> vas","vamos -> van","voy (I go, remembered from voyage)"],"track":19},{"id":"t19__feminine-endings","family":"feminine-endings","title":"-a, -ión and -idad mark feminine words","explanation":"A word ending in -a, -ión, or -idad is (almost) always feminine and takes la/las. English -ity words become -idad in Spanish (diversity -> diversidad), and English -tion words become -ión, following the pattern you already know. Adjectives agree the same way: the masculine -o ending becomes -a for a feminine noun. Words ending in -e could go either way and have to be picked up from context - la noche and la carne both turn out to be feminine.","examples":["la diversidad - the diversity (from diversity -> diversidad)","la comunidad - the community","generoso -> generosa - generous, for a feminine noun","la noche, la carne - -e words you just meet and keep","la oportunidad - the opportunity"],"track":12},{"id":"t19__que-have-to","family":"que-have-to","title":"tengo que + infinitive = have to","explanation":"Adding que after tengo turns plain possession (I have) into obligation (I have to) - there's no comfortable word-for-word translation for que here. It's the everyday, less severe way to express obligation, compared to debo.","examples":["tengo que ir - I have to go","tengo que ir esta noche - I have to go tonight"],"track":14},{"id":"t19__e-split","family":"e-split","title":"The same e/o split, outside verbs","explanation":"The split you keep meeting in verbs - quiero, puedo - is not a verb thing, it's a Spanish thing. Plenty of ordinary words split the same vowel, and a Latin cousin that kept the plain e or o gives the game away: Italian sempre next to siempre, bene next to bien, French bon next to bueno. Noticing that is what makes the new word stick without memorizing it.","examples":["sempre (Italian) -> siempre","bene (Italian) -> bien","bon (French) -> bueno","tempo -> tiempo, the same split you met in verbs"],"track":19},{"id":"t19__infinitive-o","family":"infinitive-o","title":"Chop -ar/-er/-ir, add -o, move the stress","explanation":"Every Spanish verb's 'to' form (the infinitive - the way you spot a verb at all, since 'to' is what makes something a verb) ends in -ar, -er, or -ir. To get the I-form, chop off that ending and add -o. At the same time the stress moves: it lands on the syllable right before the new -o, not wherever it sat in the infinitive. This works the same whether the infinitive was -ar, -er, or -ir.","examples":["donar -> dono - I donate","crear -> creo - I create","comer (an -er verb) -> como - I eat","organizar -> organizo (the z sounds like /th/ in Spain) - I organize"],"track":10}],"drills":[{"id":"t19-01","type":"word","prompt":"good","answer":"Bueno","steps":["French bon lost its n and gained an extra vowel sound: the e/o split gives bueno"],"rules":["t19__e-split"],"track":19,"source":"track"},{"id":"t19-02","type":"word","prompt":"he/she/it goes, or you (formal) go","answer":"Va","steps":["start from vamos: we go","take off -amos, keep the v","add nothing for he/she/it/you (formal): va"],"rules":["t19__vamos-backwards"],"track":19,"source":"track"},{"id":"t19-03","type":"sentence","prompt":"To where are you going? (informal)","answer":"¿A dónde vas?","steps":["to: a","where: dónde","you (informal) go: vas, worked backwards from vamos"],"rules":["t19__vamos-backwards"],"track":19,"source":"track"},{"id":"t19-04","type":"word","prompt":"they go, or you all go","answer":"Van","steps":["from vamos, take off -amos and add -n: van"],"rules":["t19__vamos-backwards"],"track":19,"source":"track"},{"id":"t19-05","type":"word","prompt":"I go, I'm going","answer":"Voy","steps":["irregular - remembered from voyage: voy"],"rules":["t19__vamos-backwards"],"track":19,"source":"track"},{"id":"t19-06","type":"sentence","prompt":"I want to go.","answer":"Quiero ir.","steps":["I want: quiero (from earlier)","to go: ir"],"rules":["t19__vamos-backwards"],"track":19,"source":"track"},{"id":"t19-07","type":"sentence","prompt":"I have to go tonight.","answer":"Tengo que ir esta noche.","steps":["I have: tengo","add que to turn possession into obligation: tengo que","to go: ir","tonight: esta noche, literally 'this night'"],"rules":["t19__que-have-to","t19__feminine-endings"],"track":19,"source":"track"},{"id":"t19-08","type":"word","prompt":"the meat","answer":"La carne","steps":["carne ends in -e but is feminine - you learn that from context: la carne"],"rules":["t19__feminine-endings"],"track":19,"source":"track"},{"id":"t19-09","type":"sentence","prompt":"I don't eat meat, and I don't drink alcohol.","answer":"No como carne y no tomo alcohol.","steps":["I don't eat meat: no como carne","and: y","I don't drink/take alcohol: no tomo alcohol - the h is silent"],"rules":["t19__infinitive-o"],"track":19,"source":"track"},{"id":"t19-x01","type":"word","prompt":"the opportunity","answer":"La oportunidad","steps":["-idad is a reliably feminine ending: la oportunidad"],"rules":["t19__feminine-endings"],"track":19,"source":"extension","difficulty":1},{"id":"t19-x02","type":"sentence","prompt":"Where are they going?","answer":"¿A dónde van?","steps":["to where: a dónde","they go: van, worked backwards from vamos"],"rules":["t19__vamos-backwards"],"track":19,"source":"extension","difficulty":1},{"id":"t19-x04","type":"sentence","prompt":"Where are they going tonight?","answer":"¿A dónde van esta noche?","steps":["to where: a dónde","they go: van","tonight, this night: esta noche"],"rules":["t19__vamos-backwards","t19__feminine-endings"],"track":19,"source":"extension","difficulty":2},{"id":"t19-x03","type":"sentence","prompt":"I don't want to eat meat, and I don't want to drink alcohol tonight.","answer":"No quiero comer carne, y no quiero tomar alcohol esta noche.","steps":["I don't want to eat meat: no quiero comer carne","and: y","I don't want to drink alcohol tonight: no quiero tomar alcohol esta noche"],"rules":["t19__feminine-endings"],"track":19,"source":"extension","difficulty":3}],"blurb":"Working backwards from vamos to build all forms of ir","sectionIndex":2},{"id":"t20","label":"Track 20","tracks":[20],"rules":[{"id":"t20__future-by-context","family":"future-by-context","title":"A future time word lets you use the plain present","explanation":"If a word like tomorrow or later already shows you're talking about the future, Spanish is happy to just use the present tense - no 'will' or 'going to' needed, even though that sounds a little odd translated literally into English. The same move works with the rest of the time words: pronto (soon), esta noche (tonight), más tarde (later), la semana que viene (next week, literally the week that comes).","examples":["La veo mañana. - I'm seeing her tomorrow.","Hablamos la semana que viene. - Let's speak next week."],"track":10},{"id":"t20__ver-conjugation","family":"ver-conjugation","title":"ver (to see): veo, ves, ve, vemos, ven","explanation":"Ver conjugates mostly like a regular -er verb: ve (he/she/it/you formal see), ves (you informal see), vemos (we see), ven (they/you plural see). The I version is a little irregular - it's veo, not the expected shorter vo, because vo alone was too short.","examples":["ve - he sees","vemos - we see","veo (I see - irregular)"],"track":20},{"id":"t20__ir-a-future","family":"ir-a-future","title":"vamos a / voy a for going to do something","explanation":"You already had voy a for I'm going to. Now that all o
