to resolve it.","answer":"Hemos hablado para intentar resolverlo.","steps":["to try: intentar","para goes before the first infinitive only: para intentar resolverlo"],"rules":["t52__para-in-order-to"],"track":52,"source":"track"},{"id":"t52-03","type":"sentence","prompt":"I am here to see you. (informal)","answer":"Estoy aquí para verte.","steps":["I am here: estoy aquí","'to see you' means 'in order to see you': para verte"],"rules":["t52__para-in-order-to"],"track":52,"source":"track"},{"id":"t52-04","type":"sentence","prompt":"I have called you in order to speak about it. (informal)","answer":"Te he llamado para hablarlo.","steps":["I have called you: te he llamado","in order to speak about it: para hablarlo (no separate word for 'about' needed)"],"rules":["t52__para-in-order-to"],"track":52,"source":"track"},{"id":"t52-05","type":"word","prompt":"I am eating (right now)","answer":"Estoy comiendo","steps":["estar: estoy","comer minus -er, plus -iendo: comiendo"],"rules":["t52__ar-to-ando"],"track":52,"source":"track"},{"id":"t52-06","type":"sentence","prompt":"I am explaining it (right now)","answer":"Estoy explicándolo.","steps":["explicar minus -ar, plus -ando: explicando","estoy + explicando, with lo attached to the end"],"rules":["t52__ar-to-ando"],"track":52,"source":"track","note":"Also fine as Lo estoy explicando."},{"id":"t52-07","type":"sentence","prompt":"I am taking a Spanish course.","answer":"Estoy tomando un curso de español.","steps":["to take: tomar","right now, so estar + the -ando form: estoy tomando","a course: un curso","of Spanish: de español"],"rules":["t52__ar-to-ando"],"track":52,"source":"track"},{"id":"t52-08","type":"sentence","prompt":"I was taking a Spanish course.","answer":"Estaba tomando un curso de español.","steps":["estar in the past-line form (from earlier): estaba","taking a Spanish course: tomando un curso de español"],"rules":["t52__ar-to-ando"],"track":52,"source":"track","note":"Also fine as Tomaba un curso de español."},{"id":"t52-09","type":"sentence","prompt":"To dance is healthy.","answer":"Bailar es saludable.","steps":["Spanish doesn't use the -ing form as a subject the way English does - just use the plain infinitive: bailar","is healthy: es saludable"],"rules":["t52__infinitive-as-subject"],"track":52,"source":"track"},{"id":"t52-10","type":"sentence","prompt":"To swim is healthy.","answer":"Nadar es saludable.","steps":["to swim: nadar (plain infinitive as subject)","is healthy: es saludable"],"rules":["t52__infinitive-as-subject"],"track":52,"source":"track"},{"id":"t52-11","type":"word","prompt":"interesting","answer":"Interesante","steps":["interesar minus -ar, plus -ante: interesante"],"rules":["t52__ante-iente-adjective"],"track":52,"source":"track"},{"id":"t52-12","type":"word","prompt":"frustrating","answer":"Frustrante","steps":["frustrar minus -ar, plus -ante: frustrante"],"rules":["t52__ante-iente-adjective"],"track":52,"source":"track"},{"id":"t52-13","type":"sentence","prompt":"The waning moon.","answer":"La luna menguante.","steps":["the moon: la luna","menguar minus -ar, plus -ante: menguante","menguante describes luna, placed after it"],"rules":["t52__ante-iente-adjective"],"track":52,"source":"track"},{"id":"t52-14","type":"word","prompt":"a living being","answer":"Un ser viviente","steps":["a being: un ser","vivir minus -ir, plus -iente: viviente"],"rules":["t52__ante-iente-adjective"],"track":52,"source":"track"},{"id":"t52-x01","type":"sentence","prompt":"I have called you in order to explain it. (informal)","answer":"Te he llamado para explicarlo.","steps":["I have called you (informal): te he llamado","'to explain' meaning 'in order to explain': para explicarlo"],"rules":["t52__para-in-order-to"],"track":52,"source":"extension","difficulty":1},{"id":"t52-x02","type":"word","prompt":"surprising","answer":"Sorprendente","steps":["sorprender minus -er, plus -iente: sorprendente"],"rules":["t52__ante-iente-adjective"],"track":52,"source":"extension","difficulty":1},{"id":"t52-x03","type":"sentence","prompt":"I am calling you right now in order to explain something to you. (informal)","answer":"Te estoy llamando para explicarte algo.","steps":["llamar minus -ar, plus -ando: llamando; te estoy llamando","in order to: para","explain something to you: explicarte algo"],"rules":["t52__ar-to-ando","t52__para-in-order-to"],"track":52,"source":"extension","difficulty":2},{"id":"t52-x04","type":"sentence","prompt":"I was eating because I wanted to try it.","answer":"Estaba comiendo porque quería intentarlo.","steps":["I was, the line in the past: estaba","eating: comiendo","because: porque","I wanted to try it: quería intentarlo"],"rules":["t52__ar-to-ando"],"track":52,"source":"extension","difficulty":3},{"id":"t52-x05","type":"sentence","prompt":"I have called you in order to explain something interesting to you. (informal)","answer":"Te he llamado para explicarte algo interesante.","steps":["I have called you: te he llamado","in order to: para","to explain to you: explicarte","something: algo","interesar minus -ar, plus -ante: interesante, after the thing it describes"],"rules":["t52__para-in-order-to","t52__ante-iente-adjective"],"track":52,"source":"extension","difficulty":3}],"blurb":"Para as in-order-to, estar plus -ando/-iendo progressive, -ante/-iente adjectives","sectionIndex":6},{"id":"t53","label":"Track 53","tracks":[53],"rules":[{"id":"t53__haber-pluperfect","family":"haber-pluperfect","title":"había + done-form for 'had done'","explanation":"To say you 'had' done something (rather than 'have' done it), always use había - the line-past of haber - followed by the same -ado/-ido form that follows every version of haber. This line-past is used every time for 'had', with no dot-past alternative.","examples":["Ya había comido. - I had already eaten.","Yo ya había cenado. - I had already had dinner.","Yo lo había perdido. - I had lost it."],"track":53},{"id":"t53__would-have-habria","family":"would-have-habria","title":"Would have: habría + the after-haber form","explanation":"Haber (to have) contracts before -ía the same way poder does: drop the last e and add -ía, giving habría, habrías, habríamos, habrían for would have. Follow it with the -ado/-ido form of the main verb (the same form you'd use after any version of haber, from an earlier track) to get I would have gone, we would have eaten, and so on.","examples":["haber -> habr- + ía -> habría","habría ido - I would have gone","habríamos podido ir - we would have been able to go","me habría gustado - I would have liked it, it would have pleased me"],"track":43},{"id":"t53__two-coulds","family":"two-coulds","title":"The two 'could's: podría vs podía","explanation":"English 'could' hides two different meanings in Spanish. A future/hypothetical 'could' (I could do it tomorrow) uses podría, the would-be-able-to form. A past-ability 'could' (I couldn't do it yesterday) just uses podía, the ordinary line-past of poder. You choose based on which meaning is intended, not by translating the word 'could' directly.","examples":["No podía hacerlo ayer. (I couldn't do it yesterday - past ability.)","No podría hacerlo mañana. (I couldn't do it tomorrow - hypothetical.)","Podíamos. - We could, we were able to."],"track":53},{"id":"t53__poder-contraction-podria","family":"poder-contraction-podria","title":"Could: podría, with the e dropped","explanation":"Could should be poder plus -ía, giving podería, but poder is used so often that the middle e wore away over time, leaving podría. Build the rest the normal would way from there: podríamos, podrían, podrías.","examples":["Podría. - I/he/she/it/you formal could.","Podríamos. - We could.","¿Podrías venir a mi casa? - Could you come to my house?"],"track":42}],"drills":[{"id":"t53-01","type":"word","prompt":"I could / I was able to (referring to the past)","answer":"Podía","steps":["past-ability 'could' is just poder in the line-past: podía"],"rules":["t53__two-coulds","t53__poder-contraction-podria"],"track":53,"source":"track"},{"id":"t53-02","type":"word","prompt":"we could (referring to the past)","answer":"Podíamos","steps":["poder in the line-past, we-form: podíamos"],"rules":["t53__two-coulds"],"track":53,"source":"track"},{"id":"t53-03","type":"sentence","prompt":"I couldn't do it because I didn't have the time.","answer":"No podía hacerlo porque no tenía el tiempo.","steps":["I couldn't do it: no podía hacerlo","because: porque","I didn't have the time: no tenía el tiempo"],"rules":["t53__two-coulds"],"track":53,"source":"track"},{"id":"t53-04","type":"word","prompt":"I had (from haber)","answer":"Había","steps":["haber in the line-past: había"],"rules":["t53__haber-pluperfect"],"track":53,"source":"track"},{"id":"t53-05","type":"sentence","prompt":"I had eaten already.","answer":"Ya había comido.","steps":["already: ya, placed at the start","había + the form of comer that follows haber: comido"],"rules":["t53__haber-pluperfect"],"track":53,"source":"track"},{"id":"t53-06","type":"sentence","prompt":"She wanted to dine with me, but I had dined already.","answer":"Ella quería cenar conmigo pero yo ya había cenado.","steps":["she wanted: ella quería (line-past, from earlier - wanting is ongoing)","to dine with me: cenar conmigo (not 'con mí')","but I had dined already: pero yo ya había cenado","put yo in to make clear who's who"],"rules":["t53__haber-pluperfect"],"track":53,"source":"track"},{"id":"t53-07","type":"sentence","prompt":"He was looking for it because I had lost it.","answer":"Lo buscaba porque yo lo había perdido.","steps":["he was looking for it: lo buscaba (buscar in the line-past, from earlier)","because: porque","I had lost it: yo lo había perdido"],"rules":["t53__haber-pluperfect"],"track":53,"source":"track"},{"id":"t53-08","type":"sentence","prompt":"I would have lost it.","answer":"Lo habría perdido.","steps":["it: lo, out in front","I would have: habría, with the e dropped out of haber","lost: perdido"],"rules":["t53__would-have-habria"],"track":53,"source":"track"},{"id":"t53-09","type":"sentence","prompt":"I would have gotten lost / I would have lost myself.","answer":"Me habría perdido.","steps":["myself: me, out in front","I would have: habría","lost: perdido"],"rules":["t53__would-have-habria"],"track":53,"source":"track"},{"id":"t53-x01","type":"sentence","prompt":"I couldn't eat it because I didn't have the time.","answer":"No podía comerlo porque no tenía el tiempo.","steps":["no podía comerlo","porque no tenía el tiempo"],"rules":["t53__two-coulds"],"track":53,"source":"extension","difficulty":1},{"id":"t53-x02","type":"sentence","prompt":"I had already lost it, but he wanted to look for it.","answer":"Ya lo había perdido, pero él quería buscarlo.","steps":["I had already lost it: ya lo había perdido","but: pero","he wanted: él quería","to look for it: buscarlo"],"rules":["t53__haber-pluperfect"],"track":53,"source":"extension","difficulty":2},{"id":"t53-x03","type":"sentence","prompt":"She would have dined with me, but I had already left.","answer":"Ella habría cenado conmigo, pero yo ya había salido.","steps":["ella habría cenado conmigo","pero yo ya había + the haber-form of salir: salido"],"rules":["t53__would-have-habria","t53__haber-pluperfect"],"track":53,"source":"extension","difficulty":3}],"blurb":"Imperfect poder for could, pluperfect habia plus participle for had-done","sectionIndex":6},{"id":"t54","label":"Track 54","tracks":[54],"rules":[{"id":"t54__perfect-ado-ido","family":"perfect-ado-ido","title":"The have-done form: -ado for -ar, -ido for -er and -ir","explanation":"You already take the -ar off and put -ado on. The other half is just as flat: take the -er or -ir off and put -ido on. -er and -ir verbs behave the same here, as they do nearly everywhere outside the we-form. Then put he, has, ha, hemos or han in front of it.","examples":["terminar -> terminado -> he terminado - I have finished","perder -> perdido; vender -> vendido","venir -> venido, as in bienvenido, well-come"],"track":22},{"id":"t54__haber-perfect","family":"haber-perfect","title":"he/has/ha/hemos/han for have (done something)","explanation":"Haber (silent h) is the have that builds I have done/eaten/gone - not tener, which is only for possession and have-to. Its forms come from the two vowel sounds inside haber, a and e: he (I have) and hemos (we have) share the e; ha (he/she/it/you formal have), has (you informal have), and han (they/you plural have) share the a.","examples":["he - I have","hemos - we have","ha - he/she has","has - you have","han - they have"],"track":21},{"id":"t54__participle-adjective","family":"participle-adjective","title":"The haber-form (-ado/-ido) used as an adjective","explanation":"The same -ado/-ido form that follows haber (he cerrado, había perdido) can double as an adjective, just like English 'sold' or 'lost' can. As an adjective it agrees in gender and number (cerrado/cerrada/cerrados/cerradas) and, with only a couple of exceptions, pairs with estar rather than ser.","examples":["Está cerrada. - It's closed.","Estoy perdido / perdida. - I'm lost.","Están vendidas. - They're sold."],"track":54},{"id":"t54__ser-noun-adjective-secondary","family":"ser-noun-adjective-secondary","title":"ser when the noun, not the adjective, is the point","explanation":"When you name what something IS with 'es un/una ___' and only then add a describing word, use ser - because being that noun (a person, a chair) is the most characteristic thing you're saying, and the adjective is secondary. This holds even for adjectives that normally pair with estar, like the -ado/-ido ones or a state like wet.","examples":["Es una persona cerrada. - He's a closed person.","Es una persona perdida. - He's a lost person.","Es una silla mojada. - It's a wet chair."],"track":54}],"drills":[{"id":"t54-01","type":"sentence","prompt":"I have closed it. (the door)","answer":"La he cerrado.","steps":["the door is la puerta, so it here is la","I have closed: he cerrado","la goes in front of the pair: la he cerrado"],"rules":["t54__haber-perfect","t54__perfect-ado-ido"],"track":54,"source":"track"},{"id":"t54-02","type":"word","prompt":"closed (describing the door)","answer":"Cerrada","steps":["cerrado is the haber-form; as an adjective it must match la puerta: cerrada"],"rules":["t54__participle-adjective"],"track":54,"source":"track"},{"id":"t54-03","type":"sentence","prompt":"It is closed. (the door)","answer":"Está cerrada.","steps":["being closed is a state, not a fixed characteristic: estar","está + cerrada, matching la puerta"],"rules":["t54__participle-adjective"],"track":54,"source":"track"},{"id":"t54-04","type":"sentence","prompt":"I am lost.","answer":"Estoy perdido.","steps":["perder's haber-form: perdido","put it together: estoy perdido"],"rules":["t54__participle-adjective"],"track":54,"source":"track","note":"For a woman: Estoy perdida."},{"id":"t54-05","type":"sentence","prompt":"I have finished.","answer":"He terminado.","steps":["terminar's haber-form: terminado","he + terminado"],"rules":["t54__haber-perfect","t54__perfect-ado-ido"],"track":54,"source":"track"},{"id":"t54-06","type":"sentence","prompt":"It is finished. (the movie)","answer":"Está terminada.","steps":["la película, so it agrees: terminada","put it together: está terminada"],"rules":["t54__participle-adjective"],"track":54,"source":"track"},{"id":"t54-07","type":"sentence","prompt":"They are sold. (the houses)","answer":"Están vendidas.","steps":["vender's haber-form: vendido","las casas: matches feminine plural: vendidas","put it together: están vendidas"],"rules":["t54__participle-adjective"],"track":54,"source":"track"},{"id":"t54-08","type":"sentence","prompt":"I have tired myself / I've gotten fed up.","answer":"Me he cansado.","steps":["cansar's haber-form: cansado","me + he + cansado"],"rules":["t54__haber-perfect","t54__perfect-ado-ido"],"track":54,"source":"track"},{"id":"t54-09","type":"sentence","prompt":"He is closed to the idea.","answer":"Está cerrado a la idea.","steps":["está cerrado - a state, masculine","to the idea: a la idea, idea is feminine"],"rules":["t54__participle-adjective"],"track":54,"source":"track"},{"id":"t54-10","type":"sentence","prompt":"He is a closed person.","answer":"Es una persona cerrada.","steps":["you're naming what he is - a person - so: es una persona","persona is feminine regardless of who it refers to: cerrada"],"rules":["t54__ser-noun-adjective-secondary"],"track":54,"source":"track"},{"id":"t54-11","type":"sentence","prompt":"She is a lost person. (she's lost her way)","answer":"Es una persona perdida.","steps":["naming the noun first: es una persona","perdida is secondary here, describing persona"],"rules":["t54__ser-noun-adjective-secondary"],"track":54,"source":"track"},{"id":"t54-12","type":"sentence","prompt":"The chair is wet.","answer":"La silla está mojada.","steps":["chair: la silla","wet is a state here: está mojada"],"rules":["t54__participle-adjective"],"track":54,"source":"track"},{"id":"t54-13","type":"sentence","prompt":"It is a wet chair.","answer":"Es una silla mojada.","steps":["naming the noun first: es una silla","mojada is secondary, describing silla"],"rules":["t54__ser-noun-adjective-secondary"],"track":54,"source":"track"},{"id":"t54-x01","type":"sentence","prompt":"The course is sold.","answer":"El curso está vendido.","steps":["the course: el curso, masculine","is, a state: está","sold: vendido, agreeing with curso"],"rules":["t54__participle-adjective"],"track":54,"source":"extension","difficulty":1},{"id":"t54-x02","type":"sentence","prompt":"It is a closed door.","answer":"Es una puerta cerrada.","steps":["naming the noun: es una puerta","cerrada as a secondary description"],"rules":["t54__ser-noun-adjective-secondary"],"track":54,"source":"extension","difficulty":1},{"id":"t54-x03","type":"sentence","prompt":"I am tired because I have finished the course.","answer":"Estoy cansado porque he terminado el curso.","steps":["I am tired, a state: estoy cansado","because: porque","I have finished the course: he terminado el curso"],"rules":["t54__participle-adjective"],"track":54,"source":"extension","difficulty":2},{"id":"t54-x04","type":"sentence","prompt":"I am a tired person because I have finished the course.","answer":"Soy una persona cansada porque he terminado el curso.","steps":["naming the noun: soy una persona","cansada as secondary description","because I have finished the course: porque he terminado el curso"],"rules":["t54__ser-noun-adjective-secondary","t54__participle-adjective"],"track":54,"source":"extension","difficulty":3}],"blurb":"Past participle as adjective with estar, ser vs estar with adjectives","sectionIndex":6},{"id":"t55","label":"Track 55","tracks":[55],"rules":[{"id":"t55__perfect-ado-ido","family":"perfect-ado-ido","title":"The have-done form: -ado for -ar, -ido for -er and -ir","explanation":"You already take the -ar off and put -ado on. The other half is just as flat: take the -er or -ir off and put -ido on. -er and -ir verbs behave the same here, as they do nearly everywhere outside the we-form. Then put he, has, ha, hemos or han in front of it.","examples":["terminar -> terminado -> he terminado - I have finished","perder -> perdido; vender -> vendido","venir -> venido, as in bienvenido, well-come"],"track":22},{"id":"t55__should-deberia","family":"should-deberia","title":"Should: debería","explanation":"Deber (to owe, must) doesn't contract like poder or haber - just add -ía straight onto it: debería, deberías, deberíamos, deberían, which means should. After it, use the plain to form of the next verb directly, with no extra word for to, even though English inserts one after should.","examples":["deber + ía -> debería - I/he/she/you should","deberías venir - you should come","deberíamos hablar - we should speak"],"track":43},{"id":"t55__poder-contraction-podria","family":"poder-contraction-podria","title":"Could: podría, with the e dropped","explanation":"Could should be poder plus -ía, giving podería, but poder is used so often that the middle e wore away over time, leaving podría. Build the rest the normal would way from there: podríamos, podrían, podrías.","examples":["Podría. - I/he/she/it/you formal could.","Podríamos. - We could.","¿Podrías venir a mi casa? - Could you come to my house?"],"track":42},{"id":"t55__irregular-participles-haber","family":"irregular-participles-haber","title":"Irregular haber forms: roto, muerto, abierto, dicho, hecho","explanation":"Most verbs form their haber-version by dropping -ar/-er/-ir and adding -ado or -ido, but a handful are irregular and you just have to know the odd form. Romper (to break) becomes roto, not rompido. Morir (to die) becomes muerto. Abrir (to open) becomes abierto. Decir (to say/tell) becomes dicho, and hacer (to do/make) becomes hecho. These irregular forms work after any version of haber and also as adjectives with estar.","examples":["romper -> roto - he roto, está roto/rota","morir -> muerto - ha muerto, está muerto","abrir -> abierto - he abierto, están abiertos","decir -> dicho - he dicho, le he dicho","hacer -> hecho - he hecho, está hecho"],"track":55},{"id":"t55__should-could-have","family":"should-could-have","title":"Should have / could have: put haber in between","explanation":"You already have debería for should and podría for could. To push either of them into the past, don't touch them - drop haber in its plain to-form straight after, then the -ado/-ido piece: debería haber cancelado, podríamos haber ido. The little word can sit out front or ride on the end of haber: lo debería haber cancelado, or debería haberlo cancelado.","examples":["debería haber cancelado - I should have cancelled","podríamos haber ido - we could have gone","deberías haberlo hecho - you should have done it"],"track":55}],"drills":[{"id":"t55-01","type":"sentence","prompt":"I have cancelled.","answer":"He cancelado.","steps":["I have: he (from haber, the \"have\" from earlier)","cancel: cancelar, take off -ar and add -ado: cancelado"],"rules":["t55__perfect-ado-ido"],"track":55,"source":"track"},{"id":"t55-02","type":"sentence","prompt":"The party is cancelled.","answer":"Está cancelada.","steps":["this -ado version also works as an adjective, and goes with estar (from earlier)","la fiesta is feminine, so cancelado becomes cancelada"],"rules":["t55__perfect-ado-ido"],"track":55,"source":"track"},{"id":"t55-03","type":"sentence","prompt":"It has got complicated.","answer":"Se ha complicado.","steps":["it has complicated itself: se ha","complicate: complicar, take off -ar and add -ado: complicado"],"rules":["t55__perfect-ado-ido"],"track":55,"source":"track"},{"id":"t55-04","type":"sentence","prompt":"I should have cancelled it.","answer":"Lo debería haber cancelado.","steps":["should: deber (to owe) plus -ía: debería","have: haber, the \"to\" form, since debería already carries the would","cancelled: cancelado","it: lo jumps out to the front"],"rules":["t55__should-could-have","t55__should-deberia"],"track":55,"source":"track","note":"Also fine as Debería haberlo cancelado."},{"id":"t55-05","type":"sentence","prompt":"We could have gone.","answer":"Podríamos haber ido.","steps":["we could: poder (to be able) plus -íamos for we: podríamos","have: haber","gone: ir, irregular after haber, becomes ido"],"rules":["t55__should-could-have","t55__poder-contraction-podria"],"track":55,"source":"track"},{"id":"t55-06","type":"sentence","prompt":"I have broken it.","answer":"Lo he roto.","steps":["break: romper, but after haber it's irregular: roto, not \"rompido\"","I have: he","it: lo out at the front"],"rules":["t55__irregular-participles-haber"],"track":55,"source":"track"},{"id":"t55-07","type":"sentence","prompt":"It has broken.","answer":"Se ha roto.","steps":["it has broken itself: se ha","broken: roto"],"rules":["t55__irregular-participles-haber"],"track":55,"source":"track"},{"id":"t55-08","type":"sentence","prompt":"I'm dead. (feminine, meaning exhausted)","answer":"Estoy muerta.","steps":["die: morir, after haber it's irregular: muerto","this adjective only ever goes with estar, never ser","feminine: muerta"],"rules":["t55__irregular-participles-haber"],"track":55,"source":"track","note":"Common colloquial way to say you're exhausted."},{"id":"t55-09","type":"sentence","prompt":"I have opened it.","answer":"Lo he abierto.","steps":["open: abrir, after haber it's irregular: abierto, not \"abrido\"","it: lo out at the front"],"rules":["t55__irregular-participles-haber"],"track":55,"source":"track"},{"id":"t55-10","type":"sentence","prompt":"They are open.","answer":"Están abiertos.","steps":["abierto as an adjective, plural: abiertos"],"rules":["t55__irregular-participles-haber"],"track":55,"source":"track"},{"id":"t55-11","type":"sentence","prompt":"I have told him.","answer":"Le he dicho.","steps":["tell: decir, after haber it's irregular: dicho","to him, not him: le, not lo"],"rules":["t55__irregular-participles-haber"],"track":55,"source":"track"},{"id":"t55-12","type":"sentence","prompt":"You should have done it. (informal)","answer":"Deberías haberlo hecho.","steps":["you should: deber plus -ías: deberías","make/do: hacer, after haber it's irregular: hecho","it: lo attaches onto haber since haber is in the \"to\" form here"],"rules":["t55__should-could-have","t55__should-deberia","t55__irregular-participles-haber"],"track":55,"source":"track"},{"id":"t55-x01","type":"sentence","prompt":"I should have opened it.","answer":"Lo debería haber abierto.","steps":["should: debería","have: haber","opened: abierto (irregular)","it: lo out front"],"rules":["t55__should-could-have","t55__should-deberia"],"track":55,"source":"extension","difficulty":1},{"id":"t55-x02","type":"sentence","prompt":"I have said it.","answer":"Lo he dicho.","steps":["say: decir, after haber it's dicho","it: lo out front","I have: he"],"rules":["t55__irregular-participles-haber"],"track":55,"source":"extension","difficulty":1},{"id":"t55-x03","type":"sentence","prompt":"She could have told him.","answer":"Le podría haber dicho.","steps":["could: podría","have: haber","told: dicho (irregular)","to him: le, out front"],"rules":["t55__should-could-have","t55__poder-contraction-podria","t55__irregular-participles-haber"],"track":55,"source":"extension","difficulty":2},{"id":"t55-x04","type":"sentence","prompt":"I should have done it, but it's complicated.","answer":"Debería haberlo hecho, pero está complicado.","steps":["should have done it: debería haberlo hecho","but: pero (from earlier)","it's complicated: está complicado"],"rules":["t55__should-could-have","t55__should-deberia","t55__irregular-participles-haber"],"track":55,"source":"extension","difficulty":3}],"blurb":"Irregular past participles (roto, muerto, abierto, dicho, hecho), deberia/podria haber","sectionIndex":6},{"id":"t56","label":"Track 56","tracks":[56],"rules":[{"id":"t56__prep-front","family":"prep-front","title":"Prepositions move to the front, never stranded at the end","explanation":"Spanish never lets a preposition sit at the end of the sentence the way English does. Instead the preposition moves in front of the question word or the connector que/cual/quien, so \"where are you from\" becomes \"from where are you\" and \"the girl I work with\" becomes \"the girl with that I work\". Que is the safe, simple choice for that/which/who after a preposition; cual and quien are alternatives you'll hear but don't need yet.","examples":["¿De dónde eres? - Where are you from?","¿A dónde vas? - Where are you going?","la chica con que trabajo - the girl I work with","no sé con quién tengo que hacerlo - I don't know who I have to do it with"],"track":56},{"id":"t56__imperfect-ir","family":"imperfect-ir","title":"iba: ir in the line in the past, and iba a for was going to","explanation":"Ir (to go) blends the two line-in-the-past endings into iba, ibas, íbamos, iban - I was going, we were going, and so on. Iba a plus the to-form of a verb also gives you was going to, the same way you'd use it in English: iba a llamarte, I was going to call you.","examples":["iba - I/he/she was going","iban - they were going","íbamos a hacerlo - we were going to do it","iba a llamarte - I was going to call you"],"track":49},{"id":"t56__quien-cual","family":"quien-cual","title":"Which one and who: cuál, quién, quiénes","explanation":"Cuál means which one and doesn't need a separate word for \"one\". Quién means who for a single person; when you know your who refers to more than one person, pluralize it to quiénes and change the verb to match. Both slot into a sentence just like que does after a preposition.","examples":["¿Cuál quieres? - Which one do you want?","¿Quién va? - Who is going?","¿Quiénes van? (Who is going? - plural)","no sé con quién tengo que hacerlo"],"track":56}],"drills":[{"id":"t56-01","type":"sentence","prompt":"Where are you from? (informal)","answer":"¿De dónde eres?","steps":["put the preposition at the front instead of the end: from where","from where: de dónde","are you: eres"],"rules":["t56__prep-front"],"track":56,"source":"track"},{"id":"t56-02","type":"sentence","prompt":"Where are you going? (informal)","answer":"¿A dónde vas?","steps":["to where, not where...to: a dónde","are you going: vas"],"rules":["t56__prep-front"],"track":56,"source":"track"},{"id":"t56-03","type":"sentence","prompt":"We are going to the United States.","answer":"Vamos a Estados Unidos.","steps":["we are going: vamos","to: a","United States: Estados Unidos, no word for \"the\""],"rules":["t56__prep-front"],"track":56,"source":"track"},{"id":"t56-04","type":"sentence","prompt":"It is the girl I was working with.","answer":"Es la chica con que trabajaba.","steps":["it is the girl: es la chica","with that, not that...with: con que","was working: trabajaba (the -aba past, from earlier)"],"rules":["t56__prep-front"],"track":56,"source":"track"},{"id":"t56-05","type":"sentence","prompt":"The girl I was going to the party with.","answer":"La chica con que iba a la fiesta.","steps":["the girl with that: la chica con que","was going: ir blends -aba and -ía into iba","to the party: a la fiesta"],"rules":["t56__prep-front","t56__imperfect-ir"],"track":56,"source":"track"},{"id":"t56-06","type":"sentence","prompt":"Which one do you want? (informal)","answer":"¿Cuál quieres?","steps":["which one: cuál (no separate word for \"one\")","do you want: quieres"],"rules":["t56__quien-cual"],"track":56,"source":"track"},{"id":"t56-07","type":"sentence","prompt":"I don't know which one he wants to see.","answer":"No sé cuál quiere ver.","steps":["I don't know: no sé","which one: cuál","he wants to see: quiere ver"],"rules":["t56__quien-cual"],"track":56,"source":"track"},{"id":"t56-08","type":"sentence","prompt":"I don't know which one he wants to do it with.","answer":"No sé con cuál quiere hacerlo.","steps":["with which one, not which one...with: con cuál","he wants: quiere","to do it: hacerlo, it attaches onto the \"to\" form"],"rules":["t56__quien-cual","t56__prep-front"],"track":56,"source":"track"},{"id":"t56-09","type":"sentence","prompt":"Who is going? (more than one person)","answer":"¿Quiénes van?","steps":["who, plural: quiénes","the verb changes to match: van"],"rules":["t56__quien-cual"],"track":56,"source":"track"},{"id":"t56-10","type":"sentence","prompt":"Who is here?","answer":"¿Quién está aquí?","steps":["who: quién","is here: está aquí (estar for location, from earlier)"],"rules":["t56__quien-cual"],"track":56,"source":"track"},{"id":"t56-11","type":"sentence","prompt":"I don't know who I have to do it with.","answer":"No sé con quién tengo que hacerlo.","steps":["I don't know: no sé","with who: con quién","I have to: tengo que (from earlier)","do it: hacerlo"],"rules":["t56__quien-cual","t56__prep-front"],"track":56,"source":"track"},{"id":"t56-12","type":"sentence","prompt":"I don't know who I have to do it for.","answer":"No sé para quién tengo que hacerlo.","steps":["for who, not who...for: para quién","I have to do it: tengo que hacerlo"],"rules":["t56__quien-cual","t56__prep-front"],"track":56,"source":"track"},{"id":"t56-x01","type":"sentence","prompt":"Where is she from?","answer":"¿De dónde es?","steps":["from where: de dónde","is she: es"],"rules":["t56__prep-front"],"track":56,"source":"extension","difficulty":1},{"id":"t56-x02","type":"sentence","prompt":"Which one do you want to see? (informal)","answer":"¿Cuál quieres ver?","steps":["which one: cuál","do you want to see: quieres ver"],"rules":["t56__quien-cual"],"track":56,"source":"extension","difficulty":1},{"id":"t56-x03","type":"sentence","prompt":"Who was going to the party?","answer":"¿Quién iba a la fiesta?","steps":["who: quién","was going: iba","to the party: a la fiesta"],"rules":["t56__quien-cual","t56__imperfect-ir"],"track":56,"source":"extension","difficulty":2},{"id":"t56-x04","type":"sentence","prompt":"I don't know who she was going to the party with.","answer":"No sé con quién iba a la fiesta.","steps":["I don't know: no sé","with who: con quién","was going: iba","to the party: a la fiesta"],"rules":["t56__quien-cual","t56__prep-front","t56__imperfect-ir"],"track":56,"source":"extension","difficulty":3}],"blurb":"Prepositions never stranded, relative clauses with que/cual/quien, working backwards","sectionIndex":6},{"id":"t57","label":"Track 57","tracks":[57],"rules":[{"id":"t57__lo-de","family":"lo-de","title":"lo de for \"that thing about\"","explanation":"Lo de means the thing about or that business about, and it works as a unit in front of whatever the thing is. It's another job for lo standing in for thing, this time paired with de (about/of).","examples":["lo de Juan - that business about Juan","lo de la fiesta - the thing about the party","quiero organizar lo de mañana - I want to organize that thing about tomorrow"],"track":57},{"id":"t57__er-ir-we-form","family":"er-ir-we-form","title":"The we-form is the one place -er and -ir differ","explanation":"This is the one place in the whole language where -er and -ir verbs behave differently: for we, -er verbs take -emos and -ir verbs take -imos. Take off the ending and put on -emos or -imos depending on which group the verb started in; like the -ar we-form, the stress moves off the root so any e or o there stays whole.","examples":["preferir -> preferimos","venir -> venimos","vivir -> vivimos","entender -> entendemos","perder -> perdemos"],"track":18},{"id":"t57__asi","family":"asi","title":"así for like this/like that","explanation":"Así is the everyday shortcut for like this or like that, replacing the longer de esta forma or de esta manera. It usually sits at the end of the sentence it describes.","examples":["no hablamos así - we don't speak like that","no vivimos así - we don't live like that"],"track":57},{"id":"t57__lo-adjective","family":"lo-adjective","title":"lo + adjective for \"the ___ thing\"","explanation":"Put lo in front of an adjective to mean \"the [adjective] thing\" without needing a separate word for thing. Lo interesante is the interesting thing, lo fácil is the easy thing, lo bueno is the good thing, lo malo is the bad thing. The rest of the sentence follows normally, often with es que to say what that thing is.","examples":["lo interesante - the interesting thing","lo fácil es que vienen juntos - the easy thing is that they come together","lo bueno / lo malo - the good thing / the bad thing"],"track":57},{"id":"t57__quien-cual","family":"quien-cual","title":"Which one and who: cuál, quién, quiénes","explanation":"Cuál means which one and doesn't need a separate word for \"one\". Quién means who for a single person; when you know your who refers to more than one person, pluralize it to quiénes and change the verb to match. Both slot into a sentence just like que does after a preposition.","examples":["¿Cuál quieres? - Which one do you want?","¿Quién va? - Who is going?","¿Quiénes van? (Who is going? - plural)","no sé con quién tengo que hacerlo"],"track":56}],"drills":[{"id":"t57-01","type":"word","prompt":"we eat","answer":"Comemos","steps":["comer, an -er verb, takes -emos for we"],"rules":["t57__er-ir-we-form"],"track":57,"source":"track"},{"id":"t57-02","type":"word","prompt":"we live","answer":"Vivimos","steps":["vivir, an -ir verb, takes -imos for we"],"rules":["t57__er-ir-we-form"],"track":57,"source":"track"},{"id":"t57-03","type":"sentence","prompt":"Where do you guys live?","answer":"¿Dónde viven?","steps":["where: dónde","you guys live: viven - outside the we-form, -er and -ir verbs behave identically"],"rules":["t57__er-ir-we-form"],"track":57,"source":"track"},{"id":"t57-04","type":"sentence","prompt":"The interesting thing is that they live here.","answer":"Lo interesante es que viven aquí.","steps":["the interesting thing: lo interesante","is that: es que","they live here: viven aquí"],"rules":["t57__lo-adjective"],"track":57,"source":"track"},{"id":"t57-05","type":"sentence","prompt":"The interesting thing is that they live together. (feminine)","answer":"Lo interesante es que viven juntas.","steps":["the interesting thing is that: lo interesante es que","they live: viven","together, feminine plural: juntas"],"rules":["t57__lo-adjective"],"track":57,"source":"track"},{"id":"t57-06","type":"sentence","prompt":"The easy thing is that they come together.","answer":"Lo fácil es que vienen juntos.","steps":["the easy thing is that: lo fácil es que","they come: venir, irregular, becomes vienen","together, masculine plural: juntos"],"rules":["t57__lo-adjective"],"track":57,"source":"track"},{"id":"t57-07","type":"sentence","prompt":"We don't speak like that.","answer":"No hablamos así.","steps":["we don't speak: no hablamos","like that, like this: así"],"rules":["t57__asi"],"track":57,"source":"track"},{"id":"t57-08","type":"sentence","prompt":"We don't live like that.","answer":"No vivimos así.","steps":["we don't live: no vivimos","like that: así"],"rules":["t57__asi"],"track":57,"source":"track"},{"id":"t57-09","type":"word","prompt":"that business about Juan","answer":"Lo de Juan","steps":["that thing/business about: lo de","plus the name: Juan"],"rules":["t57__lo-de"],"track":57,"source":"track"},{"id":"t57-10","type":"sentence","prompt":"I don't want to speak about Juan's business like this.","answer":"No quiero hablar de lo de Juan así.","steps":["I don't want to speak: no quiero hablar","about: de","Juan's business: lo de Juan","like this: así"],"rules":["t57__lo-de","t57__asi"],"track":57,"source":"track"},{"id":"t57-11","type":"sentence","prompt":"I want to organize that thing about tomorrow.","answer":"Quiero organizar lo de mañana.","steps":["I want to organize: quiero organizar","that thing about: lo de","tomorrow: mañana"],"rules":["t57__lo-de"],"track":57,"source":"track","note":"Mañana means both morning and tomorrow."},{"id":"t57-12","type":"sentence","prompt":"But I don't want to organize it like this.","answer":"Pero no quiero organizarlo así.","steps":["but: pero (from earlier)","I don't want to organize it: no quiero organizarlo, it attaches onto the \"to\" form","like this: así"],"rules":["t57__asi"],"track":57,"source":"track"},{"id":"t57-x01","type":"sentence","prompt":"We don't eat like that.","answer":"No comemos así.","steps":["we don't eat: no comemos","like that: así"],"rules":["t57__asi"],"track":57,"source":"extension","difficulty":1},{"id":"t57-x02","type":"sentence","prompt":"The good thing is that they live together. (masculine)","answer":"Lo bueno es que viven juntos.","steps":["the good thing is that: lo bueno es que","they live: viven","together, masculine: juntos"],"rules":["t57__lo-adjective"],"track":57,"source":"extension","difficulty":1},{"id":"t57-x03","type":"sentence","prompt":"That thing about the party is complicated.","answer":"Lo de la fiesta es complicado.","steps":["that thing about the party: lo de la fiesta","is complicated: es complicado"],"rules":["t57__lo-de"],"track":57,"source":"extension","difficulty":2},{"id":"t57-x04","type":"sentence","prompt":"I don't know who wants to organize that thing about the party like this.","answer":"No sé quién quiere organizar lo de la fiesta así.","steps":["I don't know: no sé","who wants to organize: quién quiere organizar","that thing about the party: lo de la fiesta","like this: así"],"rules":["t57__quien-cual","t57__lo-de","t57__asi"],"track":57,"source":"extension","difficulty":3}],"blurb":"Lo + adjective for the thing, lo de for that business about","sectionIndex":6},{"id":"t58","label":"Track 58","tracks":[58],"rules":[{"id":"t58__preterite-ar","family":"preterite-ar","title":"The point in the past for -ar verbs","explanation":"Take the -ar off the verb and put é on for I, with the accent on that e, or ó on for he/she/it/you-formal, with the accent on that o. Hablar is the hook: hablé (I spoke), habló (he spoke) - check any -ar verb against it.","examples":["hablar -> hablé - I spoke","hablar -> habló - he spoke","comprar -> compré - I bought","enviar -> envié - I sent"],"track":58},{"id":"t58__passive-se","family":"passive-se","title":"It was done, with nobody named (se)","explanation":"When English says something 'was done' without naming who did it, treat it as 'it did-itself': put se in front of the it-form of the verb. Because nothing is being pointed at with a separate word anymore, you don't add lo - se envió stands complete on its own.","examples":["enviar -> envió -> se envió - it was sent","se envió ayer - it was sent yesterday"],"track":58}],"drills":[{"id":"t58-01","type":"word","prompt":"I spoke","answer":"Hablé","steps":["speak: hablar","take off the -ar and add é, accent on the e"],"rules":["t58__preterite-ar"],"track":58,"source":"track"},{"id":"t58-02","type":"word","prompt":"He spoke (or she spoke, or you spoke, formal)","answer":"Habló","steps":["take off the -ar and add o, accent on the o"],"rules":["t58__preterite-ar"],"track":58,"source":"track"},{"id":"t58-03","type":"sentence","prompt":"I didn't speak.","answer":"No hablé.","steps":["no at the front","I spoke: hablé"],"rules":["t58__preterite-ar"],"track":58,"source":"track"},{"id":"t58-04","type":"sentence","prompt":"I bought it.","answer":"Lo compré.","steps":["it: lo (from earlier)","to buy: comprar","I bought: compré","lo out at the front"],"rules":["t58__preterite-ar"],"track":58,"source":"track"},{"id":"t58-05","type":"sentence","prompt":"She bought it for me.","answer":"Me lo compró.","steps":["for me: me (no need for para if it's not being stressed)","it: lo","she bought: compró","me and lo both out at the front, me first"],"rules":["t58__preterite-ar"],"track":58,"source":"track","note":"Also fine as Lo compró para mí, if you want to stress that it was for you."},{"id":"t58-06","type":"sentence","prompt":"I sent it to you. (informal)","answer":"Te lo envié.","steps":["to you: te (from earlier)","it: lo","to send: enviar","I sent: envié","te then lo out at the front"],"rules":["t58__preterite-ar"],"track":58,"source":"track"},{"id":"t58-07","type":"sentence","prompt":"I didn't send it to you yet. (informal)","answer":"No te lo envié todavía.","steps":["no at the front","to you, it: te lo","I sent: envié","yet/still: todavía"],"rules":["t58__preterite-ar"],"track":58,"source":"track"},{"id":"t58-08","type":"sentence","prompt":"It was sent yesterday.","answer":"Se envió ayer.","steps":["it sent itself: se envió (no lo needed, it's not pointing at anything separate)","yesterday: ayer"],"rules":["t58__preterite-ar","t58__passive-se"],"track":58,"source":"track"},{"id":"t58-09","type":"sentence","prompt":"She didn't speak with me.","answer":"No habló conmigo.","steps":["no at the front","she spoke: habló","with me: conmigo (from earlier)"],"rules":["t58__preterite-ar"],"track":58,"source":"track"},{"id":"t58-10","type":"sentence","prompt":"I was going to do it, but I forgot it.","answer":"Lo iba a hacer pero lo olvidé.","steps":["I was going: iba (one of the three irregular verbs in the line of the past, from earlier)","to do it: lo hacer, with lo out front","but: pero","to forget: olvidar","I forgot it: lo olvidé"],"rules":["t58__preterite-ar"],"track":58,"source":"track"},{"id":"t58-x01","type":"sentence","prompt":"She sent it to me.","answer":"Me lo envió.","steps":["to me, it: me lo out front","she sent: envió"],"rules":["t58__preterite-ar"],"track":58,"source":"extension","difficulty":1},{"id":"t58-x02","type":"sentence","prompt":"It wasn't sent yesterday.","answer":"No se envió ayer.","steps":["no at the front","it sent itself: se envió","yesterday: ayer"],"rules":["t58__preterite-ar","t58__passive-se"],"track":58,"source":"extension","difficulty":2},{"id":"t58-x03","type":"sentence","prompt":"I don't know why she didn't buy it for me yesterday.","answer":"No sé por qué no me lo compró ayer.","steps":["I don't know why: no sé por qué (from earlier)","no at the front","for me, it: me lo","she bought: compró","yesterday: ayer"],"rules":["t58__preterite-ar"],"track":58,"source":"extension","difficulty":3}],"blurb":"The dot in the past for -ar verbs: hablé and habló","sectionIndex":7},{"id":"t59","label":"Track 59","tracks":[59],"rules":[{"id":"t59__durante","family":"durante","title":"During (durante)","explanation":"Built the same way as the -ante/-iente -ing-adjective ending, durante means during and covers a stretch of time much like por. Like any preposition, it's followed by the plain infinitive, not an -ing form - sin parar, durante... sin parar.","examples":["durante dos minutos - during/for two minutes","comió durante media hora - he ate for half an hour"],"track":59},{"id":"t59__que-than","family":"que-than","title":"que also means than","explanation":"Beyond what and that, que means than after a comparison word like más. Spanish is more literal than English here, so you use the subject word (yo, él) after que, not the object one (me, him) - comí más que él, not que 'mí'.","examples":["comí más que él - I ate more than him / than he","comió más que yo - he ate more than me / than I"],"track":59},{"id":"t59__double-negative","family":"double-negative","title":"Double negative with nada/nadie","explanation":"Spanish stacks two negatives without cancelling each other out: put no before the verb and nada (nothing) or nadie (nobody) after it, and it still reads as one negative in English. If nadie itself is the subject, it can lead the sentence instead, with no second no needed.","examples":["no vi nada - I didn't see anything","no comió nada - he didn't eat anything","nadie vio nada - nobody saw anything"],"track":59},{"id":"t59__preterite-er-ir","family":"preterite-er-ir","title":"The point in the past for -er/-ir verbs","explanation":"Take the -er or -ir off and put í on for I, with the accent on that i, or ió on for he/she/it/you-formal, with the accent on the o of ió. Comer is the hook - comí, comió - and the same endings work on -ir verbs like salir: salí, salió.","examples":["comer -> comí - I ate","comer -> comió - he ate","salir -> salió - she left","ver -> vi (I saw - one syllable, no accent needed)"],"track":59},{"id":"t59__preterite-ar","family":"preterite-ar","title":"The point in the past for -ar verbs","explanation":"Take the -ar off the verb and put é on for I, with the accent on that e, or ó on for he/she/it/you-formal, with the accent on that o. Hablar is the hook: hablé (I spoke), habló (he spoke) - check any -ar verb against it.","examples":["hablar -> hablé - I spoke","hablar -> habló - he spoke","comprar -> compré - I bought","enviar -> envié - I sent"],"track":58}],"drills":[{"id":"t59-01","type":"word","prompt":"I ate","answer":"Comí","steps":["eat: comer","take off the -er and add í, accent on the i"],"rules":["t59__preterite-er-ir"],"track":59,"source":"track"},{"id":"t59-02","type":"word","prompt":"He ate (or she ate, or you ate, formal)","answer":"Comió","steps":["take off the -er and add ió, accent on the o"],"rules":["t59__preterite-er-ir"],"track":59,"source":"track"},{"id":"t59-03","type":"sentence","prompt":"She didn't leave yet.","answer":"No salió todavía.","steps":["no at the front","to leave: salir, an -ir verb, same endings as -er","she left: salió","yet/still: todavía (from earlier)"],"rules":["t59__preterite-er-ir"],"track":59,"source":"track"},{"id":"t59-04","type":"sentence","prompt":"I don't know why she didn't leave yet.","answer":"No sé por qué no salió todavía.","steps":["I don't know why: no sé por qué (from earlier)","no salió todavía: she didn't leave yet"],"rules":["t59__preterite-er-ir"],"track":59,"source":"track"},{"id":"t59-05","type":"sentence","prompt":"I ate more than him.","answer":"Comí más que él.","steps":["I ate: comí","more: más","than: que","him/he: él, using the subject word, not the object one"],"rules":["t59__preterite-er-ir","t59__que-than"],"track":59,"source":"track"},{"id":"t59-06","type":"sentence","prompt":"He ate more than I.","answer":"Comió más que yo.","steps":["he ate: comió","more than: más que","I: yo, the subject word"],"rules":["t59__preterite-er-ir","t59__que-than"],"track":59,"source":"track"},{"id":"t59-07","type":"word","prompt":"I saw","answer":"Vi","steps":["to see: ver, regular here - go back to comer as your hook","take off the -er and add í, but it's one syllable so no written accent"],"rules":["t59__preterite-er-ir"],"track":59,"source":"track"},{"id":"t59-08","type":"sentence","prompt":"I saw you, but you didn't see me. (formal)","answer":"Lo vi, pero no me vio.","steps":["you (formal), I saw: lo vi","but: pero","no at the front","me, you saw: me vio"],"rules":["t59__preterite-er-ir"],"track":59,"source":"track"},{"id":"t59-09","type":"sentence","prompt":"Why didn't you eat anything? (formal)","answer":"¿Por qué no comió nada?","steps":["why: por qué","no at the front","you ate, formal: comió","anything/nothing: nada, doubling up with the no"],"rules":["t59__preterite-er-ir","t59__double-negative"],"track":59,"source":"track"},{"id":"t59-10","type":"sentence","prompt":"Nobody saw anything.","answer":"Nadie vio nada.","steps":["nobody: nadie, leading the sentence so no separate no is needed","he/it saw: vio","anything/nothing: nada"],"rules":["t59__preterite-er-ir","t59__double-negative"],"track":59,"source":"track"},{"id":"t59-11","type":"sentence","prompt":"It lasted two minutes.","answer":"Duró dos minutos.","steps":["to last: durar, an -ar verb","it lasted: duró","two minutes: dos minutos"],"rules":["t59__preterite-ar"],"track":59,"source":"track"},{"id":"t59-12","type":"sentence","prompt":"He ate for half an hour without stopping.","answer":"Comió durante media hora sin parar.","steps":["he ate: comió","for/during half an hour: durante media hora","without: sin","to stop: parar, plain infinitive after a preposition, not an -ing form"],"rules":["t59__preterite-er-ir","t59__durante"],"track":59,"source":"track"},{"id":"t59-x01","type":"word","prompt":"I left","answer":"Salí","steps":["to leave: salir","take off the -ir and add í, accent on the i"],"rules":["t59__preterite-er-ir"],"track":59,"source":"extension","difficulty":1},{"id":"t59-x02","type":"sentence","prompt":"He saw nothing.","answer":"No vio nada.","steps":["no at the front","he saw: vio","nothing: nada"],"rules":["t59__preterite-er-ir","t59__double-negative"],"track":59,"source":"extension","difficulty":1},{"id":"t59-x03","type":"sentence","prompt":"He didn't buy anything.","answer":"No compró nada.","steps":["no at the front","he bought: compró, an -ar verb","anything: nada"],"rules":["t59__preterite-ar","t59__double-negative"],"track":59,"source":"extension","difficulty":2},{"id":"t59-x04","type":"sentence","prompt":"He spoke for half an hour without stopping, but I didn't understand anything.","answer":"Habló durante media hora sin parar, pero no comprendí nada.","steps":["he spoke: habló","for half an hour without stopping: durante media hora sin parar","but: pero","to understand: comprender, an -er verb","no at the front, I understood: comprendí","anything: nada"],"rules":["t59__preterite-ar","t59__durante","t59__preterite-er-ir","t59__double-negative"],"track":59,"source":"extension","difficulty":3}],"blurb":"The dot in the past for -er/-ir verbs, and que for than","sectionIndex":7},{"id":"t60","label":"Track 60","tracks":[60],"rules":[{"id":"t60__preterite-nosotros","family":"preterite-nosotros","title":"The 'we' point in the past","explanation":"For -ar and -ir verbs, the 'we' past is identical to the 'we' present - hablamos is both we speak and we spoke, vivimos is both we live and we lived - context (a word like ayer or mañana) tells you which. For -er verbs only, the present -emos changes to -imos in the past: comemos -> comimos, vemos -> vimos.","examples":["hablamos = we speak / we spoke","vivimos = we live / we lived","comemos -> comimos - we eat -> we ate"],"track":60},{"id":"t60__double-negative","family":"double-negative","title":"Double negative with nada/nadie","explanation":"Spanish stacks two negatives without cancelling each other out: put no before the verb and nada (nothing) or nadie (nobody) after it, and it still reads as one negative in English. If nadie itself is the subject, it can lead the sentence instead, with no second no needed.","examples":["no vi nada - I didn't see anything","no comió nada - he didn't eat anything","nadie vio nada - nobody saw anything"],"track":59},{"id":"t60__preterite-er-ir","family":"preterite-er-ir","title":"The point in the past for -er/-ir verbs","explanation":"Take the -er or -ir off and put í on for I, with the accent on that i, or ió on for he/she/it/you-formal, with the accent on the o of ió. Comer is the hook - comí, comió - and the same endings work on -ir verbs like salir: salí, salió.","examples":["comer -> comí - I ate","comer -> comió - he ate","salir -> salió - she left","ver -> vi (I saw - one syllable, no accent needed)"],"track":59}],"drills":[{"id":"t60-01","type":"sentence","prompt":"We spoke.","answer":"Hablamos.","steps":["speak: hablar","the -ar 'we' past is identical to the 'we' present: hablamos"],"rules":["t60__preterite-nosotros"],"track":60,"source":"track"},{"id":"t60-02","type":"sentence","prompt":"When we speak, I understand everything.","answer":"Cuando hablamos, comprendo todo.","steps":["when: cuando","we speak: hablamos, taken here as present because the second half is present","I understand: comprendo","everything: todo"],"rules":["t60__preterite-nosotros"],"track":60,"source":"track"},{"id":"t60-03","type":"sentence","prompt":"When we spoke, I understood everything.","answer":"Cuando hablamos, comprendí todo.","steps":["when we spoke: cuando hablamos, still the same word as we speak","the second half now shows it's the past: I understood: comprendí","everything: todo"],"rules":["t60__preterite-nosotros","t60__preterite-er-ir"],"track":60,"source":"track"},{"id":"t60-04","type":"sentence","prompt":"We spoke yesterday.","answer":"Hablamos ayer.","steps":["we spoke: hablamos","yesterday: ayer, giving the context that fixes it as past"],"rules":["t60__preterite-nosotros"],"track":60,"source":"track"},{"id":"t60-05","type":"sentence","prompt":"We will speak tomorrow.","answer":"Hablamos mañana.","steps":["we speak: hablamos, used here with future context, as Spanish allows","tomorrow: mañana"],"rules":["t60__preterite-nosotros"],"track":60,"source":"track","note":"The present form covering the future is a rule from earlier tracks; hablamos itself stays exactly the same word."},{"id":"t60-06","type":"sentence","prompt":"We waited a lot yesterday.","answer":"Esperamos mucho ayer.","steps":["to wait/hope: esperar, an -ar verb","we waited: esperamos","a lot: mucho","yesterday: ayer, fixing it as past"],"rules":["t60__preterite-nosotros"],"track":60,"source":"track"},{"id":"t60-07","type":"sentence","prompt":"We ate.","answer":"Comimos.","steps":["we eat: comemos","-er verbs change -emos to -imos in the past: comimos"],"rules":["t60__preterite-nosotros"],"track":60,"source":"track"},{"id":"t60-08","type":"sentence","prompt":"We didn't eat.","answer":"No comimos.","steps":["no at the front","we ate: comimos"],"rules":["t60__preterite-nosotros"],"track":60,"source":"track"},{"id":"t60-09","type":"sentence","prompt":"We lived.","answer":"Vivimos.","steps":["to live: vivir, an -ir verb","-ir verbs stay the same in past and present: vivimos"],"rules":["t60__preterite-nosotros"],"track":60,"source":"track"},{"id":"t60-10","type":"sentence","prompt":"We saw.","answer":"Vimos.","steps":["we see: vemos","-er verbs change -emos to -imos: vimos"],"rules":["t60__preterite-nosotros"],"track":60,"source":"track"},{"id":"t60-11","type":"sentence","prompt":"We always get lost, but we didn't get lost yesterday.","answer":"Nos perdemos siempre, pero no nos perdimos ayer.","steps":["we get lost: nos perdemos","always: siempre","but: pero","no at the front","we got lost: nos perdimos, -er changed to -imos","yesterday: ayer"],"rules":["t60__preterite-nosotros"],"track":60,"source":"track"},{"id":"t60-12","type":"sentence","prompt":"We don't go out often, but we went out yesterday.","answer":"No salimos a menudo, pero salimos ayer.","steps":["no at the front","we go out: salimos, an -ir verb, same word for past and present","often: a menudo","but: pero","we went out: salimos","yesterday: ayer"],"rules":["t60__preterite-nosotros"],"track":60,"source":"track"},{"id":"t60-x01","type":"sentence","prompt":"We bought it.","answer":"Lo compramos.","steps":["it: lo, out front","we bought: compramos"],"rules":["t60__preterite-nosotros"],"track":60,"source":"extension","difficulty":1},{"id":"t60-x02","type":"sentence","prompt":"We sent it yesterday.","answer":"Lo enviamos ayer.","steps":["it: lo, out front","we sent: enviamos","yesterday: ayer"],"rules":["t60__preterite-nosotros"],"track":60,"source":"extension","difficulty":1},{"id":"t60-x03","type":"sentence","prompt":"We didn't see anything.","answer":"No vimos nada.","steps":["no at the front","we saw: vimos, -er changed to -imos","anything: nada"],"rules":["t60__preterite-nosotros","t60__double-negative"],"track":60,"source":"extension","difficulty":2},{"id":"t60-x04","type":"sentence","prompt":"We always get lost when we speak, but we didn't get lost yesterday.","answer":"Siempre nos perdemos cuando hablamos, pero no nos perdimos ayer.","steps":["always: siempre","we get lost: nos perdemos","when: cuando","we speak: hablamos","but: pero","no at the front, we got lost: nos perdimos","yesterday: ayer"],"rules":["t60__preterite-nosotros"],"track":60,"source":"extension","difficulty":3}],"blurb":"The we-form of the dot, and where it lands on the present","sectionIndex":7},{"id":"t61","label":"Track 61","tracks":[61],"rules":[{"id":"t61__gustar-pleasing","family":"gustar-pleasing","title":"To like is really to be pleasing to (gustar)","explanation":"Gustar doesn't mean to like, it means to be pleasing. So I like it is really it is pleasing to me: me gusta. The verb agrees with the thing doing the pleasing, not with the person doing the liking - one thing is me gusta, several things is me gustan - and the person liking shows up as me, nos, etc. in front. Saying me gusto by mistake means I like myself.","examples":["Me gusta. - I like it / it is pleasing to me.","Me gustan. - I like them.","Me gustaría. - I would like / it would please me."],"track":42},{"id":"t61__parecer-like-gustar","family":"parecer-like-gustar","title":"parecer works like gustar: it seems to me","explanation":"Parecer, to seem, works exactly like gustar: the thing doing the seeming is the subject, and the person it seems to gets me/le/nos in front. It seems good to me is me parece bien; make it a point in the past and it's me pareció bien; make it a line and it's me parecía bien.","examples":["Me parece bien. - It seems good to me.","Me pareció bien. (It seemed good to me - the dot.)","Me parecía bien. (It seemed good to me - the line.)"],"track":61},{"id":"t61__line-point-interaction","family":"line-point-interaction","title":"The line and the dot in the same sentence","explanation":"The line in the past (was doing) and the dot in the past (did) can sit in the same sentence, joined by cuando. The line sets the ongoing background, the dot is the thing that happened inside it. Which one you pick isn't about translating English word for word, it's about whether you mean an event or an ongoing thing in your head.","examples":["Cocinaba cuando el teléfono sonó.","Hablaba por teléfono cuando María llegó.","No me gustaba (ongoing) vs. no me gustó (a closed event)."],"track":61},{"id":"t61__quedarse-stay","family":"quedarse-stay","title":"Remain myself = stay (me quedo)","explanation":"Quedar means to remain or be left over. To say I stay, you say I remain myself: me quedo. The reflexive word (me/te/nos) goes before the changed verb, same as always, and it's not optional here - you need it to get the meaning of stay. In the point in the past it behaves like any other -ar verb, with the small word still in front: me quedé, se quedó, nos quedamos.","examples":["me quedé - I stayed","se quedó - he/she stayed","nos quedamos - we stayed"],"track":25}],"drills":[{"id":"t61-01","type":"sentence","prompt":"I was cooking when the phone rang.","answer":"Cocinaba cuando el teléfono sonó.","steps":["to cook: cocinar, I was cooking (line): cocinaba","when: cuando","the phone: el teléfono","rang, literally sounded: sonar in the point, he/it form: sonó"],"rules":["t61__line-point-interaction"],"track":61,"source":"track"},{"id":"t61-02","type":"sentence","prompt":"I was speaking on the phone when Maria arrived.","answer":"Hablaba por teléfono cuando María llegó.","steps":["I was speaking (line): hablaba","on the phone: por teléfono, using por for by/on","when: cuando","to arrive: llegar, María arrived (point): llegó"],"rules":["t61__line-point-interaction"],"track":61,"source":"track"},{"id":"t61-03","type":"word","prompt":"I stayed","answer":"Me quedé","steps":["to stay: quedarse, said back to yourself","I: me","stayed (point): quedé"],"rules":["t61__quedarse-stay"],"track":61,"source":"track"},{"id":"t61-04","type":"word","prompt":"we stayed","answer":"Nos quedamos","steps":["we: nos","stayed (point): quedamos"],"rules":["t61__quedarse-stay"],"track":61,"source":"track"},{"id":"t61-05","type":"sentence","prompt":"I liked it.","answer":"Me gustó.","steps":["it pleased me: me gustó, treating this as a closed event, a point"],"rules":["t61__gustar-pleasing","t61__line-point-interaction"],"track":61,"source":"track"},{"id":"t61-06","type":"sentence","prompt":"I didn't like it. (thinking of it as ongoing - I wasn't liking it)","answer":"No me gustaba.","steps":["no at the front","it pleased me, but as a line this time: me gustaba"],"rules":["t61__gustar-pleasing","t61__line-point-interaction"],"track":61,"source":"track"},{"id":"t61-07","type":"sentence","prompt":"It seems good to me.","answer":"Me parece bien.","steps":["to seem: parecer, working like gustar","it seems to me: me parece","good, well: bien"],"rules":["t61__parecer-like-gustar"],"track":61,"source":"track"},{"id":"t61-08","type":"sentence","prompt":"It seemed good to me.","answer":"Me pareció bien.","steps":["it seemed to me, as a point: me pareció","good: bien"],"rules":["t61__parecer-like-gustar"],"track":61,"source":"track"},{"id":"t61-09","type":"sentence","prompt":"It seemed good to me, but when I saw it, I didn't like it.","answer":"Me parecía bien, pero cuando lo vi, no me gustó.","steps":["it was seeming good to me, as a line: me parecía bien","but: pero","when I saw it: cuando lo vi","I didn't like it, as a closed event: no me gustó"],"rules":["t61__parecer-like-gustar","t61__line-point-interaction"],"track":61,"source":"track"},{"id":"t61-x01","type":"sentence","prompt":"I was working when you arrived. (informal)","answer":"Trabajaba cuando llegaste.","steps":["I was working (line): trabajaba","when: cuando","you arrived (point, -aste from earlier): llegaste"],"rules":["t61__line-point-interaction"],"track":61,"source":"extension","difficulty":1},{"id":"t61-x02","type":"sentence","prompt":"We stayed home because it seemed good to us.","answer":"Nos quedamos en casa porque nos pareció bien.","steps":["we stayed: nos quedamos","home: en casa","because: porque (from earlier)","it seemed good to us: nos pareció bien"],"rules":["t61__quedarse-stay","t61__parecer-like-gustar"],"track":61,"source":"extension","difficulty":2},{"id":"t61-x03","type":"sentence","prompt":"I didn't like it, but it seemed good to her when she saw it.","answer":"No me gustó, pero le pareció bien cuando lo vio.","steps":["I didn't like it (point): no me gustó","but: pero","it seemed good to her: le pareció bien","when she saw it: to see, point, I-form vi from earlier, she-form: vio, no accent"],"rules":["t61__parecer-like-gustar","t61__line-point-interaction"],"track":61,"source":"extension","difficulty":3}],"blurb":"The line and the dot in the same sentence, and gustar in both","sectionIndex":7},{"id":"t62","label":"Track 62","tracks":[62],"rules":[{"id":"t62__a-clarification-repeat","family":"a-clarification-repeat","title":"Clarifying who se means: repeat it with a él, a ella, a usted","explanation":"Because se (and le) can mean him, her, you-formal, or them, you clarify by repeating the whole sentence and tacking on a él, a ella, a usted, a ellos, a ellas, or a ustedes afterward, like an afterthought. Unlike other prepositions (para mí, for example, where you don't repeat anything), this a always keeps the small word in the sentence and adds on top of it.","examples":["Le di algo a usted. - I gave you something.","Se lo vendí a él. - I sold it to him.","Se lo envió a ustedes. - He sent it to you guys."],"track":62},{"id":"t62__dar-irregular-preterite","family":"dar-irregular-preterite","title":"dar switches sides in the dot: di, dio, dimos","explanation":"Dar is an -ar verb but in the point in the past it behaves like an -er/-ir verb instead - the only verb that does this. So I gave is di (not dé), he/she/it/you-formal gave is dio (accent-free, stress falls naturally), we gave is dimos.","examples":["di - I gave","dio - he/she/you formal gave","dimos - we gave"],"track":62},{"id":"t62__double-l-to-se","family":"double-l-to-se","title":"Two l's together turn into se: le lo becomes se lo","explanation":"When le or les would land right before lo, la, los or las, Spanish doesn't like the sound of two l's together, so the first one - le or les - turns into se instead. This is purely about sound, not meaning, and it's a different se from the reflexive one.","examples":["le lo di -> se lo di","les los vendí -> se los vendí","le lo envió -> se lo envió"],"track":62}],"drills":[{"id":"t62-01","type":"word","prompt":"I gave","answer":"Di","steps":["dar switches sides in the point in the past, behaving like an -er/-ir verb","I: di"],"rules":["t62__dar-irregular-preterite"],"track":62,"source":"track"},{"id":"t62-02","type":"word","prompt":"he gave","answer":"Dio","steps":["he/she/it/you-formal: dio, no accent needed"],"rules":["t62__dar-irregular-preterite"],"track":62,"source":"track"},{"id":"t62-03","type":"sentence","prompt":"He didn't give it to us.","answer":"No nos lo dio.","steps":["no at the front","us: nos","it: lo","gave: dio"],"rules":["t62__dar-irregular-preterite"],"track":62,"source":"track"},{"id":"t62-04","type":"sentence","prompt":"I gave it to him.","answer":"Se lo di.","steps":["first thought: I gave - di","to him would be le, it would be lo: le lo, but Spanish doesn't like two l's together","le turns into se: se lo di"],"rules":["t62__double-l-to-se","t62__dar-irregular-preterite"],"track":62,"source":"track"},{"id":"t62-05","type":"sentence","prompt":"I gave them to him.","answer":"Se los di.","steps":["them (masculine): los","to him: le, becomes se before los","gave: di"],"rules":["t62__double-l-to-se","t62__dar-irregular-preterite"],"track":62,"source":"track"},{"id":"t62-06","type":"sentence","prompt":"I gave him something.","answer":"Le di algo.","steps":["to him: le","gave: di","something: algo (from earlier)"],"rules":["t62__dar-irregular-preterite"],"track":62,"source":"track"},{"id":"t62-07","type":"sentence","prompt":"I gave something to you. (formal, clarified)","answer":"Le di algo a usted.","steps":["build the base sentence first: le di algo","then clarify by repeating and adding: a usted","the le doesn't disappear when you add the a"],"rules":["t62__a-clarification-repeat","t62__dar-irregular-preterite"],"track":62,"source":"track"},{"id":"t62-08","type":"sentence","prompt":"I sold him it.","answer":"Se lo vendí.","steps":["to sell: vender, I sold: vendí","to him: le, it: lo - le lo isn't allowed, le becomes se","put it together: se lo vendí"],"rules":["t62__double-l-to-se"],"track":62,"source":"track"},{"id":"t62-09","type":"sentence","prompt":"I sold it to him. (clarified)","answer":"Se lo vendí a él.","steps":["base sentence: se lo vendí","repeat and add the clarification: a él"],"rules":["t62__a-clarification-repeat"],"track":62,"source":"track"},{"id":"t62-10","type":"sentence","prompt":"I sold them to her. (feminine things)","answer":"Se las vendí a ella.","steps":["them, feminine: las","to her: le, becomes se before las","sold: vendí","clarify by repeating: a ella"],"rules":["t62__double-l-to-se","t62__a-clarification-repeat"],"track":62,"source":"track"},{"id":"t62-11","type":"sentence","prompt":"He didn't send it to you guys yet.","answer":"No se lo envió a ustedes todavía.","steps":["no at the front","to you guys: les, it: lo - becomes se lo","sent: envió","clarify: a ustedes","yet: todavía"],"rules":["t62__double-l-to-se","t62__a-clarification-repeat"],"track":62,"source":"track"},{"id":"t62-12","type":"sentence","prompt":"I don't know if I sent it to him.","answer":"No sé si se lo envié.","steps":["I don't know if: no sé si (from earlier)","I sent it to him: le lo envié becomes se lo envié"],"rules":["t62__double-l-to-se"],"track":62,"source":"track"},{"id":"t62-x01","type":"sentence","prompt":"I sold it to her.","answer":"Se lo vendí a ella.","steps":["sold it: lo vendí, to her becomes se before lo: se lo vendí","clarify: a ella"],"rules":["t62__double-l-to-se","t62__a-clarification-repeat"],"track":62,"source":"extension","difficulty":1},{"id":"t62-x02","type":"sentence","prompt":"We gave them to him. (feminine things)","answer":"Se las dimos a él.","steps":["we gave: dimos","them, feminine: las, to him: le becomes se before las","clarify: a él"],"rules":["t62__dar-irregular-preterite","t62__double-l-to-se","t62__a-clarification-repeat"],"track":62,"source":"extension","difficulty":2},{"id":"t62-x03","type":"sentence","prompt":"She sent it to me, but I didn't like it.","answer":"Me lo envió, pero no me gustó.","steps":["she sent it to me: me lo envió","but: pero","I didn't like it, as a closed event: no me gustó"],"rules":["t62__a-clarification-repeat"],"track":62,"source":"extension","difficulty":2},{"id":"t62-x04","type":"sentence","prompt":"I don't know if I gave it to him or to her.","answer":"No sé si se lo di a él o a ella.","steps":["I don't know if: no sé si","I gave it to him: le lo di becomes se lo di","or: o","clarify her too: a él o a ella"],"rules":["t62__dar-irregular-preterite","t62__double-l-to-se","t62__a-clarification-repeat"],"track":62,"source":"extension","difficulty":3}],"blurb":"le and les turning into se in front of lo, and clarifying with a él","sectionIndex":7},{"id":"t63","label":"Track 63","tracks":[63],"rules":[{"id":"t63__acordarse-o-split","family":"acordarse-o-split","title":"acordarse (to remember), where the o splits","explanation":"To remember is acordarse - another -se verb, so you remember yourself. When the o is stressed it splits into ue, same pattern as other splitting verbs: me acuerdo. When the stress moves off the o, as with we, it stays plain: nos acordamos.","examples":["me acuerdo - I remember","no me acuerdo - I don't remember","no nos acordamos (we don't remember - stress off the o, so no split)"],"track":63},{"id":"t63__a-clarification-repeat","family":"a-clarification-repeat","title":"Clarifying who se means: repeat it with a él, a ella, a usted","explanation":"Because se (and le) can mean him, her, you-formal, or them, you clarify by repeating the whole sentence and tacking on a él, a ella, a usted, a ellos, a ellas, or a ustedes afterward, like an afterthought. Unlike other prepositions (para mí, for example, where you don't repeat anything), this a always keeps the small word in the sentence and adds on top of it.","examples":["Le di algo a usted. - I gave you something.","Se lo vendí a él. - I sold it to him.","Se lo envió a ustedes. - He sent it to you guys."],"track":62},{"id":"t63__double-l-to-se","family":"double-l-to-se","title":"Two l's together turn into se: le lo becomes se lo","explanation":"When le or les would land right before lo, la, los or las, Spanish doesn't like the sound of two l's together, so the first one - le or les - turns into se instead. This is purely about sound, not meaning, and it's a different se from the reflexive one.","examples":["le lo di -> se lo di","les los vendí -> se los vendí","le lo envió -> se lo envió"],"track":62},{"id":"t63__dar-irregular-preterite","family":"dar-irregular-preterite","title":"dar switches sides in the dot: di, dio, dimos","explanation":"Dar is an -ar verb but in the point in the past it behaves like an -er/-ir verb instead - the only verb that does this. So I gave is di (not dé), he/she/it/you-formal gave is dio (accent-free, stress falls naturally), we gave is dimos.","examples":["di - I gave","dio - he/she/you formal gave","dimos - we gave"],"track":62}],"drills":[{"id":"t63-01","type":"word","prompt":"I remember","answer":"Me acuerdo","steps":["to remember: acordarse, said back to yourself","the o is stressed here, so it splits: acuerdo","put it together: me acuerdo"],"rules":["t63__acordarse-o-split"],"track":63,"source":"track"},{"id":"t63-02","type":"sentence","prompt":"We don't remember.","answer":"No nos acordamos.","steps":["no at the front","we: nos","the stress isn't on the o here, so it doesn't split: acordamos"],"rules":["t63__acordarse-o-split"],"track":63,"source":"track"},{"id":"t63-03","type":"sentence","prompt":"I don't remember if I gave it to him or to her.","answer":"No me acuerdo si se lo di a él o a ella.","steps":["I don't remember: no me acuerdo","if: si","I gave it to him: le lo di becomes se lo di","or to her: o a ella"],"rules":["t63__acordarse-o-split","t63__double-l-to-se","t63__a-clarification-repeat"],"track":63,"source":"track"},{"id":"t63-04","type":"sentence","prompt":"We don't remember if we gave it to him or to them. (feminine)","answer":"No nos acordamos si se lo dimos a él o a ellas.","steps":["we don't remember: no nos acordamos","if: si","we gave it to him: le lo dimos becomes se lo dimos","or to them, feminine: o a ellas"],"rules":["t63__acordarse-o-split","t63__dar-irregular-preterite","t63__double-l-to-se","t63__a-clarification-repeat"],"track":63,"source":"track"},{"id":"t63-05","type":"sentence","prompt":"She likes it. (clarified)","answer":"Le gusta a ella.","steps":["it is pleasing to her: le gusta","clarify by repeating: a ella"],"rules":["t63__a-clarification-repeat"],"track":63,"source":"track"},{"id":"t63-06","type":"sentence","prompt":"She liked it. (clarified)","answer":"Le gustó a ella.","steps":["it was pleasing to her, as a point: le gustó","clarify by repeating: a ella"],"rules":["t63__a-clarification-repeat"],"track":63,"source":"track"},{"id":"t63-x01","type":"sentence","prompt":"He doesn't remember.","answer":"No se acuerda.","steps":["no at the front","he: se","the o is stressed: acuerda"],"rules":["t63__acordarse-o-split"],"track":63,"source":"extension","difficulty":1},{"id":"t63-x02","type":"sentence","prompt":"He liked it, but he doesn't remember it.","answer":"Le gustó, pero no se acuerda.","steps":["it was pleasing to him: le gustó","but: pero","he doesn't remember: no se acuerda"],"rules":["t63__acordarse-o-split"],"track":63,"source":"extension","difficulty":2},{"id":"t63-x03","type":"sentence","prompt":"I don't remember if I sold it to him or to her.","answer":"No me acuerdo si se lo vendí a él o a ella.","steps":["I don't remember: no me acuerdo","if: si","I sold it to him: le lo vendí becomes se lo vendí","or to her: o a ella"],"rules":["t63__acordarse-o-split","t63__double-l-to-se","t63__a-clarification-repeat"],"track":63,"source":"extension","difficulty":3}],"blurb":"acordarse for remembering, and saying who you mean with a + pronoun","sectionIndex":7},{"id":"t64","label":"Track 64","tracks":[64],"rules":[{"id":"t64__preterite-tu","family":"preterite-tu","title":"You-informal in the point in the past: -aste, -iste","explanation":"For the point in the past (a completed action) with the informal you, -ar verbs take -aste and -er/-ir verbs take -iste. Drop the -ar/-er/-ir and add the ending: hablar -> hablaste, comer -> comiste, salir -> saliste.","examples":["Hablaste - you spoke","Comiste - you ate","¿Saliste anoche? - did you go out last night?"],"track":64},{"id":"t64__hace-ago","family":"hace-ago","title":"hace for ago","explanation":"To say a length of time \"ago\", use hace (it makes) plus the amount of time, placed where \"ago\" would sit in the English but at the front-ish of the Spanish (or after the verb). Two weeks ago becomes hace dos semanas, literally \"it makes two weeks\".","examples":["Hace dos semanas - two weeks ago","Lo vi hace dos semanas - I saw him two weeks ago","Se lo respondí hace un mes - I responded it to her one month ago"],"track":64},{"id":"t64__preterite-ellos","family":"preterite-ellos","title":"They in the point in the past: -aron, -ieron","explanation":"For the point in the past with they, -ar verbs take -aron and -er/-ir verbs take -ieron. Drop the -ar/-er/-ir and add the ending: hablar -> hablaron, comer -> comieron, vender -> vendieron.","examples":["Hablaron - they spoke","Comieron - they ate","Los vendieron - they sold them"],"track":64},{"id":"t64__double-l-to-se","family":"double-l-to-se","title":"Two l's together turn into se: le lo becomes se lo","explanation":"When le or les would land right before lo, la, los or las, Spanish doesn't like the sound of two l's together, so the first one - le or les - turns into se instead. This is purely about sound, not meaning, and it's a different se from the reflexive one.","examples":["le lo di -> se lo di","les los vendí -> se los vendí","le lo envió -> se lo envió"],"track":62}],"drills":[{"id":"t64-01","type":"sentence","prompt":"I saw him two weeks ago.","answer":"Lo vi hace dos semanas.","steps":["I saw him: lo vi","two weeks ago, literally it makes two weeks: hace dos semanas"],"rules":["t64__hace-ago"],"track":64,"source":"track"},{"id":"t64-02","type":"sentence","prompt":"I responded to her seven weeks ago.","answer":"Le respondí hace siete semanas.","steps":["I responded to her: le respondí","seven weeks ago: hace siete semanas"],"rules":["t64__hace-ago"],"track":64,"source":"track"},{"id":"t64-03","type":"sentence","prompt":"I responded to her mail.","answer":"Se lo respondí.","steps":["to her would be le, it would be lo - but le lo isn't allowed","le turns into se: se lo","I responded: respondí"],"rules":["t64__double-l-to-se"],"track":64,"source":"track"},{"id":"t64-04","type":"sentence","prompt":"I responded it to her one month ago.","answer":"Se lo respondí hace un mes.","steps":["I responded it to her: se lo respondí","one month ago: hace un mes"],"rules":["t64__double-l-to-se","t64__hace-ago"],"track":64,"source":"track"},{"id":"t64-05","type":"word","prompt":"you spoke (informal)","answer":"Hablaste","steps":["speak: hablar, take off the -ar","you-informal in the dot: add -aste"],"rules":["t64__preterite-tu"],"track":64,"source":"track"},{"id":"t64-06","type":"sentence","prompt":"Didn't you eat it? (informal)","answer":"¿No lo comiste?","steps":["no at the front","it: lo, out in front of the verb","eat: comer, take off
