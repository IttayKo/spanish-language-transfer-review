<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Complete Spanish — Review</title>
<meta name="description" content="An unofficial companion for practicing Language Transfer's Complete Spanish course: speaking drills and a searchable grammar glossary.">
<meta name="theme-color" content="#FAF8F4">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CS Review">
<style>
:root{
  /* Direction A, "Primer" - ink on warm paper. No cards, no boxes. Ratios
     computed with the WCAG relative-luminance formula; see redesign PLAN.md
     section 4.1 for the worked numbers. */
  --paper:#FAF8F4;      /* page ground */
  --sunk:#F0ECE4;       /* recessed / inactive surface, and the "arrived from Why" bleed */
  --ink:#23201C;        /* 15.29:1 on paper - body text, filled buttons */
  --ink-2:#635D54;      /* 6.14:1 - secondary prose, revealed English */
  --ink-3:#6E675D;      /* 5.26:1 - cue lines, counters, periphery */
  --edge:#8C8475;       /* 3.49:1 - meaningful boundaries only (never text) */
  --rule:#DDD6C8;       /* decorative row hairline */
  --rule-2:#CFC7B6;     /* decorative section hairline */
  --mark:#194A93;       /* 8.11:1 - links, rule cross-refs, live things */
  --flag:#9C3626;       /* 6.67:1 - statements about reliability: Not yet, not-from-the-recording */
  --danger:var(--flag);
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --bar:5rem;
  /* Bumped up a step from the original scale - the redesign's first review
     round came back "way too tight" across every screen. Rows get taller,
     gaps get wider; smaller type and raggeder wrapping are an accepted
     trade for it (see the truncation removals below). */
  --s1:4px; --s2:10px; --s3:16px; --s4:20px; --s5:32px; --s6:44px; --s7:64px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
:focus-visible{outline:2px solid var(--mark);outline-offset:2px;border-radius:2px}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button{font:inherit;color:inherit;font-variant-numeric:inherit}
.app{max-width:42rem;margin:0 auto;padding:0 20px;min-height:100dvh;display:flex;flex-direction:column;background:var(--paper);}
main{flex:1;padding:0 0 calc(var(--bar) + var(--s5))}

/* ---- running head: home's only persistent chrome ---- */
.head{display:flex;align-items:baseline;gap:var(--s3);padding:22px 0 0;min-height:48px}
.head .name{font-size:.9375rem;font-weight:600;letter-spacing:-.003em}
.head .stat{margin-left:auto;font-size:.8125rem;color:var(--ink-3);white-space:nowrap}
.measure{height:3px;background:var(--rule-2);margin:12px 0 0;position:relative}
.measure i{position:absolute;inset:0 auto 0 0;background:var(--ink)}

/* ---- pack-view header: back arrow + Drills/Rules tabs, one row ---- */
.topline{display:flex;align-items:stretch;gap:var(--s4);border-bottom:1px solid var(--rule);padding-top:8px}
.tabs{display:flex;gap:var(--s5)}
.tabs button{
  appearance:none;border:0;background:none;padding:14px 0 13px;min-height:48px;
  font-size:.9375rem;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}

/* ---- glossary / backup header: back link, title, one-line count ---- */
.gh{padding:18px 0 0}
.gh h1{font-size:1.25rem;font-weight:600;letter-spacing:-.014em;margin:8px 0 0}
.gh .gcount{padding-top:6px;line-height:1.5}

.back{
  appearance:none;border:0;background:none;padding:14px 0;margin:0;
  min-height:48px;display:inline-flex;align-items:center;gap:6px;
  color:var(--mark);font-size:.875rem;cursor:pointer;
}
.topline .back{padding:0;min-width:44px;justify-content:flex-start;margin-right:-6px;font-size:1.0625rem}

/* ---- search: a line to write on, not a box ---- */
.searchrow{position:relative;margin:var(--s5) 0 var(--s4)}
.searchrow input{
  width:100%;appearance:none;background:transparent;border:0;
  border-bottom:1.5px solid var(--edge);
  padding:14px 0;font:inherit;font-size:.9375rem;color:var(--ink);min-height:48px;
}
.searchrow input::placeholder{color:var(--ink-3)}

/* ---- demo banner (demo build only) ---- */
.demo-note{
  font-size:.8125rem;line-height:1.55;color:var(--ink-3);max-width:46ch;
  border-bottom:1px solid var(--rule);padding:var(--s3) 0 var(--s4);
}
.demo-note .link-inline{
  appearance:none;border:0;background:none;padding:0;margin:0;font-family:var(--sans);
  color:var(--mark);font-size:inherit;line-height:inherit;cursor:pointer;
  text-decoration:underline;text-underline-offset:2px;
}

/* ---- the next thing to do ---- */
.home-hero{padding:var(--s5) 0 var(--s5)}
.home-hero .lbl{font-size:.8125rem;color:var(--ink-3);margin-bottom:8px}
.home-hero .t{font-size:1.375rem;line-height:1.3;font-weight:600;letter-spacing:-.012em;margin-bottom:8px}
.home-hero .b{font-size:.9375rem;color:var(--ink-2);line-height:1.55;max-width:34ch;margin:0}
/* Full width, like the primary button in the drill bar. Shrink-wrapped it
   hangs flush-left under the description with nothing balancing it. */
.home-hero .btn{display:block;width:100%;margin-top:var(--s3)}
.linkrow{border-top:1px solid var(--rule);padding-top:var(--s3);margin-top:var(--s3)}
.linkrow:first-child{margin-top:0}
.link{
  appearance:none;border:0;background:none;padding:16px 0;min-height:48px;
  color:var(--mark);font-size:.9375rem;cursor:pointer;text-align:left;
  display:block;width:100%;
}
.link .sub{display:block;color:var(--ink-3);font-size:.8125rem;line-height:1.5;margin-top:4px;max-width:40ch;font-weight:400}

/* ---- sections & track rows: a table of contents, not cards ---- */
.section-head{padding:var(--s6) 0 var(--s3);border-top:1.5px solid var(--rule-2);margin-top:var(--s5)}
.section-head:first-of-type{margin-top:var(--s3);padding-top:var(--s2);border-top:0}
.section-head .r{font-size:.8125rem;color:var(--ink-3)}
.section-head h3{margin:4px 0 6px;font-size:1rem;font-weight:600;letter-spacing:-.008em}
.section-head p{margin:0;font-size:.8125rem;line-height:1.55;color:var(--ink-3);max-width:44ch}

.packlist{margin:0}
.packcard{display:flex;align-items:flex-start;border-top:1px solid var(--rule)}
.packlist .packcard:first-child{border-top:0}
.rowbtn{
  appearance:none;border:0;background:none;flex:1;min-width:0;cursor:pointer;
  display:flex;gap:var(--s3);padding:16px 0;min-height:48px;text-align:left;align-items:flex-start;
  color:inherit;font:inherit;margin:0;
}
.packcard .num{width:1.75rem;flex:none;text-align:right;font-size:.9375rem;color:var(--ink-3);padding-top:2px;font-weight:400}
.packcard .meta{flex:1;min-width:0}
/* No truncation: the full blurb wraps onto as many lines as it needs
   (smaller type and ragged wraps are fine, hiding the description isn't). */
.packcard .meta .sub{font-size:.9375rem;line-height:1.5;color:var(--ink)}
.packcard.done .meta .sub{color:var(--ink-2)}
/* The count lives under the done circle, not inline, so the description
   gets the full width of the line. */
.packcard .rowend{flex:none;display:flex;flex-direction:column;align-items:center;width:3.25rem;padding-top:10px}
.packcard .prog{font-size:.75rem;color:var(--ink-3);line-height:1.3;text-align:center;margin-top:-6px}
.donebtn{
  appearance:none;border:0;background:none;width:44px;height:44px;flex:none;
  padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.donebtn-circle{
  width:19px;height:19px;border-radius:50%;border:1.5px solid var(--edge);
  display:block;position:relative;background:transparent;
}
.donebtn.on .donebtn-circle{background:var(--ink);border-color:var(--ink)}
.donebtn.on .donebtn-circle::after{
  content:"";position:absolute;left:5px;top:3px;width:5px;height:9px;
  border:solid var(--paper);border-width:0 1.5px 1.5px 0;transform:rotate(43deg);
}

.footlink{margin:var(--s7) 0 var(--s6);border-top:1px solid var(--rule);padding-top:var(--s3)}
.footlink button{
  appearance:none;border:0;background:none;padding:16px 0;min-height:48px;
  color:var(--ink-3);font-size:.875rem;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule-2);
}

/* the "N rules match in All rules" jump row - a plain link row, same
   discipline as .link above */
.glossjump{
  appearance:none;border:0;background:none;width:100%;padding:16px 0;min-height:48px;
  color:var(--mark);font-size:.9375rem;cursor:pointer;text-align:left;
  border-top:1px solid var(--rule);display:flex;align-items:center;gap:var(--s2);
}
.glossjump .arrow{margin-left:auto;color:var(--ink-3)}

.empty{color:var(--ink-3);text-align:center;padding:var(--s6) 0;font-size:.9375rem}

/* ---- drill ---- */
/* The drill is the one screen that behaves like an app, not a document: the
   running head, the stage and the action bar are laid out inside exactly
   one viewport and the page itself never scrolls - no reaching, no losing
   the prompt off the top mid-thought. Nothing is clipped or truncated to
   get there. Every size below is in em off .stage, so fitDrill() can
   squeeze the whole composition - whitespace first (--gap), then type
   (--fit) - and have the spacing stay in proportion to the text instead of
   detaching from it. The action bar sits outside .stage on purpose: the
   two buttons you actually press keep their full size at every squeeze. */
html.lock, body.lock{height:100dvh;overflow:hidden;overscroll-behavior:none}
body.lock .app{height:100dvh;overflow:hidden}
main.view-drill{flex:1;min-height:0;display:flex;flex-direction:column;padding-bottom:0;overflow:hidden}
/* Top-anchored at every size. Slack collects below the content, above the
   bar, so revealing the answer adds to the bottom and never lifts the
   prompt the learner is still reading. */
.stage{flex:1;min-height:0;overflow:hidden;font-size:calc(1rem * var(--fit,1))}

.filterbanner{font-size:.8125em;line-height:1.5;color:var(--ink-3);padding:0 0 calc(1em * var(--gap,1));display:flex;align-items:baseline;flex-wrap:wrap;gap:.25em .625em}
.filterbanner b{color:var(--ink);font-weight:600}
.filterbanner .link-inline{
  appearance:none;border:0;background:none;padding:0;margin:0;min-height:auto;
  color:var(--mark);font-size:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:2px;
}
.cue{
  font-size:.8125em;color:var(--ink-3);padding:calc(1.75em * var(--gap,1)) 0 calc(1.375em * var(--gap,1));
  display:flex;align-items:baseline;flex-wrap:wrap;gap:.25em 1em;
}
.cue .flag{color:var(--flag)}
/* Left end of the cue row, ink-coloured with an arrow: navigation. The
   undo at the other end is grey and wordy: not navigation. */
.cueback{
  appearance:none;border:0;background:none;padding:0;margin:0;font-family:var(--sans);
  color:var(--ink-2);font-size:1em;line-height:inherit;cursor:pointer;white-space:nowrap;
}
.cueback:hover{color:var(--ink)}
.undo{
  appearance:none;border:0;background:none;padding:0;margin-left:auto;
  color:var(--ink-3);font-size:1em;cursor:pointer;white-space:nowrap;
  text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule-2);
}
.eng{font-size:1.75em;line-height:1.34;letter-spacing:-.017em;max-width:22ch;font-weight:400}
.eng .reg{display:block;margin-top:.45em;color:var(--ink-3);font-size:.5em;letter-spacing:0;font-weight:400}
/* Revealing the answer must not recompose this: same size, same position,
   same max-width - only the colour dims a shade, so nothing the learner was
   reading jumps. See .answer below for where the "event" of revealing
   actually lives instead. */
.eng.answered{color:var(--ink-2)}
.eng.answered .reg{color:var(--ink-3)}

/* One group, not a boxed-off strip: a separator BETWEEN hints, never a
   leading rule above the first one or a trailing one under the last. */
.steps{margin:calc(1.75em * var(--gap,1)) 0 0;padding:0;list-style:none}
.steps li{padding:calc(.9em * var(--gap,1)) 0;border-top:1px solid var(--rule);font-size:.9375em;line-height:1.6;color:var(--ink-2)}
.steps li:first-child{padding-top:0;border-top:0}
.steps .step-why{color:var(--ink-2)}
.steps .sep{color:var(--ink-3)}
.steps .es{color:var(--ink);font-weight:600}
/* The reveal is a new block that arrives BELOW the prompt and any hints
   already on screen - it never displaces them. Its own weight (scale, plus
   the hairline that opens it) is what makes it read as an event, not motion. */
.answer{margin:calc(2em * var(--gap,1)) 0 0;padding-top:calc(1.125em * var(--gap,1));border-top:1px solid var(--rule-2)}
.answer .es{font-size:1.9375em;line-height:1.3;letter-spacing:-.018em;margin:0;font-weight:400;color:var(--ink)}
.answer .note{font-size:.9375em;line-height:1.6;color:var(--ink-2);margin:calc(1em * var(--gap,1)) 0 0;max-width:38ch}
.answer .flag{font-size:.8125em;color:var(--flag);margin-top:calc(.75em * var(--gap,1));display:block}
.answer .speak{
  appearance:none;background:transparent;border:1.5px solid var(--edge);border-radius:3px;color:var(--ink);
  padding:.7em 1em;min-height:2.6em;margin:calc(1em * var(--gap,1)) 0 0;font-size:.875em;cursor:pointer;font-family:var(--sans);
  display:inline-flex;align-items:center;gap:.5em;
}
/* The rule cross-references are a wrapped line of links, not a stack of
   full-width rows: on the answered screen they're the last thing anyone
   needs and the first thing that should stop costing a third of the
   viewport. */
.why{
  margin:calc(1.5em * var(--gap,1)) 0 0;padding-top:calc(.875em * var(--gap,1));border-top:1px solid var(--rule);
  display:flex;flex-wrap:wrap;align-items:baseline;gap:0 1em;
}
.why .why-lbl{font-size:.8125em;color:var(--ink-3)}
.rulelink{
  appearance:none;border:0;background:none;text-align:left;font-family:var(--sans);
  padding:.35em 0;color:var(--mark);font-size:.9375em;line-height:1.5;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule-2);
}
.why-all{display:none}

/* A short screen is not a small screen. On a phone held sideways (or a
   laptop with the browser chrome eating half the window) there is plenty of
   width and almost no height, so the drill stops being one column: the
   prompt, the answer and the rule links take the left, the hint stack takes
   the right, and the whole thing fits without giving up a single size. The
   reading order is unchanged for screen readers and for keyboard focus -
   only the placement moves. */
@media (min-width:700px) and (max-height:620px){
  body.lock .app{max-width:58rem}
  .stage{
    display:grid;column-gap:2.5em;align-content:start;
    grid-template-columns:1fr 1fr;
    grid-template-areas:"cue cue" "eng steps" "answer steps" "why steps";
  }
  .stage > .filterbanner{grid-column:1 / -1}
  .stage > .cue{grid-area:cue}
  .stage > .eng{grid-area:eng;max-width:100%}
  .stage > .steps{grid-area:steps;margin-top:0}
  .stage > .answer{grid-area:answer}
  .stage > .why{grid-area:why}
}
/* Short screens, sideways or not: the chrome above and below the drill is
   the cheapest height in the app to buy back, and buying it back is how the
   type keeps its size. */
@media (max-height:620px){
  .topline{padding-top:2px}
  .tabs button{padding:10px 0 9px;min-height:40px}
  .bar{padding:var(--s2) 0 calc(var(--s2) + env(safe-area-inset-bottom))}
  .bar .btn, .bar.grade button{min-height:46px;padding-top:12px;padding-bottom:12px}
}

/* Shedding: the last two rungs of fitDrill()'s ladder, for a screen so
   short that squeezing space and type has run out before the drill fits.
   Nothing here loses a word of the answer, the prompt or the hints - only
   the periphery goes: four wrapped rule titles become one "4 rules" link
   to the same place, the teacher's aside folds away, the hint rows give up
   their breathing room and the speak button its label. A dense drill on a
   320px phone is the only thing that reaches rung two. */
.stage.shed1 .why .rulelink:not(.why-all){display:none}
.stage.shed1 .why-all{display:inline}
.stage.shed1 .answer .note{display:none}
.stage.shed2 .steps li{padding:calc(.4em * var(--gap,1)) 0;line-height:1.45}
.stage.shed2 .eng{line-height:1.22}
.stage.shed2 .answer .speak{padding:.45em .7em;min-height:0}
.stage.shed2 .speak-lbl{display:none}
/* Sitting right beside the drill counter, the arrow alone still reads as
   "back one of these" - and dropping the words keeps the cue on one line on
   a narrow phone, which is worth more than the words are. "Take that back"
   keeps its wording at every rung: it is the one of the two whose meaning
   an arrow could not carry. */
.stage.shed2 .cueback-lbl{display:none}

/* ---- rules (per-track tab) - hairline rows, same discipline as the glossary ---- */
.rules-list{margin:0}
.rule{border-bottom:1px solid var(--rule);padding:var(--s6) 0;scroll-margin-top:5rem}
.rules-list .rule:first-child{padding-top:var(--s3)}
.rules-list .rule:last-child{border-bottom:none}
.rule.highlight{background:var(--sunk);margin:0 -20px;padding:var(--s6) 20px;transition:background-color 1.6s ease 300ms}
.rule h3{margin:0 0 var(--s3);font-size:.9375rem;font-weight:600;line-height:1.4}
.rule p{margin:0 0 var(--s4);font-size:1rem;line-height:1.65;max-width:38ch;color:var(--ink)}
.rule ul{margin:0 0 var(--s4);padding:0;list-style:none}
.rule ul li{font-size:.9375rem;line-height:1.6;padding:6px 0 6px 16px;position:relative;color:var(--ink-2)}
.rule ul li::before{content:"";position:absolute;left:0;top:.85em;width:6px;height:1px;background:var(--edge)}
.rule ul li .es{color:var(--ink)}
.rule .src{font-size:.8125rem;color:var(--ink-3)}
.rule .practicebtn, .gpractice{
  appearance:none;border:0;background:none;padding:12px 0;min-height:48px;font-family:var(--sans);
  color:var(--mark);font-size:.875rem;cursor:pointer;display:block;text-align:left;
}

/* ---- sticky action bar(s) ---- */
.bar{
  position:sticky;bottom:0;background:var(--paper);
  border-top:1px solid var(--rule-2);
  padding:var(--s3) 0 calc(var(--s3) + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:var(--s3);
}
.bar.stack{flex-direction:column;align-items:stretch;gap:var(--s3)}
.bar.stack .row2{display:flex;align-items:center;gap:var(--s4)}
/* Two real, competing actions on one row (Continue / Finish) - same idea as
   .bar.choice on the drill screen, scoped under .stack instead of being a
   .bar of its own so it doesn't duplicate the outer bar's border/background. */
.bar.stack .row1{display:flex;gap:var(--s3)}
.bar.stack .row1 .btn{flex:1}
.btn{
  appearance:none;border:0;background:var(--ink);color:var(--paper);
  border-radius:3px;padding:15px 20px;min-height:52px;font-size:.9375rem;font-weight:600;cursor:pointer;font-family:var(--sans);
  transition:background-color .15s ease,border-color .15s ease,opacity .15s ease;
}
.btn:active{opacity:.85}
/* The reveal-answer action is a real, secondary-weight button: bordered
   like .speak/.grade below, never link-styled - both choices on the hint
   bar are buttons, just not competing filled buttons (see .bar.choice). */
.btn.secondary{
  background:transparent;color:var(--ink);border:1.5px solid var(--edge);
}
.btn.ghost{
  background:transparent;color:var(--mark);border:0;font-weight:400;padding:15px 0;min-height:52px;
  text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule-2);
}
.btn.small{padding:12px 0;min-height:48px;font-size:.875rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bar.choice{gap:var(--s2)}
.bar.choice .btn{flex:1}
.bar .textlink{
  appearance:none;border:0;background:none;padding:15px 0;min-height:48px;
  color:var(--ink-3);font-size:.875rem;cursor:pointer;font-family:var(--sans);
  text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule-2);
}
.bar.grade{gap:var(--s2)}
.bar.grade button{
  flex:1;appearance:none;background:transparent;border:1.5px solid var(--edge);color:var(--ink);
  border-radius:3px;padding:15px 10px;min-height:52px;font-size:.9375rem;font-weight:600;cursor:pointer;font-family:var(--sans);
}
.bar.grade button.no{color:var(--flag)}

/* ---- glossary ("All rules") ---- */
.gcount{font-size:.8125rem;line-height:1.5;color:var(--ink-3)}
.glosslist{margin:0}
.glossrow{border-top:1px solid var(--rule)}
.glosslist .glossrow:first-child{border-top:0}
.glosshead{
  appearance:none;border:0;background:none;width:100%;display:flex;gap:var(--s3);font-family:var(--sans);
  align-items:flex-start;padding:16px 0;min-height:48px;cursor:pointer;text-align:left;color:inherit;
}
.glosshead .num{width:1.75rem;flex:none;text-align:right;font-size:.9375rem;color:var(--ink-3);padding-top:2px}
/* No truncation here either: the full rule title wraps onto as many lines
   as it needs. */
.glosshead .t{flex:1;min-width:0;font-size:.9375rem;line-height:1.5;color:var(--ink)}
.glosshead[aria-expanded="true"] .t{font-weight:600}
.glosshead .n{flex:none;font-size:.8125rem;color:var(--ink-3);padding-top:3px;white-space:nowrap}
.glosspanel{padding:0 0 var(--s6) calc(1.75rem + var(--s3))}
.glosspanel p{margin:0 0 var(--s4);font-size:1rem;line-height:1.65;max-width:38ch;color:var(--ink)}
.glosspanel ul{margin:0 0 var(--s4);padding:0;list-style:none}
.glosspanel ul li{font-size:.9375rem;line-height:1.6;padding:6px 0 6px 16px;position:relative;color:var(--ink-2)}
.glosspanel ul li::before{content:"";position:absolute;left:0;top:.85em;width:6px;height:1px;background:var(--edge)}
.glosspanel ul li .es{color:var(--ink)}
.glosspanel .variant{border-left:1.5px solid var(--rule-2);padding:4px 0 4px var(--s3);margin:0 0 var(--s4)}
.glosspanel .variant .vlbl{font-size:.8125rem;color:var(--ink-3);margin-bottom:6px}
.glosspanel .variant p{font-size:.9375rem;line-height:1.6;color:var(--ink-2);margin:0;max-width:36ch}
.glosspanel .where{font-size:.8125rem;line-height:1.6;color:var(--ink-3);margin:0 0 var(--s3);max-width:38ch}
.practicerow{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s4);padding-top:var(--s1)}
.gpractice{padding:12px 0;min-height:48px}

/* ---- summary ---- */
.summary-line{font-size:1.375rem;line-height:1.35;font-weight:600;letter-spacing:-.012em;margin:var(--s4) 0 var(--s5)}
.summary-line .miss{color:var(--flag)}
.summary .donenote{font-size:.875rem;line-height:1.5;color:var(--ink-3);margin:0 0 var(--s4)}
.trackrow{display:flex;justify-content:space-between;font-size:.9375rem;padding:14px 0;border-top:1px solid var(--rule)}
.tracks{border-bottom:1px solid var(--rule)}
.trackrow .l{color:var(--ink-2)}

/* ---- backup ---- */
.backup-list{margin:0}
.backup-row{border-top:1px solid var(--rule);padding:var(--s5) 0}
.backup-list .backup-row:first-child{border-top:0;padding-top:var(--s3)}
.backup-row .lbl{font-size:.8125rem;color:var(--ink-3);margin-bottom:8px}
.backup-row p{margin:0 0 var(--s4);font-size:.9375rem;line-height:1.55;color:var(--ink-2);max-width:38ch}
.filerow{
  appearance:none;background:transparent;border:1.5px solid var(--edge);border-radius:3px;color:var(--ink);
  padding:12px 16px;min-height:48px;font-size:.875rem;cursor:pointer;font-family:var(--sans);
}
.radiorow{
  display:flex;align-items:flex-start;gap:var(--s2);padding:12px 0;min-height:48px;
  cursor:pointer;font-size:.9375rem;line-height:1.5;color:var(--ink);
}
.radiorow input{margin-top:.3rem;flex:none;width:1.1rem;height:1.1rem;accent-color:var(--ink)}
.radiorow b{font-weight:600}
.radiorow.confirm{color:var(--flag)}
.backup-msg{margin-top:var(--s4);padding-left:var(--s3);font-size:.9375rem;line-height:1.55;border-left:1.5px solid var(--edge);color:var(--ink)}
.backup-msg.err{border-left-color:var(--flag);color:var(--flag)}
</style>
</head>

<script id="pack-data" type="application/json">{"course":"Complete Spanish","packs":[{"id":"t2","label":"Track 2","tracks":[2],"rules":[{"id":"t2__spanish-vowels","family":"spanish-vowels","title":"Five vowels, five fixed sounds","explanation":"a, e, i, o, u are always /ah/, /eh/, /ee/, /oh/, /oo/ in Spanish - no exceptions, unlike English's many vowel sounds. Pronounce a word exactly as it's spelled, vowel by vowel, and you get a correct Spanish accent.","examples":["a like apple's 'ah', not its many English sounds","i always like ink, never like English 'eye'","natural -> na-tu-RAL, each vowel fixed"],"track":2},{"id":"t2__no-negation","family":"no-negation","title":"no = not/don't, placed before the verb","explanation":"The same word no means both 'no' and 'not/don't' in Spanish. To negate, just put it right before es (or later, before any verb).","examples":["no es normal - it's not normal","no es ideal - it's not ideal"],"track":2},{"id":"t2__al-adjectives","family":"al-adjectives","title":"-al words convert directly, stress moves to the end","explanation":"English words ending -al are Latin and usually work unchanged in Spanish - same spelling, but the stress moves to the last syllable. normal (NORmal in English) becomes norMAL in Spanish.","examples":["normal -> normal (norMAL)","legal -> legal","natural -> natural"],"track":2},{"id":"t2__es-bundle","family":"es-bundle","title":"es = is / it is / she is / he is / you (formal) are","explanation":"One small word, es, covers is and several subjects at once. You only add a separate word for he/she/you if you want to clarify or emphasize - otherwise es alone is enough.","examples":["es normal - it's normal / he's normal / she's normal","es legal - it is legal"],"track":2},{"id":"t2__guess-vocabulary","family":"guess-vocabulary","title":"Guess vocabulary, never guess structure","explanation":"There are two different things going on in a sentence: the words, and the way they're put together. With a word you don't know, have a go - say it the Spanish way and see if it lands, because being corrected teaches you the word on the spot. With structure, never guess: take your time and build it from the rules you have.","examples":["verbal -> verbo? - try it, and a Spanish speaker hands you the word","but no es normal is built, not guessed"],"track":2}],"drills":[{"id":"t2-01","type":"word","prompt":"normal","answer":"Normal","steps":["same spelling, but the stress moves to the end: norMAL"],"rules":["t2__al-adjectives"],"track":2,"source":"track"},{"id":"t2-02","type":"word","prompt":"legal","answer":"Legal","steps":["stress on the end: leGAL"],"rules":["t2__al-adjectives"],"track":2,"source":"track"},{"id":"t2-03","type":"sentence","prompt":"It is legal.","answer":"Es legal.","steps":["it is: es","legal: legal"],"rules":["t2__es-bundle"],"track":2,"source":"track"},{"id":"t2-04","type":"word","prompt":"illegal","answer":"Ilegal","steps":["i like ink, e like elephant - pronounce each vowel as it's written"],"rules":["t2__al-adjectives","t2__spanish-vowels"],"track":2,"source":"track"},{"id":"t2-05","type":"sentence","prompt":"It is illegal.","answer":"Es ilegal.","steps":["it is: es","illegal: ilegal"],"rules":["t2__es-bundle"],"track":2,"source":"track"},{"id":"t2-06","type":"sentence","prompt":"He is liberal.","answer":"Es liberal.","steps":["no separate word for he needed if you know who you mean: es liberal"],"rules":["t2__al-adjectives","t2__es-bundle"],"track":2,"source":"track"},{"id":"t2-07","type":"word","prompt":"natural","answer":"Natural","steps":["a like /ah/, u like /oo/, stress on the end: natuRAL"],"rules":["t2__al-adjectives","t2__spanish-vowels"],"track":2,"source":"track"},{"id":"t2-08","type":"sentence","prompt":"It is not normal.","answer":"No es normal.","steps":["not: no, right before es","put it together: no es normal"],"rules":["t2__no-negation","t2__es-bundle"],"track":2,"source":"track"},{"id":"t2-09","type":"word","prompt":"ideal","answer":"Ideal","steps":["i like ink, e like elephant, a like apple: ideal"],"rules":["t2__al-adjectives","t2__spanish-vowels"],"track":2,"source":"track"},{"id":"t2-10","type":"sentence","prompt":"It's not ideal.","answer":"No es ideal.","steps":["not: no, right before es","put it together: no es ideal"],"rules":["t2__no-negation","t2__es-bundle"],"track":2,"source":"track"},{"id":"t2-12","type":"word","prompt":"annual","answer":"Anual","steps":["cut the y-sound English adds - just one n: anual"],"rules":["t2__al-adjectives"],"track":2,"source":"track"},{"id":"t2-13","type":"word","prompt":"verb","answer":"Verbo","steps":["no conversion rule covers this one","you know verbal, so have a go: verbo - and if it's wrong someone will hand you the right word"],"rules":["t2__guess-vocabulary"],"track":2,"source":"track","note":"Guessing is fine for a word. It is never fine for the structure around it."},{"id":"t2-x01","type":"word","prompt":"total","answer":"Total","steps":["stress on the end: toTAL"],"rules":["t2__al-adjectives"],"track":2,"source":"extension","difficulty":1},{"id":"t2-x04","type":"word","prompt":"festival","answer":"Festival","steps":["stress on the end: festiVAL"],"rules":["t2__al-adjectives"],"track":2,"source":"extension","difficulty":1},{"id":"t2-x02","type":"sentence","prompt":"It is not legal.","answer":"No es legal.","steps":["not: no, right before es","put it together: no es legal"],"rules":["t2__no-negation","t2__al-adjectives"],"track":2,"source":"extension","difficulty":1},{"id":"t2-x03","type":"sentence","prompt":"He is not liberal.","answer":"No es liberal.","steps":["not: no, right before es","put it together: no es liberal"],"rules":["t2__no-negation","t2__es-bundle","t2__al-adjectives"],"track":2,"source":"extension","difficulty":2},{"id":"t2-x05","type":"sentence","prompt":"It is not natural, it is not ideal.","answer":"No es natural, no es ideal.","steps":["first half: no es natural","second half, same build: no es ideal"],"rules":["t2__no-negation","t2__al-adjectives","t2__es-bundle"],"track":2,"source":"extension","difficulty":3}],"blurb":"Convertible -al words, Spanish vowel sounds, and the verb es","sectionIndex":1},{"id":"t3","label":"Track 3","tracks":[3],"rules":[{"id":"t3__mente-adverb","family":"mente-adverb","title":"-mente on the end = -ly","explanation":"Add -mente to an adjective to get its adverb, same job as English -ly. It's written as one word.","examples":["constante -> constantemente - constantly","legal -> legalmente - legally","normal -> normalmente - normally (also used like 'usually')"],"track":3},{"id":"t3__j-sound-kh","family":"j-sound-kh","title":"An English /j/ sound becomes /kh/ in Spanish","explanation":"This is about the SOUND, not the letter g - when a convertible word has an English /j/ sound, Spanish makes a throat-friction /kh/ sound instead (as in Argentina). Not every g does this.","examples":["general -> general (throat /kh/ sound)","original -> original","global -> global (this g stays a hard g, it's not a /j/ sound in English either)"],"track":3},{"id":"t3__ente-adjectives","family":"ente-adjectives","title":"-ant/-ent words: just add an e","explanation":"English words ending -ant or -ent usually convert by adding an e on the end - no other change needed.","examples":["important -> importante","different -> diferente","constant -> constante"],"track":3},{"id":"t3__ible-able-adjectives","family":"ible-able-adjectives","title":"-ible/-able words convert directly, accent second-from-end","explanation":"English words ending -ible or -able usually work unchanged in Spanish. Say them syllable by syllable with the accent on the second-to-last syllable.","examples":["possible -> posible","probable -> probable","flexible -> flexible"],"track":3},{"id":"t3__no-negation","family":"no-negation","title":"no = not/don't, placed before the verb","explanation":"The same word no means both 'no' and 'not/don't' in Spanish. To negate, just put it right before es (or later, before any verb).","examples":["no es normal - it's not normal","no es ideal - it's not ideal"],"track":2},{"id":"t3__es-bundle","family":"es-bundle","title":"es = is / it is / she is / he is / you (formal) are","explanation":"One small word, es, covers is and several subjects at once. You only add a separate word for he/she/you if you want to clarify or emphasize - otherwise es alone is enough.","examples":["es normal - it's normal / he's normal / she's normal","es legal - it is legal"],"track":2}],"drills":[{"id":"t3-01","type":"sentence","prompt":"It is important.","answer":"Es importante.","steps":["important: importante (add e)","put it together: es importante"],"rules":["t3__ente-adjectives","t3__es-bundle"],"track":3,"source":"track"},{"id":"t3-02","type":"sentence","prompt":"It's not important.","answer":"No es importante.","steps":["not: no, right before es","put it together: no es importante"],"rules":["t3__ente-adjectives","t3__no-negation"],"track":3,"source":"track"},{"id":"t3-03","type":"word","prompt":"different","answer":"Diferente","steps":["add e: diferente"],"rules":["t3__ente-adjectives"],"track":3,"source":"track"},{"id":"t3-04","type":"sentence","prompt":"It's not different.","answer":"No es diferente.","steps":["not: no, right before es","put it together: no es diferente"],"rules":["t3__ente-adjectives","t3__no-negation"],"track":3,"source":"track"},{"id":"t3-05","type":"word","prompt":"constant","answer":"Constante","steps":["add e: constante"],"rules":["t3__ente-adjectives"],"track":3,"source":"track"},{"id":"t3-06","type":"word","prompt":"constantly","answer":"Constantemente","steps":["constante + mente, one word: constantemente"],"rules":["t3__mente-adverb"],"track":3,"source":"track"},{"id":"t3-07","type":"word","prompt":"legally","answer":"Legalmente","steps":["legal + mente: legalmente"],"rules":["t3__mente-adverb"],"track":3,"source":"track"},{"id":"t3-08","type":"word","prompt":"really","answer":"Realmente","steps":["real + mente: realmente"],"rules":["t3__mente-adverb"],"track":3,"source":"track","note":"real also means royal - Real Madrid is Royal Madrid."},{"id":"t3-09","type":"sentence","prompt":"Normally, it's important.","answer":"Normalmente es importante.","steps":["normally: normalmente","it's important: es importante"],"rules":["t3__mente-adverb","t3__es-bundle"],"track":3,"source":"track","note":"normalmente is also used like 'usually'."},{"id":"t3-10","type":"word","prompt":"general","answer":"General","steps":["the /j/ sound becomes a throat /kh/ sound - think of Argentina"],"rules":["t3__j-sound-kh"],"track":3,"source":"track"},{"id":"t3-11","type":"word","prompt":"generally","answer":"Generalmente","steps":["general + mente: generalmente"],"rules":["t3__j-sound-kh","t3__mente-adverb"],"track":3,"source":"track"},{"id":"t3-12","type":"word","prompt":"possible","answer":"Posible","steps":["syllable by syllable, accent second-from-end: posible"],"rules":["t3__ible-able-adjectives"],"track":3,"source":"track"},{"id":"t3-13","type":"word","prompt":"probably","answer":"Probablemente","steps":["probable + mente: probablemente"],"rules":["t3__ible-able-adjectives","t3__mente-adverb"],"track":3,"source":"track"},{"id":"t3-14","type":"sentence","prompt":"Possibly, it's original.","answer":"Posiblemente es original.","steps":["possibly: posiblemente","it's original: es original"],"rules":["t3__ible-able-adjectives","t3__mente-adverb","t3__j-sound-kh","t3__es-bundle"],"track":3,"source":"track"},{"id":"t3-x01","type":"word","prompt":"flexible","answer":"Flexible","steps":["syllable by syllable: flexible"],"rules":["t3__ible-able-adjectives"],"track":3,"source":"extension","difficulty":1},{"id":"t3-x02","type":"word","prompt":"originally","answer":"Originalmente","steps":["original + mente: originalmente"],"rules":["t3__j-sound-kh","t3__mente-adverb"],"track":3,"source":"extension","difficulty":1},{"id":"t3-x03","type":"sentence","prompt":"It's not constant.","answer":"No es constante.","steps":["constant: constante (add an e)","put it together: no es constante"],"rules":["t3__ente-adjectives","t3__no-negation"],"track":3,"source":"extension","difficulty":2},{"id":"t3-x04","type":"sentence","prompt":"It's not possible.","answer":"No es posible.","steps":["possible: posible (one s in Spanish)","put it together: no es posible"],"rules":["t3__ible-able-adjectives","t3__no-negation"],"track":3,"source":"extension","difficulty":2},{"id":"t3-x05","type":"sentence","prompt":"Normally, it's not possible.","answer":"Normalmente no es posible.","steps":["normally: normalmente","it's not possible: no es posible"],"rules":["t3__mente-adverb","t3__ible-able-adjectives","t3__no-negation"],"track":3,"source":"extension","difficulty":3}],"blurb":"Converting -ant/-ent, -mente adverbs, and -ible/-able words","sectionIndex":1},{"id":"t4","label":"Track 4","tracks":[4],"rules":[{"id":"t4__ion-conversion","family":"ion-conversion","title":"-ion words are the same, accent on the end; -tion becomes -ción","explanation":"English words ending -ion work unchanged in Spanish with the accent moved to the end. If the English word ends specifically -tion, spell it -ción in Spanish (pronounced like -see-ón, or -thee-ón in most of Spain).","examples":["opinion -> opinión","passion -> pasión","preparation -> preparación","organization -> organización"],"track":4},{"id":"t4__ación-to-ar-verb","family":"ación-to-ar-verb","title":"Drop -ción, add -r, and you have the verb","explanation":"Take any word ending -ación, remove -ción, and add -r: that's the Spanish verb. This single move hands you roughly a thousand verbs for free.","examples":["preparación -> preparar - to prepare","confirmación -> confirmar - to confirm","cancelación -> cancelar - to cancel"],"track":4},{"id":"t4__quiero-i-want","family":"quiero-i-want","title":"quiero = I want (no separate word for I needed)","explanation":"quiero by itself already means I want - the ending carries the 'I'. It's the same word inside te quiero (I want you / I love you) minus the te.","examples":["quiero - I want","no quiero - I don't want"],"track":4},{"id":"t4__me-reflexive","family":"me-reflexive","title":"Myself uses the same word as me","explanation":"Spanish doesn't need a separate word for myself - it reuses me, attached to the end of the verb's 'to' form.","examples":["prepararme - to prepare myself","quiero prepararme - I want to prepare myself / get ready"],"track":4},{"id":"t4__mente-adverb","family":"mente-adverb","title":"-mente on the end = -ly","explanation":"Add -mente to an adjective to get its adverb, same job as English -ly. It's written as one word.","examples":["constante -> constantemente - constantly","legal -> legalmente - legally","normal -> normalmente - normally (also used like 'usually')"],"track":3},{"id":"t4__ente-adjectives","family":"ente-adjectives","title":"-ant/-ent words: just add an e","explanation":"English words ending -ant or -ent usually convert by adding an e on the end - no other change needed.","examples":["important -> importante","different -> diferente","constant -> constante"],"track":3},{"id":"t4__no-negation","family":"no-negation","title":"no = not/don't, placed before the verb","explanation":"The same word no means both 'no' and 'not/don't' in Spanish. To negate, just put it right before es (or later, before any verb).","examples":["no es normal - it's not normal","no es ideal - it's not ideal"],"track":2}],"drills":[{"id":"t4-01","type":"word","prompt":"urgent","answer":"Urgente","steps":["add e: urgente"],"rules":["t4__ente-adjectives"],"track":4,"source":"track"},{"id":"t4-02","type":"word","prompt":"urgently","answer":"Urgentemente","steps":["urgente + mente: urgentemente"],"rules":["t4__ente-adjectives","t4__mente-adverb"],"track":4,"source":"track"},{"id":"t4-03","type":"sentence","prompt":"I want.","answer":"Quiero.","steps":["from te quiero - I want you - drop the te: quiero"],"rules":["t4__quiero-i-want"],"track":4,"source":"track"},{"id":"t4-04","type":"sentence","prompt":"I don't want.","answer":"No quiero.","steps":["no before: no quiero"],"rules":["t4__quiero-i-want","t4__no-negation"],"track":4,"source":"track"},{"id":"t4-05","type":"word","prompt":"opinion","answer":"Opinión","steps":["same word, accent on the end: opinión"],"rules":["t4__ion-conversion"],"track":4,"source":"track"},{"id":"t4-06","type":"word","prompt":"preparation","answer":"Preparación","steps":["-tion becomes -ción: preparación"],"rules":["t4__ion-conversion"],"track":4,"source":"track"},{"id":"t4-07","type":"word","prompt":"organization","answer":"Organización","steps":["-tion becomes -ción, z sounds like s or /th/: organización"],"rules":["t4__ion-conversion"],"track":4,"source":"track"},{"id":"t4-08","type":"word","prompt":"confirmation","answer":"Confirmación","steps":["-tion becomes -ción: confirmación"],"rules":["t4__ion-conversion"],"track":4,"source":"track","note":"Literally 'with signature' - con (with) + firma (signature)."},{"id":"t4-09","type":"word","prompt":"to prepare","answer":"Preparar","steps":["preparación, drop -ción, add -r: preparar"],"rules":["t4__ación-to-ar-verb"],"track":4,"source":"track"},{"id":"t4-10","type":"word","prompt":"to confirm","answer":"Confirmar","steps":["confirmación, drop -ción, add -r: confirmar"],"rules":["t4__ación-to-ar-verb"],"track":4,"source":"track"},{"id":"t4-11","type":"word","prompt":"to sign","answer":"Firmar","steps":["confirmar is con + firmar, with-signing","so signing itself is firmar"],"rules":["t4__ación-to-ar-verb"],"track":4,"source":"track"},{"id":"t4-12","type":"sentence","prompt":"I want to prepare.","answer":"Quiero preparar.","steps":["I want: quiero","to prepare: preparar"],"rules":["t4__quiero-i-want"],"track":4,"source":"track"},{"id":"t4-13","type":"word","prompt":"to cancel","answer":"Cancelar","steps":["cancelación, drop -ción, add -r: cancelar"],"rules":["t4__ación-to-ar-verb"],"track":4,"source":"track"},{"id":"t4-14","type":"sentence","prompt":"I don't want to cancel.","answer":"No quiero cancelar.","steps":["not: no, right before quiero","put it together: no quiero cancelar"],"rules":["t4__quiero-i-want","t4__no-negation"],"track":4,"source":"track"},{"id":"t4-15","type":"sentence","prompt":"I want to prepare myself.","answer":"Quiero prepararme.","steps":["myself: me, same word as me, attached to the end: prepararme"],"rules":["t4__me-reflexive"],"track":4,"source":"track"},{"id":"t4-x01","type":"word","prompt":"to explore","answer":"Explorar","steps":["exploración, drop -ción, add -r: explorar"],"rules":["t4__ación-to-ar-verb"],"track":4,"source":"extension","difficulty":1},{"id":"t4-x02","type":"sentence","prompt":"I want to explore.","answer":"Quiero explorar.","steps":["exploración, drop -ción, add -r: explorar","put it together: quiero explorar"],"rules":["t4__quiero-i-want"],"track":4,"source":"extension","difficulty":1},{"id":"t4-x03","type":"sentence","prompt":"I want to cooperate.","answer":"Quiero cooperar.","steps":["cooperación, drop -ción, add -r: cooperar","put it together: quiero cooperar"],"rules":["t4__quiero-i-want","t4__ación-to-ar-verb"],"track":4,"source":"extension","difficulty":2},{"id":"t4-x04","type":"sentence","prompt":"I don't want to prepare myself.","answer":"No quiero prepararme.","steps":["myself: me on the end of the 'to' form: prepararme","put it together: no quiero prepararme"],"rules":["t4__quiero-i-want","t4__no-negation","t4__me-reflexive"],"track":4,"source":"extension","difficulty":2},{"id":"t4-x05","type":"sentence","prompt":"I don't want to confirm, I want to cancel.","answer":"No quiero confirmar, quiero cancelar.","steps":["first half: no quiero confirmar","second half: quiero cancelar"],"rules":["t4__quiero-i-want","t4__no-negation","t4__ación-to-ar-verb"],"track":4,"source":"extension","difficulty":3}],"blurb":"Converting -ion/-cion nouns into -ar verbs, quiero, and me","sectionIndex":1},{"id":"t5","label":"Track 5","tracks":[5],"rules":[{"id":"t5__yo-emphatic","family":"yo-emphatic","title":"yo (I) - only for emphasis","explanation":"Since quiero already means I want, yo is optional and only added for emphasis. With negation, yo goes in the same place English puts I: before no.","examples":["yo quiero - I want (emphatic)","yo no quiero - I don't want (emphatic)"],"track":5},{"id":"t5__te-informal-you","family":"te-informal-you","title":"te = informal you","explanation":"te is the informal you, the same word from te quiero (I want you / I love you). It attaches to the end of the verb's 'to' form, just like me.","examples":["obligarte - to oblige you (informal)","no quiero obligarte - I don't want to oblige you"],"track":5},{"id":"t5__encia-ancia","family":"encia-ancia","title":"-ence/-ance becomes -encia/-ancia","explanation":"English words ending -ence or -ance convert by changing that ending to -encia or -ancia.","examples":["experience -> experiencia","difference -> diferencia","influence -> influencia"],"track":5},{"id":"t5__lo-object-it-him","family":"lo-object-it-him","title":"lo = it / him","explanation":"lo stands in for it or him and attaches to the end of the verb's 'to' form, same position as me and te.","examples":["cancelarlo - to cancel it","quiero cancelarlo - I want to cancel it","quiero salvarlo - I want to save him"],"track":5},{"id":"t5__me-reflexive","family":"me-reflexive","title":"Myself uses the same word as me","explanation":"Spanish doesn't need a separate word for myself - it reuses me, attached to the end of the verb's 'to' form.","examples":["prepararme - to prepare myself","quiero prepararme - I want to prepare myself / get ready"],"track":4},{"id":"t5__quiero-i-want","family":"quiero-i-want","title":"quiero = I want (no separate word for I needed)","explanation":"quiero by itself already means I want - the ending carries the 'I'. It's the same word inside te quiero (I want you / I love you) minus the te.","examples":["quiero - I want","no quiero - I don't want"],"track":4},{"id":"t5__ion-conversion","family":"ion-conversion","title":"-ion words are the same, accent on the end; -tion becomes -ción","explanation":"English words ending -ion work unchanged in Spanish with the accent moved to the end. If the English word ends specifically -tion, spell it -ción in Spanish (pronounced like -see-ón, or -thee-ón in most of Spain).","examples":["opinion -> opinión","passion -> pasión","preparation -> preparación","organization -> organización"],"track":4},{"id":"t5__ación-to-ar-verb","family":"ación-to-ar-verb","title":"Drop -ción, add -r, and you have the verb","explanation":"Take any word ending -ación, remove -ción, and add -r: that's the Spanish verb. This single move hands you roughly a thousand verbs for free.","examples":["preparación -> preparar - to prepare","confirmación -> confirmar - to confirm","cancelación -> cancelar - to cancel"],"track":4},{"id":"t5__no-negation","family":"no-negation","title":"no = not/don't, placed before the verb","explanation":"The same word no means both 'no' and 'not/don't' in Spanish. To negate, just put it right before es (or later, before any verb).","examples":["no es normal - it's not normal","no es ideal - it's not ideal"],"track":2}],"drills":[{"id":"t5-01","type":"sentence","prompt":"I want. (emphatic)","answer":"Yo quiero.","steps":["emphatic, so add the word for I: yo quiero"],"rules":["t5__yo-emphatic"],"track":5,"source":"track"},{"id":"t5-02","type":"sentence","prompt":"I don't want. (emphatic)","answer":"Yo no quiero.","steps":["same order as English: yo no quiero"],"rules":["t5__yo-emphatic","t5__no-negation"],"track":5,"source":"track"},{"id":"t5-03","type":"sentence","prompt":"I don't want to cancel. (emphatic)","answer":"Yo no quiero cancelar.","steps":["emphatic, so yo goes where English puts I, before no: yo no quiero cancelar"],"rules":["t5__yo-emphatic"],"track":5,"source":"track"},{"id":"t5-04","type":"word","prompt":"celebration","answer":"Celebración","steps":["-tion becomes -ción: celebración"],"rules":["t5__ion-conversion"],"track":5,"source":"track"},{"id":"t5-05","type":"word","prompt":"to celebrate","answer":"Celebrar","steps":["celebración, drop -ción, add -r: celebrar"],"rules":["t5__ación-to-ar-verb"],"track":5,"source":"track"},{"id":"t5-06","type":"sentence","prompt":"I want to celebrate.","answer":"Quiero celebrar.","steps":["the verb behind celebración: celebrar, straight after quiero"],"rules":["t5__quiero-i-want"],"track":5,"source":"track"},{"id":"t5-07","type":"sentence","prompt":"I want to find out.","answer":"Quiero informarme.","steps":["literally 'I want to inform myself': quiero informarme"],"rules":["t5__me-reflexive"],"track":5,"source":"track"},{"id":"t5-08","type":"sentence","prompt":"I don't want to oblige you. (informal)","answer":"No quiero obligarte.","steps":["take the long route: obligation -> obligación -> obligar","you (informal), attached: obligarte"],"rules":["t5__te-informal-you"],"track":5,"source":"track"},{"id":"t5-09","type":"sentence","prompt":"I don't want to provoke you. (informal)","answer":"No quiero provocarte.","steps":["provocación -> provocar","you (informal), attached: provocarte"],"rules":["t5__te-informal-you"],"track":5,"source":"track"},{"id":"t5-10","type":"sentence","prompt":"I want to cancel it.","answer":"Quiero cancelarlo.","steps":["it, attached: cancelarlo"],"rules":["t5__lo-object-it-him"],"track":5,"source":"track"},{"id":"t5-11","type":"sentence","prompt":"I want to regulate it.","answer":"Quiero regularlo.","steps":["to regulate: regular","it, attached: regularlo"],"rules":["t5__lo-object-it-him"],"track":5,"source":"track"},{"id":"t5-12","type":"sentence","prompt":"I want to save him.","answer":"Quiero salvarlo.","steps":["salvación -> salvar, to save","him, attached: salvarlo"],"rules":["t5__lo-object-it-him"],"track":5,"source":"track"},{"id":"t5-13","type":"word","prompt":"situation","answer":"Situación","steps":["-tion becomes -ción: situación"],"rules":["t5__ion-conversion"],"track":5,"source":"track"},{"id":"t5-14","type":"word","prompt":"to participate","answer":"Participar","steps":["take it syllable by syllable: participación -> participar"],"rules":["t5__ación-to-ar-verb"],"track":5,"source":"track"},{"id":"t5-15","type":"word","prompt":"difference","answer":"Diferencia","steps":["-ence becomes -encia: diferencia"],"rules":["t5__encia-ancia"],"track":5,"source":"track"},{"id":"t5-x01","type":"word","prompt":"existence","answer":"Existencia","steps":["-ence becomes -encia: existencia"],"rules":["t5__encia-ancia"],"track":5,"source":"extension","difficulty":1},{"id":"t5-x02","type":"sentence","prompt":"I want to celebrate it.","answer":"Quiero celebrarlo.","steps":["it, attached: celebrarlo"],"rules":["t5__lo-object-it-him"],"track":5,"source":"extension","difficulty":1},{"id":"t5-x03","type":"sentence","prompt":"I don't want to celebrate it. (emphatic)","answer":"Yo no quiero celebrarlo.","steps":["emphatic yo before no, and it on the end of the 'to' form: yo no quiero celebrarlo"],"rules":["t5__yo-emphatic","t5__lo-object-it-him"],"track":5,"source":"extension","difficulty":2},{"id":"t5-x04","type":"sentence","prompt":"I don't want to oblige him.","answer":"No quiero obligarlo.","steps":["obligarlo - same verb as obligarte, swap te for lo"],"rules":["t5__lo-object-it-him","t5__no-negation"],"track":5,"source":"extension","difficulty":2},{"id":"t5-x05","type":"sentence","prompt":"I don't want to inform myself, I want to celebrate.","answer":"No quiero informarme, quiero celebrar.","steps":["first half: no quiero informarme","second half: quiero celebrar"],"rules":["t5__me-reflexive","t5__quiero-i-want"],"track":5,"source":"extension","difficulty":3}],"blurb":"The pronoun yo, rolling r vs single r, and -ence/-ance to -encia","sectionIndex":1},{"id":"t6","label":"Track 6","tracks":[6],"rules":[{"id":"t6__soft-b-v","family":"soft-b-v","title":"v sounds like a soft b","explanation":"Spanish v is usually a soft, non-plosive b - not the hard English b (as in bucket, where a burst of air shoots out) and not an English v either. It shifts more toward an English /v/ in places like Argentina and Chile, but soft b is the safe default. voy (I go / I'm going) is easiest to remember through the word voyage.","examples":["voy (I go) - like 'boy' with a soft b","visitar (to visit) - soft-b vi-sitar","visible - keep the s soft too, not vi-zi-ble"],"track":6},{"id":"t6__silent-h","family":"silent-h","title":"Silent h (except ch)","explanation":"In Spanish h is never pronounced - imagine the word begins with the vowel or letter right after it. The one exception is ch, which sounds like the English /ch/. So hospital sounds like it starts with an o, and habitual like it starts with an a.","examples":["hospital -> sounds like ospital","horrible -> sounds like orrible","habitual -> sounds like abitual"],"track":6},{"id":"t6__lo-object-it-him","family":"lo-object-it-him","title":"lo = it / him","explanation":"lo stands in for it or him and attaches to the end of the verb's 'to' form, same position as me and te.","examples":["cancelarlo - to cancel it","quiero cancelarlo - I want to cancel it","quiero salvarlo - I want to save him"],"track":5}],"drills":[{"id":"t6-01","type":"sentence","prompt":"I am trying to publish it.","answer":"Intento publicarlo.","steps":["I try / I am trying: intento (related to intención, but there's no straight rule here since it doesn't end in -ación)","to publish: publicar","it, attached to the end: publicarlo"],"rules":["t6__lo-object-it-him"],"track":6,"source":"track"},{"id":"t6-02","type":"sentence","prompt":"I am trying to imitate him.","answer":"Intento imitarlo.","steps":["I am trying: intento","to imitate: imitar, from imitación (drop -ción, add -r)","him, attached to the end: imitarlo"],"rules":["t6__lo-object-it-him"],"track":6,"source":"track"},{"id":"t6-03","type":"word","prompt":"hospital","answer":"Hospital","steps":["same spelling as English, but the h is silent - think of it as starting with o"],"rules":["t6__silent-h"],"track":6,"source":"track"},{"id":"t6-04","type":"word","prompt":"horrible","answer":"Horrible","steps":["h is silent, think of it as starting with o","the double r inside the word gets a rolled/harder r - but a single r will still be understood"],"rules":["t6__silent-h"],"track":6,"source":"track"},{"id":"t6-05","type":"word","prompt":"habitually","answer":"Habitualmente","steps":["habitual: habitual (silent h)","add -mente for the adverb: habitualmente"],"rules":["t6__silent-h"],"track":6,"source":"track"},{"id":"t6-06","type":"sentence","prompt":"I want to cancel it, but I don't want to cancel it now.","answer":"Quiero cancelarlo, pero no quiero cancelarlo ahora.","steps":["I want: quiero","to cancel it: cancelarlo","but: pero","I don't want: no quiero","to cancel it: cancelarlo","now: ahora (from a + hora, literally 'to the hour')"],"rules":["t6__lo-object-it-him"],"track":6,"source":"track"},{"id":"t6-07","type":"word","prompt":"I am going / I go","answer":"Voy","steps":["voy, spelled v-o-y - remember it through voyage, and pronounce the v as a soft b"],"rules":["t6__soft-b-v"],"track":6,"source":"track"},{"id":"t6-08","type":"sentence","prompt":"I am not going now.","answer":"No voy ahora.","steps":["I am not going: no voy","now: ahora"],"rules":["t6__soft-b-v"],"track":6,"source":"track"},{"id":"t6-09","type":"word","prompt":"to visit","answer":"Visitar","steps":["think of visitation (visitation rights) - visitar"],"rules":["t6__soft-b-v"],"track":6,"source":"track"},{"id":"t6-10","type":"sentence","prompt":"I want to visit him.","answer":"Quiero visitarlo.","steps":["I want: quiero","to visit him: visitarlo"],"rules":["t6__soft-b-v"],"track":6,"source":"track"},{"id":"t6-x01","type":"word","prompt":"hotel","answer":"Hotel","steps":["same spelling as English, silent h - think of it as starting with o"],"rules":["t6__silent-h"],"track":6,"source":"extension","difficulty":1},{"id":"t6-x02","type":"sentence","prompt":"I am trying to visit him.","answer":"Intento visitarlo.","steps":["I am trying: intento","to visit him: visitarlo"],"rules":["t6__soft-b-v"],"track":6,"source":"extension","difficulty":1},{"id":"t6-x03","type":"sentence","prompt":"I am not trying to cancel it now.","answer":"No intento cancelarlo ahora.","steps":["I am not trying: no intento","to cancel it: cancelarlo","now: ahora"],"rules":["t6__lo-object-it-him"],"track":6,"source":"extension","difficulty":2},{"id":"t6-x04","type":"sentence","prompt":"I am trying to visit him, but I am not going now.","answer":"Intento visitarlo, pero no voy ahora.","steps":["I am trying to visit him: intento visitarlo","but: pero","I am not going now: no voy ahora"],"rules":["t6__soft-b-v"],"track":6,"source":"extension","difficulty":3}],"blurb":"Silent h, soft b/v sound, ahora, and the irregular verb voy","sectionIndex":1},{"id":"t7","label":"Track 7","tracks":[7],"rules":[{"id":"t7__ación-to-ar-verb","family":"ación-to-ar-verb","title":"Drop -ción, add -r, and you have the verb","explanation":"Take any word ending -ación, remove -ción, and add -r: that's the Spanish verb. This single move hands you roughly a thousand verbs for free.","examples":["preparación -> preparar - to prepare","confirmación -> confirmar - to confirm","cancelación -> cancelar - to cancel"],"track":4},{"id":"t7__lo-los-plural-2","family":"lo-los-plural","title":"lo -> los for \"them\" (and lo can mean formal you)","explanation":"lo means him or it. To make it plural - them - just add an s: los. lo can also stand for formal you, the same way te stands for informal you.","examples":["lo (him/it) -> los (them)","quiero verlos - I want to see them","visitarlo - to visit him/it/formal you"],"track":7},{"id":"t7__movement-verb-a-3","family":"movement-verb-a","title":"Verbs of movement take a before an infinitive","explanation":"When a verb that carries a sense of motion - voy (I'm going), pasar (to pass by) - is followed by another verb in its 'to' form, Spanish inserts a in between to carry that feeling of movement toward the action, even when you're only using it to talk about the future rather than actually moving. Verbs without a movement sense, like quiero or intento, don't take this a.","examples":["voy a continuar - I'm going to continue","voy a confiscarlo - I'm going to confiscate it","voy a pasar a visitarte - I'm going to pass by to visit you (two verbs of movement in a row, two a's)","contrast: intento verlos (no a) vs. voy a verlos (a, because voy is a verb of movement)"],"track":7}],"drills":[{"id":"t7-01","type":"sentence","prompt":"I want to continue it.","answer":"Quiero continuarlo.","steps":["carry on / go on -> find the Latin equivalent: continue -> continuation -> continuar","I want: quiero","it, attached: continuarlo"],"rules":["t7__ación-to-ar-verb","t7__lo-los-plural-2"],"track":7,"source":"track"},{"id":"t7-02","type":"sentence","prompt":"I am trying to continue.","answer":"Intento continuar.","steps":["I am trying: intento","to continue: continuar"],"rules":["t7__ación-to-ar-verb"],"track":7,"source":"track"},{"id":"t7-03","type":"word","prompt":"to demonstrate","answer":"Demostrar","steps":["from demostración (demonstration) - notice Spanish drops the n that English has before -tion","drop -ción, add -r: demostrar"],"rules":["t7__ación-to-ar-verb"],"track":7,"source":"track"},{"id":"t7-04","type":"word","prompt":"to show","answer":"Mostrar","steps":["drop the de- prefix from demostrar: mostrar"],"rules":["t7__ación-to-ar-verb"],"track":7,"source":"track"},{"id":"t7-05","type":"sentence","prompt":"I want to show you something. (informal)","answer":"Quiero mostrarte algo.","steps":["I want: quiero","to show you: mostrarte (te = informal you)","something: algo"],"rules":["t7__ación-to-ar-verb"],"track":7,"source":"track"},{"id":"t7-06","type":"sentence","prompt":"I am going to confiscate it.","answer":"Voy a confiscarlo.","steps":["I am going: voy","voy is a verb of movement, so it takes a before the next verb's 'to' form: voy a","to confiscate it: confiscarlo"],"rules":["t7__movement-verb-a-3"],"track":7,"source":"track"},{"id":"t7-07","type":"sentence","prompt":"I am going to examine it.","answer":"Voy a examinarlo.","steps":["I am going to: voy a","to examine it: examinarlo"],"rules":["t7__movement-verb-a-3"],"track":7,"source":"track"},{"id":"t7-08","type":"word","prompt":"them","answer":"Los","steps":["lo means him/it - add an s to make it plural: los"],"rules":["t7__lo-los-plural-2"],"track":7,"source":"track"},{"id":"t7-09","type":"sentence","prompt":"I want to see them.","answer":"Quiero verlos.","steps":["to see: ver (compare to English 'view')","I want to see: quiero ver","them, attached: verlos - no a here, quiero isn't a verb of movement"],"rules":["t7__lo-los-plural-2"],"track":7,"source":"track"},{"id":"t7-10","type":"sentence","prompt":"I am trying to see them.","answer":"Intento verlos.","steps":["I am trying: intento","to see them: verlos","no a - intento isn't a verb of movement"],"rules":["t7__lo-los-plural-2"],"track":7,"source":"track"},{"id":"t7-11","type":"sentence","prompt":"I am going to try to see them.","answer":"Voy a intentar verlos.","steps":["I am going to try: voy a intentar (a appears after voy, a verb of movement)","to see them: verlos - no extra a here, intentar isn't a verb of movement"],"rules":["t7__movement-verb-a-3","t7__lo-los-plural-2"],"track":7,"source":"track"},{"id":"t7-12","type":"sentence","prompt":"I am going to pass by to visit you. (informal)","answer":"Voy a pasar a visitarte.","steps":["I am going: voy","to pass by: a pasar (a after voy, a verb of movement)","pasar is itself a verb of movement, so another a: a visitarte","to visit you (informal): visitarte"],"rules":["t7__movement-verb-a-3"],"track":7,"source":"track"},{"id":"t7-13","type":"sentence","prompt":"I am going to try to pass by to visit you. (informal)","answer":"Voy a intentar pasar a visitarte.","steps":["I am going to try: voy a intentar (a after voy)","to pass by: pasar - no extra a after intentar, it isn't a verb of movement","pasar is a verb of movement, so: a visitarte"],"rules":["t7__movement-verb-a-3"],"track":7,"source":"track"},{"id":"t7-14","type":"sentence","prompt":"I want to pass by to show you something. (informal)","answer":"Quiero pasar a mostrarte algo.","steps":["I want: quiero - no a after quiero, it isn't a verb of movement","to pass by: pasar","pasar is a verb of movement, so: a mostrarte algo","to show you something: mostrarte algo"],"rules":["t7__movement-verb-a-3"],"track":7,"source":"track"},{"id":"t7-x01","type":"sentence","prompt":"I am going to publish it.","answer":"Voy a publicarlo.","steps":["I am going to: voy a","to publish it: publicarlo"],"rules":["t7__movement-verb-a-3"],"track":7,"source":"extension","difficulty":1},{"id":"t7-x02","type":"sentence","prompt":"I want to see it.","answer":"Quiero verlo.","steps":["I want to see: quiero ver","it, attached: verlo"],"rules":["t7__lo-los-plural-2"],"track":7,"source":"extension","difficulty":1},{"id":"t7-x03","type":"sentence","prompt":"I am not trying to see them now.","answer":"No intento verlos ahora.","steps":["I am not trying: no intento","to see them: verlos","now: ahora"],"rules":["t7__lo-los-plural-2"],"track":7,"source":"extension","difficulty":2},{"id":"t7-x04","type":"sentence","prompt":"I am going to try to visit them.","answer":"Voy a intentar visitarlos.","steps":["I am going to try: voy a intentar","to visit them: visitarlos - no extra a, intentar isn't a verb of movement"],"rules":["t7__movement-verb-a-3","t7__lo-los-plural-2"],"track":7,"source":"extension","difficulty":2},{"id":"t7-x05","type":"sentence","prompt":"I am not going to pass by to visit you now. (informal)","answer":"No voy a pasar a visitarte ahora.","steps":["I am not going: no voy","to pass by: a pasar (a after voy)","pasar is a verb of movement too: a visitarte","now: ahora"],"rules":["t7__movement-verb-a-3"],"track":7,"source":"extension","difficulty":3}],"blurb":"Voy a plus infinitive for the future, and verbs of motion needing a","sectionIndex":1},{"id":"t8","label":"Track 8","tracks":[8],"rules":[{"id":"t8__feminine-la","family":"feminine-la","title":"la for feminine (her / it / formal you to a female)","explanation":"Change the o in lo to an a and you get la: her, it (for a feminine word), or formal you when speaking to a female. It isn't that objects have gender - words do, and a word ending in -a is usually feminine, like casa (house).","examples":["lo -> la","quiero verla - I want to see it (a feminine thing) / I want to see her","la casa - the house"],"track":8},{"id":"t8__debo-must","family":"debo-must","title":"debo (I owe) + infinitive = I must","explanation":"debo literally means I owe. Put it in front of a verb's 'to' form and it means I must / I have to - debo continuar is literally 'I owe to continue', meaning I must continue.","examples":["debo continuar - I must continue","debo identificarlo - I must identify it"],"track":8},{"id":"t8__question-by-tone-3","family":"question-by-tone","title":"Yes/no questions: same words, just ask it","explanation":"Spanish doesn't add a 'do' word to make a question. Keep the same word order as the statement and just say it with questioning intonation - in writing, wrap it in an opening and closing question mark, ¿ ?.","examples":["Quiere visitarme. -> ¿Quiere visitarme? - Does he/she/you want to visit me?","No quiere visitarme. -> ¿No quiere visitarme? - Doesn't he/she/you want to visit me?"],"track":8},{"id":"t8__third-person-bundle-2","family":"third-person-bundle","title":"One verb form covers he/she/it/formal you","explanation":"Just like es bundles it is / she is / he is / you (formal) are, quiere bundles he wants / she wants / it wants / you (formal) want. This bundling of third person with formal you runs through Spanish verbs generally, not just pronouns like lo/la.","examples":["quiere = he wants / she wants / it wants / you (formal) want","es = it is / she is / he is / you (formal) are"],"track":8},{"id":"t8__movement-verb-a","family":"movement-verb-a","title":"Verbs of movement take a before an infinitive","explanation":"When a verb that carries a sense of motion - voy (I'm going), venir (to come), pasar (to pass by) - is followed by another verb in its 'to' form, Spanish inserts a in between to carry that feeling of movement toward the action. Verbs without a movement sense, like quiero, intento or debo, don't take this a.","examples":["voy a continuar - I'm going to continue","quiere venir a visitarme - he/she/you (formal) want(s) to come to visit me","quiere venir a la casa - he/she/you (formal) want(s) to come to the house"],"track":7},{"id":"t8__lo-los-plural","family":"lo-los-plural","title":"Add s to pluralize: lo/la -> los/las (them)","explanation":"lo (him/it/formal you) and la (her/it fem./formal you to a female) both pluralize the same way - just add an s. los means them for masculine words, las means them for feminine words.","examples":["lo -> los, la -> las","debo identificarlos - I must identify them","debo identificarlas - I must identify them (feminine)"],"track":7}],"drills":[{"id":"t8-01","type":"sentence","prompt":"I want to see it. (a feminine thing, like the house)","answer":"Quiero verla.","steps":["lo becomes la for a feminine thing","I want to see it: quiero verla"],"rules":["t8__feminine-la"],"track":8,"source":"track","note":"The same sentence also means 'I want to see her.'"},{"id":"t8-02","type":"sentence","prompt":"You want to visit me. (formal)","answer":"Quiere visitarme.","steps":["he/she/it wants, or you (formal) want: quiere","to visit me: visitarme"],"rules":["t8__third-person-bundle-2"],"track":8,"source":"track"},{"id":"t8-03","type":"sentence","prompt":"Do you want to visit me? (formal)","answer":"¿Quiere visitarme?","steps":["same words as the statement, just asked: ¿Quiere visitarme?"],"rules":["t8__question-by-tone-3","t8__third-person-bundle-2"],"track":8,"source":"track"},{"id":"t8-04","type":"sentence","prompt":"Don't you want to visit me? (formal)","answer":"¿No quiere visitarme?","steps":["no goes in front just like a statement: no quiere visitarme","asked as a question: ¿No quiere visitarme?"],"rules":["t8__question-by-tone-3","t8__third-person-bundle-2"],"track":8,"source":"track"},{"id":"t8-05","type":"sentence","prompt":"Why don't you want to visit me? (formal)","answer":"¿Por qué no quiere visitarme?","steps":["why: por qué","don't you want to visit me: no quiere visitarme","asked as a question: ¿Por qué no quiere visitarme?"],"rules":["t8__question-by-tone-3","t8__third-person-bundle-2"],"track":8,"source":"track"},{"id":"t8-06","type":"word","prompt":"to come","answer":"Venir","steps":["spelled venir, but usually pronounced with a soft b: /benir/","remember it through conveniente and bienvenido (welcome, literally 'well-come')"],"rules":["t8__movement-verb-a"],"track":8,"source":"track"},{"id":"t8-07","type":"sentence","prompt":"Do you want to come? (formal)","answer":"¿Quiere venir?","steps":["you (formal) want: quiere","to come: venir","asked as a question: ¿Quiere venir?"],"rules":["t8__question-by-tone-3","t8__third-person-bundle-2"],"track":8,"source":"track"},{"id":"t8-08","type":"sentence","prompt":"Do you want to come to the house? (formal)","answer":"¿Quiere venir a la casa?","steps":["you (formal) want to come: quiere venir","venir is a verb of movement, so a before what follows: venir a","the house: la casa"],"rules":["t8__movement-verb-a","t8__feminine-la"],"track":8,"source":"track"},{"id":"t8-09","type":"sentence","prompt":"Why don't you want to come to visit me? (formal)","answer":"¿Por qué no quiere venir a visitarme?","steps":["why: por qué","don't you want: no quiere","to come: venir - a verb of movement, so a before the next verb","to visit me: a visitarme","asked as a question: ¿Por qué no quiere venir a visitarme?"],"rules":["t8__movement-verb-a","t8__question-by-tone-3","t8__third-person-bundle-2"],"track":8,"source":"track"},{"id":"t8-10","type":"word","prompt":"I owe","answer":"Debo","steps":["debo - related to the English word debt (the silent b in debt comes from here)"],"rules":["t8__debo-must"],"track":8,"source":"track"},{"id":"t8-11","type":"sentence","prompt":"I must continue.","answer":"Debo continuar.","steps":["I owe, meaning I must: debo","to continue: continuar"],"rules":["t8__debo-must"],"track":8,"source":"track"},{"id":"t8-12","type":"sentence","prompt":"I must identify it.","answer":"Debo identificarlo.","steps":["I must: debo","to identify: identificar, from identificación (drop -ción, add -r)","it, attached: identificarlo"],"rules":["t8__debo-must"],"track":8,"source":"track"},{"id":"t8-13","type":"sentence","prompt":"I must identify them.","answer":"Debo identificarlos.","steps":["I must identify: debo identificar","them: lo -> los, attached: identificarlos"],"rules":["t8__debo-must","t8__lo-los-plural"],"track":8,"source":"track"},{"id":"t8-14","type":"sentence","prompt":"I must identify them. (feminine)","answer":"Debo identificarlas.","steps":["I must identify: debo identificar","them, feminine: la -> las, attached: identificarlas"],"rules":["t8__debo-must","t8__lo-los-plural","t8__feminine-la"],"track":8,"source":"track"},{"id":"t8-x01","type":"sentence","prompt":"I want to see them. (feminine)","answer":"Quiero verlas.","steps":["I want to see: quiero ver","them, feminine, attached: verlas"],"rules":["t8__lo-los-plural","t8__feminine-la"],"track":8,"source":"extension","difficulty":1},{"id":"t8-x02","type":"sentence","prompt":"Do you want to continue? (formal)","answer":"¿Quiere continuar?","steps":["you (formal) want: quiere","to continue: continuar","asked as a question: ¿Quiere continuar?"],"rules":["t8__question-by-tone-3","t8__third-person-bundle-2"],"track":8,"source":"extension","difficulty":1},{"id":"t8-x03","type":"sentence","prompt":"I must come to visit you. (informal)","answer":"Debo venir a visitarte.","steps":["I must come: debo venir","venir is a verb of movement, so a: venir a","to visit you (informal): visitarte"],"rules":["t8__debo-must","t8__movement-verb-a"],"track":8,"source":"extension","difficulty":2},{"id":"t8-x04","type":"sentence","prompt":"Why doesn't she want to see it? (a feminine thing)","answer":"¿Por qué no quiere verla?","steps":["why: por qué","she doesn't want: no quiere","to see it (feminine): verla","asked as a question: ¿Por qué no quiere verla?"],"rules":["t8__question-by-tone-3","t8__third-person-bundle-2","t8__feminine-la"],"track":8,"source":"extension","difficulty":2},{"id":"t8-x05","type":"sentence","prompt":"I must try to come to visit them now.","answer":"Debo intentar venir a visitarlos ahora.","steps":["I must try: debo intentar (no a - intentar isn't a verb of movement)","to come: venir - a verb of movement, so a: venir a","to visit them: visitarlos","now: ahora"],"rules":["t8__debo-must","t8__movement-verb-a","t8__lo-los-plural"],"track":8,"source":"extension","difficulty":3}],"blurb":"Feminine lo/la, formal quiere, venir, and debo meaning must","sectionIndex":1},{"id":"t9","label":"Track 9","tracks":[9],"rules":[{"id":"t9__quiero-i-want","family":"quiero-i-want","title":"quiero = I want (no separate word for I needed)","explanation":"quiero by itself already means I want - the ending carries the 'I'. It's the same word inside te quiero (I want you / I love you) minus the te.","examples":["quiero - I want","no quiero - I don't want"],"track":4},{"id":"t9__ación-to-ar-verb","family":"ación-to-ar-verb","title":"Drop -ción, add -r, and you have the verb","explanation":"Take any word ending -ación, remove -ción, and add -r: that's the Spanish verb. This single move hands you roughly a thousand verbs for free.","examples":["preparación -> preparar - to prepare","confirmación -> confirmar - to confirm","cancelación -> cancelar - to cancel"],"track":4},{"id":"t9__si-yes-if","family":"si-yes-if","title":"sí (yes) vs si (if)","explanation":"Yes and if are the same word in Spanish, distinguished in writing only by the accent: sí with an accent means yes; si with no accent means if.","examples":["sí - yes","si - if","quiero saber si quiere saber - I want to know if he/she/you (formal) want(s) to know"],"track":9},{"id":"t9__me-reflexive","family":"me-reflexive","title":"Myself uses the same word as me","explanation":"Spanish doesn't need a separate word for myself - it reuses me, the same word you already know for me/to me, attached to the end of the verb's 'to' form. It attaches exactly like lo, la or te.","examples":["justificar -> justificarme - to justify myself","no intento justificarme - I'm not trying to justify myself"],"track":4},{"id":"t9__third-person-bundle","family":"third-person-bundle","title":"One verb form covers he/she/it/formal you","explanation":"Just like es bundles it is / she is / he is / you (formal) are, quiere bundles he wants / she wants / it wants / you (formal) want - swap the -o ending for -e. This bundling of third person with formal you runs through Spanish verbs generally.","examples":["quiero -> quiere: he/she/it wants, or you (formal) want","quiere saber - he/she/you (formal) want(s) to know"],"track":8},{"id":"t9__lo-los-plural","family":"lo-los-plural","title":"Add s to pluralize: lo/la -> los/las (them)","explanation":"lo (him/it/formal you) and la (her/it fem./formal you to a female) both pluralize the same way - just add an s. los means them for masculine words, las means them for feminine words.","examples":["lo -> los, la -> las","quiere invitarlos - he/she/you (formal) want(s) to invite them"],"track":7},{"id":"t9__movement-verb-a","family":"movement-verb-a","title":"Verbs of movement take a before an infinitive","explanation":"When a verb that carries a sense of motion - voy (I'm going), venir (to come), pasar (to pass by) - is followed by another verb in its 'to' form, Spanish inserts a in between to carry that feeling of movement toward the action. Verbs without a movement sense, like quiero, intento or debo, don't take this a. Where a verb of movement leads straight into a second one, both get their own a: venir a la casa a visitarme.","examples":["voy a comer - I'm going to eat","quiere venir a la casa a visitarme - he/she/you (formal) want(s) to come to the house to visit me"],"track":7},{"id":"t9__question-by-tone","family":"question-by-tone","title":"Yes/no questions: same words, just ask it","explanation":"Spanish doesn't add a 'do' word to make a question. Keep the same word order as the statement and just say it with questioning intonation - in writing, wrap it in an opening and closing question mark, ¿ ?.","examples":["quiere saber -> ¿por qué no quiere saber? - why doesn't he/she/you (formal) want to know?"],"track":8}],"drills":[{"id":"t9-01","type":"sentence","prompt":"I want to know.","answer":"Quiero saber.","steps":["to know: saber, pronounced with a b sound - think of the English slang 'savvy'","I want: quiero"],"rules":["t9__quiero-i-want"],"track":9,"source":"track"},{"id":"t9-02","type":"sentence","prompt":"I don't want to know.","answer":"No quiero saber.","steps":["I don't want: no quiero","to know: saber"],"rules":["t9__quiero-i-want"],"track":9,"source":"track"},{"id":"t9-03","type":"sentence","prompt":"He wants to know. (or she / you formal)","answer":"Quiere saber.","steps":["quiero -> quiere for he/she/it/formal you","to know: saber"],"rules":["t9__third-person-bundle"],"track":9,"source":"track"},{"id":"t9-04","type":"sentence","prompt":"Why doesn't he want to know?","answer":"¿Por qué no quiere saber?","steps":["why: por qué","he doesn't want to know: no quiere saber","asked as a question: ¿Por qué no quiere saber?"],"rules":["t9__third-person-bundle","t9__question-by-tone"],"track":9,"source":"track"},{"id":"t9-05","type":"sentence","prompt":"I want to know why he doesn't want to know.","answer":"Quiero saber por qué no quiere saber.","steps":["I want to know: quiero saber","why he doesn't want to know: por qué no quiere saber"],"rules":["t9__third-person-bundle"],"track":9,"source":"track"},{"id":"t9-06","type":"word","prompt":"if","answer":"Si","steps":["same word as sí (yes), but no accent"],"rules":["t9__si-yes-if"],"track":9,"source":"track"},{"id":"t9-07","type":"sentence","prompt":"I want to know if you want to know. (formal)","answer":"Quiero saber si quiere saber.","steps":["I want to know: quiero saber","if: si","you (formal) want to know: quiere saber"],"rules":["t9__si-yes-if","t9__third-person-bundle"],"track":9,"source":"track"},{"id":"t9-08","type":"sentence","prompt":"I want to know if she wants to invite me.","answer":"Quiero saber si quiere invitarme.","steps":["I want to know: quiero saber","if: si","she wants to invite me: quiere invitarme"],"rules":["t9__si-yes-if","t9__third-person-bundle"],"track":9,"source":"track"},{"id":"t9-09","type":"sentence","prompt":"I don't want to imagine it.","answer":"No quiero imaginarlo.","steps":["to imagine: imaginar, from imaginación","I don't want to imagine it: no quiero imaginarlo"],"rules":["t9__ación-to-ar-verb"],"track":9,"source":"track"},{"id":"t9-10","type":"sentence","prompt":"I want to know if she wants to come to the house to visit me.","answer":"Quiero saber si quiere venir a la casa a visitarme.","steps":["I want to know: quiero saber","if: si","she wants to come: quiere venir","to the house: a la casa","to visit me: a visitarme - venir stays a verb of movement even with a la casa in between"],"rules":["t9__si-yes-if","t9__third-person-bundle","t9__movement-verb-a"],"track":9,"source":"track"},{"id":"t9-11","type":"sentence","prompt":"I want to know why she doesn't want to come to the house to visit me.","answer":"Quiero saber por qué no quiere venir a la casa a visitarme.","steps":["I want to know: quiero saber","why: por qué","she doesn't want: no quiere","to come to the house: venir a la casa","to visit me: a visitarme"],"rules":["t9__third-person-bundle","t9__movement-verb-a"],"track":9,"source":"track"},{"id":"t9-12","type":"s
