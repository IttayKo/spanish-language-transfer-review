 the -er, add -iste"],"rules":["t64__preterite-tu"],"track":64,"source":"track"},{"id":"t64-07","type":"sentence","prompt":"Didn't you go out last night? (informal)","answer":"¿No saliste anoche?","steps":["no at the front","go out: salir, take off the -ir, add -iste","last night: anoche - not esta noche, which is tonight"],"rules":["t64__preterite-tu"],"track":64,"source":"track"},{"id":"t64-08","type":"sentence","prompt":"Why didn't you wait for me? (informal)","answer":"¿Por qué no me esperaste?","steps":["why: por qué","no at the front","for me: me","wait: esperar, take off the -ar, add -aste"],"rules":["t64__preterite-tu"],"track":64,"source":"track"},{"id":"t64-09","type":"word","prompt":"they spoke","answer":"Hablaron","steps":["speak: hablar, take off the -ar","they in the dot: add -aron"],"rules":["t64__preterite-ellos"],"track":64,"source":"track"},{"id":"t64-10","type":"sentence","prompt":"They sold them.","answer":"Los vendieron.","steps":["them: los, out in front","sell: vender, take off the -er, add -ieron"],"rules":["t64__preterite-ellos"],"track":64,"source":"track"},{"id":"t64-11","type":"word","prompt":"They left / They went out","answer":"Salieron","steps":["go out: salir, take off the -ir, add -ieron"],"rules":["t64__preterite-ellos"],"track":64,"source":"track"},{"id":"t64-x01","type":"word","prompt":"you arrived (informal)","answer":"Llegaste","steps":["arrive: llegar, take off the -ar, add -aste"],"rules":["t64__preterite-tu"],"track":64,"source":"extension","difficulty":1},{"id":"t64-x02","type":"word","prompt":"they ate","answer":"Comieron","steps":["eat: comer, take off the -er, add -ieron"],"rules":["t64__preterite-ellos"],"track":64,"source":"extension","difficulty":1},{"id":"t64-x03","type":"sentence","prompt":"I responded it to him three weeks ago.","answer":"Se lo respondí hace tres semanas.","steps":["to him plus it: le lo isn't allowed, so se lo","I responded: respondí","three weeks ago: hace tres semanas"],"rules":["t64__double-l-to-se","t64__hace-ago"],"track":64,"source":"extension","difficulty":2},{"id":"t64-x04","type":"sentence","prompt":"Why didn't you eat it last night? (informal)","answer":"¿Por qué no lo comiste anoche?","steps":["why: por qué","no at the front","it: lo, out in front","eat: comer, take off the -er, add -iste","last night: anoche"],"rules":["t64__preterite-tu"],"track":64,"source":"extension","difficulty":3}],"blurb":"The you and they forms of the dot in the past, and hace for ago","sectionIndex":7},{"id":"t65","label":"Track 65","tracks":[65],"rules":[{"id":"t65__mas-else","family":"mas-else","title":"más to get else","explanation":"Adding más after nada or nadie turns nothing/nobody into nothing else/nobody else. Because Spanish doubles up its negatives, a sentence like \"I didn't eat anything else\" comes out as no comí nada más, literally \"I didn't eat nothing else\".","examples":["Nadie más - nobody else","Nada más - nothing else","No comí nada más - I didn't eat anything else"],"track":65},{"id":"t65__possessives","family":"possessives","title":"mi/tu/nuestro/su agree with the thing owned","explanation":"Mi, tu, nuestro and su change to match the noun being possessed, not the possessor: they take -s for plural (mi amigo -> mis amigos) and nuestro also changes for gender (nuestro amigo / nuestra amiga). Su covers his/her/their/your-formal all at once, and only becomes sus if what's owned is plural (su casa vs. sus casas), never to mark who the owner is.","examples":["Mis amigos - my friends","Nuestra casa - our house","Su casa - his/her/their house","Sus casas - his/her/their houses"],"track":65},{"id":"t65__propio","family":"propio","title":"propio/propia for own","explanation":"Propio (or propia, agreeing with the noun like an -o/-a adjective) means \"own\", placed after the possessive word: mi propia casa (my own house), mi propio auto (my own car).","examples":["Mi propia casa - my own house","Mi propio auto - my own car","Mis propios ojos - my own eyes"],"track":65},{"id":"t65__vez-time","family":"vez-time","title":"vez for a time/occasion","explanation":"Vez (feminine) means \"time\" in the sense of occasion, not clock-time. Combine it with una (once), otra (another/again), más (one more time), or a la (at the same time): una vez, otra vez, una vez más, a la vez.","examples":["Una vez - once","Otra vez - again, another time","Una vez más - one more time","A la vez - at the same time"],"track":65},{"id":"t65__preterite-tu","family":"preterite-tu","title":"You-informal in the point in the past: -aste, -iste","explanation":"For the point in the past (a completed action) with the informal you, -ar verbs take -aste and -er/-ir verbs take -iste. Drop the -ar/-er/-ir and add the ending: hablar -> hablaste, comer -> comiste, salir -> saliste.","examples":["Hablaste - you spoke","Comiste - you ate","¿Saliste anoche? - did you go out last night?"],"track":64},{"id":"t65__preterite-ellos","family":"preterite-ellos","title":"They in the point in the past: -aron, -ieron","explanation":"For the point in the past with they, -ar verbs take -aron and -er/-ir verbs take -ieron. Drop the -ar/-er/-ir and add the ending: hablar -> hablaron, comer -> comieron, vender -> vendieron.","examples":["Hablaron - they spoke","Comieron - they ate","Los vendieron - they sold them"],"track":64}],"drills":[{"id":"t65-01","type":"sentence","prompt":"I didn't eat anything else.","answer":"No comí nada más.","steps":["I ate: comí","nothing else: nada más","the no stays in front as well"],"rules":["t65__mas-else"],"track":65,"source":"track"},{"id":"t65-02","type":"sentence","prompt":"Didn't you eat anything else? (informal)","answer":"¿No comiste nada más?","steps":["you ate, informal: comiste","anything else: nada más"],"rules":["t65__mas-else","t65__preterite-tu"],"track":65,"source":"track"},{"id":"t65-03","type":"sentence","prompt":"Didn't you see me last night? (informal)","answer":"¿No me viste anoche?","steps":["me: me, out in front","you saw, informal: viste","last night: anoche"],"rules":["t65__preterite-tu"],"track":65,"source":"track"},{"id":"t65-04","type":"sentence","prompt":"I saw him once.","answer":"Lo vi una vez.","steps":["I saw him: lo vi","once, one time: una vez"],"rules":["t65__vez-time"],"track":65,"source":"track"},{"id":"t65-05","type":"sentence","prompt":"I want to see them one more time.","answer":"Quiero verlos una vez más.","steps":["I want to see them: quiero verlos","one more time: una vez más"],"rules":["t65__vez-time"],"track":65,"source":"track"},{"id":"t65-06","type":"sentence","prompt":"I want to see them again.","answer":"Quiero verlos otra vez.","steps":["I want to see them: quiero verlos","again, another time: otra vez"],"rules":["t65__vez-time"],"track":65,"source":"track"},{"id":"t65-07","type":"sentence","prompt":"Did you go out to dance again? (informal)","answer":"¿Saliste a bailar otra vez?","steps":["you went out, informal: saliste","to dance: a bailar, salir is a verb of movement","again: otra vez"],"rules":["t65__vez-time","t65__preterite-tu"],"track":65,"source":"track"},{"id":"t65-08","type":"sentence","prompt":"At what time did they arrive at your house? (informal)","answer":"¿A qué hora llegaron a tu casa?","steps":["at what time: a qué hora","they arrived: llegaron","at your house: a tu casa"],"rules":["t65__preterite-ellos","t65__possessives"],"track":65,"source":"track"},{"id":"t65-09","type":"sentence","prompt":"Everybody arrived at my house at the same time.","answer":"Todos llegaron a mi casa a la vez.","steps":["everybody: todos","they arrived: llegaron","at my house: a mi casa","at the same time: a la vez"],"rules":["t65__vez-time","t65__preterite-ellos","t65__possessives"],"track":65,"source":"track"},{"id":"t65-10","type":"sentence","prompt":"I didn't find anything else in your house. (informal)","answer":"No encontré nada más en tu casa.","steps":["I didn't find: no encontré","anything else: nada más","in your house: en tu casa"],"rules":["t65__mas-else","t65__possessives"],"track":65,"source":"track"},{"id":"t65-11","type":"sentence","prompt":"We are with our (all female) friends.","answer":"Estamos con nuestras amigas.","steps":["we are with, a location, so estar: estamos con","our friends, all female: nuestras amigas - nuestro agrees with what's owned"],"rules":["t65__possessives"],"track":65,"source":"track"},{"id":"t65-12","type":"sentence","prompt":"I want to go to their houses.","answer":"Quiero ir a sus casas.","steps":["I want to go to: quiero ir a","their houses: sus casas - sus because casas is plural, not because they are"],"rules":["t65__possessives"],"track":65,"source":"track"},{"id":"t65-13","type":"sentence","prompt":"I saw it with my own eyes.","answer":"Lo vi con mis propios ojos.","steps":["I saw it with: lo vi con","my own eyes: mis propios ojos, both agreeing with ojos"],"rules":["t65__propio","t65__possessives"],"track":65,"source":"track"},{"id":"t65-14","type":"sentence","prompt":"I want to live in my own house.","answer":"Quiero vivir en mi propia casa.","steps":["I want to live in: quiero vivir en","my own house: mi propia casa, propia matching casa"],"rules":["t65__propio"],"track":65,"source":"track"},{"id":"t65-x01","type":"word","prompt":"you saw (informal)","answer":"Viste","steps":["ver in the dot: vi, vio, vimos, viste, vieron","you-informal: viste"],"rules":["t65__preterite-tu"],"track":65,"source":"extension","difficulty":1},{"id":"t65-x02","type":"sentence","prompt":"I didn't find anything else in his house.","answer":"No encontré nada más en su casa.","steps":["I didn't find anything else: no encontré nada más","in his house: en su casa"],"rules":["t65__mas-else","t65__possessives"],"track":65,"source":"extension","difficulty":1},{"id":"t65-x03","type":"sentence","prompt":"They arrived at our house again.","answer":"Llegaron a nuestra casa otra vez.","steps":["they arrived: llegaron","at our house: a nuestra casa","again: otra vez"],"rules":["t65__preterite-ellos","t65__possessives","t65__vez-time"],"track":65,"source":"extension","difficulty":2},{"id":"t65-x04","type":"sentence","prompt":"I want to see my own house again.","answer":"Quiero ver mi propia casa otra vez.","steps":["I want to see: quiero ver","my own house: mi propia casa","again: otra vez"],"rules":["t65__propio","t65__vez-time"],"track":65,"source":"extension","difficulty":2},{"id":"t65-x05","type":"sentence","prompt":"Didn't they visit your house again? (informal)","answer":"¿No visitaron tu casa otra vez?","steps":["no at the front for the negative question","they visited: visitaron","your house: tu casa","again: otra vez"],"rules":["t65__preterite-ellos","t65__possessives","t65__vez-time"],"track":65,"source":"extension","difficulty":3}],"blurb":"vez for a time or an occasion, and possessives that agree with what's owned","sectionIndex":7},{"id":"t66","label":"Track 66","tracks":[66],"rules":[{"id":"t66__doler","family":"doler","title":"doler works like it hurts me","explanation":"You don't own the pain in Spanish the way you do in English: instead of \"my leg hurts\" you say it hurts me the leg, me duele la pierna, using doler with an indirect pronoun (me/te/le) plus the body part with its article. It hurts me alone is me duele.","examples":["Me duele - it hurts me","Me duele la pierna - my leg hurts","Tengo dolor de cabeza - I have a headache"],"track":66},{"id":"t66__solo","family":"solo","title":"solo for only/just","explanation":"Solo means only or just. It can go before the verb phrase or trail at the end of the sentence for emphasis: solo hablé contigo or hablé contigo solo both work, both meaning \"I only spoke with you\".","examples":["Solo hablé contigo (I only spoke with you)","Hablé contigo solo (I only spoke with you, emphatic)"],"track":66},{"id":"t66__de-possession","family":"de-possession","title":"de for 's","explanation":"Spanish has no apostrophe-s. To say José's house or María's party, say the house of José, the party of María: la casa de José, la fiesta de María.","examples":["la casa de José - José's house","vamos a la fiesta de María - we're going to María's party","dolor de cabeza - headache, literally pain of head"],"track":66},{"id":"t66__mas-else","family":"mas-else","title":"más to get else","explanation":"Adding más after nada or nadie turns nothing/nobody into nothing else/nobody else. Because Spanish doubles up its negatives, a sentence like \"I didn't eat anything else\" comes out as no comí nada más, literally \"I didn't eat nothing else\".","examples":["Nadie más - nobody else","Nada más - nothing else","No comí nada más - I didn't eat anything else"],"track":65}],"drills":[{"id":"t66-01","type":"sentence","prompt":"It hurts me.","answer":"Me duele.","steps":["to me: me","it hurts: duele, from doler, with the o splitting to ue"],"rules":["t66__doler"],"track":66,"source":"track"},{"id":"t66-02","type":"sentence","prompt":"My leg hurts.","answer":"Me duele la pierna.","steps":["it hurts me: me duele","the leg: la pierna - Spanish gives the body part its article, not a possessive"],"rules":["t66__doler"],"track":66,"source":"track"},{"id":"t66-03","type":"sentence","prompt":"My leg doesn't hurt anymore.","answer":"No me duele la pierna más.","steps":["my leg doesn't hurt: no me duele la pierna","anymore: más on the end, the same más as in nada más"],"rules":["t66__doler"],"track":66,"source":"track"},{"id":"t66-04","type":"sentence","prompt":"I have a headache.","answer":"Tengo dolor de cabeza.","steps":["I have: tengo","pain of head: dolor de cabeza"],"rules":["t66__doler","t66__de-possession"],"track":66,"source":"track"},{"id":"t66-05","type":"sentence","prompt":"I had a headache.","answer":"Tenía dolor de cabeza.","steps":["I had, ongoing, so the line in the past: tenía","a headache: dolor de cabeza"],"rules":["t66__doler"],"track":66,"source":"track"},{"id":"t66-06","type":"sentence","prompt":"Jose's house.","answer":"La casa de José.","steps":["the house: la casa","of José: de José - there's no apostrophe-s in Spanish"],"rules":["t66__de-possession"],"track":66,"source":"track"},{"id":"t66-07","type":"sentence","prompt":"We are going to Maria's party.","answer":"Vamos a la fiesta de María.","steps":["we are going to: vamos a","the party of María: la fiesta de María"],"rules":["t66__de-possession"],"track":66,"source":"track"},{"id":"t66-08","type":"sentence","prompt":"I didn't speak with anybody else at Maria's party.","answer":"No hablé con nadie más en la fiesta de María.","steps":["I didn't speak: no hablé","with anybody else: con nadie más","at María's party: en la fiesta de María"],"rules":["t66__mas-else","t66__de-possession"],"track":66,"source":"track"},{"id":"t66-09","type":"sentence","prompt":"I only spoke with you. (informal)","answer":"Solo hablé contigo.","steps":["only: solo","I spoke with you: hablé contigo"],"rules":["t66__solo"],"track":66,"source":"track","note":"Also fine as Hablé contigo solo, or Hablé solo contigo, for emphasis."},{"id":"t66-x01","type":"sentence","prompt":"My head hurts.","answer":"Me duele la cabeza.","steps":["it hurts me: me duele","the head: la cabeza"],"rules":["t66__doler"],"track":66,"source":"extension","difficulty":1},{"id":"t66-x02","type":"sentence","prompt":"I only spoke with Jose, with nobody else.","answer":"Solo hablé con José, con nadie más.","steps":["I only spoke with José: solo hablé con José","with nobody else: con nadie más"],"rules":["t66__solo","t66__mas-else"],"track":66,"source":"extension","difficulty":2},{"id":"t66-x03","type":"sentence","prompt":"I only spoke with Maria's friends, with nobody else.","answer":"Solo hablé con los amigos de María, con nadie más.","steps":["I only spoke with: solo hablé con","María's friends: los amigos de María","with nobody else: con nadie más"],"rules":["t66__solo","t66__de-possession","t66__mas-else"],"track":66,"source":"extension","difficulty":3}],"blurb":"de instead of 's, and doler: it hurts me the leg","sectionIndex":7},{"id":"t67","label":"Track 67","tracks":[67],"rules":[{"id":"t67__written-accent-question-words","family":"written-accent-question-words","title":"Question words take a written accent, their look-alikes don't","explanation":"A handful of words are spelled the same whether they're asking a question or not; when used as a question word, Spanish adds a written accent to mark that.","examples":["¿dónde? vs donde","¿cómo? vs como","¿cuándo? / ¿cuánto? vs cuando/cuanto"],"track":67},{"id":"t67__written-accent-same-word-pairs","family":"written-accent-same-word-pairs","title":"Identical one-syllable words are told apart with a written accent","explanation":"When two one-syllable words are spelled the same but mean different things, Spanish gives one of them a written accent purely to tell them apart on the page. This doesn't come from the stress rule at all, it's just there to remove ambiguity.","examples":["sí (yes) vs si (if)","mí (after a preposition) vs mi (my)","sé (I know) vs se (himself/herself/it)"],"track":67},{"id":"t67__natural-accent-other-consonant","family":"natural-accent-other-consonant","title":"Words ending in any other consonant stress the last syllable","explanation":"If a Spanish word ends in a consonant that isn't n or s, the natural stress falls on the final syllable. Every '-ar/-er/-ir' infinitive ('to' verb) shows this perfectly.","examples":["comer - co-MER","hablar - ha-BLAR","salud - sa-LUD"],"track":67},{"id":"t67__natural-accent-vowel-n-s","family":"natural-accent-vowel-n-s","title":"Words ending in a vowel, n or s stress the second-last syllable","explanation":"If a Spanish word ends in a vowel, an n, or an s, the natural stress falls on the second-to-last syllable, with no written accent needed. This is exactly what present-tense verb forms end in, so you can always check yourself against the present tense.","examples":["hablas - HA-blas","hablamos - ha-BLA-mos","encuentro - en-CUEN-tro"],"track":67},{"id":"t67__written-accent-breaks-rule","family":"written-accent-breaks-rule","title":"A written accent shows the natural stress rule is being broken","explanation":"When a word's real stress doesn't match where the natural-accent rule says it should fall, Spanish marks the true stressed vowel with a written accent. The accent never changes the sound of the vowel, only where you land the stress.","examples":["encontró (breaks the vowel/n/s rule, stress on the end)","limón (breaks the n rule, stress on the end)","tradición"],"track":67}],"drills":[{"id":"t67-01","type":"word","prompt":"to speak","answer":"Hablar","steps":["to speak: hablar","ends in r, not n/s/vowel, so the natural stress falls on the end","ha-BLAR needs no written accent"],"rules":["t67__natural-accent-other-consonant"],"track":67,"source":"track"},{"id":"t67-02","type":"word","prompt":"to find","answer":"Encontrar","steps":["to find: encontrar","ends in r, so natural stress falls on the end","en-con-TRAR needs no written accent"],"rules":["t67__natural-accent-other-consonant"],"track":67,"source":"track"},{"id":"t67-03","type":"word","prompt":"I find / I encounter (with the written accent it needs, if any)","answer":"Encuentro","steps":["encuentro ends in a vowel, so the natural stress is on the second-last syllable","en-CUEN-tro is where it actually falls, so nothing is broken","no written accent"],"rules":["t67__natural-accent-vowel-n-s"],"track":67,"source":"track"},{"id":"t67-04","type":"word","prompt":"she found (with the written accent it needs, if any)","answer":"Encontró","steps":["encontró ends in a vowel, so the rule expects en-CON-tro","the real stress is on the end: en-con-TRÓ","the rule is broken, so the stressed vowel gets a written accent"],"rules":["t67__natural-accent-vowel-n-s","t67__written-accent-breaks-rule"],"track":67,"source":"track"},{"id":"t67-05","type":"word","prompt":"lemon (with the written accent it needs, if any)","answer":"Limón","steps":["limón ends in n, so the rule expects LI-mon","the real stress is on the end: li-MÓN","the rule is broken, so write the accent on the o"],"rules":["t67__natural-accent-vowel-n-s","t67__written-accent-breaks-rule"],"track":67,"source":"track"},{"id":"t67-06","type":"word","prompt":"health - also what you say for a toast","answer":"Salud","steps":["salud ends in d, not a vowel, n or s, so the natural stress is on the end","sa-LUD is where it falls, so nothing is broken","no written accent"],"rules":["t67__natural-accent-other-consonant"],"track":67,"source":"track"},{"id":"t67-07","type":"sentence","prompt":"Yes, I want it.","answer":"Sí, lo quiero.","steps":["yes here is the word for yes, not if, so it takes the accent: sí","it: lo, out in front","I want: quiero"],"rules":["t67__written-accent-same-word-pairs"],"track":67,"source":"track","note":"The one without the accent is si, if: no sé si lo quiero."},{"id":"t67-08","type":"sentence","prompt":"This one is for me.","answer":"Este es para mí.","steps":["this one: este","is: es","for me: para mí - mí after a preposition takes the accent"],"rules":["t67__written-accent-same-word-pairs"],"track":67,"source":"track","note":"Without the accent it's mi, my: mi casa."},{"id":"t67-09","type":"sentence","prompt":"I don't know if I gave it to him.","answer":"No sé si se lo di.","steps":["I know: sé, with the accent, from saber","if: si, no accent","to him plus it: le lo isn't allowed, so se lo","I gave: di"],"rules":["t67__written-accent-same-word-pairs"],"track":67,"source":"track","note":"One short sentence with both: sé takes the accent, the se standing in for le doesn't."},{"id":"t67-10","type":"sentence","prompt":"I don't know where they ate.","answer":"No sé dónde comieron.","steps":["I don't know: no sé","where, still a question even tucked inside: dónde, with the accent","they ate: comieron"],"rules":["t67__written-accent-question-words"],"track":67,"source":"track","note":"Not asking anything, no accent: la casa donde vivo, the house where I live."},{"id":"t67-x01","type":"word","prompt":"to drink","answer":"Beber","steps":["ends in r, so the natural stress is on the end","be-BER is where it falls: no written accent"],"rules":["t67__natural-accent-other-consonant"],"track":67,"source":"extension","difficulty":1},{"id":"t67-x02","type":"word","prompt":"opinion (with the written accent it needs, if any)","answer":"Opinión","steps":["opinión ends in n, so the rule expects o-PI-nion","the real stress is on the end: o-pi-NIÓN","so the last o takes a written accent - as every -ión word does"],"rules":["t67__natural-accent-vowel-n-s","t67__written-accent-breaks-rule"],"track":67,"source":"extension","difficulty":1},{"id":"t67-x03","type":"sentence","prompt":"Yes, I know where it is.","answer":"Sí, sé dónde está.","steps":["yes, with the accent: sí","I know, with the accent: sé","where, a question inside the sentence: dónde","it is, a location: está"],"rules":["t67__written-accent-same-word-pairs","t67__written-accent-question-words"],"track":67,"source":"extension","difficulty":2,"note":"Three accented look-alikes in four words: sí, sé, dónde."},{"id":"t67-x04","type":"sentence","prompt":"I don't know if he found it, but he didn't tell me.","answer":"No sé si lo encontró, pero no me dijo.","steps":["I know: sé, with its written accent","if: si, without one","he found it: lo encontró - the accent marks the stress the rule wouldn't have put there","but: pero","he didn't tell me: no me dijo - an irregular dot, so no accent at all"],"rules":["t67__written-accent-same-word-pairs","t67__written-accent-breaks-rule","t67__natural-accent-vowel-n-s"],"track":67,"source":"extension","difficulty":3,"note":"Four accent decisions in one sentence, and each one is a different rule."}],"blurb":"Where Spanish puts the stress, and when a written accent is needed","sectionIndex":7},{"id":"t68","label":"Track 68","tracks":[68],"rules":[{"id":"t68__este-esta-to-ese-esa","family":"este-esta-to-ese-esa","title":"This to that: pull the t out","explanation":"Take the t out of este (this, masculine) or esta (this, feminine) and what's left, ese/esa, means that. It works the same for the plurals: estos/estas (these) become esos/esas (those). The plurals follow los and las: estos/esos, estas/esas. You'll also hear the noun come first - el hombre este - a turn of phrase Spanish picked up from Arabic.","examples":["este auto -> ese auto - this car -> that car","esta noche -> esa noche - this night -> that night","estas manos -> esas manos - these hands -> those hands"],"track":44},{"id":"t68__tan-so","family":"tan-so","title":"tan for so (so tired, so bored)","explanation":"Tan is the word for so, as an intensifier before an adjective - I am so tired, it is so boring. It just slots in before the adjective, after the verb. Put a que later in the sentence and you have so ... that: estábamos tan cansados que dormimos todo el día.","examples":["estoy tan cansado - I am so tired","estábamos tan cansados que dormimos todo el día - we were so tired that we slept all day"],"track":33},{"id":"t68__neuter-this-that","family":"neuter-this-that","title":"esto/eso for a general 'this'/'that' with no specific noun","explanation":"When 'this' or 'that' doesn't stand in for any particular masculine or feminine noun, like in 'I can't believe this', Spanish uses a separate neuter form: esto for this, eso for that.","examples":["no creo esto - I don't believe this","nada me gustó más que eso - nothing pleased me more than that"],"track":68},{"id":"t68__written-accent-question-words","family":"written-accent-question-words","title":"Question words take a written accent, their look-alikes don't","explanation":"A handful of words are spelled the same whether they're asking a question or not; when used as a question word, Spanish adds a written accent to mark that.","examples":["¿dónde? vs donde","¿cómo? vs como","¿cuándo? / ¿cuánto? vs cuando/cuanto"],"track":67},{"id":"t68__written-accent-same-word-pairs","family":"written-accent-same-word-pairs","title":"Identical one-syllable words are told apart with a written accent","explanation":"When two one-syllable words are spelled the same but mean different things, Spanish gives one of them a written accent purely to tell them apart on the page. This doesn't come from the stress rule at all, it's just there to remove ambiguity.","examples":["sí (yes) vs si (if)","mí (after a preposition) vs mi (my)","sé (I know) vs se (himself/herself/it)"],"track":67}],"drills":[{"id":"t68-01","type":"word","prompt":"tonight","answer":"Esta noche","steps":["this + noche = esta noche","noche is feminine, so esta (not este)"],"rules":["t68__este-esta-to-ese-esa"],"track":68,"source":"track"},{"id":"t68-02","type":"word","prompt":"that night","answer":"Esa noche","steps":["esta noche = this night","take away the t: esa noche = that night"],"rules":["t68__este-esta-to-ese-esa"],"track":68,"source":"track"},{"id":"t68-03","type":"word","prompt":"those nights","answer":"Esas noches","steps":["esa noche = that night","add the plural s to both the demonstrative and the noun: esas noches"],"rules":["t68__este-esta-to-ese-esa"],"track":68,"source":"track"},{"id":"t68-04","type":"word","prompt":"this man","answer":"Este hombre","steps":["hombre is masculine, not feminine","this for a masculine noun: este, not esta"],"rules":["t68__este-esta-to-ese-esa"],"track":68,"source":"track"},{"id":"t68-05","type":"word","prompt":"these men","answer":"Estos hombres","steps":["este + the los-style plural -os: estos","put it together: estos hombres"],"rules":["t68__este-esta-to-ese-esa"],"track":68,"source":"track"},{"id":"t68-06","type":"sentence","prompt":"I don't believe this (no specific noun in mind)","answer":"No creo esto.","steps":["creer: to believe (from earlier)","this here isn't standing in for a masculine or feminine noun, so use the neuter: esto"],"rules":["t68__neuter-this-that"],"track":68,"source":"track"},{"id":"t68-07","type":"sentence","prompt":"Nothing pleases me more than this.","answer":"Nada me gusta más que esto.","steps":["nada me gusta: nothing pleases me (from earlier)","más que: more than (from earlier)","this with no specific noun: esto"],"rules":["t68__neuter-this-that"],"track":68,"source":"track"},{"id":"t68-08","type":"sentence","prompt":"Nothing pleased me more than that.","answer":"Nada me gustó más que eso.","steps":["nada me gustó: nothing pleased me (past)","that with no specific noun: eso"],"rules":["t68__neuter-this-that"],"track":68,"source":"track"},{"id":"t68-09","type":"sentence","prompt":"I was so tired (feminine, a line in time)","answer":"Estaba tan cansada.","steps":["estaba: I was (from earlier)","tan cansada: so tired"],"rules":["t68__tan-so"],"track":68,"source":"track"},{"id":"t68-10","type":"sentence","prompt":"We were so tired that we slept all day. (a mixed or male group)","answer":"Estábamos tan cansados que dormimos todo el día.","steps":["estábamos: we were","tan cansados que: so tired that","dormimos todo el día: we slept all day (día is masculine even though it ends in a)"],"rules":["t68__tan-so"],"track":68,"source":"track"},{"id":"t68-11","type":"sentence","prompt":"We were so tired when we arrived that we slept all day.","answer":"Estábamos tan cansados cuando llegamos que dormimos todo el día.","steps":["estábamos tan cansados: we were so tired","cuando llegamos: when we arrived (from earlier)","que dormimos todo el día: that we slept all day"],"rules":["t68__tan-so"],"track":68,"source":"track"},{"id":"t68-12","type":"sentence","prompt":"I don't know how many times I visited him.","answer":"No sé cuántas veces lo visité.","steps":["I don't know: no sé, with its written accent","how many times: cuántas veces, feminine like otra vez","I visited him: lo visité"],"rules":["t68__written-accent-question-words","t68__written-accent-same-word-pairs"],"track":68,"source":"track"},{"id":"t68-13","type":"sentence","prompt":"I don't know how many times they visited her.","answer":"No sé cuántas veces la visitaron.","steps":["no sé cuántas veces: I don't know how many times","la visitaron: they visited her (la: her, from earlier)"],"rules":["t68__written-accent-question-words","t68__written-accent-same-word-pairs"],"track":68,"source":"track"},{"id":"t68-x01","type":"word","prompt":"this car","answer":"Este coche","steps":["car: coche, a masculine word","this, for a masculine word: este"],"rules":["t68__este-esta-to-ese-esa"],"track":68,"source":"extension","difficulty":1,"note":"Este auto works the same way."},{"id":"t68-x02","type":"word","prompt":"those women","answer":"Esas mujeres","steps":["mujer is feminine, so that = esa","add the plural s: esas mujeres"],"rules":["t68__este-esta-to-ese-esa"],"track":68,"source":"extension","difficulty":1},{"id":"t68-x03","type":"sentence","prompt":"I don't like anything more than that.","answer":"No me gusta nada más que eso.","steps":["no me gusta nada: I don't like anything (from earlier)","más que eso: more than that, no specific noun so neuter eso"],"rules":["t68__neuter-this-that"],"track":68,"source":"extension","difficulty":2},{"id":"t68-x04","type":"sentence","prompt":"He was so tired that he slept.","answer":"Estaba tan cansado que durmió.","steps":["estaba tan cansado: he was so tired","que durmió: that he slept"],"rules":["t68__tan-so"],"track":68,"source":"extension","difficulty":2},{"id":"t68-x05","type":"sentence","prompt":"These men were so tired that they didn't want to see anybody.","answer":"Estos hombres estaban tan cansados que no querían ver a nadie.","steps":["these men: estos hombres, with the -os of los","they were, ongoing, so the line in the past: estaban","so tired that: tan cansados que","they didn't want: no querían","to see anybody: ver a nadie - a specific person on the receiving end takes a"],"rules":["t68__este-esta-to-ese-esa","t68__tan-so"],"track":68,"source":"extension","difficulty":3}],"blurb":"esto and eso with no noun in mind, and tan...que for so...that","sectionIndex":7},{"id":"t69","label":"Track 69","tracks":[69],"rules":[{"id":"t69__mood-tense-formation","family":"mood-tense-formation","title":"Swap the ending group to build the mood tense","explanation":"To put a verb into the mood tense (the subjunctive), swap its ending group: -ar verbs borrow the -er/-ir endings, and -er/-ir verbs borrow the -ar endings. No new sounds are needed, you just think of the form in the other group.","examples":["habla -> hable - an -ar verb borrows the -er/-ir ending","hablamos -> hablemos - the same swap for we","como -> coma - an -er verb borrows the -ar ending"],"track":69},{"id":"t69__mood-tense-after-quiero-que","family":"mood-tense-after-quiero-que","title":"quiero que + mood tense for 'I want you to...'","explanation":"English says 'I want you to wait'; Spanish (like most Romance languages) says 'I want that you wait' - quiero que - and the verb after que must be in the mood tense. This is an obligatory use, not optional.","examples":["quiero que esperes - I want you to wait","quiero que lo esperes","¿quieres que te espere?"],"track":69},{"id":"t69__este-esta-to-ese-esa","family":"este-esta-to-ese-esa","title":"This to that: pull the t out","explanation":"Take the t out of este (this, masculine) or esta (this, feminine) and what's left, ese/esa, means that. It works the same for the plurals: estos/estas (these) become esos/esas (those). The plurals follow los and las: estos/esos, estas/esas. You'll also hear the noun come first - el hombre este - a turn of phrase Spanish picked up from Arabic.","examples":["este hombre -> ese hombre - this man -> that man","esta noche -> esa noche - this night -> that night","estos hombres -> esos hombres - these men -> those men"],"track":44}],"drills":[{"id":"t69-01","type":"word","prompt":"he speaks - now in the mood tense","answer":"Hable","steps":["habla is an -ar verb form","swap to the -er/-ir ending group: hable"],"rules":["t69__mood-tense-formation"],"track":69,"source":"track"},{"id":"t69-02","type":"word","prompt":"they speak - now in the mood tense","answer":"Hablen","steps":["hablan is an -ar verb form","swap to the -er/-ir ending group: hablen"],"rules":["t69__mood-tense-formation"],"track":69,"source":"track"},{"id":"t69-03","type":"word","prompt":"we speak - now in the mood tense","answer":"Hablemos","steps":["hablamos is an -ar verb form","swap to the -er/-ir ending group, using -emos (not the -ir group's -imos): hablemos"],"rules":["t69__mood-tense-formation"],"track":69,"source":"track"},{"id":"t69-04","type":"word","prompt":"I eat - now in the mood tense","answer":"Coma","steps":["como is an -er verb form","swap to the -ar ending group: coma"],"rules":["t69__mood-tense-formation"],"track":69,"source":"track"},{"id":"t69-05","type":"word","prompt":"they eat - now in the mood tense","answer":"Coman","steps":["comen is an -er verb form","swap to the -ar ending group: coman"],"rules":["t69__mood-tense-formation"],"track":69,"source":"track"},{"id":"t69-06","type":"sentence","prompt":"I want you to wait. (informal)","answer":"Quiero que esperes.","steps":["Spanish won't say I want you to wait - it says I want that you wait","I want: quiero","that: que","you wait, and que pulls it into the mood tense: esperes"],"rules":["t69__mood-tense-formation","t69__mood-tense-after-quiero-que"],"track":69,"source":"track"},{"id":"t69-07","type":"sentence","prompt":"I want you to wait for him. (informal)","answer":"Quiero que lo esperes.","steps":["quiero que: I want that","lo: him/it (from earlier)","esperes: you wait (mood tense)"],"rules":["t69__mood-tense-formation","t69__mood-tense-after-quiero-que"],"track":69,"source":"track"},{"id":"t69-08","type":"sentence","prompt":"Do you want me to wait for you? (informal)","answer":"¿Quieres que te espere?","steps":["quieres que: do you want that","te: you (from earlier)","espere: I wait (mood tense)"],"rules":["t69__mood-tense-formation","t69__mood-tense-after-quiero-que"],"track":69,"source":"track"},{"id":"t69-09","type":"sentence","prompt":"Do you want me to wait for you? (informal, making clear it's me)","answer":"¿Quieres que yo te espere?","steps":["quieres que: do you want that","yo added to clarify it's specifically I who waits","te espere: I wait for you"],"rules":["t69__mood-tense-formation","t69__mood-tense-after-quiero-que"],"track":69,"source":"track"},{"id":"t69-x01","type":"word","prompt":"she lives - now in the mood tense","answer":"Viva","steps":["vive is an -ir verb form","swap to the -ar ending group: viva"],"rules":["t69__mood-tense-formation"],"track":69,"source":"extension","difficulty":1},{"id":"t69-x02","type":"sentence","prompt":"I want her to speak.","answer":"Quiero que hable.","steps":["quiero que: I want that","hable: she speaks, mood tense (habla -> hable)"],"rules":["t69__mood-tense-formation","t69__mood-tense-after-quiero-que"],"track":69,"source":"extension","difficulty":2},{"id":"t69-x03","type":"sentence","prompt":"I want you to wait for her here tonight. (informal)","answer":"Quiero que la esperes aquí esta noche.","steps":["quiero que: I want that","la: her (from earlier)","esperes: you wait (mood tense)","aquí: here (from earlier)","esta noche: tonight"],"rules":["t69__mood-tense-formation","t69__mood-tense-after-quiero-que","t69__este-esta-to-ese-esa"],"track":69,"source":"extension","difficulty":3}],"blurb":"Building the mood tense by swapping ending groups, and quiero que","sectionIndex":8},{"id":"t70","label":"Track 70","tracks":[70],"rules":[{"id":"t70__lo-que","family":"lo-que","title":"lo que: what, when it's not a question","explanation":"When \"what\" isn't asking a question but pointing at a thing (\"I saw what you're doing\"), it's lo que, not qué. Qué stays for actual questions.","examples":["lo que hablamos - what we spoke about","lo que falta - what's missing","lo que comen - what they eat"],"track":70},{"id":"t70__subjunctive-trigger-verbs","family":"subjunctive-trigger-verbs","title":"Verbs that cast your subjectivity make the next verb switch","explanation":"Verbs that show what you want, need, prefer, hope, or like to happen (quiero, necesito, prefiero, espero, me gusta) are followed by que, and the verb after que goes into the mood tense. It's not just the structure - it's the feeling of pushing your will or hope onto the world.","examples":["necesito que lo prepare - I need you to prepare it","prefiero que se quede - I prefer that he stays","espero que cuentes conmigo - I hope you count on me","me gusta que la profesora visite - I like that the teacher visits"],"track":70},{"id":"t70__hace-falta","family":"hace-falta","title":"falta/faltar - to lack, to be missing, and hace falta","explanation":"Faltar is to lack or be missing; the noun falta means a lack (falta de respeto - a lack of respect). Hace falta, literally \"it makes lack\", is a very common way to say it's necessary, and it's followed by que + mood tense just like quiero que.","examples":["lo que falta - what's missing","hace falta que comamos pronto - it's necessary that we eat soon","falta de consideración - lack of consideration"],"track":70}],"drills":[{"id":"t70-01","type":"sentence","prompt":"I don't want you to speak about what we were speaking about. (informal)","answer":"No quiero que hables sobre lo que hablábamos.","steps":["I don't want you to speak: no quiero que hables, que pulls in the mood tense","about: sobre (or de)","what we were speaking about: lo que hablábamos, using the past to keep it clear which \"what\" you mean"],"rules":["t70__lo-que","t70__subjunctive-trigger-verbs"],"track":70,"source":"track","note":"Also fine as ...lo que hablamos, but the imperfect avoids ambiguity with the present."},{"id":"t70-02","type":"sentence","prompt":"I need you to prepare it. (formal)","answer":"Necesito que lo prepare.","steps":["I need that you prepare it: necesito que + mood tense","it: lo, out at the front","prepare: prepare, formal you form"],"rules":["t70__subjunctive-trigger-verbs"],"track":70,"source":"track"},{"id":"t70-03","type":"sentence","prompt":"I need you to prepare what's missing. (formal)","answer":"Necesito que prepare lo que falta.","steps":["I need that you prepare: necesito que prepare","what's missing: lo que falta - what, not as a question, plus falta, to lack"],"rules":["t70__subjunctive-trigger-verbs","t70__hace-falta","t70__lo-que"],"track":70,"source":"track"},{"id":"t70-04","type":"sentence","prompt":"It is necessary that we eat soon.","answer":"Hace falta que comamos pronto.","steps":["it makes lack, it's necessary: hace falta que + mood tense","we eat: comamos","soon: pronto"],"rules":["t70__hace-falta","t70__subjunctive-trigger-verbs"],"track":70,"source":"track"},{"id":"t70-05","type":"sentence","prompt":"I prefer that they don't stay here.","answer":"Prefiero que no se queden aquí.","steps":["I prefer that: prefiero que + mood tense","no comes right before the verb","they stay (themselves): se queden"],"rules":["t70__subjunctive-trigger-verbs"],"track":70,"source":"track"},{"id":"t70-06","type":"sentence","prompt":"I prefer you to give it to him. (informal)","answer":"Prefiero que se lo des a él.","steps":["I prefer that you give: prefiero que des","it to him: se lo, se replacing le before lo","to clarify it's him: a él on the end"],"rules":["t70__subjunctive-trigger-verbs"],"track":70,"source":"track"},{"id":"t70-07","type":"sentence","prompt":"I prefer them to stay.","answer":"Prefiero que se queden.","steps":["I prefer that they stay (themselves): prefiero que se queden"],"rules":["t70__subjunctive-trigger-verbs"],"track":70,"source":"track"},{"id":"t70-x01","type":"sentence","prompt":"I prefer that she stays.","answer":"Prefiero que se quede.","steps":["I prefer that: prefiero que + mood tense","she stays (herself): se quede"],"rules":["t70__subjunctive-trigger-verbs"],"track":70,"source":"extension","difficulty":1},{"id":"t70-x02","type":"sentence","prompt":"I need you to buy what is missing. (informal)","answer":"Necesito que compres lo que falta.","steps":["I need that you buy: necesito que compres","what is missing: lo que falta"],"rules":["t70__subjunctive-trigger-verbs","t70__hace-falta","t70__lo-que"],"track":70,"source":"extension","difficulty":2},{"id":"t70-x03","type":"sentence","prompt":"I don't want you to speak about what is missing. (informal)","answer":"No quiero que hables sobre lo que falta.","steps":["I don't want that you speak: no quiero que hables","about: sobre","what is missing: lo que falta"],"rules":["t70__lo-que","t70__subjunctive-trigger-verbs","t70__hace-falta"],"track":70,"source":"extension","difficulty":3}],"blurb":"lo que for a what that isn't asking, and the verbs that pull in the mood tense","sectionIndex":8},{"id":"t71","label":"Track 71","tracks":[71],"rules":[{"id":"t71__contar-meanings","family":"contar-meanings","title":"contar - to count, to recount/tell, and to count on","explanation":"Contar means to count, but also to recount or tell, especially with stories (un cuento - a story). Contar con means to count on someone - literally \"to count with\" in Spanish.","examples":["cuento - I tell / a story","quiero que me cuentes - I want you to tell me","quiero que cuentes conmigo - I want you to count on me"],"track":71},{"id":"t71__personal-a","family":"personal-a","title":"Put a before a specific person on the receiving end","explanation":"Because word order in Spanish is flexible, a name or person could come before or after the verb, so it's not clear who's doing the action and who's having it done to them. When a specific person is having the action done to them and there's no other preposition already there, you put a in front of them to make that clear. A + el joins into al.","examples":["espero que vean a María - I hope they see Maria","quiero que vea al hombre - I want him to see the man","espero que comprenda a David - I hope you understand David"],"track":71},{"id":"t71__ver-subjunctive-veo","family":"ver-subjunctive-veo","title":"ver's mood tense is built on veo, not ve","explanation":"Ver is irregular only in the I-form of the present: veo. To avoid the mood tense sounding like van (they go), the mood tense for ver is built off veo, keeping the e: vea, veas, vean.","examples":["espero que vean - I hope they see","quiero que vea al hombre - I want him to see the man"],"track":71},{"id":"t71__lo-que","family":"lo-que","title":"lo que: what, when it's not a question","explanation":"When \"what\" isn't asking a question but pointing at a thing (\"I saw what you're doing\"), it's lo que, not qué. Qué stays for actual questions.","examples":["lo que hablamos - what we spoke about","lo que falta - what's missing","lo que comen - what they eat"],"track":70},{"id":"t71__subjunctive-trigger-verbs","family":"subjunctive-trigger-verbs","title":"Verbs that cast your subjectivity make the next verb switch","explanation":"Verbs that show what you want, need, prefer, hope, or like to happen (quiero, necesito, prefiero, espero, me gusta) are followed by que, and the verb after que goes into the mood tense. It's not just the structure - it's the feeling of pushing your will or hope onto the world.","examples":["necesito que lo prepare - I need you to prepare it","prefiero que se quede - I prefer that he stays","espero que cuentes conmigo - I hope you count on me","me gusta que la profesora visite - I like that the teacher visits"],"track":70},{"id":"t71__hace-falta","family":"hace-falta","title":"falta/faltar - to lack, to be missing, and hace falta","explanation":"Faltar is to lack or be missing; the noun falta means a lack (falta de respeto - a lack of respect). Hace falta, literally \"it makes lack\", is a very common way to say it's necessary, and it's followed by que + mood tense just like quiero que.","examples":["lo que falta - what's missing","hace falta que comamos pronto - it's necessary that we eat soon","falta de consideración - lack of consideration"],"track":70}],"drills":[{"id":"t71-01","type":"sentence","prompt":"I want you to tell me. (informal)","answer":"Quiero que me cuentes.","steps":["I want that you tell: quiero que cuentes","me: me, before the verb"],"rules":["t71__subjunctive-trigger-verbs","t71__contar-meanings"],"track":71,"source":"track","note":"contar here means to tell/recount, not to count."},{"id":"t71-02","type":"sentence","prompt":"I want you to count on me. (informal)","answer":"Quiero que cuentes conmigo.","steps":["I want that you count: quiero que cuentes","on me: con + mi becomes conmigo, since in Spanish you count WITH someone"],"rules":["t71__subjunctive-trigger-verbs","t71__contar-meanings"],"track":71,"source":"track"},{"id":"t71-03","type":"sentence","prompt":"I hope that you count on me. (informal)","answer":"Espero que cuentes conmigo.","steps":["I hope that: espero que + mood tense, esperar casts a hope onto the world just like querer","you count on me: cuentes conmigo"],"rules":["t71__subjunctive-trigger-verbs"],"track":71,"source":"track"},{"id":"t71-04","type":"sentence","prompt":"We hope that they tell it to Maria.","answer":"Esperamos que lo cuenten a María.","steps":["we hope that they tell: esperamos que cuenten","it: lo, before the verb","to Maria: a María, since Maria is having the telling done to her"],"rules":["t71__subjunctive-trigger-verbs","t71__personal-a"],"track":71,"source":"track"},{"id":"t71-05","type":"sentence","prompt":"I hope that they see Maria.","answer":"Espero que vean a María.","steps":["I hope that they see: espero que vean, built off veo so it doesn't sound like van","Maria is having the seeing done to her: a María"],"rules":["t71__subjunctive-trigger-verbs","t71__ver-subjunctive-veo","t71__personal-a"],"track":71,"source":"track"},{"id":"t71-06","type":"sentence","prompt":"I hope that you understand David. (formal)","answer":"Espero que comprenda a David.","steps":["I hope that you understand: espero que comprenda","David is having the understanding done to him: a David"],"rules":["t71__subjunctive-trigger-verbs","t71__personal-a"],"track":71,"source":"track"},{"id":"t71-07","type":"sentence","prompt":"I want him to see the man.","answer":"Quiero que vea al hombre.","steps":["I want that he sees: quiero que vea","the man is having the seeing done to him: a el hombre, which joins into al hombre"],"rules":["t71__subjunctive-trigger-verbs","t71__ver-subjunctive-veo","t71__personal-a"],"track":71,"source":"track"},{"id":"t71-08","type":"sentence","prompt":"I like that she visits the teacher. (female teacher)","answer":"Me gusta que visite a la profesora.","steps":["I like that: me gusta que + mood tense","she visits: visite","the teacher is having the visiting done to her, so clarify with a: a la profesora"],"rules":["t71__subjunctive-trigger-verbs","t71__personal-a"],"track":71,"source":"track"},{"id":"t71-x01","type":"sentence","prompt":"I hope that you understand Maria. (informal)","answer":"Espero que comprendas a María.","steps":["I hope that you understand: espero que comprendas","Maria is having it done to her: a María"],"rules":["t71__subjunctive-trigger-verbs","t71__personal-a"],"track":71,"source":"extension","difficulty":1},{"id":"t71-x02","type":"sentence","prompt":"I want you to count on the teacher. (informal, female teacher)","answer":"Quiero que cuentes con la profesora.","steps":["I want that you count: quiero que cuentes","on the teacher: con la profesora - con is already there, so no extra a is needed"],"rules":["t71__subjunctive-trigger-verbs"],"track":71,"source":"extension","difficulty":2,"note":"con already shows who the counting goes to, so the personal a doesn't stack on top of it."},{"id":"t71-x03","type":"sentence","prompt":"I hope that they tell Maria what is missing and that she counts on the man.","answer":"Espero que cuenten a María lo que falta y que cuente con el hombre.","steps":["I hope that they tell: espero que cuenten","Maria, having it told to her: a María","what is missing: lo que falta","and that she counts on the man: y que cuente con el hombre"],"rules":["t71__subjunctive-trigger-verbs","t71__personal-a","t71__hace-falta","t71__lo-que"],"track":71,"source":"extension","difficulty":3}],"blurb":"contar for telling and for counting on, and the a that marks out a person","sectionIndex":8},{"id":"t72","label":"Track 72","tracks":[72],"rules":[{"id":"t72__reflexive-verbs-alone","family":"reflexive-verbs-alone","title":"Some verbs don't like to be alone (olvidarse, quedarse)","explanation":"A verb like olvidar (to forget) or quedar (to stay) needs either a direct object (what's being forgotten/left) or, if you're not naming one, the reflexive version instead - olvidarse, quedarse - literally forgetting/staying yourself. Say the thing, or say the reflexive; don't leave the verb bare.","examples":["lo olvido - I forget it","me olvido - I forget (myself)","no te quedes - don't stay (yourself)","olvídese - forget (yourself, formal)"],"track":72},{"id":"t72__command-word-order","family":"command-word-order","title":"Little words jump to the end, but only for positive orders","explanation":"Small words like me, lo, se normally come before the verb. With a positive command (telling someone TO do something), they break that rule and attach onto the end of the verb instead, written as one word. With a negative command (telling someone NOT to do something), they stay in their normal spot before the verb. This shift is one of the things that helps your ear catch that it's a command.","examples":["espérenme - wait for me (positive)","no los esperen - don't wait for them (negative, back in front)","cómalo - eat it (positive)","no lo coma - don't eat it (negative, back in front)"],"track":72},{"id":"t72__command-mood","family":"command-mood","title":"Orders are made with the mood tense","explanation":"To tell someone to do or not do something, you take the you-don't form of the verb and switch it into the mood tense - this works for informal negative, formal (positive and negative), and plural (positive and negative) orders. There's one exception: positive informal (tú) orders, which use a shortcut instead.","examples":["no hables - don't speak","no te quedes aquí - don't stay here","coman - eat! (plural)","no lo coma - don't eat it (formal)"],"track":72},{"id":"t72__positive-informal-shortcut","family":"positive-informal-shortcut","title":"The one command that skips the mood tense: positive tú orders","explanation":"Positive informal (tú) commands don't use the mood tense - Spanish takes a shortcut instead, because this is such common everyday speech. Take the tú/you-informal present form and drop the final s: compras becomes compra. This lands on the same form as he/she/it, but tone of voice and the attached little word (lo, me...) make it obviously a command.","examples":["compra - buy (from compras)","cómpralo - buy it","cállate - shut up (quiet yourself)"],"track":72},{"id":"t72__lo-que","family":"lo-que","title":"lo que: what, when it's not a question","explanation":"When \"what\" isn't asking a question but pointing at a thing (\"I saw what you're doing\"), it's lo que, not qué. Qué stays for actual questions.","examples":["lo que hablamos - what we spoke about","lo que falta - what's missing","lo que comen - what they eat"],"track":70},{"id":"t72__hace-falta","family":"hace-falta","title":"falta/faltar - to lack, to be missing, and hace falta","explanation":"Faltar is to lack or be missing; the noun falta means a lack (falta de respeto - a lack of respect). Hace falta, literally \"it makes lack\", is a very common way to say it's necessary, and it's followed by que + mood tense just like quiero que.","examples":["lo que falta - what's missing","hace falta que comamos pronto - it's necessary that we eat soon","falta de consideración - lack of consideration"],"track":70}],"drills":[{"id":"t72-01","type":"sentence","prompt":"Don't speak. (informal)","answer":"No hables.","steps":["you don't speak: no hablas","switch to the mood tense for the order: no hables"],"rules":["t72__command-mood"],"track":72,"source":"track"},{"id":"t72-02","type":"sentence","prompt":"Don't stay here. (informal)","answer":"No te quedes aquí.","steps":["you don't stay: no te quedas","switch to the mood tense: no te quedes","here: aquí"],"rules":["t72__command-mood","t72__reflexive-verbs-alone"],"track":72,"source":"track"},{"id":"t72-03","type":"sentence","prompt":"Don't give it to him. (informal)","answer":"No se lo des a él.","steps":["don't give: no des","it to him: se lo, in front of the verb since this is negative","to clarify it's him: a él"],"rules":["t72__command-mood","t72__command-word-order"],"track":72,"source":"track"},{"id":"t72-04","type":"word","prompt":"Eat! (to more than one person)","answer":"Coman","steps":["orders to more than one person also use the mood tense: coman"],"rules":["t72__command-mood"],"track":72,"source":"track"},{"id":"t72-05","type":"sentence","prompt":"Wait for me! (to more than one person)","answer":"Espérenme.","steps":["wait, plural order: esperen","for me: just me, no for needed, attached on the end since this is positive: espérenme"],"rules":["t72__command-mood","t72__command-word-order"],"track":72,"source":"track"},{"id":"t72-06","type":"sentence","prompt":"Don't wait for them. (to more than one person)","answer":"No los esperen.","steps":["don't wait: no esperen","them: los, back in front of the verb since it's negative"],"rules":["t72__command-mood","t72__command-word-order"],"track":72,"source":"track"},{"id":"t72-07","type":"sentence","prompt":"Eat it. (formal)","answer":"Cómalo.","steps":["eat, formal order: coma","it: lo, attached on the end since it's positive: cómalo"],"rules":["t72__command-mood","t72__command-word-order"],"track":72,"source":"track"},{"id":"t72-08","type":"sentence","prompt":"Don't eat it. (formal)","answer":"No lo coma.","steps":["don't eat: no coma","it: lo, back in front since it's negative"],"rules":["t72__command-mood","t72__command-word-order"],"track":72,"source":"track"},{"id":"t72-09","type":"sentence","prompt":"Forget it. (formal)","answer":"Olvídelo.","steps":["forget, formal order: olvide","it: lo, attached on the end: olvídelo, since olvidar needs to say what's being forgotten"],"rules":["t72__command-mood","t72__command-word-order","t72__reflexive-verbs-alone"],"track":72,"source":"track"},{"id":"t72-10","type":"sentence","prompt":"Don't forget. (to more than one person)","answer":"No se olviden.","steps":["don't forget: no olviden","without naming what's forgotten, olvidar needs the reflexive: se, in front since negative"],"rules":["t72__command-mood","t72__reflexive-verbs-alone"],"track":72,"source":"track"},{"id":"t72-11","type":"sentence","prompt":"Let's not forget it.","answer":"No lo olvidemos.","steps":["let's not forget: no olvidemos, the we-form of the mood tense","it: lo, in front since negative"],"rules":["t72__command-mood"],"track":72,"source":"track"},{"id":"t72-12","type":"sentence","prompt":"Buy what is missing. (to more than one person)","answer":"Compren lo que falta.","steps":["buy, plural order: compren","what is missing: lo que falta"],"rules":["t72__command-mood","t72__lo-que","t72__hace-falta"],"track":72,"source":"track"},{"id":"t72-13","type":"sentence","prompt":"Buy it. (informal)","answer":"Cómpralo.","steps":["you buy: compras","drop the s for the order: compra","it: lo, attached on the end since positive: cómpralo"],"rules":["t72__positive-informal-shortcut","t72__command-word-order"],"track":72,"source":"track"},{"id":"t72-x01","type":"sentence","prompt":"Give it to me. (informal)","answer":"Dámelo.","steps":["you give: das","drop the s for the order: da","to me, then it: me before lo, both attached on the end since positive: dámelo"],"rules":["t72__positive-informal-shortcut","t72__command-word-order"],"track":72,"source":"extension","difficulty":1},{"id":"t72-x02","type":"sentence","prompt":"Wait for us. (to more than one person)","answer":"Espérennos.","steps":["wait, plural order: esperen","us: nos, attached on the end since positive: espérennos"],"rules":["t72__command-mood","t72__command-word-order"],"track":72,"source":"extension","difficulty":1},{"id":"t72-x03","type":"sentence","prompt":"Don't buy what is missing. (to more than one person)","answer":"No compren lo que falta.","steps":["don't buy: no compren","what is missing: lo que falta"],"rules":["t72__command-mood","t72__lo-que","t72__hace-falta"],"track":72,"source":"extension","difficulty":2},{"id":"t72-x04","type":"sentence","prompt":"Buy what Maria needs and don't forget it. (to more than one person)","answer":"Compren lo que necesita María y no lo olviden.","steps":["buy what Maria needs: compren lo que necesita María","and don't forget it: y no lo olviden, it stays in front since negative"],"rules":["t72__command-mood","t72__lo-que"],"track":72,"source":"extension","difficulty":3}],"blurb":"Orders built out of the mood tense, and where the little words jump to","sectionIndex":8},{"id":"t73","label":"Track 73","tracks":[73],"rules":[{"id":"t73__command-mood","family":"command-mood","title":"Orders are made with the mood tense","explanation":"To tell someone to do or not do something, you take the you-don't form of the verb and switch it into the mood tense - this works for informal negative, formal (positive and negative), and plural (positive and negative) orders. There's one exception: positive informal (tú) orders, which use a shortcut instead.","examples":["no hables - don't speak","no te quedes aquí - don't stay here","coman - eat! (plural)","no lo coma - don't eat it (formal)"],"track":72},{"id":"t73__positive-informal-shortcut","family":"positive-informal-shortcut","title":"The one command that skips the mood tense: positive tú orders","explanation":"Positive informal (tú) commands don't use the mood tense - Spanish takes a shortcut instead, because this is such common everyday speech. Take the tú/you-informal present form and drop the final s: compras becomes compra. This lands on the same form as he/she/it, but tone of voice and the attached little word (lo, me...) make it obviously a command.","examples":["compra - buy (from compras)","cómpralo - buy it","cállate - shut up (quiet yourself)"],"track":72},{"id":"t73__ir-mood-irregular-vaya","family":"ir-mood-irregular-vaya","title":"The mood tense of ir: vaya","explanation":"The mood tense of ir (voy/va/vamos) is irregular, built from the root vaya. Add the normal mood-tense endings onto this root: vaya, vayas, vayamos, vayan.","examples":["vaya - that I/he/she go","vayamos - that we go","vayan - that they go","quiero que vayas - I want you to go"],"track":73},{"id":"t73__cuando-future-mood","family":"cuando-future-mood","title":"cuando + mood tense for future events","explanation":"When cuando (when) points at something in the future that hasn't happened yet, put the following verb in the mood tense. When cuando refers to something general or habitual, use the ordinary present tense instead.","examples":["Cuando hablamos. (generally, when we speak)","Cuando hablemos. (when we speak, future)","Cuando vayamos. (when we go, future)"],"track":73},{"id":"t73__que-mood-third-person-wish","family":"que-mood-third-person-wish","title":"que + mood tense = let him/her/them...","explanation":"To say what you want a third person (him, her, it, them) to do, say que followed by the verb in the mood tense. This gives the meaning 'let him/her/it/them...'.","examples":["Que espere. - Let him wait.","Que termine ya. - Let it finish already.","Que se calle. - Let him shut up."],"track":73}],"drills":[{"id":"t73-01","type":"sentence","prompt":"Wait. (order, informal)","answer":"Espera.","steps":["you wait: esperas","for an informal order, cut the final s: espera"],"rules":["t73__positive-informal-shortcut"],"track":73,"source":"track"},{"id":"t73-02","type":"sentence","prompt":"Let's not wait.","answer":"No esperemos.","steps":["we-form of esperar: esperemos (from earlier)","put no in front to negate the order"],"rules":["t73__command-mood"],"track":73,"source":"track"},{"id":"t73-03","type":"sentence","prompt":"Let him wait.","answer":"Que espere.","steps":["start with que","put esperar in the mood tense for él: espere"],"rules":["t73__que-mood-third-person-wish"],"track":73,"source":"track"},{"id":"t73-04","type":"sentence","prompt":"Let it finish already.","answer":"Que termine ya.","steps":["que + termine: mood tense of terminar for it","add ya for 'already'"],"rules":["t73__que-mood-third-person-wish"],"track":73,"source":"track"},{"id":"t73-05","type":"sentence","prompt":"Let him shut up.","answer":"Que se calle.","steps":["callarse is reflexive: to quiet oneself (from earlier)","que + se calle: mood tense of callarse for él"],"rules":["t73__que-mood-third-person-wish"],"track":73,"source":"track"},{"id":"t73-06","type":"sentence","prompt":"When we speak. (pointing at the future)","answer":"Cuando hablemos.","steps":["when: cuando, then the verb to speak: hablar","since this when-clause points at the future, put hablar in the mood tense: hablemos"],"rules":["t73__cuando-future-mood"],"track":73,"source":"track"},{"id":"t73-07","type":"sentence","prompt":"When we eat together, we will speak. (future)","answer":"Cuando comamos juntas, hablamos.","steps":["cuando + comer in the mood tense for the future: comamos","juntas for 'together' (feminine)","hablamos stays normal present, since cuando already set the future context"],"rules":["t73__cuando-future-mood"],"track":73,"source":"track","note":"juntos if not an all-female group."},{"id":"t73-08","type":"word","prompt":"we go - now in the mood tense","answer":"Vayamos","steps":["ir's mood tense root is irregular: vaya","add the we-ending: vayamos"],"rules":["t73__ir-mood-irregular-vaya"],"track":73,"source":"track"},{"id":"t73-09","type":"sentence","prompt":"We will see her when we go. (future)","answer":"La vemos cuando vayamos.","steps":["la vemos: we see her, stays normal present","cuando + vayamos: ir's mood tense for the future when-clause"],"rules":["t73__cuando-future-mood","t73__ir-mood-irregular-vaya"],"track":73,"source":"track"},{"id":"t73-x01","type":"sentence","prompt":"Let them wait.","answer":"Que esperen.","steps":["que + esperar in the mood tense for ellos: esperen"],"rules":["t73__que-mood-third-person-wish"],"track":73,"source":"extension","difficulty":1},{"id":"t73-x02","type":"sentence","prompt":"I want him to wait.","answer":"Quiero que espere.","steps":["I want that: quiero que","he waits, in the mood tense: espere"],"rules":["t73__que-mood-third-person-wish"],"track":73,"source":"extension","difficulty":2},{"id":"t73-x03","type":"sentence","prompt":"When we go, let them wait for us.","answer":"Cuando vayamos, que nos esperen.","steps":["cuando + vayamos for the future when-clause","que + esperen: mood tense of esperar for ellos","nos before the verb for 'us'"],"rules":["t73__cuando-future-mood","t73__ir-mood-irregular-vaya","t73__que-mood-third-person-wish"],"track":73,"source":"extension","difficulty":3}],"blurb":"que on its own for let him..., and cuando pointing at something not yet done","sectionIndex":8},{"id":"t74","label":"Track 74","tracks":[74],"rules":[{"id":"t74__mood-tense-formation","family":"mood-tense-formation","title":"Swap the ending group to build the mood tense","explanation":"To put a verb into the mood tense (the subjunctive), swap its ending group: -ar verbs borrow the -er/-ir endings, and -er/-ir verbs borrow the -ar endings. No new sounds are needed, you just think of the form in the other group.","examples":["habla -> hable - an -ar verb borrows the -er/-ir ending","hablamos -> hablemos - the same swap for we","como -> coma - an -er verb borrows the -ar ending"],"track":69},{"id":"t74__self-se","family":"self-se","title":"It happens to itself: se for it breaks, it sells","explanation":"When a verb's action isn't going out to anything else - it breaks, it burns, it sells, it changes - Spanish shows this with se in front of the verb, wrapping the sentence up without naming what's being acted on. Without se, the sentence sounds unfinished, like it's still waiting to hear what got broken.","examples":["romper -> se rompe - it breaks/gets broken","quemar -> la cena se quemaba - the dinner was burning","vender -> se vende - it sells itself / for sale"],"track":47},{"id":"t74__o-split-ue","family":"o-split-ue","title":"A stressed o in the root splits into ue","explanation":"In the present the stress lands on the second-to-last syllable of nearly every form, and that is what makes the root vowel vulnerable: the same stress that splits e into ie splits a stressed o into ue. Go back to the 'to' form, take the ending off, and if the root's o is about to take the stress it can become ue before you add your ending. The same shift shows up between English and Spanish words: port/puerto, force/fuerza, school/escuela.","examples":["poder -> pued- -> puedo","dormir -> duerm- -> duermo","encontrar -> encuentr- -> encuentro","mostrar -> muestr- -> muestro","colgar -> cuelg- -> cuelgo"],"track":16},{"id":"t74__para-in-order-to","family":"para-in-order-to","title":"para for 'to' when it means 'in order to'","explanation":"When English 'to' before a verb secretly means 'in order to', the plain infinitive isn't enough in Spanish - you must add para before it. If 'to' can't be swapped for 'in order to' without changing the meaning, you don't need para.","examples":["Hemos hablado para resolverlo. (We've spoken in order to resolve it.)","Estoy aquí para verte. - I'm here to see you.","Te he llamado para hablarlo. - I've called you to talk it over."],"track":52},{"id":"t74__hecho-irregular-participle","family":"hecho-irregular-participle","title":"hecho: done/made (and also 'fact')","explanation":"The form of hacer used after any version of haber (have) is the irregular hecho, meaning done or made. Hecho doubles as the noun for 'fact'.","examples":["He hecho. - I have done.","Lo han hecho. - They have done it."],"track":74},{"id":"t74__para-que-mood","family":"para-que-mood","title":"para que (so that) always takes the mood tense","explanation":"After para que, meaning 'so that', the following verb must be in the mood tense - you cannot shortcut it back to para + infinitive without changing the meaning.","examples":["Hemos cocinado para que coman. - We've cooked so that they eat.","Lo he hecho para que vuelvas. - I've done it so that you come back."],"track":74},{"id":"t74__e-to-i-stress-shift","family":"e-to-i-stress-shift","title":"Stressed e turns into i (elegir, seguir)","explanation":"In a few verbs like elegir (to choose) and seguir (to follow/continue), the stem e turns into an i whenever it is stressed, instead of splitting like most e-verbs. When the e is not stressed, as in the we-form, it just stays e.","examples":["elegir -> elijo - I choose, stressed","elegir -> elegimos - we choose, unstressed","seguir -> sigo - I follow, stressed"],"track":74},{"id":"t74__por-on-behalf","family":"por-on-behalf","title":"por for on someone's behalf, in their place","explanation":"You already have por for because of and para for genuinely-for-someone. This is one more job for por: doing something in someone's place, on their behalf. No quiero que elijas por mí - I don't want you choosing on my behalf, standing in for me.","examples":["no quiero que elijas por mí - I don't want you to choose for me","lo hago por ti - I'm doing it on your behalf"],"track":74}],"drills":[{"id":"t74-01","type":"word","prompt":"we choose","answer":"Elegimos","steps":["elegir's stem stays e- when it is not stressed, as in the we-form"],"rules":["t74__e-to-i-stress-shift"],"track":74,"source":"track"},{"id":"t74-02","type":"sentence","prompt":"I don't want you to choose for me. (on my behalf, informal)","answer":"No quiero que elijas por mí.","steps":["I don't want that: no quiero que","you choose, in the mood tense - and elegir's stressed e turns to i: elijas","on my behalf: por mí"],"rules":["t74__e-to-i-stress-shift","t74__por-on-behalf"],"track":74,"source":"track"},{"id":"t74-03","type":"sentence","prompt":"I don't want it to break.","answer":"No quiero que se rompa.","steps":["I don't want that: no quiero que","it breaks - nothing else is named as breaking it, so se rompa"],"rules":["t74__mood-tense-formation","t74__self-se"],"track":74,"source":"track"},{"id":"t74-04","type":"sentence","prompt":"We have met up in order to speak.","answer":"Nos hemos encontrado para hablar.","steps":["nos hemos encontrado: we have met up (from earlier)","para + hablar, since 'to speak' here implies in order to speak"],"rules":["t74__para-in-order-to"],"track":74,"source":"track"},{"id":"t74-05","type":"sentence","prompt":"We have cooked so that they eat.","answer":"Hemos cocinado para que coman.","steps":["hemos cocinado: we have cooked","para que + comer in the mood tense for ellos: coman"],"rules":["t74__para-que-mood"],"track":74,"source":"track"},{"id":"t74-06","type":"word","prompt":"you come back (informal)","answer":"Vuelves","steps":["volver's o splits to ue when stressed (from earlier)"],"rules":["t74__o-split-ue"],"track":74,"source":"track"},{"id":"t74-07","type":"sentence","prompt":"So that you come back. (informal)","answer":"Para que vuelvas.","steps":["para que + volver in the mood tense for tú: vuelvas"],"rules":["t74__para-que-mood"],"track":74,"source":"track"},{"id":"t74-08","type":"word","prompt":"I have done","answer":"He hecho","steps":["he: from haber (from earlier)","hecho: hacer's irregular form after haber"],"rules":["t74__hecho-irregular-participle"],"track":74,"source":"track"},{"id":"t74-09","type":"sentence","prompt":"They have done it so that we come back.","answer":"Lo han hecho para que volvamos.","steps":["lo han hecho: they have done it","para que + volver in the mood tense for nosotros: volvamos"],"rules":["t74__hecho-irregular-participle","t74__para-que-mood"],"track":74,"source":"track"},{"id":"t74-x01","type":"sentence","prompt":"I don't want you to choose for her. (informal)","answer":"No quiero que elijas por ella.","steps":["I don't want you to choose: no quiero que elijas","on her behalf: por ella"],"rules":["t74__e-to-i-stress-shift","t74__por-on-behalf"],"track":74,"source":"extension","difficulty":1},{"id":"t74-x02","type":"sentence","prompt":"We have met up in order to eat.","answer":"Nos hemos encontrado para comer.","steps":["we have met up: nos hemos encontrado","para + comer, since 'to eat' here implies in order to eat"],"rules":["t74__para-in-order-to"],"track":74,"source":"extension","difficulty":1},{"id":"t74-x03","type":"sentence","prompt":"I have done it so that she comes back.","answer":"Lo he hecho para que vuelva.","steps":["lo he hecho: I have done it","para que + volver in the mood tense for ella: vuelva"],"rules":["t74__hecho-irregular-participle","t74__para-que-mood"],"track":74,"source":"extension","difficulty":2},{"id":"t74-x04","type":"sentence","prompt":"I don't want you to choose for me so that you don't break it. (informal)","answer":"No quiero que elijas por mí para que no lo rompas.","steps":["I don't want you to choose on my behalf: no quiero que elijas por mí","so that: para que, which pulls in the mood tense","you don't break it: no lo rompas"],"rules":["t74__e-to-i-stress-shift","t74__por-on-behalf","t74__para-que-mood"],"track":74,"source":"extension","difficulty":3}],"blurb":"para que for so that, elegir's e turning to i, and por on someone's behalf","sectionIndex":8},{"id":"t75","label":"Track 75","tracks":[75],"rules":[{"id":"t75__haz-irregular-command","family":"haz-irregular-command","title":"haz: the irregular order for hacer","explanation":"The informal positive command normally comes from cutting the s off the you-form (haces -> hace), but hacer is irregular: its informal command is haz, spelled h-a-z.","examples":["Haz. (Do/make it - order)","Hazlo. - Do it."],"track":75},{"id":"t75__ever-words-mood","family":"ever-words-mood","title":"Mood tense turns where/how/what/when into -ever words","explanation":"Words like donde (where), como (how), lo que (what), and cuando (when) combine with a verb in the mood tense to shift from a specific thing into an open '-ever' version of it: wherever, however, whatever, whenever.","examples":["Hazlo donde quieras. - Do it wherever you want.","Hazlo como te guste. - Do it however you like.","Haz lo que prefieras. - Do whatever you prefer.","Cuando necesites. - Whenever you need."],"track":75},{"id":"t75__ser-mood-irregular-sea","family":"ser-mood-irregular-sea","title":"The mood tense of ser: sea","explanation":"The mood tense of ser (to be) is irregular, built from the root sea. Add the normal endings onto this root as needed.","examples":["sea","Prefiero que sea así. - I prefer that it be like this.","Sea lo que sea. - Whatever will be, will be."],"track":75},{"id":"t75__ir-mood-irregular-vaya","family":"ir-mood-irregular-vaya","title":"The mood tense of ir: vaya","explanation":"The mood tense of ir (voy/va/vamos) is irregular, built from the root vaya. Add the normal mood-tense endings onto this root: vaya, vayas, vayamos, vayan.","examples":["vaya - that I/he/she go","vayamos - that we go","vayan - that they go","quiero que vayas - I want you to go"],"track":73},{"id":"t75__e-to-i-stress-shift","family":"e-to-i-stress-shift","title":"Stressed e turns into i (elegir, seguir)","explanation":"In a few verbs like elegir (to choose) and seguir (to follow/continue), the stem e turns into an i whenever it is stressed, instead of splitting like most e-verbs. When the e is not stressed, as in the we-form, it just stays e.","examples":["elegir -> elijo - I choose, stressed","elegir -> elegimos - we choose, unstressed","seguir -> sigo - I follow, stressed"],"track":74}],"drills":[{"id":"t75-01","type":"sentence","prompt":"Do it.","answer":"Hazlo.","steps":["haz: hacer's irregular informal command (not hace)","lo attached to the end for 'it'"],"rules":["t75__haz-irregular-command"],"track":75,"source":"track"},{"id":"t75-02","type":"sentence","prompt":"Do it wherever you want. (informal order)","answer":"Hazlo donde quieras.","steps":["hazlo: do it","donde + querer in the mood tense for tú: quieras - this shifts where into wherever"],"rules":["t75__haz-irregular-command","t75__ever-words-mood"],"track":75,"source":"track"},{"id":"t75-03","type":"sentence","prompt":"Do it however you like. (informal)","answer":"Hazlo como te guste.","steps":["hazlo: do it","como + gustar in the mood tense: te guste - this shifts how into however"],"rules":["t75__ever-words-mood"],"track":75,"source":"track"},{"id":"t75-04","type":"sentence","prompt":"Do whatever you prefer. (informal)","answer":"Haz lo que prefieras.","steps":["haz lo que: do what","preferir in the mood tense for tú: prefieras - this shifts what into whatever"],"rules":["t75__haz-irregular-command","t75__ever-words-mood"],"track":75,"source":"track"},{"id":"t75-05","type":"sentence","prompt":"Eat whatever you prefer. (order, formal)","answer":"Coma lo que prefiera.","steps":["coma: the formal order for comer, mood tense (from earlier)","lo que prefiera: preferir in the mood tense for usted - whatever you prefer"],"rules":["t75__ever-words-mood"],"track":75,"source":"track"},{"id":"t75-06","type":"sentence","prompt":"Whenever you need. (informal)","answer":"Cuando necesites.","steps":["cuando + necesitar in the mood tense for tú: necesites - this shifts when into whenever"],"rules":["t75__ever-words-mood"],"track":75,"source":"track"},{"id":"t75-07","type":"word","prompt":"I follow / I continue","answer":"Sigo","steps":["seguir's stressed e turns into i, same pattern as elegir"],"rules":["t75__e-to-i-stress-shift"],"track":75,"source":"track"},{"id":"t75-08","type":"sentence","prompt":"I'll follow you wherever you go. (informal)","answer":"Te sigo adonde vayas.","steps":["te sigo: I follow you (present covers the future here)","adonde: to where","ir in the mood tense for tú: vayas - this shifts to where into to wherever"],"rules":["t75__ir-mood-irregular-vaya","t75__e-to-i-stress-shift","t75__ever-words-mood"],"track":75,"source":"track"},{"id":"t75-09","type":"sentence","prompt":"I prefer that it be like this.","answer":"Prefiero que sea así.","steps":["I prefer that: prefiero que","it be - ser's mood tense is irregular: sea","like this: así"],"rules":["t75__ser-mood-irregular-sea"],"track":75,"source":"track"},{"id":"t75-x01","type":"sentence","prompt":"Do it whenever you want. (informal order)","answer":"Hazlo cuando quieras.","steps":["hazlo: do it","cuando + quieras: whenever you want, same -ever pattern as donde quieras"],"rules":["t75__haz-irregular-command","t75__ever-words-mood"],"track":75,"source":"extension","difficulty":1},{"id":"t75-x02","type":"sentence","prompt":"Eat whatever you prefer. (order, formal, plural)","answer":"Coman lo que prefieran.","steps":["coman: the plural formal order for comer","lo que prefieran: preferir in the mood tense for ustedes"],"rules":["t75__ever-words-mood"],"track":75,"source":"extension","difficulty":1},{"id":"t75-x03","type":"sentence","prompt":"I want it to be like this.","answer":"Quiero que sea así.","steps":["I want that: quiero que","it be: sea","like this: así"],"rules":["t75__ser-mood-irregular-sea"],"track":75,"source":"extension","difficulty":2},{"id":"t75-x04","type":"sentence","prompt":"I don't want you to eat whatever you prefer wherever you want. (informal)","answer":"No quiero que comas lo que prefieras donde quieras.","steps":["no quiero que + comer in the mood tense for tú: comas","lo que prefieras: whatever you prefer","donde quieras: wherever you want"],"rules":["t75__ever-words-mood"],"track":75,"source":"extension","difficulty":3}],"blurb":"The mood tense turning donde, como and lo que into wherever, however, whatever","sectionIndex":8},{"id":"t76","label":"Track 76","tracks":[76],"rules":[{"id":"t76__hay-there-is-are","family":"hay-there-is-are","title":"hay = there is / there are","explanation":"hay covers both there is and there are without ever changing form.
