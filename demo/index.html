h can, so it slips an e onto the front. State becomes estar, Spanish becomes español, special becomes especial. Spot the English st-/sp-/sc- word and just add the e.","examples":["state -> estar","Spanish -> español","student -> estudiante","special -> especial","spatial -> espacial","strict -> estricto","spectacular -> espectacular"],"track":31}],"drills":[{"id":"t31-01","type":"word","prompt":"Spatial","answer":"Espacial","steps":["same word as English, spatial -> espacial","add the e on the front: espacial"],"rules":["t31__extra-e"],"track":31,"source":"track"},{"id":"t31-02","type":"word","prompt":"Strict","answer":"Estricto","steps":["same word as English, strict -> estricto","add the e on the front: estricto"],"rules":["t31__extra-e"],"track":31,"source":"track"},{"id":"t31-03","type":"word","prompt":"Spectacular","answer":"Espectacular","steps":["same word as English, spectacular -> espectacular","add the e on the front: espectacular"],"rules":["t31__extra-e"],"track":31,"source":"track"},{"id":"t31-04","type":"word","prompt":"The human (as a noun, not the adjective)","answer":"El humano","steps":["the: el","human as a noun: humano"],"rules":["t31__ser-forms"],"note":"As an adjective it comes after the noun: el ser humano, the human being.","track":31,"source":"track"},{"id":"t31-05","type":"sentence","prompt":"I am a student.","answer":"Soy estudiante.","steps":["I am: soy","student: estudiante, with the extra e"],"rules":["t31__ser-forms","t31__extra-e"],"track":31,"source":"track"},{"id":"t31-06","type":"sentence","prompt":"It is possible.","answer":"Es posible.","steps":["it is: es","possible: posible"],"rules":["t31__ser-forms"],"track":31,"source":"track"},{"id":"t31-07","type":"word","prompt":"They are / you guys are","answer":"Son","steps":["they/you-guys form of ser: son"],"rules":["t31__ser-forms"],"track":31,"source":"track"},{"id":"t31-08","type":"word","prompt":"we are (work it out from they are)","answer":"Somos","steps":["start from son (they are)","take off the ending for they, add the ending for we (working backwards, from earlier)","son -> somos"],"rules":["t31__ser-forms"],"track":31,"source":"track"},{"id":"t31-09","type":"word","prompt":"You are (informal)","answer":"Eres","steps":["the odd one out among ser's forms: eres"],"rules":["t31__ser-forms"],"track":31,"source":"track"},{"id":"t31-10","type":"sentence","prompt":"He is. (emphatic)","answer":"Él es.","steps":["he: él","is: es"],"rules":["t31__ser-forms"],"track":31,"source":"track"},{"id":"t31-11","type":"sentence","prompt":"They are. (emphatic, an all-female group)","answer":"Ellas son.","steps":["they, all-female: ellas (make she plural)","are: son"],"rules":["t31__ser-forms"],"track":31,"source":"track"},{"id":"t31-12","type":"sentence","prompt":"We are. (an all-female group)","answer":"Nosotras somos.","steps":["we, all-female: nosotras","are: somos"],"rules":["t31__ser-forms"],"track":31,"source":"track"},{"id":"t31-13","type":"sentence","prompt":"How is he doing?","answer":"¿Cómo está?","steps":["how: cómo","is he doing (a state): está"],"rules":["t31__como-es-vs-esta"],"track":31,"source":"track"},{"id":"t31-14","type":"sentence","prompt":"What is he like?","answer":"¿Cómo es?","steps":["how/what: cómo","is he, as a characteristic: es"],"rules":["t31__como-es-vs-esta"],"track":31,"source":"track"},{"id":"t31-x01","type":"word","prompt":"Special","answer":"Especial","steps":["same word as English, special -> especial","add the e on the front: especial"],"rules":["t31__extra-e"],"difficulty":1,"track":31,"source":"extension"},{"id":"t31-x02","type":"sentence","prompt":"She is. (emphatic)","answer":"Ella es.","steps":["she: ella","is: es"],"rules":["t31__ser-forms"],"difficulty":1,"track":31,"source":"extension"},{"id":"t31-x03","type":"sentence","prompt":"I am a special student.","answer":"Soy un estudiante especial.","steps":["I am: soy","a: un","student: estudiante","special: especial"],"rules":["t31__ser-forms","t31__extra-e"],"difficulty":2,"track":31,"source":"extension"},{"id":"t31-x04","type":"sentence","prompt":"How is she doing?","answer":"¿Cómo está ella?","steps":["how: cómo","is she doing (a state): está","she: ella"],"rules":["t31__como-es-vs-esta","t31__ser-forms"],"difficulty":2,"track":31,"source":"extension"},{"id":"t31-x05","type":"sentence","prompt":"What is he like? He is a strict student.","answer":"¿Cómo es? Es un estudiante estricto.","steps":["what is he like: ¿cómo es?","he is: es","a: un","student: estudiante","strict: estricto"],"rules":["t31__como-es-vs-esta","t31__ser-forms","t31__extra-e"],"difficulty":3,"track":31,"source":"extension"}],"blurb":"Initial e- before sp-/st- in Spanish, ser fully conjugated (soy, eres, es, son)","sectionIndex":4},{"id":"t32","label":"Track 32","tracks":[32],"rules":[{"id":"t32__persona-safety-net","family":"persona-safety-net","title":"The persona safety net (soy una persona ocupada)","explanation":"When you're not sure whether an adjective is allowed to switch to ser, say I am a person instead: soy una persona, then hang the adjective off persona. Persona is always feminine no matter who's talking, so the adjective ending follows persona, not you, and the whole sentence is guaranteed correct because soy una persona is safely a characteristic.","examples":["soy una persona libre -> I am a free person","soy una persona ocupada -> I am a busy person","es una persona preocupada -> he is a worried person"],"track":32},{"id":"t32__ser-estar-adjective-shift","family":"ser-estar-adjective-shift","title":"Adjectives that change meaning with ser or estar","explanation":"Some adjectives mean one thing with estar (a state) and a different thing with ser (a characteristic) - the same word does two jobs depending which verb carries it. Aburrido with estar is bored, with ser it's boring. Listo with estar is ready, with ser it's smart. Bueno about a person with ser means good/good at something, with estar it means attractive or in good form.","examples":["está aburrido -> he is bored","es aburrido -> he is boring / it's boring","estoy listo -> I am ready","soy listo -> I am smart","son buenos -> they are good - people","está bueno -> he is attractive/in good form"],"track":32},{"id":"t32__de-from","family":"de-from","title":"de for from/of, and de dónde for where from","explanation":"De means from or of. Where someone is from is a characteristic, not a state, so you ask with ser, not estar, and de goes at the front: de dónde. De dónde eres, de dónde es, de dónde son. That's different from asking where someone physically is right now, which is a state and stays with estar and plain dónde - dónde están.","examples":["from/of: de","¿De dónde eres? -> where are you from? (informal)","¿De dónde es? -> where is he from?","¿De dónde son? -> where are they from?"],"track":32},{"id":"t32__ser-forms","family":"ser-forms","title":"The forms of ser: soy, es, son, somos, eres","explanation":"Ser is the other word for to be, used for being (un ser is a being). I am is soy - it ends oy like estoy, one of only four verbs that use oy instead of o for I (voy, doy, estoy, soy). He/she/it/you(formal) is is es, they/you-guys are is son, and you work backwards from son to get we are: take off the ending that means they and bump on the one for we, giving somos. You(informal) are is the odd one out: eres.","examples":["I am: soy - yo soy","he/she/you(formal) is: es (él es, ella es)","they/you guys are: son - ellos son, ustedes son","son -> somos - we are, working backwards","you (informal) are: eres (tú eres)"],"track":31},{"id":"t32__noun-to-verb-r","family":"noun-to-verb-r","title":"Make a verb out of a noun by putting -r on the end","explanation":"You've been doing this with -ación words; it isn't limited to them. Take a noun that already ends in a vowel and stick an -r on: la cocina (the kitchen) gives cocinar, to cook. English kept the same root in concoction - literally 'with cooking'.","examples":["la cocina -> cocinar - to cook","cocinar -> cocino - I cook","concoction = con + cocción, with-cooking"],"track":25}],"drills":[{"id":"t32-01","type":"sentence","prompt":"It is boring.","answer":"Es aburrido.","steps":["boring, as a characteristic: es aburrido"],"rules":["t32__ser-estar-adjective-shift"],"track":32,"source":"track"},{"id":"t32-02","type":"sentence","prompt":"He is bored.","answer":"Está aburrido.","steps":["bored, as a state: está aburrido"],"rules":["t32__ser-estar-adjective-shift"],"track":32,"source":"track"},{"id":"t32-03","type":"sentence","prompt":"She is boring.","answer":"Es aburrida.","steps":["boring, as a characteristic: es aburrida","feminine ending because she's boring: aburrida"],"rules":["t32__ser-estar-adjective-shift"],"track":32,"source":"track"},{"id":"t32-04","type":"sentence","prompt":"They are bored.","answer":"Están aburridos.","steps":["bored, as a state, they: están aburridos"],"rules":["t32__ser-estar-adjective-shift"],"track":32,"source":"track"},{"id":"t32-05","type":"word","prompt":"To liberate","answer":"Liberar","steps":["libre is free, and a noun or adjective ending in a vowel takes -r to become a verb","liberar - to liberate, to set free"],"rules":["t32__noun-to-verb-r"],"track":32,"source":"track"},{"id":"t32-06","type":"sentence","prompt":"Where is he from?","answer":"¿De dónde es?","steps":["from where: de dónde","is he (a characteristic): es"],"rules":["t32__de-from"],"track":32,"source":"track"},{"id":"t32-07","type":"sentence","prompt":"Where are you from? (informal)","answer":"¿De dónde eres?","steps":["from where: de dónde","are you, informal: eres"],"rules":["t32__de-from"],"track":32,"source":"track"},{"id":"t32-08","type":"sentence","prompt":"Where are they from?","answer":"¿De dónde son?","steps":["from where: de dónde","are they: son"],"rules":["t32__de-from"],"track":32,"source":"track"},{"id":"t32-09","type":"sentence","prompt":"Where are they? (their location)","answer":"¿Dónde están?","steps":["where: dónde","are they, a state of location (from earlier): están","no de here - this is location, not origin"],"rules":["t32__de-from"],"track":32,"source":"track"},{"id":"t32-10","type":"sentence","prompt":"I am free. (from work or exams)","answer":"Estoy libre.","steps":["free, as a state: estoy libre"],"rules":["t32__ser-estar-adjective-shift"],"track":32,"source":"track"},{"id":"t32-11","type":"sentence","prompt":"I am a free person.","answer":"Soy una persona libre.","steps":["I am: soy","a person: una persona","free: libre"],"rules":["t32__persona-safety-net"],"track":32,"source":"track"},{"id":"t32-12","type":"sentence","prompt":"I am busy.","answer":"Estoy ocupado.","steps":["busy, as a state: estoy ocupado"],"rules":["t32__ser-estar-adjective-shift"],"note":"A woman would say estoy ocupada.","track":32,"source":"track"},{"id":"t32-13","type":"sentence","prompt":"I am a busy person.","answer":"Soy una persona ocupada.","steps":["I am: soy","a person: una persona","busy: ocupada (persona is feminine, so the ending follows persona)"],"rules":["t32__persona-safety-net"],"track":32,"source":"track"},{"id":"t32-14","type":"sentence","prompt":"He is a worried person.","answer":"Es una persona preocupada.","steps":["he is: es","a person: una persona","worried: preocupada"],"rules":["t32__persona-safety-net"],"track":32,"source":"track"},{"id":"t32-x01","type":"sentence","prompt":"Where are you from? (formal)","answer":"¿De dónde es usted?","steps":["from where: de dónde","are you, formal: es","you (formal): usted"],"rules":["t32__de-from","t32__ser-forms"],"difficulty":1,"track":32,"source":"extension"},{"id":"t32-x02","type":"sentence","prompt":"I am a married person.","answer":"Soy una persona casada.","steps":["I am: soy","a person: una persona","married: casada, literally housed, from casa"],"rules":["t32__persona-safety-net"],"difficulty":1,"track":32,"source":"extension"},{"id":"t32-x03","type":"sentence","prompt":"We are free people.","answer":"Somos personas libres.","steps":["we are: somos","people: personas","free: libres"],"rules":["t32__persona-safety-net","t32__ser-forms"],"difficulty":2,"track":32,"source":"extension"},{"id":"t32-x04","type":"sentence","prompt":"I am a busy person, and now I am free.","answer":"Soy una persona ocupada, y ahora estoy libre.","steps":["I am a busy person: soy una persona ocupada","and: y (from earlier)","now: ahora (from earlier)","I am free (a state): estoy libre"],"rules":["t32__persona-safety-net","t32__ser-estar-adjective-shift"],"difficulty":3,"track":32,"source":"extension"}],"blurb":"Ser/estar changing adjective meaning (aburrido, libre, ocupado) plus persona safety net","sectionIndex":4},{"id":"t33","label":"Track 33","tracks":[33],"rules":[{"id":"t33__tan-so","family":"tan-so","title":"tan for so (so tired, so bored)","explanation":"Tan is the word for so, as an intensifier before an adjective - I am so tired, it is so boring. It just slots in before the adjective, after the verb.","examples":["estoy tan cansado -> I am so tired","es tan aburrido -> it is so boring"],"track":33},{"id":"t33__feliz-no-shift","family":"feliz-no-shift","title":"feliz - happy either way","explanation":"Some adjectives, like feliz (happy), don't change meaning between ser and estar at all - you can say estoy feliz or soy feliz and both just mean happy, as a state or as a characteristic. There's no way to predict which adjectives behave like this other than listening, so if you're unsure, fall back on the persona safety net.","examples":["estoy feliz -> I am happy - state","soy feliz -> I am happy - characteristic"],"track":33},{"id":"t33__persona-safety-net","family":"persona-safety-net","title":"The persona safety net (soy una persona ocupada)","explanation":"When you're not sure whether an adjective is allowed to switch to ser, say I am a person instead: soy una persona, then hang the adjective off persona. Persona is always feminine no matter who's talking, so the adjective ending follows persona, not you, and the whole sentence is guaranteed correct because soy una persona is safely a characteristic.","examples":["soy una persona libre -> I am a free person","soy una persona ocupada -> I am a busy person","es una persona preocupada -> he is a worried person"],"track":32},{"id":"t33__como-es-vs-esta","family":"como-es-vs-esta","title":"cómo es vs cómo está (what's he like vs how's he doing)","explanation":"Cómo means how. Ask cómo está and you're asking about a state - how someone is doing right now. Ask cómo es and you're asking about a characteristic - what someone is like as a person.","examples":["¿Cómo está? -> how is he doing?","¿Cómo es? -> what is he like?"],"track":31},{"id":"t33__ser-estar-adjective-shift","family":"ser-estar-adjective-shift","title":"Adjectives that change meaning with ser or estar","explanation":"Some adjectives mean one thing with estar (a state) and a different thing with ser (a characteristic) - the same word does two jobs depending which verb carries it. Aburrido with estar is bored, with ser it's boring. Listo with estar is ready, with ser it's smart. Bueno about a person with ser means good/good at something, with estar it means attractive or in good form.","examples":["está aburrido -> he is bored","es aburrido -> he is boring / it's boring","estoy listo -> I am ready","soy listo -> I am smart","son buenos -> they are good - people","está bueno -> he is attractive/in good form"],"track":32}],"drills":[{"id":"t33-01","type":"sentence","prompt":"I am ready.","answer":"Estoy listo.","steps":["ready, as a state: estoy listo"],"rules":["t33__ser-estar-adjective-shift"],"note":"A woman would say estoy lista.","track":33,"source":"track"},{"id":"t33-02","type":"sentence","prompt":"We are ready.","answer":"Estamos listos.","steps":["ready, as a state, we: estamos listos"],"rules":["t33__ser-estar-adjective-shift"],"track":33,"source":"track"},{"id":"t33-03","type":"sentence","prompt":"We are ready. (all-female group)","answer":"Estamos listas.","steps":["ready, as a state, we, all-female: estamos listas"],"rules":["t33__ser-estar-adjective-shift"],"track":33,"source":"track"},{"id":"t33-04","type":"sentence","prompt":"He is smart.","answer":"Es listo.","steps":["listo as a characteristic means smart, not ready: es listo"],"rules":["t33__ser-estar-adjective-shift"],"track":33,"source":"track"},{"id":"t33-05","type":"sentence","prompt":"You are very smart. (informal, to a woman)","answer":"Eres muy lista.","steps":["you are, informal: eres","very: muy","smart, feminine: lista"],"rules":["t33__ser-estar-adjective-shift"],"track":33,"source":"track"},{"id":"t33-06","type":"sentence","prompt":"I am so tired.","answer":"Estoy tan cansado.","steps":["I am: estoy","so: tan","tired: cansado"],"rules":["t33__tan-so"],"track":33,"source":"track"},{"id":"t33-07","type":"sentence","prompt":"I am so bored. (a woman speaking)","answer":"Estoy tan aburrida.","steps":["I am, as a state: estoy","so: tan","bored: aburrida"],"rules":["t33__tan-so","t33__ser-estar-adjective-shift"],"track":33,"source":"track"},{"id":"t33-08","type":"sentence","prompt":"It is so boring.","answer":"Es tan aburrido.","steps":["it is, as a characteristic: es","so: tan","boring: aburrido"],"rules":["t33__tan-so","t33__ser-estar-adjective-shift"],"track":33,"source":"track"},{"id":"t33-09","type":"sentence","prompt":"They are good. (they are good people, or good at something)","answer":"Son buenos.","steps":["good, as a characteristic about people: son buenos"],"rules":["t33__ser-estar-adjective-shift"],"track":33,"source":"track"},{"id":"t33-10","type":"sentence","prompt":"He is good. (attractive, in good form)","answer":"Está bueno.","steps":["bueno with estar, about a person: attractive/in good form: está bueno"],"rules":["t33__ser-estar-adjective-shift"],"track":33,"source":"track"},{"id":"t33-11","type":"sentence","prompt":"I want to know how he is doing.","answer":"Quiero saber cómo está.","steps":["I want: quiero (from earlier)","to know: saber","how is he doing, a state: cómo está"],"rules":["t33__como-es-vs-esta"],"track":33,"source":"track"},{"id":"t33-12","type":"sentence","prompt":"I am happy. (as a state)","answer":"Estoy feliz.","steps":["I am, a state: estoy","happy: feliz"],"rules":["t33__feliz-no-shift"],"track":33,"source":"track"},{"id":"t33-13","type":"sentence","prompt":"I am happy. (as a characteristic)","answer":"Soy feliz.","steps":["I am, a characteristic: soy","happy: feliz"],"rules":["t33__feliz-no-shift"],"track":33,"source":"track"},{"id":"t33-14","type":"sentence","prompt":"I am a happy person.","answer":"Soy una persona feliz.","steps":["I am: soy","a person: una persona","happy: feliz"],"rules":["t33__persona-safety-net","t33__feliz-no-shift"],"track":33,"source":"track"},{"id":"t33-x01","type":"word","prompt":"So happy","answer":"Tan feliz","steps":["so: tan","happy: feliz"],"rules":["t33__tan-so"],"difficulty":1,"track":33,"source":"extension"},{"id":"t33-x02","type":"sentence","prompt":"I am so smart.","answer":"Soy tan listo.","steps":["I am, a characteristic: soy","so: tan","smart: listo"],"rules":["t33__tan-so","t33__ser-estar-adjective-shift"],"difficulty":1,"track":33,"source":"extension"},{"id":"t33-x03","type":"sentence","prompt":"We are so ready.","answer":"Estamos tan listos.","steps":["we are, a state: estamos","so: tan","ready: listos"],"rules":["t33__tan-so","t33__ser-estar-adjective-shift"],"difficulty":2,"track":33,"source":"extension"},{"id":"t33-x04","type":"sentence","prompt":"She is a happy person.","answer":"Es una persona feliz.","steps":["she is: es","a person: una persona","happy: feliz"],"rules":["t33__persona-safety-net","t33__feliz-no-shift"],"difficulty":2,"track":33,"source":"extension"},{"id":"t33-x05","type":"sentence","prompt":"I am not busy, I am free, and I am so happy.","answer":"No estoy ocupado, estoy libre, y estoy tan feliz.","steps":["not: no (from earlier)","I am busy, a state: estoy ocupado","I am free: estoy libre","and: y (from earlier)","so: tan","happy: feliz"],"rules":["t33__ser-estar-adjective-shift","t33__tan-so"],"difficulty":3,"track":33,"source":"extension"}],"blurb":"Ser/estar meaning shifts with listo, bueno, feliz, and tan for so","sectionIndex":4},{"id":"t34","label":"Track 34","tracks":[34],"rules":[{"id":"t34__er-ir-to-iendo","family":"er-ir-to-iendo","title":"-er/-ir verbs: the right-now -ing","explanation":"For -er and -ir verbs, take off the -er or -ir and put -iendo in its place instead of -ando. Same idea as the -ar version, just a different ending, and it also always pairs with estar.","examples":["comer -> comiendo -> estoy comiendo","vender -> vendiendo -> están vendiendo","salir -> saliendo -> estoy saliendo"],"track":34},{"id":"t34__estoy-ing-right-now","family":"estoy-ing-right-now","title":"Only use -ing for right now","explanation":"Estar always goes with the -ando/-iendo form, because being in the middle of doing something is a state. But this whole structure is reserved for what's happening in this exact moment. For the future or for habits, Spanish just uses the plain present tense, resisting the English urge to say '-ing' everywhere.","examples":["Lo preparo mañana (plain present, future) vs. Lo estoy preparando (right now)","Espero aquí vs. Estoy esperando aquí - right now"],"track":34},{"id":"t34__gerund-pronoun-placement","family":"gerund-pronoun-placement","title":"The pronoun can sit before estar or stick onto the -ando/-iendo","explanation":"With these estar + -ando/-iendo structures, the object pronoun (lo, los...) can go either right before the conjugated estar, or attached onto the end of the -ando/-iendo word itself. Both mean exactly the same thing.","examples":["Lo estoy preparando = Estoy preparándolo","Los están vendiendo = Están vendiéndolos"],"track":34},{"id":"t34__ar-to-ando","family":"ar-to-ando","title":"-ar verbs: the right-now -ing","explanation":"To build the '-ing' form of an -ar verb, take off the -ar and put -ando in its place. This form never stands alone in Spanish; it always pairs with estar (see estoy-ing-right-now).","examples":["hablar -> hablando -> estoy hablando","preparar -> preparando -> estoy preparando","comprar -> comprando -> estoy comprando"],"track":34}],"drills":[{"id":"t34-01","type":"sentence","prompt":"I am waiting here, right now.","answer":"Estoy esperando aquí.","steps":["I am: estoy","wait -> waiting: esperar, take off -ar, add -ando -> esperando","here: aquí"],"rules":["t34__ar-to-ando","t34__estoy-ing-right-now"],"track":34,"source":"track"},{"id":"t34-02","type":"sentence","prompt":"I am preparing it tomorrow.","answer":"Lo preparo mañana.","steps":["it: lo, out at the front","future context, so plain present, not -ing: preparo","tomorrow: mañana"],"rules":["t34__estoy-ing-right-now"],"track":34,"source":"track","note":"Contrast with the next drill: a future word like mañana keeps you in plain present, not -ando."},{"id":"t34-03","type":"sentence","prompt":"I am preparing it, right now.","answer":"Lo estoy preparando.","steps":["I am: estoy","prepare -> preparing: preparar, take off -ar, add -ando -> preparando","it: lo, either before estoy or stuck onto the end"],"rules":["t34__ar-to-ando","t34__estoy-ing-right-now","t34__gerund-pronoun-placement"],"track":34,"source":"track","note":"Also fine as Estoy preparándolo."},{"id":"t34-04","type":"sentence","prompt":"We are having breakfast, right now.","answer":"Estamos desayunando.","steps":["we are: estamos","to breakfast -> breakfasting: desayunar, take off -ar, add -ando -> desayunando"],"rules":["t34__ar-to-ando","t34__estoy-ing-right-now"],"track":34,"source":"track"},{"id":"t34-05","type":"sentence","prompt":"I am preparing it later.","answer":"Lo preparo más tarde.","steps":["it: lo, out at the front","future context again, so plain present: preparo","later: más tarde"],"rules":["t34__estoy-ing-right-now"],"track":34,"source":"track"},{"id":"t34-06","type":"word","prompt":"I am eating (right now)","answer":"Estoy comiendo","steps":["I am: estoy","eat -> eating: comer, take off -er, add -iendo -> comiendo"],"rules":["t34__er-ir-to-iendo","t34__estoy-ing-right-now"],"track":34,"source":"track"},{"id":"t34-07","type":"word","prompt":"He is eating (right now)","answer":"Está comiendo","steps":["he is: está","eat -> eating: comiendo"],"rules":["t34__er-ir-to-iendo","t34__estoy-ing-right-now"],"track":34,"source":"track"},{"id":"t34-08","type":"sentence","prompt":"They are selling it, right now.","answer":"Están vendiéndolo.","steps":["they are: están","sell -> selling: vender, take off -er, add -iendo -> vendiendo","it: attached to the end -olo, or Lo están vendiendo instead"],"rules":["t34__er-ir-to-iendo","t34__estoy-ing-right-now","t34__gerund-pronoun-placement"],"track":34,"source":"track"},{"id":"t34-x01","type":"sentence","prompt":"I am selling it, right now.","answer":"Lo estoy vendiendo.","steps":["it: lo, out at the front","I am: estoy","sell -> selling: vendiendo"],"rules":["t34__er-ir-to-iendo","t34__estoy-ing-right-now","t34__gerund-pronoun-placement"],"track":34,"source":"extension","difficulty":1,"note":"Also fine as Estoy vendiéndolo."},{"id":"t34-x02","type":"sentence","prompt":"Why are you eating it right now? (informal)","answer":"¿Por qué lo estás comiendo?","steps":["why: por qué (from earlier)","it: lo, out at the front","you are: estás","eat -> eating: comiendo"],"rules":["t34__er-ir-to-iendo","t34__estoy-ing-right-now"],"track":34,"source":"extension","difficulty":2},{"id":"t34-x03","type":"sentence","prompt":"We are preparing the breakfast right now, not tomorrow.","answer":"Estamos preparando el desayuno ahora, no mañana.","steps":["we are: estamos","prepare -> preparing: preparando","the breakfast: el desayuno","now, not tomorrow: ahora, no mañana"],"rules":["t34__ar-to-ando","t34__estoy-ing-right-now"],"track":34,"source":"extension","difficulty":3}],"blurb":"Present progressive with estar plus -ando/-iendo gerunds vs simple present","sectionIndex":4},{"id":"t35","label":"Track 35","tracks":[35],"rules":[{"id":"t35__ser-forms","family":"ser-forms","title":"The forms of ser: soy, es, son, somos, eres","explanation":"Ser is the other word for to be, used for being (un ser is a being). I am is soy - it ends oy like estoy, one of only four verbs that use oy instead of o for I (voy, doy, estoy, soy). He/she/it/you(formal) is is es, they/you-guys are is son, and you work backwards from son to get we are: take off the ending that means they and bump on the one for we, giving somos. You(informal) are is the odd one out: eres.","examples":["I am: soy - yo soy","he/she/you(formal) is: es (él es, ella es)","they/you guys are: son - ellos son, ustedes son","son -> somos - we are, working backwards","you (informal) are: eres (tú eres)"],"track":31},{"id":"t35__estar-siendo","family":"estar-siendo","title":"Being a characteristic just for now: estoy siendo","explanation":"Ser is the characteristic verb, so words like sincere or honest normally pair with soy/somos. But you can push ser through the same -ing machinery to get its irregular gerund, siendo, and use it with estar to say you're being that way right now rather than that it's a permanent trait.","examples":["ser -> siendo -> estoy siendo sincero","estamos siendo honestos"],"track":35},{"id":"t35__gerund-pronoun-placement","family":"gerund-pronoun-placement","title":"The pronoun can sit before estar or stick onto the -ando/-iendo","explanation":"With these estar + -ando/-iendo structures, the object pronoun (lo, los...) can go either right before the conjugated estar, or attached onto the end of the -ando/-iendo word itself. Both mean exactly the same thing.","examples":["Lo estoy preparando = Estoy preparándolo","Los están vendiendo = Están vendiéndolos"],"track":34},{"id":"t35__ar-to-ando","family":"ar-to-ando","title":"-ar verbs: the right-now -ing","explanation":"To build the '-ing' form of an -ar verb, take off the -ar and put -ando in its place. This form never stands alone in Spanish; it always pairs with estar (see estoy-ing-right-now).","examples":["hablar -> hablando -> estoy hablando","preparar -> preparando -> estoy preparando","comprar -> comprando -> estoy comprando"],"track":34},{"id":"t35__estoy-ing-right-now","family":"estoy-ing-right-now","title":"Only use -ing for right now","explanation":"Estar always goes with the -ando/-iendo form, because being in the middle of doing something is a state. But this whole structure is reserved for what's happening in this exact moment. For the future or for habits, Spanish just uses the plain present tense, resisting the English urge to say '-ing' everywhere.","examples":["Lo preparo mañana (plain present, future) vs. Lo estoy preparando (right now)","Espero aquí vs. Estoy esperando aquí - right now"],"track":34},{"id":"t35__er-ir-to-iendo","family":"er-ir-to-iendo","title":"-er/-ir verbs: the right-now -ing","explanation":"For -er and -ir verbs, take off the -er or -ir and put -iendo in its place instead of -ando. Same idea as the -ar version, just a different ending, and it also always pairs with estar.","examples":["comer -> comiendo -> estoy comiendo","vender -> vendiendo -> están vendiendo","salir -> saliendo -> estoy saliendo"],"track":34}],"drills":[{"id":"t35-01","type":"sentence","prompt":"I am sincere.","answer":"Soy sincero.","steps":["sincere is a characteristic, so ser: soy","sincere: sincero (or sincera)"],"rules":["t35__ser-forms"],"track":35,"source":"track","note":"Soy sincera if you're a woman."},{"id":"t35-02","type":"sentence","prompt":"I am being sincere, right now.","answer":"Estoy siendo sincero.","steps":["I am: estoy","be -> being: ser, irregular -ing -> siendo","sincere: sincero (or sincera)"],"rules":["t35__estar-siendo"],"track":35,"source":"track"},{"id":"t35-03","type":"sentence","prompt":"We are being honest.","answer":"Estamos siendo honestos.","steps":["we are: estamos","be -> being: siendo","honest: honestos"],"rules":["t35__estar-siendo"],"track":35,"source":"track"},{"id":"t35-04","type":"sentence","prompt":"I am leaving soon.","answer":"Salgo pronto.","steps":["I leave/go out: salgo (irregular, from earlier)","soon is not right now, so plain present: salgo","soon: pronto"],"rules":["t35__estoy-ing-right-now"],"track":35,"source":"track"},{"id":"t35-05","type":"sentence","prompt":"I am leaving, right now.","answer":"Estoy saliendo.","steps":["I am: estoy","leave -> leaving: salir, take off -ir, add -iendo -> saliendo"],"rules":["t35__er-ir-to-iendo","t35__estoy-ing-right-now"],"track":35,"source":"track"},{"id":"t35-06","type":"sentence","prompt":"I am buying them tomorrow.","answer":"Los compro mañana.","steps":["them: los, out at the front","future context, plain present: compro","tomorrow: mañana"],"rules":["t35__estoy-ing-right-now"],"track":35,"source":"track"},{"id":"t35-07","type":"sentence","prompt":"I am buying them next week.","answer":"Los compro la semana que viene.","steps":["them: los, out at the front","buy, future context, plain present: compro","next week, literally the week that comes: la semana que viene"],"rules":["t35__estoy-ing-right-now"],"track":35,"source":"track"},{"id":"t35-08","type":"sentence","prompt":"I am buying them now.","answer":"Estoy comprándolos ahora.","steps":["I am: estoy","buy -> buying: comprar, take off -ar, add -ando -> comprando","them: attached to the end -los","now: ahora"],"rules":["t35__ar-to-ando","t35__estoy-ing-right-now","t35__gerund-pronoun-placement"],"track":35,"source":"track","note":"Also fine as Los estoy comprando ahora."},{"id":"t35-x01","type":"sentence","prompt":"He is being honest.","answer":"Está siendo honesto.","steps":["he is: está","be -> being: siendo","honest: honesto"],"rules":["t35__estar-siendo"],"track":35,"source":"extension","difficulty":1},{"id":"t35-x02","type":"sentence","prompt":"Why are you being sincere now? (informal)","answer":"¿Por qué estás siendo sincero ahora?","steps":["why: por qué (from earlier)","you are: estás","be -> being: siendo","sincere: sincero","now: ahora"],"rules":["t35__estar-siendo"],"track":35,"source":"extension","difficulty":2},{"id":"t35-x03","type":"sentence","prompt":"I am buying them now, not next week.","answer":"Los estoy comprando ahora, no la semana que viene.","steps":["them: los, out at the front","I am: estoy","buy -> buying: comprando","now, not: ahora, no","next week: la semana que viene"],"rules":["t35__ar-to-ando","t35__estoy-ing-right-now","t35__gerund-pronoun-placement"],"track":35,"source":"extension","difficulty":3}],"blurb":"Being a characteristic just for now with estar siendo, and when not to use -ing","sectionIndex":4},{"id":"t36","label":"Track 36","tracks":[36],"rules":[{"id":"t36__future-tense-endings","family":"future-tense-endings","title":"The future: haber's endings stuck on the whole infinitive","explanation":"Take the verb in its whole 'to' form, -ar, -er or -ir, it doesn't matter, and stick an ending straight onto the end: é for I, ás for you (informal), á for he/she/you formal, emos for we, án for they/you guys. These are exactly the short forms of haber (he, has, ha, hemos, han), just without the h. The accent always lands on that added ending, so you don't have to think about stress separately.","examples":["comer -> comeré - I will eat","ir -> iré - I will go","encontrar -> encontrará - he will find"],"track":36}],"drills":[{"id":"t36-01","type":"word","prompt":"I will eat","answer":"Comeré","steps":["whole infinitive first: comer","add the I-ending from haber's he, without the h: -é -> comeré"],"rules":["t36__future-tense-endings"],"track":36,"source":"track"},{"id":"t36-02","type":"word","prompt":"We will eat","answer":"Comeremos","steps":["whole infinitive: comer","add the we-ending, from hemos: -emos -> comeremos"],"rules":["t36__future-tense-endings"],"track":36,"source":"track"},{"id":"t36-03","type":"word","prompt":"I will go","answer":"Iré","steps":["to go: ir (irregular verb, but regular in the future)","add -é -> iré"],"rules":["t36__future-tense-endings"],"track":36,"source":"track"},{"id":"t36-04","type":"sentence","prompt":"Will you go? (informal)","answer":"¿Irás?","steps":["ir + the you-informal ending, from has: -ás -> irás"],"rules":["t36__future-tense-endings"],"track":36,"source":"track"},{"id":"t36-05","type":"sentence","prompt":"Why won't you go? (informal)","answer":"¿Por qué no irás?","steps":["why: por qué (from earlier)","no in front: no","you will go: irás"],"rules":["t36__future-tense-endings"],"track":36,"source":"track"},{"id":"t36-06","type":"word","prompt":"They will go","answer":"Irán","steps":["ir + the they-ending, from han: -án -> irán"],"rules":["t36__future-tense-endings"],"track":36,"source":"track","note":"Sounds like the country: they will go to Iran, irán a Irán."},{"id":"t36-07","type":"sentence","prompt":"I will find it.","answer":"Lo encontraré.","steps":["it: lo, out at the front (from earlier)","whole infinitive: encontrar","add -é -> encontraré"],"rules":["t36__future-tense-endings"],"track":36,"source":"track"},{"id":"t36-08","type":"sentence","prompt":"We will find it.","answer":"Lo encontraremos.","steps":["it: lo, out at the front","encontrar + -emos -> encontraremos"],"rules":["t36__future-tense-endings"],"track":36,"source":"track","note":"Careful: it's we who are doing the finding, so the verb is plural, not the it - don't make the pronoun plural instead."},{"id":"t36-09","type":"sentence","prompt":"He will find them.","answer":"Los encontrará.","steps":["them: los, out at the front","encontrar + -á (he) -> encontrará"],"rules":["t36__future-tense-endings"],"track":36,"source":"track","note":"Think of the doer and the receiver separately: who's doing it (he, singular) vs. who it's being done to (them, plural)."},{"id":"t36-10","type":"sentence","prompt":"I will stay here.","answer":"Me quedaré aquí.","steps":["remain myself, i.e. stay: quedar + me (from earlier)","whole infinitive: quedar, add -é -> quedaré","me stays out front: me quedaré","here: aquí"],"rules":["t36__future-tense-endings"],"track":36,"source":"track","note":"Quedaré alone just means I will remain - you need the me for the meaning of stay."},{"id":"t36-11","type":"word","prompt":"I will prepare","answer":"Prepararé","steps":["think out the whole infinitive first: preparar","then add -é -> prepararé"],"rules":["t36__future-tense-endings"],"track":36,"source":"track","note":"Common mistake: dropping the ar and saying preparé - always think the whole verb out first."},{"id":"t36-12","type":"word","prompt":"He will organize","answer":"Organizará","steps":["whole infinitive: organizar","add -á (he) -> organizará"],"rules":["t36__future-tense-endings"],"track":36,"source":"track"},{"id":"t36-13","type":"sentence","prompt":"I will be tired.","answer":"Estaré cansada.","steps":["tired is a state, so estar: estar + -é -> estaré","tired: cansada (or cansado)"],"rules":["t36__future-tense-endings"],"track":36,"source":"track"},{"id":"t36-14","type":"word","prompt":"It will be","answer":"Será","steps":["ser + -á (it/he/she) -> será"],"rules":["t36__future-tense-endings"],"track":36,"source":"track","note":"Que será, será."},{"id":"t36-x01","type":"word","prompt":"I will sleep","answer":"Dormiré","steps":["whole infinitive first: dormir","add -é -> dormiré"],"rules":["t36__future-tense-endings"],"track":36,"source":"extension","difficulty":1},{"id":"t36-x02","type":"word","prompt":"She will wait","answer":"Esperará","steps":["whole infinitive: esperar","add -á (she) -> esperará"],"rules":["t36__future-tense-endings"],"track":36,"source":"extension","difficulty":1},{"id":"t36-x03","type":"sentence","prompt":"Won't you sell it? (informal)","answer":"¿No lo venderás?","steps":["no out front: no","it: lo","vender + -ás (you informal) -> venderás"],"rules":["t36__future-tense-endings"],"track":36,"source":"extension","difficulty":2},{"id":"t36-x04","type":"sentence","prompt":"We will stay here tomorrow.","answer":"Nos quedaremos aquí mañana.","steps":["remain ourselves, i.e. stay: quedar + nos","quedar + -emos -> quedaremos","nos stays out front: nos quedaremos","here, tomorrow: aquí mañana"],"rules":["t36__future-tense-endings"],"track":36,"source":"extension","difficulty":2},{"id":"t36-x05","type":"sentence","prompt":"Why won't we prepare the breakfast tomorrow?","answer":"¿Por qué no prepararemos el desayuno mañana?","steps":["why: por qué","no out front: no","whole infinitive first: preparar, then add -emos -> prepararemos","the breakfast: el desayuno","tomorrow: mañana"],"rules":["t36__future-tense-endings"],"track":36,"source":"extension","difficulty":3}],"blurb":"Building the future by sticking haber's own endings onto the whole infinitive","sectionIndex":5},{"id":"t37","label":"Track 37","tracks":[37],"rules":[{"id":"t37__future-tense-endings","family":"future-tense-endings","title":"The future: haber's endings stuck on the whole infinitive","explanation":"Take the verb in its whole 'to' form, -ar, -er or -ir, it doesn't matter, and stick an ending straight onto the end: é for I, ás for you (informal), á for he/she/you formal, emos for we, án for they/you guys. These are exactly the short forms of haber (he, has, ha, hemos, han), just without the h. The accent always lands on that added ending, so you don't have to think about stress separately.","examples":["comer -> comeré - I will eat","ir -> iré - I will go","encontrar -> encontrará - he will find"],"track":36},{"id":"t37__lo-la-le-les","family":"lo-la-le-les","title":"lo/la/los/las become le/les for to him, to her, to them","explanation":"Lo, la, los, las mean it/him/her/them when they're the thing being directly acted on. The moment the meaning shifts to to him, to her, for him, for her, to them, for them - the person on the receiving end rather than the thing itself - lo and la both become le, and los and las both become les.","examples":["lo doy (I give it) vs les doy (I give to them)","le he hablado - I have spoken to him/her","le cocina algo - he's cooking him/her something"],"track":37},{"id":"t37__me-te-nos-stay","family":"me-te-nos-stay","title":"me, te, nos don't change","explanation":"Me, te and nos already carry every meaning you'd need: me/to me/for me/myself, you/to you/for you/yourself, us/to us/for us/ourselves (nos can also mean each other). Unlike lo/la/los/las, they never swap to a different word no matter which of those meanings is intended.","examples":["me doy cuenta - I realize","me cocina algo - he's cooking me something / for me","nos hablamos - we speak to each other"],"track":37},{"id":"t37__pronoun-order-personal-first","family":"pronoun-order-personal-first","title":"When two little words stack, the personal one comes first","explanation":"When two of the small words (me, te, nos, le, les, se and lo, la, los, las) stack up in front of a verb, the one referring to a person (me, te, nos, le, les, se) goes before the one referring to the thing (lo, la, los, las).","examples":["me lo darán - will you give it to me","nos lo darán - they will give it to us","nos las cocina - he's cooking them for us"],"track":37}],"drills":[{"id":"t37-01","type":"word","prompt":"I will give","answer":"Daré","steps":["dar: to give","add é for I: daré"],"rules":["t37__future-tense-endings"],"track":37,"source":"track"},{"id":"t37-02","type":"word","prompt":"we will give","answer":"Daremos","steps":["dar: to give","add emos for we: daremos"],"rules":["t37__future-tense-endings"],"track":37,"source":"track"},{"id":"t37-03","type":"word","prompt":"they will give, or you guys will give","answer":"Darán","steps":["dar: to give","add án for they/you guys: darán"],"rules":["t37__future-tense-endings"],"track":37,"source":"track"},{"id":"t37-04","type":"sentence","prompt":"Will you guys give it to me?","answer":"¿Me lo darán?","steps":["who's doing it: darán (they/you guys will give)","it: lo","me: to me","personal one first: me lo darán"],"rules":["t37__future-tense-endings","t37__pronoun-order-personal-first"],"track":37,"source":"track","note":"Also fine as ¿Me la darán? if the thing being given is feminine."},{"id":"t37-05","type":"sentence","prompt":"They will give it to us.","answer":"Nos lo darán.","steps":["they will give: darán","it: lo","to us: nos","personal one first: nos lo darán"],"rules":["t37__future-tense-endings","t37__pronoun-order-personal-first"],"track":37,"source":"track"},{"id":"t37-06","type":"sentence","prompt":"They will not give it to us.","answer":"No nos lo darán.","steps":["no at the front","the rest is as before: nos lo darán"],"rules":["t37__future-tense-endings","t37__pronoun-order-personal-first"],"track":37,"source":"track"},{"id":"t37-07","type":"sentence","prompt":"I realize.","answer":"Me doy cuenta.","steps":["I realize is literally I give myself account","I give: doy","myself: me, and me doesn't change","account: cuenta"],"rules":["t37__me-te-nos-stay"],"track":37,"source":"track"},{"id":"t37-08","type":"sentence","prompt":"Do you realize? (informal)","answer":"¿Te das cuenta?","steps":["you give yourself account","you give (informal): das","yourself: te, unchanged","cuenta: account"],"rules":["t37__me-te-nos-stay"],"track":37,"source":"track"},{"id":"t37-09","type":"sentence","prompt":"I'm giving them something.","answer":"Les doy algo.","steps":["I give: doy","to them: los would be the thing, but here it's the people receiving, so it becomes les","something: algo"],"rules":["t37__lo-la-le-les"],"track":37,"source":"track"},{"id":"t37-10","type":"sentence","prompt":"I have spoken to him.","answer":"Le he hablado.","steps":["I have spoken: he hablado (from earlier)","to him: lo would be direct, but to him means le"],"rules":["t37__lo-la-le-les"],"track":37,"source":"track"},{"id":"t37-11","type":"sentence","prompt":"They have spoken to them.","answer":"Les han hablado.","steps":["they have spoken: han hablado (from earlier)","to them (people receiving): les"],"rules":["t37__lo-la-le-les"],"track":37,"source":"track"},{"id":"t37-12","type":"sentence","prompt":"He's cooking them something.","answer":"Les cocina algo.","steps":["he cooks: cocina","them, as the people he's cooking for: les","something: algo"],"rules":["t37__lo-la-le-les"],"track":37,"source":"track"},{"id":"t37-13","type":"sentence","prompt":"He's cooking them for us. (the tarts, feminine)","answer":"Nos las cocina.","steps":["them, the tarts, stays las since they're the things themselves","for us: nos","personal one first: nos las cocina"],"rules":["t37__pronoun-order-personal-first"],"track":37,"source":"track"},{"id":"t37-x01","type":"sentence","prompt":"I will speak to him.","answer":"Le hablaré.","steps":["hablar: to speak","add é for I: hablaré","to him: le"],"rules":["t37__future-tense-endings","t37__lo-la-le-les"],"track":37,"source":"extension","difficulty":1},{"id":"t37-x02","type":"sentence","prompt":"We will give them something.","answer":"Les daremos algo.","steps":["dar: to give, add emos for we: daremos","to them: les","something: algo"],"rules":["t37__future-tense-endings","t37__lo-la-le-les"],"track":37,"source":"extension","difficulty":1},{"id":"t37-x03","type":"sentence","prompt":"Will you give it to us? (informal)","answer":"¿Nos lo darás?","steps":["dar plus ás for you informal: darás","it: lo","to us: nos","personal one first: nos lo darás"],"rules":["t37__future-tense-endings","t37__pronoun-order-personal-first"],"track":37,"source":"extension","difficulty":2},{"id":"t37-x04","type":"sentence","prompt":"They won't give it to me, but they will give it to us.","answer":"No me lo darán, pero nos lo darán.","steps":["no at the front, me lo darán","pero: but (from earlier)","the rest is as before: nos lo darán"],"rules":["t37__future-tense-endings","t37__pronoun-order-personal-first"],"track":37,"source":"extension","difficulty":3}],"blurb":"le and les for the person on the receiving end, and the future of dar","sectionIndex":5},{"id":"t38","label":"Track 38","tracks":[38],"rules":[{"id":"t38__pronoun-attach-infinitive","family":"pronoun-attach-infinitive","title":"Stick the small word onto the end of the 'to' form","explanation":"When one of these small words - se, me, te, nos, lo, la, le, les - goes with a verb that's still in its 'to' form (an infinitive), it's written joined onto the end as one word rather than as a separate word in front.","examples":["quedar + se -> quedarse - to stay","quiero quedarme - I want to stay","quiere quedarse - he wants to stay"],"track":38},{"id":"t38__se-reflexive","family":"se-reflexive","title":"lo/la/los/las become se for himself/herself/themselves","explanation":"To say something is done to oneself in the third person - himself, herself, themselves, or the formal yourself/yourselves - lo, la, los and las all become se. Easy to remember because se starts like 'self'.","examples":["se habla - he speaks to himself","se quedan (they stay, they remain themselves)","se da cuenta - she realizes"],"track":38},{"id":"t38__me-te-nos-stay","family":"me-te-nos-stay","title":"me, te, nos don't change","explanation":"Me, te and nos already carry every meaning you'd need: me/to me/for me/myself, you/to you/for you/yourself, us/to us/for us/ourselves (nos can also mean each other). Unlike lo/la/los/las, they never swap to a different word no matter which of those meanings is intended.","examples":["me doy cuenta - I realize","me cocina algo - he's cooking me something / for me","nos hablamos - we speak to each other"],"track":37}],"drills":[{"id":"t38-01","type":"sentence","prompt":"I speak to myself.","answer":"Me hablo.","steps":["I speak: hablo","to myself: me, unchanged"],"rules":["t38__me-te-nos-stay"],"track":38,"source":"track"},{"id":"t38-02","type":"sentence","prompt":"We speak to ourselves.","answer":"Nos hablamos.","steps":["we speak: hablamos","to ourselves: nos, unchanged"],"rules":["t38__me-te-nos-stay"],"track":38,"source":"track","note":"More naturally understood as 'we speak to each other'."},{"id":"t38-03","type":"sentence","prompt":"He speaks to himself.","answer":"Se habla.","steps":["he speaks: habla","to himself: lo/la would become se"],"rules":["t38__se-reflexive"],"track":38,"source":"track"},{"id":"t38-04","type":"sentence","prompt":"She speaks to herself.","answer":"Ella se habla.","steps":["clarify with ella: she","to herself: se","she speaks: habla"],"rules":["t38__se-reflexive"],"track":38,"source":"track"},{"id":"t38-05","type":"sentence","prompt":"They speak to themselves.","answer":"Se hablan.","steps":["they speak: hablan","to themselves: se, same word as for he/she"],"rules":["t38__se-reflexive"],"track":38,"source":"track"},{"id":"t38-06","type":"sentence","prompt":"I'm staying.","answer":"Me quedo.","steps":["to stay is literally to remain oneself: quedar","I remain: quedo","myself: me, unchanged"],"rules":["t38__me-te-nos-stay"],"track":38,"source":"track"},{"id":"t38-07","type":"sentence","prompt":"Why don't you stay? (informal)","answer":"¿Por qué no te quedas?","steps":["why: por qué","no before the verb","you remain: quedas","yourself: te, unchanged"],"rules":["t38__me-te-nos-stay"],"track":38,"source":"track"},{"id":"t38-08","type":"sentence","prompt":"He stays.","answer":"Se queda.","steps":["he remains: queda","himself: lo/la becomes se"],"rules":["t38__se-reflexive"],"track":38,"source":"track"},{"id":"t38-09","type":"sentence","prompt":"They stay.","answer":"Se quedan.","steps":["they remain: quedan","themselves: se"],"rules":["t38__se-reflexive"],"track":38,"source":"track"},{"id":"t38-10","type":"sentence","prompt":"I want to stay.","answer":"Quiero quedarme.","steps":["I want: quiero","to remain myself, still in its 'to' form: quedar","myself joins onto the end: quedarme"],"rules":["t38__pronoun-attach-infinitive","t38__me-te-nos-stay"],"track":38,"source":"track"},{"id":"t38-11","type":"sentence","prompt":"He wants to stay.","answer":"Quiere quedarse.","steps":["he wants: quiere","to remain himself: quedar plus se joined on the end: quedarse"],"rules":["t38__pronoun-attach-infinitive","t38__se-reflexive"],"track":38,"source":"track"},{"id":"t38-12","type":"sentence","prompt":"I don't realize.","answer":"No me doy cuenta.","steps":["no at the front","me doy cuenta: I give myself account (from earlier)"],"rules":["t38__me-te-nos-stay"],"track":38,"source":"track"},{"id":"t38-13","type":"sentence","prompt":"They don't realize.","answer":"No se dan cuenta.","steps":["no at the front","they give: dan","themselves: se","cuenta: account"],"rules":["t38__se-reflexive"],"track":38,"source":"track"},{"id":"t38-x01","type":"sentence","prompt":"You want to stay. (informal)","answer":"Quieres quedarte.","steps":["you want: quieres","to remain yourself: quedar plus te joined on the end: quedarte"],"rules":["t38__pronoun-attach-infinitive","t38__me-te-nos-stay"],"track":38,"source":"extension","difficulty":1},{"id":"t38-x02","type":"sentence","prompt":"We don't stay.","answer":"No nos quedamos.","steps":["no at the front","we remain: quedamos","ourselves: nos, unchanged"],"rules":["t38__me-te-nos-stay"],"track":38,"source":"extension","difficulty":1},{"id":"t38-x03","type":"sentence","prompt":"Does he speak to himself?","answer":"¿Se habla?","steps":["question just needs question marks around the statement","he speaks to himself: se habla"],"rules":["t38__se-reflexive"],"track":38,"source":"extension","difficulty":2},{"id":"t38-x04","type":"sentence","prompt":"Why don't they want to stay?","answer":"¿Por qué no quieren quedarse?","steps":["why: por qué","no before the verb","they want: quieren","to remain themselves: quedarse"],"rules":["t38__pronoun-attach-infinitive","t38__se-reflexive"],"track":38,"source":"extension","difficulty":3}],"blurb":"se for himself, herself and themselves, and pronouns joined onto the to-form","sectionIndex":5},{"id":"t39","label":"Track 39","tracks":[39],"rules":[{"id":"t39__preposition-pronouns","family":"preposition-pronouns","title":"After a preposition, Spanish uses he/she/they (but mí and ti)","explanation":"After a preposition like con (with), para (for) or de (from/of), Spanish uses the ordinary word for he/she/they/we, not a special 'him/her/them' form. The only exceptions are me and you informal, which change to mí and ti right after a preposition.","examples":["con él (with him)","para ella - for her","para mí / de ti (for me / from you)"],"track":39},{"id":"t39__ser-vs-estar-location","family":"ser-vs-estar-location","title":"es for what it is, está for where it is","explanation":"Es describes what something characteristically is - its origin, who it belongs to. When you're describing where something is instead, even 'with' someone as a location, you switch to está, because that's a state, not a characteristic.","examples":["es de ustedes (it's from you guys)","es para ustedes - it's for you guys","está con ustedes (it is with you guys)"],"track":39},{"id":"t39__le-les-replace-preposition","family":"le-les-replace-preposition","title":"le and les replace the whole to/for/from phrase","explanation":"Rather than a full prepositional phrase like 'to him' or 'for them', Spanish usually folds that meaning straight into le or les in front of the verb, dropping the preposition and the pronoun after it entirely.","examples":["le hace un favor - he's doing him/her a favor","les compro - I buy [for] them","le quiero decir - I want to tell him"],"track":39},{"id":"t39__pronoun-order-personal-first","family":"pronoun-order-personal-first","title":"When two little words stack, the personal one comes first","explanation":"When two of the small words (me, te, nos, le, les, se and lo, la, los, las) stack up in front of a verb, the one referring to a person (me, te, nos, le, les, se) goes before the one referring to the thing (lo, la, los, las).","examples":["me lo darán - will you give it to me","nos lo darán - they will give it to us","nos las cocina - he's cooking them for us"],"track":37},{"id":"t39__me-te-nos-stay","family":"me-te-nos-stay","title":"me, te, nos don't change","explanation":"Me, te and nos already carry every meaning you'd need: me/to me/for me/myself, you/to you/for you/yourself, us/to us/for us/ourselves (nos can also mean each other). Unlike lo/la/los/las, they never swap to a different word no matter which of those meanings is intended.","examples":["me doy cuenta - I realize","me cocina algo - he's cooking me something / for me","nos hablamos - we speak to each other"],"track":37},{"id":"t39__pronoun-attach-infinitive","family":"pronoun-attach-infinitive","title":"Stick the small word onto the end of the 'to' form","explanation":"When one of these small words - se, me, te, nos, lo, la, le, les - goes with a verb that's still in its 'to' form (an infinitive), it's written joined onto the end as one word rather than as a separate word in front.","examples":["quedar + se -> quedarse - to stay","quiero quedarme - I want to stay","quiere quedarse - he wants to stay"],"track":38},{"id":"t39__lo-la-le-les","family":"lo-la-le-les","title":"lo/la/los/las become le/les for to him, to her, to them","explanation":"Lo, la, los, las mean it/him/her/them when they're the thing being directly acted on. The moment the meaning shifts to to him, to her, for him, for her, to them, for them - the person on the receiving end rather than the thing itself - lo and la both become le, and los and las both become les.","examples":["lo doy (I give it) vs les doy (I give to them)","le he hablado - I have spoken to him/her","le cocina algo - he's cooking him/her something"],"track":37}],"drills":[{"id":"t39-01","type":"word","prompt":"with him","answer":"Con él","steps":["con: with","he: él, not a special 'him' form"],"rules":["t39__preposition-pronouns"],"track":39,"source":"track"},{"id":"t39-02","type":"word","prompt":"with them (feminine)","answer":"Con ellas","steps":["con: with","they, feminine: ellas"],"rules":["t39__preposition-pronouns"],"track":39,"source":"track"},{"id":"t39-03","type":"word","prompt":"with us","answer":"Con nosotros","steps":["con: with","we: nosotros, used for us after a preposition"],"rules":["t39__preposition-pronouns"],"track":39,"source":"track"},{"id":"t39-04","type":"word","prompt":"for her","answer":"Para ella","steps":["para: for","she: ella"],"rules":["t39__preposition-pronouns"],"track":39,"source":"track"},{"id":"t39-05","type":"word","prompt":"for me","answer":"Para mí","steps":["para: for","me becomes mí right after a preposition"],"rules":["t39__preposition-pronouns"],"track":39,"source":"track"},{"id":"t39-06","type":"word","prompt":"for you (informal)","answer":"Para ti","steps":["para: for","you informal becomes ti right after a preposition"],"rules":["t39__preposition-pronouns"],"track":39,"source":"track"},{"id":"t39-07","type":"sentence","prompt":"Is it from you guys?","answer":"¿Es de ustedes?","steps":["is it: es","from: de","you guys: ustedes"],"rules":["t39__preposition-pronouns"],"track":39,"source":"track"},{"id":"t39-08","type":"sentence","prompt":"It is with you guys.","answer":"Está con ustedes.","steps":["this is a location, not a characteristic, so use está, not es","with: con","you guys: ustedes"],"rules":["t39__ser-vs-estar-location","t39__preposition-pronouns"],"track":39,"source":"track"},{"id":"t39-09","type":"sentence","prompt":"She is doing me a favor.","answer":"Me hace un favor.","steps":["she does/makes: hace","me: me, unchanged","a favor: un favor"],"rules":["t39__me-te-nos-stay"],"track":39,"source":"track"},{"id":"t39-10","type":"sentence","prompt":"He's doing her a favor.","answer":"Le hace un favor.","steps":["he does: hace","for her: la would be direct, but for her means le","a favor: un favor"],"rules":["t39__lo-la-le-les"],"track":39,"source":"track"},{"id":"t39-11","type":"sentence","prompt":"I want to tell him.","answer":"Le quiero decir.","steps":["I want: quiero","to tell: decir","to him: le, placed before quiero or joined to the end of decir"],"rules":["t39__lo-la-le-les","t39__pronoun-attach-infinitive"],"track":39,"source":"track","note":"Also fine as Quiero decirle."},{"id":"t39-12","type":"sentence","prompt":"I buy them. (for them, people)","answer":"Les compro.","steps":["I buy: compro","for them, folding the whole 'for them' into one word: les"],"rules":["t39__le-les-replace-preposition"],"track":39,"source":"track"},{"id":"t39-13","type":"sentence","prompt":"They buy them for me.","answer":"Me los compran.","steps":["they buy: compran","them, the things: los","for me: me","personal one first: me los compran"],"rules":["t39__pronoun-order-personal-first"],"track":39,"source":"track"},{"id":"t39-x01","type":"word","prompt":"for them (feminine)","answer":"Para ellas","steps":["para: for","they, feminine: ellas"],"rules":["t39__preposition-pronouns"],"track":39,"source":"extension","difficulty":1},{"id":"t39-x02","type":"sentence","prompt":"He's doing us a favor.","answer":"Nos hace un favor.","steps":["he does: hace","us: nos, unchanged","a favor: un favor"],"rules":["t39__me-te-nos-stay"],"track":39,"source":"extension","difficulty":1},{"id":"t39-x03","type":"sentence","prompt":"It is for me.","answer":"Es para mí.","steps":["es, since this is a characteristic (who it's meant for), not a location","for: para","me becomes mí after a preposition"],"rules":["t39__ser-vs-estar-location","t39__preposition-pronouns"],"track":39,"source":"extension","difficulty":2},{"id":"t39-x04","type":"sentence","prompt":"I want to buy him something, but he's with them now.","answer":"Le quiero comprar algo, pero está con ellos ahora.","steps":["I want: quiero","to buy: comprar","for him, folded in: le","something: algo","pero: but (from earlier)","he is, as a location: está","with them: con ellos","now: ahora (from earlier)"],"rules":["t39__le-les-replace-preposition","t39__preposition-pronouns","t39__ser-vs-estar-location"],"track":39,"source":"extension","difficulty":3}],"blurb":"Pronouns after con, para and de, and folding a whole to/for phrase into le","sectionIndex":5},{"id":"t40","label":"Track 40","tracks":[40],"rules":[{"id":"t40__depender-de","family":"depender-de","title":"depender takes de: it depends of, not on","explanation":"Depender (to depend) takes de (of) where English takes on, so it depends on her is depende de ella. Since si (if) is the same word as sí (yes) in Spanish, it depends on if is just depende de si.","examples":["Depende de ella. - It depends on her.","Depende de si quiere ir. (It depends on if she wants to go.)"],"track":40},{"id":"t40__enamorarse-de","family":"enamorarse-de","title":"To fall in love: I enamor myself of (enamorarse de)","explanation":"To fall in love is enamorarse - really the -ar verb enamorar with se hooked on. Build it like any reflexive: me enamoro for I fall in love. Spanish uses de (of) where English uses with, so falling in love with someone is enamorarse de someone.","examples":["Me enamoro. (I fall in love.)","Me enamoro de ti. (I fall in love with you.)","Me estoy enamorando de él. (I'm falling in love with him.)"],"track":40},{"id":"t40__pensar-en","family":"pensar-en","title":"pensar takes en: to think in someone, not about","explanation":"Pensar (to think) takes en (in/on) where English takes about. So I think about you comes out as I think in you: pienso en ti.","examples":["Pienso en ti. - I think about you.","Pensamos en ella. - We think about her."],"track":40},{"id":"t40__sonar-con-stem-swap","family":"sonar-con-stem-swap","title":"soñar takes con: to dream with, and the o that swaps to ue","explanation":"Soñar (to dream) takes con (with), not about, so dreaming about someone is soñar con someone. Like other verbs of this shape, the o swaps to ue whenever it is stressed - sueño, sueña, sueñan - but stays o when the stress moves off it, as in soñamos.","examples":["Sueño con ella. - I dream about her.","Soñamos. - We dream.","Sueño contigo. - I dream about you."],"track":40},{"id":"t40__conmigo-contigo","family":"conmigo-contigo","title":"With me / with you: conmigo, contigo","explanation":"With is con, and with most pronouns it just sits in front of them, but with me and with you (informal) are the exceptions: they fuse into one word with a -go stuck on the end - conmigo, contigo - instead of staying two separate words like de mi or para mi.","examples":["¿Quieres venir conmigo? (Do you want to come with me?)","Voy contigo. (I'm going with you.)"],"track":40}],"drills":[{"id":"t40-01","type":"word","prompt":"fall in love","answer":"Me enamoro","steps":["to fall in love: enamorarse, from the -ar verb enamorar with se hooked on","I: drop -ar, put on -o, then keep the se in front: me enamoro"],"rules":["t40__enamorarse-de"],"track":40,"source":"track"},{"id":"t40-02","type":"sentence","prompt":"I fall in love with you. (informal)","answer":"Me enamoro de ti.","steps":["I fall in love: me enamoro","with becomes of: de","you informal: ti"],"rules":["t40__enamorarse-de"],"track":40,"source":"track"},{"id":"t40-03","type":"sentence","prompt":"I'm falling in love with him right now.","answer":"Me estoy enamorando de él.","steps":["I am: estoy (from earlier)","falling in love: enamorándome, the -ando form of enamorarse (from earlier: -ando for -ing)","it can go before estoy or after it: estoy enamorándome / me estoy enamorando","with him becomes of him: de él"],"rules":["t40__enamorarse-de"],"track":40,"source":"track"},{"id":"t40-04","type":"sentence","prompt":"I'm thinking about you. (informal)","answer":"Pienso en ti.","steps":["to think: pensar","about becomes in: en","you informal: ti"],"rules":["t40__pensar-en"],"track":40,"source":"track"},{"id":"t40-05","type":"sentence","prompt":"We think about her.","answer":"Pensamos en ella.","steps":["we think: pensamos","about becomes in: en","her: ella"],"rules":["t40__pensar-en"],"track":40,"source":"track"},{"id":"t40-06","type":"word","prompt":"we dream","answer":"Soñamos","steps":["to dream: soñar","we: since the stress isn't on the o here, it stays o - soñamos"],"rules":["t40__sonar-con-stem-swap"],"track":40,"source":"track"},{"id":"t40-07","type":"sentence","prompt":"I dream about her.","answer":"Sueño con ella.","steps":["I dream: the o is stressed here so it swaps to ue - sueño","about becomes with: con","her: ella"],"rules":["t40__sonar-con-stem-swap"],"track":40,"source":"track"},{"id":"t40-08","type":"word","prompt":"with me","answer":"Conmigo","steps":["with me is the exception: it fuses into one word with -go on the end - conmigo"],"rules":["t40__conmigo-contigo"],"track":40,"source":"track"},{"id":"t40-09","type":"word","prompt":"with you (informal)","answer":"Contigo","steps":["with you informal is the other exception: contigo"],"rules":["t40__conmigo-contigo"],"track":40,"source":"track"},{"id":"t40-10","type":"sentence","prompt":"Do you want to come with me? (informal)","answer":"¿Quieres venir conmigo?","steps":["do you want: quieres (from earlier)","to come: venir (from earlier)","with me: conmigo"],"rules":["t40__conmigo-contigo"],"track":40,"source":"track"},{"id":"t40-11","type":"sentence","prompt":"Why don't you want to come with me? (informal)","answer":"¿Por qué no quieres venir conmigo?","steps":["why: por qué (from earlier)","no goes in front: no quieres","to come: venir","with me: conmigo"],"rules":["t40__conmigo-contigo"],"track":40,"source":"track"},{"id":"t40-12","type":"sentence","prompt":"Can you come with me? (informal)","answer":"¿Puedes venir conmigo?","steps":["can you: puedes (from earlier, to be able)","to come: venir","with me: conmigo"],"rules":["t40__conmigo-contigo"],"track":40,"source":"track"},{"id":"t40-13","type":"sentence","prompt":"I dream about you. (informal)","answer":"Sueño contigo.","steps":["I dream: sueño","about becomes with, and with you informal is the fused word: contigo"],"rules":["t40__sonar-con-stem-swap","t40__conmigo-contigo"],"track":40,"source":"track"},{"id":"t40-14","type":"sentence","prompt":"It depends on her.","answer":"Depende de ella.","steps":["it depends: depende","on becomes of: de","her: ella"],"rules":["t40__depender-de"],"track":40,"source":"track"},{"id":"t40-15","type":"sentence","prompt":"It depends on if she wants to go.","answer":"Depende de si quiere ir.","steps":["it depends on: depende de","if is the same word as yes: si","she wants: quiere (from earlier)","to go: ir (from earlier)"],"rules":["t40__depender-de"],"track":40,"source":"track"},{"id":"t40-x01","type":"sentence","prompt":"I fall in love with her.","answer":"Me enamoro de ella.","steps":["I fall in love: me enamoro","with becomes of: de","her: ella"],"rules":["t40__enamorarse-de"],"track":40,"source":"extension","difficulty":1},{"id":"t40-x02","type":"sentence","prompt":"We dream about him.","answer":"Soñamos con él.","steps":["we dream: soñamos, unstressed so no swap","about becomes with: con","him: él"],"rules":["t40__sonar-con-stem-swap"],"track":40,"source":"extension","difficulty":1},{"id":"t40-x03","type":"sentence","prompt":"Do you want to come with her? (informal)","answer":"¿Quieres venir con ella?","steps":["do you want: quieres","to come: venir","with her: con ella - only me and you (informal) fuse into conmigo/contigo, other pronouns just follow con normally"],"rules":["t40__conmigo-contigo"],"track":40,"source":"extension","difficulty":2},{"id":"t40-x04","type":"sentence","prompt":"It depends on if you want to come with me. (informal)","answer":"Depende de si quieres venir conmigo.","steps":["it depends on if: depende de si","you want: quieres","to come with me: venir conmigo"],"rules":["t40__depender-de","t40__conmigo-contigo"],"track":40,"source":"extension","difficulty":2},{"id":"t40-x05","type":"sentence","prompt":"She doesn't want to come with me because she's falling in love with him.","answer":"No quiere venir conmigo porque se está enamorando de él.","steps":["she doesn't want: no quiere (from earlier)","to come with me: venir conmigo","because: porque (from earlier)","she's falling in love: se está enamorando, the -ando form of enamorarse (from earlier: -ando for -ing)","with him becomes of him: de él"],"rules":["t40__conmigo-contigo","t40__enamorarse-de"],"track":40,"source":"extension","difficulty":3}],"blurb":"Verbs that take a different preposition from English, plus conmigo and contigo","sectionIndex":5},{"id":"t41","label":"Track 41","tracks":[41],"rules":[{"id":"t41__se-reflexive-passive","family":"se-reflexive-passive","title":"Gets ...ed: Spanish says it does it to itself (se)","explanation":"Spanish has no direct gets construction, so to say something gets transformed or gets contaminated, you say it transforms itself or it contaminates itself - the verb plus se - even though nobody really means the thing is doing it to itself. It works in any tense: se contamina (it gets contaminated) and se contaminaría (it would get contaminated).","examples":["Se transformaría. - It would get transformed.","Se contamina. - It gets contaminated.","Se contaminaría. - It would get contaminated."],"track":41},{"id":"t41__would-tense-ia","family":"would-tense-ia","title":"Would: add -ía onto the whole verb","explanation":"Would works the same way as will but with its own key sound: -ía, stressed, stuck onto the full to-form of the verb for every verb type. The plain -ía form covers I, he, she, it and you (formal) all together; the other endings (-íamos, -ían, -ías) work the same way as for will.","examples":["Bailaría. - I would dance.","Bailaríamos. - We would dance.","Comería. - I would eat."],"track":41},{"id":"t41__future-tense-endings","family":"future-tense-endings","title":"The future: haber's endings stuck on the whole infinitive","explanation":"Take the verb in its whole 'to' form, -ar, -er or -ir, it doesn't matter, and stick an ending straight onto the end: é for I, ás for you (informal), á for he/she/you formal, emos for we, án for they/you guys. These are exactly the short forms of haber (he, has, ha, hemos, han), just without the h. The accent always lands on that added ending, so you don't have to think about stress separately.","examples":["comer -> comeré - I will eat","ir -> iré - I will go","encontrar -> encontrará - he will find"],"track":36}],"drills":[{"id":"t41-01","type":"word","prompt":"I will dance","answer":"Bailaré","steps":["to dance: bailar","I: take the sound from he (haber's I have) - -e - and stick it on the end, stressed: bailaré"],"rules":["t41__future-tense-endings"],"track":41,"source":"track"},{"id":"t41-02","type":"word","prompt":"we will dance","answer":"Bailaremos","steps":["we: the sound from hemos - -emos - stuck on the end: bailaremos"],"rules":["t41__future-tense-endings"],"track":41,"source":"track"},{"id":"t41-03","type":"word","prompt":"they will dance","answer":"Bailarán","steps":["they/you guys: the sound from han - -an - stuck on the end: bailarán"],"rules":["t41__future-tense-endings"],"track":41,"source":"track"},{"id":"t41-04","type":"word","prompt":"we would dance","answer":"Bailaríamos","steps":["would's key sound is -ía, stressed","we: -íamos, keeping the accent on the ía: bailaríamos"],"rules":["t41__would-tense-ia"],"track":41,"source":"track"},{"id":"t41-05","type":"word","prompt":"you would dance (informal)","answer":"Bailarías","steps":["you informal: -ías: bailarías"],"rules":["t41__would-tense-ia"],"track":41,"source":"track"},{"id":"t41-06","type":"word","prompt":"I would go","answer":"Iría","steps":["to go: ir (from earlier)","I: add -ía, stressed - iría (covers I, he, she, it, you formal)"],"rules":["t41__would-tense-ia"],"track":41,"source":"track"},{"id":"t41-07","type":"sentence","prompt":"She wouldn't go.","answer":"No iría.","steps":["no goes in front","she would go: iría"],"rules":["t41__would-tense-ia"],"track":41,"source":"track"},{"id":"t41-08","type":"sentence","prompt":"I would eat, but I don't have time.","answer":"Comería, pero no tengo tiempo.","steps":["to eat: comer (from earlier)","I would eat: comería","but: pero (from earlier)","I don't have: no tengo (from earlier)","time: tiempo, from tempo with the e split (from earlier)"],"rules":["t41__would-tense-ia"],"track":41,"source":"track"},{"id":"t41-09","type":"sentence","prompt":"It would transform the situation.","answer":"Transformaría la situación.","steps":["to transform: transformar, from transformación","it would transform: transformaría","the situation: la situación, a direct cognate"],"rules":["t41__would-tense-ia"],"track":41,"source":"track"},{"id":"t41-10","type":"sentence","prompt":"It would get transformed.","answer":"Se transformaría.","steps":["there's no gets in Spanish, so say it transforms itself: se transformaría"],"rules":["t41__se-reflexive-passive","t41__would-tense-ia"],"track":41,"source":"track"},{"id":"t41-11","type":"sentence","prompt":"It gets contaminated.","answer":"Se contamina.","steps":["to contaminate: contaminar, from contaminación","it contaminates itself: se contamina, standing in for gets contaminated"],"rules":["t41__se-reflexive-passive"],"track":41,"source":"track"},{"id":"t41-12","type":"sentence","prompt":"It would get contaminated.","answer":"Se contaminaría.","steps":["it would contaminate itself: se contaminaría"],"rules":["t41__se-reflexive-passive","t41__would-tense-ia"],"track":41,"source":"track"},{"id":"t41-13","type":"sentence","prompt":"I would imagine that he doesn't want to go.","answer":"Me imaginaría que no quiere ir.","steps":["to imagine: imaginar, from imaginación (note the /j/ becomes /kh/)","I would imagine myself: me imaginaría","that: que (from earlier, same word as what)","he doesn't want to go: no quiere ir (from earlier)"],"rules":["t41__would-tense-ia"],"track":41,"source":"track"},{"id":"t41-x01","type":"word","prompt":"I will eat","answer":"Comeré","steps":["to eat: comer","I: -e, stressed: comeré"],"rules":["t41__future-tense-endings"],"track":41,"source":"extension","difficulty":1},{"id":"t41-x02","type":"word","prompt":"you would eat (informal)","answer":"Comerías","steps":["to eat: comer","you informal: -ías: comerías"],"rules":["t41__would-tense-ia"],"track":41,"source":"extension","difficulty":1},{"id":"t41-x03","type":"sentence","prompt":"It wouldn't get contaminated.","answer":"No se contaminaría.","steps":["no goes in front","it would get contaminated: se contaminaría"],"rules":["t41__se-reflexive-passive","t41__would-tense-ia"],"track":41,"source":"extension","difficulty":2},{"id":"t41-x04","type":"sentence","prompt":"I imagine that we will dance later.","answer":"Me imagino que bailaremos más tarde.","steps":["I imagine myself: me imagino","that: que","we will dance: bailaremos","later: más tarde (from earlier)"],"rules":["t41__future-tense-endings"],"track":41,"source":"extension","difficulty":3}],"blurb":"Would: -ía stuck onto the whole verb, and se for things that get done to themselves","sectionIndex":5},{"id":"t42","label":"Track 42","tracks":[42],"rules":[{"id":"t42__poder-contraction-podria","family":"poder-contraction-podria","title":"Could: podría, with the e dropped","explanation":"Could should be poder plus -ía, giving podería, but poder is used so often that the middle e wore away over time, leaving podría. Build the rest the normal would way from there: podríamos, podrían, podrías.","examples":["Podría. - I/he/she/it/you formal could.","Podríamos. - We could.","¿Podrías venir a mi casa? - Could you come to my house?"],"track":42},{"id":"t42__gustar-pleasing","family":"gustar-pleasing","title":"To like is really to be pleasing to (gustar)","explanation":"Gustar doesn't mean to like, it means to be pleasing. So I like it is really it is pleasing to me: me gusta. The verb agrees with the thing doing the pleasing, not with the person doing the liking - one thing is me gusta, several things is me gustan - and the person liking shows up as me, nos, etc. in front. Saying me gusto by mistake means I like myself.","examples":["Me gusta. - I like it / it is pleasing to me.","Me gustan. - I like them.","Me gustaría. - I would like / it would please me."],"track":42},{"id":"t42__depender-de","family":"depender-de","title":"depender takes de: it depends of, not on","explanation":"Depender (to depend) takes de (of) where English takes on, so it depends on her is depende de ella. Since si (if) is the same word as sí (yes) in Spanish, it depends on if is just depende de si.","examples":["Depende de ella. - It depends on her.","Depende de si quiere ir. (It depends on if she wants to go.)"],"track":40},{"id":"t42__would-tense-ia","family":"would-tense-ia","title":"Would: add -ía onto the whole verb","explanation":"Would works the same way as will but with its own key sound: -ía, stressed, stuck onto the full to-form of the verb for every verb type. The plain -ía form covers I, he, she, it and you (formal) all together; the other endings (-íamos, -ían, -ías) work the same way as for will.","examples":["Bailaría. - I would dance.","Bailaríamos. - We would dance.","Comería. - I would eat."],"track":41},{"id":"t42__conmigo-contigo","family":"conmigo-contigo","title":"With me / with you: conmigo, contigo","explanation":"With is con, and with most pronouns it just sits in front of them, but with me and with you (informal) are the exceptions: they fuse into one word with a -go stuck on the end - conmigo, contigo - instead of staying two separate words like de mi or para mi.","examples":["¿Quieres venir conmigo? (Do you want to come with me?)","Voy contigo. (I'm going with you.)"],"track":40}],"drills":[{"id":"t42-01","type":"word","prompt":"I would speak","answer":"Hablaría","steps":["to speak: hablar (from earlier)","I would speak: -ía on the end: hablaría"],"rules":["t42__would-tense-ia"],"track":42,"source":"track"},{"id":"t42-02","type":"sentence","prompt":"They wouldn't speak.","answer":"No hablarían.","steps":["no goes in front","they would speak: hablarían"],"rules":["t42__would-tense-ia"],"track":42,"source":"track"},{"id":"t42-03","type":"word","prompt":"it is pleasing / it pleases","answer":"Gusta","steps":["to like is really to be pleasing: gustar","it pleases: gusta"],"rules":["t42__gustar-pleasing"],"track":42,"source":"track"},{"id":"t42-04","type":"sentence","prompt":"I like it. (it is pleasing to me)","answer":"Me gusta.","steps":["it is pleasing: gusta","to me goes in front: me gusta"],"rules":["t42__gustar-pleasing"],"track":42,"source":"track"},{"id":"t42-05","type":"sentence","prompt":"I like them. (they are pleasing to me)","answer":"Me gustan.","steps":["they please: gustan, matching the plural things doing the pleasing, not the person liking","to me goes in front: me gustan"],"rules":["t42__gustar-pleasing"],"track":42,"source":"track"},{"id":"t42-06","type":"word","prompt":"I would like (it would please me)","answer":"Me gustaría","steps":["it would please: gustaría","to me goes in front: me gustaría"],"rules":["t42__gustar-pleasing","t42__would-tense-ia"],"track":42,"source":"track"},{"id":"t42-07","type":"sentence","prompt":"I would like to eat now.","answer":"Me gustaría comer ahora.","steps":["I would like: me gustaría","to eat: comer","now: ahora (from earlier)"],"rules":["t42__gustar-pleasing","t42__would-tense-ia"],"track":42,"source":"track"},{"id":"t42-08","type":"sentence","prompt":"We would like to eat now.","answer":"Nos gustaría comer ahora.","steps":["start with the verb: it would please: gustaría - it stays gustaría, it does not change shape for we","to us goes in front: nos gustaría","to eat now: comer ahora"],"rules":["t42__gustar-pleasing","t42__would-tense-ia"],"track":42,"source":"track","note":"Common mistake: only the pronoun (nos) changes for we, not the verb ending."},{"id":"t42-09","type":"sentence","prompt":"I would like to see you. (informal)","answer":"Me gustaría verte.","steps":["I would like: me gustaría","to see: ver (from earlier)","you informal hooks onto the end: verte"],"rules":["t42__gustar-pleasing","t42__would-tense-ia"],"track":42,"source":"track"},{"id":"t42-10","type":"word","prompt":"they could / you guys could","answer":"Podrían","steps":["could should be poder + -ía, but the mi
