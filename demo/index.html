  DATA.sections.forEach(function(sec, si){
    var entries = GLOSSARY.filter(function(e){ return e.sectionIndex===si; });
    if(!entries.length) return;
    html += '<div class="section-head"'+(si===0?' style="margin-top:0;border-top:0;padding-top:var(--s2)"':'')+'>' +
      '<div class="r">'+trackRangeText(sec)+'</div><h3>'+esc(sec.title)+'</h3></div>';
    html += '<div class="glosslist">' + entries.map(function(e){
      return glossaryEntryHtml(e, e.idx, openFamily===e.family);
    }).join('') + '</div>';
  });
  return html;
}

// A trailing parenthetical ("...? (informal)") is an instruction about how
// to say it, not part of the sentence you have to say - broken onto its own
// line pre-reveal (CSS: .reg is display:block there) so the two never read
// as one sentence, and folded back inline once revealed (.eng.answered .reg).
// "answered" only dims the colour a shade (see .eng.answered in the CSS) -
// it never changes size or position, so revealing the answer can't move the
// prompt the learner was already reading.
function promptMarkup(text, answered){
  var m = /^([\s\S]*)\s\(([^()]+)\)$/.exec(text);
  var body = m ? m[1] : text;
  var qualifier = m ? m[2] : null;
  var regHtml = qualifier ? ' <span class="reg">('+esc(qualifier)+')</span>' : '';
  return '<div class="eng'+(answered?' answered':'')+'">'+esc(body)+regHtml+'</div>';
}

// Both of the drill's small navigations ride on the cue line rather than
// owning rows of their own: they are periphery, the cue is periphery, and
// on a drill screen that must fit one viewport a row spent on a link is a
// row the hints do not get. They sit at opposite ends because they are
// easy to confuse and must not read as a pair: "back a drill" leaves this
// drill, "take that back" stays in it.
function prevDrillHtml(){
  if(!canPrevDrill()) return '';
  return '<button class="cueback" id="prevDrillBtn" aria-label="Back to the previous drill">&larr;<span class="cueback-lbl"> Back a drill</span></button>';
}

function undoLineHtml(){
  if(!canUndoReveal()) return '';
  return '<button class="undo" id="undoBtn">Take that back</button>';
}

// The drill stage is the box fitDrill() measures: one viewport minus the
// running head and the action bar. Everything a drill renders lives in it.
function stage(inner){ return '<div class="stage" id="stage">' + inner + '</div>'; }

// Zero scroll inside a drill, without clipping or truncating anything.
// Squeeze whitespace first and only then type, because a screen with tight
// spacing still reads as the same screen while shrunken text does not - and
// stop at floors that keep the hint rows legible. The action bar lives
// outside .stage, so the two buttons that get pressed the most never shrink
// at all. A drill that still overflowed at the floor would be a content
// bug (one far longer than anything in the dataset), not a layout one.
// One ordered ladder of concessions, walked from the top until the drill
// fits: whitespace, then type, then - only on a screen short enough that
// neither was enough - the periphery (see .stage.shed1/.shed2 in the CSS).
// The order is the order a designer would give things up in: a screen with
// tight spacing still reads as the same screen, shrunken type reads as a
// worse one, and losing a rule title to a link that goes to the same place
// costs least of all. It stops at the first rung that fits, so the common
// drill on a normal phone never leaves rung one.
var FIT_LADDER = [
  {gap:1},    {gap:.88}, {gap:.76}, {gap:.64}, {gap:.52}, {gap:.42},
  {gap:.42, fit:.94}, {gap:.42, fit:.88}, {gap:.42, fit:.82},
  {gap:.42, fit:.82, shed:1},
  {gap:.42, fit:.76, shed:1},
  {gap:.42, fit:.76, shed:2},
  {gap:.42, fit:.70, shed:2},
  {gap:.36, fit:.64, shed:2},
  // Headroom. Nothing in the dataset reaches this rung today - the densest
  // drill on the smallest phone still in the wild stops one above it - and
  // that is the point: a ladder whose last rung is in use has no margin for
  // the next thing that gets added to the drill screen.
  {gap:.30, fit:.60, shed:2}
];
function clearFit(){
  var root = document.documentElement;
  root.style.removeProperty('--gap');
  root.style.removeProperty('--fit');
}
function applyRung(st, rung){
  var root = document.documentElement;
  root.style.setProperty('--gap', rung.gap);
  root.style.setProperty('--fit', rung.fit || 1);
  st.classList.toggle('shed1', rung.shed >= 1);
  st.classList.toggle('shed2', rung.shed >= 2);
}
// Binary search from where we were, not a walk down the rungs. Every rung
// is smaller than the one above it, so "does it fit" is monotonic along the
// ladder. Each test costs a forced reflow and this runs on every hint and
// every reveal, so the cost is worth cutting: walking all thirteen rungs
// put the worst tap at ~170ms on a six-times-throttled CPU, which is a
// thumb noticing. Probing last time's rung first collapses the common
// cases - a drill that fits at full size, or one more hint on a drill that
// was already squeezed - to a single test, and bounds the search to one
// side of it otherwise.
var lastRung = 0;
function fitDrill(){
  var st = document.getElementById('stage');
  if(!st){ clearFit(); return; }
  var top = FIT_LADDER.length - 1;
  function fits(){ return st.scrollHeight <= st.clientHeight + 1; }
  if(lastRung > top) lastRung = top;
  applyRung(st, FIT_LADDER[lastRung]);
  var lo, hi, best, applied = lastRung;
  if(fits()){
    if(lastRung === 0) return;          // already as generous as it goes
    lo = 0; hi = lastRung - 1; best = lastRung;
  } else {
    lo = lastRung + 1; hi = top; best = top;
  }
  while(lo <= hi){
    var mid = (lo + hi) >> 1;
    applyRung(st, FIT_LADDER[mid]); applied = mid;
    if(fits()){ best = mid; hi = mid - 1; }
    else { lo = mid + 1; }
  }
  if(applied !== best) applyRung(st, FIT_LADDER[best]);
  lastRung = best;
}

function renderDrill(){
  var d = queue[idx];
  if(!d){ return stage('<div class="empty">Nothing to practice here.</div>'); }

  // Extensions are sentences we wrote from the track's rules, not lines the
  // teacher said - mark that provenance quietly in the cue line. Track
  // drills (the recording itself) are the default and stay unmarked. Kept
  // as both .flag (the design's "statement about reliability" ink) and the
  // long-standing .src-tag hook.
  var srcTagHtml = d.source === 'extension' ? ' &middot; <span class="flag src-tag">not from the recording</span>' : '';
  var cueHtml = '<div class="cue">'+prevDrillHtml()+'<span class="cuetext">Track '+d.track+' &middot; drill '+(idx+1)+' of '+queue.length+srcTagHtml+'</span>'+undoLineHtml()+'</div>';

  var bannerHtml = ruleFilterId ? ('<div class="filterbanner">Only drills for: <b>'+esc(ruleFilterLabel)+'</b> ' +
    '<button class="link-inline" id="clearRuleFilterBtn">Show all</button></div>') : '';

  // The hint stack is identical whichever state we're in - revealing the
  // answer never touches it, so it's built once and reused (see item 5:
  // nothing already on screen may move when the answer arrives).
  var stepsHtml = "";
  if(revealedSteps>0 && d.steps){
    stepsHtml = '<ul class="steps">' + d.steps.slice(0,revealedSteps).map(stepHtml).join('') + '</ul>';
  }

  if(!answerShown){
    return stage(cueHtml + bannerHtml + promptMarkup(d.prompt, false) + stepsHtml);
  }

  // Revealing the answer adds a new block BELOW what's already on screen -
  // it does not recompose the prompt or the hints. The prompt keeps its
  // exact size and position (promptMarkup only dims its colour a shade);
  // the answer's own weight and the hairline above it (see .answer in the
  // CSS) are what make this read as an event.
  var flagHtml = (typeof d.confidence === "number" && d.confidence < 0.7) ? '<span class="flag">low-confidence guess</span>' : '';
  var noteHtml = d.note ? '<div class="note">'+esc(d.note)+'</div>' : '';
  var whyHtml = "";
  if(d.rules && d.rules.length){
    // Both shapes are always in the DOM and CSS picks one, so fitDrill()
    // can collapse four wrapped rule titles - a third of a small phone's
    // screen - into a single link without a second render pass. The link
    // lands on the same Rules tab the titles would have.
    whyHtml = '<div class="why"><span class="why-lbl">Why</span>' + d.rules.map(function(rid){
      var r = ruleById(rid);
      var lbl = r ? r.title : rid;
      return '<button class="rulelink" data-ruleid="'+esc(rid)+'">'+esc(lbl)+'</button>';
    }).join('') +
    (d.rules.length > 1 ? '<button class="rulelink why-all" data-ruleid="'+esc(d.rules[0])+'">'+d.rules.length+' rules</button>' : '') +
    '</div>';
  }
  return stage(cueHtml + bannerHtml + promptMarkup(d.prompt, true) + stepsHtml +
    '<div class="answer" aria-live="polite"><div class="es" lang="es">'+esc(d.answer)+'</div>' + noteHtml + flagHtml +
    '<button class="speak" id="speakBtn">'+SPK_ICON+'<span class="speak-lbl">Hear it</span></button></div>' +
    whyHtml);
}

function drillBarHtml(){
  var d = queue[idx];
  if(!d) return bar('<button class="btn" id="homeBtn">All tracks</button>');
  if(!answerShown){
    var stepsLeft = d.steps && revealedSteps < d.steps.length;
    // Both actions here are real choices, so both are real buttons - "Give
    // me a piece" is primary (filled) while hints remain, "Show the answer"
    // is secondary (bordered, not link-styled) beside it; once hints run
    // out, "Show the answer" becomes the sole, primary action.
    if(stepsLeft){
      return barChoice(
        '<button class="btn" id="nextStepBtn">Give me a piece</button>' +
        '<button class="btn secondary" id="revealBtn">Show the answer</button>'
      );
    }
    return bar('<button class="btn" id="revealBtn">Show the answer</button>');
  }
  return barGrade(
    '<button class="no" id="stuckBtn">Not yet</button>' +
    '<button id="gotBtn">Got it</button>'
  );
}

function renderRules(){
  if(!pack) return '<div class="empty">Pick a track set first.</div>';
  var rules = pack.rules.slice();
  if(!rules.length) return '<div class="empty">No rules for this filter.</div>';
  var referenced = {};
  pack.drills.forEach(function(d){ (d.rules||[]).forEach(function(rid){ referenced[rid] = true; }); });
  return '<div class="rules-list">' + rules.map(function(r){
    var exHtml = (r.examples && r.examples.length) ? '<ul>' + r.examples.map(exampleHtml).join('') + '</ul>' : '';
    var hl = (highlightRule===r.id) ? ' highlight' : '';
    var practiceBtn = referenced[r.id] ? '<button class="practicebtn" data-ruleid="'+esc(r.id)+'">Practice this rule &rarr;</button>' : '';
    return '<div class="rule'+hl+'" id="rule-'+esc(r.id)+'"><h3>'+esc(r.title)+'</h3><p>'+esc(r.explanation)+'</p>' + exHtml +
      '<div class="src">Track '+r.track+'</div>' +
      practiceBtn + '</div>';
  }).join('') + '</div>';
}

function renderSummary(){
  var built=0, stuck=0;
  var byTrack = {};
  queue.forEach(function(d){
    var ok = grades[d.id]==="got";
    if(ok) built++; else stuck++;
    byTrack[d.track] = byTrack[d.track] || {ok:0,total:0};
    byTrack[d.track].total++;
    if(ok) byTrack[d.track].ok++;
  });
  var trackKeys = Object.keys(byTrack);
  var rows = trackKeys.length > 1 ? trackKeys.sort(function(a,b){return a-b;}).map(function(t){
    var s = byTrack[t];
    return '<div class="trackrow"><span class="l">Track '+t+'</span><span>'+s.ok+'/'+s.total+'</span></div>';
  }).join('') : '';
  // The only thing on this screen you might act on is a miss, so it's the
  // only thing coloured here.
  var summaryLine = built+' of '+queue.length+' got it'+(stuck ? ', <span class="miss">'+stuck+' not yet</span>' : '')+'.';
  return '<div class="summary">' +
    '<div class="summary-line">'+summaryLine+'</div>' +
    (isDone(pack.id) ? '<p class="donenote">This track is marked done.</p>' : '') +
    (rows ? '<div class="tracks">'+rows+'</div>' : '') +
    '</div>';
}

function summaryBarHtml(){
  var stuck = queue.filter(function(d){ return grades[d.id] !== "got"; }).length;
  // "Redo the misses" is suppressed at zero misses rather than shown disabled.
  var redoHtml = stuck>0 ? '<button class="textlink" id="redoBtn">Redo the misses</button>' : '';
  var restartHtml = '<button class="textlink" id="restartBtn">Start over</button>';

  if(pack.recap){
    // A recap can never mark a track done - see maybeAutoFinish() - so its
    // only "finish" action is leaving, never a done-mark. "All tracks" was
    // already exactly that button; relabelled rather than adding a second,
    // redundant one beside it.
    return barStack('<button class="btn" id="newRecapBtn">New recap</button>' +
      '<div class="row2"><button class="textlink" id="topHomeBtn2">Finish</button></div>');
  }
  if(ruleFilterId){
    return barStack('<button class="btn" id="backToFullBtn">Back to Track '+pack.tracks[0]+'</button>' +
      '<div class="row2">'+redoHtml+restartHtml+'</div>');
  }
  var next = nextPackAfter(pack);
  if(next){
    // Continuing is the more common next action, so it stays primary - but
    // Finish is a real second choice beside it (bordered, see .btn.secondary),
    // not a text link buried in the row underneath: leaving here is exactly
    // as legitimate a thing to do as moving on to the next track, and it's
    // the one shape of this screen where the two genuinely compete.
    return barStack(
      '<div class="row1"><button class="btn" id="continueBtn">Continue to Track '+next.tracks[0]+'</button>' +
      '<button class="btn secondary" id="finishBtn">Finish</button></div>' +
      '<div class="row2">'+redoHtml+restartHtml+'</div>');
  }
  return barStack('<button class="btn" id="topHomeBtn2">Finish &mdash; course complete!</button>' +
    '<div class="row2">'+redoHtml+restartHtml+'</div>');
}

function render(){
  var app = document.getElementById('app');
  var prevScrollY = window.scrollY;
  var sameView = (lastRenderedView === view);

  var active = document.activeElement;
  var activeId = (active && active.id) ? active.id : null;
  var selStart = null, selEnd = null;
  if(activeId && typeof active.selectionStart === "number"){
    selStart = active.selectionStart; selEnd = active.selectionEnd;
  }

  var html = headHtml() + '<main id="main" class="view-'+view+'">';

  if(view==="home"){
    html += renderHome();
  } else if(view==="glossary"){
    html += renderGlossary();
  } else if(view==="drill"){
    html += renderDrill();
  } else if(view==="rules"){
    html += renderRules();
  } else if(view==="summary"){
    html += renderSummary();
  } else if(view==="backup"){
    html += renderBackup();
  }
  html += '</main>';

  // The Rules tab is reached and left purely via the tab strip (plus the
  // back arrow to exit the track) - no sticky bar of its own, in keeping
  // with "no boxes, no extra chrome" once you're just reading.
  if(view==="drill") html += drillBarHtml();
  else if(view==="summary") html += summaryBarHtml();

  // A drill is an app screen, not a document: lock the page to the viewport
  // so it cannot scroll, then fit the stage into what is left.
  var locked = (view==="drill");
  document.documentElement.classList.toggle('lock', locked);
  document.body.classList.toggle('lock', locked);

  app.innerHTML = html;
  wire();
  if(locked) fitDrill(); else clearFit();

  if(sameView){ window.scrollTo(0, prevScrollY); }
  lastRenderedView = view;

  if(activeId){
    var newActive = document.getElementById(activeId);
    if(newActive){
      newActive.focus({preventScroll:true});
      if(selStart!=null && typeof newActive.setSelectionRange === "function"){
        try{ newActive.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }

  if(view==="rules" && highlightRule){
    var el = document.getElementById('rule-'+highlightRule);
    if(el){ el.scrollIntoView({block:"center", behavior: prefersReducedMotion() ? "auto" : "smooth"}); }
    setTimeout(function(){ highlightRule=null; }, 2000);
  }
  if(view==="home"){
    if(homeJustEntered){
      homeJustEntered = false;
      var rec = nextRecommendedTrack();
      if(rec){
        var card = document.getElementById('pack-'+rec.id);
        if(card){ card.scrollIntoView({block:"center", behavior: prefersReducedMotion() ? "auto" : "smooth"}); }
      }
    }
  }

  if(suppressPush){
    lastPushedView = view;
  } else if(lastPushedView !== view){
    try{ history.pushState({view: view, packId: pack ? pack.id : null}, ''); }catch(e){}
    lastPushedView = view;
  }
}

// Toggling "done" changes more than one class (the progress column goes
// from a count to nothing at all - see packCardHtml()), so the row and the
// "where you left off" block are re-derived and swapped in whole rather than
// patched piece by piece. wireOne() re-attaches the handful of listeners a
// freshly-inserted fragment needs, since element.replaceWith()/outerHTML
// don't carry old listeners over.
function handleDoneBtnClick(ev, el){
  ev.stopPropagation();
  var pid = el.getAttribute('data-pid');
  var p = DATA.packs.filter(function(x){ return x.id===pid; })[0];
  if(!p) return;
  setDone(pid, !isDone(pid));

  var card = el.closest('.packcard');
  if(card){
    var tmp = document.createElement('div');
    tmp.innerHTML = packCardHtml(p);
    var fresh = tmp.firstChild;
    card.replaceWith(fresh);
    wireOne(fresh);
  }

  var hero = document.getElementById('homeHero');
  if(hero){
    hero.outerHTML = homeHeroHtml();
    wireOne(document.getElementById('homeHero'));
  }
}

function handleContinueBtnClick(ev){
  var pid = ev.currentTarget.getAttribute('data-pid');
  var p = DATA.packs.filter(function(x){ return x.id===pid; })[0];
  if(p) openPack(p);
}

function wireOne(root){
  if(!root) return;
  var rb = root.querySelector('.rowbtn');
  if(rb) rb.addEventListener('click', function(){
    var p = DATA.packs.filter(function(x){ return x.id===rb.getAttribute('data-pid'); })[0];
    if(p) openPack(p);
  });
  var db = root.querySelector('.donebtn');
  if(db) db.addEventListener('click', function(ev){ handleDoneBtnClick(ev, db); });
  var cb = root.querySelector('#continueCardBtn');
  if(cb) cb.addEventListener('click', handleContinueBtnClick);
}

function wire(){
  on('undoBtn', undoReveal);
  on('prevDrillBtn', prevDrill);
  on('topHomeBtn', enterHome);
  on('glossaryBtn', function(){ enterGlossary(); });
  on('glossJumpBtn', function(){ enterGlossary(homeFilter); });
  on('glossarySearch', function(ev){ glossaryFilter = ev.target.value; render(); }, 'input');
  onAll('.glosshead', function(ev, el){
    var fam = el.getAttribute('data-fam');
    openFamily = (openFamily===fam) ? null : fam;
    render();
  });
  onAll('.gpractice', function(ev, el){
    var p = DATA.packs.filter(function(x){ return x.id===el.getAttribute('data-pid'); })[0];
    if(p) openPack(p, {ruleFilter: el.getAttribute('data-ruleid')});
  });
  on('topHomeBtn2', enterHome);
  on('homeBtn', enterHome);
  on('tabDrills', function(){ view = "drill"; render(); });
  on('tabRules', function(){ view = "rules"; render(); });

  onAll('.rowbtn', function(ev, el){
    var p = DATA.packs.filter(function(x){return x.id===el.getAttribute('data-pid');})[0];
    if(p) openPack(p);
  });
  onAll('.donebtn', handleDoneBtnClick);
  on('continueCardBtn', handleContinueBtnClick);
  on('recapBtn', function(){ startRecap(); render(); });
  on('newRecapBtn', function(){ startRecap(); render(); });

  on('homeSearch', function(ev){ homeFilter = ev.target.value; render(); }, 'input');
  on('demoResetBtn', function(){ resetDemoProgress(); render(); });

  on('backupBtn', enterBackup);
  on('exportBtn', doExport);
  onAll('input[name="backupMode"]', function(ev, el){
    backupMode = el.value; backupConfirmReplace = false; backupMsg = null; backupMsgKind = null; render();
  }, 'change');
  on('backupConfirm', function(ev){ backupConfirmReplace = ev.target.checked; render(); }, 'change');
  on('importBtn', function(){ var el = document.getElementById('importFile'); if(el) el.click(); });
  on('importFile', function(ev){ handleImportFile(ev.target.files && ev.target.files[0]); }, 'change');

  on('nextStepBtn', nextStep);
  on('revealBtn', function(){ answerShown = true; render(); });
  on('speakBtn', function(){ var d = queue[idx]; if(d) speak(d.answer); });
  on('stuckBtn', function(){ grade(false); });
  on('gotBtn', function(){ grade(true); });

  onAll('.rulelink', function(ev, el){
    var rid = el.getAttribute('data-ruleid');
    highlightRule = rid; view = "rules"; render();
  });
  onAll('.practicebtn', function(ev, el){
    var rid = el.getAttribute('data-ruleid');
    startSession({ruleFilter: rid});
    render();
  });
  on('clearRuleFilterBtn', function(){ startSession(); render(); });
  on('backToFullBtn', function(){ startSession(); render(); });

  on('redoBtn', function(){
    queue = queue.filter(function(d){ return grades[d.id] !== "got"; });
    idx=0; answerShown=false; revealedSteps=0;
    view = queue.length ? "drill" : "summary";
    render();
  });
  on('restartBtn', function(){ startSession({restart:true}); render(); });
  // "Continue to Track N+1" skips enterHome() entirely (it opens the next
  // pack directly), so it runs the same auto-finish check enterHome() does
  // rather than marking this track done unconditionally - a track can only
  // reach this button once every one of its own drills has just been
  // graded, so in practice this always fires, but it stays gated for the
  // same reason enterHome()'s check is: "done" means "worked through", not
  // "moved past".
  on('continueBtn', function(){
    maybeAutoFinish(pack);
    var next = nextPackAfter(pack);
    if(next){ openPack(next); } else { enterHome(); }
  });
  on('finishBtn', enterHome);
}

window.addEventListener('popstate', function(ev){
  if(view==="glossary" || view==="backup"){ suppressPush = true; enterHome(); suppressPush = false; return; }
  if(pack){ suppressPush = true; goBack(); suppressPush = false; }
});

// Rotating the phone, a desktop window resize, or the mobile URL bar
// sliding away all change the box the stage has to fit into. Refit rather
// than re-render: a re-render would rebuild the DOM and lose nothing
// visible, but refitting is the whole of the work and costs one reflow.
var refitPending = false;
function scheduleRefit(){
  if(refitPending || view!=="drill") return;
  refitPending = true;
  requestAnimationFrame(function(){ refitPending = false; if(view==="drill") fitDrill(); });
}
window.addEventListener('resize', scheduleRefit);
window.addEventListener('orientationchange', scheduleRefit);

if(DEMO && !demoProgressExists()) seedDemoProgress();

render();
})();
</script>

// Installable/offline (PWA). See app/sw.tmpl.js for the update strategy -
// short version: the document is always network-first, so being installed
// never means being stuck on an old build.
