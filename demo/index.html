It actually comes from haber, but you don't need to think about that to use it - just drop it in front of what exists.","examples":["Hay alguien aquí. - There is somebody here.","Hay dos personas aquí. - There are two people here."],"track":76},{"id":"t76__mood-after-hay-que","family":"mood-after-hay-que","title":"hay/había + que + mood tense, when you don't know it exists","explanation":"When hay or había introduces something with a que clause and you're not asserting that it exists - you're wondering, asking, or requiring it - the verb after que goes into the mood tense. If you're just stating what there is as a fact, you stay in the normal present or past.","examples":["¿Hay alguien aquí que hable español? (Is there anybody here who speaks Spanish? - not asserted)","Hay dos personas aquí que hablan español. (There are two people here who speak Spanish - a fact.)"],"track":76},{"id":"t76__haber-for-exist-be","family":"haber-for-exist-be","title":"haber for the \"be\" that means exist","explanation":"When English be really means exist - there has to be, there must be - that be is not ser or estar, it's haber. If your instinct is to pick between ser and estar and neither fits, check whether you actually mean exist.","examples":["Tiene que haber algo que puedas hacer. - There has to be something you can do.","Debería haber algo para comer. - There should be something to eat."],"track":76},{"id":"t76__habia-there-was-were","family":"habia-there-was-were","title":"había = there was / there were","explanation":"había is the past of hay and, like hay, never changes - it covers both there was and there were. Resist the urge to add an n to make it plural; that's a very tempting mistake.","examples":["Había dos personas aquí. - There were two people here.","Había algo que comer. - There was something to eat."],"track":76}],"drills":[{"id":"t76-01","type":"sentence","prompt":"There is somebody here that wants to speak with you. (formal)","answer":"Hay alguien aquí que quiere hablar con usted.","steps":["there is somebody here: Hay alguien aquí","that wants to speak with you, formal: que quiere hablar con usted"],"rules":["t76__hay-there-is-are"],"track":76,"source":"track"},{"id":"t76-02","type":"sentence","prompt":"Is there somebody here that speaks Spanish?","answer":"¿Hay alguien aquí que hable español?","steps":["is there somebody here: ¿Hay alguien aquí","that speaks Spanish - you don't know if this person exists, so the mood tense: que hable español"],"rules":["t76__hay-there-is-are","t76__mood-after-hay-que"],"track":76,"source":"track"},{"id":"t76-03","type":"sentence","prompt":"There are two people here that speak Spanish.","answer":"Hay dos personas aquí que hablan español.","steps":["there are two people here: Hay dos personas aquí","just stating a fact about them, no mood tense: que hablan español"],"rules":["t76__hay-there-is-are"],"track":76,"source":"track","note":"The one above asks about someone who may not exist; this one states a fact about two people who do."},{"id":"t76-04","type":"sentence","prompt":"There were two people here that spoke Spanish.","answer":"Había dos personas aquí que hablaban español.","steps":["there were two people here: Había dos personas aquí","spoke - this describes them as Spanish-speakers, an ongoing state, so the line in the past: que hablaban español"],"rules":["t76__habia-there-was-were"],"track":76,"source":"track"},{"id":"t76-05","type":"sentence","prompt":"There has to be something that you can do. (informal)","answer":"Tiene que haber algo que puedas hacer.","steps":["there has to be: tiene que haber","something: algo","that you can do - unknown, so the mood tense: que puedas hacer"],"rules":["t76__haber-for-exist-be","t76__mood-after-hay-que"],"track":76,"source":"track"},{"id":"t76-x01","type":"sentence","prompt":"Is there somebody here that speaks English?","answer":"¿Hay alguien aquí que hable inglés?","steps":["is there somebody here: ¿Hay alguien aquí","that speaks English, unknown existence, mood tense: que hable inglés"],"rules":["t76__hay-there-is-are","t76__mood-after-hay-que"],"track":76,"source":"extension","difficulty":1},{"id":"t76-x02","type":"sentence","prompt":"There has to be something that I can eat.","answer":"Tiene que haber algo que pueda comer.","steps":["there has to be: Tiene que haber","something: algo","that I can (mood tense) eat: que pueda comer"],"rules":["t76__haber-for-exist-be","t76__mood-after-hay-que"],"track":76,"source":"extension","difficulty":2},{"id":"t76-x03","type":"sentence","prompt":"There was somebody here that wanted to speak with you. (formal)","answer":"Había alguien aquí que quería hablar con usted.","steps":["there was: había, and it never takes an n even for more than one","somebody here: alguien aquí","that wanted, ongoing, so the line in the past: que quería","to speak with you, formal: hablar con usted"],"rules":["t76__habia-there-was-were"],"track":76,"source":"extension","difficulty":3}],"blurb":"hay and había for there is and there was, and the be that means exist","sectionIndex":8},{"id":"t77","label":"Track 77","tracks":[77],"rules":[{"id":"t77__es-adjective-que-mood","family":"es-adjective-que-mood","title":"es/está + adjective + que + mood tense","explanation":"It is + adjective + que is one of the biggest triggers for the mood tense: es terrible que, es posible que, es importante que, está bien que, no es necesario que. The que hands off into the mood tense on the next verb. Swap que for si (if) and you lose the mood tense - you're back to a plain fact.","examples":["Es terrible que comas esto. - It's terrible that you eat this.","Es posible que vayamos más tarde. - It's possible that we'll go later.","No es necesario que responda. - It isn't necessary for him to answer."],"track":77},{"id":"t77__should-deberia","family":"should-deberia","title":"Should: debería","explanation":"Deber (to owe, must) doesn't contract like poder or haber - just add -ía straight onto it: debería, deberías, deberíamos, deberían, which means should. After it, use the plain to form of the next verb directly, with no extra word for to, even though English inserts one after should.","examples":["deber + ía -> debería - I/he/she/you should","deberías venir - you should come","deberíamos hablar - we should speak"],"track":43},{"id":"t77__que-exclamation-mood","family":"que-exclamation-mood","title":"qué + adjective + que = how X that...","explanation":"qué works like how in exclamations: qué fuerte, how hardcore; qué lindo, how nice. Add a second que afterward to attach a clause, and that clause carries on into the mood tense, same as after es + adjective + que.","examples":["Qué fuerte que esté aquí. - How wild that he's here.","Qué increíble que vengas. - How incredible that you're coming."],"track":77},{"id":"t77__haber-for-exist-be","family":"haber-for-exist-be","title":"haber for the \"be\" that means exist","explanation":"When English be really means exist - there has to be, there must be - that be is not ser or estar, it's haber. If your instinct is to pick between ser and estar and neither fits, check whether you actually mean exist.","examples":["Tiene que haber algo que puedas hacer. - There has to be something you can do.","Debería haber algo para comer. - There should be something to eat."],"track":76},{"id":"t77__mood-after-hay-que","family":"mood-after-hay-que","title":"hay/había + que + mood tense, when you don't know it exists","explanation":"When hay or había introduces something with a que clause and you're not asserting that it exists - you're wondering, asking, or requiring it - the verb after que goes into the mood tense. If you're just stating what there is as a fact, you stay in the normal present or past.","examples":["¿Hay alguien aquí que hable español? (Is there anybody here who speaks Spanish? - not asserted)","Hay dos personas aquí que hablan español. (There are two people here who speak Spanish - a fact.)"],"track":76}],"drills":[{"id":"t77-01","type":"sentence","prompt":"There should be something to eat.","answer":"Debería haber algo para comer.","steps":["should: Debería","be - this be means exist, so haber: haber","something to eat: algo para comer"],"rules":["t77__should-deberia","t77__haber-for-exist-be"],"track":77,"source":"track"},{"id":"t77-02","type":"sentence","prompt":"It is terrible that you eat this. (informal)","answer":"Es terrible que comas esto.","steps":["it is terrible: Es terrible","that you eat - que triggers the mood tense: que comas esto"],"rules":["t77__es-adjective-que-mood"],"track":77,"source":"track"},{"id":"t77-03","type":"sentence","prompt":"It is terrible if you eat this. (informal)","answer":"Es terrible si comes esto.","steps":["it is terrible: Es terrible","if you eat this - si, not que, so no mood tense: si comes esto"],"rules":["t77__es-adjective-que-mood"],"track":77,"source":"track","note":"Swap que for si and the mood tense goes away - si states a plain fact, que casts your feeling onto it."},{"id":"t77-04","type":"sentence","prompt":"It is possible that we go later.","answer":"Es posible que vayamos más tarde.","steps":["it is possible: es posible","that we go - ir's mood tense is built on vaya: que vayamos","later: más tarde"],"rules":["t77__es-adjective-que-mood"],"track":77,"source":"track"},{"id":"t77-05","type":"sentence","prompt":"How heavy/hardcore that he is here!","answer":"Qué fuerte que esté aquí.","steps":["how hardcore: Qué fuerte","that he is - mood tense: que esté aquí"],"rules":["t77__que-exclamation-mood"],"track":77,"source":"track"},{"id":"t77-06","type":"sentence","prompt":"It's okay that you ask. (informal)","answer":"Está bien que preguntes.","steps":["it's okay: Está bien","that you ask - mood tense: que preguntes"],"rules":["t77__es-adjective-que-mood"],"track":77,"source":"track"},{"id":"t77-07","type":"sentence","prompt":"It's not necessary that I respond.","answer":"No es necesario que responda.","steps":["it's not necessary: No es necesario","that I respond - mood tense: que responda"],"rules":["t77__es-adjective-que-mood"],"track":77,"source":"track","note":"Also fine as No hace falta que responda."},{"id":"t77-08","type":"sentence","prompt":"It's important that we find it soon.","answer":"Es importante que lo encontremos pronto.","steps":["it's important: Es importante","that we find it - mood tense, lo from earlier: que lo encontremos","soon: pronto"],"rules":["t77__es-adjective-que-mood"],"track":77,"source":"track"},{"id":"t77-x01","type":"sentence","prompt":"It is terrible that you drink this. (informal)","answer":"Es terrible que bebas esto.","steps":["it is terrible: Es terrible","that you drink - mood tense: que bebas esto"],"rules":["t77__es-adjective-que-mood"],"track":77,"source":"extension","difficulty":1},{"id":"t77-x02","type":"sentence","prompt":"There should be something that we can eat.","answer":"Debería haber algo que podamos comer.","steps":["there should be: Debería haber","something: algo","that we can (mood tense) eat: que podamos comer"],"rules":["t77__should-deberia","t77__haber-for-exist-be","t77__mood-after-hay-que"],"track":77,"source":"extension","difficulty":2},{"id":"t77-x03","type":"sentence","prompt":"It's important that there is something to eat now.","answer":"Es importante que haya algo para comer ahora.","steps":["it's important: Es importante","that there is - hay itself goes into the mood tense here: que haya","something to eat now: algo para comer ahora"],"rules":["t77__es-adjective-que-mood","t77__mood-after-hay-que"],"track":77,"source":"extension","difficulty":3}],"blurb":"debería haber, and es + adjective + que pulling in the mood tense","sectionIndex":8},{"id":"t78","label":"Track 78","tracks":[78],"rules":[{"id":"t78__cuando-future-mood","family":"cuando-future-mood","title":"cuando + mood tense for future events","explanation":"When cuando (when) points at something in the future that hasn't happened yet, put the following verb in the mood tense. When cuando refers to something general or habitual, use the ordinary present tense instead.","examples":["Cuando hablamos. (generally, when we speak)","Cuando hablemos. (when we speak, future)","Cuando vayamos. (when we go, future)"],"track":73},{"id":"t78__finish-vs-end-up","family":"finish-vs-end-up","title":"terminar + de vs + -ing = finish doing vs end up doing","explanation":"terminar (to finish) connects to a to-form with de: terminar de vender, to finish selling. Swap in the -ing form instead of de + to-form, and the meaning becomes end up doing something.","examples":["Cuando terminen de venderlos. (When they finish selling them.)","Cuando terminen vendiéndolos. (When they end up selling them.)"],"track":78},{"id":"t78__seguir-ing-continue","family":"seguir-ing-continue","title":"seguir + -ing = to continue doing","explanation":"To say you continue or carry on doing something, conjugate seguir and follow it straight with the -ing form of the next verb - no connecting word needed.","examples":["Sigo hablando. - I carry on speaking.","Sigue hablando. - He carries on speaking."],"track":78},{"id":"t78__start-to-vs-start-out","family":"start-to-vs-start-out","title":"empezar/comenzar + a vs + -ing = start to vs start out","explanation":"empezar and comenzar both mean to start, and need the connector a before a to-form: empezar a hablar, to start to speak. Drop the a and use the -ing form instead, and the meaning shifts to start out doing something - right from the beginning.","examples":["Que comiencen a hablar español. - Let them start to speak Spanish.","Que comiencen hablando español. - Let them start out speaking Spanish."],"track":78},{"id":"t78__es-adjective-que-mood","family":"es-adjective-que-mood","title":"es/está + adjective + que + mood tense","explanation":"It is + adjective + que is one of the biggest triggers for the mood tense: es terrible que, es posible que, es importante que, está bien que, no es necesario que. The que hands off into the mood tense on the next verb. Swap que for si (if) and you lose the mood tense - you're back to a plain fact.","examples":["Es terrible que comas esto. - It's terrible that you eat this.","Es posible que vayamos más tarde. - It's possible that we'll go later.","No es necesario que responda. - It isn't necessary for him to answer."],"track":77}],"drills":[{"id":"t78-01","type":"sentence","prompt":"I continue speaking.","answer":"Sigo hablando.","steps":["I continue: Sigo","speaking: hablando"],"rules":["t78__seguir-ing-continue"],"track":78,"source":"track"},{"id":"t78-02","type":"sentence","prompt":"He continues speaking.","answer":"Sigue hablando.","steps":["he continues: Sigue","speaking: hablando"],"rules":["t78__seguir-ing-continue"],"track":78,"source":"track"},{"id":"t78-03","type":"sentence","prompt":"It is probable that he continues speaking.","answer":"Es probable que siga hablando.","steps":["it is probable: Es probable","that he continues - mood tense: que siga","speaking: hablando"],"rules":["t78__es-adjective-que-mood","t78__seguir-ing-continue"],"track":78,"source":"track"},{"id":"t78-04","type":"sentence","prompt":"It's imperative that it continues being free.","answer":"Es imperativo que siga siendo gratis.","steps":["it's imperative: Es imperativo","that it continues - mood tense: que siga","being: siendo","free: gratis"],"rules":["t78__es-adjective-que-mood","t78__seguir-ing-continue"],"track":78,"source":"track"},{"id":"t78-05","type":"sentence","prompt":"It's spectacular that they begin to speak Spanish.","answer":"Es espectacular que comiencen a hablar español.","steps":["it's spectacular: Es espectacular","that they begin - mood tense: que comiencen","to speak - needs a: a hablar español"],"rules":["t78__es-adjective-que-mood","t78__start-to-vs-start-out"],"track":78,"source":"track"},{"id":"t78-06","type":"sentence","prompt":"It's spectacular that they start out speaking Spanish. (right from the beginning)","answer":"Es espectacular que comiencen hablando español.","steps":["it's spectacular: Es espectacular","that they start out - mood tense, no a needed with -ing: que comiencen","speaking: hablando español"],"rules":["t78__es-adjective-que-mood","t78__start-to-vs-start-out"],"track":78,"source":"track","note":"Dropping the a and using the -ing form turns start to into start out."},{"id":"t78-07","type":"sentence","prompt":"I want you guys to speak with me when you finish selling them.","answer":"Quiero que hablen conmigo cuando terminen de venderlos.","steps":["I want that you guys speak with me (earlier mood pattern): Quiero que hablen conmigo","when - future event, mood tense: cuando terminen","finish selling them, de + to-form: de venderlos"],"rules":["t78__finish-vs-end-up","t78__cuando-future-mood"],"track":78,"source":"track"},{"id":"t78-08","type":"sentence","prompt":"I want you guys to speak with me when you end up selling them.","answer":"Quiero que hablen conmigo cuando terminen vendiéndolos.","steps":["I want that you guys speak with me: Quiero que hablen conmigo","when - future event, mood tense: cuando terminen","end up selling them, -ing instead of de + to-form: vendiéndolos"],"rules":["t78__finish-vs-end-up","t78__cuando-future-mood"],"track":78,"source":"track","note":"-ing after terminar means end up doing, not finish doing."},{"id":"t78-x01","type":"sentence","prompt":"She continues eating.","answer":"Sigue comiendo.","steps":["she continues: Sigue","eating: comiendo"],"rules":["t78__seguir-ing-continue"],"track":78,"source":"extension","difficulty":1},{"id":"t78-x02","type":"sentence","prompt":"It's probable that they finish selling them soon.","answer":"Es probable que terminen de venderlos pronto.","steps":["it's probable: Es probable","that they finish - mood tense: que terminen","selling them, de + to-form: de venderlos","soon: pronto"],"rules":["t78__es-adjective-que-mood","t78__finish-vs-end-up"],"track":78,"source":"extension","difficulty":2},{"id":"t78-x03","type":"sentence","prompt":"It's spectacular that she continues speaking Spanish when she finishes selling them.","answer":"Es espectacular que siga hablando español cuando termine de venderlos.","steps":["it's spectacular: Es espectacular","that she continues speaking - mood tense: que siga hablando español","when - future event, mood tense: cuando termine","finishes selling them: de venderlos"],"rules":["t78__es-adjective-que-mood","t78__seguir-ing-continue","t78__finish-vs-end-up","t78__cuando-future-mood"],"track":78,"source":"extension","difficulty":3}],"blurb":"seguir plus -ing, and what a and de do to empezar and terminar","sectionIndex":8},{"id":"t79","label":"Track 79","tracks":[79],"rules":[{"id":"t79__subjunctive-trigger-verbs","family":"subjunctive-trigger-verbs","title":"Verbs that cast your subjectivity make the next verb switch","explanation":"Verbs that show what you want, need, prefer, hope, or like to happen (quiero, necesito, prefiero, espero, me gusta) are followed by que, and the verb after que goes into the mood tense. It's not just the structure - it's the feeling of pushing your will or hope onto the world.","examples":["necesito que lo prepare - I need you to prepare it","prefiero que se quede - I prefer that he stays","espero que cuentes conmigo - I hope you count on me","me gusta que la profesora visite - I like that the teacher visits"],"track":70},{"id":"t79__ojala","family":"ojala","title":"ojalá + mood tense","explanation":"ojalá means hopefully, and it comes from an old Arabic phrase calling on Allah - law sha'a Allah, if God wills it. Everything you hope for after it goes into the mood tense, which makes sense: nothing about it has happened yet.","examples":["ojalá deje un mensaje - hopefully she leaves a message","ojalá sea pronto - hopefully it'll be soon"],"track":79},{"id":"t79__dejar-leave","family":"dejar-leave","title":"dejar - to leave something behind","explanation":"dejar is to leave in the sense of leaving something behind - a message, a tip, a key. It is not the leave that means going out; that's salir. It behaves like any other regular -ar verb, in commands and in the mood tense alike.","examples":["déjeme un mensaje - leave me a message (formal)","quiero que me dejes un mensaje - I want you to leave me a message","ojalá deje un mensaje - hopefully she leaves a message"],"track":79},{"id":"t79__cuando-future-mood","family":"cuando-future-mood","title":"cuando + mood tense for future events","explanation":"When cuando (when) points at something in the future that hasn't happened yet, put the following verb in the mood tense. When cuando refers to something general or habitual, use the ordinary present tense instead.","examples":["Cuando hablamos. (generally, when we speak)","Cuando hablemos. (when we speak, future)","Cuando vayamos. (when we go, future)"],"track":73},{"id":"t79__es-adjective-que-mood","family":"es-adjective-que-mood","title":"es/está + adjective + que + mood tense","explanation":"It is + adjective + que is one of the biggest triggers for the mood tense: es terrible que, es posible que, es importante que, está bien que, no es necesario que. The que hands off into the mood tense on the next verb. Swap que for si (if) and you lose the mood tense - you're back to a plain fact.","examples":["Es terrible que comas esto. - It's terrible that you eat this.","Es posible que vayamos más tarde. - It's possible that we'll go later.","No es necesario que responda. - It isn't necessary for him to answer."],"track":77},{"id":"t79__command-mood","family":"command-mood","title":"Orders are made with the mood tense","explanation":"To tell someone to do or not do something, you take the you-don't form of the verb and switch it into the mood tense - this works for informal negative, formal (positive and negative), and plural (positive and negative) orders. There's one exception: positive informal (tú) orders, which use a shortcut instead.","examples":["no hables - don't speak","no te quedes aquí - don't stay here","coman - eat! (plural)","no lo coma - don't eat it (formal)"],"track":72},{"id":"t79__positive-informal-shortcut","family":"positive-informal-shortcut","title":"The one command that skips the mood tense: positive tú orders","explanation":"Positive informal (tú) commands don't use the mood tense - Spanish takes a shortcut instead, because this is such common everyday speech. Take the tú/you-informal present form and drop the final s: compras becomes compra. This lands on the same form as he/she/it, but tone of voice and the attached little word (lo, me...) make it obviously a command.","examples":["compra - buy (from compras)","cómpralo - buy it","cállate - shut up (quiet yourself)"],"track":72},{"id":"t79__command-word-order","family":"command-word-order","title":"Little words jump to the end, but only for positive orders","explanation":"Small words like me, lo, se normally come before the verb. With a positive command (telling someone TO do something), they break that rule and attach onto the end of the verb instead, written as one word. With a negative command (telling someone NOT to do something), they stay in their normal spot before the verb. This shift is one of the things that helps your ear catch that it's a command.","examples":["espérenme - wait for me (positive)","no los esperen - don't wait for them (negative, back in front)","cómalo - eat it (positive)","no lo coma - don't eat it (negative, back in front)"],"track":72},{"id":"t79__tial-to-cial","family":"tial-to-cial","title":"English -tial comes over as -cial","explanation":"Another of the convertible endings: English words in -tial land in Spanish as -cial, and any English double letter collapses to one on the way. Essential comes out esencial, and the same shape gives you especial and espacial with their extra e on the front.","examples":["essential -> esencial","special -> especial","spatial -> espacial"],"track":79}],"drills":[{"id":"t79-01","type":"word","prompt":"leave, as in leave a message (not go out)","answer":"Dejar","steps":["the leave that means go out is salir","this is the other one, leaving something behind: dejar"],"rules":["t79__dejar-leave"],"track":79,"source":"track"},{"id":"t79-02","type":"sentence","prompt":"Leave me a message. (formal)","answer":"Déjeme un mensaje.","steps":["a formal order, so the mood tense: deje","me, and it's a positive order, so it rides on the end: déjeme","a message: un mensaje"],"rules":["t79__dejar-leave","t79__command-mood","t79__command-word-order"],"track":79,"source":"track"},{"id":"t79-03","type":"sentence","prompt":"I want you to leave me a message. (informal)","answer":"Quiero que me dejes un mensaje.","steps":["I want that: quiero que","you leave, pulled into the mood tense: dejes","me, in front of the verb: me dejes","a message: un mensaje"],"rules":["t79__dejar-leave","t79__subjunctive-trigger-verbs"],"track":79,"source":"track"},{"id":"t79-04","type":"sentence","prompt":"I want to tell him to leave me a message.","answer":"Quiero decirle que me deje un mensaje.","steps":["I want to tell him: quiero decirle","that: que","he leave me a message - you're pushing your wish onto him, so the mood tense: me deje un mensaje"],"rules":["t79__dejar-leave","t79__subjunctive-trigger-verbs"],"track":79,"source":"track"},{"id":"t79-05","type":"sentence","prompt":"When she leaves you the message, call me. (informal)","answer":"Cuando te deje el mensaje, llámame.","steps":["when - it hasn't happened yet, so the mood tense: cuando deje","you, in front: te deje","the message: el mensaje","call me - informal order, drop the s off llamas, and me rides on the end: llámame"],"rules":["t79__dejar-leave","t79__cuando-future-mood","t79__positive-informal-shortcut","t79__command-word-order"],"track":79,"source":"track"},{"id":"t79-06","type":"word","prompt":"essential","answer":"Esencial","steps":["English -tial comes over as -cial: esencial"],"rules":["t79__tial-to-cial"],"track":79,"source":"track"},{"id":"t79-07","type":"sentence","prompt":"It's essential that he sees my message.","answer":"Es esencial que vea mi mensaje.","steps":["it's essential: es esencial","that, pulling in the mood tense: que","he sees - ver's mood tense is built on veo: vea","my message: mi mensaje"],"rules":["t79__es-adjective-que-mood"],"track":79,"source":"track"},{"id":"t79-08","type":"word","prompt":"hopefully","answer":"Ojalá","steps":["from an old Arabic phrase for if God wills it: ojalá"],"rules":["t79__ojala"],"track":79,"source":"track"},{"id":"t79-09","type":"sentence","prompt":"Hopefully she leaves a message.","answer":"Ojalá deje un mensaje.","steps":["hopefully: ojalá","nothing has happened yet, so the mood tense: deje","a message: un mensaje"],"rules":["t79__dejar-leave","t79__ojala"],"track":79,"source":"track"},{"id":"t79-10","type":"sentence","prompt":"Hopefully it'll be soon.","answer":"Ojalá sea pronto.","steps":["hopefully: ojalá","ser's mood tense is irregular: sea - the same sea as in o sea","soon: pronto"],"rules":["t79__ojala"],"track":79,"source":"track"},{"id":"t79-x01","type":"sentence","prompt":"Leave me a message. (informal)","answer":"Déjame un mensaje.","steps":["an informal positive order: drop the s off dejas: deja","me rides on the end: déjame","a message: un mensaje"],"rules":["t79__dejar-leave","t79__positive-informal-shortcut","t79__command-word-order"],"track":79,"source":"extension","difficulty":1},{"id":"t79-x02","type":"sentence","prompt":"Hopefully he leaves something.","answer":"Ojalá deje algo.","steps":["hopefully: ojalá","he leaves, mood tense: deje","something: algo"],"rules":["t79__dejar-leave","t79__ojala"],"track":79,"source":"extension","difficulty":1},{"id":"t79-x03","type":"sentence","prompt":"I want to tell you to leave me something now. (informal)","answer":"Quiero decirte que me dejes algo ahora.","steps":["I want to tell you: quiero decirte","that you leave me, mood tense: que me dejes","something: algo","now: ahora"],"rules":["t79__dejar-leave","t79__subjunctive-trigger-verbs"],"track":79,"source":"extension","difficulty":2},{"id":"t79-x04","type":"sentence","prompt":"Hopefully she leaves me a message when she arrives.","answer":"Ojalá me deje un mensaje cuando llegue.","steps":["hopefully: ojalá","she leaves me a message, mood tense: me deje un mensaje","when - it has not happened yet, so the mood tense again: cuando llegue"],"rules":["t79__ojala","t79__dejar-leave","t79__cuando-future-mood"],"track":79,"source":"extension","difficulty":3}],"blurb":"dejar for leaving a message, and ojalá for hopefully","sectionIndex":8},{"id":"t80","label":"Track 80","tracks":[80],"rules":[{"id":"t80__self-se","family":"self-se","title":"It happens to itself: se for it breaks, it sells","explanation":"When a verb's action isn't going out to anything else - it breaks, it burns, it sells, it changes - Spanish shows this with se in front of the verb, wrapping the sentence up without naming what's being acted on. Without se, the sentence sounds unfinished, like it's still waiting to hear what got broken.","examples":["romper -> se rompe - it breaks/gets broken","quemar -> la cena se quemaba - the dinner was burning","vender -> se vende - it sells itself / for sale"],"track":47},{"id":"t80__double-l-to-se","family":"double-l-to-se","title":"Two l's together turn into se: le lo becomes se lo","explanation":"When le or les would land right before lo, la, los or las, Spanish doesn't like the sound of two l's together, so the first one - le or les - turns into se instead. This is purely about sound, not meaning, and it's a different se from the reflexive one.","examples":["le lo di -> se lo di","les los vendí -> se los vendí","le lo envió -> se lo envió"],"track":62},{"id":"t80__preterite-ar","family":"preterite-ar","title":"The point in the past for -ar verbs","explanation":"Take the -ar off the verb and put é on for I, with the accent on that e, or ó on for he/she/it/you-formal, with the accent on that o. Hablar is the hook: hablé (I spoke), habló (he spoke) - check any -ar verb against it.","examples":["hablar -> hablé - I spoke","hablar -> habló - he spoke","comprar -> compré - I bought","enviar -> envié - I sent"],"track":58},{"id":"t80__se-on-me","family":"se-on-me","title":"se + me/te/le: it happened on me","explanation":"You already have se for things that happen by themselves - la puerta se cierra, the door closes. Slot me, te, le, nos or les in after that se and the thing now happens on somebody: la puerta se me cierra, the door closes on me. It shrugs the blame off nicely, and Spanish uses it far more widely than English, which only manages it with a handful of verbs.","examples":["la puerta se cierra -> la puerta se me cierra - the door closes on me","la cena se me quema - the dinner is burning on me","la batería siempre se me acaba - my battery always runs out on me"],"track":80},{"id":"t80__ojala","family":"ojala","title":"ojalá + mood tense","explanation":"ojalá means hopefully, and it comes from an old Arabic phrase calling on Allah - law sha'a Allah, if God wills it. Everything you hope for after it goes into the mood tense, which makes sense: nothing about it has happened yet.","examples":["ojalá deje un mensaje - hopefully she leaves a message","ojalá sea pronto - hopefully it'll be soon"],"track":79},{"id":"t80__subjunctive-trigger-verbs","family":"subjunctive-trigger-verbs","title":"Verbs that cast your subjectivity make the next verb switch","explanation":"Verbs that show what you want, need, prefer, hope, or like to happen (quiero, necesito, prefiero, espero, me gusta) are followed by que, and the verb after que goes into the mood tense. It's not just the structure - it's the feeling of pushing your will or hope onto the world.","examples":["necesito que lo prepare - I need you to prepare it","prefiero que se quede - I prefer that he stays","espero que cuentes conmigo - I hope you count on me","me gusta que la profesora visite - I like that the teacher visits"],"track":70},{"id":"t80__noun-to-verb-r","family":"noun-to-verb-r","title":"Make a verb out of a noun by putting -r on the end","explanation":"You've been doing this with -ación words; it isn't limited to them. Take a noun that already ends in a vowel and stick an -r on: la cocina (the kitchen) gives cocinar, to cook. English kept the same root in concoction - literally 'with cooking'.","examples":["la cocina -> cocinar - to cook","cocinar -> cocino - I cook","concoction = con + cocción, with-cooking"],"track":25}],"drills":[{"id":"t80-01","type":"sentence","prompt":"He stays.","answer":"Se queda.","steps":["to stay is to remain yourself: quedarse","he remains: queda, with se in front"],"rules":["t80__self-se"],"track":80,"source":"track"},{"id":"t80-02","type":"word","prompt":"to prepare","answer":"Preparar","steps":["preparación, drop -ción, add -r: preparar"],"rules":["t80__noun-to-verb-r"],"track":80,"source":"track"},{"id":"t80-03","type":"sentence","prompt":"I prepare it for them.","answer":"Se lo preparo.","steps":["I prepare: preparo","it: lo, out in front","for them would be les, but les lo isn't allowed - les becomes se: se lo preparo"],"rules":["t80__double-l-to-se"],"track":80,"source":"track"},{"id":"t80-04","type":"sentence","prompt":"The door closes.","answer":"La puerta se cierra.","steps":["the door: la puerta","nothing else is named as closing it, so it closes itself: se cierra"],"rules":["t80__self-se"],"track":80,"source":"track"},{"id":"t80-05","type":"sentence","prompt":"The door closes on me.","answer":"La puerta se me cierra.","steps":["the door closes: la puerta se cierra","on me: slot me in straight after the se"],"rules":["t80__se-on-me"],"track":80,"source":"track"},{"id":"t80-06","type":"word","prompt":"to burn","answer":"Quemar","steps":["you've had this one as a state: quemado, burnt","the verb behind it: quemar"],"rules":["t80__noun-to-verb-r"],"track":80,"source":"track"},{"id":"t80-07","type":"sentence","prompt":"The dinner is burning on me.","answer":"La cena se me quema.","steps":["the dinner: la cena","it burns itself: se quema","on me: me straight after the se"],"rules":["t80__se-on-me"],"track":80,"source":"track"},{"id":"t80-08","type":"word","prompt":"to finish, to run out","answer":"Acabar","steps":["acabar - the same root as English's 'to a head', it comes to an end"],"rules":["t80__noun-to-verb-r"],"track":80,"source":"track"},{"id":"t80-09","type":"sentence","prompt":"My battery always runs out on me.","answer":"La batería siempre se me acaba.","steps":["the battery: la batería","always: siempre, before the verb group","it runs itself out on me: se me acaba"],"rules":["t80__se-on-me"],"track":80,"source":"track"},{"id":"t80-10","type":"sentence","prompt":"Does the battery run out on you? (informal)","answer":"¿La batería se te acaba?","steps":["the battery: la batería","on you, informal: te in the me slot: se te acaba","said as a question"],"rules":["t80__se-on-me"],"track":80,"source":"track"},{"id":"t80-11","type":"sentence","prompt":"Does the battery run out on you? (formal)","answer":"¿La batería se le acaba?","steps":["the battery: la batería","formal you here is on you, not you being acted on, so le, not lo: se le acaba"],"rules":["t80__se-on-me"],"track":80,"source":"track"},{"id":"t80-12","type":"sentence","prompt":"The dinner burned.","answer":"La cena se quemó.","steps":["the dinner: la cena","it burned itself, a dot in the past: quemar -> se quemó"],"rules":["t80__self-se","t80__preterite-ar"],"track":80,"source":"track"},{"id":"t80-13","type":"sentence","prompt":"The dinner burned on me.","answer":"La cena se me quemó.","steps":["the dinner burned: la cena se quemó","on me: me straight after the se"],"rules":["t80__se-on-me","t80__preterite-ar"],"track":80,"source":"track"},{"id":"t80-x01","type":"sentence","prompt":"The dinner is burning on us.","answer":"La cena se nos quema.","steps":["the dinner burns itself: la cena se quema","on us: nos after the se"],"rules":["t80__se-on-me"],"track":80,"source":"extension","difficulty":1},{"id":"t80-x02","type":"sentence","prompt":"Does the door close on you? (informal)","answer":"¿La puerta se te cierra?","steps":["the door closes: la puerta se cierra","on you, informal: te after the se"],"rules":["t80__se-on-me"],"track":80,"source":"extension","difficulty":1},{"id":"t80-x03","type":"sentence","prompt":"I don't want the dinner to burn on me.","answer":"No quiero que la cena se me queme.","steps":["I don't want that: no quiero que, which pulls in the mood tense","the dinner: la cena","burns on me, in the mood tense: se me queme"],"rules":["t80__subjunctive-trigger-verbs","t80__se-on-me"],"track":80,"source":"extension","difficulty":2},{"id":"t80-x04","type":"sentence","prompt":"Hopefully the battery doesn't run out on me.","answer":"Ojalá no se me acabe la batería.","steps":["hopefully: ojalá, and nothing after it has happened yet, so the mood tense","it doesn't run out on me: no se me acabe","the battery: la batería, which can sit at the end"],"rules":["t80__ojala","t80__se-on-me"],"track":80,"source":"extension","difficulty":3}],"blurb":"se plus me, te or le for things that happen on you","sectionIndex":9},{"id":"t81","label":"Track 81","tracks":[81],"rules":[{"id":"t81__past-mood-triggers","family":"past-mood-triggers","title":"Same triggers, one step back in time","explanation":"Nothing new about when to use it: everything that pulled the present mood tense out of you - quiero que, espero que, necesito que, para que - pulls the past one out when the first verb has moved into the past. quería que, esperaba que, necesitábamos que. And there is only one past mood tense, so you never have to choose between a line and a dot here.","examples":["quería que comieran con nosotros - I wanted them to eat with us","esperaba que me llamara - I was hoping he'd call me","volví a llamarte para que organizáramos - I called you again so we'd organize"],"track":81},{"id":"t81__volver-a-again","family":"volver-a-again","title":"volver a + the to-form, for doing it again","explanation":"volver is to return. Put a after it and then a verb in its to-form, and you have doing that thing again - literally returning to doing it. It sits alongside otra vez, and it's what you'll hear more.","examples":["vuelve a cerrarse - it closes again","volví a llamarte - I called you again","no quiero que vuelva a pasar - I don't want it to happen again"],"track":81},{"id":"t81__past-mood-formation","family":"past-mood-formation","title":"The past mood tense, straight off the they-form of the dot","explanation":"You already have the they-form of the dot in the past: hablaron, comieron. Change that final -on to -an and you have the past mood tense for they: hablaran, comieran. Everything else falls off it the way it always does - drop the n for I/he/she/you-formal (hablara), add an s for you-informal (hablaras), and -mos for we, with the accent sliding back a syllable (habláramos).","examples":["hablaron -> hablaran -> hablara, hablaras, habláramos","comieron -> comieran -> comiera, comieras, comiéramos","pudieron -> pudieran -> pudiera"],"track":81},{"id":"t81__subjunctive-trigger-verbs","family":"subjunctive-trigger-verbs","title":"Verbs that cast your subjectivity make the next verb switch","explanation":"Verbs that show what you want, need, prefer, hope, or like to happen (quiero, necesito, prefiero, espero, me gusta) are followed by que, and the verb after que goes into the mood tense. It's not just the structure - it's the feeling of pushing your will or hope onto the world.","examples":["necesito que lo prepare - I need you to prepare it","prefiero que se quede - I prefer that he stays","espero que cuentes conmigo - I hope you count on me","me gusta que la profesora visite - I like that the teacher visits"],"track":70},{"id":"t81__se-on-me","family":"se-on-me","title":"se + me/te/le: it happened on me","explanation":"You already have se for things that happen by themselves - la puerta se cierra, the door closes. Slot me, te, le, nos or les in after that se and the thing now happens on somebody: la puerta se me cierra, the door closes on me. It shrugs the blame off nicely, and Spanish uses it far more widely than English, which only manages it with a handful of verbs.","examples":["la puerta se cierra -> la puerta se me cierra - the door closes on me","la cena se me quema - the dinner is burning on me","la batería siempre se me acaba - my battery always runs out on me"],"track":80},{"id":"t81__dejar-leave","family":"dejar-leave","title":"dejar - to leave something behind","explanation":"dejar is to leave in the sense of leaving something behind - a message, a tip, a key. It is not the leave that means going out; that's salir. It behaves like any other regular -ar verb, in commands and in the mood tense alike.","examples":["déjeme un mensaje - leave me a message (formal)","quiero que me dejes un mensaje - I want you to leave me a message","ojalá deje un mensaje - hopefully she leaves a message"],"track":79}],"drills":[{"id":"t81-01","type":"sentence","prompt":"I don't want the door to close on me.","answer":"No quiero que la puerta se me cierre.","steps":["I don't want that: no quiero que, which pulls in the mood tense","the door: la puerta","closes on me, in the mood tense: se me cierre"],"rules":["t81__subjunctive-trigger-verbs","t81__se-on-me"],"track":81,"source":"track"},{"id":"t81-02","type":"sentence","prompt":"I don't want the door to close on me again.","answer":"No quiero que la puerta se me cierre otra vez.","steps":["I don't want the door to close on me: no quiero que la puerta se me cierre","again, another time: otra vez"],"rules":["t81__subjunctive-trigger-verbs","t81__se-on-me"],"track":81,"source":"track"},{"id":"t81-03","type":"word","prompt":"to return, to come back","answer":"Volver","steps":["the o splits to ue when it's stressed: vuelvo, vuelves","the to-form keeps the plain o: volver"],"rules":["t81__volver-a-again"],"track":81,"source":"track"},{"id":"t81-04","type":"sentence","prompt":"I don't want the door to close again.","answer":"No quiero que la puerta vuelva a cerrarse.","steps":["I don't want that: no quiero que","the door returns to, in the mood tense: la puerta vuelva a","closing itself: cerrarse"],"rules":["t81__subjunctive-trigger-verbs","t81__volver-a-again"],"track":81,"source":"track","note":"Otra vez works too - this is the other way of saying again."},{"id":"t81-05","type":"sentence","prompt":"I don't want it to happen again.","answer":"No quiero que vuelva a pasar.","steps":["I don't want that: no quiero que","it returns to, mood tense: vuelva a","happen: pasar"],"rules":["t81__subjunctive-trigger-verbs","t81__volver-a-again"],"track":81,"source":"track"},{"id":"t81-06","type":"word","prompt":"they spoke - now in the past mood tense","answer":"Hablaran","steps":["they spoke, the dot in the past: hablaron","change that final -on to -an: hablaran"],"rules":["t81__past-mood-formation"],"track":81,"source":"track"},{"id":"t81-07","type":"sentence","prompt":"I wanted them to eat with us.","answer":"Quería que comieran con nosotros.","steps":["I wanted, ongoing, so the line in the past: quería","that: que, and the past now pulls in the past mood tense","they ate: comieron -> comieran","with us: con nosotros"],"rules":["t81__past-mood-formation","t81__past-mood-triggers"],"track":81,"source":"track"},{"id":"t81-08","type":"sentence","prompt":"I was hoping that she would call me.","answer":"Esperaba que me llamara.","steps":["I was hoping: esperaba","that: que","she called: llamaron -> llamaran -> drop the n for she: llamara","me, in front: me llamara"],"rules":["t81__past-mood-formation","t81__past-mood-triggers"],"track":81,"source":"track"},{"id":"t81-09","type":"sentence","prompt":"We needed to speak with him.","answer":"Necesitábamos hablar con él.","steps":["we needed: necesitábamos","no que here - it runs straight into the plain to-form: hablar","with him: con él"],"rules":["t81__past-mood-triggers"],"track":81,"source":"track","note":"No que, no mood tense. The mood tense only turns up once a que does."},{"id":"t81-10","type":"sentence","prompt":"We needed him to speak with us.","answer":"Necesitábamos que hablara con nosotros.","steps":["we needed: necesitábamos","that: que - and now the mood tense has to come","he spoke: hablaron -> hablaran -> hablara","with us: con nosotros"],"rules":["t81__past-mood-formation","t81__past-mood-triggers"],"track":81,"source":"track"},{"id":"t81-11","type":"sentence","prompt":"I called you again in order to organize it. (informal)","answer":"Volví a llamarte para organizar.","steps":["I called again: volví a llamar","you, on the end: llamarte","in order to: para","organize: organizar - plain to-form, because there's no que"],"rules":["t81__volver-a-again"],"track":81,"source":"track"},{"id":"t81-12","type":"sentence","prompt":"I called you again so that we would organize it. (informal)","answer":"Volví a llamarte para que organizáramos.","steps":["I called you again: volví a llamarte","so that: para que - and que brings the mood tense","we organized: organizaron -> organizaran -> organizáramos"],"rules":["t81__volver-a-again","t81__past-mood-formation","t81__past-mood-triggers"],"track":81,"source":"track"},{"id":"t81-x01","type":"sentence","prompt":"I don't want it to close on me again.","answer":"No quiero que se me cierre otra vez.","steps":["I don't want that: no quiero que","it closes on me, mood tense: se me cierre","again: otra vez"],"rules":["t81__subjunctive-trigger-verbs","t81__se-on-me"],"track":81,"source":"extension","difficulty":1},{"id":"t81-x02","type":"sentence","prompt":"I called him again.","answer":"Volví a llamarlo.","steps":["I called again: volví a llamar","him, on the end: llamarlo"],"rules":["t81__volver-a-again"],"track":81,"source":"extension","difficulty":1},{"id":"t81-x03","type":"sentence","prompt":"I wanted him to call me again.","answer":"Quería que me llamara otra vez.","steps":["I wanted: quería","that he called me, past mood tense: que me llamara","again: otra vez"],"rules":["t81__past-mood-formation","t81__past-mood-triggers"],"track":81,"source":"extension","difficulty":2},{"id":"t81-x04","type":"sentence","prompt":"I was hoping he wouldn't leave a message.","answer":"Esperaba que no dejara un mensaje.","steps":["I was hoping: esperaba","that he didn't leave: que no dejara - dejaron, dejaran, dejara","a message: un mensaje"],"rules":["t81__dejar-leave","t81__past-mood-formation","t81__past-mood-triggers"],"track":81,"source":"extension","difficulty":3}],"blurb":"Building the past mood tense off the they-form of the dot, and volver a for again","sectionIndex":9},{"id":"t82","label":"Track 82","tracks":[82],"rules":[{"id":"t82__lo-adjective","family":"lo-adjective","title":"lo + adjective for \"the ___ thing\"","explanation":"Put lo in front of an adjective to mean \"the [adjective] thing\" without needing a separate word for thing. Lo interesante is the interesting thing, lo fácil is the easy thing, lo bueno is the good thing, lo malo is the bad thing. The rest of the sentence follows normally, often with es que to say what that thing is. It also gets you out of a hole: lo increíble es que vuelven is a plain statement of fact, so no mood tense is needed, where es increíble que vuelvan would demand one. When you can feel the mood tense coming and don't want to stop and build it, reach for lo + adjective.","examples":["lo interesante - the interesting thing","lo fácil es que vienen juntos - the easy thing is that they come together","lo bueno / lo malo - the good thing / the bad thing","lo increíble es que vuelven - no mood tense","es increíble que vuelvan - mood tense"],"track":57},{"id":"t82__es-adjective-que-mood","family":"es-adjective-que-mood","title":"es/está + adjective + que + mood tense","explanation":"It is + adjective + que is one of the biggest triggers for the mood tense: es terrible que, es posible que, es importante que, está bien que, no es necesario que. The que hands off into the mood tense on the next verb. Swap que for si (if) and you lose the mood tense - you're back to a plain fact. It works one step back too: era muy relevante que lo encontraran - the judgement moves into the past, and so does the mood tense after it.","examples":["Es terrible que comas esto. - It's terrible that you eat this.","Es posible que vayamos más tarde. - It's possible that we'll go later.","No es necesario que responda. - It isn't necessary for him to answer."],"track":77},{"id":"t82__volver-a-again","family":"volver-a-again","title":"volver a + the to-form, for doing it again","explanation":"volver is to return. Put a after it and then a verb in its to-form, and you have doing that thing again - literally returning to doing it. It sits alongside otra vez, and it's what you'll hear more.","examples":["vuelve a cerrarse - it closes again","volví a llamarte - I called you again","no quiero que vuelva a pasar - I don't want it to happen again"],"track":81}],"drills":[{"id":"t82-01","type":"sentence","prompt":"It's not very relevant.","answer":"No es muy relevante.","steps":["it is not: no es","very relevant: muy relevante"],"rules":["t82__es-adjective-que-mood"],"track":82,"source":"track"},{"id":"t82-02","type":"sentence","prompt":"It's not very relevant that they found it.","answer":"No es muy relevante que lo encontraran.","steps":["it's not very relevant: no es muy relevante","that: que - a judgement, so the mood tense follows","they found it, in the past, so the past mood tense: encontraron -> encontraran","it: lo, in front"],"rules":["t82__es-adjective-que-mood"],"track":82,"source":"track"},{"id":"t82-03","type":"sentence","prompt":"It's not very relevant that they find it.","answer":"No es muy relevante que lo encuentren.","steps":["it's not very relevant: no es muy relevante","that they find it - still ahead of them, so the present mood tense: que lo encuentren"],"rules":["t82__es-adjective-que-mood"],"track":82,"source":"track"},{"id":"t82-04","type":"sentence","prompt":"It was very relevant that they found it.","answer":"Era muy relevante que lo encontraran.","steps":["it was, ongoing: era","very relevant: muy relevante","that they found it, past mood tense: que lo encontraran"],"rules":["t82__es-adjective-que-mood"],"track":82,"source":"track"},{"id":"t82-05","type":"word","prompt":"the important thing","answer":"Lo importante","steps":["no need for a word for thing - lo in front of the adjective does it: lo importante"],"rules":["t82__lo-adjective"],"track":82,"source":"track"},{"id":"t82-06","type":"sentence","prompt":"It's incredible that they're coming back.","answer":"Es increíble que vuelvan.","steps":["it's incredible: es increíble","that, so the mood tense: que","they come back: vuelven -> vuelvan"],"rules":["t82__es-adjective-que-mood"],"track":82,"source":"track"},{"id":"t82-07","type":"sentence","prompt":"The incredible thing is that they're coming back.","answer":"Lo increíble es que vuelven.","steps":["the incredible thing: lo increíble","is that: es que - now you're just stating a fact","they come back: vuelven, plain present, no mood tense needed"],"rules":["t82__lo-adjective"],"track":82,"source":"track"},{"id":"t82-08","type":"sentence","prompt":"The incredible thing is that they're doing it again.","answer":"Lo increíble es que vuelven a hacerlo.","steps":["the incredible thing is that: lo increíble es que","they return to doing it: vuelven a hacerlo - a plain fact, no mood tense"],"rules":["t82__lo-adjective","t82__volver-a-again"],"track":82,"source":"track"},{"id":"t82-09","type":"sentence","prompt":"It's incredible that they're doing it again.","answer":"Es increíble que vuelvan a hacerlo.","steps":["it's incredible that: es increíble que - a judgement, so the mood tense","they return to doing it: vuelvan a hacerlo"],"rules":["t82__es-adjective-que-mood","t82__volver-a-again"],"track":82,"source":"track","note":"Same sentence as the one before, said as a judgement instead of a fact - and that alone decides the mood tense."},{"id":"t82-10","type":"sentence","prompt":"It's incredible that they did it again.","answer":"Es increíble que volvieran a hacerlo.","steps":["it's incredible that: es increíble que","they returned to doing it, already done, so the past mood tense: volvieron -> volvieran"],"rules":["t82__es-adjective-que-mood","t82__volver-a-again"],"track":82,"source":"track"},{"id":"t82-x01","type":"word","prompt":"the spectacular thing","answer":"Lo espectacular","steps":["lo in front of the adjective: lo espectacular"],"rules":["t82__lo-adjective"],"track":82,"source":"extension","difficulty":1},{"id":"t82-x02","type":"sentence","prompt":"It's incredible that they find it.","answer":"Es increíble que lo encuentren.","steps":["it's incredible that: es increíble que","they find it, present mood tense: lo encuentren"],"rules":["t82__es-adjective-que-mood"],"track":82,"source":"extension","difficulty":2},{"id":"t82-x03","type":"sentence","prompt":"It wasn't very relevant that they found it again.","answer":"No era muy relevante que volvieran a encontrarlo.","steps":["it wasn't very relevant: no era muy relevante","that: que","they returned to finding it, past mood tense: volvieran a encontrarlo"],"rules":["t82__es-adjective-que-mood","t82__volver-a-again"],"track":82,"source":"extension","difficulty":3}],"blurb":"lo plus an adjective, and how it lets you sidestep the mood tense","sectionIndex":9},{"id":"t83","label":"Track 83","tracks":[83],"rules":[{"id":"t83__past-mood-formation","family":"past-mood-formation","title":"The past mood tense, straight off the they-form of the dot","explanation":"You already have the they-form of the dot in the past: hablaron, comieron. Change that final -on to -an and you have the past mood tense for they: hablaran, comieran. Everything else falls off it the way it always does - drop the n for I/he/she/you-formal (hablara), add an s for you-informal (hablaras), and -mos for we, with the accent sliding back a syllable (habláramos).","examples":["hablaron -> hablaran -> hablara, hablaras, habláramos","comieron -> comieran -> comiera, comieras, comiéramos","pudieron -> pudieran -> pudiera"],"track":81},{"id":"t83__pud-hub-bases","family":"pud-hub-bases","title":"poder and haber change their base in the dot: pud-, hub-","explanation":"In the dot in the past, poder's pod- goes to pud- and haber's hab- goes to hub-: pudieron, hubieron. That matters far beyond the dot itself, because the past mood tense is built off the they-form of the dot - so pudieron gives you pudiera, and hubieron gives you hubiera, which is where every if-I-could and if-I-had sentence starts.","examples":["pudieron -> pudiera - if I could","hubieron -> hubieras - if you had","si me lo hubieras contado, habría ido - if you'd told me, I'd have gone"],"track":83},{"id":"t83__si-past-mood","family":"si-past-mood","title":"si + the past mood tense, for what isn't actually so","explanation":"English does this too, it just does it quietly: if I was becomes if I were the moment you're imagining rather than reporting. Spanish marks it properly - as soon as si introduces something unreal or imagined, the verb after it goes into the past mood tense. Then the other half of the sentence takes would: si pudiera cocinar, cocinaría.","examples":["si pudiera cocinar, cocinaría - if I could cook, I'd cook","si lo viera, lo entendería - if he saw it, he'd understand it","si me lo hubieras contado, habría ido - if you'd told me, I'd have gone"],"track":83},{"id":"t83__que-mood-the-fact-that","family":"que-mood-the-fact-that","title":"que + the mood tense on its own: the fact that...","explanation":"A sentence can open straight on que plus a mood-tense verb, with nothing in front of it, and it means the fact that: que lo compraras no es mi problema - that you bought it isn't my problem. No ser or estar needed; que on its own is enough to pull the mood tense out.","examples":["que lo compraras no es mi problema - that you bought it isn't my problem","que le contaras no es mi problema - that you told him isn't my problem"],"track":83},{"id":"t83__would-tense-ia","family":"would-tense-ia","title":"Would: add -ía onto the whole verb","explanation":"Would works the same way as will but with its own key sound: -ía, stressed, stuck onto the full to-form of the verb for every verb type. The plain -ía form covers I, he, she, it and you (formal) all together; the other endings (-íamos, -ían, -ías) work the same way as for will.","examples":["Bailaría. - I would dance.","Bailaríamos. - We would dance.","Comería. - I would eat."],"track":41},{"id":"t83__would-have-habria","family":"would-have-habria","title":"Would have: habría + the after-haber form","explanation":"Haber (to have) contracts before -ía the same way poder does: drop the last e and add -ía, giving habría, habrías, habríamos, habrían for would have. Follow it with the -ado/-ido form of the main verb (the same form you'd use after any version of haber, from an earlier track) to get I would have gone, we would have eaten, and so on.","examples":["haber -> habr- + ía -> habría","habría ido - I would have gone","habríamos podido ir - we would have been able to go","me habría gustado - I would have liked it, it would have pleased me"],"track":43}],"drills":[{"id":"t83-01","type":"sentence","prompt":"That you bought it isn't my problem. (informal)","answer":"Que lo compraras no es mi problema.","steps":["that: que on its own, and it pulls in the mood tense","you bought it: compraron -> compraran -> compraras, with lo in front","isn't my problem: no es mi problema"],"rules":["t83__que-mood-the-fact-that"],"track":83,"source":"track"},{"id":"t83-02","type":"sentence","prompt":"That you told him isn't my problem. (informal)","answer":"Que le contaras no es mi problema.","steps":["that: que, pulling in the mood tense","you told to him: le, then contaron -> contaran -> contaras","isn't my problem: no es mi problema"],"rules":["t83__que-mood-the-fact-that"],"track":83,"source":"track"},{"id":"t83-03","type":"word","prompt":"they could, they were able to","answer":"Pudieron","steps":["poder in the dot in the past doesn't keep pod-, it goes to pud-","they: pudieron"],"rules":["t83__pud-hub-bases"],"track":83,"source":"track","note":"This form is worth having for its own sake, but the reason it's here is the base: pud- is what the past mood tense is built on."},{"id":"t83-04","type":"sentence","prompt":"If I could cook, I would cook.","answer":"Si pudiera cocinar, cocinaría.","steps":["if - you're imagining, so the past mood tense: si","I could: pudieron -> pudieran -> pudiera","cook: cocinar","I would cook: -ía on the whole verb, cocinaría"],"rules":["t83__si-past-mood","t83__pud-hub-bases","t83__would-tense-ia","t83__past-mood-formation"],"track":83,"source":"track"},{"id":"t83-05","type":"sentence","prompt":"If I could cancel it, I would cancel it.","answer":"Si pudiera cancelarlo, lo cancelaría.","steps":["if I could: si pudiera","cancel it: cancelarlo","I would cancel it: lo cancelaría"],"rules":["t83__si-past-mood","t83__would-tense-ia"],"track":83,"source":"track"},{"id":"t83-06","type":"word","prompt":"they had - the they-form of haber in the dot","answer":"Hubieron","steps":["haber in the dot doesn't keep hab-, it goes to hub-","they: hubieron"],"rules":["t83__pud-hub-bases"],"track":83,"source":"track","note":"You won't say hubieron on its own much. It's here because it hands you hub-, and hub- gives you hubiera, hubieras, hubiéramos."},{"id":"t83-07","type":"sentence","prompt":"If you had told me, I would have gone. (informal)","answer":"Si me lo hubieras contado, habría ido.","steps":["if you had: si, then hubieron -> hubieran -> hubieras","told me it: me lo, out in front of hubieras","told: contado","I would have: habría","gone: ido"],"rules":["t83__si-past-mood","t83__pud-hub-bases","t83__would-have-habria"],"track":83,"source":"track"},{"id":"t83-08","type":"sentence","prompt":"If we had known, we would have gone.","answer":"Si hubiéramos sabido, habríamos ido.","steps":["if we had: si hubiéramos, with the accent sliding back","known: sabido","we would have gone: habríamos ido"],"rules":["t83__si-past-mood","t83__pud-hub-bases","t83__would-have-habria"],"track":83,"source":"track"},{"id":"t83-09","type":"sentence","prompt":"If you saw their house... (informal)","answer":"Si vieras su casa.","steps":["if - imagining, so the past mood tense: si","you saw: vieron -> vieran -> vieras","their house: su casa"],"rules":["t83__si-past-mood"],"track":83,"source":"track"},{"id":"t83-10","type":"sentence","prompt":"If you saw it, you would understand it. (formal)","answer":"Si lo viera, lo entendería.","steps":["if you saw it: si lo viera - vieron, vieran, viera for you-formal","you would understand it: lo entendería"],"rules":["t83__si-past-mood","t83__would-tense-ia"],"track":83,"source":"track"},{"id":"t83-x01","type":"sentence","prompt":"If I could buy it, I would buy it.","answer":"Si pudiera comprarlo, lo compraría.","steps":["if I could: si pudiera","buy it: comprarlo","I would buy it: lo compraría"],"rules":["t83__si-past-mood","t83__pud-hub-bases","t83__would-tense-ia"],"track":83,"source":"extension","difficulty":1},{"id":"t83-x02","type":"sentence","prompt":"If you had told me, I would understand it. (informal)","answer":"Si me lo hubieras contado, lo entendería.","steps":["if you had told me it: si me lo hubieras contado","I would understand it: lo entendería"],"rules":["t83__si-past-mood","t83__pud-hub-bases","t83__would-tense-ia"],"track":83,"source":"extension","difficulty":2},{"id":"t83-x03","type":"sentence","prompt":"If I could see it, I would understand it.","answer":"Si pudiera verlo, lo entendería.","steps":["if I could: si pudiera","see it: verlo","I would understand it: lo entendería"],"rules":["t83__si-past-mood","t83__pud-hub-bases","t83__would-tense-ia"],"track":83,"source":"extension","difficulty":3}],"blurb":"si plus the past mood tense: what you would do, and what you would have done","sectionIndex":9},{"id":"t84","label":"Track 84","tracks":[84],"rules":[{"id":"t84__go-verbs-yo","family":"go-verbs-yo","title":"The go-verbs: a g pops in, but only for I","explanation":"You met the first of these back at tengo and vengo. There's a whole family of them - tener, venir, salir, poner, decir, hacer, oír, traer - and they all do the same thing: the I-form takes -go instead of a plain -o. Everything else about them stays where you'd expect. traer and distraer squeeze an extra i in on the way: traigo, distraigo.","examples":["tengo, vengo, salgo, pongo, digo","traer -> traigo | distraer -> distraigo"],"track":84},{"id":"t84__go-verbs-mood-ga","family":"go-verbs-mood-ga","title":"In the mood tense the -go becomes -ga, for everybody","explanation":"Most verbs build the mood tense by borrowing the other group's endings. The go-verbs do something simpler: take the I-form, swap the -go for -ga, and that serves every person - tenga, tengas, tengamos, tengan. So the odd I-form you had to learn turns out to be the key to the whole mood tense of these verbs.","examples":["tengo -> tenga, tengas, tengan","quiero que vengas - I want you to come","no quiero que me distraigas - I don't want you distracting me"],"track":84},{"id":"t84__subjunctive-trigger-verbs","family":"subjunctive-trigger-verbs","title":"Verbs that cast your subjectivity make the next verb switch","explanation":"Verbs that show what you want, need, prefer, hope, or like to happen (quiero, necesito, prefiero, espero, me gusta) are followed by que, and the verb after que goes into the mood tense. It's not just the structure - it's the feeling of pushing your will or hope onto the world.","examples":["necesito que lo prepare - I need you to prepare it","prefiero que se quede - I prefer that he stays","espero que cuentes conmigo - I hope you count on me","me gusta que la profesora visite - I like that the teacher visits"],"track":70}],"drills":[{"id":"t84-01","type":"word","prompt":"I have","answer":"Tengo","steps":["tener - one of the go-verbs","the I-form takes -go: tengo"],"rules":["t84__go-verbs-yo"],"track":84,"source":"track"},{"id":"t84-02","type":"word","prompt":"I come","answer":"Vengo","steps":["venir - another go-verb","the I-form takes -go: vengo"],"rules":["t84__go-verbs-yo"],"track":84,"source":"track"},{"id":"t84-03","type":"word","prompt":"I go out, I leave","answer":"Salgo","steps":["salir, a go-verb","the I-form: salgo"],"rules":["t84__go-verbs-yo"],"track":84,"source":"track"},{"id":"t84-04","type":"word","prompt":"I put","answer":"Pongo","steps":["poner, a go-verb","the I-form: pongo"],"rules":["t84__go-verbs-yo"],"track":84,"source":"track"},{"id":"t84-05","type":"word","prompt":"I distract","answer":"Distraigo","steps":["distraer, a go-verb","it squeezes an extra i in first: distraigo"],"rules":["t84__go-verbs-yo"],"track":84,"source":"track"},{"id":"t84-06","type":"sentence","prompt":"I want you to come. (informal)","answer":"Quiero que vengas.","steps":["I want that: quiero que, which pulls in the mood tense","vengo, swap the -go for -ga: venga","you-informal: vengas"],"rules":["t84__go-verbs-mood-ga","t84__subjunctive-trigger-verbs"],"track":84,"source":"track"},{"id":"t84-07","type":"word","prompt":"I bring","answer":"Traigo","steps":["traer, a go-verb","with the extra i: traigo"],"rules":["t84__go-verbs-yo"],"track":84,"source":"track"},{"id":"t84-08","type":"sentence","prompt":"I want you to bring it. (informal)","answer":"Quiero que lo traigas.","steps":["I want that: quiero que","it: lo, in front","traigo, swap -go for -ga, you-informal: traigas"],"rules":["t84__go-verbs-mood-ga","t84__subjunctive-trigger-verbs"],"track":84,"source":"track"},{"id":"t84-09","type":"sentence","prompt":"I don't want you to distract me. (informal)","answer":"No quiero que me distraigas.","steps":["I don't want that: no quiero que","me, in front: me","distraigo -> distraiga -> distraigas"],"rules":["t84__go-verbs-mood-ga","t84__subjunctive-trigger-verbs"],"track":84,"source":"track"},{"id":"t84-x01","type":"word","prompt":"I say, I tell","answer":"Digo","steps":["decir, a go-verb","the I-form: digo"],"rules":["t84__go-verbs-yo"],"track":84,"source":"extension","difficulty":1},{"id":"t84-x02","type":"sentence","prompt":"I want you to put it. (informal)","answer":"Quiero que lo pongas.","steps":["I want that: quiero que","it: lo, in front","pongo -> ponga -> pongas"],"rules":["t84__go-verbs-mood-ga","t84__subjunctive-trigger-verbs"],"track":84,"source":"extension","difficulty":2},{"id":"t84-x03","type":"sentence","prompt":"I don't want you to bring it now. (informal)","answer":"No quiero que lo traigas ahora.","steps":["I don't want that: no quiero que","it: lo, in front","traigo -> traiga -> traigas","now: ahora"],"rules":["t84__go-verbs-mood-ga","t84__subjunctive-trigger-verbs"],"track":84,"source":"extension","difficulty":3}],"blurb":"The go-verbs turning -go into -ga right through the mood tense","sectionIndex":10},{"id":"t85","label":"Track 85","tracks":[85],"rules":[{"id":"t85__command-mood","family":"command-mood","title":"Orders are made with the mood tense","explanation":"To tell someone to do or not do something, you take the you-don't form of the verb and switch it into the mood tense - this works for informal negative, formal (positive and negative), and plural (positive and negative) orders. There's one exception: positive informal (tú) orders, which use a shortcut instead.","examples":["no hables - don't speak","no te quedes aquí - don't stay here","coman - eat! (plural)","no lo coma - don't eat it (formal)"],"track":72},{"id":"t85__command-word-order","family":"command-word-order","title":"Little words jump to the end, but only for positive orders","explanation":"Small words like me, lo, se normally come before the verb. With a positive command (telling someone TO do something), they break that rule and attach onto the end of the verb instead, written as one word. With a negative command (telling someone NOT to do something), they stay in their normal spot before the verb. This shift is one of the things that helps your ear catch that it's a command.","examples":["espérenme - wait for me (positive)","no los esperen - don't wait for them (negative, back in front)","cómalo - eat it (positive)","no lo coma - don't eat it (negative, back in front)"],"track":72},{"id":"t85__go-verbs-mood-ga","family":"go-verbs-mood-ga","title":"In the mood tense the -go becomes -ga, for everybody","explanation":"Most verbs build the mood tense by borrowing the other group's endings. The go-verbs do something simpler: take the I-form, swap the -go for -ga, and that serves every person - tenga, tengas, tengamos, tengan. So the odd I-form you had to learn turns out to be the key to the whole mood tense of these verbs.","examples":["tengo -> tenga, tengas, tengan","quiero que vengas - I want you to come","no quiero que me distraigas - I don't want you distracting me"],"track":84},{"id":"t85__go-verb-informal-command","family":"go-verb-informal-command","title":"Informal positive commands from the go-verbs: just drop the -go","explanation":"For an ordinary verb, the informal positive order is the you-form with the s knocked off: comes -> come. The go-verbs take a shorter road still - knock the whole -go off the I-form. tengo gives ten, vengo gives ven, salgo gives sal, pongo gives pon, digo gives di.","examples":["tengo -> ten | vengo -> ven | salgo -> sal","pongo -> pon -> ponlo","digo -> di -> dime"],"track":85},{"id":"t85__go-verb-formal-command","family":"go-verb-formal-command","title":"The go-verbs make formal commands with -ga","explanation":"Orders are built out of the mood tense, and for a go-verb the mood tense is the I-form with -go swapped for -ga. So salgo gives salga (and salgan for more than one), pongo gives ponga, digo gives diga - for positive and negative formal orders alike.","examples":["salir -> salga / salgan","poner -> ponga","tener -> tenga","venir -> venga","decir -> diga"],"track":85},{"id":"t85__cuando-future-mood","family":"cuando-future-mood","title":"cuando + mood tense for future events","explanation":"When cuando (when) points at something in the future that hasn't happened yet, put the following verb in the mood tense. When cuando refers to something general or habitual, use the ordinary present tense instead.","examples":["Cuando hablamos. (generally, when we speak)","Cuando hablemos. (when we speak, future)","Cuando vayamos. (when we go, future)"],"track":73}],"drills":[{"id":"t85-01","type":"word","prompt":"I go out, I leave","answer":"Salgo","steps":["salir, a go-verb: salgo"],"rules":["t85__go-verbs-mood-ga"],"track":85,"source":"track"},{"id":"t85-02","type":"word","prompt":"Go out. (formal order)","answer":"Salga","steps":["orders come from the mood tense","salgo, swap -go for -ga: salga"],"rules":["t85__go-verb-formal-command","t85__command-mood"],"track":85,"source":"track"},{"id":"t85-03","type":"word","prompt":"Don't go out. (formal, to more than one)","answer":"No salgan","steps":["salgo -> salga","more than one: salgan","no in front for the negative"],"rules":["t85__go-verb-formal-command","t85__command-mood"],"track":85,"source":"track"},{"id":"t85-04","type":"word","prompt":"I put","answer":"Pongo","steps":["poner, a go-verb: pongo"],"rules":["t85__go-verbs-mood-ga"],"track":85,"source":"track"},{"id":"t85-05","type":"sentence","prompt":"Put it here. (formal)","answer":"Póngalo aquí.","steps":["pongo -> ponga for the formal order","it's a positive order, so lo rides on the end: póngalo","here: aquí"],"rules":["t85__go-verb-formal-command","t85__command-word-order"],"track":85,"source":"track","note":"Lo ponga aquí is the natural first attempt and it's wrong - on a positive order the little word goes on the end."},{"id":"t85-06","type":"sentence","prompt":"Don't put it here. (formal)","answer":"No lo ponga aquí.","steps":["no in front, and a negative order puts lo back in front of the verb","ponga: the formal order","here: aquí"],"rules":["t85__go-verb-formal-command","t85__command-word-order"],"track":85,"source":"track"},{"id":"t85-07","type":"word","prompt":"I have","answer":"Tengo","steps":["tener, a go-verb: tengo"],"rules":["t85__go-verbs-mood-ga"],"track":85,"source":"track"},{"id":"t85-08","type":"word","prompt":"Have. (informal order)","answer":"Ten","steps":["for a go-verb the informal order knocks the whole -go off","tengo -> ten"],"rules":["t85__go-verb-informal-command"],"track":85,"source":"track"},{"id":"t85-09","type":"sentence","prompt":"Have it. (informal)","answer":"Tenlo.","steps":["tengo -> ten","positive order, so lo rides on the end: tenlo"],"rules":["t85__go-verb-informal-command","t85__command-word-order"],"track":85,"source":"track"},{"id":"t85-10","type":"word","prompt":"Come. (formal order)","answer":"Venga","steps":["vengo, swap -go for -ga: venga"],"rules":["t85__go-verb-formal-command"],"track":85,"source":"track"},{"id":"t85-11","type":"word","prompt":"Come. (informal order)","answer":"Ven","steps":["vengo, knock the -go off: ven"],"rules":["t85__go-verb-informal-command"],"track":85,"source":"track"},{"id":"t85-12","type":"word","prompt":"Tell me. (formal)","answer":"Dígame","steps":["digo -> diga for the formal order","positive, so me rides on the end, and the stress needs an accent: dígame"],"rules":["t85__go-verb-formal-command","t85__command-word-order"],"track":85,"source":"track"},{"id":"t85-13","type":"sentence","prompt":"Tell me. (informal)","answer":"Dime.","steps":["digo, knock the -go off: di","me on the end: dime"],"rules":["t85__go-verb-informal-command","t85__command-word-order"],"track":85,"source":"track"},{"id":"t85-14","type":"sentence","prompt":"Tell me when you come. (informal)","answer":"Dime cuando vengas.","steps":["tell me: dime","when - it hasn't happened yet, so the mood tense: cuando","you come: vengo -> venga -> vengas"],"rules":["t85__go-verb-informal-command","t85__cuando-future-mood"],"track":85,"source":"track"},{"id":"t85-15","type":"sentence","prompt":"Tell me when you do it. (formal)","answer":"Dígame cuando lo haga.","steps":["tell me, formal: dígame","when, still ahead, so the mood tense: cuando","you do it: hago -> haga, with lo in front"],"rules":["t85__go-verb-formal-command","t85__cuando-future-mood"],"track":85,"source":"track"},{"id":"t85-x01","type":"word","prompt":"Put it. (informal order)","answer":"Ponlo","steps":["pongo, knock the -go off: pon","lo on the end: ponlo"],"rules":["t85__go-verb-informal-command","t85__command-word-order"],"track":85,"source":"extension","difficulty":1},{"id":"t85-x02","type":"word","prompt":"Go out now. (formal)","answer":"Salga ahora","steps":["salgo -> salga","now: ahora"],"rules":["t85__go-verb-formal-command","t85__command-mood"],"track":85,"source":"extension","difficulty":1},{"id":"t85-x03","type":"sentence","prompt":"Put it here now, but don't go out. (formal)","answer":"Póngalo aquí ahora, pero no salga.","steps":["put it here, positive order: póngalo aquí","now: ahora","but: pero","don't go out, negative order: no salga"],"rules":["t85__go-verb-formal-command","t85__command-word-order"],"track":85,"source":"extension","difficulty":2},{"id":"t85-x04","type":"sentence","prompt":"Tell me something now. (informal)","answer":"Dime algo ahora.","steps":["tell me: dime","something: algo","now: ahora"],"rules":["t85__go-verb-informal-command"],"track":85,"source":"extension","difficulty":2},{"id":"t85-x05","type":"sentence","prompt":"Tell me something when you come, but I want it now. (informal)","answer":"Dime algo cuando vengas, pero lo quiero ahora.","steps":["tell me something: dime algo","when you come, still ahead, so the mood tense: cuando vengas","but I want it now: pero lo quiero ahora"],"rules":["t85__go-verb-informal-command","t85__cuando-future-mood"],"track":85,"source":"extension","difficulty":3}],"blurb":"Go-verb orders: -ga for formal, and just drop the -go for informal","sectionIndex":10},{"id":"t86","label":"Track 86","tracks":[86],"rules":[{"id":"t86__poder-contraction-podria","family":"poder-contraction-podria","title":"Could: podría, with the e dropped","explanation":"Could should be poder plus -ía, giving podería, but poder is used so often that the middle e wore away over time, leaving podría. Build the rest the normal would way from there: podríamos, podrían, podrías.","examples":["Podría. - I/he/she/it/you formal could.","Podríamos. - We could.","¿Podrías venir a mi casa? - Could you come to my house?"],"track":42},{"id":"t86__hacer-decir-har-dir","family":"hacer-decir-har-dir","title":"hacer and decir use har-/dir- for will and would","explanation":"hacer and decir don't contract in any predictable way - they just have their own stems for will and would: har- and dir-. haré, haría; diré, diría. Two verbs, two stems, and they cover both tenses.","examples":["hacer -> haré, haremos, harán | haría","decir -> diré | diría"],"track":86},{"id":"t86__future-tense-endings","family":"future-tense-endings","title":"The future: haber's endings stuck on the whole infinitive","explanation":"Take the verb in its whole 'to' form, -ar, -er or -ir, it doesn't matter, and stick an ending straight onto the end: é for I, ás for you (informal), á for he/she/you formal, emos for we, án for they/you guys. These are exactly the short forms of haber (he, has, ha, hemos, han), just without the h. The accent always lands on that added ending, so you don't have to think about stress separately.","examples":["comer -> comeré - I will eat","ir -> iré - I will go","encontrar -> encontrará - he will find"],"track":36},{"id":"t86__go-verb-dr-stem","family":"go-verb-dr-stem","title":"The go-verbs contract to a -dr- stem for will and would","explanation":"Will and would normally go straight onto the whole to-form. The go-verbs won't sit still for that: tener, poner, salir and venir lose the vowel before the r and grow a d in its place, giving tendr-, pondr-, saldr-, vendr-. One contracted stem covers both tenses - tendré and tendría come off the same base.","examples":["tener -> tendré / tendría","poner -> pondré / pondría","salir -> saldré / saldría","venir -> vendré / vendría"],"track":86},{"id":"t86__would-tense-ia","family":"would-tense-ia","title":"Would: add -ía onto the whole verb","explanation":"Would works the same way as will but with its own key sound: -ía, stressed, stuck onto the full to-form of the verb for every verb type. The plain -ía form covers I, he, she, it and you (formal) all together; the other endings (-íamos, -ían, -ías) work the same way as for will.","examples":["Bailaría. - I would dance.","Bailaríamos. - We would dance.","Comería. - I would eat."],"track":41}],"drills":[{"id":"t86-01","type":"word","prompt":"I will have","answer":"Tendré","steps":["tener contracts to tendr-","will, for I: -é"],"rules":["t86__go-verb-dr-stem","t86__future-tense-endings"],"track":86,"source":"track"},{"id":"t86-02","type":"word","prompt":"I will come","answer":"Vendré","steps":["venir contracts to vendr-","will, for I: -é"],"rules":["t86__go-verb-dr-stem","t86__future-tense-endings"],"track":86,"source":"track"},{"id":"t86-03","type":"word","prompt":"I would come","answer":"Vendría","steps":["the same contracted stem: vendr-","would: -ía"],"rules":["t86__go-verb-dr-stem","t86__would-tense-ia"],"track":86,"source":"track"},{"id":"t86-04","type":"sentence","prompt":"We would come later, but we don't have time.","answer":"Vendríamos más tarde, pero no tenemos tiempo.","steps":["we would come: vendr- plus the we-would ending, vendríamos","later: más tarde","but: pero","we don't have time: no tenemos tiempo"],"rules":["t86__go-verb-dr-stem","t86__would-tense-ia"],"track":86,"source":"track"},{"id":"t86-05","type":"sentence","prompt":"I will put it here.","answer":"Lo pondré aquí.","steps":["it: lo, out in front","poner contracts to
