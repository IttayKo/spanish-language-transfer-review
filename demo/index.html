pondr-","will, for I: pondré","here: aquí"],"rules":["t86__go-verb-dr-stem","t86__future-tense-endings"],"track":86,"source":"track"},{"id":"t86-06","type":"sentence","prompt":"I would put it here.","answer":"Lo pondría aquí.","steps":["it: lo, out in front","the same stem: pondr-","would: pondría","here: aquí"],"rules":["t86__go-verb-dr-stem","t86__would-tense-ia"],"track":86,"source":"track"},{"id":"t86-07","type":"sentence","prompt":"We will put it here.","answer":"Lo pondremos aquí.","steps":["it: lo, out in front","pondr- plus the we-will ending: pondremos","here: aquí"],"rules":["t86__go-verb-dr-stem","t86__future-tense-endings"],"track":86,"source":"track"},{"id":"t86-08","type":"word","prompt":"I would go out, I would leave","answer":"Saldría","steps":["salir contracts to saldr-","would: saldría"],"rules":["t86__go-verb-dr-stem","t86__would-tense-ia"],"track":86,"source":"track"},{"id":"t86-09","type":"sentence","prompt":"Will you go out tonight? (informal)","answer":"¿Saldrás esta noche?","steps":["saldr- plus the you-informal will ending: saldrás","tonight: esta noche"],"rules":["t86__go-verb-dr-stem","t86__future-tense-endings"],"track":86,"source":"track"},{"id":"t86-10","type":"word","prompt":"I will do, I will make","answer":"Haré","steps":["hacer doesn't contract, it just has its own stem: har-","will, for I: haré"],"rules":["t86__hacer-decir-har-dir","t86__future-tense-endings"],"track":86,"source":"track"},{"id":"t86-11","type":"sentence","prompt":"We would do it, but we're busy now.","answer":"Lo haríamos, pero estamos ocupados ahora.","steps":["it: lo, out in front","har- plus the we-would ending: haríamos","but: pero","we're busy, a state: estamos ocupados","now: ahora"],"rules":["t86__hacer-decir-har-dir","t86__would-tense-ia"],"track":86,"source":"track"},{"id":"t86-12","type":"sentence","prompt":"I will tell you later. (informal)","answer":"Te diré más tarde.","steps":["you: te, out in front","decir's own stem: dir-","will, for I: diré","later: más tarde"],"rules":["t86__hacer-decir-har-dir","t86__future-tense-endings"],"track":86,"source":"track"},{"id":"t86-13","type":"word","prompt":"I could, I would be able to","answer":"Podría","steps":["poder isn't a go-verb, so no d turns up","but the e still falls out of podería: podría"],"rules":["t86__poder-contraction-podria"],"track":86,"source":"track"},{"id":"t86-14","type":"word","prompt":"I would put","answer":"Pondría","steps":["poner is a go-verb, so it contracts to pondr-","would: pondría"],"rules":["t86__go-verb-dr-stem","t86__would-tense-ia"],"track":86,"source":"track","note":"pondría and podría are one letter apart and mean different things - put and be able."},{"id":"t86-15","type":"word","prompt":"We would be able to","answer":"Podríamos","steps":["poder loses its e: podr-","the we-would ending: podríamos"],"rules":["t86__poder-contraction-podria"],"track":86,"source":"track"},{"id":"t86-x01","type":"word","prompt":"I will put","answer":"Pondré","steps":["poner contracts to pondr-","will, for I: pondré"],"rules":["t86__go-verb-dr-stem","t86__future-tense-endings"],"track":86,"source":"extension","difficulty":1},{"id":"t86-x02","type":"word","prompt":"I would have (possess)","answer":"Tendría","steps":["tener contracts to tendr-","would: tendría"],"rules":["t86__go-verb-dr-stem","t86__would-tense-ia"],"track":86,"source":"extension","difficulty":1},{"id":"t86-x03","type":"sentence","prompt":"I will come, but I can't now.","answer":"Vendré, pero no puedo ahora.","steps":["I will come: vendré","but: pero","I can't: no puedo","now: ahora"],"rules":["t86__go-verb-dr-stem","t86__future-tense-endings"],"track":86,"source":"extension","difficulty":2},{"id":"t86-x04","type":"sentence","prompt":"We would say it, but we don't have time.","answer":"Lo diríamos, pero no tenemos tiempo.","steps":["it: lo, out in front","dir- plus the we-would ending: diríamos","but we don't have time: pero no tenemos tiempo"],"rules":["t86__hacer-decir-har-dir","t86__would-tense-ia"],"track":86,"source":"extension","difficulty":2},{"id":"t86-x05","type":"sentence","prompt":"I would put it here, but I will do it now.","answer":"Lo pondría aquí, pero lo haré ahora.","steps":["it: lo, out in front","I would put: pondría","here: aquí","but: pero","I will do it: lo haré","now: ahora"],"rules":["t86__go-verb-dr-stem","t86__hacer-decir-har-dir"],"track":86,"source":"extension","difficulty":3}],"blurb":"Go-verbs contracting to a -dr- stem for will and would, and har-/dir-","sectionIndex":10},{"id":"t87","label":"Track 87","tracks":[87],"rules":[{"id":"t87__preterite-ar","family":"preterite-ar","title":"The point in the past for -ar verbs","explanation":"Take the -ar off the verb and put é on for I, with the accent on that e, or ó on for he/she/it/you-formal, with the accent on that o. Hablar is the hook: hablé (I spoke), habló (he spoke) - check any -ar verb against it.","examples":["hablar -> hablé - I spoke","hablar -> habló - he spoke","comprar -> compré - I bought","enviar -> envié - I sent"],"track":58},{"id":"t87__preterite-er-ir","family":"preterite-er-ir","title":"The point in the past for -er/-ir verbs","explanation":"Take the -er or -ir off and put í on for I, with the accent on that i, or ió on for he/she/it/you-formal, with the accent on the o of ió. Comer is the hook - comí, comió - and the same endings work on -ir verbs like salir: salí, salió.","examples":["comer -> comí - I ate","comer -> comió - he ate","salir -> salió - she left","ver -> vi (I saw - one syllable, no accent needed)"],"track":59},{"id":"t87__preterite-tu","family":"preterite-tu","title":"You-informal in the point in the past: -aste, -iste","explanation":"For the point in the past (a completed action) with the informal you, -ar verbs take -aste and -er/-ir verbs take -iste. Drop the -ar/-er/-ir and add the ending: hablar -> hablaste, comer -> comiste, salir -> saliste.","examples":["Hablaste - you spoke","Comiste - you ate","¿Saliste anoche? - did you go out last night?"],"track":64},{"id":"t87__changed-base-dot","family":"changed-base-dot","title":"The verbs that change their base in the dot in the past","explanation":"A family of verbs - mostly the go-verbs - won't take the ordinary dot endings on their usual base. They change it first: poder to pud-, tener to tuv-, estar to estuv-, decir to dij-. Then they take a mixed set of endings, -e and -o for I and he/she (borrowed from the -ar verbs) and the -er/-ir endings for the rest - and, unusually, none of them carries a written accent. tuve, not tuvé.","examples":["tener -> tuve, tuvo, tuvimos, tuvieron","estar -> estuve, estuvo","decir -> dije, dijo, dijimos"],"track":87},{"id":"t87__line-past-irregulars","family":"line-past-irregulars","title":"The line-in-the-past irregulars: ser, ir, ver","explanation":"The line in the past is very regular except for three verbs: ser gives era/éramos/eran/eras, ir gives iba/íbamos/iban/ibas, and ver keeps the extra e from veo, giving veía/veíamos/veían/veías.","examples":["era, éramos, eran - ser: I/he was, we were, they were","iba, íbamos, iban - ir: I/he was going, we were going, they were going","veía, veíamos, veían - ver: I/he was seeing, we were seeing, they were seeing"],"track":87}],"drills":[{"id":"t87-01","type":"word","prompt":"I was (line in the past)","answer":"Era","steps":["ser is irregular in the line in the past"],"rules":["t87__line-past-irregulars"],"track":87,"source":"track"},{"id":"t87-02","type":"word","prompt":"We were (line in the past)","answer":"Éramos","steps":["era + mos, accent stays put"],"rules":["t87__line-past-irregulars"],"track":87,"source":"track"},{"id":"t87-03","type":"word","prompt":"I was going","answer":"Iba","steps":["ir is irregular in the line in the past"],"rules":["t87__line-past-irregulars"],"track":87,"source":"track"},{"id":"t87-04","type":"word","prompt":"I was seeing / I used to see","answer":"Veía","steps":["ver keeps the extra e from veo"],"rules":["t87__line-past-irregulars"],"track":87,"source":"track"},{"id":"t87-05","type":"word","prompt":"I spoke","answer":"Hablé","steps":["hablar, take off the -ar","the dot for I: -é, with the accent"],"rules":["t87__preterite-ar"],"track":87,"source":"track"},{"id":"t87-06","type":"word","prompt":"You spoke. (informal)","answer":"Hablaste","steps":["hablar, take off the -ar","you-informal in the dot: -aste"],"rules":["t87__preterite-tu"],"track":87,"source":"track"},{"id":"t87-07","type":"word","prompt":"You ate. (informal)","answer":"Comiste","steps":["comer, take off the -er","you-informal in the dot: -iste"],"rules":["t87__preterite-er-ir","t87__preterite-tu"],"track":87,"source":"track"},{"id":"t87-08","type":"word","prompt":"I had (point in the past)","answer":"Tuve","steps":["tener -> tuv-","-ar style ending, no accent"],"rules":["t87__changed-base-dot"],"track":87,"source":"track"},{"id":"t87-09","type":"word","prompt":"We had (point in the past)","answer":"Tuvimos","steps":["tuv- + -er/-ir style ending"],"rules":["t87__changed-base-dot"],"track":87,"source":"track"},{"id":"t87-10","type":"word","prompt":"I was (point in the past, estar)","answer":"Estuve","steps":["estar -> estuv-, same pattern as tuve"],"rules":["t87__changed-base-dot"],"track":87,"source":"track"},{"id":"t87-11","type":"word","prompt":"I wasn't there","answer":"No estuve","steps":["estar changes its base in the dot: estuv-","I: estuve","no in front"],"rules":["t87__changed-base-dot"],"track":87,"source":"track"},{"id":"t87-12","type":"sentence","prompt":"Where were you? (informal)","answer":"¿Dónde estuviste?","steps":["where: dónde","estar's changed base: estuv-","you-informal: estuviste"],"rules":["t87__changed-base-dot"],"track":87,"source":"track"},{"id":"t87-13","type":"sentence","prompt":"I had to go.","answer":"Tuve que ir.","steps":["tener's changed base: tuv-","I: tuve","add que for had to: tuve que","go: ir"],"rules":["t87__changed-base-dot"],"track":87,"source":"track"},{"id":"t87-14","type":"word","prompt":"I said (point in the past)","answer":"Dije","steps":["decir -> dij-, -ar style ending"],"rules":["t87__changed-base-dot"],"track":87,"source":"track"},{"id":"t87-15","type":"word","prompt":"We said (point in the past)","answer":"Dijimos","steps":["dij- + -er/-ir style ending"],"rules":["t87__changed-base-dot"],"track":87,"source":"track"},{"id":"t87-x01","type":"word","prompt":"You were (informal, line in the past)","answer":"Eras","steps":["era + s"],"rules":["t87__line-past-irregulars"],"track":87,"source":"extension","difficulty":1},{"id":"t87-x02","type":"word","prompt":"They had (point in the past)","answer":"Tuvieron","steps":["tuv- + -er/-ir style ending for they"],"rules":["t87__changed-base-dot"],"track":87,"source":"extension","difficulty":1},{"id":"t87-x03","type":"sentence","prompt":"I had to go, but I didn't want to.","answer":"Tuve que ir, pero no quería.","steps":["I had to go: tuve que ir","but: pero","I didn't want to, ongoing, so the line: no quería"],"rules":["t87__changed-base-dot"],"track":87,"source":"extension","difficulty":2},{"id":"t87-x04","type":"sentence","prompt":"We said it now.","answer":"Lo dijimos ahora.","steps":["it: lo, out in front","we said: dijimos","now: ahora"],"rules":["t87__changed-base-dot"],"track":87,"source":"extension","difficulty":2},{"id":"t87-x05","type":"sentence","prompt":"I was going to say something, but I had to go.","answer":"Iba a decir algo, pero tuve que ir.","steps":["I was going to say something, a line: iba a decir algo","but: pero","I had to go, a dot: tuve que ir"],"rules":["t87__line-past-irregulars","t87__changed-base-dot"],"track":87,"source":"extension","difficulty":3}],"blurb":"The dot-in-the-past verbs that change their base: tuve, estuve, dije","sectionIndex":10},{"id":"t88","label":"Track 88","tracks":[88],"rules":[{"id":"t88__changed-base-dot","family":"changed-base-dot","title":"The verbs that change their base in the dot in the past","explanation":"A family of verbs - mostly the go-verbs - won't take the ordinary dot endings on their usual base. They change it first: poder to pud-, tener to tuv-, estar to estuv-, decir to dij-. Then they take a mixed set of endings, -e and -o for I and he/she (borrowed from the -ar verbs) and the -er/-ir endings for the rest - and, unusually, none of them carries a written accent. tuve, not tuvé.","examples":["tener -> tuve, tuvo, tuvimos, tuvieron","estar -> estuve, estuvo","decir -> dije, dijo, dijimos"],"track":87},{"id":"t88__drop-i-after-j","family":"drop-i-after-j","title":"The they-form drops its i when the base won't take it","explanation":"The they-form of the dot normally ends -ieron. After a base ending in j - traj-, dij- - that i disappears, because trajieron and dijieron are awkward to say. The same happens to fu-: fueron, not fuieron. Nothing to learn here beyond letting your mouth do what it wants.","examples":["trajeron, not trajieron","dijeron, not dijieron","fueron, not fuieron"],"track":88},{"id":"t88__hacer-hic-hiz","family":"hacer-hic-hiz","title":"hacer in the point in the past: base becomes hic-/hiz-","explanation":"hacer's base in the dot is hic-. For he/she it would come out hico, which would be said wrong, so it's respelled hiz-: hizo. Same unaccented endings as the rest of the family.","examples":["hice - I did, I made","hizo - he did","hicieron - they did"],"track":88},{"id":"t88__poner-pus","family":"poner-pus","title":"poner in the point in the past: base becomes pus-","explanation":"poner joins the changed-base family in the dot: pon- goes to pus-, then the same unaccented mixed endings. puse, pusiste, puso, pusimos, pusieron.","examples":["puse - I put","pusiste - you put","¿dónde lo pusiste? - where did you put it?"],"track":88},{"id":"t88__venir-vin","family":"venir-vin","title":"venir in the point in the past: base becomes vin-","explanation":"venir's base in the dot is vin-, with the same unaccented endings. vine, viniste, vino - and yes, vino is also the word for wine.","examples":["vine - I came","vino - he came","vino con vino - he came with wine"],"track":88},{"id":"t88__traer-traj","family":"traer-traj","title":"traer in the point in the past: base becomes traj-","explanation":"traer's base in the dot is traj-. And traje, I brought, is also the word for a suit.","examples":["traje - I brought","trajo - he brought","traje un traje - I brought a suit"],"track":88},{"id":"t88__past-mood-formation","family":"past-mood-formation","title":"The past mood tense, straight off the they-form of the dot","explanation":"You already have the they-form of the dot in the past: hablaron, comieron. Change that final -on to -an and you have the past mood tense for they: hablaran, comieran. Everything else falls off it the way it always does - drop the n for I/he/she/you-formal (hablara), add an s for you-informal (hablaras), and -mos for we, with the accent sliding back a syllable (habláramos).","examples":["hablaron -> hablaran -> hablara, hablaras, habláramos","comieron -> comieran -> comiera, comieras, comiéramos","pudieron -> pudieran -> pudiera"],"track":81},{"id":"t88__fui-fue-shared","family":"fui-fue-shared","title":"fui and fue do double duty for ser and ir","explanation":"ser and ir share exactly the same forms in the dot in the past. fui is both I was and I went; fue is both he was and he went. Context does all the work, and it never causes trouble in practice.","examples":["fui - I was / I went","fue - he was / he went","fuimos, fuiste, fueron"],"track":88},{"id":"t88__si-past-mood","family":"si-past-mood","title":"si + the past mood tense, for what isn't actually so","explanation":"English does this too, it just does it quietly: if I was becomes if I were the moment you're imagining rather than reporting. Spanish marks it properly - as soon as si introduces something unreal or imagined, the verb after it goes into the past mood tense. Then the other half of the sentence takes would: si pudiera cocinar, cocinaría.","examples":["si pudiera cocinar, cocinaría - if I could cook, I'd cook","si lo viera, lo entendería - if he saw it, he'd understand it","si me lo hubieras contado, habría ido - if you'd told me, I'd have gone"],"track":83},{"id":"t88__would-tense-ia","family":"would-tense-ia","title":"Would: add -ía onto the whole verb","explanation":"Would works the same way as will but with its own key sound: -ía, stressed, stuck onto the full to-form of the verb for every verb type. The plain -ía form covers I, he, she, it and you (formal) all together; the other endings (-íamos, -ían, -ías) work the same way as for will.","examples":["Bailaría. - I would dance.","Bailaríamos. - We would dance.","Comería. - I would eat."],"track":41}],"drills":[{"id":"t88-01","type":"word","prompt":"I put (point in the past)","answer":"Puse","steps":["poner's base in the dot changes to pus-","I: puse, with no accent"],"rules":["t88__poner-pus","t88__changed-base-dot"],"track":88,"source":"track"},{"id":"t88-02","type":"sentence","prompt":"Where did you put it? (informal)","answer":"¿Dónde lo pusiste?","steps":["where: dónde","it: lo, out in front","pus- plus the you-informal ending: pusiste"],"rules":["t88__poner-pus","t88__changed-base-dot"],"track":88,"source":"track"},{"id":"t88-03","type":"word","prompt":"I made, I did","answer":"Hice","steps":["hacer's base in the dot: hic-","I: hice"],"rules":["t88__hacer-hic-hiz","t88__changed-base-dot"],"track":88,"source":"track"},{"id":"t88-04","type":"word","prompt":"He made, he did","answer":"Hizo","steps":["hic- plus the he/she ending would spell hico, which would be said wrong","respell it hiz-: hizo"],"rules":["t88__hacer-hic-hiz"],"track":88,"source":"track"},{"id":"t88-05","type":"word","prompt":"They made, they did","answer":"Hicieron","steps":["hic- plus the they ending: hicieron"],"rules":["t88__hacer-hic-hiz"],"track":88,"source":"track"},{"id":"t88-06","type":"word","prompt":"I came","answer":"Vine","steps":["venir's base in the dot: vin-","I: vine"],"rules":["t88__venir-vin","t88__changed-base-dot"],"track":88,"source":"track"},{"id":"t88-07","type":"sentence","prompt":"He came with wine.","answer":"Vino con vino.","steps":["he came: vin- plus the he ending, vino","with: con","wine: vino"],"rules":["t88__venir-vin"],"track":88,"source":"track","note":"The same four letters twice over, meaning two completely different things."},{"id":"t88-08","type":"word","prompt":"He brought","answer":"Trajo","steps":["traer's base in the dot: traj-","he: trajo"],"rules":["t88__traer-traj","t88__changed-base-dot"],"track":88,"source":"track"},{"id":"t88-09","type":"sentence","prompt":"I brought a suit.","answer":"Traje un traje.","steps":["I brought: traj- plus the I ending, traje","a suit: un traje"],"rules":["t88__traer-traj"],"track":88,"source":"track","note":"traje is both I brought and a suit."},{"id":"t88-10","type":"sentence","prompt":"She didn't go.","answer":"No fue.","steps":["ser and ir share their dot forms: fue is both he went and he was","no in front"],"rules":["t88__fui-fue-shared"],"track":88,"source":"track"},{"id":"t88-11","type":"word","prompt":"They went, they were","answer":"Fueron","steps":["the shared base: fu-","the they ending would give fuieron, so the i drops: fueron"],"rules":["t88__fui-fue-shared","t88__drop-i-after-j"],"track":88,"source":"track"},{"id":"t88-12","type":"sentence","prompt":"If I were you... (informal)","answer":"Si yo fuera tú.","steps":["if - you're imagining, so the past mood tense: si","take the they-form of the dot: fueron","drop the -on and add the I ending: fuera","you: tú"],"rules":["t88__past-mood-formation","t88__si-past-mood","t88__fui-fue-shared"],"track":88,"source":"track"},{"id":"t88-13","type":"sentence","prompt":"If I had it, I would tell you. (informal)","answer":"Si lo tuviera, te lo contaría.","steps":["if I had it: tuvieron -> tuvieran -> tuviera, with lo in front","I would tell: contar plus -ía, contaría","to you, then it: te lo contaría"],"rules":["t88__past-mood-formation","t88__si-past-mood","t88__would-tense-ia"],"track":88,"source":"track"},{"id":"t88-14","type":"sentence","prompt":"I wanted them to do it.","answer":"Quería que lo hicieran.","steps":["I wanted: quería","that: que, and the past pulls in the past mood tense","they did it: hicieron -> hicieran, with lo in front"],"rules":["t88__past-mood-formation"],"track":88,"source":"track"},{"id":"t88-x01","type":"sentence","prompt":"I put it.","answer":"Lo puse.","steps":["it: lo, out in front","I put: puse"],"rules":["t88__poner-pus"],"track":88,"source":"extension","difficulty":1},{"id":"t88-x02","type":"sentence","prompt":"I wanted to say it, but I didn't come.","answer":"Quería decirlo, pero no vine.","steps":["I wanted, ongoing: quería","to say it: decirlo","but: pero","I didn't come: no vine"],"rules":["t88__venir-vin"],"track":88,"source":"extension","difficulty":2},{"id":"t88-x03","type":"sentence","prompt":"If I had it, I would bring it now.","answer":"Si lo tuviera, lo traería ahora.","steps":["if I had it: si lo tuviera","I would bring it: traer is regular for would, lo traería","now: ahora"],"rules":["t88__past-mood-formation","t88__si-past-mood","t88__would-tense-ia"],"track":88,"source":"extension","difficulty":3}],"blurb":"More changed bases - puse, hice, vine, traje - and fui for both ser and ir","sectionIndex":10},{"id":"t89","label":"Track 89","tracks":[89],"rules":[{"id":"t89__make-your-own-rules","family":"make-your-own-rules","title":"Work out your own rules - that's what all of this was for","explanation":"The course hasn't shown you every corner of Spanish and was never going to. What it has done is take you through every area of the language analytically, so that when you meet something you don't understand you can work it out rather than wait to be told. The move is almost always the same: notice what kind of word you're looking at. Is it going with a noun or with an adjective? Is there a noun following it or not? That one question settles most of it. Getting on top of your technical problems this way is what lets you stop fighting the language and start living in it - and it comes from analyzing what's correct and finding the why, never from memorizing it.","examples":["demasiadas casas but demasiado agresiva - what changed? noun versus adjective","el agua but la alfombra - what changed? two syllables, starting and ending in a","uno but un hombre - what changed? a noun came after it"],"track":89},{"id":"t89__el-before-a-a-words","family":"el-before-a-a-words","title":"el in front of a few feminine words, to keep two a's apart","explanation":"el ala, el agua, el aula - all feminine, all taking el. But la alfombra and la almohada also start with a and keep their la, so starting with a isn't the whole story. What the first three share is that they're two syllables long and they begin and end in a. That's the rule, and you can prove they're still feminine underneath: el agua fría, not frío.","examples":["el ala, el agua, el aula","but la alfombra, la almohada","el agua fría - still feminine underneath"],"track":89},{"id":"t89__demasiado-agreement","family":"demasiado-agreement","title":"demasiado agrees with a noun, but not with an adjective","explanation":"demasiado is too, and you can pull it apart: de más, of more, plus -iado. (de más works on its own too - tengo cuatro de más, I have four too many.) Now work the rest out: demasiadas casas, demasiados coches, but demasiado agresivo, demasiado agresiva, demasiado agresivos. It changes in the first pair and not in the second. What's different? In the first it's going with a noun, so it agrees like any adjective would. In the second it's propping up an adjective, and there it just stays put.","examples":["demasiadas casas, demasiados coches - with nouns, it agrees","demasiado agresivo, demasiado agresiva, demasiado agresivos - with adjectives, it doesn't","tengo cuatro de más - I have four too many"],"track":89},{"id":"t89__uno-alguno-ninguno-drop-o","family":"uno-alguno-ninguno-drop-o","title":"uno, alguno and ninguno drop their -o in front of a masculine noun","explanation":"On their own they're whole: quiero uno, no quiero ninguno. Put a masculine noun straight after them and the final -o falls off: un hombre, algún hombre, ningún hombre. The feminines don't do it - una mujer, alguna mujer, ninguna mujer stay as they are. Again the question that settles it is just: is there a noun following?","examples":["uno -> un hombre | alguno -> algún hombre | ninguno -> ningún hombre","una mujer, alguna mujer, ninguna mujer - unchanged","no quiero ninguno - nothing following, so nothing drops"],"track":89}],"drills":[{"id":"t89-01","type":"word","prompt":"too, as in too many","answer":"Demasiado","steps":["break it up and it's easier: de más, of more","plus -iado: demasiado"],"rules":["t89__demasiado-agreement"],"track":89,"source":"track","note":"de más works on its own too: tengo cuatro de más, I have four too many."},{"id":"t89-02","type":"sentence","prompt":"Too many houses.","answer":"Demasiadas casas.","steps":["houses: casas, feminine plural","demasiado is going with a noun here, so it agrees: demasiadas"],"rules":["t89__demasiado-agreement","t89__make-your-own-rules"],"track":89,"source":"track"},{"id":"t89-03","type":"sentence","prompt":"Too many cars.","answer":"Demasiados coches.","steps":["cars: coches, masculine plural","going with a noun, so it agrees: demasiados"],"rules":["t89__demasiado-agreement"],"track":89,"source":"track"},{"id":"t89-04","type":"sentence","prompt":"Too aggressive. (a woman)","answer":"Demasiado agresiva.","steps":["aggressive, for a woman: agresiva","demasiado is propping up an adjective this time, so it doesn't move: demasiado"],"rules":["t89__demasiado-agreement","t89__make-your-own-rules"],"track":89,"source":"track","note":"One question settles it: is it sitting with a noun or with an adjective?"},{"id":"t89-05","type":"sentence","prompt":"The water.","answer":"El agua.","steps":["agua is feminine","but it's two syllables and starts and ends in a, so it takes el to keep the two a's apart"],"rules":["t89__el-before-a-a-words"],"track":89,"source":"track"},{"id":"t89-06","type":"sentence","prompt":"The cold water.","answer":"El agua fría.","steps":["the water: el agua","cold: fría, not frío - the adjective shows agua is feminine underneath"],"rules":["t89__el-before-a-a-words","t89__make-your-own-rules"],"track":89,"source":"track"},{"id":"t89-07","type":"sentence","prompt":"The carpet.","answer":"La alfombra.","steps":["alfombra also starts with a, but it's three syllables and doesn't end in a","so it keeps its la: la alfombra"],"rules":["t89__el-before-a-a-words"],"track":89,"source":"track","note":"Another Arabic word, like almohada, the pillow - and like azúcar and arroz."},{"id":"t89-08","type":"sentence","prompt":"One man.","answer":"Un hombre.","steps":["one: uno","a masculine noun follows, so the final -o drops: un hombre"],"rules":["t89__uno-alguno-ninguno-drop-o"],"track":89,"source":"track"},{"id":"t89-09","type":"sentence","prompt":"I don't want any car.","answer":"No quiero ningún coche.","steps":["I don't want: no quiero","none: ninguno","a masculine noun follows, so the -o drops: ningún coche"],"rules":["t89__uno-alguno-ninguno-drop-o"],"track":89,"source":"track"},{"id":"t89-10","type":"sentence","prompt":"I don't want any. (nothing named)","answer":"No quiero ninguno.","steps":["I don't want: no quiero","nothing following it, so nothing drops: ninguno"],"rules":["t89__uno-alguno-ninguno-drop-o","t89__make-your-own-rules"],"track":89,"source":"track"},{"id":"t89-11","type":"sentence","prompt":"Some woman.","answer":"Alguna mujer.","steps":["some: alguno","but mujer is feminine, and the feminines don't drop anything: alguna mujer"],"rules":["t89__uno-alguno-ninguno-drop-o"],"track":89,"source":"track"},{"id":"t89-x01","type":"sentence","prompt":"Too many nights.","answer":"Demasiadas noches.","steps":["nights: noches, feminine plural","with a noun, so it agrees: demasiadas"],"rules":["t89__demasiado-agreement"],"track":89,"source":"extension","difficulty":1},{"id":"t89-x02","type":"sentence","prompt":"I want some car, but I don't want that one.","answer":"Quiero algún coche, pero no quiero ese.","steps":["I want: quiero","some, with a masculine noun after it: algún coche","but: pero","I don't want that one: no quiero ese"],"rules":["t89__uno-alguno-ninguno-drop-o"],"track":89,"source":"extension","difficulty":2},{"id":"t89-x03","type":"sentence","prompt":"The water is too cold and there's no glass.","answer":"El agua está demasiado fría y no hay ningún vaso.","steps":["the water: el agua, taking el but still feminine","is too cold, a state: está demasiado fría - demasiado props up an adjective, so it doesn't move","and: y","there isn't: no hay","any glass, with a masculine noun after it: ningún vaso"],"rules":["t89__el-before-a-a-words","t89__demasiado-agreement","t89__uno-alguno-ninguno-drop-o","t89__make-your-own-rules"],"track":89,"source":"extension","difficulty":3,"note":"Three rules you worked out yourself, in one sentence."}],"blurb":"Working out your own rules, which is what the whole course has been for","sectionIndex":10},{"id":"t90","label":"Track 90","tracks":[90],"rules":[{"id":"t90__leismo-le-for-people","family":"leismo-le-for-people","title":"In most of Spain, le/les replace lo/la/los/las for people","explanation":"In most of Spain, people use le (and les for plural) instead of lo/la/los/las whenever they mean a person - him, her, you (formal), you all, or them. lo/la still work everywhere, including in Spain, when you mean a thing - the shift only touches people.","examples":["lo veo -> le veo, if him is a person (Spain)","la veo -> le veo, if her is a person (Spain)","los veo -> les veo, if them are people (Spain)"],"track":90},{"id":"t90__vos-conjugation","family":"vos-conjugation","title":"vos: another word for tú, with its own ending stressed at the end","explanation":"In the Río de la Plata region (Argentina, Uruguay) and parts of Central America, vos replaces tú. Its present-tense ending is stressed right at the end, so verbs that normally split a vowel for tú - puedes, quieres - don't split for vos.","examples":["puedes -> podés (vos), no split, stress at the end","quieres -> querés (vos), no split, stress at the end"],"track":90},{"id":"t90__vosotros-spain-plural","family":"vosotros-spain-plural","title":"vosotros: Spain's informal you-plural, with its own endings","explanation":"In most of Spain (never in Latin America), vosotros is a separate informal you-plural with its own set of verb endings the course hasn't covered - it's worth recognizing if you hear it, but ustedes, which this course has used throughout, covers every you-plural meaning everywhere else, and formally in Spain too.","examples":["you guys (informal, Spain only): vosotros - everywhere else, and formally in Spain: ustedes"],"track":90},{"id":"t90__aspirated-s","family":"aspirated-s","title":"Some accents aspirate the s","explanation":"In many dialects the s softens or drops before a consonant, so está can sound like /ehtá/, cómo está like /cómo ehtá/, and espero like /ehpero/. This is a pronunciation feature, not a spelling change - nothing about how you build a sentence changes, only what you'll hear.","examples":["está -> /ehtá/","espero -> /ehpero/"],"track":90}],"drills":[{"id":"t90-x01","type":"sentence","prompt":"I see him. (as most people in Spain would say it)","answer":"Le veo.","steps":["I see: veo","in most of Spain, a person as him/her takes le instead of lo/la","put it together: le veo"],"rules":["t90__leismo-le-for-people"],"track":90,"source":"extension","difficulty":1},{"id":"t90-x02","type":"sentence","prompt":"I see her. (a person, as most of Spain would say it)","answer":"Le veo.","steps":["the same le covers both him and her once it's a person","put it together: le veo"],"rules":["t90__leismo-le-for-people"],"track":90,"source":"extension","difficulty":1},{"id":"t90-x03","type":"sentence","prompt":"I see them. (people, as most of Spain would say it)","answer":"Les veo.","steps":["les is the plural of le","put it together: les veo"],"rules":["t90__leismo-le-for-people"],"track":90,"source":"extension","difficulty":1},{"id":"t90-x04","type":"sentence","prompt":"I see it. (a thing, not a person)","answer":"Lo veo.","steps":["the Spain shift only touches people","a thing keeps lo exactly as you learned it","put it together: lo veo"],"rules":["t90__leismo-le-for-people"],"track":90,"source":"extension","difficulty":1,"note":"The contrast that matters: le only replaces lo/la for a person, never for a thing."},{"id":"t90-x05","type":"word","prompt":"you can (informal, Argentina/Uruguay using vos)","answer":"Podés","steps":["vos gets its own ending, stressed at the end","no vowel split: podés, not puedes"],"rules":["t90__vos-conjugation"],"track":90,"source":"extension","difficulty":1},{"id":"t90-x06","type":"word","prompt":"you want (informal, Argentina/Uruguay using vos)","answer":"Querés","steps":["same vos pattern: stress at the end, no split","querés, not quieres"],"rules":["t90__vos-conjugation"],"track":90,"source":"extension","difficulty":1}],"blurb":"Dialect variation you'll hear across the Spanish-speaking world - leísmo, vos, vosotros, the aspirated s - and the course's closing advice on turning practice into fluency.","sectionIndex":11},{"id":"t1","label":"Track 1","tracks":[1],"rules":[{"id":"t1__build-it-yourself-first","family":"build-it-yourself-first","title":"Build the answer yourself before you look","explanation":"Think slowly, and build each sentence yourself before you see it confirmed - there's no hand shooting up with a memorized answer here. When a prompt appears, work out your Spanish at your own pace first: reveal a scaffolding piece only if you're stuck, and the answer only once you've committed to your own attempt. Answering fast or peeking early means you finish knowing about Spanish, not speaking it.","examples":["tap \"Give me a piece\" for one hint at a time, not the whole answer at once","tap \"Show the answer\" only once you've built your own version out loud"],"track":1},{"id":"t1__understand-dont-memorize","family":"understand-dont-memorize","title":"Understand the mechanism, don't memorize the sentence","explanation":"This isn't a phrasebook. The course teaches a small number of mechanisms for converting and combining words, so that once you have them you can build sentences you've never heard, not just recite ones you have. Care about why a sentence is built the way it is, not about locking its exact wording into memory.","examples":[],"track":1},{"id":"t1__expect-to-forget","family":"expect-to-forget","title":"Expect to forget - that's part of the design","explanation":"Don't write anything down; carry the language in your head, not a notebook. You will forget things, and that's fine - the course brings every mechanism back later on purpose, so forgetting now isn't falling behind.","examples":[],"track":1},{"id":"t1__little-and-often","family":"little-and-often","title":"Little and often, well-rested, beats a lot at once","explanation":"Around 20 minutes a day, when you can actually concentrate, teaches you more than an occasional long session. A tired mind makes careless mistakes and rushes to guess instead of thinking it through - if you're fading, stop and come back later.","examples":[],"track":1},{"id":"t1__finding-your-way-around","family":"finding-your-way-around","title":"Finding your way around this app","explanation":"Tracks are listed in course order on the home screen, each with a one-line description of what it teaches. The Continue card always points you to the next track you haven't marked done; search jumps straight to a track by number or to whichever grammar point you're trying to recall. All rules, at the top of the track list, is every rule the course teaches in one searchable place, filed under the track that first taught it - open one to read it and to practice it against the drills of any track it turns up in.","examples":["the Continue card: the next track you haven't marked done","search: a track number, or a grammar point you half-remember","All rules: the whole course's grammar, without opening a track first"],"track":1},{"id":"t1__recap-practice","family":"recap-practice","title":"Recap practice: checking what actually stuck","explanation":"Once you've made progress on a few tracks, a Recap practice card appears on the home screen. It mixes drills you've already answered from across every track you've covered, weighted toward the ones you got stuck on - a fast, on-demand way to check what's sticking without redoing a whole track, and this app's version of the course's own habit of revisiting things.","examples":[],"track":1}],"drills":[],"blurb":"How the Thinking Method works, and how to use this app to practice it - read this before Track 2.","sectionIndex":0}],"sections":[{"title":"Before you start","focus":"Track 1 is the teacher's own introduction to the Thinking Method - no Spanish yet, just how the course works and how to get the most out of practicing it.","start":1,"end":1},{"title":"Convertible words and the first verbs","focus":"Turning English words you already know into Spanish with reliable endings, and getting es, quiero, voy and saber into use from the first minute.","start":2,"end":9},{"title":"Building the present tense","focus":"Chopping -ar/-er/-ir off and adding an ending for every person, the I-forms that pop a g, the vowels that split under stress, and the we-form.","start":10,"end":20},{"title":"The have-done past, and the little words","focus":"Talking about what has happened with haber plus -ado/-ido, and sorting out where lo, la, me, te and nos sit around the verb.","start":21,"end":26},{"title":"Ser, estar, and describing things","focus":"Adjectives agreeing with what they describe, then the split between what something is and what state it is in, and estar plus -ando for right now.","start":27,"end":35},{"title":"Will, would, and gustar","focus":"Adding endings onto the whole infinitive for will and would, and the backwards logic of gustar - it is not I like it, it is it pleases me.","start":36,"end":45},{"title":"The line in the past, and por vs para","focus":"The ongoing past with -aba and -ia, stacking habia for what had happened, and choosing between por and para.","start":46,"end":57},{"title":"The dot in the past: finished events","focus":"The endings for something done and finished, held against the line in the past, plus possessives, accents and where Spanish puts its stress.","start":58,"end":68},{"title":"Entering the mood tense (the subjunctive)","focus":"Building the mood tense by swapping ending groups, and the things that pull it out of you: wanting, ordering, cuando, para que, es posible que.","start":69,"end":79},{"title":"The past mood tense and hypotheticals","focus":"Building the past mood tense off the they-form of the dot, and using it with si to say what you would do, and what you would have done.","start":80,"end":83},{"title":"Irregular families, and making your own rules","focus":"The go-verbs and the changed bases of the dot in the past turned into predictable families - and then working rules out for yourself, which is what the whole course was for.","start":84,"end":89},{"title":"Dialect variation, and where to go from here","focus":"The differences you'll meet in the wild - leísmo in Spain, vos in the Río de la Plata, vosotros, the aspirated s - and the course's own closing advice on turning practice into fluency.","start":90,"end":90}]}</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('pack-data').textContent);
// Stamped by build_app.py: false for index.html, true for demo/index.html.
var DEMO = true;
var SPK_ICON = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="vertical-align:-2px">' +
  '<path d="M8.5 2.2 4.8 5.2H2.2v5.6h2.6l3.7 3V2.2Z" fill="currentColor"/>' +
  '<path d="M11.2 5.4a3.6 3.6 0 0 1 0 5.2M13.2 3.4a6.4 6.4 0 0 1 0 9.2" ' +
  'stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';

var pack = null, view = "home", queue = [], idx = 0, revealedSteps = 0, answerShown = false,
    grades = {}, usedHint = false, highlightRule = null, focusRuleId = null,
    homeFilter = "", homeJustEntered = false, lastRenderedView = null,
    ruleFilterId = null, ruleFilterLabel = null, lastPushedView = null, suppressPush = false,
    glossaryFilter = "", openFamily = null,
    backupMode = "merge", backupConfirmReplace = false, backupMsg = null, backupMsgKind = null;

function prefersReducedMotion(){
  try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; }
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

// Scaffolding steps are written "reasoning: spanish result" (1,384 of them).
// Honour that structure instead of flattening it: the reasoning renders in
// grey, the result in ink and lang="es". A step with no colon (or where the
// split would be meaningless) degrades safely and renders whole, in grey.
function splitStep(s){
  var i = s.lastIndexOf(': ');
  if(i === -1) return [s, null];
  return [s.slice(0, i), s.slice(i + 2)];
}
function stepHtml(s){
  var parts = splitStep(s), why = parts[0], es = parts[1];
  // "step-why", not "why" - the unscoped ".why" is a different block
  // entirely (the rule-links group after the answer) and reusing its name
  // here let that block's own border/margin bleed into every hint through
  // the cascade: an orphan hairline sitting inside the first hint's text.
  return '<li><span class="step-why">'+esc(why)+'</span>' +
    (es ? '<span class="sep">: </span><span class="es" lang="es">'+esc(es)+'</span>' : '') +
    '</li>';
}
// Examples are either a bare Spanish phrase or "spanish - english"; when a
// translation is present it's set in grey behind an em dash, the Spanish
// stays lang="es" and ink either way.
function exampleHtml(x){
  var i = x.indexOf(' - ');
  if(i === -1) return '<li><span class="es" lang="es">'+esc(x)+'</span></li>';
  return '<li><span class="es" lang="es">'+esc(x.slice(0,i))+'</span> &mdash; '+esc(x.slice(i+3))+'</li>';
}

// The demo build (demo/index.html, same code, DEMO true) is the live app
// pointed at a second, parallel pair of storage keys. Same origin, so it
// shares localStorage with the real app - which is exactly why it must not
// share the keys: a demo link that seeded progress into "lt-review:*" would
// overwrite the saved work of anyone who already uses the app and happens
// to open it. Nothing below ever writes a real key from the demo build, and
// npm test asserts that.
var KEY_PREFIX = DEMO ? "lt-review-demo:" : "lt-review:";
var KEY_DONE   = DEMO ? "lt-review-demo-done" : "lt-review-done";

function storeKey(){ return KEY_PREFIX + (pack ? pack.id : ""); }
function persist(){ try{ localStorage.setItem(storeKey(), JSON.stringify(grades)); }catch(e){} }
function restore(){ try{ var raw = localStorage.getItem(storeKey()); grades = raw ? JSON.parse(raw) : {}; }catch(e){ grades = {}; } }

function ruleById(id){
  for(var i=0;i<DATA.packs.length;i++){
    var rules = DATA.packs[i].rules;
    for(var j=0;j<rules.length;j++){ if(rules[j].id===id) return rules[j]; }
  }
  return null;
}

function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'es-ES'; u.rate = 0.85;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function on(id, fn, type){ var el = document.getElementById(id); if(el) el.addEventListener(type||'click', fn); }
function onAll(sel, fn, type){ var els = document.querySelectorAll(sel); for(var i=0;i<els.length;i++){ (function(el){ el.addEventListener(type||'click', function(ev){ fn(ev, el); }); })(els[i]); } }

/* ---------- pack progress (for home list) ---------- */
// Bug fix: this used to return null (= "no progress at all") unless at
// least one drill was graded "got" - so a track the learner had only ever
// answered "Not yet" on looked exactly like an untouched one, both for the
// home-row badge and for recap eligibility (see recapCandidatePacks below).
// That's backwards: any grade at all, "got" or "stuck", is progress: the
// gate is now "has anything been graded", while the badge itself keeps
// showing correct-count/total (success stays unmarked by design).
function packProgress(p){
  var raw; try{ raw = localStorage.getItem(KEY_PREFIX + p.id); }catch(e){ raw = null; }
  if(!raw) return null;
  var g; try{ g = JSON.parse(raw); }catch(e){ return null; }
  var got = 0, graded = 0, total = p.drills.length;
  for(var i=0;i<p.drills.length;i++){
    var st = g[p.drills[i].id];
    if(st === "got"){ got++; graded++; }
    else if(st === "stuck"){ graded++; }
  }
  if(graded===0) return null;
  return {done:got, total:total};
}

// "Full" for auto-finish purposes: every drill in the pack carries a grade,
// "got" or "stuck" alike - it's about having been through all of it, not
// about having gotten it all right, so this can't reuse packProgress's
// `done` (that counts only "got"). Reads the stored grades directly rather
// than `queue`, because a rule-filtered session's queue is only a slice of
// the pack (see startSession) and finishing the slice doesn't mean the
// track is full. A pack with no drills of its own (track 1) is deliberately
// never "full": `every` over an empty array is vacuously true, and a
// rules-only track was never "worked through" in the sense this is asking
// about, so it must never auto-mark itself done just by being opened.
function packFullyGraded(p){
  if(!p.drills.length) return false;
  var raw; try{ raw = localStorage.getItem(KEY_PREFIX + p.id); }catch(e){ raw = null; }
  if(!raw) return false;
  var g; try{ g = JSON.parse(raw); }catch(e){ return false; }
  for(var i=0;i<p.drills.length;i++){
    if(g[p.drills[i].id] === undefined) return false;
  }
  return true;
}

/* ---------- "mark as done" tracking (separate from per-drill grades) ---------- */
function getDoneMap(){ try{ return JSON.parse(localStorage.getItem(KEY_DONE) || "{}"); }catch(e){ return {}; } }
function setDoneMap(m){ try{ localStorage.setItem(KEY_DONE, JSON.stringify(m)); }catch(e){} }
function isDone(pid){ return !!getDoneMap()[pid]; }
function setDone(pid, val){ var m = getDoneMap(); if(val){ m[pid] = true; } else { delete m[pid]; } setDoneMap(m); }

// Auto-mark a track done the moment it's left with its progress full. Hooked
// into enterHome(), the one funnel every exit runs through (the header's
// "Tracks" arrow, the "All tracks"/"Finish" buttons, and browser back via
// goBack()) - plus "Continue to Track N+1" on the summary bar, which is the
// one exit that skips enterHome() entirely (see its handler in wire()).
// Never fires for a recap: startRecap() builds a synthetic pack with no
// track of its own to mark, and its grades live under the "recap" storage
// key, not any real track's (see startRecap()'s comment). Only ever turns
// the tick on, and does nothing if it's already on - so it can't clobber a
// done-mark someone set by hand before every drill was graded. It also can't
// tell "still working through it" apart from "already finished, taking
// another look": un-ticking a finished track by hand and then re-entering
// and leaving it again will re-tick it. That's accepted as the simplest
// correct-enough behaviour rather than adding session bookkeeping to spot
// the difference.
function maybeAutoFinish(p){
  if(!p || p.recap) return;
  if(isDone(p.id)) return;
  if(packFullyGraded(p)) setDone(p.id, true);
}

function orderedPacks(){ return DATA.packs.slice().sort(function(a,b){ return a.tracks[0]-b.tracks[0]; }); }

/* ---------- demo progress ----------
   The demo exists so a first-time visitor lands on a worked-in app rather
   than an empty one: an empty track list says nothing about what the thing
   does. The shape below is a plausible learner about a quarter of the way
   in - tracks 1-24 finished and ticked off, 25 half-done, 26 barely
   started, and a scatter of "not yet" grades behind them so the recap has
   real material to draw on. It is written once, to the demo's own keys,
   and only when they are empty, so anything the visitor then does survives
   a reload the way it would in the real app. */
var DEMO_DONE_THROUGH = 24, DEMO_SEEDED_KEY = "lt-review-demo-seeded";

function demoProgressExists(){
  try{ return localStorage.getItem(DEMO_SEEDED_KEY) !== null; }catch(e){ return true; }
}

function seedDemoProgress(){
  var doneMap = {};
  orderedPacks().forEach(function(p, i){
    var t = p.tracks[0];
    if(t > DEMO_DONE_THROUGH + 2) return;
    var drills = p.drills || [];
    var share = t <= DEMO_DONE_THROUGH ? 1 : (t === DEMO_DONE_THROUGH + 1 ? 0.55 : 0.2);
    var n = Math.round(drills.length * share);
    var g = {};
    for(var k=0; k<n; k++){
      // One "not yet" every few tracks, always on a drill that was
      // actually reached - enough to weight the recap without painting the
      // list red.
      g[drills[k].id] = (k === i % 5 && n > 2) ? "stuck" : "got";
    }
    if(n){ try{ localStorage.setItem(KEY_PREFIX + p.id, JSON.stringify(g)); }catch(e){} }
    if(t <= DEMO_DONE_THROUGH) doneMap[p.id] = true;
  });
  try{
    localStorage.setItem(KEY_DONE, JSON.stringify(doneMap));
    localStorage.setItem(DEMO_SEEDED_KEY, "1");
  }catch(e){}
}

function resetDemoProgress(){
  try{
    DATA.packs.forEach(function(p){ localStorage.removeItem(KEY_PREFIX + p.id); });
    localStorage.removeItem(KEY_DONE);
    localStorage.removeItem(DEMO_SEEDED_KEY);
  }catch(e){}
  seedDemoProgress();
}

/* ---------- backup: export / import progress ----------
   The whole storage contract this round-trips is exactly two localStorage
   shapes (see storeKey()/persist()/restore() above and getDoneMap()/setDoneMap()):
     lt-review:<packId>  -> { "<drillId>": "got" | "stuck" }
     lt-review-done       -> { "<packId>": true }
   Everything here reads/writes only through those, never a parallel format. */

var BACKUP_SCHEMA = "lt-review-backup";
var BACKUP_VERSION = 1;
var KNOWN_PACK_IDS = null;
function knownPackIds(){
  if(!KNOWN_PACK_IDS){
    KNOWN_PACK_IDS = {};
    DATA.packs.forEach(function(p){ KNOWN_PACK_IDS[p.id] = true; });
  }
  return KNOWN_PACK_IDS;
}

function collectBackupPayload(){
  var progress = {};
  DATA.packs.forEach(function(p){
    var raw; try{ raw = localStorage.getItem(KEY_PREFIX + p.id); }catch(e){ raw = null; }
    if(!raw) return;
    var g; try{ g = JSON.parse(raw); }catch(e){ g = null; }
    if(g && typeof g === "object" && Object.keys(g).length){ progress[p.id] = g; }
  });
  return {
    app: BACKUP_SCHEMA,
    version: BACKUP_VERSION,
    exportedAt: new Date().toISOString(),
    progress: progress,
    done: getDoneMap()
  };
}

function doExport(){
  try{
    var payload = collectBackupPayload();
    var blob = new Blob([JSON.stringify(payload, null, 2)], {type: "application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "complete-spanish-review-backup-" + payload.exportedAt.slice(0,10) + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ try{ URL.revokeObjectURL(url); }catch(e){} }, 1000);
    backupMsg = "Backup downloaded."; backupMsgKind = "ok";
  }catch(e){
    backupMsg = "Couldn't create the backup file."; backupMsgKind = "err";
  }
  render();
}

// Validates the raw parsed JSON of a backup file and returns a fully-cleaned
// {progress, done} ready to write, or {ok:false, message}. Never touches
// localStorage itself - the whole point is that a bad file is caught here,
// before anything is written, not partway through writing it.
function validateBackupPayload(obj){
  if(!obj || typeof obj !== "object" || Array.isArray(obj)){
    return {ok:false, message:"That file isn't a valid backup (not a JSON object)."};
  }
  if(obj.app !== BACKUP_SCHEMA){
    return {ok:false, message:"That file doesn't look like a Complete Spanish Review backup."};
  }
  if(obj.version !== BACKUP_VERSION){
    return {ok:false, message:"That backup was made with a version of this app this build doesn't understand."};
  }
  if(!obj.progress || typeof obj.progress !== "object" || Array.isArray(obj.progress)){
    return {ok:false, message:"That backup file is missing its progress data."};
  }
  var known = knownPackIds();
  var progress = {}, skippedPacks = 0;
  Object.keys(obj.progress).forEach(function(pid){
    if(!known[pid]){ skippedPacks++; return; } // dataset gains tracks over time; ignore what we don't recognise
    var g = obj.progress[pid];
    if(!g || typeof g !== "object" || Array.isArray(g)) return;
    var clean = {};
    Object.keys(g).forEach(function(did){
      if(g[did] === "got" || g[did] === "stuck"){ clean[did] = g[did]; }
    });
    if(Object.keys(clean).length){ progress[pid] = clean; }
  });
  var done = {};
  if(obj.done && typeof obj.done === "object" && !Array.isArray(obj.done)){
    Object.keys(obj.done).forEach(function(pid){
      if(known[pid] && obj.done[pid] === true){ done[pid] = true; }
    });
  }
  return {ok:true, progress:progress, done:done, skippedPacks:skippedPacks};
}

// Merge (the default, non-destructive choice): union everything, and where
// the same drill is graded on both sides, "got" always wins over "stuck".
// Progress only ever moves forward, so this can never erase a real result -
// it's safe to run with a stale or partial file.
function applyBackupMerge(progress, done){
  Object.keys(progress).forEach(function(pid){
    var key = KEY_PREFIX + pid;
    var existing; try{ existing = JSON.parse(localStorage.getItem(key) || "{}"); }catch(e){ existing = {}; }
    if(!existing || typeof existing !== "object"){ existing = {}; }
    var incoming = progress[pid];
    Object.keys(incoming).forEach(function(did){
      if(existing[did] === "got") return;
      existing[did] = incoming[did];
    });
    try{ localStorage.setItem(key, JSON.stringify(existing)); }catch(e){}
  });
  var doneMap = getDoneMap();
  Object.keys(done).forEach(function(pid){ doneMap[pid] = true; });
  setDoneMap(doneMap);
}

// Replace: the file becomes the sole source of truth for progress. Destructive
// on purpose (an older export can wipe newer real progress), so callers must
// gate this behind an explicit confirmation before ever getting here.
function applyBackupReplace(progress, done){
  DATA.packs.forEach(function(p){
    try{ localStorage.removeItem(KEY_PREFIX + p.id); }catch(e){}
  });
  Object.keys(progress).forEach(function(pid){
    try{ localStorage.setItem(KEY_PREFIX + pid, JSON.stringify(progress[pid])); }catch(e){}
  });
  setDoneMap(done);
}

function handleImportFile(file){
  if(!file) return;
  var mode = backupMode;
  if(mode === "replace" && !backupConfirmReplace){
    backupMsg = "Check the confirmation box before replacing existing progress. Nothing was changed.";
    backupMsgKind = "err";
    render();
    return;
  }
  var reader = new FileReader();
  reader.onload = function(){
    var parsed;
    try{ parsed = JSON.parse(String(reader.result)); }
    catch(e){
      backupMsg = "That file isn't valid JSON. Nothing was changed.";
      backupMsgKind = "err";
      finishImport();
      return;
    }
    var result = validateBackupPayload(parsed);
    if(!result.ok){
      backupMsg = result.message + " Nothing was changed.";
      backupMsgKind = "err";
      finishImport();
      return;
    }
    if(mode === "replace"){ applyBackupReplace(result.progress, result.done); }
    else { applyBackupMerge(result.progress, result.done); }

    var packCount = Object.keys(result.progress).length;
    var doneCount = Object.keys(result.done).length;
    var skipNote = result.skippedPacks ? (" (" + result.skippedPacks + " unrecognised track" + (result.skippedPacks===1?"":"s") + " skipped)") : "";
    backupMsg = (mode === "replace" ? "Replaced" : "Merged in") + " progress for " + packCount + " track" + (packCount===1?"":"s") +
      ", " + doneCount + " marked done" + skipNote + ".";
    backupMsgKind = "ok";
    backupConfirmReplace = false;
    finishImport();
  };
  reader.onerror = function(){
    backupMsg = "Couldn't read that file. Nothing was changed.";
    backupMsgKind = "err";
    finishImport();
  };
  reader.readAsText(file);
}

function finishImport(){
  render();
  // Clear the value so choosing the exact same file again still fires 'change'.
  var fi = document.getElementById('importFile'); if(fi){ fi.value = ""; }
}

function nextRecommendedTrack(){
  var packs = orderedPacks();
  var doneMap = getDoneMap();
  for(var i=0;i<packs.length;i++){ if(!doneMap[packs[i].id]) return packs[i]; }
  return null;
}

function nextPackAfter(p){
  var packs = orderedPacks();
  for(var i=0;i<packs.length;i++){ if(packs[i].id===p.id){ return packs[i+1] || null; } }
  return null;
}

/* ---------- on-demand recap ---------- */
var RECAP_SIZE = 12;

function shuffled(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}

// Tracks worth recapping: anything the learner has covered - marked done
// via the home-screen circle (which grades nothing on its own), or with at
// least one graded drill (via the packProgress fix above, "graded" means
// either "got" or "stuck", not just "got").
function recapCandidatePacks(){
  var doneMap = getDoneMap();
  return orderedPacks().filter(function(p){ return doneMap[p.id] || packProgress(p); });
}

function hasRecapMaterial(){ return recapCandidatePacks().length > 0; }

function trackGrades(p){
  try{ return JSON.parse(localStorage.getItem(KEY_PREFIX+p.id) || "{}"); }catch(e){ return {}; }
}

// Bug fix: this used to pool ONLY drills that already carried a "got" or
// "stuck" grade. A track marked done via the home-screen circle grades
// nothing, so a learner who works through tracks and ticks them off (rather
// than grading every drill) ended up with a covered-tracks list full of
// tracks and an almost-empty grade pool - recap then drew from that
// handful forever, however high RECAP_SIZE was set.
//
// Fixed pool = every drill in every covered track, ranked:
//   1. marked "stuck"   - most worth another pass
//   2. ungraded         - covered but never actually tested; as worth
//                         recapping as a stuck one, arguably more so than
//                         one already proven "got"
//   3. marked "got"     - already demonstrated, lowest priority filler
// Each tier is shuffled before slicing so which drills fill RECAP_SIZE (and
// their order) differs run to run, and the final pick is reshuffled so the
// tiers don't run in blocks.
function startRecap(){
  var packs = recapCandidatePacks();
  var stuckPool = [], freshPool = [], gotPool = [];
  packs.forEach(function(p){
    var g = trackGrades(p);
    p.drills.forEach(function(d){
      var st = g[d.id];
      if(st==="stuck") stuckPool.push(d);
      else if(st==="got") gotPool.push(d);
      else freshPool.push(d);
    });
  });
  var picked = shuffled(stuckPool).slice(0, RECAP_SIZE);
  if(picked.length < RECAP_SIZE){
    picked = picked.concat(shuffled(freshPool).slice(0, RECAP_SIZE - picked.length));
  }
  if(picked.length < RECAP_SIZE){
    picked = picked.concat(shuffled(gotPool).slice(0, RECAP_SIZE - picked.length));
  }
  picked = shuffled(picked);

  var ruleIds = {};
  picked.forEach(function(d){ (d.rules||[]).forEach(function(rid){ ruleIds[rid]=true; }); });
  var rules = Object.keys(ruleIds).map(ruleById).filter(Boolean).sort(function(a,b){ return a.track-b.track; });

  pack = {id:"recap", label:"Recap", recap:true, drills:picked, rules:rules, tracks:[]};
  ruleFilterId = null; ruleFilterLabel = null; focusRuleId = null;
  grades = {};
  queue = picked.slice();
  idx = 0; revealedSteps = 0; answerShown = false; usedHint = false;
  view = picked.length ? "drill" : "summary";
}

/* ---------- the rule glossary ----------
   The course teaches a mechanism once and then keeps coming back to it, and
   every track that leans on an earlier rule carries its own copy of that rule
   so its Rules tab stands alone. Read flat, that's ~200 near-identical rows,
   so the glossary groups the copies by the rule's `family` and shows each
   concept once: the fullest wording any track gives it, every track it turns
   up in, and any track that words it differently rather than just longer. */
function familyOf(r){ return r.family || r.id.split('__')[1].replace(/-\d+$/, ""); }

var GLOSSARY = (function(){
  var byFamily = {}, list = [];
  orderedPacks().forEach(function(p){
    (p.rules||[]).forEach(function(r){
      var fam = familyOf(r), e = byFamily[fam];
      if(!e){ e = byFamily[fam] = {family:fam, origin:r.track, sectionIndex:p.sectionIndex, copies:[]}; list.push(e); }
      var n = 0;
      (p.drills||[]).forEach(function(d){ if((d.rules||[]).indexOf(r.id) !== -1) n++; });
      e.copies.push({packId:p.id, track:p.tracks[0], rule:r, drills:n});
      // The introducing copy is the one sitting in the track that taught it;
      // it decides which section of the course this rule belongs to.
      if(p.tracks[0] === r.track){ e.sectionIndex = p.sectionIndex; }
      if(r.track < e.origin){ e.origin = r.track; }
    });
  });
  list.forEach(function(e){
    e.copies.sort(function(a,b){ return a.track - b.track; });
    // The wording to lead with is the fullest one the course ever gives,
    // which is normally the last track to revisit it.
    var main = e.copies[0];
    e.copies.forEach(function(c){
      if(c.rule.explanation.length >= main.rule.explanation.length) main = c;
    });
    e.main = main;
    e.title = main.rule.title;
    e.totalDrills = 0;
    e.tracks = e.copies.map(function(c){ e.totalDrills += c.drills; return c.track; });
    // Only worth showing separately if a track says something the leading
    // wording doesn't already contain.
    var seen = {}, hay = [e.title, e.family];
    e.variants = [];
    e.copies.forEach(function(c){
      hay.push(c.rule.explanation);
      (c.rule.examples||[]).forEach(function(x){ hay.push(x); });
      if(c === main || seen[c.rule.explanation]) return;
      seen[c.rule.explanation] = true;
      if(main.rule.explanation.indexOf(c.rule.explanation) === -1){
        e.variants.push({track:c.track, text:c.rule.explanation});
      }
    });
    e.tracks.forEach(function(t){ hay.push("track " + t); });
    e.hay = hay.join(" \n ").toLowerCase();
  });
  list.sort(function(a,b){
    if(a.origin !== b.origin) return a.origin - b.origin;
    return a.title.localeCompare(b.title);
  });
  list.forEach(function(e, i){ e.idx = i; });
  return list;
})();

var N_RULE_CARDS = (function(){
  var n = 0;
  DATA.packs.forEach(function(p){ n += (p.rules||[]).length; });
  return n;
})();

function glossaryMatches(q){
  q = (q||"").trim().toLowerCase();
  if(!q) return GLOSSARY;
  return GLOSSARY.filter(function(e){ return e.hay.indexOf(q) !== -1; });
}

/* ---------- navigation ---------- */
function enterGlossary(prefill){
  pack = null;
  view = "glossary";
  if(typeof prefill === "string"){ glossaryFilter = prefill; openFamily = null; }
  render();
}

function enterHome(){
  maybeAutoFinish(pack);
  pack = null; view = "home"; homeJustEntered = true; render();
}

function enterBackup(){
  pack = null; view = "backup";
  backupMode = "merge"; backupConfirmReplace = false; backupMsg = null; backupMsgKind = null;
  render();
}

function openPack(p, opts){
  pack = p;
  ruleFilterId = null; ruleFilterLabel = null;
  focusRuleId = (opts && opts.focusRuleId) || null;
  restore();
  startSession(opts);
  render();
}

// Where a plain (unfiltered) session should pick up: the first drill in the
// pool that hasn't been graded yet. Grading always happens in pool order, so
// the graded ids form a prefix of the pool and this is a genuine "stopped here".
function resumeIndex(pool){
  for(var i=0;i<pool.length;i++){ if(grades[pool[i].id]===undefined) return i; }
  return pool.length;
}

function startSession(opts){
  opts = opts || {};
  var pool = pack.drills;
  if(opts.ruleFilter){
    pool = pool.filter(function(d){ return d.rules && d.rules.indexOf(opts.ruleFilter) !== -1; });
    ruleFilterId = opts.ruleFilter;
    var r = ruleById(opts.ruleFilter);
    ruleFilterLabel = r ? r.title : opts.ruleFilter;
    idx = 0;
  } else {
    ruleFilterId = null; ruleFilterLabel = null;
    idx = opts.restart ? 0 : resumeIndex(pool);
  }
  queue = pool.slice();
  revealedSteps = 0; answerShown = false; usedHint = false;
  view = queue.length ? (idx < queue.length ? "drill" : "summary") : "rules";
}

// "Take that back" used to mean three different things depending on what
// happened to be on screen: fold the answer away, fold a hint away, or jump
// to the previous drill. The third one is the odd one out - it leaves the
// drill you were working on, which is not what taking back a reveal means -
// and you could reach it by pressing the same link one time too many. It
// only undoes reveals now, within the drill you are on, and stepping back
// through the queue has its own button (see prevDrill).
function canUndoReveal(){ return view==="drill" && (answerShown || revealedSteps>0); }

function undoReveal(){
  if(answerShown){ answerShown=false; render(); return; }
  if(revealedSteps>0){ revealedSteps--; render(); }
}

function canPrevDrill(){ return view==="drill" && idx>0; }

// Back a drill starts it fresh rather than restoring the hints you had out:
// you are going back to have another go at it, and a drill that reopens
// with its answer already showing is not another go.
function prevDrill(){
  if(!canPrevDrill()) return;
  idx--; answerShown=false; revealedSteps=0; usedHint=false;
  render();
}

// Browser/system back. The drill view is a single history entry (see the
// pushState in render()), so backing out of it leaves the track rather than
// rewinding inside it.
function goBack(){
  if(view==="drill"){ enterHome(); return; }
  if(view==="rules"){
    if(queue.length){ view = "drill"; render(); return; }
    enterHome(); return;
  }
  if(view==="summary"){ view="drill"; render(); return; }
  enterHome();
}

/* ---------- drill flow ---------- */
function grade(ok){
  var d = queue[idx];
  grades[d.id] = ok ? "got" : "stuck";
  persist();
  idx++;
  if(idx >= queue.length){ view="summary"; }
  else { answerShown=false; revealedSteps=0; usedHint=false; }
  render();
}

function nextStep(){
  var d = queue[idx];
  if(revealedSteps < (d.steps ? d.steps.length : 0)){ revealedSteps++; usedHint=true; render(); }
  else { answerShown = true; render(); }
}

/* ---------- rendering ---------- */
function bar(html){ return '<div class="bar" id="bar">' + html + '</div>'; }
function barStack(html){ return '<div class="bar stack" id="bar">' + html + '</div>'; }
function barGrade(html){ return '<div class="bar grade" id="bar">' + html + '</div>'; }
function barChoice(html){ return '<div class="bar choice" id="bar">' + html + '</div>'; }

// The running head is home's only persistent chrome: the app name, the
// course-wide stat, and a 3px measure line with an ink-filled segment.
function homeHeadHtml(){
  var totalPacks = DATA.packs.length;
  var doneCount = Object.keys(getDoneMap()).length;
  var pct = Math.round(doneCount/totalPacks*100);
  var stat = doneCount+' of '+totalPacks+' tracks &middot; '+pct+'%';
  return '<header><div class="head"><div class="name">Complete Spanish</div>'+
    '<div class="stat">'+stat+'</div></div>'+
    '<div class="measure" role="img" aria-label="'+esc(doneCount+' of '+totalPacks+' tracks, '+pct+' percent')+'">'+
    '<i style="width:'+pct+'%"></i></div></header>';
}

// The pack-scoped header: a single back arrow (always exits to the track
// list - the drill loop's own "take that back" link handles undoing a
// reveal, see undoLineHtml()) plus the Drills/Rules tab strip.
function packHeadHtml(){
  var drillsActive = (view==="drill" || view==="summary");
  return '<header class="topline">'+
    '<button class="back" id="topHomeBtn">&larr; Tracks</button>'+
    '<nav class="tabs">'+
    '<button id="tabDrills" aria-selected="'+drillsActive+'">Drills ('+pack.drills.length+')</button>'+
    '<button id="tabRules" aria-selected="'+(view==="rules")+'">Rules ('+pack.rules.length+')</button>'+
    '</nav></header>';
}

// The glossary/backup header: a text "back" link, a title, a one-line count.
function pageHeadHtml(title, countHtml){
  return '<header class="gh"><button class="back" id="topHomeBtn">&larr; Tracks</button>'+
    '<h1>'+title+'</h1>'+
    (countHtml ? '<div class="gcount">'+countHtml+'</div>' : '')+
    '</header>';
}

function headHtml(){
  if(view==="home") return homeHeadHtml();
  if(view==="glossary") return pageHeadHtml('All rules', GLOSSARY.length+' concepts, taught across '+N_RULE_CARDS+' rule cards in '+DATA.packs.length+' tracks');
  if(view==="backup") return pageHeadHtml('Back up progress', '');
  return packHeadHtml();
}

function packCardHtml(p){
  var prog = packProgress(p);
  var done = isDone(p.id);
  var progHtml;
  // Success is unmarked (the filled tick already said it); struggle is what
  // earns ink. A track with no drills of its own (track 1) says so instead
  // of showing a meaningless count.
  if(!p.drills.length){
    progHtml = '<span class="prog">rules only</span>';
  } else if(done){
    progHtml = '';
  } else if(prog){
    progHtml = '<span class="prog">'+prog.done+'/'+prog.total+'</span>';
  } else {
    // Bare count: it sits under the done circle, where "how much is in here"
    // needs no unit spelled out, and the description gets the whole line.
    progHtml = '<span class="prog">'+p.drills.length+'</span>';
  }
  var rowLabel = 'Track '+p.tracks[0]+(p.blurb ? ' — '+p.blurb : '');
  return '<div class="packcard'+(done?' done':'')+'" id="pack-'+esc(p.id)+'" data-pid="'+esc(p.id)+'">' +
    '<button class="rowbtn" data-pid="'+esc(p.id)+'" aria-label="'+esc(rowLabel)+'">' +
    '<span class="num">'+p.tracks[0]+'</span>' +
    '<span class="meta"><span class="sub">'+esc(p.blurb||'')+'</span></span>' +
    '</button>' +
    '<span class="rowend">' +
    '<button class="donebtn'+(done?' on':'')+'" data-pid="'+esc(p.id)+'" aria-label="'+(done?"Mark track "+p.tracks[0]+" not done":"Mark track "+p.tracks[0]+" done")+'" aria-pressed="'+done+'"><span class="donebtn-circle"></span></button>' +
    progHtml +
    '</span>' +
    '</div>';
}

function trackRangeText(sec){ return sec.end===sec.start ? ('Track '+sec.start) : ('Tracks '+sec.start+'&ndash;'+sec.end); }

// "Where you left off" (or, once nothing is left, the all-caught-up state).
// Pulled out on its own so the done-toggle handler in wire() can refresh
// just this block without a full re-render.
function homeHeroHtml(){
  var rec = nextRecommendedTrack();
  if(rec){
    return '<div class="home-hero" id="homeHero"><div class="lbl">Where you left off</div>' +
      '<div class="t">Track '+rec.tracks[0]+'</div><p class="b">'+esc(rec.blurb||'')+'</p>' +
      '<button class="btn" id="continueCardBtn" data-pid="'+esc(rec.id)+'" aria-label="Start track '+rec.tracks[0]+'">Start</button>' +
      '</div>';
  }
  return '<div class="home-hero" id="homeHero"><div class="lbl">All caught up</div>' +
    '<div class="t">All '+DATA.packs.length+' tracks marked done</div>' +
    '<p class="b">Revisit any track below for another pass.</p></div>';
}

function renderHome(){
  // Said plainly and once, at the top, because a stranger opening this
  // deserves to know the progress on screen is not theirs and that poking
  // at it cannot damage anything.
  var html = DEMO ? ('<div class="demo-note">A demo, opened with sample progress so the screens aren\'t empty. ' +
    'Work any track you like &mdash; it is kept separately from the real app and never touches it. ' +
    '<button class="link-inline" id="demoResetBtn">Put the sample progress back</button></div>') : '';
  html += '<div class="searchrow"><input id="homeSearch" type="search" aria-label="Search tracks or grammar" placeholder="Search tracks and rules" value="'+esc(homeFilter)+'"></div>';

  var q = homeFilter.trim().toLowerCase();
  if(q){
    var filtered = orderedPacks().filter(function(p){
      var matchesBasic = p.label.toLowerCase().indexOf(q)!==-1 ||
        (p.blurb||'').toLowerCase().indexOf(q)!==-1 ||
        ''+p.tracks[0] === q;
      var matchesRules = false;
      if(p.rules){
        for(var ri=0;ri<p.rules.length;ri++){
          if((p.rules[ri].title||'').toLowerCase().indexOf(q)!==-1 ||
             (p.rules[ri].explanation||'').toLowerCase().indexOf(q)!==-1){
            matchesRules = true; break;
          }
        }
      }
      return matchesBasic || matchesRules;
    });
    // The track list answers "which track was that in?"; a query that hits rule
    // text usually means the learner wants the rule itself, which lives in the
    // glossary, so offer the jump instead of making them find it again there.
    var ruleHits = glossaryMatches(q).length;
    if(ruleHits){
      html += '<button class="glossjump" id="glossJumpBtn">' + ruleHits + ' rule' + (ruleHits===1?'':'s') +
        ' match in All rules <span class="arrow" aria-hidden="true">&rarr;</span></button>';
    }
    html += '<div class="packlist">' + (filtered.map(packCardHtml).join('') || '<div class="empty">No tracks match that search.</div>') + '</div>';
    html += '<div class="footlink"><button id="backupBtn">Back up or restore progress</button></div>';
    return html;
  }

  html += homeHeroHtml();

  if(hasRecapMaterial()){
    var n = recapCandidatePacks().length;
    html += '<div class="linkrow"><button class="link" id="recapBtn">Recap practice' +
      '<span class="sub">A mixed check across the '+n+' track'+(n===1?'':'s')+' you\'ve covered, weighted toward what you got stuck on.</span></button></div>';
  }

  html += '<div class="linkrow"><button class="link" id="glossaryBtn">All rules' +
    '<span class="sub">Every rule in the course, on its own and searchable.</span></button></div>';

  DATA.sections.forEach(function(sec, i){
    var secPacks = orderedPacks().filter(function(p){ return p.sectionIndex===i; });
    if(!secPacks.length) return;
    html += '<div class="section-head"><div class="r">'+trackRangeText(sec)+'</div><h3>'+esc(sec.title)+'</h3><p>'+esc(sec.focus)+'</p></div>';
    html += '<div class="packlist">' + secPacks.map(packCardHtml).join('') + '</div>';
  });

  html += '<div class="footlink"><button id="backupBtn">Back up or restore progress</button></div>';
  return html;
}

function renderBackup(){
  var html = '<p style="color:var(--ink-2);font-size:.9375rem;line-height:1.5;max-width:38ch;margin:var(--s3) 0 0">Your progress lives only in this browser. Download a backup to keep a copy, or bring progress over from another device or browser.</p>';
  html += '<div class="backup-list">';

  html += '<div class="backup-row"><div class="lbl">Export</div>' +
    '<p>Download everything you\'ve graded and marked done as one file.</p>' +
    '<button class="btn" id="exportBtn">Download a backup file</button>' +
    '</div>';

  var replaceSelected = backupMode === "replace";
  var importDisabled = replaceSelected && !backupConfirmReplace;
  html += '<div class="backup-row"><div class="lbl">Import</div>' +
    '<p>Load a backup file back in. Choose how it combines with what\'s already here:</p>' +
    '<label class="radiorow"><input type="radio" name="backupMode" value="merge" id="modeMerge" '+(backupMode==="merge"?"checked":"")+'>' +
    '<span><b>Merge</b> &mdash; keep everything on both sides; where a drill is graded on both, got always beats stuck. Never loses progress.</span></label>' +
    '<label class="radiorow"><input type="radio" name="backupMode" value="replace" id="modeReplace" '+(replaceSelected?"checked":"")+'>' +
    '<span><b>Replace</b> &mdash; wipe current progress and use only what\'s in the file.</span></label>' +
    (replaceSelected ? '<label class="radiorow confirm"><input type="checkbox" id="backupConfirm" '+(backupConfirmReplace?"checked":"")+'>' +
      '<span>I understand this replaces all current progress and can\'t be undone.</span></label>' : '') +
    '<input type="file" id="importFile" accept="application/json,.json" style="display:none">' +
    '<div style="margin-top:var(--s2)"><button class="filerow" id="importBtn"'+(importDisabled?' disabled title="Check the confirmation box first"':'')+'>Choose file&hellip;</button></div>' +
    '</div>';

  if(backupMsg){
    html += '<div class="backup-msg '+(backupMsgKind==="err"?"err":"ok")+'" role="status" aria-live="polite">' + esc(backupMsg) + '</div>';
  }

  html += '</div>';
  return html;
}

function trackListText(tracks){
  if(tracks.length===1) return 'track ' + tracks[0];
  return 'tracks ' + tracks.slice(0,-1).join(', ') + ' and ' + tracks[tracks.length-1];
}

function glossaryEntryHtml(e, i, isOpen){
  var rowId = 'gl-' + i, panelId = 'glp-' + i;
  var revisits = e.copies.filter(function(c){ return c.track !== e.origin; }).map(function(c){ return c.track; });
  var countHtml = '<span class="n">' + (revisits.length ? (revisits.length+1) + ' tracks' : 'once') + '</span>';
  var head = '<button class="glosshead" id="'+rowId+'" data-fam="'+esc(e.family)+'" aria-expanded="'+(isOpen?'true':'false')+'" aria-controls="'+panelId+'">' +
    '<span class="num">'+e.origin+'</span>' +
    '<span class="t">'+esc(e.title)+'</span>' + countHtml +
    '</button>';
  if(!isOpen) return '<div class="glossrow">' + head + '</div>';

  var r = e.main.rule;
  var body = '<p>'+esc(r.explanation)+'</p>';
  if(r.examples && r.examples.length){
    body += '<ul>' + r.examples.map(exampleHtml).join('') + '</ul>';
  }
  body += e.variants.map(function(v){
    return '<div class="variant"><div class="vlbl">Track '+v.track+' words it differently</div><p>'+esc(v.text)+'</p></div>';
  }).join('');
  body += '<div class="where">Introduced in track '+e.origin +
    (revisits.length ? ' &middot; comes back in ' + trackListText(revisits) : '') + '.</div>';

  var targets = e.copies.filter(function(c){ return c.drills > 0; });
  if(!targets.length){
    body += '<div class="where">No drills practice this one on its own.</div>';
  } else {
    body += '<div class="practicerow"><span class="where" style="margin:0;padding:10px 0">Practice it in&nbsp;</span>' +
      targets.map(function(c){
        return '<button class="gpractice" data-pid="'+esc(c.packId)+'" data-ruleid="'+esc(c.rule.id)+'">track '+c.track+'</button>';
      }).join('') + '</div>';
  }
  return '<div class="glossrow">' + head + '<div class="glosspanel" id="'+panelId+'">' + body + '</div></div>';
}

function renderGlossary(){
  var q = glossaryFilter.trim();
  var html = '<div class="searchrow"><input id="glossarySearch" type="search" aria-label="Search all rules" placeholder="Search every rule" value="'+esc(glossaryFilter)+'"></div>';

  if(q){
    var found = glossaryMatches(q);
    if(!found.length) return html + '<div class="empty">No rules match that search.</div>';
    // One hit is almost always the one you were looking for, so open it.
    var only = (found.length===1) ? found[0].family : null;
    html += '<div class="section-head" style="margin-top:0;border-top:0;padding-top:var(--s2)"><h3>'+found.length+' rule'+(found.length===1?'':'s')+' match</h3></div>';
    html += '<div class="glosslist">' + found.map(function(e){
      return glossaryEntryHtml(e, e.idx, openFamily===e.family || only===e.family);
    }).join('') + '</div>';
    return html;
  }
