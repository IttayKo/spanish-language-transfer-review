<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Complete Spanish — Review</title>
<meta name="description" content="An unofficial companion for practicing Language Transfer's Complete Spanish course: speaking drills and a searchable grammar glossary.">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#FAF8F4">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CS Review">
<style>
:root{
  /* Direction A, "Primer" - ink on warm paper. No cards, no boxes. Ratios
     computed with the WCAG relative-luminance formula; see redesign PLAN.md
     section 4.1 for the worked numbers. */
  --paper:#FAF8F4;      /* page ground */
  --sunk:#F0ECE4;       /* recessed / inactive surface, and the "arrived from Why" bleed */
  --ink:#23201C;        /* 15.29:1 on paper - body text, filled buttons */
  --ink-2:#635D54;      /* 6.14:1 - secondary prose, revealed English */
  --ink-3:#6E675D;      /* 5.26:1 - cue lines, counters, periphery */
  --edge:#8C8475;       /* 3.49:1 - meaningful boundaries only (never text) */
  --rule:#DDD6C8;       /* decorative row hairline */
  --rule-2:#CFC7B6;     /* decorative section hairline */
  --mark:#194A93;       /* 8.11:1 - links, rule cross-refs, live things */
  --flag:#9C3626;       /* 6.67:1 - statements about reliability: Not yet, not-from-the-recording */
  --danger:var(--flag);
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --bar:5rem;
  /* Bumped up a step from the original scale - the redesign's first review
     round came back "way too tight" across every screen. Rows get taller,
     gaps get wider; smaller type and raggeder wrapping are an accepted
     trade for it (see the truncation removals below). */
  --s1:4px; --s2:10px; --s3:16px; --s4:20px; --s5:32px; --s6:44px; --s7:64px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
:focus-visible{outline:2px solid var(--mark);outline-offset:2px;border-radius:2px}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button{font:inherit;color:inherit;font-variant-numeric:inherit}
.app{max-width:42rem;margin:0 auto;padding:0 20px;min-height:100dvh;display:flex;flex-direction:column;background:var(--paper);}
main{flex:1;padding:0 0 calc(var(--bar) + var(--s5))}

/* ---- running head: home's only persistent chrome ---- */
.head{display:flex;align-items:baseline;gap:var(--s3);padding:22px 0 0;min-height:48px}
.head .name{font-size:.9375rem;font-weight:600;letter-spacing:-.003em}
.head .stat{margin-left:auto;font-size:.8125rem;color:var(--ink-3);white-space:nowrap}
.measure{height:3px;background:var(--rule-2);margin:12px 0 0;position:relative}
.measure i{position:absolute;inset:0 auto 0 0;background:var(--ink)}

/* ---- pack-view header: back arrow + Drills/Rules tabs, one row ---- */
.topline{display:flex;align-items:stretch;gap:var(--s4);border-bottom:1px solid var(--rule);padding-top:8px}
.tabs{display:flex;gap:var(--s5)}
.tabs button{
  appearance:none;border:0;background:none;padding:14px 0 13px;min-height:48px;
  font-size:.9375rem;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}

/* ---- glossary / backup header: back link, title, one-line count ---- */
.gh{padding:18px 0 0}
.gh h1{font-size:1.25rem;font-weight:600;letter-spacing:-.014em;margin:8px 0 0}
.gh .gcount{padding-top:6px;line-height:1.5}

.back{
  appearance:none;border:0;background:none;padding:14px 0;margin:0;
  min-height:48px;display:inline-flex;align-items:center;gap:6px;
  color:var(--mark);font-size:.875rem;cursor:pointer;
}
.topline .back{padding:0;min-width:44px;justify-content:flex-start;margin-right:-6px;font-size:1.0625rem}

/* ---- search: a line to write on, not a box ---- */
.searchrow{position:relative;margin:var(--s5) 0 var(--s4)}
.searchrow input{
  width:100%;appearance:none;background:transparent;border:0;
  border-bottom:1.5px solid var(--edge);
  padding:14px 0;font:inherit;font-size:.9375rem;color:var(--ink);min-height:48px;
}
.searchrow input::placeholder{color:var(--ink-3)}

/* ---- the next thing to do ---- */
.home-hero{padding:var(--s5) 0 var(--s5)}
.home-hero .lbl{font-size:.8125rem;color:var(--ink-3);margin-bottom:8px}
.home-hero .t{font-size:1.375rem;line-height:1.3;font-weight:600;letter-spacing:-.012em;margin-bottom:8px}
.home-hero .b{font-size:.9375rem;color:var(--ink-2);line-height:1.55;max-width:34ch;margin:0}
/* Full width, like the primary button in the drill bar. Shrink-wrapped it
   hangs flush-left under the description with nothing balancing it. */
.home-hero .btn{display:block;width:100%;margin-top:var(--s3)}
.linkrow{border-top:1px solid var(--rule);padding-top:var(--s3);margin-top:var(--s3)}
.linkrow:first-child{margin-top:0}
.link{
  appearance:none;border:0;background:none;padding:16px 0;min-height:48px;
  color:var(--mark);font-size:.9375rem;cursor:pointer;text-align:left;
  display:block;width:100%;
}
.link .sub{display:block;color:var(--ink-3);font-size:.8125rem;line-height:1.5;margin-top:4px;max-width:40ch;font-weight:400}

/* ---- sections & track rows: a table of contents, not cards ---- */
.section-head{padding:var(--s6) 0 var(--s3);border-top:1.5px solid var(--rule-2);margin-top:var(--s5)}
.section-head:first-of-type{margin-top:var(--s3);padding-top:var(--s2);border-top:0}
.section-head .r{font-size:.8125rem;color:var(--ink-3)}
.section-head h3{margin:4px 0 6px;font-size:1rem;font-weight:600;letter-spacing:-.008em}
.section-head p{margin:0;font-size:.8125rem;line-height:1.55;color:var(--ink-3);max-width:44ch}

.packlist{margin:0}
.packcard{display:flex;align-items:flex-start;border-top:1px solid var(--rule)}
.packlist .packcard:first-child{border-top:0}
.rowbtn{
  appearance:none;border:0;background:none;flex:1;min-width:0;cursor:pointer;
  display:flex;gap:var(--s3);padding:16px 0;min-height:48px;text-align:left;align-items:flex-start;
  color:inherit;font:inherit;margin:0;
}
.packcard .num{width:1.75rem;flex:none;text-align:right;font-size:.9375rem;color:var(--ink-3);padding-top:2px;font-weight:400}
.packcard .meta{flex:1;min-width:0}
/* No truncation: the full blurb wraps onto as many lines as it needs
   (smaller type and ragged wraps are fine, hiding the description isn't). */
.packcard .meta .sub{font-size:.9375rem;line-height:1.5;color:var(--ink)}
.packcard.done .meta .sub{color:var(--ink-2)}
/* The count lives under the done circle, not inline, so the description
   gets the full width of the line. */
.packcard .rowend{flex:none;display:flex;flex-direction:column;align-items:center;width:3.25rem;padding-top:10px}
.packcard .prog{font-size:.75rem;color:var(--ink-3);line-height:1.3;text-align:center;margin-top:-6px}
.packcard .prog.part{color:var(--ink);font-weight:600;font-size:.875rem}
.donebtn{
  appearance:none;border:0;background:none;width:44px;height:44px;flex:none;
  padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.donebtn-circle{
  width:19px;height:19px;border-radius:50%;border:1.5px solid var(--edge);
  display:block;position:relative;background:transparent;
}
.donebtn.on .donebtn-circle{background:var(--ink);border-color:var(--ink)}
.donebtn.on .donebtn-circle::after{
  content:"";position:absolute;left:5px;top:3px;width:5px;height:9px;
  border:solid var(--paper);border-width:0 1.5px 1.5px 0;transform:rotate(43deg);
}

.footlink{margin:var(--s7) 0 var(--s6);border-top:1px solid var(--rule);padding-top:var(--s3)}
.footlink button{
  appearance:none;border:0;background:none;padding:16px 0;min-height:48px;
  color:var(--ink-3);font-size:.875rem;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule-2);
}

/* the "N rules match in All rules" jump row - a plain link row, same
   discipline as .link above */
.glossjump{
  appearance:none;border:0;background:none;width:100%;padding:16px 0;min-height:48px;
  color:var(--mark);font-size:.9375rem;cursor:pointer;text-align:left;
  border-top:1px solid var(--rule);display:flex;align-items:center;gap:var(--s2);
}
.glossjump .arrow{margin-left:auto;color:var(--ink-3)}

.empty{color:var(--ink-3);text-align:center;padding:var(--s6) 0;font-size:.9375rem}

/* ---- drill ---- */
.filterbanner{font-size:.8125rem;line-height:1.5;color:var(--ink-3);padding:0 0 var(--s3);display:flex;align-items:baseline;flex-wrap:wrap;gap:4px var(--s2)}
.filterbanner b{color:var(--ink);font-weight:600}
.filterbanner .link-inline{
  appearance:none;border:0;background:none;padding:0;margin:0;min-height:auto;
  color:var(--mark);font-size:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:2px;
}
.cue{font-size:.8125rem;color:var(--ink-3);padding:var(--s5) 0 var(--s4)}
.cue .flag{color:var(--flag)}
/* Phone: the drill stage is top-anchored on purpose - the actions live where
   the thumb is, the empty space below is just page (risk #2 in PLAN.md 4.6).
   Desktop: optically centre it with auto margins (never clips tall content,
   unlike justify-content:center). */
main.view-drill{flex:1;display:flex;flex-direction:column}
@media (min-width:680px){
  main.view-drill::before{content:"";margin-top:auto}
  main.view-drill::after{content:"";margin-bottom:auto}
}
.eng{font-size:1.75rem;line-height:1.34;letter-spacing:-.017em;max-width:22ch;font-weight:400}
.eng .reg{display:block;margin-top:12px;color:var(--ink-3);font-size:.875rem;letter-spacing:0;font-weight:400}
/* Revealing the answer must not recompose this: same size, same position,
   same max-width - only the colour dims a shade, so nothing the learner was
   reading jumps. See .answer below for where the "event" of revealing
   actually lives instead. */
.eng.answered{color:var(--ink-2)}
.eng.answered .reg{color:var(--ink-3)}

/* One group, not a boxed-off strip: a separator BETWEEN hints, never a
   leading rule above the first one or a trailing one under the last. */
.steps{margin:var(--s5) 0 0;padding:0;list-style:none}
.steps li{padding:14px 0;border-top:1px solid var(--rule);font-size:.9375rem;line-height:1.6;color:var(--ink-2)}
.steps li:first-child{padding-top:0;border-top:0}
.steps .step-why{color:var(--ink-2)}
.steps .sep{color:var(--ink-3)}
.steps .es{color:var(--ink);font-weight:600}
.undo{
  appearance:none;border:0;background:none;padding:14px 0;min-height:48px;
  color:var(--ink-3);font-size:.8125rem;cursor:pointer;display:block;margin-left:auto;
  text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule-2);
}
.undo-row{text-align:right}

/* The reveal is a new block that arrives BELOW the prompt and any hints
   already on screen - it never displaces them. Its own weight (scale, plus
   the hairline that opens it) is what makes it read as an event, not motion. */
.answer{margin:var(--s6) 0 0;padding-top:var(--s4);border-top:1px solid var(--rule-2)}
.answer .es{font-size:1.9375rem;line-height:1.3;letter-spacing:-.018em;margin:0;font-weight:400;color:var(--ink)}
.answer .note{font-size:.9375rem;line-height:1.6;color:var(--ink-2);margin:var(--s4) 0 0;max-width:38ch}
.answer .flag{font-size:.8125rem;color:var(--flag);margin-top:var(--s3);display:block}
.answer .speak{
  appearance:none;background:transparent;border:1.5px solid var(--edge);border-radius:3px;color:var(--ink);
  padding:12px 16px;min-height:48px;margin:var(--s4) 0 0;font-size:.875rem;cursor:pointer;font-family:var(--sans);
  display:inline-flex;align-items:center;gap:8px;
}
.why{margin:var(--s5) 0 0;border-top:1px solid var(--rule)}
.why .why-lbl{font-size:.8125rem;color:var(--ink-3);padding-top:var(--s3)}
.rulelink{
  appearance:none;border:0;background:none;width:100%;text-align:left;font-family:var(--sans);
  padding:14px 0;min-height:48px;color:var(--mark);font-size:.9375rem;line-height:1.5;cursor:pointer;
  border-bottom:1px solid var(--rule);display:flex;gap:var(--s2);align-items:baseline;
}
.rulelink .arrow{margin-left:auto;color:var(--ink-3)}

/* ---- rules (per-track tab) - hairline rows, same discipline as the glossary ---- */
.rules-list{margin:0}
.rule{border-bottom:1px solid var(--rule);padding:var(--s6) 0;scroll-margin-top:5rem}
.rules-list .rule:first-child{padding-top:var(--s3)}
.rules-list .rule:last-child{border-bottom:none}
.rule.highlight{background:var(--sunk);margin:0 -20px;padding:var(--s6) 20px;transition:background-color 1.6s ease 300ms}
.rule h3{margin:0 0 var(--s3);font-size:.9375rem;font-weight:600;line-height:1.4}
.rule p{margin:0 0 var(--s4);font-size:1rem;line-height:1.65;max-width:38ch;color:var(--ink)}
.rule ul{margin:0 0 var(--s4);padding:0;list-style:none}
.rule ul li{font-size:.9375rem;line-height:1.6;padding:6px 0 6px 16px;position:relative;color:var(--ink-2)}
.rule ul li::before{content:"";position:absolute;left:0;top:.85em;width:6px;height:1px;background:var(--edge)}
.rule ul li .es{color:var(--ink)}
.rule .src{font-size:.8125rem;color:var(--ink-3)}
.rule .practicebtn, .gpractice{
  appearance:none;border:0;background:none;padding:12px 0;min-height:48px;font-family:var(--sans);
  color:var(--mark);font-size:.875rem;cursor:pointer;display:block;text-align:left;
}

/* ---- sticky action bar(s) ---- */
.bar{
  position:sticky;bottom:0;background:var(--paper);
  border-top:1px solid var(--rule-2);
  padding:var(--s3) 0 calc(var(--s3) + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:var(--s3);
}
.bar.stack{flex-direction:column;align-items:stretch;gap:var(--s3)}
.bar.stack .row2{display:flex;align-items:center;gap:var(--s4)}
.btn{
  appearance:none;border:0;background:var(--ink);color:var(--paper);
  border-radius:3px;padding:15px 20px;min-height:52px;font-size:.9375rem;font-weight:600;cursor:pointer;font-family:var(--sans);
  transition:background-color .15s ease,border-color .15s ease,opacity .15s ease;
}
.btn:active{opacity:.85}
/* The reveal-answer action is a real, secondary-weight button: bordered
   like .speak/.grade below, never link-styled - both choices on the hint
   bar are buttons, just not competing filled buttons (see .bar.choice). */
.btn.secondary{
  background:transparent;color:var(--ink);border:1.5px solid var(--edge);
}
.btn.ghost{
  background:transparent;color:var(--mark);border:0;font-weight:400;padding:15px 0;min-height:52px;
  text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule-2);
}
.btn.small{padding:12px 0;min-height:48px;font-size:.875rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bar.choice{gap:var(--s2)}
.bar.choice .btn{flex:1}
.bar .textlink{
  appearance:none;border:0;background:none;padding:15px 0;min-height:48px;
  color:var(--ink-3);font-size:.875rem;cursor:pointer;font-family:var(--sans);
  text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule-2);
}
.bar.grade{gap:var(--s2)}
.bar.grade button{
  flex:1;appearance:none;background:transparent;border:1.5px solid var(--edge);color:var(--ink);
  border-radius:3px;padding:15px 10px;min-height:52px;font-size:.9375rem;font-weight:600;cursor:pointer;font-family:var(--sans);
}
.bar.grade button.no{color:var(--flag)}

/* ---- glossary ("All rules") ---- */
.gcount{font-size:.8125rem;line-height:1.5;color:var(--ink-3)}
.glosslist{margin:0}
.glossrow{border-top:1px solid var(--rule)}
.glosslist .glossrow:first-child{border-top:0}
.glosshead{
  appearance:none;border:0;background:none;width:100%;display:flex;gap:var(--s3);font-family:var(--sans);
  align-items:flex-start;padding:16px 0;min-height:48px;cursor:pointer;text-align:left;color:inherit;
}
.glosshead .num{width:1.75rem;flex:none;text-align:right;font-size:.9375rem;color:var(--ink-3);padding-top:2px}
/* No truncation here either: the full rule title wraps onto as many lines
   as it needs. */
.glosshead .t{flex:1;min-width:0;font-size:.9375rem;line-height:1.5;color:var(--ink)}
.glosshead[aria-expanded="true"] .t{font-weight:600}
.glosshead .n{flex:none;font-size:.8125rem;color:var(--ink-3);padding-top:3px;white-space:nowrap}
.glosspanel{padding:0 0 var(--s6) calc(1.75rem + var(--s3))}
.glosspanel p{margin:0 0 var(--s4);font-size:1rem;line-height:1.65;max-width:38ch;color:var(--ink)}
.glosspanel ul{margin:0 0 var(--s4);padding:0;list-style:none}
.glosspanel ul li{font-size:.9375rem;line-height:1.6;padding:6px 0 6px 16px;position:relative;color:var(--ink-2)}
.glosspanel ul li::before{content:"";position:absolute;left:0;top:.85em;width:6px;height:1px;background:var(--edge)}
.glosspanel ul li .es{color:var(--ink)}
.glosspanel .variant{border-left:1.5px solid var(--rule-2);padding:4px 0 4px var(--s3);margin:0 0 var(--s4)}
.glosspanel .variant .vlbl{font-size:.8125rem;color:var(--ink-3);margin-bottom:6px}
.glosspanel .variant p{font-size:.9375rem;line-height:1.6;color:var(--ink-2);margin:0;max-width:36ch}
.glosspanel .where{font-size:.8125rem;line-height:1.6;color:var(--ink-3);margin:0 0 var(--s3);max-width:38ch}
.practicerow{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s4);padding-top:var(--s1)}
.gpractice{padding:12px 0;min-height:48px}

/* ---- summary ---- */
.summary-line{font-size:1.375rem;line-height:1.35;font-weight:600;letter-spacing:-.012em;margin:var(--s4) 0 var(--s5)}
.summary-line .miss{color:var(--flag)}
.summary .donenote{font-size:.875rem;line-height:1.5;color:var(--ink-3);margin:0 0 var(--s4)}
.trackrow{display:flex;justify-content:space-between;font-size:.9375rem;padding:14px 0;border-top:1px solid var(--rule)}
.tracks{border-bottom:1px solid var(--rule)}
.trackrow .l{color:var(--ink-2)}

/* ---- backup ---- */
.backup-list{margin:0}
.backup-row{border-top:1px solid var(--rule);padding:var(--s5) 0}
.backup-list .backup-row:first-child{border-top:0;padding-top:var(--s3)}
.backup-row .lbl{font-size:.8125rem;color:var(--ink-3);margin-bottom:8px}
.backup-row p{margin:0 0 var(--s4);font-size:.9375rem;line-height:1.55;color:var(--ink-2);max-width:38ch}
.filerow{
  appearance:none;background:transparent;border:1.5px solid var(--edge);border-radius:3px;color:var(--ink);
  padding:12px 16px;min-height:48px;font-size:.875rem;cursor:pointer;font-family:var(--sans);
}
.radiorow{
  display:flex;align-items:flex-start;gap:var(--s2);padding:12px 0;min-height:48px;
  cursor:pointer;font-size:.9375rem;line-height:1.5;color:var(--ink);
}
.radiorow input{margin-top:.3rem;flex:none;width:1.1rem;height:1.1rem;accent-color:var(--ink)}
.radiorow b{font-weight:600}
.radiorow.confirm{color:var(--flag)}
.backup-msg{margin-top:var(--s4);padding-left:var(--s3);font-size:.9375rem;line-height:1.55;border-left:1.5px solid var(--edge);color:var(--ink)}
.backup-msg.err{border-left-color:var(--flag);color:var(--flag)}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script id="pack-data" type="application/json">__DATA_JSON__</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('pack-data').textContent);
var SPK_ICON = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="vertical-align:-2px">' +
  '<path d="M8.5 2.2 4.8 5.2H2.2v5.6h2.6l3.7 3V2.2Z" fill="currentColor"/>' +
  '<path d="M11.2 5.4a3.6 3.6 0 0 1 0 5.2M13.2 3.4a6.4 6.4 0 0 1 0 9.2" ' +
  'stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';

var pack = null, view = "home", queue = [], idx = 0, revealedSteps = 0, answerShown = false,
    grades = {}, usedHint = false, highlightRule = null, focusRuleId = null,
    homeFilter = "", homeJustEntered = false, lastRenderedView = null,
    ruleFilterId = null, ruleFilterLabel = null, lastPushedView = null, suppressPush = false,
    glossaryFilter = "", openFamily = null,
    backupMode = "merge", backupConfirmReplace = false, backupMsg = null, backupMsgKind = null;

function prefersReducedMotion(){
  try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; }
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

// Scaffolding steps are written "reasoning: spanish result" (1,384 of them).
// Honour that structure instead of flattening it: the reasoning renders in
// grey, the result in ink and lang="es". A step with no colon (or where the
// split would be meaningless) degrades safely and renders whole, in grey.
function splitStep(s){
  var i = s.lastIndexOf(': ');
  if(i === -1) return [s, null];
  return [s.slice(0, i), s.slice(i + 2)];
}
function stepHtml(s){
  var parts = splitStep(s), why = parts[0], es = parts[1];
  // "step-why", not "why" - the unscoped ".why" is a different block
  // entirely (the rule-links group after the answer) and reusing its name
  // here let that block's own border/margin bleed into every hint through
  // the cascade: an orphan hairline sitting inside the first hint's text.
  return '<li><span class="step-why">'+esc(why)+'</span>' +
    (es ? '<span class="sep">: </span><span class="es" lang="es">'+esc(es)+'</span>' : '') +
    '</li>';
}
// Examples are either a bare Spanish phrase or "spanish - english"; when a
// translation is present it's set in grey behind an em dash, the Spanish
// stays lang="es" and ink either way.
function exampleHtml(x){
  var i = x.indexOf(' - ');
  if(i === -1) return '<li><span class="es" lang="es">'+esc(x)+'</span></li>';
  return '<li><span class="es" lang="es">'+esc(x.slice(0,i))+'</span> &mdash; '+esc(x.slice(i+3))+'</li>';
}

function storeKey(){ return "lt-review:" + (pack ? pack.id : ""); }
function persist(){ try{ localStorage.setItem(storeKey(), JSON.stringify(grades)); }catch(e){} }
function restore(){ try{ var raw = localStorage.getItem(storeKey()); grades = raw ? JSON.parse(raw) : {}; }catch(e){ grades = {}; } }

function ruleById(id){
  for(var i=0;i<DATA.packs.length;i++){
    var rules = DATA.packs[i].rules;
    for(var j=0;j<rules.length;j++){ if(rules[j].id===id) return rules[j]; }
  }
  return null;
}

function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'es-ES'; u.rate = 0.85;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function on(id, fn, type){ var el = document.getElementById(id); if(el) el.addEventListener(type||'click', fn); }
function onAll(sel, fn, type){ var els = document.querySelectorAll(sel); for(var i=0;i<els.length;i++){ (function(el){ el.addEventListener(type||'click', function(ev){ fn(ev, el); }); })(els[i]); } }

/* ---------- pack progress (for home list) ---------- */
// Bug fix: this used to return null (= "no progress at all") unless at
// least one drill was graded "got" - so a track the learner had only ever
// answered "Not yet" on looked exactly like an untouched one, both for the
// home-row badge and for recap eligibility (see recapCandidatePacks below).
// That's backwards: any grade at all, "got" or "stuck", is progress: the
// gate is now "has anything been graded", while the badge itself keeps
// showing correct-count/total (success stays unmarked by design).
function packProgress(p){
  var raw; try{ raw = localStorage.getItem("lt-review:" + p.id); }catch(e){ raw = null; }
  if(!raw) return null;
  var g; try{ g = JSON.parse(raw); }catch(e){ return null; }
  var got = 0, graded = 0, total = p.drills.length;
  for(var i=0;i<p.drills.length;i++){
    var st = g[p.drills[i].id];
    if(st === "got"){ got++; graded++; }
    else if(st === "stuck"){ graded++; }
  }
  if(graded===0) return null;
  return {done:got, total:total};
}

/* ---------- "mark as done" tracking (separate from per-drill grades) ---------- */
function getDoneMap(){ try{ return JSON.parse(localStorage.getItem("lt-review-done") || "{}"); }catch(e){ return {}; } }
function setDoneMap(m){ try{ localStorage.setItem("lt-review-done", JSON.stringify(m)); }catch(e){} }
function isDone(pid){ return !!getDoneMap()[pid]; }
function setDone(pid, val){ var m = getDoneMap(); if(val){ m[pid] = true; } else { delete m[pid]; } setDoneMap(m); }

function orderedPacks(){ return DATA.packs.slice().sort(function(a,b){ return a.tracks[0]-b.tracks[0]; }); }

/* ---------- backup: export / import progress ----------
   The whole storage contract this round-trips is exactly two localStorage
   shapes (see storeKey()/persist()/restore() above and getDoneMap()/setDoneMap()):
     lt-review:<packId>  -> { "<drillId>": "got" | "stuck" }
     lt-review-done       -> { "<packId>": true }
   Everything here reads/writes only through those, never a parallel format. */

var BACKUP_SCHEMA = "lt-review-backup";
var BACKUP_VERSION = 1;
var KNOWN_PACK_IDS = null;
function knownPackIds(){
  if(!KNOWN_PACK_IDS){
    KNOWN_PACK_IDS = {};
    DATA.packs.forEach(function(p){ KNOWN_PACK_IDS[p.id] = true; });
  }
  return KNOWN_PACK_IDS;
}

function collectBackupPayload(){
  var progress = {};
  DATA.packs.forEach(function(p){
    var raw; try{ raw = localStorage.getItem("lt-review:" + p.id); }catch(e){ raw = null; }
    if(!raw) return;
    var g; try{ g = JSON.parse(raw); }catch(e){ g = null; }
    if(g && typeof g === "object" && Object.keys(g).length){ progress[p.id] = g; }
  });
  return {
    app: BACKUP_SCHEMA,
    version: BACKUP_VERSION,
    exportedAt: new Date().toISOString(),
    progress: progress,
    done: getDoneMap()
  };
}

function doExport(){
  try{
    var payload = collectBackupPayload();
    var blob = new Blob([JSON.stringify(payload, null, 2)], {type: "application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "complete-spanish-review-backup-" + payload.exportedAt.slice(0,10) + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ try{ URL.revokeObjectURL(url); }catch(e){} }, 1000);
    backupMsg = "Backup downloaded."; backupMsgKind = "ok";
  }catch(e){
    backupMsg = "Couldn't create the backup file."; backupMsgKind = "err";
  }
  render();
}

// Validates the raw parsed JSON of a backup file and returns a fully-cleaned
// {progress, done} ready to write, or {ok:false, message}. Never touches
// localStorage itself - the whole point is that a bad file is caught here,
// before anything is written, not partway through writing it.
function validateBackupPayload(obj){
  if(!obj || typeof obj !== "object" || Array.isArray(obj)){
    return {ok:false, message:"That file isn't a valid backup (not a JSON object)."};
  }
  if(obj.app !== BACKUP_SCHEMA){
    return {ok:false, message:"That file doesn't look like a Complete Spanish Review backup."};
  }
  if(obj.version !== BACKUP_VERSION){
    return {ok:false, message:"That backup was made with a version of this app this build doesn't understand."};
  }
  if(!obj.progress || typeof obj.progress !== "object" || Array.isArray(obj.progress)){
    return {ok:false, message:"That backup file is missing its progress data."};
  }
  var known = knownPackIds();
  var progress = {}, skippedPacks = 0;
  Object.keys(obj.progress).forEach(function(pid){
    if(!known[pid]){ skippedPacks++; return; } // dataset gains tracks over time; ignore what we don't recognise
    var g = obj.progress[pid];
    if(!g || typeof g !== "object" || Array.isArray(g)) return;
    var clean = {};
    Object.keys(g).forEach(function(did){
      if(g[did] === "got" || g[did] === "stuck"){ clean[did] = g[did]; }
    });
    if(Object.keys(clean).length){ progress[pid] = clean; }
  });
  var done = {};
  if(obj.done && typeof obj.done === "object" && !Array.isArray(obj.done)){
    Object.keys(obj.done).forEach(function(pid){
      if(known[pid] && obj.done[pid] === true){ done[pid] = true; }
    });
  }
  return {ok:true, progress:progress, done:done, skippedPacks:skippedPacks};
}

// Merge (the default, non-destructive choice): union everything, and where
// the same drill is graded on both sides, "got" always wins over "stuck".
// Progress only ever moves forward, so this can never erase a real result -
// it's safe to run with a stale or partial file.
function applyBackupMerge(progress, done){
  Object.keys(progress).forEach(function(pid){
    var key = "lt-review:" + pid;
    var existing; try{ existing = JSON.parse(localStorage.getItem(key) || "{}"); }catch(e){ existing = {}; }
    if(!existing || typeof existing !== "object"){ existing = {}; }
    var incoming = progress[pid];
    Object.keys(incoming).forEach(function(did){
      if(existing[did] === "got") return;
      existing[did] = incoming[did];
    });
    try{ localStorage.setItem(key, JSON.stringify(existing)); }catch(e){}
  });
  var doneMap = getDoneMap();
  Object.keys(done).forEach(function(pid){ doneMap[pid] = true; });
  setDoneMap(doneMap);
}

// Replace: the file becomes the sole source of truth for progress. Destructive
// on purpose (an older export can wipe newer real progress), so callers must
// gate this behind an explicit confirmation before ever getting here.
function applyBackupReplace(progress, done){
  DATA.packs.forEach(function(p){
    try{ localStorage.removeItem("lt-review:" + p.id); }catch(e){}
  });
  Object.keys(progress).forEach(function(pid){
    try{ localStorage.setItem("lt-review:" + pid, JSON.stringify(progress[pid])); }catch(e){}
  });
  setDoneMap(done);
}

function handleImportFile(file){
  if(!file) return;
  var mode = backupMode;
  if(mode === "replace" && !backupConfirmReplace){
    backupMsg = "Check the confirmation box before replacing existing progress. Nothing was changed.";
    backupMsgKind = "err";
    render();
    return;
  }
  var reader = new FileReader();
  reader.onload = function(){
    var parsed;
    try{ parsed = JSON.parse(String(reader.result)); }
    catch(e){
      backupMsg = "That file isn't valid JSON. Nothing was changed.";
      backupMsgKind = "err";
      finishImport();
      return;
    }
    var result = validateBackupPayload(parsed);
    if(!result.ok){
      backupMsg = result.message + " Nothing was changed.";
      backupMsgKind = "err";
      finishImport();
      return;
    }
    if(mode === "replace"){ applyBackupReplace(result.progress, result.done); }
    else { applyBackupMerge(result.progress, result.done); }

    var packCount = Object.keys(result.progress).length;
    var doneCount = Object.keys(result.done).length;
    var skipNote = result.skippedPacks ? (" (" + result.skippedPacks + " unrecognised track" + (result.skippedPacks===1?"":"s") + " skipped)") : "";
    backupMsg = (mode === "replace" ? "Replaced" : "Merged in") + " progress for " + packCount + " track" + (packCount===1?"":"s") +
      ", " + doneCount + " marked done" + skipNote + ".";
    backupMsgKind = "ok";
    backupConfirmReplace = false;
    finishImport();
  };
  reader.onerror = function(){
    backupMsg = "Couldn't read that file. Nothing was changed.";
    backupMsgKind = "err";
    finishImport();
  };
  reader.readAsText(file);
}

function finishImport(){
  render();
  // Clear the value so choosing the exact same file again still fires 'change'.
  var fi = document.getElementById('importFile'); if(fi){ fi.value = ""; }
}

function nextRecommendedTrack(){
  var packs = orderedPacks();
  var doneMap = getDoneMap();
  for(var i=0;i<packs.length;i++){ if(!doneMap[packs[i].id]) return packs[i]; }
  return null;
}

function nextPackAfter(p){
  var packs = orderedPacks();
  for(var i=0;i<packs.length;i++){ if(packs[i].id===p.id){ return packs[i+1] || null; } }
  return null;
}

/* ---------- on-demand recap ---------- */
var RECAP_SIZE = 12;

function shuffled(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}

// Tracks worth recapping: anything the learner has covered - marked done
// via the home-screen circle (which grades nothing on its own), or with at
// least one graded drill (via the packProgress fix above, "graded" means
// either "got" or "stuck", not just "got").
function recapCandidatePacks(){
  var doneMap = getDoneMap();
  return orderedPacks().filter(function(p){ return doneMap[p.id] || packProgress(p); });
}

function hasRecapMaterial(){ return recapCandidatePacks().length > 0; }

function trackGrades(p){
  try{ return JSON.parse(localStorage.getItem("lt-review:"+p.id) || "{}"); }catch(e){ return {}; }
}

// Bug fix: this used to pool ONLY drills that already carried a "got" or
// "stuck" grade. A track marked done via the home-screen circle grades
// nothing, so a learner who works through tracks and ticks them off (rather
// than grading every drill) ended up with a covered-tracks list full of
// tracks and an almost-empty grade pool - recap then drew from that
// handful forever, however high RECAP_SIZE was set.
//
// Fixed pool = every drill in every covered track, ranked:
//   1. marked "stuck"   - most worth another pass
//   2. ungraded         - covered but never actually tested; as worth
//                         recapping as a stuck one, arguably more so than
//                         one already proven "got"
//   3. marked "got"     - already demonstrated, lowest priority filler
// Each tier is shuffled before slicing so which drills fill RECAP_SIZE (and
// their order) differs run to run, and the final pick is reshuffled so the
// tiers don't run in blocks.
function startRecap(){
  var packs = recapCandidatePacks();
  var stuckPool = [], freshPool = [], gotPool = [];
  packs.forEach(function(p){
    var g = trackGrades(p);
    p.drills.forEach(function(d){
      var st = g[d.id];
      if(st==="stuck") stuckPool.push(d);
      else if(st==="got") gotPool.push(d);
      else freshPool.push(d);
    });
  });
  var picked = shuffled(stuckPool).slice(0, RECAP_SIZE);
  if(picked.length < RECAP_SIZE){
    picked = picked.concat(shuffled(freshPool).slice(0, RECAP_SIZE - picked.length));
  }
  if(picked.length < RECAP_SIZE){
    picked = picked.concat(shuffled(gotPool).slice(0, RECAP_SIZE - picked.length));
  }
  picked = shuffled(picked);

  var ruleIds = {};
  picked.forEach(function(d){ (d.rules||[]).forEach(function(rid){ ruleIds[rid]=true; }); });
  var rules = Object.keys(ruleIds).map(ruleById).filter(Boolean).sort(function(a,b){ return a.track-b.track; });

  pack = {id:"recap", label:"Recap", recap:true, drills:picked, rules:rules, tracks:[]};
  ruleFilterId = null; ruleFilterLabel = null; focusRuleId = null;
  grades = {};
  queue = picked.slice();
  idx = 0; revealedSteps = 0; answerShown = false; usedHint = false;
  view = picked.length ? "drill" : "summary";
}

/* ---------- the rule glossary ----------
   The course teaches a mechanism once and then keeps coming back to it, and
   every track that leans on an earlier rule carries its own copy of that rule
   so its Rules tab stands alone. Read flat, that's ~200 near-identical rows,
   so the glossary groups the copies by the rule's `family` and shows each
   concept once: the fullest wording any track gives it, every track it turns
   up in, and any track that words it differently rather than just longer. */
function familyOf(r){ return r.family || r.id.split('__')[1].replace(/-\d+$/, ""); }

var GLOSSARY = (function(){
  var byFamily = {}, list = [];
  orderedPacks().forEach(function(p){
    (p.rules||[]).forEach(function(r){
      var fam = familyOf(r), e = byFamily[fam];
      if(!e){ e = byFamily[fam] = {family:fam, origin:r.track, sectionIndex:p.sectionIndex, copies:[]}; list.push(e); }
      var n = 0;
      (p.drills||[]).forEach(function(d){ if((d.rules||[]).indexOf(r.id) !== -1) n++; });
      e.copies.push({packId:p.id, track:p.tracks[0], rule:r, drills:n});
      // The introducing copy is the one sitting in the track that taught it;
      // it decides which section of the course this rule belongs to.
      if(p.tracks[0] === r.track){ e.sectionIndex = p.sectionIndex; }
      if(r.track < e.origin){ e.origin = r.track; }
    });
  });
  list.forEach(function(e){
    e.copies.sort(function(a,b){ return a.track - b.track; });
    // The wording to lead with is the fullest one the course ever gives,
    // which is normally the last track to revisit it.
    var main = e.copies[0];
    e.copies.forEach(function(c){
      if(c.rule.explanation.length >= main.rule.explanation.length) main = c;
    });
    e.main = main;
    e.title = main.rule.title;
    e.totalDrills = 0;
    e.tracks = e.copies.map(function(c){ e.totalDrills += c.drills; return c.track; });
    // Only worth showing separately if a track says something the leading
    // wording doesn't already contain.
    var seen = {}, hay = [e.title, e.family];
    e.variants = [];
    e.copies.forEach(function(c){
      hay.push(c.rule.explanation);
      (c.rule.examples||[]).forEach(function(x){ hay.push(x); });
      if(c === main || seen[c.rule.explanation]) return;
      seen[c.rule.explanation] = true;
      if(main.rule.explanation.indexOf(c.rule.explanation) === -1){
        e.variants.push({track:c.track, text:c.rule.explanation});
      }
    });
    e.tracks.forEach(function(t){ hay.push("track " + t); });
    e.hay = hay.join(" \n ").toLowerCase();
  });
  list.sort(function(a,b){
    if(a.origin !== b.origin) return a.origin - b.origin;
    return a.title.localeCompare(b.title);
  });
  list.forEach(function(e, i){ e.idx = i; });
  return list;
})();

var N_RULE_CARDS = (function(){
  var n = 0;
  DATA.packs.forEach(function(p){ n += (p.rules||[]).length; });
  return n;
})();

function glossaryMatches(q){
  q = (q||"").trim().toLowerCase();
  if(!q) return GLOSSARY;
  return GLOSSARY.filter(function(e){ return e.hay.indexOf(q) !== -1; });
}

/* ---------- navigation ---------- */
function enterGlossary(prefill){
  pack = null;
  view = "glossary";
  if(typeof prefill === "string"){ glossaryFilter = prefill; openFamily = null; }
  render();
}

function enterHome(){
  pack = null; view = "home"; homeJustEntered = true; render();
}

function enterBackup(){
  pack = null; view = "backup";
  backupMode = "merge"; backupConfirmReplace = false; backupMsg = null; backupMsgKind = null;
  render();
}

function openPack(p, opts){
  pack = p;
  ruleFilterId = null; ruleFilterLabel = null;
  focusRuleId = (opts && opts.focusRuleId) || null;
  restore();
  startSession(opts);
  render();
}

// Where a plain (unfiltered) session should pick up: the first drill in the
// pool that hasn't been graded yet. Grading always happens in pool order, so
// the graded ids form a prefix of the pool and this is a genuine "stopped here".
function resumeIndex(pool){
  for(var i=0;i<pool.length;i++){ if(grades[pool[i].id]===undefined) return i; }
  return pool.length;
}

function startSession(opts){
  opts = opts || {};
  var pool = pack.drills;
  if(opts.ruleFilter){
    pool = pool.filter(function(d){ return d.rules && d.rules.indexOf(opts.ruleFilter) !== -1; });
    ruleFilterId = opts.ruleFilter;
    var r = ruleById(opts.ruleFilter);
    ruleFilterLabel = r ? r.title : opts.ruleFilter;
    idx = 0;
  } else {
    ruleFilterId = null; ruleFilterLabel = null;
    idx = opts.restart ? 0 : resumeIndex(pool);
  }
  queue = pool.slice();
  revealedSteps = 0; answerShown = false; usedHint = false;
  view = queue.length ? (idx < queue.length ? "drill" : "summary") : "rules";
}

function canGoBack(){
  if(view==="drill"){ return answerShown || revealedSteps>0 || idx>0; }
  if(view==="rules" || view==="summary"){ return true; }
  return false;
}

function goBack(){
  if(view==="drill"){
    if(answerShown){ answerShown=false; render(); return; }
    if(revealedSteps>0){ revealedSteps--; render(); return; }
    if(idx>0){ idx--; answerShown=false; revealedSteps=0; render(); return; }
    enterHome(); return;
  }
  if(view==="rules"){
    if(queue.length){ view = "drill"; render(); return; }
    enterHome(); return;
  }
  if(view==="summary"){ view="drill"; render(); return; }
  enterHome();
}

/* ---------- drill flow ---------- */
function grade(ok){
  var d = queue[idx];
  grades[d.id] = ok ? "got" : "stuck";
  persist();
  idx++;
  if(idx >= queue.length){ view="summary"; }
  else { answerShown=false; revealedSteps=0; usedHint=false; }
  render();
}

function nextStep(){
  var d = queue[idx];
  if(revealedSteps < (d.steps ? d.steps.length : 0)){ revealedSteps++; usedHint=true; render(); }
  else { answerShown = true; render(); }
}

/* ---------- rendering ---------- */
function bar(html){ return '<div class="bar" id="bar">' + html + '</div>'; }
function barStack(html){ return '<div class="bar stack" id="bar">' + html + '</div>'; }
function barGrade(html){ return '<div class="bar grade" id="bar">' + html + '</div>'; }
function barChoice(html){ return '<div class="bar choice" id="bar">' + html + '</div>'; }

// The running head is home's only persistent chrome: the app name, the
// course-wide stat, and a 3px measure line with an ink-filled segment.
function homeHeadHtml(){
  var totalPacks = DATA.packs.length;
  var doneCount = Object.keys(getDoneMap()).length;
  var pct = Math.round(doneCount/totalPacks*100);
  var stat = doneCount+' of '+totalPacks+' tracks &middot; '+pct+'%';
  return '<header><div class="head"><div class="name">Complete Spanish</div>'+
    '<div class="stat">'+stat+'</div></div>'+
    '<div class="measure" role="img" aria-label="'+esc(doneCount+' of '+totalPacks+' tracks, '+pct+' percent')+'">'+
    '<i style="width:'+pct+'%"></i></div></header>';
}

// The pack-scoped header: a single back arrow (always exits to the track
// list - the drill loop's own "take that back" link handles undoing a
// reveal, see undoLineHtml()) plus the Drills/Rules tab strip.
function packHeadHtml(){
  var drillsActive = (view==="drill" || view==="summary");
  return '<header class="topline">'+
    '<button class="back" id="topHomeBtn" aria-label="Back to the track list">&larr;</button>'+
    '<nav class="tabs">'+
    '<button id="tabDrills" aria-selected="'+drillsActive+'">Drills ('+pack.drills.length+')</button>'+
    '<button id="tabRules" aria-selected="'+(view==="rules")+'">Rules ('+pack.rules.length+')</button>'+
    '</nav></header>';
}

// The glossary/backup header: a text "back" link, a title, a one-line count.
function pageHeadHtml(title, countHtml){
  return '<header class="gh"><button class="back" id="topHomeBtn">&larr; Tracks</button>'+
    '<h1>'+title+'</h1>'+
    (countHtml ? '<div class="gcount">'+countHtml+'</div>' : '')+
    '</header>';
}

function headHtml(){
  if(view==="home") return homeHeadHtml();
  if(view==="glossary") return pageHeadHtml('All rules', GLOSSARY.length+' concepts, taught across '+N_RULE_CARDS+' rule cards in '+DATA.packs.length+' tracks');
  if(view==="backup") return pageHeadHtml('Back up progress', '');
  return packHeadHtml();
}

function packCardHtml(p){
  var prog = packProgress(p);
  var done = isDone(p.id);
  var progHtml;
  // Success is unmarked (the filled tick already said it); struggle is what
  // earns ink. A track with no drills of its own (track 1) says so instead
  // of showing a meaningless count.
  if(!p.drills.length){
    progHtml = '<span class="prog">rules only</span>';
  } else if(done){
    progHtml = '';
  } else if(prog){
    progHtml = '<span class="prog part">'+prog.done+'/'+prog.total+'</span>';
  } else {
    // Bare count: it sits under the done circle, where "how much is in here"
    // needs no unit spelled out, and the description gets the whole line.
    progHtml = '<span class="prog">'+p.drills.length+'</span>';
  }
  var rowLabel = 'Track '+p.tracks[0]+(p.blurb ? ' — '+p.blurb : '');
  return '<div class="packcard'+(done?' done':'')+'" id="pack-'+esc(p.id)+'" data-pid="'+esc(p.id)+'">' +
    '<button class="rowbtn" data-pid="'+esc(p.id)+'" aria-label="'+esc(rowLabel)+'">' +
    '<span class="num">'+p.tracks[0]+'</span>' +
    '<span class="meta"><span class="sub">'+esc(p.blurb||'')+'</span></span>' +
    '</button>' +
    '<span class="rowend">' +
    '<button class="donebtn'+(done?' on':'')+'" data-pid="'+esc(p.id)+'" aria-label="'+(done?"Mark track "+p.tracks[0]+" not done":"Mark track "+p.tracks[0]+" done")+'" aria-pressed="'+done+'"><span class="donebtn-circle"></span></button>' +
    progHtml +
    '</span>' +
    '</div>';
}

function trackRangeText(sec){ return sec.end===sec.start ? ('Track '+sec.start) : ('Tracks '+sec.start+'&ndash;'+sec.end); }

// "Where you left off" (or, once nothing is left, the all-caught-up state).
// Pulled out on its own so the done-toggle handler in wire() can refresh
// just this block without a full re-render.
function homeHeroHtml(){
  var rec = nextRecommendedTrack();
  if(rec){
    return '<div class="home-hero" id="homeHero"><div class="lbl">Where you left off</div>' +
      '<div class="t">Track '+rec.tracks[0]+'</div><p class="b">'+esc(rec.blurb||'')+'</p>' +
      '<button class="btn" id="continueCardBtn" data-pid="'+esc(rec.id)+'" aria-label="Start track '+rec.tracks[0]+'">Start</button>' +
      '</div>';
  }
  return '<div class="home-hero" id="homeHero"><div class="lbl">All caught up</div>' +
    '<div class="t">All '+DATA.packs.length+' tracks marked done</div>' +
    '<p class="b">Revisit any track below for another pass.</p></div>';
}

function renderHome(){
  var html = '<div class="searchrow"><input id="homeSearch" type="search" aria-label="Search tracks or grammar" placeholder="Search tracks and rules" value="'+esc(homeFilter)+'"></div>';

  var q = homeFilter.trim().toLowerCase();
  if(q){
    var filtered = orderedPacks().filter(function(p){
      var matchesBasic = p.label.toLowerCase().indexOf(q)!==-1 ||
        (p.blurb||'').toLowerCase().indexOf(q)!==-1 ||
        ''+p.tracks[0] === q;
      var matchesRules = false;
      if(p.rules){
        for(var ri=0;ri<p.rules.length;ri++){
          if((p.rules[ri].title||'').toLowerCase().indexOf(q)!==-1 ||
             (p.rules[ri].explanation||'').toLowerCase().indexOf(q)!==-1){
            matchesRules = true; break;
          }
        }
      }
      return matchesBasic || matchesRules;
    });
    // The track list answers "which track was that in?"; a query that hits rule
    // text usually means the learner wants the rule itself, which lives in the
    // glossary, so offer the jump instead of making them find it again there.
    var ruleHits = glossaryMatches(q).length;
    if(ruleHits){
      html += '<button class="glossjump" id="glossJumpBtn">' + ruleHits + ' rule' + (ruleHits===1?'':'s') +
        ' match in All rules <span class="arrow" aria-hidden="true">&rarr;</span></button>';
    }
    html += '<div class="packlist">' + (filtered.map(packCardHtml).join('') || '<div class="empty">No tracks match that search.</div>') + '</div>';
    html += '<div class="footlink"><button id="backupBtn">Back up or restore progress</button></div>';
    return html;
  }

  html += homeHeroHtml();

  if(hasRecapMaterial()){
    var n = recapCandidatePacks().length;
    html += '<div class="linkrow"><button class="link" id="recapBtn">Recap practice' +
      '<span class="sub">A mixed check across the '+n+' track'+(n===1?'':'s')+' you\'ve covered, weighted toward what you got stuck on.</span></button></div>';
  }

  html += '<div class="linkrow"><button class="link" id="glossaryBtn">All rules' +
    '<span class="sub">Every rule in the course, on its own and searchable.</span></button></div>';

  DATA.sections.forEach(function(sec, i){
    var secPacks = orderedPacks().filter(function(p){ return p.sectionIndex===i; });
    if(!secPacks.length) return;
    html += '<div class="section-head"><div class="r">'+trackRangeText(sec)+'</div><h3>'+esc(sec.title)+'</h3><p>'+esc(sec.focus)+'</p></div>';
    html += '<div class="packlist">' + secPacks.map(packCardHtml).join('') + '</div>';
  });

  html += '<div class="footlink"><button id="backupBtn">Back up or restore progress</button></div>';
  return html;
}

function renderBackup(){
  var html = '<p style="color:var(--ink-2);font-size:.9375rem;line-height:1.5;max-width:38ch;margin:var(--s3) 0 0">Your progress lives only in this browser. Download a backup to keep a copy, or bring progress over from another device or browser.</p>';
  html += '<div class="backup-list">';

  html += '<div class="backup-row"><div class="lbl">Export</div>' +
    '<p>Download everything you\'ve graded and marked done as one file.</p>' +
    '<button class="btn" id="exportBtn">Download a backup file</button>' +
    '</div>';

  var replaceSelected = backupMode === "replace";
  var importDisabled = replaceSelected && !backupConfirmReplace;
  html += '<div class="backup-row"><div class="lbl">Import</div>' +
    '<p>Load a backup file back in. Choose how it combines with what\'s already here:</p>' +
    '<label class="radiorow"><input type="radio" name="backupMode" value="merge" id="modeMerge" '+(backupMode==="merge"?"checked":"")+'>' +
    '<span><b>Merge</b> &mdash; keep everything on both sides; where a drill is graded on both, got always beats stuck. Never loses progress.</span></label>' +
    '<label class="radiorow"><input type="radio" name="backupMode" value="replace" id="modeReplace" '+(replaceSelected?"checked":"")+'>' +
    '<span><b>Replace</b> &mdash; wipe current progress and use only what\'s in the file.</span></label>' +
    (replaceSelected ? '<label class="radiorow confirm"><input type="checkbox" id="backupConfirm" '+(backupConfirmReplace?"checked":"")+'>' +
      '<span>I understand this replaces all current progress and can\'t be undone.</span></label>' : '') +
    '<input type="file" id="importFile" accept="application/json,.json" style="display:none">' +
    '<div style="margin-top:var(--s2)"><button class="filerow" id="importBtn"'+(importDisabled?' disabled title="Check the confirmation box first"':'')+'>Choose file&hellip;</button></div>' +
    '</div>';

  if(backupMsg){
    html += '<div class="backup-msg '+(backupMsgKind==="err"?"err":"ok")+'" role="status" aria-live="polite">' + esc(backupMsg) + '</div>';
  }

  html += '</div>';
  return html;
}

function trackListText(tracks){
  if(tracks.length===1) return 'track ' + tracks[0];
  return 'tracks ' + tracks.slice(0,-1).join(', ') + ' and ' + tracks[tracks.length-1];
}

function glossaryEntryHtml(e, i, isOpen){
  var rowId = 'gl-' + i, panelId = 'glp-' + i;
  var revisits = e.copies.filter(function(c){ return c.track !== e.origin; }).map(function(c){ return c.track; });
  var countHtml = '<span class="n">' + (revisits.length ? (revisits.length+1) + ' tracks' : 'once') + '</span>';
  var head = '<button class="glosshead" id="'+rowId+'" data-fam="'+esc(e.family)+'" aria-expanded="'+(isOpen?'true':'false')+'" aria-controls="'+panelId+'">' +
    '<span class="num">'+e.origin+'</span>' +
    '<span class="t">'+esc(e.title)+'</span>' + countHtml +
    '</button>';
  if(!isOpen) return '<div class="glossrow">' + head + '</div>';

  var r = e.main.rule;
  var body = '<p>'+esc(r.explanation)+'</p>';
  if(r.examples && r.examples.length){
    body += '<ul>' + r.examples.map(exampleHtml).join('') + '</ul>';
  }
  body += e.variants.map(function(v){
    return '<div class="variant"><div class="vlbl">Track '+v.track+' words it differently</div><p>'+esc(v.text)+'</p></div>';
  }).join('');
  body += '<div class="where">Introduced in track '+e.origin +
    (revisits.length ? ' &middot; comes back in ' + trackListText(revisits) : '') + '.</div>';

  var targets = e.copies.filter(function(c){ return c.drills > 0; });
  if(!targets.length){
    body += '<div class="where">No drills practice this one on its own.</div>';
  } else {
    body += '<div class="practicerow"><span class="where" style="margin:0;padding:10px 0">Practice it in&nbsp;</span>' +
      targets.map(function(c){
        return '<button class="gpractice" data-pid="'+esc(c.packId)+'" data-ruleid="'+esc(c.rule.id)+'">track '+c.track+'</button>';
      }).join('') + '</div>';
  }
  return '<div class="glossrow">' + head + '<div class="glosspanel" id="'+panelId+'">' + body + '</div></div>';
}

function renderGlossary(){
  var q = glossaryFilter.trim();
  var html = '<div class="searchrow"><input id="glossarySearch" type="search" aria-label="Search all rules" placeholder="Search every rule" value="'+esc(glossaryFilter)+'"></div>';

  if(q){
    var found = glossaryMatches(q);
    if(!found.length) return html + '<div class="empty">No rules match that search.</div>';
    // One hit is almost always the one you were looking for, so open it.
    var only = (found.length===1) ? found[0].family : null;
    html += '<div class="section-head" style="margin-top:0;border-top:0;padding-top:var(--s2)"><h3>'+found.length+' rule'+(found.length===1?'':'s')+' match</h3></div>';
    html += '<div class="glosslist">' + found.map(function(e){
      return glossaryEntryHtml(e, e.idx, openFamily===e.family || only===e.family);
    }).join('') + '</div>';
    return html;
  }

  DATA.sections.forEach(function(sec, si){
    var entries = GLOSSARY.filter(function(e){ return e.sectionIndex===si; });
    if(!entries.length) return;
    html += '<div class="section-head"'+(si===0?' style="margin-top:0;border-top:0;padding-top:var(--s2)"':'')+'>' +
      '<div class="r">'+trackRangeText(sec)+'</div><h3>'+esc(sec.title)+'</h3></div>';
    html += '<div class="glosslist">' + entries.map(function(e){
      return glossaryEntryHtml(e, e.idx, openFamily===e.family);
    }).join('') + '</div>';
  });
  return html;
}

// A trailing parenthetical ("...? (informal)") is an instruction about how
// to say it, not part of the sentence you have to say - broken onto its own
// line pre-reveal (CSS: .reg is display:block there) so the two never read
// as one sentence, and folded back inline once revealed (.eng.answered .reg).
// "answered" only dims the colour a shade (see .eng.answered in the CSS) -
// it never changes size or position, so revealing the answer can't move the
// prompt the learner was already reading.
function promptMarkup(text, answered){
  var m = /^([\s\S]*)\s\(([^()]+)\)$/.exec(text);
  var body = m ? m[1] : text;
  var qualifier = m ? m[2] : null;
  var regHtml = qualifier ? ' <span class="reg">('+esc(qualifier)+')</span>' : '';
  return '<div class="eng'+(answered?' answered':'')+'">'+esc(body)+regHtml+'</div>';
}

function undoLineHtml(extraStyle){
  if(!canGoBack()) return '';
  return '<div class="undo-row"'+(extraStyle?' style="'+extraStyle+'"':'')+'><button class="undo" id="undoBtn">Take that back</button></div>';
}

function renderDrill(){
  var d = queue[idx];
  if(!d){ return '<div class="empty">Nothing to practice here.</div>'; }

  // Extensions are sentences we wrote from the track's rules, not lines the
  // teacher said - mark that provenance quietly in the cue line. Track
  // drills (the recording itself) are the default and stay unmarked. Kept
  // as both .flag (the design's "statement about reliability" ink) and the
  // long-standing .src-tag hook.
  var srcTagHtml = d.source === 'extension' ? ' &middot; <span class="flag src-tag">not from the recording</span>' : '';
  var cueHtml = '<div class="cue">Track '+d.track+' &middot; drill '+(idx+1)+' of '+queue.length+srcTagHtml+'</div>';

  var bannerHtml = ruleFilterId ? ('<div class="filterbanner">Only drills for: <b>'+esc(ruleFilterLabel)+'</b> ' +
    '<button class="link-inline" id="clearRuleFilterBtn">Show all</button></div>') : '';

  // The hint stack is identical whichever state we're in - revealing the
  // answer never touches it, so it's built once and reused (see item 5:
  // nothing already on screen may move when the answer arrives).
  var stepsHtml = "";
  if(revealedSteps>0 && d.steps){
    stepsHtml = '<ul class="steps">' + d.steps.slice(0,revealedSteps).map(stepHtml).join('') + '</ul>';
  }

  if(!answerShown){
    return cueHtml + bannerHtml + promptMarkup(d.prompt, false) + stepsHtml + undoLineHtml();
  }

  // Revealing the answer adds a new block BELOW what's already on screen -
  // it does not recompose the prompt or the hints. The prompt keeps its
  // exact size and position (promptMarkup only dims its colour a shade);
  // the answer's own weight and the hairline above it (see .answer in the
  // CSS) are what make this read as an event.
  var flagHtml = (typeof d.confidence === "number" && d.confidence < 0.7) ? '<span class="flag">low-confidence guess</span>' : '';
  var noteHtml = d.note ? '<div class="note">'+esc(d.note)+'</div>' : '';
  var whyHtml = "";
  if(d.rules && d.rules.length){
    whyHtml = '<div class="why"><div class="why-lbl">Why</div>' + d.rules.map(function(rid){
      var r = ruleById(rid);
      var lbl = r ? r.title : rid;
      return '<button class="rulelink" data-ruleid="'+esc(rid)+'">'+esc(lbl)+'<span class="arrow">&rarr;</span></button>';
    }).join('') + '</div>';
  }
  return cueHtml + bannerHtml + promptMarkup(d.prompt, true) + stepsHtml +
    '<div class="answer" aria-live="polite"><div class="es" lang="es">'+esc(d.answer)+'</div>' + noteHtml + flagHtml +
    '<button class="speak" id="speakBtn">'+SPK_ICON+' Hear it</button></div>' +
    whyHtml + undoLineHtml('margin-top:var(--s4)');
}

function drillBarHtml(){
  var d = queue[idx];
  if(!d) return bar('<button class="btn" id="homeBtn">All tracks</button>');
  if(!answerShown){
    var stepsLeft = d.steps && revealedSteps < d.steps.length;
    // Both actions here are real choices, so both are real buttons - "Give
    // me a piece" is primary (filled) while hints remain, "Show the answer"
    // is secondary (bordered, not link-styled) beside it; once hints run
    // out, "Show the answer" becomes the sole, primary action.
    if(stepsLeft){
      return barChoice(
        '<button class="btn" id="nextStepBtn">Give me a piece</button>' +
        '<button class="btn secondary" id="revealBtn">Show the answer</button>'
      );
    }
    return bar('<button class="btn" id="revealBtn">Show the answer</button>');
  }
  return barGrade(
    '<button class="no" id="stuckBtn">Not yet</button>' +
    '<button id="gotBtn">Got it</button>'
  );
}

function renderRules(){
  if(!pack) return '<div class="empty">Pick a track set first.</div>';
  var rules = pack.rules.slice();
  if(!rules.length) return '<div class="empty">No rules for this filter.</div>';
  var referenced = {};
  pack.drills.forEach(function(d){ (d.rules||[]).forEach(function(rid){ referenced[rid] = true; }); });
  return '<div class="rules-list">' + rules.map(function(r){
    var exHtml = (r.examples && r.examples.length) ? '<ul>' + r.examples.map(exampleHtml).join('') + '</ul>' : '';
    var hl = (highlightRule===r.id) ? ' highlight' : '';
    var practiceBtn = referenced[r.id] ? '<button class="practicebtn" data-ruleid="'+esc(r.id)+'">Practice this rule &rarr;</button>' : '';
    return '<div class="rule'+hl+'" id="rule-'+esc(r.id)+'"><h3>'+esc(r.title)+'</h3><p>'+esc(r.explanation)+'</p>' + exHtml +
      '<div class="src">Track '+r.track+'</div>' +
      practiceBtn + '</div>';
  }).join('') + '</div>';
}

function renderSummary(){
  var built=0, stuck=0;
  var byTrack = {};
  queue.forEach(function(d){
    var ok = grades[d.id]==="got";
    if(ok) built++; else stuck++;
    byTrack[d.track] = byTrack[d.track] || {ok:0,total:0};
    byTrack[d.track].total++;
    if(ok) byTrack[d.track].ok++;
  });
  var trackKeys = Object.keys(byTrack);
  var rows = trackKeys.length > 1 ? trackKeys.sort(function(a,b){return a-b;}).map(function(t){
    var s = byTrack[t];
    return '<div class="trackrow"><span class="l">Track '+t+'</span><span>'+s.ok+'/'+s.total+'</span></div>';
  }).join('') : '';
  // The only thing on this screen you might act on is a miss, so it's the
  // only thing coloured here.
  var summaryLine = built+' of '+queue.length+' got it'+(stuck ? ', <span class="miss">'+stuck+' not yet</span>' : '')+'.';
  return '<div class="summary">' +
    '<div class="summary-line">'+summaryLine+'</div>' +
    (isDone(pack.id) ? '<p class="donenote">This track is marked done.</p>' : '') +
    (rows ? '<div class="tracks">'+rows+'</div>' : '') +
    '</div>';
}

function summaryBarHtml(){
  var stuck = queue.filter(function(d){ return grades[d.id] !== "got"; }).length;
  // "Redo the misses" is suppressed at zero misses rather than shown disabled.
  var redoHtml = stuck>0 ? '<button class="textlink" id="redoBtn">Redo the misses</button>' : '';
  var restartHtml = '<button class="textlink" id="restartBtn">Start over</button>';

  if(pack.recap){
    return barStack('<button class="btn" id="newRecapBtn">New recap</button>' +
      '<div class="row2"><button class="textlink" id="topHomeBtn2">All tracks</button></div>');
  }
  if(ruleFilterId){
    return barStack('<button class="btn" id="backToFullBtn">Back to Track '+pack.tracks[0]+'</button>' +
      '<div class="row2">'+redoHtml+restartHtml+'</div>');
  }
  var next = nextPackAfter(pack);
  if(next){
    return barStack('<button class="btn" id="continueBtn">Continue to Track '+next.tracks[0]+'</button>' +
      '<div class="row2">'+redoHtml+restartHtml+'</div>');
  }
  return barStack('<button class="btn" id="topHomeBtn2">All tracks &mdash; course complete!</button>' +
    '<div class="row2">'+redoHtml+restartHtml+'</div>');
}

function render(){
  var app = document.getElementById('app');
  var prevScrollY = window.scrollY;
  var sameView = (lastRenderedView === view);

  var active = document.activeElement;
  var activeId = (active && active.id) ? active.id : null;
  var selStart = null, selEnd = null;
  if(activeId && typeof active.selectionStart === "number"){
    selStart = active.selectionStart; selEnd = active.selectionEnd;
  }

  var html = headHtml() + '<main id="main" class="view-'+view+'">';

  if(view==="home"){
    html += renderHome();
  } else if(view==="glossary"){
    html += renderGlossary();
  } else if(view==="drill"){
    html += renderDrill();
  } else if(view==="rules"){
    html += renderRules();
  } else if(view==="summary"){
    html += renderSummary();
  } else if(view==="backup"){
    html += renderBackup();
  }
  html += '</main>';

  // The Rules tab is reached and left purely via the tab strip (plus the
  // back arrow to exit the track) - no sticky bar of its own, in keeping
  // with "no boxes, no extra chrome" once you're just reading.
  if(view==="drill") html += drillBarHtml();
  else if(view==="summary") html += summaryBarHtml();

  app.innerHTML = html;
  wire();

  if(sameView){ window.scrollTo(0, prevScrollY); }
  lastRenderedView = view;

  if(activeId){
    var newActive = document.getElementById(activeId);
    if(newActive){
      newActive.focus({preventScroll:true});
      if(selStart!=null && typeof newActive.setSelectionRange === "function"){
        try{ newActive.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }

  if(view==="rules" && highlightRule){
    var el = document.getElementById('rule-'+highlightRule);
    if(el){ el.scrollIntoView({block:"center", behavior: prefersReducedMotion() ? "auto" : "smooth"}); }
    setTimeout(function(){ highlightRule=null; }, 2000);
  }
  if(view==="home"){
    if(homeJustEntered){
      homeJustEntered = false;
      var rec = nextRecommendedTrack();
      if(rec){
        var card = document.getElementById('pack-'+rec.id);
        if(card){ card.scrollIntoView({block:"center", behavior: prefersReducedMotion() ? "auto" : "smooth"}); }
      }
    }
  }

  if(suppressPush){
    lastPushedView = view;
  } else if(lastPushedView !== view){
    try{ history.pushState({view: view, packId: pack ? pack.id : null}, ''); }catch(e){}
    lastPushedView = view;
  }
}

// Toggling "done" changes more than one class (the progress column goes
// from a count to nothing at all - see packCardHtml()), so the row and the
// "where you left off" block are re-derived and swapped in whole rather than
// patched piece by piece. wireOne() re-attaches the handful of listeners a
// freshly-inserted fragment needs, since element.replaceWith()/outerHTML
// don't carry old listeners over.
function handleDoneBtnClick(ev, el){
  ev.stopPropagation();
  var pid = el.getAttribute('data-pid');
  var p = DATA.packs.filter(function(x){ return x.id===pid; })[0];
  if(!p) return;
  setDone(pid, !isDone(pid));

  var card = el.closest('.packcard');
  if(card){
    var tmp = document.createElement('div');
    tmp.innerHTML = packCardHtml(p);
    var fresh = tmp.firstChild;
    card.replaceWith(fresh);
    wireOne(fresh);
  }

  var hero = document.getElementById('homeHero');
  if(hero){
    hero.outerHTML = homeHeroHtml();
    wireOne(document.getElementById('homeHero'));
  }
}

function handleContinueBtnClick(ev){
  var pid = ev.currentTarget.getAttribute('data-pid');
  var p = DATA.packs.filter(function(x){ return x.id===pid; })[0];
  if(p) openPack(p);
}

function wireOne(root){
  if(!root) return;
  var rb = root.querySelector('.rowbtn');
  if(rb) rb.addEventListener('click', function(){
    var p = DATA.packs.filter(function(x){ return x.id===rb.getAttribute('data-pid'); })[0];
    if(p) openPack(p);
  });
  var db = root.querySelector('.donebtn');
  if(db) db.addEventListener('click', function(ev){ handleDoneBtnClick(ev, db); });
  var cb = root.querySelector('#continueCardBtn');
  if(cb) cb.addEventListener('click', handleContinueBtnClick);
}

function wire(){
  on('undoBtn', goBack);
  on('topHomeBtn', enterHome);
  on('glossaryBtn', function(){ enterGlossary(); });
  on('glossJumpBtn', function(){ enterGlossary(homeFilter); });
  on('glossarySearch', function(ev){ glossaryFilter = ev.target.value; render(); }, 'input');
  onAll('.glosshead', function(ev, el){
    var fam = el.getAttribute('data-fam');
    openFamily = (openFamily===fam) ? null : fam;
    render();
  });
  onAll('.gpractice', function(ev, el){
    var p = DATA.packs.filter(function(x){ return x.id===el.getAttribute('data-pid'); })[0];
    if(p) openPack(p, {ruleFilter: el.getAttribute('data-ruleid')});
  });
  on('topHomeBtn2', enterHome);
  on('homeBtn', enterHome);
  on('tabDrills', function(){ view = "drill"; render(); });
  on('tabRules', function(){ view = "rules"; render(); });

  onAll('.rowbtn', function(ev, el){
    var p = DATA.packs.filter(function(x){return x.id===el.getAttribute('data-pid');})[0];
    if(p) openPack(p);
  });
  onAll('.donebtn', handleDoneBtnClick);
  on('continueCardBtn', handleContinueBtnClick);
  on('recapBtn', function(){ startRecap(); render(); });
  on('newRecapBtn', function(){ startRecap(); render(); });

  on('homeSearch', function(ev){ homeFilter = ev.target.value; render(); }, 'input');

  on('backupBtn', enterBackup);
  on('exportBtn', doExport);
  onAll('input[name="backupMode"]', function(ev, el){
    backupMode = el.value; backupConfirmReplace = false; backupMsg = null; backupMsgKind = null; render();
  }, 'change');
  on('backupConfirm', function(ev){ backupConfirmReplace = ev.target.checked; render(); }, 'change');
  on('importBtn', function(){ var el = document.getElementById('importFile'); if(el) el.click(); });
  on('importFile', function(ev){ handleImportFile(ev.target.files && ev.target.files[0]); }, 'change');

  on('nextStepBtn', nextStep);
  on('revealBtn', function(){ answerShown = true; render(); });
  on('speakBtn', function(){ var d = queue[idx]; if(d) speak(d.answer); });
  on('stuckBtn', function(){ grade(false); });
  on('gotBtn', function(){ grade(true); });

  onAll('.rulelink', function(ev, el){
    var rid = el.getAttribute('data-ruleid');
    highlightRule = rid; view = "rules"; render();
  });
  onAll('.practicebtn', function(ev, el){
    var rid = el.getAttribute('data-ruleid');
    startSession({ruleFilter: rid});
    render();
  });
  on('clearRuleFilterBtn', function(){ startSession(); render(); });
  on('backToFullBtn', function(){ startSession(); render(); });

  on('redoBtn', function(){
    queue = queue.filter(function(d){ return grades[d.id] !== "got"; });
    idx=0; answerShown=false; revealedSteps=0;
    view = queue.length ? "drill" : "summary";
    render();
  });
  on('restartBtn', function(){ startSession({restart:true}); render(); });
  on('continueBtn', function(){
    setDone(pack.id, true);
    var next = nextPackAfter(pack);
    if(next){ openPack(next); } else { enterHome(); }
  });
}

window.addEventListener('popstate', function(ev){
  if(view==="glossary" || view==="backup"){ suppressPush = true; enterHome(); suppressPush = false; return; }
  if(pack){ suppressPush = true; goBack(); suppressPush = false; }
});

render();
})();
</script>
<script>
// Installable/offline (PWA). See app/sw.tmpl.js for the update strategy -
// short version: the document is always network-first, so being installed
// never means being stuck on an old build.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("/sw.js").catch(function () {});
  });
}
</script>
