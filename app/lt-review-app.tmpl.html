<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Complete Spanish — Review</title>
<style>
:root{
  --field:#12262b; --field-deep:#0d1b1f; --field-edge:#3a6068;
  --paper:#e9e4d8; --paper-edge:#a89e86;
  --on-dark:#dbe4e1; --muted:#7b9a98; --ochre:#d0a24c;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --serif: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
  --bar:4.6rem;
  --fs-caption:.75rem; --fs-small:.85rem; --fs-body:.95rem; --fs-heading-sm:1.1rem;
  --radius-sm:.6rem; --radius-md:.8rem; --radius-lg:1rem;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.btn.primary:focus-visible{outline-color:var(--on-dark)}
.answer :focus-visible{outline-color:#241f16}
body{
  background:var(--field-deep);
  color:var(--on-dark);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
}
.app{max-width:640px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--field);}
#top{
  position:sticky;top:0;z-index:5;
  display:flex;align-items:center;gap:.6rem;
  padding:.9rem 1rem;
  background:var(--field);
  border-bottom:1px solid var(--field-edge);
}
#top h1{font-size:1rem;font-weight:600;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--on-dark)}
.iconbtn{
  appearance:none;border:1px solid var(--field-edge);background:transparent;color:var(--on-dark);
  border-radius:var(--radius-sm);padding:.7rem .8rem;font-size:var(--fs-small);cursor:pointer;font-family:var(--sans);
  display:inline-flex;align-items:center;gap:.35rem;white-space:nowrap;min-height:2.75rem;
}
.iconbtn:hover{border-color:var(--ochre);color:var(--ochre)}
.iconbtn:active{transform:translateY(1px)}
.rail{height:3px;background:var(--field-edge);position:relative;overflow:hidden}
.rail > i{position:absolute;inset:0 auto 0 0;background:var(--ochre);transition:width .25s ease}
#tabs{display:flex;gap:.4rem;padding:.6rem 1rem 0;background:var(--field)}
.tab{
  appearance:none;border:none;background:transparent;color:var(--muted);
  padding:.75rem 1rem;border-radius:var(--radius-sm) var(--radius-sm) 0 0;font-size:var(--fs-small);cursor:pointer;font-family:var(--sans);
  border-bottom:2px solid transparent;
}
.tab:hover{color:var(--on-dark)}
.tab.active{color:var(--ochre);border-bottom-color:var(--ochre)}
main{flex:1;padding:1.1rem 1rem calc(var(--bar) + 1.5rem);background:var(--field)}
.bar{
  position:sticky;bottom:0;left:0;right:0;
  display:flex;gap:.6rem;padding:.8rem 1rem calc(.8rem + env(safe-area-inset-bottom)) 1rem;
  background:linear-gradient(0deg, var(--field) 70%, transparent);
  min-height:var(--bar);align-items:center;
}
.btn{
  flex:1;appearance:none;border:1px solid var(--field-edge);background:var(--field-deep);color:var(--on-dark);
  border-radius:var(--radius-md);padding:.85rem 1rem;font-size:var(--fs-body);cursor:pointer;font-family:var(--sans);font-weight:600;
}
.btn:hover{border-color:var(--ochre)}
.btn.primary{background:var(--ochre);color:var(--field-deep);border-color:var(--ochre)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.small{flex:none;padding:.6rem .9rem;font-size:var(--fs-small);font-weight:500;min-height:2.75rem}

/* browser / home */
.home-hero{padding:.4rem 0 1.2rem}
.home-hero p{color:var(--muted);font-size:var(--fs-body);line-height:1.5;margin:0}
.packlist{display:flex;flex-direction:column;gap:.55rem}
.packcard{
  display:flex;align-items:center;gap:.7rem;
  border-bottom:1px solid var(--field-edge);
  text-align:left;color:var(--on-dark);font-family:var(--sans);
  width:100%;position:relative;
}
.packlist .packcard:last-child{border-bottom:none}
.packcard:hover{background:var(--field-deep)}
.packcard.done{opacity:.85}
.packcard.done .meta .sub{opacity:.7}
.packcard .num{
  font-family:var(--serif);font-weight:700;font-size:var(--fs-heading-sm);color:var(--ochre);
  min-width:2rem;text-align:center;
}
.packcard .meta{flex:1;min-width:0}
.packcard .meta .sub{white-space:normal;overflow-wrap:break-word;color:var(--on-dark);font-size:var(--fs-small);line-height:1.35}
.packcard .prog{font-size:var(--fs-caption);color:var(--muted);white-space:nowrap}
.packcard .prog.done{color:var(--ochre)}
.rowbtn{
  appearance:none;background:none;border:none;color:inherit;font:inherit;margin:0;
  padding:.85rem 1rem .85rem 0;
  cursor:pointer;display:flex;align-items:center;gap:.7rem;flex:1;min-width:0;text-align:left;
}
.donebtn{
  appearance:none;flex:none;width:2.75rem;height:2.75rem;border:none;background:none;
  margin-left:1rem;
  padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.donebtn-circle{
  width:1.7rem;height:1.7rem;border-radius:50%;
  border:1px solid var(--field-edge);background:transparent;color:transparent;
  font-size:.8rem;line-height:1;display:flex;align-items:center;justify-content:center;
}
.donebtn:hover .donebtn-circle{border-color:var(--ochre)}
.donebtn.on .donebtn-circle{background:var(--ochre);border-color:var(--ochre);color:var(--field-deep)}
.searchrow{margin:0 0 .9rem}
.searchrow input{
  width:100%;padding:.7rem .9rem;border-radius:var(--radius-sm);border:1px solid var(--field-edge);
  background:var(--field-deep);color:var(--on-dark);font-family:var(--sans);font-size:var(--fs-body);
}
.searchrow input::placeholder{color:var(--muted)}

.continue-card{
  display:flex;align-items:center;gap:.8rem;
  background:var(--field-deep);
  border:1px solid var(--field-edge);border-radius:var(--radius-lg);padding:1rem;margin-bottom:1.3rem;
}
.continue-card .meta{flex:1;min-width:0}
.continue-card .meta .lbl{font-weight:700;font-size:var(--fs-body);color:var(--ochre)}
.continue-card.done-all .meta .lbl{color:var(--on-dark)}
.continue-card .meta .sub{color:var(--muted);font-size:var(--fs-small);margin-top:.2rem}
.continue-card .btn{flex:none}

.section-head{margin:1.5rem 0 .6rem}
.section-head:first-of-type{margin-top:0}
.section-head h3{font-family:var(--serif);font-size:var(--fs-heading-sm);margin:0 0 .2rem;color:var(--on-dark)}
.section-head p{color:var(--muted);font-size:var(--fs-small);line-height:1.4;margin:0}

/* drill */
.filterbanner{
  display:flex;align-items:center;flex-wrap:wrap;gap:.5rem;
  background:var(--field-deep);border:1px solid var(--field-edge);border-radius:var(--radius-sm);
  padding:.5rem .7rem;margin-bottom:.7rem;font-size:var(--fs-small);color:var(--muted);
}
.filterbanner b{color:var(--on-dark)}
.filterbanner .fb-text{flex:1 1 auto;min-width:0}
.filterbanner .btn.small{margin-left:auto}
.prompt{
  background:var(--field-deep);border:1px solid var(--field-edge);border-radius:var(--radius-lg);
  padding:1.2rem 1.1rem;margin-bottom:1rem;
}
.kind{font-size:var(--fs-caption);text-transform:uppercase;letter-spacing:.06em;color:var(--ochre);font-weight:700;margin-bottom:.5rem}
.eng{font-family:var(--serif);font-size:1.25rem;line-height:1.45;color:var(--on-dark)}
.cue{color:var(--muted);font-size:var(--fs-small);margin-top:.6rem}
.steps{list-style:none;margin:1rem 0 0;padding:0;display:flex;flex-direction:column;gap:.5rem}
.steps li{
  background:var(--field);border-radius:var(--radius-sm);
  padding:.6rem .8rem;font-size:var(--fs-small);color:var(--muted);
}
.answer{
  background:var(--paper);color:#241f16;border-radius:var(--radius-lg);padding:1.2rem 1.1rem;margin-bottom:1rem;
}
.answer .es{font-family:var(--serif);font-size:1.35rem;line-height:1.4;font-weight:600}
.answer .note{margin-top:.5rem;font-size:var(--fs-small);color:#5a5346;font-style:italic}
.answer .flag{
  display:inline-block;margin-top:.6rem;font-size:var(--fs-caption);background:#f0e6c8;border:1px solid var(--paper-edge);
  border-radius:var(--radius-sm);padding:.25rem .5rem;color:#7a5a1e;
}
.answer .speak{
  margin-top:.7rem;appearance:none;border:1px solid var(--paper-edge);background:transparent;color:#4a4436;
  border-radius:var(--radius-sm);padding:.4rem .7rem;font-size:var(--fs-small);cursor:pointer;font-family:var(--sans);
  min-height:2.75rem;display:inline-flex;align-items:center;justify-content:flex-start;text-align:left;
}
.why{margin-top:.9rem;padding-top:.8rem;border-top:1px dashed var(--paper-edge)}
.why .why-lbl{font-size:var(--fs-caption);text-transform:uppercase;letter-spacing:.05em;color:#6b6248;margin-bottom:.4rem}
.rulelink{
  display:inline-flex;align-items:center;gap:.3rem;
  background:#f0e6c8;border:1px solid var(--paper-edge);border-radius:var(--radius-sm);
  padding:.35rem .6rem;font-size:var(--fs-small);color:#4a3f1e;cursor:pointer;margin:.15rem .3rem .15rem 0;font-family:var(--sans);
  min-height:2.75rem;text-align:left;justify-content:flex-start;
}
.rulelink:hover{border-color:var(--ochre)}
.rulelink .arrow{opacity:.6}

/* rules */
.rule{
  background:var(--field-deep);border:1px solid var(--field-edge);border-radius:var(--radius-lg);
  padding:1.1rem;margin-bottom:.9rem;scroll-margin-top:6rem;
}
.rule.highlight{border-color:var(--ochre)}
.rule h3{margin:0 0 .5rem;font-family:var(--serif);font-size:var(--fs-heading-sm);color:var(--on-dark)}
.rule p{margin:0 0 .6rem;font-size:var(--fs-small);line-height:1.5;color:var(--on-dark)}
.rule ul{margin:0 0 .7rem;padding-left:1.1rem}
.rule ul li{font-size:var(--fs-small);color:var(--muted);margin-bottom:.25rem}
.rule .src{font-size:var(--fs-caption);color:var(--muted)}
.rule .practicebtn, .gpractice{
  margin-top:.6rem;appearance:none;border:1px solid var(--field-edge);background:transparent;color:var(--ochre);
  border-radius:var(--radius-sm);padding:.4rem .7rem;font-size:var(--fs-small);cursor:pointer;font-family:var(--sans);
  min-height:2.75rem;display:inline-flex;align-items:center;justify-content:flex-start;text-align:left;
}
.rule .practicebtn:hover, .gpractice:hover{border-color:var(--ochre)}

/* glossary */
.glossrow{border-bottom:1px solid var(--field-edge)}
.glosslist .glossrow:last-child{border-bottom:none}
.glosshead{
  appearance:none;border:none;background:none;width:100%;
  display:flex;align-items:center;gap:.7rem;
  padding:.85rem 0;margin:0;cursor:pointer;min-height:2.75rem;
  color:var(--on-dark);font-family:var(--sans);text-align:left;
}
.glosshead:hover{background:var(--field-deep)}
.glosshead .num{
  font-family:var(--serif);font-weight:700;font-size:var(--fs-heading-sm);color:var(--ochre);
  min-width:2rem;text-align:center;
}
.glosshead .t{flex:1;min-width:0;font-size:var(--fs-small);line-height:1.35;overflow-wrap:break-word}
.glosshead .n{font-size:var(--fs-caption);color:var(--muted);white-space:nowrap}
.glosshead .chev{color:var(--muted);font-size:var(--fs-caption);width:.9rem;text-align:center;flex:none}
.glosshead[aria-expanded="true"] .t{color:var(--ochre)}
.glosspanel{padding:0 0 1.1rem 2.7rem}
.glosspanel p{margin:0 0 .6rem;font-size:var(--fs-small);line-height:1.5;color:var(--on-dark)}
.glosspanel ul{margin:0 0 .7rem;padding-left:1.1rem}
.glosspanel ul li{font-size:var(--fs-small);color:var(--muted);margin-bottom:.25rem}
.glosspanel .where{font-size:var(--fs-caption);color:var(--muted);line-height:1.5;margin-bottom:.2rem}
.glosspanel .variant{border-left:2px solid var(--field-edge);padding-left:.75rem;margin:0 0 .7rem}
.glosspanel .variant .vlbl{
  font-size:var(--fs-caption);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:.25rem;
}
.glosspanel .variant p:last-child{margin-bottom:0}
.practicerow{display:flex;flex-wrap:wrap;gap:.45rem}
.glossjump{
  appearance:none;background:none;border:none;border-bottom:1px solid var(--field-edge);
  width:100%;display:flex;align-items:center;gap:.5rem;
  padding:.85rem 0;margin:0 0 .3rem;cursor:pointer;min-height:2.75rem;
  color:var(--ochre);font-family:var(--sans);font-size:var(--fs-small);text-align:left;
}
.glossjump:hover{background:var(--field-deep)}
.glossjump .arrow{margin-left:auto;opacity:.7}

/* summary */
.summary h2{font-family:var(--serif);font-size:1.4rem;margin:.2rem 0 1rem;color:var(--on-dark)}
.summary-line{color:var(--on-dark);font-size:var(--fs-body);margin:0 0 1.2rem}
.trackrow{display:flex;justify-content:space-between;font-size:var(--fs-small);padding:.5rem 0;border-bottom:1px solid var(--field-edge)}
.trackrow .l{color:var(--muted)}

.empty{color:var(--muted);text-align:center;padding:2rem 1rem;font-size:var(--fs-body)}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script id="pack-data" type="application/json">__DATA_JSON__</script>
<script>
(function(){
"use strict";
var DATA = JSON.parse(document.getElementById('pack-data').textContent);

var pack = null, view = "home", queue = [], idx = 0, revealedSteps = 0, answerShown = false,
    grades = {}, usedHint = false, highlightRule = null, focusRuleId = null,
    homeFilter = "", homeJustEntered = false, lastRenderedView = null,
    ruleFilterId = null, ruleFilterLabel = null, lastPushedView = null, suppressPush = false,
    glossaryFilter = "", openFamily = null;

function prefersReducedMotion(){
  try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; }
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

function storeKey(){ return "lt-review:" + (pack ? pack.id : ""); }
function persist(){ try{ localStorage.setItem(storeKey(), JSON.stringify(grades)); }catch(e){} }
function restore(){ try{ var raw = localStorage.getItem(storeKey()); grades = raw ? JSON.parse(raw) : {}; }catch(e){ grades = {}; } }

function ruleById(id){
  for(var i=0;i<DATA.packs.length;i++){
    var rules = DATA.packs[i].rules;
    for(var j=0;j<rules.length;j++){ if(rules[j].id===id) return rules[j]; }
  }
  return null;
}

function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'es-ES'; u.rate = 0.85;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function on(id, fn, type){ var el = document.getElementById(id); if(el) el.addEventListener(type||'click', fn); }
function onAll(sel, fn, type){ var els = document.querySelectorAll(sel); for(var i=0;i<els.length;i++){ (function(el){ el.addEventListener(type||'click', function(ev){ fn(ev, el); }); })(els[i]); } }

/* ---------- pack progress (for home list) ---------- */
function packProgress(p){
  var raw; try{ raw = localStorage.getItem("lt-review:" + p.id); }catch(e){ raw = null; }
  if(!raw) return null;
  var g; try{ g = JSON.parse(raw); }catch(e){ return null; }
  var done = 0, total = p.drills.length;
  for(var i=0;i<p.drills.length;i++){ if(g[p.drills[i].id]==="got") done++; }
  if(done===0) return null;
  return {done:done, total:total};
}

/* ---------- "mark as done" tracking (separate from per-drill grades) ---------- */
function getDoneMap(){ try{ return JSON.parse(localStorage.getItem("lt-review-done") || "{}"); }catch(e){ return {}; } }
function setDoneMap(m){ try{ localStorage.setItem("lt-review-done", JSON.stringify(m)); }catch(e){} }
function isDone(pid){ return !!getDoneMap()[pid]; }
function setDone(pid, val){ var m = getDoneMap(); if(val){ m[pid] = true; } else { delete m[pid]; } setDoneMap(m); }

function orderedPacks(){ return DATA.packs.slice().sort(function(a,b){ return a.tracks[0]-b.tracks[0]; }); }

function nextRecommendedTrack(){
  var packs = orderedPacks();
  var doneMap = getDoneMap();
  for(var i=0;i<packs.length;i++){ if(!doneMap[packs[i].id]) return packs[i]; }
  return null;
}

function nextPackAfter(p){
  var packs = orderedPacks();
  for(var i=0;i<packs.length;i++){ if(packs[i].id===p.id){ return packs[i+1] || null; } }
  return null;
}

/* ---------- on-demand recap ---------- */
var RECAP_SIZE = 12;

function shuffled(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}

// Tracks worth recapping: anything with at least one graded drill, whether
// or not it's been marked done.
function recapCandidatePacks(){
  var doneMap = getDoneMap();
  return orderedPacks().filter(function(p){ return doneMap[p.id] || packProgress(p); });
}

function hasRecapMaterial(){ return recapCandidatePacks().length > 0; }

function startRecap(){
  var packs = recapCandidatePacks();
  var stuckPool = [], gotPool = [];
  packs.forEach(function(p){
    var g; try{ g = JSON.parse(localStorage.getItem("lt-review:"+p.id) || "{}"); }catch(e){ g = {}; }
    p.drills.forEach(function(d){
      if(g[d.id]==="stuck") stuckPool.push(d);
      else if(g[d.id]==="got") gotPool.push(d);
    });
  });
  // Weight toward the ones marked "stuck" first, fill the rest at random
  // from everything else already covered, then mix the order.
  var picked = shuffled(stuckPool).slice(0, RECAP_SIZE);
  if(picked.length < RECAP_SIZE){
    picked = picked.concat(shuffled(gotPool).slice(0, RECAP_SIZE - picked.length));
  }
  picked = shuffled(picked);

  var ruleIds = {};
  picked.forEach(function(d){ (d.rules||[]).forEach(function(rid){ ruleIds[rid]=true; }); });
  var rules = Object.keys(ruleIds).map(ruleById).filter(Boolean).sort(function(a,b){ return a.track-b.track; });

  pack = {id:"recap", label:"Recap", recap:true, drills:picked, rules:rules, tracks:[]};
  ruleFilterId = null; ruleFilterLabel = null; focusRuleId = null;
  grades = {};
  queue = picked.slice();
  idx = 0; revealedSteps = 0; answerShown = false; usedHint = false;
  view = picked.length ? "drill" : "summary";
}

/* ---------- the rule glossary ----------
   The course teaches a mechanism once and then keeps coming back to it, and
   every track that leans on an earlier rule carries its own copy of that rule
   so its Rules tab stands alone. Read flat, that's ~200 near-identical rows,
   so the glossary groups the copies by the rule's `family` and shows each
   concept once: the fullest wording any track gives it, every track it turns
   up in, and any track that words it differently rather than just longer. */
function familyOf(r){ return r.family || r.id.split('__')[1].replace(/-\d+$/, ""); }

var GLOSSARY = (function(){
  var byFamily = {}, list = [];
  orderedPacks().forEach(function(p){
    (p.rules||[]).forEach(function(r){
      var fam = familyOf(r), e = byFamily[fam];
      if(!e){ e = byFamily[fam] = {family:fam, origin:r.track, sectionIndex:p.sectionIndex, copies:[]}; list.push(e); }
      var n = 0;
      (p.drills||[]).forEach(function(d){ if((d.rules||[]).indexOf(r.id) !== -1) n++; });
      e.copies.push({packId:p.id, track:p.tracks[0], rule:r, drills:n});
      // The introducing copy is the one sitting in the track that taught it;
      // it decides which section of the course this rule belongs to.
      if(p.tracks[0] === r.track){ e.sectionIndex = p.sectionIndex; }
      if(r.track < e.origin){ e.origin = r.track; }
    });
  });
  list.forEach(function(e){
    e.copies.sort(function(a,b){ return a.track - b.track; });
    // The wording to lead with is the fullest one the course ever gives,
    // which is normally the last track to revisit it.
    var main = e.copies[0];
    e.copies.forEach(function(c){
      if(c.rule.explanation.length >= main.rule.explanation.length) main = c;
    });
    e.main = main;
    e.title = main.rule.title;
    e.totalDrills = 0;
    e.tracks = e.copies.map(function(c){ e.totalDrills += c.drills; return c.track; });
    // Only worth showing separately if a track says something the leading
    // wording doesn't already contain.
    var seen = {}, hay = [e.title, e.family];
    e.variants = [];
    e.copies.forEach(function(c){
      hay.push(c.rule.explanation);
      (c.rule.examples||[]).forEach(function(x){ hay.push(x); });
      if(c === main || seen[c.rule.explanation]) return;
      seen[c.rule.explanation] = true;
      if(main.rule.explanation.indexOf(c.rule.explanation) === -1){
        e.variants.push({track:c.track, text:c.rule.explanation});
      }
    });
    e.tracks.forEach(function(t){ hay.push("track " + t); });
    e.hay = hay.join(" \n ").toLowerCase();
  });
  list.sort(function(a,b){
    if(a.origin !== b.origin) return a.origin - b.origin;
    return a.title.localeCompare(b.title);
  });
  list.forEach(function(e, i){ e.idx = i; });
  return list;
})();

function glossaryMatches(q){
  q = (q||"").trim().toLowerCase();
  if(!q) return GLOSSARY;
  return GLOSSARY.filter(function(e){ return e.hay.indexOf(q) !== -1; });
}

/* ---------- navigation ---------- */
function enterGlossary(prefill){
  pack = null;
  view = "glossary";
  if(typeof prefill === "string"){ glossaryFilter = prefill; openFamily = null; }
  render();
}

function enterHome(){
  pack = null; view = "home"; homeJustEntered = true; render();
}

function openPack(p, opts){
  pack = p;
  ruleFilterId = null; ruleFilterLabel = null;
  focusRuleId = (opts && opts.focusRuleId) || null;
  restore();
  startSession(opts);
  render();
}

// Where a plain (unfiltered) session should pick up: the first drill in the
// pool that hasn't been graded yet. Grading always happens in pool order, so
// the graded ids form a prefix of the pool and this is a genuine "stopped here".
function resumeIndex(pool){
  for(var i=0;i<pool.length;i++){ if(grades[pool[i].id]===undefined) return i; }
  return pool.length;
}

function startSession(opts){
  opts = opts || {};
  var pool = pack.drills;
  if(opts.ruleFilter){
    pool = pool.filter(function(d){ return d.rules && d.rules.indexOf(opts.ruleFilter) !== -1; });
    ruleFilterId = opts.ruleFilter;
    var r = ruleById(opts.ruleFilter);
    ruleFilterLabel = r ? r.title : opts.ruleFilter;
    idx = 0;
  } else {
    ruleFilterId = null; ruleFilterLabel = null;
    idx = opts.restart ? 0 : resumeIndex(pool);
  }
  queue = pool.slice();
  revealedSteps = 0; answerShown = false; usedHint = false;
  view = queue.length ? (idx < queue.length ? "drill" : "summary") : "rules";
}

function canGoBack(){
  if(view==="drill"){ return answerShown || revealedSteps>0 || idx>0; }
  if(view==="rules" || view==="summary"){ return true; }
  return false;
}

function goBack(){
  if(view==="drill"){
    if(answerShown){ answerShown=false; render(); return; }
    if(revealedSteps>0){ revealedSteps--; render(); return; }
    if(idx>0){ idx--; answerShown=false; revealedSteps=0; render(); return; }
    enterHome(); return;
  }
  if(view==="rules"){
    if(queue.length){ view = "drill"; render(); return; }
    enterHome(); return;
  }
  if(view==="summary"){ view="drill"; render(); return; }
  enterHome();
}

/* ---------- drill flow ---------- */
function grade(ok){
  var d = queue[idx];
  grades[d.id] = ok ? "got" : "stuck";
  persist();
  idx++;
  if(idx >= queue.length){ view="summary"; }
  else { answerShown=false; revealedSteps=0; usedHint=false; }
  render();
}

function nextStep(){
  var d = queue[idx];
  if(revealedSteps < (d.steps ? d.steps.length : 0)){ revealedSteps++; usedHint=true; render(); }
  else { answerShown = true; render(); }
}

/* ---------- rendering ---------- */
function bar(html){ return '<div class="bar" id="bar">' + html + '</div>'; }

function topBarHtml(){
  if(view==="glossary"){
    return '<div id="top"><h1>All rules</h1>' +
      '<button class="iconbtn" id="topHomeBtn" title="Back to the track list">All tracks</button></div>';
  }
  var title = pack ? esc(pack.label) : "Complete Spanish";
  // "Back" undoes one step within the current track (a reveal, a piece, a drill).
  // "All tracks" always exits the track entirely and returns to the track list.
  var back = (pack && canGoBack()) ? '<button class="iconbtn" id="backBtn" title="Undo the last reveal">&#8630; Undo</button>' : '';
  var home = pack ? '<button class="iconbtn" id="topHomeBtn" title="Leave this track and return to the list">All tracks</button>'
                  : '<button class="iconbtn" id="glossaryBtn" title="Browse every rule in the course">All rules</button>';
  return '<div id="top">' + back + '<h1>'+title+'</h1>' + home + '</div>';
}

function railHtml(){
  if(!pack || view==="home") return '';
  var pct = queue.length ? Math.round((idx/queue.length)*100) : 0;
  if(view==="summary") pct = 100;
  return '<div class="rail"><i style="width:'+pct+'%"></i></div>';
}

function tabsHtml(){
  if(!pack) return '';
  var drillsActive = (view==="drill" || view==="summary");
  return '<div id="tabs">' +
    '<button class="tab '+(drillsActive?"active":"")+'" id="tabDrills">Drills</button>' +
    '<button class="tab '+(view==="rules"?"active":"")+'" id="tabRules">Rules</button>' +
    '</div>';
}

function packCardHtml(p){
  var prog = packProgress(p);
  var done = isDone(p.id);
  var progHtml = prog ? '<span class="prog '+(prog.done>=prog.total?"done":"")+'">'+prog.done+'/'+prog.total+'</span>' :
    (p.drills.length ? '<span class="prog">'+p.drills.length+' drills</span>' : '<span class="prog">read first</span>');
  var check = done ? '&#10003;' : '';
  var rowLabel = 'Track '+p.tracks[0]+(p.blurb ? ' — '+p.blurb : '');
  return '<div class="packcard'+(done?' done':'')+'" id="pack-'+esc(p.id)+'" data-pid="'+esc(p.id)+'">' +
    '<button class="donebtn'+(done?' on':'')+'" data-pid="'+esc(p.id)+'" title="'+(done?"Mark not done":"Mark track as done")+'" aria-pressed="'+done+'"><span class="donebtn-circle">'+check+'</span></button>' +
    '<button class="rowbtn" data-pid="'+esc(p.id)+'" aria-label="'+esc(rowLabel)+'">' +
    '<div class="num">'+p.tracks[0]+'</div>' +
    '<div class="meta"><div class="sub">'+esc(p.blurb||'')+'</div></div>' +
    progHtml +
    '</button>' +
    '</div>';
}

function continueCardHtml(p){
  var rowLabel = 'Continue, Track '+p.tracks[0]+(p.blurb ? ' — '+p.blurb : '');
  return '<div class="continue-card" id="continueCard">' +
    '<div class="meta"><div class="lbl">Continue &middot; Track '+p.tracks[0]+'</div><div class="sub">'+esc(p.blurb||'')+'</div></div>' +
    '<button class="btn primary small" id="continueCardBtn" data-pid="'+esc(p.id)+'" aria-label="'+esc(rowLabel)+'">Start &rarr;</button>' +
    '</div>';
}

function renderHome(){
  var totalPacks = DATA.packs.length;
  var doneCount = Object.keys(getDoneMap()).length;
  var donePercent = Math.round(doneCount/totalPacks*100);
  var html = '<div class="home-hero"><p>'+doneCount+' of '+totalPacks+' tracks done &middot; '+donePercent+'%</p></div>';
  html += '<div class="searchrow"><input id="homeSearch" type="search" aria-label="Search tracks or grammar" placeholder="Search tracks or grammar&hellip;" value="'+esc(homeFilter)+'"></div>';

  var q = homeFilter.trim().toLowerCase();
  if(q){
    var filtered = orderedPacks().filter(function(p){
      var matchesBasic = p.label.toLowerCase().indexOf(q)!==-1 ||
        (p.blurb||'').toLowerCase().indexOf(q)!==-1 ||
        ''+p.tracks[0] === q;
      var matchesRules = false;
      if(p.rules){
        for(var ri=0;ri<p.rules.length;ri++){
          if((p.rules[ri].title||'').toLowerCase().indexOf(q)!==-1 ||
             (p.rules[ri].explanation||'').toLowerCase().indexOf(q)!==-1){
            matchesRules = true; break;
          }
        }
      }
      return matchesBasic || matchesRules;
    });
    // The track list answers "which track was that in?"; a query that hits rule
    // text usually means the learner wants the rule itself, which lives in the
    // glossary, so offer the jump instead of making them find it again there.
    var ruleHits = glossaryMatches(q).length;
    if(ruleHits){
      html += '<button class="glossjump" id="glossJumpBtn">' + ruleHits + ' rule' + (ruleHits===1?'':'s') +
        ' match in All rules <span class="arrow" aria-hidden="true">&rarr;</span></button>';
    }
    html += '<div class="packlist">' + (filtered.map(packCardHtml).join('') || '<div class="empty">No tracks match that search.</div>') + '</div>';
    return html;
  }

  var rec = nextRecommendedTrack();
  if(rec){
    html += continueCardHtml(rec);
  } else {
    html += '<div class="continue-card done-all"><div class="meta"><div class="lbl">All '+totalPacks+' tracks marked done</div><div class="sub">Revisit any track below for another pass.</div></div></div>';
  }

  if(hasRecapMaterial()){
    var n = recapCandidatePacks().length;
    html += '<div class="continue-card" id="recapCard"><div class="meta"><div class="lbl">Recap practice</div><div class="sub">A mixed, on-demand check across the '+n+' track'+(n===1?'':'s')+' you\'ve covered &mdash; weighted toward what you got stuck on.</div></div>' +
      '<button class="btn ghost small" id="recapBtn">Start &rarr;</button></div>';
  }

  DATA.sections.forEach(function(sec, i){
    var secPacks = orderedPacks().filter(function(p){ return p.sectionIndex===i; });
    if(!secPacks.length) return;
    var doneMap = getDoneMap();
    var secDone = secPacks.filter(function(p){ return doneMap[p.id]; }).length;
    var secTotal = secPacks.length;
    html += '<div class="section-head"><h3>'+esc(sec.title)+' <span style="font-size:var(--fs-caption);color:var(--muted);font-weight:400">'+secDone+'/'+secTotal+'</span></h3><p>'+esc(sec.focus)+'</p></div>';
    html += '<div class="packlist">' + secPacks.map(packCardHtml).join('') + '</div>';
  });

  return html;
}

function trackListText(tracks){
  if(tracks.length===1) return 'track ' + tracks[0];
  return 'tracks ' + tracks.slice(0,-1).join(', ') + ' and ' + tracks[tracks.length-1];
}

function glossaryEntryHtml(e, i, isOpen){
  var rowId = 'gl-' + i, panelId = 'glp-' + i;
  var revisits = e.copies.filter(function(c){ return c.track !== e.origin; }).map(function(c){ return c.track; });
  var countHtml = revisits.length ? '<span class="n">' + (revisits.length+1) + ' tracks</span>' : '';
  var head = '<button class="glosshead" id="'+rowId+'" data-fam="'+esc(e.family)+'" aria-expanded="'+(isOpen?'true':'false')+'" aria-controls="'+panelId+'">' +
    '<span class="num">'+e.origin+'</span>' +
    '<span class="t">'+esc(e.title)+'</span>' + countHtml +
    '<span class="chev" aria-hidden="true">'+(isOpen?'&#9662;':'&#9656;')+'</span>' +
    '</button>';
  if(!isOpen) return '<div class="glossrow">' + head + '</div>';

  var r = e.main.rule;
  var body = '<p>'+esc(r.explanation)+'</p>';
  if(r.examples && r.examples.length){
    body += '<ul>' + r.examples.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('') + '</ul>';
  }
  body += e.variants.map(function(v){
    return '<div class="variant"><div class="vlbl">Track '+v.track+' puts it this way</div><p>'+esc(v.text)+'</p></div>';
  }).join('');
  body += '<div class="where">Introduced in track '+e.origin +
    (revisits.length ? ' &middot; comes back in ' + trackListText(revisits) : '') + '.</div>';

  var targets = e.copies.filter(function(c){ return c.drills > 0; });
  if(!targets.length){
    body += '<div class="where">No drills practise this one on its own.</div>';
  } else if(targets.length===1){
    body += '<div class="practicerow"><button class="gpractice" data-pid="'+esc(targets[0].packId)+'" data-ruleid="'+esc(targets[0].rule.id)+'">' +
      'Practise this rule, track '+targets[0].track+' &rarr;</button></div>';
  } else {
    body += '<div class="where">Practise it with the drills from:</div>' +
      '<div class="practicerow">' + targets.map(function(c){
        return '<button class="gpractice" data-pid="'+esc(c.packId)+'" data-ruleid="'+esc(c.rule.id)+'">' +
          'Track '+c.track+' &middot; '+c.drills+' &rarr;</button>';
      }).join('') + '</div>';
  }
  return '<div class="glossrow">' + head + '<div class="glosspanel" id="'+panelId+'">' + body + '</div></div>';
}

function renderGlossary(){
  var q = glossaryFilter.trim();
  var html = '<div class="home-hero"><p>' + GLOSSARY.length + ' rules across the whole course. A rule the course comes back to is listed once here, under the track that first taught it.</p></div>';
  html += '<div class="searchrow"><input id="glossarySearch" type="search" aria-label="Search all rules" placeholder="Search rules&hellip;" value="'+esc(glossaryFilter)+'"></div>';

  if(q){
    var found = glossaryMatches(q);
    if(!found.length) return html + '<div class="empty">No rules match that search.</div>';
    // One hit is almost always the one you were looking for, so open it.
    var only = (found.length===1) ? found[0].family : null;
    html += '<div class="section-head"><h3>'+found.length+' rule'+(found.length===1?'':'s')+' match</h3></div>';
    html += '<div class="glosslist">' + found.map(function(e){
      return glossaryEntryHtml(e, e.idx, openFamily===e.family || only===e.family);
    }).join('') + '</div>';
    return html;
  }

  DATA.sections.forEach(function(sec, si){
    var entries = GLOSSARY.filter(function(e){ return e.sectionIndex===si; });
    if(!entries.length) return;
    html += '<div class="section-head"><h3>'+esc(sec.title)+' <span style="font-size:var(--fs-caption);color:var(--muted);font-weight:400">'+entries.length+'</span></h3>' +
      '<p>' + (sec.end!==sec.start ? 'Tracks '+sec.start+'&ndash;'+sec.end : 'Track '+sec.start) + '</p></div>';
    html += '<div class="glosslist">' + entries.map(function(e){
      return glossaryEntryHtml(e, e.idx, openFamily===e.family);
    }).join('') + '</div>';
  });
  return html;
}

function renderDrill(){
  var d = queue[idx];
  if(!d){ return '<div class="empty">Nothing to practice here.</div>'; }
  var kindLbl = d.type==="forge" ? "Forge it" : "Build it";
  var stepsHtml = "";
  if(revealedSteps>0 && d.steps){
    stepsHtml = '<ul class="steps">' + d.steps.slice(0,revealedSteps).map(function(s){ return '<li>'+esc(s)+'</li>'; }).join('') + '</ul>';
  }
  var pieceWord = queue.length===1 ? 'piece' : 'pieces';
  var bannerHtml = ruleFilterId ? ('<div class="filterbanner"><span class="fb-text">Practicing: <b>'+esc(ruleFilterLabel)+'</b> &middot; '+queue.length+' '+pieceWord+'</span> <button class="btn small ghost" id="clearRuleFilterBtn">Show all pieces</button></div>') : '';
  var promptHtml = bannerHtml + '<div class="prompt"><div class="kind">'+kindLbl+'</div><div class="eng">'+esc(d.prompt)+'</div>' +
    '<div class="cue">Track '+d.track+' &middot; piece '+(idx+1)+' of '+queue.length+'</div>' +
    stepsHtml + '</div>';

  var answerHtml = "";
  if(answerShown){
    var flagHtml = (typeof d.confidence === "number" && d.confidence < 0.7) ? '<span class="flag">low-confidence guess</span>' : '';
    var noteHtml = d.note ? '<div class="note">'+esc(d.note)+'</div>' : '';
    var whyHtml = "";
    if(d.rules && d.rules.length){
      whyHtml = '<div class="why"><div class="why-lbl">Why</div>' + d.rules.map(function(rid){
        var r = ruleById(rid);
        var lbl = r ? r.title : rid;
        return '<button class="rulelink" data-ruleid="'+esc(rid)+'">'+esc(lbl)+' <span class="arrow">&rarr;</span></button>';
      }).join('') + '</div>';
    }
    answerHtml = '<div class="answer" aria-live="polite"><div class="es" lang="es">'+esc(d.answer)+'</div>' + noteHtml + flagHtml +
      '<div><button class="speak" id="speakBtn">Hear it</button></div>' + whyHtml + '</div>';
  }
  return promptHtml + answerHtml;
}

function drillBarHtml(){
  var d = queue[idx];
  if(!d) return bar('<button class="btn primary" id="homeBtn">All tracks</button>');
  if(!answerShown){
    var stepsLeft = d.steps && revealedSteps < d.steps.length;
    var stepBtn = stepsLeft ? '<button class="btn ghost small" id="nextStepBtn">'+(revealedSteps>0?"Next piece":"Give me a piece")+'</button>' : '';
    return bar(
      stepBtn +
      '<button class="btn primary" id="revealBtn">Show the answer</button>'
    );
  }
  return bar(
    '<button class="btn ghost" id="stuckBtn">Not yet</button>' +
    '<button class="btn primary" id="gotBtn">Got it</button>'
  );
}

function renderRules(){
  if(!pack) return '<div class="empty">Pick a track set first.</div>';
  var rules = pack.rules.slice();
  if(!rules.length) return '<div class="empty">No rules for this filter.</div>';
  var referenced = {};
  pack.drills.forEach(function(d){ (d.rules||[]).forEach(function(rid){ referenced[rid] = true; }); });
  return rules.map(function(r){
    var exHtml = (r.examples && r.examples.length) ? '<ul>' + r.examples.map(function(e){ return '<li>'+esc(e)+'</li>'; }).join('') + '</ul>' : '';
    var hl = (highlightRule===r.id) ? ' highlight' : '';
    var practiceBtn = referenced[r.id] ? '<button class="practicebtn" data-ruleid="'+esc(r.id)+'">Practice this rule &rarr;</button>' : '';
    return '<div class="rule'+hl+'" id="rule-'+esc(r.id)+'"><h3>'+esc(r.title)+'</h3><p>'+esc(r.explanation)+'</p>' + exHtml +
      '<div class="src">Track '+r.track+'</div>' +
      practiceBtn + '</div>';
  }).join('');
}

function renderSummary(){
  var built=0, stuck=0;
  var byTrack = {};
  queue.forEach(function(d){
    var ok = grades[d.id]==="got";
    if(ok) built++; else stuck++;
    byTrack[d.track] = byTrack[d.track] || {ok:0,total:0};
    byTrack[d.track].total++;
    if(ok) byTrack[d.track].ok++;
  });
  var trackKeys = Object.keys(byTrack);
  var rows = trackKeys.length > 1 ? trackKeys.sort(function(a,b){return a-b;}).map(function(t){
    var s = byTrack[t];
    return '<div class="trackrow"><span class="l">Track '+t+'</span><span>'+s.ok+'/'+s.total+'</span></div>';
  }).join('') : '';
  var summaryLine = 'Built '+built+' of '+queue.length+(stuck ? ', '+stuck+' still stuck' : '')+'.';
  return '<div class="summary"><h2>Session complete</h2>' +
    '<p class="summary-line">'+summaryLine+'</p>' +
    (rows ? '<div class="tracks">'+rows+'</div>' : '') +
    '<div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:1.2rem">' +
    (isDone(pack.id) ? '<div style="font-size:var(--fs-small);color:var(--muted)">This track is marked done</div>' : '') +
    (stuck > 0 ? '<button class="btn small ghost" id="redoBtn">Redo the misses</button>' : '') +
    '<button class="btn small ghost" id="restartBtn">Start over</button>' +
    '</div>' +
    '</div>';
}

function summaryBarHtml(){
  if(pack.recap){
    return bar('<button class="btn ghost" id="topHomeBtn2">All tracks</button><button class="btn primary" id="newRecapBtn">New recap &rarr;</button>');
  }
  if(ruleFilterId){
    return bar('<button class="btn primary" id="backToFullBtn">Back to Track '+pack.tracks[0]+'</button>');
  }
  var next = nextPackAfter(pack);
  if(next){
    return bar('<button class="btn primary" id="continueBtn">Continue to Track '+next.tracks[0]+' &rarr;</button>');
  }
  return bar('<button class="btn primary" id="topHomeBtn2">All tracks &mdash; course complete!</button>');
}

function rulesBarHtml(){
  var label = queue.length ? "Back to drills" : "All tracks";
  return bar('<button class="btn primary" id="backToDrillsBtn">'+label+'</button>');
}

function render(){
  var app = document.getElementById('app');
  var prevScrollY = window.scrollY;
  var sameView = (lastRenderedView === view);

  var active = document.activeElement;
  var activeId = (active && active.id) ? active.id : null;
  var selStart = null, selEnd = null;
  if(activeId && typeof active.selectionStart === "number"){
    selStart = active.selectionStart; selEnd = active.selectionEnd;
  }

  var html = topBarHtml() + railHtml() + tabsHtml() + '<main id="main">';

  if(view==="home"){
    html += renderHome();
  } else if(view==="glossary"){
    html += renderGlossary();
  } else if(view==="drill"){
    html += renderDrill();
  } else if(view==="rules"){
    html += renderRules();
  } else if(view==="summary"){
    html += renderSummary();
  }
  html += '</main>';

  if(view==="drill") html += drillBarHtml();
  else if(view==="rules") html += rulesBarHtml();
  else if(view==="summary") html += summaryBarHtml();

  app.innerHTML = html;
  wire();

  if(sameView){ window.scrollTo(0, prevScrollY); }
  lastRenderedView = view;

  if(activeId){
    var newActive = document.getElementById(activeId);
    if(newActive){
      newActive.focus({preventScroll:true});
      if(selStart!=null && typeof newActive.setSelectionRange === "function"){
        try{ newActive.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }

  if(view==="rules" && highlightRule){
    var el = document.getElementById('rule-'+highlightRule);
    if(el){ el.scrollIntoView({block:"center", behavior: prefersReducedMotion() ? "auto" : "smooth"}); }
    setTimeout(function(){ highlightRule=null; }, 1600);
  }
  if(view==="home"){
    if(homeJustEntered){
      homeJustEntered = false;
      var rec = nextRecommendedTrack();
      if(rec){
        var card = document.getElementById('pack-'+rec.id);
        if(card){ card.scrollIntoView({block:"center", behavior: prefersReducedMotion() ? "auto" : "smooth"}); }
      }
    }
  }

  if(suppressPush){
    lastPushedView = view;
  } else if(lastPushedView !== view){
    try{ history.pushState({view: view, packId: pack ? pack.id : null}, ''); }catch(e){}
    lastPushedView = view;
  }
}

function wire(){
  on('backBtn', goBack);
  on('topHomeBtn', enterHome);
  on('glossaryBtn', function(){ enterGlossary(); });
  on('glossJumpBtn', function(){ enterGlossary(homeFilter); });
  on('glossarySearch', function(ev){ glossaryFilter = ev.target.value; render(); }, 'input');
  onAll('.glosshead', function(ev, el){
    var fam = el.getAttribute('data-fam');
    openFamily = (openFamily===fam) ? null : fam;
    render();
  });
  onAll('.gpractice', function(ev, el){
    var p = DATA.packs.filter(function(x){ return x.id===el.getAttribute('data-pid'); })[0];
    if(p) openPack(p, {ruleFilter: el.getAttribute('data-ruleid')});
  });
  on('topHomeBtn2', enterHome);
  on('homeBtn', enterHome);
  on('tabDrills', function(){ view = "drill"; render(); });
  on('tabRules', function(){ view = "rules"; render(); });

  onAll('.rowbtn', function(ev, el){
    var p = DATA.packs.filter(function(x){return x.id===el.getAttribute('data-pid');})[0];
    if(p) openPack(p);
  });
  onAll('.donebtn', function(ev, el){
    ev.stopPropagation();
    var pid = el.getAttribute('data-pid');
    var nowDone = !isDone(pid);
    setDone(pid, nowDone);

    var circle = el.querySelector('.donebtn-circle');
    el.classList.toggle('on', nowDone);
    el.setAttribute('aria-pressed', nowDone);
    el.setAttribute('title', nowDone ? 'Mark not done' : 'Mark track as done');
    if(circle) circle.innerHTML = nowDone ? '&#10003;' : '';
    var card = el.closest('.packcard');
    if(card) card.classList.toggle('done', nowDone);

    var rec = nextRecommendedTrack();
    var newContinueHtml = rec ? continueCardHtml(rec) :
      '<div class="continue-card done-all" id="continueCard"><div class="meta"><div class="lbl">All '+DATA.packs.length+' tracks marked done</div><div class="sub">Revisit any track below for another pass.</div></div></div>';
    var existingContinue = document.getElementById('continueCard');
    if(existingContinue){ existingContinue.outerHTML = newContinueHtml; }
  });
  on('continueCardBtn', function(ev){
    var pid = ev.target.getAttribute('data-pid');
    var p = DATA.packs.filter(function(x){return x.id===pid;})[0];
    if(p) openPack(p);
  });
  on('recapBtn', function(){ startRecap(); render(); });
  on('newRecapBtn', function(){ startRecap(); render(); });

  on('homeSearch', function(ev){ homeFilter = ev.target.value; render(); }, 'input');

  on('nextStepBtn', nextStep);
  on('revealBtn', function(){ answerShown = true; render(); });
  on('speakBtn', function(){ var d = queue[idx]; if(d) speak(d.answer); });
  on('stuckBtn', function(){ grade(false); });
  on('gotBtn', function(){ grade(true); });

  onAll('.rulelink', function(ev, el){
    var rid = el.getAttribute('data-ruleid');
    highlightRule = rid; view = "rules"; render();
  });
  onAll('.practicebtn', function(ev, el){
    var rid = el.getAttribute('data-ruleid');
    startSession({ruleFilter: rid});
    render();
  });
  on('clearRuleFilterBtn', function(){ startSession(); render(); });
  on('backToFullBtn', function(){ startSession(); render(); });

  on('redoBtn', function(){
    queue = queue.filter(function(d){ return grades[d.id] !== "got"; });
    idx=0; answerShown=false; revealedSteps=0;
    view = queue.length ? "drill" : "summary";
    render();
  });
  on('restartBtn', function(){ startSession({restart:true}); render(); });
  on('continueBtn', function(){
    setDone(pack.id, true);
    var next = nextPackAfter(pack);
    if(next){ openPack(next); } else { enterHome(); }
  });
  on('backToDrillsBtn', function(){ if(queue.length){ view="drill"; render(); } else { enterHome(); } });
}

window.addEventListener('popstate', function(ev){
  if(view==="glossary"){ suppressPush = true; enterHome(); suppressPush = false; return; }
  if(pack){ suppressPush = true; goBack(); suppressPush = false; }
});

render();
})();
</script>
</body>
</html>
